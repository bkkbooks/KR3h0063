目前而劉曰前悞入仙山也咏吟不已于是强余摸寫余亦勉塗黄冠道人冷謙作倂題於硃砂菴下有冷謙之印一印前有竹齋一印左方上劉基題云茅簷無事日長閒中有山人不記年觀瀑已知秋雨過聴松欲拂夏雲還餐霞擬似神仙舉種竹情同君子堅莫問朝來新厯日桃花紅近野橋邊青田劉基題前有張居正贊云斯畫斯題我亦神馳欽哉敬哉二大仙師萬厯四年春後學張居正贊左方下有孫承澤一印軸髙二尺六寸三分廣一尺二寸八分明徐賁蜀山圖一軸上等閏一宋箋本墨畫欵題云齋房窅窕亂㝠空流雲啼鳥路西東薜蘿烟杳青林入菱荷雨滿碧谿通穠花芳月時時有花月尊中常泛酒蜀山苕水近相連南風蕩漾木蘭􅊑閒陪釣侣蘆洲外偶值樵童松障前樵童釣侣行相識吳語蠻歌自朝夕夢魂不解齊門竽懷抱都隨謝家屐山中風景獨君知結隣誰肯作幽期淮南桂樹秋揺落更為重吟招隠詩吕山人自吳來訪余蜀山中登臨燕賞遂留數日孤琴野艇倐然告歸因畫一紙以贈并詩以道山居之樂蓋將以邀吾山人卜隣爾噫余今因畫賦詩君歸而觀此必旋能因詩而念我山居也棲霞憩月當翹首以待徐賁下有徐賁一印左方下有徐賁幼文一印又一印不可識又張羽題云住近百花洲羣峰蘸碧流山忩能幾尺容得許多秋志學山人與余别甚久一日訪余上林出示此圖因題其上張羽又宋克記語云洪武辛亥元夕鶴瓢山房展觀宋克又記語云甲午懶逸張孝思藏觀軸髙二尺六分廣八寸四分明王紱草亭烟樹圖一軸上等餘一素箋本墨畫欵題云溪水涵秋鶴影孤草亭雲冷樹糢糊相看未遂還山約空復年來寫畫圖毘陵王紱寫并題下有孟端㳺戯翰墨二印前有友石生一印上方韓奕題云横空㣲雲淡初卷茫茫蒼烟隔層巘逺壑清風拂樹來烟鬛梢梢總如剪草亭幽寂傍山岡久坐令人意兩忘忽驚啼鳥翠㣲裏催我佳句投奚囊人生樂事知多少猶有吟情超世表為寫詞源浥畫圖晴壁髙堂楚山曉安陽韓奕又俞行之題云雨過亂泉流風聲滿樹頭山亭如斗大容得許多秋晴江俞行之題又王達善題云清霜入林楓葉赤寂寂茅亭枕溪碧千尺孤峰倚絳霄俯仰乾坤秋一色髙懷本與山水同閒踪得伴漁樵翁縱談不及世塵事笑指天外南飛鴻披圖景象看如此雙目頓令清似水欲憑粉墨寫蓬瀛更拂溪藤尋畫史翰林王達善又王汝玉題云不到草亭今十年重來風景只依然天恩倘賜懸車日擬向溪頭泊釣􅊑蜀人王汝玉又梁用行題云鶴鳴風起樹颼颼細草如烟翠欲流最喜晩來亭上坐一天涼露桂花秋梁用行左方上有丹誠一印下有琴書堂都尉耿信公書畫之章二印又下有也園索氏收藏書畫耿㑹侯鑒定書畫之章二印右方下有真賞珍秘宜爾子孫公字信公珍賞諸印押縫有阿爾喜普之印樂葊二印軸髙三尺一寸五分廣一尺一寸按韓奕題句與馬文璧山水畫軸同俱非贋作葢一詩兩書之也明王紱淇渭圖一軸上等餘二宋箋本墨畫欵云孟端為用之寫下有孟端印一下有梁潜跋云此無錫山人王孟端作以貺予片楮中見此短梢而烟雲千畆之勢如在渭川淇園也予愛其筆力得之偶然舉以奉舅氏仲亨先生而書以識之未署名下有梁潜用之二印軸髙二尺四寸四分廣一尺七分明王紱勘書圖一軸上等餘三宋箋本墨畫欵署孟端下有孟端中書舍人之印二印上方王達題云九龍山下憶陪逰一别俄驚幾度秋惆悵仙魂乘鶴去披圖令我不勝愁耐軒居士王達又上有魏驥題云中書畫學士詩二絶妙奪天下竒上人得之為至寶焚香相對無厭時我憶二公之丰姿已矣已久長相思畫兮詩兮天地間聲名嬴得人人知南齋老人蕭山魏驥題左方下有植庭清玩東平梁氏居易軒圖集三印右方下有朱之赤圖書記一印左邊幅有長白索氏珍藏圖書印也園珍賞二印軸髙三尺七寸三分廣一尺二寸五分明王紱獨樹圖一軸上等餘四素箋本墨畫欵題云偃然如葢翠生烟錯節盤根石共堅自信非才難適用不妨風雨自年年永樂甲申長至前一日九龍山人王孟端寫於沈翰林之自樂軒下有孟端㳺戯翰墨二印前有友石生一印右方上題句云托根蒼崖巔枝葉恒自茂雖無匠石顧地産亦良厚矧兹霜霰餘挺若孤松秀相對澹忘言雲生在忩岫欵署履素生又真賞九如清玩二印下有珍秘宜爾子孫漢水耿㑹侯書畫之章諸印左方上有丹誠一印下有琴書堂都尉耿信公書畫之章二印又下有公字信公珍賞二印押縫有阿爾喜普之印東平二印右邊幅有長白索氏珍藏圖書印也園珍賞二印軸髙三尺五寸五分廣一尺二寸一分明商喜戯貓圖一軸上等成一素箋本著色畫欵署蓮州上鈐商養性寫一印軸髙一尺五寸廣二尺五分明戴進聴泉圖一軸上等歳一素箋本墨畫欵署戴進下有錢塘戴氏文進二印軸髙二尺八寸三分廣一尺三寸九分明陳憲章萬玉圖一軸上等律一素絹本墨畫梅花右方中𨽻書署萬玉圖三字欵識云正統二年夏陳憲章寫奉婁東景暉清玩下三印俱漫漶不可識軸髙三尺四寸六分廣一尺七寸八分明沈周杏林書館圖一軸上等吕一宋箋本墨畫欵云杏林書館沈周寫下有沈啟南氏一印上方徐源書賦并序云杏林書館圖沈石田所作也郡庠葛君行簡以貽醫師公尚陳先生其曰吾二子在襁褓時多疾幾不免賴其劑而全矣渠今感徳無以已也用此圖畫與此辭賦所以報焉者亦有既矣賦云我懷想夫至人兮願日􅀢而無由匪闗梁之不通兮重道里之阻修集衆英之羅蒔兮培異種而幽生陽發坤以房斂兮隂躋乾而花明方晝夜而􅀢炊兮乃瀹烝其柢根看不疑於櫑具兮逢王傅于殿門辭嘉恵而肥遯兮謂索餐而忸怩以廬山之屛矗兮終吾生以棲遲同匡谷而厞隠兮與樂天而偃仰示叔謙以伐木兮授長房以竹杖仰