  text: 欽定四庫全書石渠寶笈卷十七
  hash: sha256:bb2b8f400b0e8b3258cb76697a51b743f3f14666c4c2a97b6d893ebfa47e5bff
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_037-1a, image: WYG0824/WYG0824-0496c.png}
body:
  text: 貯養心殿八列朝人書軸上等明董其昌書劉禹錫謝春衣表一軸上等天一宣徳泥金箋本楷書欵署其昌下有宗伯學士董氏元宰二印右方上有誠府珍玩書畫圖章一印軸髙三尺四寸五分廣一尺一寸七分書軸次等元張雨書七言律詩一軸次等天一素箋本行書後署登南峰絶頂五字下有張雨私印一印明王守仁書五言古詩一軸次等地一素箋本行草書欵識云正徳甲戌十月初三日陽明居士伯安書於金陵之靜觀亭至長沙見道巗遂出此致意也明婁堅書王縉詩一軸次等元一素絹本楷書七言絶句一首未署名後署王常侍縉四字下有子柔婁堅之印二印明董其昌仿蘇軾筆意一軸次等黄一素綾本行書欵云倣東坡書董其昌明董其昌書五言絶句一軸次等黄二朝鮮箋本行書唐人句欵云其昌書國朝人書軸次等沈荃節臨枯樹賦一軸次等天一素綾本行書欵識云己未仲夏望前二日沈荃張英書七言絶句一軸次等地一素箋本行書唐人句欵署張英張廷玉書七言律詩一軸次等元一素箋本行楷書欵云唐人應制詩桐山張廷玉列朝人畫軸上等六朝張僧繇雪山紅樹圖一軸上等天一素絹本著色畫欵署僧繇右方上有御府之印一璽又子孫億世家傳之寶合同二印下有墨林一印又一印漫漶不可識左方上有米芾畫禪烟巒如覿明説克傳圖章寶錫一印下有梁溪華氏家藏霜華山人李氏珍藏書畫之印諸印又一印存半山二字軸髙三尺六寸九分廣一尺九寸上方御題詩云青女遺素英少男皴粉白依然五大夫須髪轉寒碧丹楓未落盡臨風鳴瑟瑟墜黏文石凹似㸃夀陽額㫁橋驢背人彷彿孤山客乾隆御題下有乾隆宸翰幾暇臨池二璽御筆題籖籖上有乾隆宸翰稽古右文之璽二璽五代黄筌梨花山雀圖一軸上等地一素箋本著色畫未署欵詩塘記語有黄筌梨花山雀圖董其昌觀十一字右方下有神品天籟閣二印左方下有子京項元汴印墨林山人諸印軸髙二尺八寸五分廣九寸七分御筆題籖籖上有乾隆宸翰一璽宋宣和溪山秋色圖一軸上等元一宋箋本著色畫上方有宋徽宗押字上鈐御書一璽右方下有蒼巖子梁清標玉立氏印章一印又司印半印左邊幅有棠村審定焦林二印軸髙三尺廣一尺六寸五分左方上御題詩云雨郭烟村白水環迷離紅葉間蒼山恍聞谷口清猨唳艮嶽秋光想像間御題下有幾暇鑒賞之璽乾隆御筆二璽御筆題籖籖上有天府珍藏乾隆宸翰二璽宋黄居寀山鷓棘雀圖一軸上等黄一素絹本著色畫未署欵上方宋徽宗横書署黄居宷山鷓棘雀圖八字上鈐雙螭一璽又御書半璽右方上有司印半印下有緝熈殿寶宣和二璽俱㣲缺左方上有睿思東閣一璽下有政和一璽㣲缺上方御題詩云棘雀愛卑栖山鷓喜清廓雀在髙棘枝鷓步低泉壑圖之素絹中短言識其略常聞古人云君子慎所託御題下有幾暇鑒賞之璽乾隆御筆二璽下方梁詩正和云斥鷃守藩籬鷦鵬俯寥廓大小隨所如寧須限丘壑閒尋逍遥義雀鷓得其略翾飛髙下間畫手偶然託臣梁詩正恭和又勵宗萬和云么禽羽毛族所志在遐廓唶嘖棲棘叢鈎輈啼澗壑瞻彼鸞鳯羣翺翔逞雄略振翰乘春風上林欣有託臣勵宗萬恭和又張若靄和云鵬鷽同一飛天宇本澄廓潔露飲朱草明霞餐黛壑期不愧鴛鸞何致哂渠略髙卑慎自處含毫有深託臣張若靄恭和軸髙三尺四分廣一尺六寸六分御筆題籖籖上有乾隆宸翰一璽宋巨然層巖叢樹圖一軸上等宇一素絹本墨畫未署欵詩塘董其昌署僧巨然真蹟神品七字又跋云觀此圖始知呉仲圭師承有出藍之能元四大家之自本自根非易易也其昌右方上二印漫漶不可識左方上有宣和殿寶一璽下邊幅王鐸跋云層巖生動竟移葠泉日華諸峰於此明日别滸墅心猶逰其中王鐸題為石􅀢親契癸未三月夜同觀者吾諸弟與朱五溪時雨新來未滂吾占騐諸占否否崇禎皇帝十六年軸髙四尺四寸九分廣一尺七寸二分御筆題籖籖上有乾隆宸翰一璽宋郭熈早春圖一軸上等宙一素絹本墨畫欵識云早春壬子年郭熈畫上鈐郭熈筆一印右方上有明昌御覽一璽道濟書府真賞二印下有珍秘宜爾子孫阿爾喜普之印東平仲雅善卿肅齋諸印又司印半印左方上有丹誠琴書堂都蔚耿信公書畫之章諸印下有御賜忠孝堂長白山索氏珍藏公字信公珍賞九如清玩也園珍賞諸印軸髙四尺九寸四分廣三尺三寸八分御筆題籖籖上有乾隆宸翰内府書畫之寶二璽宋米芾雲山圖一軸上等共一素箋本著色畫未署欵左邊幅陳繼儒跋云米南宫布色雲山竒絶竒絶眉公題右方下有楙禮聨印軸髙四尺廣一尺八寸八分宋楊補之畫梅一軸上等荒一素箋本墨畫右方上録唐人梅花詩一首欵云逃禪老人作下有楊補之一印左方下有世徳堂錢秀峰家珍藏二印軸髙一尺六寸六分廣八寸六分宋李安忠雪㟁寒鴉圖一軸上等日一素絹本墨畫未署欵上方宋徽宗横書署李安忠雪㟁寒鴉圖八字右方上有宣和一璽左方上有紹興一璽軸髙二尺五寸三分廣一尺二寸七分御筆題籖籖上有乾隆宸翰一璽宋馬麟靜聴松風圖一軸上等月一素絹本著色畫欵云臣馬麟畫右方上有宋寧宗書靜聴松風四字下有丙午御書二璽上有席字一印下有商邱宋犖審定真跡天水郡收藏書畫印記二印左方下有緝熈寶殿一璽軸髙七寸五分廣三尺四寸三分元趙孟頫白鼻騧圖一軸上等盈一素箋本著色畫無欵右方一印缺其半存子昻二字詩塘張洪題云花驄初出大宛城只有虬鬚相伴行食粟天閑曾入仗莫言伯樂不知名今人相馬只言肥不説森嚴骨相竒千里長途無險易死生堪託有誰知東呉張洪又陳繼題云進馭歸來日已西落花芳草滿春泥也知櫪上無凡馬牽過天閑不肯嘶廬山陳繼又尤安禮題云天廏昻藏八尺龍奚奴牽牧更從容等閒不遇方臯識安得承恩近九重霧鬛風鬉白鼻騧逢時已缺二字鹽車圉人牽入天閑裏緩步康莊日未斜姑蘇尤安禮軸髙八寸二分廣一尺三寸元管道昇竹溪覽勝圖一軸上等昃一宋箋本墨畫欵識云至大二年魏國夫人趙管下一印不可識又式古堂書畫一印又上有半印不可識左方下有卞令之鑒定一印軸髙一尺七寸八分廣九寸二分元趙雍山鷓棠梨圖一軸上等辰一素箋本墨畫欵云仲穆戯墨下有仲穆魏國世家二印左方上李至剛題云山鷓殊有情適此閒中趣不踏桃李枝却向棠梨樹至剛題左方下有徳父聨印軸髙三尺五寸二分廣一尺二寸二分元錢選花冠秋色圖一軸上等宿一宋箋本著色畫欵云雲谿翁錢選舜舉畫下有舜舉一印軸髙三尺三寸廣一尺八寸二分元柯九思晩香髙節圖一軸上等列一素箋本墨畫欵云五雲閣吏為正臣作下有柯氏敬仲敬仲畫印二印右方中又柯九思墨印一印右方上虞集𨽻書跋云敬仲此幅清楚出塵真平日合作也奎章閣侍讀學士虞集題右方下有四益之齋圖書之府不出户庭尚友千古一印左方中有藴真齋訓忠之家藴真之齋圖書之府吾存其中㳺戯今古松窻棐几萬鍾為輕聊寓意於物適有涯之生諸印下有永存珍秘得秀髙昌正臣圖書諸印下邊幅有棠村審定蕉林二印軸髙三尺九寸三分廣二尺三寸四分御筆題籖籖上有乾隆宸翰一璽元柯九思畫竹一軸上等列二素箋本墨畫欵云丹邱生寫贈叔方徴士下有柯氏敬仲一印又訓忠之家一印右方下半印二存逺孫印章四字左方下有别岫半印軸髙三尺一寸五分廣一尺五寸四分元黄公望九珠峰翠圖一軸上等張一宣和綾本墨畫未署欵姓名見題識中上方有王逢題云層巒叠嶂青嵸巃深塢㣲露儒人宫晴霏裔裔吹不㫁下覆春水光溟濛誰家相對縁溪住石梯蛇折苔華路何當著我沙棠舟放歌流下前灘去梧溪王逢為草元道人題大癡尊師畫又楊維楨題云九珠峰翠接雲間無數人家住碧灣老子嬉春三日醉夢回疑對鐵崖山鐵篴右方下有也園珍賞邵氏容春堂書畫印造元齋造元道人禮用諸印押縫有九如清玩一印左方上有清如許一印下有冰壺秋月一印又二印漫漶不可識左邊幅有阿爾喜普之印東平二印軸髙二尺四寸八分廣一尺八寸一分元王䝉坐聴松風圖一軸上等寒一素箋本著色畫右方上篆書署坐聴松風四字左方上欵識云至正二年夏四月廿又二日黄鶴山樵王蒙畫下有王蒙印王叔明章二印軸髙四尺八寸四分廣九寸四分詩塘御題詩云偶來松樹林趺坐青松下忘筌弄泉石謖謖幽籟㵼主人對客言横琴為我寫客謂主無須聴取真琴者御題下有懋勤殿鑒定章乾隆御筆二璽前有御賞一璽御筆題籖籖上有乾隆宸翰一璽元王蒙石壁飛流圖一軸上等寒二素箋本墨畫右方上署石壁飛流四字欵識云至正壬寅秋九月為道一處士作王蒙下有王蒙印叔明二印又下有蔡羽之印上字公綬貞節堂印諸印左方下有瞿起田耕石齋圖書商山呉氏圖書半印二軸髙三尺四寸五分廣一尺一寸五分元王蒙雙松漁隱圖一軸上等寒三宋箋本墨畫左方上篆書署雙松漁隠四字右方中欵識云至正壬寅夏王蒙避暑小蓬壺有懐復來錬師寫此奉寄下有王蒙一印軸髙一尺八寸廣七寸七分元王蒙秋林萬壑圖一軸上等寒四素箋本著色畫欵云秋林萬壑圖黄鶴山樵王蒙叔明畫下有王叔明一印右方上有退宻一印下有藁字小號又項元汴印墨林秘玩大明錫山安國珍藏諸印左方上有檇李子京父印項墨林鑑賞章諸印下有項子京家珍藏聖謨徐健菴諸印軸髙二尺一寸三分廣一尺四寸二分元王蒙秋山讀書圖一軸上等寒五素箋本著色畫右方上篆書署秋山讀書圖五字欵云叔明為日章畫下有叔明一印又下有周公縝崑山周氏世藏書畫印二印又玉峰石秀巖藏一印又山人半印左方下有鶴城居士軍假司馬元朗鑑定三印軸髙二尺九分廣一尺三寸六分元倪瓚溪山圖一軸上等來一宋箋本墨畫欵識云歳辛亥懶瓚畫溪山圖上方王汝玉題云逍遥天地一閒身浪迹江湖七十春惟有雲林堂上月于今曾照昔年人青城山人王汝玉為伯永契家題又題句云踈木晴巒墨尚新清詩佳麗出風塵披圖便覺成今古詞翰誰能繼缺一字人欵存一休字餘缺右方上有真賞珍秘宜爾子孫諸印下有公字信公珍賞二印押縫有阿爾喜普之印東平宗家重寶三印左方上有丹誠友古軒珍賞二印下有琴書堂都尉耿信公書畫之章勤僖公後人㑹侯嘉祚文徴明印石田會侯鑒賞諸印押縫有長宜子孫一印詩塘有董其昌記語倪元鎮溪山圖真跡董元宰家藏第二幅十六字又記云沈啟南云雲林畫江東之家以有無為清俗又記云雲林畫雖學闗仝能自出新意故無重儓之誚凡翰墨事皆然元宰又題後有千山耿信公書畫之章信公鑒定珍賞植庭清玩阿爾喜普之印耿嘉祚印字㑹侯諸印左邊幅有九如清玩也園珍賞二印軸髙三尺四寸七分廣一尺六分御筆題籖籖上有御賞乾隆宸翰二璽元倪瓚江亭山色圖一軸上等來二宋箋本墨畫欵題并序云煥伯髙士嗜古尚義篤於友道於醫學尤精隠居養親不求知於人也余過婁江踰月與僕甚相好戯寫江亭山色并作長歌以畱别二月廿五日瓚婁江之東天宇寛左瞰青海隂漫漫櫻桃花落雜飛霰桃李欲動春風寒我去松陵自子月忽驚歸雁鳴江干風吹歸心如亂絲不能奮飛身羽翰身羽翰度春水蝴蝶忽然夢千里剥啄剥啄聞叩門推枕倒裳為君起持杯勸我徑飲之有酒如澠胡不喜看朱成碧紛醉眼碧草春波映䟽綺醉吐胸中之磊塊一笑濡毫爛盈紙白鷗明處白雲生歴歴青山鏡光裏翡翠鵁鶄滿