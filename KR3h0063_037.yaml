溪閣圖一軸次等餘一素絹本著色畫欵題云凭江絶地芙蓉起飛閣攢空玉蝀斜席上山河虚萬里掌中指㸃十洲花包山陸治明陸治捕魚圖一軸次等餘二素箋本著色畫左方上𨽻書署捕魚圖三字欵識云嘉靖辛亥臘月廿日製包山陸治明徐渭寫生牡丹一軸次等成一素箋本墨畫欵題云五十八年貧賤身何曾妄念洛陽春不然豈少胭脂在富貴花時墨寫神青藤明董其昌仿燕文貴筆意一軸次等歳一宣徳箋本著色畫欵識云長安觀郭金吾家藏燕文貴畫卷因仿其意為此元宰壬戌冬明董其昌倣米元章瀟湘白雲圖一軸次等歳二素絹本墨畫欵識云倣米海嶽瀟湘白雲圖此乃余家所藏嘗戯為摹之董元宰明董其昌虞山雨霽圖一軸次等歳三素絹本著色畫欵識云黄子久居虞山之隂其畫耑學吾家北苑癸丑秋日余放棹虞山雨後新涼㸃染此幀亦有一段秀色可餐而邯鄲之步終不逮古人逺甚董元宰明董其昌春湖烟樹圖一軸次等歳四素絹本墨畫欵題云幽人茶竈烟每與宿雲亂憑軒望所思春湖𣺌無岸董元宰畫明趙左寒山石溜圖一軸次等律一素箋本墨畫欵識云寒山石溜曾見營邱粉本余故擬作此圖非敢如近日有庸史狂言數覩真本董太史亦為余云無李久矣趙左明趙左秋山紅樹圖一軸次等律二素絹本著色畫欵識云辛亥秋九月趙左明劉邁杏林春燕圖一軸次等吕一素絹本著色畫欵識云天啟元年閏二月寫藏斯馨館劉邁明郭甸寒鴉宿鴈圖一軸次等調一素絹本墨畫欵識云戊申秋日寫古亳郭甸明陳洪綬倚杖閒吟圖一軸次等陽一朝鮮箋本白描畫欵題云何必山行便有詩天生一種住山癡成時也教山童唱難道山童遜雪兒洪綬為喬瞻社世兄寫率題明陳洪綬松岡梅塢圖一軸次等陽二素絹本著色畫欵識云洪綬畫癸酉暮冬明崔子忠桐隂博古圖一軸次等雲一素箋本著色畫欵識云庚辰中秋長安崔子忠畫明陳嘉言畫端陽景一軸次等騰一素箋本著色畫百合鸎粟欵識云甲辰端陽前寫於竹梧小隠陳嘉言石渠寶笈卷十七
