body:
  text: 貯乾清宫一四朝宸翰書冊世祖章皇帝御臨諸名家帖書卷世祖章皇帝御書聖經世祖章皇帝御臨蘇軾滿庭芳詞書軸世祖章皇帝御臨文徴明詩帖書軸世祖章皇帝御筆梅花世祖章皇帝御筆山水世祖章皇帝御筆葡萄世祖章皇帝御筆畫竹世祖章皇帝御筆竹石世祖章皇帝御筆仿關仝山水世祖章皇帝御筆仿董源山水世祖章皇帝御筆仿郭熙山水世祖章皇帝御筆仿范寛山水世祖章皇帝御筆仿夏珪雪景世祖章皇帝御筆仿米家山世祖章皇帝御筆仿米友仁山水世祖章皇帝御筆仿米友仁山水世祖章皇帝御筆仿黄公望山水世祖章皇帝御筆仿倪瓚山水書冊聖祖仁皇帝御書周易折中序聖祖仁皇帝御書性理精義序聖祖仁皇帝御書朱子全書序聖祖仁皇帝御書佩文韻府序聖祖仁皇帝御書御選唐詩序聖祖仁皇帝御書避暑山莊記聖祖仁皇帝御書草訣百韻聖祖仁皇帝御書千文聖祖仁皇帝御書千文書卷聖祖仁皇帝御書太極圖説聖祖仁皇帝御書上帝閣讚聖祖仁皇帝御書操舟説聖祖仁皇帝御書賜裕親王札聖祖仁皇帝御書千文聖祖仁皇帝御書䟦語聖祖仁皇帝御書䟦語聖祖仁皇帝御書長壽星賦聖祖仁皇帝御書行殿讀書賦聖祖仁皇帝御書耕織圖序聖祖仁皇帝御書古文淵鑒序聖祖仁皇帝御書栢梁體詩序聖祖仁皇帝御筆書通鑑綱目後聖祖仁皇帝御書稼説聖祖仁皇帝御書金蓮花賦聖祖仁皇帝御書題畫詩聖祖仁皇帝御臨蘇軾潁州西湖月夜泛舟詩聖祖仁皇帝御臨蘇軾前赤壁賦聖祖仁皇帝御臨黄庭堅書孟郊詩聖祖仁皇帝御臨米芾詩帖聖祖仁皇帝御臨米芾詩帖聖祖仁皇帝御筆仿米芾千字文聖祖仁皇帝御臨趙孟頫書輞川詩聖祖仁皇帝御臨趙孟頫書歸田賦聖祖仁皇帝御臨趙孟頫書䊵扇賦聖祖仁皇帝御臨趙孟頫書秋聲賦聖祖仁皇帝御臨董其昌詩帖聖祖仁皇帝御臨董其昌書舞鶴賦聖祖仁皇帝御臨董其昌書滕王閣序聖祖仁皇帝御臨董其昌書駕幸太學賦聖祖仁皇帝御臨董其昌書麒麟賦聖祖仁皇帝御臨董其昌書五栁先生傳書軸聖祖仁皇帝御書乾九五爻辭聖祖仁皇帝御書聖經聖祖仁皇帝御書唐句聖祖仁皇帝御書五臺碧山寺碑文聖祖仁皇帝御書五臺殊象寺碑文聖祖仁皇帝御臨米芾書泰階六符賦聖祖仁皇帝御臨宋髙宗書漢髙祖求賢詔聖祖仁皇帝御臨董其昌詩帖聖祖仁皇帝御臨董其昌詩帖聖祖仁皇帝御臨董其昌書樂志論聖祖仁皇帝御臨董其昌仿趙孟頫詩聖祖仁皇帝御臨董其昌蘭亭帖聖祖仁皇帝御臨董其昌書老人星賦
