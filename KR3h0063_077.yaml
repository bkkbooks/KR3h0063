front:
  text: 欽定四庫全書石渠寶笈卷三十七
  hash: sha256:e31df5f07ea501c3c82f7d7214168a940d47c2b144932d2448b4eb9fe97226ac
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_077-1a, image: WYG0825/WYG0825-0452a.png}
body:
  text: 貯御書房十列朝人書軸上等宋吳琚書七言絶句一軸上等天一素絹本行書無款有雲壑書印一印左方下有梁清標蕉林二印又一印缺其半存琅寶二字上邊幅有蕉林書屋一印軸高三尺七分廣一尺七寸二分元趙孟俯書師說一軸上等地一素絹本行草書款署子昻下有趙氏子昻松雪齊二印又一印不可識又陸參軍珍賞一印軸高五尺三分廣一尺七寸二分元趙孟俯書李白詩一軸上等地二素絹本行楷書七言絶句一首無款下有趙氏子昻趙孟俯印二印軸高二尺六寸廣九尺八分元趙孟俯書待漏院記一軸上等地三素絹本行書款署子昻下有松雪齊一印軸高四尺九寸五分廣一尺六寸八分元趙孟俯書嶽陽樓記一軸上等地四素絹本行書款云松雪道人書下有趙氏子昻松雪齊二印前署嶽陽樓記四字軸高四尺三分廣一尺六寸六分元趙孟俯書晝錦堂記一軸上等地五素絹本行書款署子昻下有趙氏子昻一印軸高四尺九寸五分廣一尺六寸八分元趙孟俯書雪晴雲散一軸上等地六灑金箋本行書七言絶句一首無款有趙氏子昻松雪齊二印左方下有江夏谷雪川集芳印一印軸高一尺六寸一分廣七寸四分元鮮于樞大書二十字一軸上等元一宋箋本草書五言句二聨四幅合成款識云至元甲午良月北村市舶之趙翰林以此四紙求余作大草書久病目昏不能對客聊以應命殊愧不工他日再易必又是病目時也呵呵鮮于樞下有鮮于困學齊二印右方有趙孟俯跋云困學之書妙入神品僕所不及然四幅不若合為一幅之為佳爰使能者重裝潢之松雪識押縫合同印凡三又徵仲貢氏泰父東圖父虞白生父安南奉使章記金之印衡山李氏佳中太朴山村居士詹景鳳印真居紫芝生宋克私印昌裔元白父十六印詩塘有陳敬宗跋云此書有元鮮于太常之筆趙松雪公家藏之物也二公書皆師晋右軍王逸少初右軍學繇書池水盡墨因得書名而二公用功雖未然必駸駸乎入王氏之門墻見宗廟之美百官之富裕菴既識而藏之可不寶諸翰林侍講學士慈溪陳敬宗言又聶大年跋云書法盛於晋至唐顔栁出法度漸廢又至宋蘇米出來晋魏之風軌掃地矣鮮于伯機與趙文敏同學書而草有過文敏處僕觀此大書尤妙兼觀陳學士跋為之汗出臨川聶大年又張弼跋云伯機之書名彰千古先輩陳聶二公已備言之矣何待僕更為多喋但以鄙見言之皆真跡無疑宋魯先生求僕惡札題於其上即是標瓦礫於珠林也寧不赧顔東海張弼軸高四尺一寸六分廣四尺三寸八分按陳敬宗記語云裕菴既識而藏之則此軸尚應有裕菴題識今缺元俞和臨王帖一軸上等黃一宋箋本臨十七帖二則款云紫芝老人臨下有和字子中父印紫芝生清隱齊諸印右方上有問字館一印又半印不可識下有俞和臨書之印神融筆暢三印第一則下有特健藥一印軸高三尺五寸廣一尺一寸明宣宗書上林冬暖詩一軸上等宇一素箋本行書六言絶句一首款識云宣德六年十月二十七日賜郎中程南雲前署御製上林冬暖詩七字上方有欽文之璽一璽軸高一尺四寸七分廣七寸四分明宋克書公宴詩一軸上等宙一素箋本行草書款識云劉楨公宴詩東吳宋克書下有宋克私印仲溫父二印軸高三尺四寸八分廣一尺七分明祝允明書祖允暉慶誕記一軸上等洪一宣德箋烏絲䦨本行楷書款識云𢎞治三年六月十九日祝允明撰前署祖允暉慶誕記六字後有長洲祝生一印右方下有記語云嘉靖二十八年四月之望石川居士張寰快讀一過下有卧菴所藏一印又左方下記語云祖氏子孫其世寶之下有張氏允清石川世居留耕堂印三印軸高三尺七寸九分廣一尺三寸九分明唐寅書七言律詩一軸上等荒一素箋本行書款識云正德元年榖雨日吳門唐寅書下有南京解元六如居士二印前有吳趨一印軸高四尺三寸六分廣七寸九分明文徴明書五言律詩一軸上等日一素箋本行楷大書款署徴明下有文徴明印衡山居士二印右方上有停雲一印左方下有雅興一印軸高五尺九寸五分廣二尺二寸六分明文徴明書五言律詩一軸上等日二素箋本行楷大書款署徴明下有文徴明印停雲館二印右方上一印缺其半存海世家三字軸高四尺四寸六分廣二尺六分明董其昌節書周子通書一軸上等月一素箋本大楷書款云董其昌書下有董氏元宰十世甲科二印右方上有元賞齊一印軸高五尺九寸二分廣四尺八寸明董其昌書座右銘一軸上等月二宣德鏡光箋本行書款識云崔子玉座右銘當以章草書之崔故善草世稱崔張吾不能作章草耳其昌下有董其昌一印軸高二尺四寸七分廣一尺一寸明董其昌臨顔真卿告身帖一軸上等月三黃描金箋烏絲䦨本款識云魯公告身帖真蹟在吳門韓宗伯家米元章重顔行而不許顔真書亦是偏見張長史郎官壁記乃狂草之築基也其昌下有青宫太保董其昌二印軸高五尺六寸五分廣一尺五寸明董其昌仿顔真卿書一軸上等月四黃箋本節書郎官壁記款云倣顔真卿其昌下有宗伯之章董其昌印二印前有元賞齊一印軸高四尺二分廣一尺六寸七分明董其昌書春日行一軸上等月五宣德箋烏絲䦨本行書款識云戊辰七夕書其昌前署春日行三字軸高三尺七寸廣一尺三寸六分明董其昌書四言詩一軸上等月六宣德鏡光箋本行楷書款署其昌下有知敕詔日講官董其昌印二印前有元賞齊一印軸高三尺三寸一分廣一尺一寸六分明董其昌書叢竹歌一軸上等月七宣德箋烏絲闌本行書款云其昌書下有宗伯學士董其昌二印上署岑嘉州叢竹歌六字軸高三尺二分廣一尺一寸九分書軸次等宋朱子書七言絶句一軸次等天一素箋本行書款識云乾道二年春日晦翁朱熹書元趙孟俯書晝錦堂記一軸次等地一素絹本行草書款識云大德三年二月既望書子昻元趙孟俯書蒼蠅賦一軸次等地二素絹本行楷書款識云己未九月初八日天朗氣清筆硯皆潤因寫此卷以自適雖陽公有意而作余書此亦不能無意寓焉子昻元趙孟俯書逰東都園詩一軸次等地三素絹本行書款署子昻元趙孟俯書題畫詩一軸次等地四素絹本行楷書七言古詩款署子昻明莊烈帝書思無邪三字一軸次等元一雲母箋本行書大字有御筆一璽明莊烈帝書九思二字一軸次等元二素箋本大楷書上方中有押字一明沈度書不自棄說一軸次等黃一素箋烏絲闌本款識云宣德丙午三月既望雲間沈度書前署不自棄說四字明沈粲書古詩一軸次等宇一素箋本草書無款有雲間沈粲民望一印明沈粲書應制詩一軸次等宇二素箋烏絲䦨本真草二體書七言律詩各二首款識云余既為崇道録萬嵗山詩矣復求小山詩因書以歸之非敢夸多鬭靡也粲識前署永樂庚子登小山應制九字明文徴明書山居篇一軸次等宙一朝鮮箋烏絲闌本行書款識云嘉靖丙申春三月六日徴明書明文徴明書七言律詩一軸次等宙二素箋本行書款署徴明明王逢元書七言律詩一軸次等洪一素絹烏絲䦨本行楷書款署葵邱王逢元明邢侗書五言律詩一軸次等荒一素箋本行書款署濟南邢侗明董其昌倣顔真卿書一軸次等日一素絹本楷書五言排律一首後署蕭嵩奉和聖製送張說上集賢學士賜宴款云其昌書明董其昌倣顔真卿書一軸次等日二黃箋烏絲䦨本節書送劉太冲序款識云魯公得書訣於張長史其行楷有狂草意乃善學張顛者其昌明董其昌書五言古詩一軸次等日三宣德箋本楷書款識云右儲光羲田家雜興以徐季海道德經筆意書之兼用顔平原法董其昌明董其昌書五言絶句一軸次等日四雲母箋本行書款云其昌書明董其昌冷然閣大書一軸次等日五素箋本行楷書款云董其昌書明陳璧書言言古詩一軸次等月一宋箋本草書款云文東書贈孟桓無名氏書軸上等元人節書曲禮四語一軸上等天一宋箋本草書左方下有寸心千里一印軸高一尺七寸六分廣八寸附刻絲書軸上等米芾書七言詩一軸上等天一宋本碧色織行書款識襄陽米芾下織米芾之印元章氏二印前織海嶽菴一印軸高三尺五寸二分廣一尺七寸一分朱子書七言詩一軸上等地一宋本素織行書絶句款織晦翁書三字下織晦翁一印右方上有羣玉中祕一印下有雲間沈藻玉堂清暇三天謫吏諸印左方下有玉清朱氏子楚元芳堂項氏珍藏圖書諸印軸高三尺四寸廣一尺七寸趙孟俯書早朝詩一軸上等元一元本素織行楷書款織松雪道人下織趙子昻氏一印左方下有項子京家珍藏半古軒二印又一印不可識軸高五尺九寸一分廣二尺九寸三分附刻絲書軸次等米芾書一軸次等天一明本碧色織款織襄陽米芾書米芾書一軸次等天二明本碧色織款織襄陽米芾書國朝人書軸次等米漢雯書五言絶句一軸次等天一素箋本行書款署米漢雯沈荃倣蘭亭後序一軸次等地一宣德箋本行書款識云右仿蘭亭後序戊午二月望後二日沈荃沈荃倣聖教序一軸次等地二雲母箋本款云倣聖教序臣沈荃沈荃倣顔真卿告身帖軸次等地三雲母箋本楷書款云倣顔真卿告身帖臣沈荃沈荃倣顔真卿告身帖一軸次等地四朝鮮箋本楷書款署沈荃沈荃書朱子敬恕齊銘一軸次等地五素綾本行楷書款云右録朱文公敬恕齊銘日講官起居注詹事府詹事臣沈荃沈荃書思誠齊針一軸次等地六素綾本行楷書款識云真西山思誠齊針臣沈荃恭録沈荃書燕居課一軸次等地七素綾本楷書款云右録陸平泉燕居課沈荃沈荃書應制詩一軸次等地八凡二幅上幅雲母箋本行楷書款識云戊午陽月神武門候駕之一沈荃下幅朝鮮箋本行楷書無款有沈荃之印一印沈荃書七言截句一軸次等地九雲母箋本行草書款云王昌齡詩臣沈荃陳廷敬書七言律詩一軸次等元一素絹本行書款云陳廷敬謹書張玉書書七言律詩一軸次等黃一素絹本行書款云張玉書謹録張英書七言律詩一軸次等宇一素絹本行書款云張英謹書勵杜訥書七言律詩一軸次等宙一素絹本行書款云勵杜訥謹書石渠寶笈卷三十七
