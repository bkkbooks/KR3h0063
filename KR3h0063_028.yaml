body:
  text: 貯養心殿列朝人書畫目録書卷上等晉王義之曹娥碑唐歐陽詢千文唐懷素論書帖唐李白上陽臺書唐顔真卿書朱巨川誥唐柳公權書蘭亭詩並後序唐杜牧書張好好詩五代楊凝式夏熱帖宋蘇軾自書詩帖宋蘇軾書天慶觀乳泉賦宋蘇軾書近作三篇宋蘇軾尺牘宋黄庭堅書贈雲菴道人歌宋米芾茗溪詩宋米芾拜中岳命詩元趙孟頫書待漏院記元趙孟頫書晝錦堂記元趙孟頫䟦定武蘭亭元趙孟頫臨聖教序元趙孟頫書歸去來詞元人三體書無逸篇元俞和臨樂毅論五元人墨跡明沈粲書千文明文徴明自書雜咏明董其昌書李白詩明董其昌雜書明董其昌臨宋四大家書明董其昌書早朝詩明董其昌書㫖帖書卷次等晉王羲之破𦍑帖唐懷仁集聖教序宋蔡襄茶録宋蘇軾書陶詩宋蘇軾書西湖月夜泛舟詩宋黄庭堅書五言古詩宋黄庭堅書千文宋黄庭堅書筆陣圖説宋米芾甘露帖宋朱子書遊仙詩元趙孟頫尺牘元趙孟頫書唐宋人詩元趙孟頫摹定武蘭亭元管道昇書孝經明李東陽自書詩帖明祝允明墨林藻海明文徴明自書詩帖明董其昌書禪悦明陳元素書留鶴詩明張弼雜書國朝人書畫目録書卷上等沈荃倣宋唐人書沈荃書天馬賦
