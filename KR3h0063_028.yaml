body:
  text: 貯養心殿列朝人書畫目録書卷上等晉王義之曹娥碑唐歐陽詢千文唐懷素論書帖唐李白上陽臺書唐顔真卿書朱巨川誥唐柳公權書蘭亭詩並後序唐杜牧書張好好詩五代楊凝式夏熱帖宋蘇軾自書詩帖宋蘇軾書天慶觀乳泉賦宋蘇軾書近作三篇宋蘇軾尺牘宋黃庭堅書贈雲菴道人歌宋米芾茗溪詩宋米芾拜中嶽命詩元趙孟俯書待漏院記元趙孟俯書晝錦堂記元趙孟俯跋定武蘭亭元趙孟俯臨聖教序元趙孟俯書歸去來詞元人三體書無逸篇元俞和臨樂毅論五元人墨迹明沈粲書千文明文徴明自書雜咏明董其昌書李白詩明董其昌雜書明董其昌臨宋四大家書明董其昌書早朝詩明董其昌書旨帖書卷次等晉王羲之破羌帖唐懷仁集聖教序宋蔡襄茶録宋蘇軾書陶詩宋蘇軾書西湖月夜泛舟詩宋黃庭堅書五言古詩宋黃庭堅書千文宋黃庭堅書筆陳圖説宋米芾甘露帖宋朱子書遊仙詩元趙孟俯尺牘元趙孟俯書唐宋人詩元趙孟俯摹定武蘭亭元管道升書孝經明李東陽自書詩帖明祝允明墨林藻海明文徴明自書詩帖明董其昌書禪悅明陳元素書留鶴詩明張弼雜書國朝人書畫目録書卷上等沈荃倣宋唐人書沈荃書天馬賦
