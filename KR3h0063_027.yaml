以實前幅又王翬補沙草款云王暈添平沙蘆荻第三幅自識云學元人小景蕭散曠淡竹石亂泉不作叢莽冗雜清韻自足第四幅前右方款題云怪底眼邊雲樹合恰疑身在富春江秋來常置烏皮几應有嵐煙撲酒缸東園客第五幅款識云雲林畫天真淡簡一木一石自有千巖萬壑之趣今人遂以一木一石求雲林幾失雲林矣東園夀第六幅款識云戲用家香山翁墨氣作北苑庶免畫虎之譏否第七幅前右方款題云翠微路碧雲野水淙淙石壁下清猿叫月澗户寒落花無人春山夜楚魂愁瑤琴寫芝草初未生空憶巢居者春夜畫春澗流泉得句東園生夀平又王翬補水景款云石谷子補漁舟丙子十二月二日第八幅後左方款題云驅毫染嵐霧一片匡廬壁鐘磬出空翠江流瀉天碧島影懸微茫回灘互明滅吳雲不可見千帆望中沒昔人有江山圖余倣其意作小景于古亦有入處鑒者當得之畦徑之外也甲辰臘月夀平題第九幅款識云橅管仲姬竹園客第十幅分二段前段自題云青山家不逺路盡花溪轉刺船沙渚不逢人東風鳥啼山又春又識云蕭文奐畫咫尺間便覺有萬里之勢余豈能然但作半幅圖意亦未就盡耳後段款題云誰捲珠簾望陌頭三眠無復舊金溝青門路上千條緑半是春風半是愁題楊栁東園客後餘幅又識云右小景十幀為東園娛間遊戲之作或規模古製亦間出新意不循畦徑無煩繪采欲墨章水暈自備五色非得象外之賞者未足與觀此畫也甲辰臘月八日惲夀平識費而竒花卉一册次等地一素箋本著色畫末幅款識云康熙庚辰秋日寫于苕溪錢塘費而奇册計十二幅僧傳綮寫生一册次等元一素箋本凡十五幅前二幅墨畫蔬菜第一幅自題云無一無分别無二無二號吸盡西江水他能為汝道又題云和盤拓出大西瓜眼裏無端已著沙寄語土人休浪笑撥開荒草事如麻又題云從來瓜瓞咏綿綿果熟香飄道自然不似東家黃葉落漫將心印補西天己亥暢月廣道人題第二幅題云洪崖老夫煨榾柮撥盡寒灰手加額是誰敲破雪中門願舉蹲鴟以奉客第三幅自跋云己亥七月旱甚灌園長老畫一茄一菜寄西村居士云半疄茄子半疄蔬間剪秋風供苾芻試問西村王大老盤餐拾得此莖無西村展玩噴飯滿案南昌劉漪嵒聞之且欲索豫花封三嘯圖余畣以詩云十年如水不曽疏欲展家風事事無惟有荒園數莖葉拈來笑破觜盧都漪嵒仍索三嘯不聽十二月松門大雪十指如槌三兩禪和煮菜根味頗佳因念前事為京庵兄作數莖葉于祝釐上可謂驢㨂濕處尿熟處難忘也然京庵日侍維摩方丈知南方亦有此味西方亦有此味窮幽極渺以至于卒地折嚗地斷又焉知三月不忘肉味哉誠恐西村漪嵒兩個沒孔鐵槌依樣畫萌蘆耳灌園長老題第四幅至第十四幅墨畫花卉松石第九幅題云尿天尿床無所説又向髙深闢草萊不是霜寒春夢斷幾乎難辨墨中煤第十幅題云碧蓮花競雪天開又道寒巖放早梅大抵春回俱一致只教迸散白雲堆第十一幅隸題云擊碎須彌腰折却楞加尾渾無斧鑿痕不是驚神鬼第十二幅款識云畫于燈社之松海第十三幅自書詩云月自不受晦淡煙蒙亦好俯仰瞷晴軒籬根空皎皎此時世上心所習惟枯稿誰解惜其花長夏恣幽討燈社釋傳綮書第十四幅自書詩云三五銀筝興不窮芙蓉江上醉秋風于今邈抹渾無似落草盤桓西社東己亥十二月朔日僧瀞睿倣宋人山水一册次等黃一素箋本墨畫著色相間末幅款識云丙寅二之日倣宋元諸大家筆意平江瀞睿册計十幅張畫花卉一册次等宇一宣德箋本墨畫無款凡十幅第四幅第五幅第八幅第九幅俱有張畫文始二印蔣廷錫花卉一册次等宙一五色箋本著色畫末幅款云臣蔣廷錫恭畫每幅右方聖祖仁皇帝御書詩句第七幅書小詞一首每幅有中和康熙稽古右文三璽閨媛錢陳書花卉一册次等洪一素箋本著色畫末幅款識云康熙丁酉長至日上元弟子陳書册計十幅閨媛錢陳書摹古一册次等洪二素箋本凡八幅第三幅第四幅第七幅墨畫餘俱著色畫末幅款云陳氏錢書摹古列朝人書畫合册上等眀董其昌書畫合璧一册上等天一書畫各八幅右方宋箋本行草雜書舊句左方宣德箋本墨畫山水書第一幅第八幅款署其昌二字餘無欵畫第一幅第二幅第七幅欵署玄宰畫三字第三幅第六幅欵署玄宰二字末幅款云玄宰寫此十幅庚申春識餘無欵幅髙七寸一分廣三寸九分前副頁御題書畫宗風四大字後有潄芳潤乾隆宸翰二璽御筆題籖籖上有乾隆宸翰一璽按書畫各八幅而款云寫此十幅其二幅蓋佚去書畫合册次等元趙孟俯臨蘭亭序明張路繪圖一册次等天一素箋本首幅書款署子昂餘幅著色畫款署平山册計十二幅眀王時敏董其昌書畫合璧一册次等地一素箋本右方墨畫未署款左方行書七言絶句末幅款識云友人持遜之璽卿山水八幀見示為題其上其昌書畫相間各八幅國朝人書畫合册上等蔣廷錫張照書畫合璧一册上等天一左方通草箋本著色花卉末幅款云臣蔣廷錫恭畫下有臣廷錫朝朝染翰二印每幅二印同右方朝鮮箋本書題句每幅署花名末幅款云臣張照敬題下有臣照聨印通册書畫相間第一幅畫月季花題云百花各有時遲早不相貿代謝鱗次之適性隨所受胡不並敷榮一侈富媪富大化本無心在物理則囿眷兹弱植蔓月月一披秀初生益部中謂無霜雪茂移根植他方開花宛如舊乃知小草心能與四時副才全古所難撚華無言嗅第二幅畫剪秋羅望江南題云碧霄涼于水露下四天髙七襄雲錦成間試金錯刀赩若火齊珠簇如丹鳯毛風翻紅瑣碎月浴爛金膏神功到微卉剪刻無乃勞逡巡擬問之銀塘卷雲濤剪采學真花常恨巧力淺豈知青女手復學人工剪此花寧非羅胡必不可轉君看蕉覆鹿夢醒竟誰辨野草本無名黃􅀈照蒼蘚名之望江南水雲即在眄問天天豈知人心自曼衍真成識得花三界風煙卷第三幅畫鳯仙題云小草有鳯名五色如倒挂碧梧翠竹間紛映良可畫涼風白露下銀漢橫香界千鳯集廣廷須彌納一芥第四幅畫扁豆花絡緯題云田家五六月錦爛棚上花耘歸洗足已兒女雜笑譁今年雨水勻桔橰力未加濃葉多涼風偃卧覆紫霞一聲絡緯鳴縞綦來鄰家織作期左右轉眼天河斜可作邠風圖尺綃其紐芽第五幅畫千日紅題云豪家競牡丹仙子看玉蕊昨日雲霞翻今朝泥沙委野花無比數淪棄雜莽穢偏能耐風雨幾月紅不已百嵗山澤癯豈伊善服餌一生鮮歡華嗇彼故豐此第六幅畫纒枝牡丹題云柔枝裊綘葩牡丹體微具眀姿足間雅小院繞風露花外無車馬花間無屐屨不用一錢買寧煩十户賦豪強之所遺僧房可常住何須金帶圍預知宰相數未要文伯記言詮亦塗汙自落還自開無懼亦無譽第七幅畫萱花題云犀因蠲忿貴草以長樂收忿樂方寸間何與動植謀黃花芳且甘可為瑤席羞詩人樹之背聊亦畔牢愁謂能移人情斯語果信不花能本是幻憂所亦如漚兩皆非真實能立所自休不如倒交蘆能所兩不留母為物所轉師古俾無訧但辨一朝忿常先天下憂第八幅畫石竹蚱蜢狗尾草題云翠羽織蔥蒨殷綃垂旖旎誰與錫嘉名儼然同君子無實鳯不下無節蘭不以玼瑳繡羅衣而不扈蘺芷蚱蜢相招尋往來搖狗尾豈無知竹者此君一時耳第九幅畫旌節花楊牛枸杞題云花王分提封額額髙旌節便有天水牛跂跂傍暖熱其類多長鬚利吻工媒孽本無伏軛能濫厠穿楊列蓮花守香枯寒蟬抱露咽千年叢杞根仙犬胡不齧第十幅畫紅蓼馬蘭題云岸上鯉魚風芙蓉别秋水滿江雨腳來波面蜻蜓起揖雨還拜風蓼花紅邐邐莫訝愛江湖前身是魚子汀洲秋易深木葉蕭蕭下彈琴送湘君風車催雨馬遺珠墮翠翹滿岸丁星者露乾翠已消間客凌晨寫第十一幅畫藍菊題云塞山暑雨過斕斑滿翠錦花葉良似菊色香乃稍寢落英未可餐流泉未足飲經霜益燦然倘與菊同稟善善及其類忍使淪寒品收之芳草譜姱修可勤恁第十二幅畫牽牛花題云籬落有牽牛花如碧玉簪秋雨一霮䨴延蔓隨低隂甫開即揫斂不耐烈日臨上有蟪蛄鳴下為蕭菌林對之懷履霜彈我來陽琴大易繫莧陸繪圖意良深書畫各十二幅幅髙七寸五分廣六寸八分石渠寶笈卷十二
