body:
  text: 貯養心殿三列朝人畫册上等元方方壺山水一册上等天一素箋本凡十二幅第一幅淡著色畫有江上清風金門羽客二印左幅題云月色波光共一舟戛然時聽鶴鳴秋不因此處多佳致安得重來作勝遊後署卧雲二字第二幅墨畫有山間明月方壺書印二印左幅題云雲山碧兮層層煙樹蒼兮冥冥龎眉翁兮得趣抱琴兮徐行款署姚江􅞯即戎字蕙第三幅淡著色畫有二印與第一幅同無題句第四幅淡著色畫有山間明月不芒道人二印左幅題云二老相逢心共間坐來林下未曾還知仁喜樂歸何處只在青山緑水間後署竹溪第五幅墨畫有山間明月金門羽客二印無題句第六幅著色畫有二印與第二幅同左幅題云雁叫西風宿雨收白雲紅樹楚天秋誰知茆屋觀書者坐對溪山得趣幽後署自牧書第七幅墨畫有二印與第二幅同無題句第八幅著色畫有江上清風方壺真逸二印左幅題云名山隱隱水迢迢雲白風清氣寂寥遊客半甜偏得趣乘間逺泛木蘭橈第九幅著色畫有墨興不芒道人二印第十幅著色畫有二印與第一幅同無題句第十一幅著色畫有墨興方壺書印二印左幅題云山林寄迹已忘年兩鬢蕭蕭更皓然坐去不知天地老寧教滄海不桑田後署古愚第十二幅墨畫有山間明月方壺書印金門羽客三印左幅題云願欲求間鑿小臺不間應是為多才扁舟載酒攜書者應是劉棻問字來又跋云余既為曹君書其卷首適情二字矣曹君復以詩索因感而賦此情思何如耶幅髙六寸四分廣四寸六分前副頁御題山水清輝四大字前有乾隆宸翰一璽後有懋勤殿鑒定章一璽御筆題籖籖上有乾隆宸翰一璽按跋語有為曹君書適情二字今佚明沈周溪山草閣圖一册上等地一素箋本著色畫凡六幅第一幅款題云緩𢃄垂楊下觀魚流水中江湖人不逺尺素幾時通第二幅款題云大將心忠赤栽花亦向陽捫心對花坐彼此共恩光第三幅款題云鸂鷘荷花影蜻蜓青竹竿還知掣鼇地東海始為寬第四幅款題云槐影張髙幕林亭潑緑油將軍讀韜略六月氣如秋第五幅款題云老圃韓公第新亭上將家秋風吹白酒無事醉黃花第六幅款題云有月來青天落我酒杯裏酒盡忽不見天上長如此每幅款署沈周下俱有啓南一印前副頁有王榖祥大書溪山草閣四字款署榖祥幅髙八寸七分廣一尺三寸六分明陳洪綬畫隱居十六觀一册上等元一素箋本凡十六幅白描淡著色畫第一幅訪莊款署老蓮洪綬下有章侯氏一印第二幅釀桃款署洪綬下有章侯一印第三幅澆書款署悔老下有章侯氏一印第四幅醒石款署老蓮下有章侯一印第五幅噴墨款署老遲下有章侯一印第六幅味象款署洪綬下有章侯氏一印第七幅嗽句款署悔遲下有章侯氏一印第八幅杖菊款署遲老綬下有陳洪綬一印第九幅浣硯款署洪綬下有章侯一印第十幅寒沽款署遲老下有章侯一印第十一幅問月款署蓮子下有陳洪綬一印第十二幅譜泉款署蓮子下有章侯氏一印第十三幅囊幽款署老蓮下有章侯一印第十四幅孤往款署遲老下有章侯一印第十五幅縹香款署老悔下有章侯一印第十六幅品梵款識云洪綬畫贈石天先生時辛邜中秋下有章侯陳洪綬印二印第一幅有邊幅有宋致稚佳收藏圖書一印每幅有之赤連印宋致審定二印前副頁自標畫目款云楓溪洪綬標記後有章侯陳洪綬二印又宋致審定一印前有月潭朱之赤印二印又自題七言絶句二首云老蓮無一可移情越水吳山染不輕來世不知何處去佛天肯許再來生貧兒劣得買秋光一片豬肝酌草堂著意欲忘離亂事重陽不見報重陽又五言絶句云擘阮秋溪月吾生自可為難將一生事料理水之湄又下有朱之赤印一印又小詞一闋云山水緣猶未斷朝暮定香橋畔君去早來時看得芙蓉一半青盻青盻乞與老蓮作伴欵識云辛邜八月十五夜爛醉西子湖時吳香扶磨墨卞雲裝吮管授余樂為朗翁書贈洪綬下有章侯陳洪綬一印又宋致審定之赤二印又前有之赤一印幅髙六寸七分廣九寸三分明人便靣集錦一册上等黃一凡二十幅第三幅第五幅第七幅第十五幅十六幅金箋本餘俱素箋本第一幅墨畫秋栁鳴蟬款識云戊午秋日朱朗戲筆下有子朗一印第二幅墨畫鬭雞無款有朱子朗一印第三幅著色畫梨花白燕無款上方文彭題云驚見元禽故態非雪翎玉骨世應稀越裳雉尾姬周化瀚海烏頭漢使歸誤入梨花惟聽語輕沾栁絮似添衣珠簾不隔涼州路任爾差池上下飛文彭又黃櫰題云翩翩素質照春暉政恐羣猜出每稀深入玉堂將避迹偶留金屋竟忘歸絲遊芳草能牽興水緑蘼蕪未染衣信是瑶京天女使暫令傳瑞向人飛黃櫰又魯治題云泥香雨淨社初分舊日烏衣迥不羣貝闕啓時因失汝玉樓開處慣逢君貞魂夜度梨花月素影春銷楊栁雲只恐輕塵玷毛羽故隨鷗鷺狎江濆魯治又文嘉題云雙燕翩然下竹扉曉簷霜羽弄輝輝誰言白鳥非玄鳥肯信烏衣是雪衣小院風輕迷蝶去滄江日落亂鷗歸也知自惜竒毛羽不向朱門汗漫飛文嘉又彭年題云社後差池素影非荆門春盡雪初稀王孫陵闕當年見天女祠庭昨夜歸綵勝風翻銀作縷緗簾雲礙玉為衣尋常不逐銜泥伴遙憶擕書海上飛彭年次第四幅著色畫杏花款云沱江子陳栝為繩邱先生寫下有陳氏一印前有子正文陳生印二印又前有一二峯前月三十里外心一印第五幅著色畫紫羅蘭款云陳栝為星山先生寫下有子正氏陳栝之印二印後有墨林山人子京項氏元汴清玩書畫之印一印前有墨林山人遊方之外二印第六幅著色畫牡丹款云己酉夏孟陳栝為平墅先生寫下有子正父一印第七幅著色畫焦石款署陳栝下有陳栝之印一印第八幅著色畫石竹百合無款有陳栝之印陳子正氏二印第九幅著色畫牡丹款識云癸酉春正燈夕作于城南草堂長洲陳注下有陳氏子石二印第十幅墨畫桃花款識云辛卯閏三月之望百榖訪余秦淮之上寫此為贈談志伊下有思重聯印第十一幅著色畫秋海棠款識云辛亥嵗夏日吳支作下有吳支一印第十二幅著色畫石竹花款識云癸酉春日為鹿菴先生作陳粲下有道光聨印第十三幅墨畫漁樵問答圖款識云丙子仲夏日長洲尤求下有鳳邱聨印前有尤求半印第十四幅素箋本著色畫畨騎欵識云己丑六月之望張龍章寫下有伯雲一印上有陳元素諸人小楷録舊人絶句凡十二首第十五幅墨畫王羲之題箑圖款識云萬厯乙巳季冬三日寫吳郡張龍章伯雲氏下有龍章一印第十六幅墨畫雅集圖款識云萬厯庚子清和望寫古吳張雲章伯雲父下有吳淞江張漁郎一印第十七幅墨畫蘭花無款有劉振之氏原起二印薛益題云誰寫三湘九畹真墨花璀璨四時新知君生至南陔性一見清芬便襲人丙子十月七十四老夫薛益題又文從簡題云落日荒煙野水濵鷓鴣啼處有行人東風記取沅湘道蘭葉蘭花一路春劉振之翁畫蘭得魏公遺意九畹清芬溢于楮葉因題文從簡第十八幅著色畫野渡橫舟圖欵識云己酉七月袁孔彰寫下有孔彰一印第十九幅墨畫草亭竹樹款識云丙寅新正三日過更生塵外窩為庸若表弟寫此請正愧不工耳袁孔彰下有孔彰一印第二十幅著色畫浴鵝圖款識云庚辰冬日張復下有張復私印一印明文徴明畫扇一册上等宇一金箋本凡二十幅第一幅至第十幅俱著色畫第十一幅至第二十幅俱墨畫第一幅坡石髙松未署款有徴明停雲二印第二幅溪汀煙樹欵署徴明下有文徴明印一印第三幅看山圖隸書款題云五湖春水緑于苔湖上千山錦障開如此湖山好風日爭教張翰不歸來徴明下有徴明連印第四幅水榭臨流款署徴明下有徴明一印前有元清祕玩古吳金氏家藏二印第五幅松隂漁笛未署款有文徴明印一印第六幅倚石圖款識云辛卯閏月徴明製下有徴明連印第七幅泉石小景款題云寒泉出石罅觸石鏘然鳴髙士可礪齒幽人思濯纓臨磯塵土逺照影鬚眉清蕭然泉石畔自足了平生徴明下有徴明連印後有元清祕玩一印第八幅萱花款署徴明下有文徴明印一印又扇癖一印前有元清祕玩一印第九幅緑隂繫艇款署徴明下有文徴明晤言室印二印第十幅柏石款識云丁酉冬日徴明製下有徴明連印第十一幅墨竹未署款有徴明一印盧雍題云老幹厯氷雪心虛操不移兒孫頭角露總是化龍姿盧雍第十二幅棘枝雙雀款署徴明下有文徴明印一印第十三幅蘭竹款署徴明下有徴明一印第十四幅虬松未署款有文徴明停雲二印第十五幅桂花款題云白頭自笑老仙郎曽御天風到玉堂最是月明秋夢冷滿身金粟露華香徴明下有徴明一印第十六幅菊花款署徴明下有文徴明印一印第十七幅竹樹款署徴明下有文徴明印徴仲二印第十八幅竹樹款署徴明下有徴明一印陸師道題云竹樹何藂蔚緣崖復依嶺落日映寒潭照見虬龍影陸師道又王履祥題云修樹鄰竒石華姿值後雕秋聲來殷地檻外度涼飈履祥第十九幅竹樹款署徴明第二十幅樹石小景款署徴明下有文徴明一印畫册次等厯代名繪一册次等天一凡三十一幅第一幅素絹本著色畫溪橋暮雪款署太原王維第二幅素箋本著色畫秋江漁棹未署款有鄭虔秋江漁棹六字上鈐御書一璽蓋宋徽宗筆也第三幅素絹本著色畫牧牛圖款署韓滉第四幅素箋本墨畫層巒茂樹款署僧巨然第五幅素箋本墨畫秋林茒屋款署咸熙李成第六幅素箋本白色畫丹巖翠岫款署楊升第七幅素箋本白描畫馬未署款有龍眠居士一印第八幅素箋本墨畫喬松疊嶂款署貫道第九幅素箋本墨竹款署軾字第十幅素箋本墨畫松下觀泉款署燕文貴第十一幅素絹本著色畫漁家樂事款署陳居中第十二幅素箋本著色畫翠嶺丹楓款署趙伯驌第十三幅素絹本著色畫池亭秋色款署馬逺第十四幅素絹本墨畫花鳥款署李迪第十五幅素絹本著色畫款云水村圖大年作第十六幅素絹本著色畫江山行旅款識云延祐五年九月既望畫于大都寓舍子昻第十七幅素箋本白描畫觀馬圖款署子昻第十八幅素絹本著色畫秋林讀書款署仲穆第十九幅素箋本墨畫枯木竹石款字殘缺存十四年為常徴君雲林子瓚十一字第二十幅素絹本著色畫雪山歸雁款云髙克明製第二十一幅素箋本墨畫喬柯亭子款識云懶窩道人為彬之作至正甲午下有雲西一印第二十二幅素箋本墨畫溪山雨意款云梅道人戲墨第二十三幅素箋本墨畫古木寒鴉款署丹邱柯九思第二十四幅素絹本墨畫花鳥款署若水王淵第二十五幅素箋本墨畫篆書款識云至正九年十月為晉齋畫溪山館圖黃鶴山人王蒙第二十六幅素箋本墨畫松崖樓閣款云黃鶴山中人王蒙為仲方縣尹尊親作第二十七幅素箋本墨畫溪山深逺款識云至正庚缺正月二日大癡老人作第二十八幅素箋本著色畫款云雷溪圃魚圖朱澤民第二十九幅素箋本墨畫踈林茆屋款識云至正二年夏五月作唐棣子華第三十幅素箋本畫畫山溪漁艇款識云至正辛丑為溥泉寫鄭禧第三十一幅素箋本墨畫松壑流泉未署款有劉靜修一印宋徐崇嗣花草一册次等地一素絹本著色畫末幅款云徐崇嗣製册計十幅宋馬逺小品一册次等元一素絹本著色畫凡十四幅前六幅枯木每幅署臣馬逺三字後四幅花草又四幅山水俱未署欵元盛懋豳風圖一册次等黃字素絹本著色畫每幅小楷節書本詩首幅款署子昭末幅又款云錢唐盛懋製册計三十幅明戴進太平樂事圖一册次等宇一素絹本著色畫末幅款署錢塘戴進册計十幅明陸治寫生一册次等宙一宣德箋