  text: 欽定四庫全書石渠寶笈卷二十五
  hash: sha256:4f8180942b9d2e95f86c52781cb78c72628a481241d062d712ffb8c16bcacb90
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_053-1a, image: WYG0825/WYG0825-0092c.png}
body:
  text: 貯重華宫六列朝人畫卷次等晉戴逵剡山圗一卷次等天一素絹本著色畫欵署山隂戴逵卷前上方有宋徽宗橫書標題並押字上鈐御書一璽拖尾有蘇軾張載楊維禎諸跋又鄧文原楊士竒題句二杜時復記語一前隔水皇帝青宫時題詩云山川靈秀數江南伊人小隱為結菴竹籬茒舍頗自適雲容水態曽相諳老松落落蟠翠色髙峰矗矗烘朝嵐興來掃筆作長幅故知邱壑性所耽三徑雖開人迹絶先生杖䇿獨幽探何須抱琴誇逸致個中妙趣誰能參長春居士題下有寶親王寶一璽前有芝蘭室一璽六朝陸探微五嶽圗一卷次等地一素絹夲著色畫無欵姓名見跋中第一段華山第二段恆山第三段泰山第四段衡山第五段嵩山上有宋徽宗記語一每段上有橫書標題亦徽宗筆每段隔水有祝允明補書王羲之五嶽賦並自跋一則引首有吳永年草書五嶽圗三大字拖尾有蔡京王黼吳履泰徐知常徐師回盛章米友仁危素諸人題名並記語又明宣宗跋一李廷貴跋一唐李思訓海天落照圗一卷次等元一素絹本著色畫金書欵云左武衛驍騎大將軍李思訓畫後隔水有沈荃跋一引首有篆書海若竒觀四大字拖尾有鮮于樞書海賦並記語又錢用時跋一史必書諸人記語一五代周文矩仙姬文會圗一卷次等黃一素絹夲著色畫𨽻書欵識云治平三月丙午周文矩畫拖尾有虞集俞和題句二沈度跋一宋徽宗翠竹雙禽圗一卷次等宇一素絹夲著色畫欵識云崇寧甲申嵗宣和殿製下有押字一上鈐御書一璽拖尾有趙孟俯柯九思許初諸跋宋濂徐有貞題句二釋良琦記語一前隔水皇帝青宫時題詩云兩兩珍禽翠羽修緑雲深處舞風流筆端多少江南意何事終成塞北遊長春居士題下有寶親王寶一璽宋董源山口待渡圗次等宙一素絹夲著色畫無欵引首有董其昌書董北苑夏景山口待渡圗真迹十二字並跋拖尾有柯九思跋一又虞集李泂雅琥諸題句宋郭熙關山積雪圗一卷次等洪一素絹夲著色畫無欵姓氏見跋中拖尾有周遜夫跋又跋一欵署叔盎又李泂周密張紳宋燧諸題句龔璛諸人記語一引首皇帝青宫時題詩云層巒積翠數千里磴道盤空連玉壘鈴馱霜風得得行長途跋涉間關裏世人馳利未肯休風捲塵沙落馬頭河陽一幅炎涼景不徒妙筆誇風流甲寅夏六月寶親王長春居士題下有寶親王寶鳶飛魚躍二璽前有芝蘭室一璽又梁詩正題句一宋米芾雲山一卷次等荒一素箋夲墨畫欵識云元符己卯暮春無事坐雨海岱樓遙望煙江渺茫雲山重疊草木蒙茸人家隱見恍然會心乘興潑墨成此米芾拖尾有栁貫柯九思跋二許顛題句一前隔水皇帝青宫時題詩云雲氣濛濛暗逺天人家微辨水雲邉渡頭風靜帆無力溪尾春歸浪有煙雁塔平臨千畝外雉樓髙踞兩峯前瀟湘雨意憑誰識座上猶疑對老顛寶親王長春居士題下有寶親王寶長春居士二璽前有芝蘭室一璽宋王詵煙江疊嶂圗一卷次等日一素絹夲著色畫無欵前隔水有宋徽宗籖題王詵煙江疊嶂圗七字拖尾有姚邦敬題句一宋濂跋一黎民表記語一宋趙伯駒江山秋色圗一卷次等月一素絹本著色畫無欵姓氏見跋中拖尾有明太祖跋語一宋劉松年香山九老圗一卷次等盈一素絹本著色畫欵署劉松年拖尾有劉定之題句一康里􅀈危素吳奕三跋宋濂陸師道記語二宋馬逺千巖競秀圗一卷次等昃一素絹本著色畫欵云臣馬逺進引首有𨽻書千巖競秀四大字拖尾有題句一未署名宋馬麟荷鄉清夏圗一卷次等辰一素絹本著色畫欵署臣馬麟拖尾有髙士竒跋一按士竒跋中作馬逺誤宋陳居中文姬觀獵圗一卷次等列一素絹本著色畫無欵姓氏見跋中拖尾有鄧文原楊泰二跋宋方椿年瑤池獻壽圗一卷次等列一素絹本泥金畫欵識云紹定二年春畫院方椿年造元錢選寫生一卷次等張一素絹本著色畫欵署舜舉錢選拖尾有貢師泰袁桷宋燧沈周諸跋又林洪題句一元商琦春山圗一卷次等寒一素絹本著色畫欵署曺南商琦德符元黃公望仿巨然溪山暖翠圗一卷次等來一素絹本著色畫欵識云至正八年長至後二日大癡老人寫於毗陵寓舍前𨽻書署溪山暖翠四字拖尾有楊維楨倪瓚僧徹范允臨諸跋元王振鵬畫魯恭三異圗一卷次等暑一素絹本著色畫欵云孤雲處士王振鵬造拖尾有楊士竒聶大年二跋又邱濬題句一前隔水皇帝青宫時題詩云漢室多賢吏披圗識魯公一方霑惠澤三異仰髙風為寫循良貌非誇渲染工監門馳繪幅此意得毋同長春居士題下有寶親王寶長春居士二璽前有隨安室一璽明沈周雪景一卷次等往一素箋本著色畫後别幅欵題云大峯小峯銀削成千樹萬樹瑤華明流泉落澗半作氷溪路漫滅坳崖平招提深入雲幾重隱者茅廬門晝扃煙火寂寥雞不鳴林間鳥雀寂無聲野橋瘦馬客獨行是似浩然來灞陵兩肩山聳破帽傾噤寒不吟風骨清披圗動我探梅情飄然欲結幽人盟歌聲激烈清簷楹夜深飛夢入蓬瀛十二瓊樓玉作成長洲沈周明沈周倣李晞古山水一卷次等往二素箋本墨畫欵題云竹杖綸巾白苧袍松蘿深處足逰遨倦來坐石青雲起泉壑翻疑漲雪濤𢎞治己酉清和月漫仿李晞古筆沈周明仇英清明上河圗一卷次等秋一素絹本著色畫欵云吳門仇英實父摹宋張擇端筆拖尾有文徵明記一王守許初彭年陸師道諸題句又陸粲記語一文嘉跋一引首梁詩正書皇帝青宫時題詩云大禹敷水土導河過龍門漭泱萬里間卓為羣瀆尊流經積石走函谷東過洛汭繞甸服土中自古稱雒都襟帶山河雄地軸維昔宣和全盛時寒食初過一百六淡煙輕雨清明天踏青嵗嵗侈華屋華屋朱樓金闕隈千門萬户天邉開飛花香滿宜春苑稱觴獻夀柏梁臺珮響千官入山呼萬乘來簮裾艷文藻雲漢儼昭回梯航萬里至輻輳日中市綺縠揚衯裶連袂如雲起栁隂暗沙堤花光明御水寶蓋蔡京車髙牙童貫里中樞甲第起崇墉相國髙堂列鼓鐘道君禮樂三千盛孱國山川百二重春入上林迎旭日雲開水殿躍飛龍龍樓鳳閣相輝映山城鼓吹春逰盛春逰處處多貴臣青驄駉駉車鄰鄰明月樓中邀上客紫薇花下宴嘉賓滿堂珠履珍羞錯從容欵曲金蘭親斜陽返照天欲暮汴水橋邉車馬度橋邉街市何喧闐萬貨千商夾道路路旁桃李紛芳菲逰人雜遝白馬肥朝催玉勒花間去暮拂金鞭栁岸歸頗厭錦繡服新裁白紵衣劇孟風未峻郭解力猶微平生但言憑義氣捨身許友未覺非郊畿靄靄帶晴雲稻田桑圃望中分村墟景象多幽趣點綴蚩蚩忘帝勛婦子嬉無節長幼略無文常樂升平烽火息灞陵間却故將軍栁堤逰客艤船待一棹輕移山勢改嫣紅粉白夾岸嬌蘭橈畫舫中流在中流競渡各紛馳渡口漁磯疊石為更有一川風景别身在蓬萊自不知蓬萊宫殿何繁華瑤島瓊臺入坐賖仙人爐煉長生藥羽客丹成九轉砂靈素作安期遺我棗如瓜驅山走海丹青變筆底煙雲紙上見神思妙藝出清新偶然展軸驚萬人巧贍奪天工結構含精氣逺過顧虎頭不數陸仙尉仇子此卷何為哉燕雀嬉嬉畫裏來驅鄰自召強鄰侮繁華侈泰禍之媒牛車俯首受縛去氷天雪窖嗟徘徊即今歌舞地花發為誰開空留遺迹在憑弔費詩才寶親王長春居士題用唐駱賔王帝京篇韻下有寶親王寶染翰二璽前有樂善堂一璽後署梁詩正謹書明仇英山水一卷次等秋二素絹本著色畫欵云仇英實父製拖尾有唐寅文徴明祝允明許初諸題句引首皇帝青宫時題詩云藝苑曽誇渲染竒霜綃獨此見丰姿晴嵐開處春如繡麗景傳來畫是詩忽訝人間逰閬苑還疑几上對峨嵋明窗展玩饒清趣仿佛仙風五兩吹甲寅暢月寶親王長春居士題下有寶親王寶長春居士二璽前有芝蘭室一璽明常倫草蟲一卷次等收一素箋本墨畫欵云八十老人二華倫拖尾有僧智舷曹谷二跋無名氏畫卷上等宋人江帆山市圗一卷上等天一素箋本著色畫卷前有寶繪之印一印又一印漫漶不可識又司印半印卷後有紹興聫璽又吳挺之印長安二印前押縫有新宇項元汴印二印後押縫有汝恆吳新宇珍藏印二印卷髙八寸九分廣一尺三寸六分國朝人畫卷上等王原祁秋山不老圗一卷上等天一素絹本著色畫欵云侍讀臣王原祁奉敕恭畫下有臣原祁一印卷髙一尺二寸六分廣一丈八尺四寸五分畫院漢宫春曉圗一卷上等地一素絹本著色畫欵識云乾隆十年臣金昆臣盧湛臣程志道臣吳桂奉敕合筆恭畫下有金昆連印卷髙一尺一寸六分廣一丈八尺六寸三分余省百蝶圗一卷上等元一素絹本著色畫欵識云乾隆十年七月臣余省恭畫下有余省聫印卷髙一尺一寸一分廣七尺八寸六分卷首御題詩云翩翾錦繡叢蚑栩玻璃影無色香常住消得忙中靜御題下有乾隆御筆一璽畫卷次等王翬長江萬里圗一卷次等天一素絹本著色畫欵云橅燕文貴長江萬里圗海虞石谷子王翬王原祁西湖十景圗一卷次等地一素絹本著色畫分段泥金書標題欵云日講官起居注翰林院侍讀學士臣王原祁奉敕恭畫王原祁西湖十景圗一卷次等地二素絹本墨畫分段標題欵云日講官起居注翰林院侍讀學士臣王原祁奉敕恭畫宋駿業繪南巡圗一卷次等元一素絹本著色畫聖祖仁皇帝翠華南幸事實欵云臣宋駿業恭畫蔣廷錫花果寫生一卷次等黃一宣德箋本著色畫凡二段第一段佛手柑第二段荷花欵署臣蔣廷錫畫前俱有聖祖仁皇帝御書題句第一段題云生緑熟黃却有因清香八閩昔呈珍似開貝葉瞿曇手妙合華陰仙掌垠驛路不傳為異物民風自感得楓宸畫圗尺素分枝幹莫使他鄉憶海濵後署佛手二字下有康熙宸翰保合太和二璽前有佩文齋一璽第二段題云數畝芳塘花未開荷珠清露落莓苔雨涼翡翠搖歌扇風弄蜻蜓惹蕊堆綰燕舞吟鶯來炎天還似去春回葛衣日暮絲絲冷丹檻泉聲處處催後署擎蓋荷珠調鷓鴣天八字下有體元主人萬幾餘暇二璽前有日鏡雲伸一璽張鵬翀秋林讀書圗一卷次等宇一素箋本著色畫欵題云古來天縱號文宣讀易猶令鐵擲穿好學聖心真不厭清秋幾暇正窮研乾隆九年甲子秋日臣張鵬翀恭畫前署秋林讀書圗五字卷前御題詩云前席曽聞室號宣肯教揚子歎袍穿偶將繪事酬清問也道經書在説研御題下有乾隆宸翰一璽董邦達萬壑松風圗一卷次等宙一宣德箋本墨畫欵云臣董邦達恭畫董邦達千竿竹雨圗一卷次等宙二宣德箋本墨畫欵云臣董邦達恭畫沈源清明上河圗一卷次等洪一素箋本淡著色畫欵云臣沈源恭畫院本十八學士圗一卷次等荒一素絹本著色畫欵識云乾隆辛酉年十二月臣孫祐周鯤丁觀鵬奉敕恭畫前隔水御題詩云當年盛事記登瀛傳説芬疑齒頰生自是玉堂無俗客不須金馬羡仙卿木天珂劍從攜侣禁地琴書許暢情同有雄才誇博雅十思誰繼魏元成乾隆壬戌夏五月御題臣梁詩正敬書院本漢宫春曉圗一卷次等日一素絹本著色畫欵識云乾隆六年長至月臣孫祐周鯤丁觀鵬奉敕恭畫列朝人書畫合卷上等元趙孟俯畫箕子授書圗並書洪範一卷上等天一素箋本白描畫小楷書欵云吳興趙孟俯畫并書後有趙氏子昻松雪齋趙孟俯印諸印卷前有天籟閣神逰心賞項墨林父祕笈之印諸印卷後有子京墨林子墨林外史元汴之印項子京家珍藏諸印拖尾文徴明跋云右趙文敏公書尚書洪範一篇並畫箕子武王授受之意為圗畫既古雅而小楷精絶殆無遺恨但無嵗月可考憶嘗見公所書莊子馬蹄篇乃初被召為兵部郎中時書其筆意與此正同疑此亦當時之作維公以亡宋公族仕於維新之朝議者每以為恨然武王伐紂箕子為紂至親既受其封而復授之以道千載之下不以為非然則公獨不得引以自蓋乎公素精尚書嘗為之集注今皆不書而獨書此篇不可謂無意也崦西徐公舊藏此卷間以示余為著此以備折衷公以為何如嘉靖乙未八月文徴明書前有神逰心賞墨林外史項元汴印諸印後有文彭之印虛朗齋墨林子墨林祕玩項氏子京項墨林父祕笈之印諸印卷髙一尺二寸九分廣二尺二寸七分元趙孟俯書九歌並繪圗一卷上卷天二素絹本行楷書白描畫書畫相間卷後欵識云延祐六年四月十八日畫並書子昻又自跋云九歌屈子之所作也忠以事君而君或不見信而反踈然其忠憤有不能自已故假神人以寓厥意觀其末章則顯然昭然矣夏七提領有感於心命其子德俊持此卷圗其狀意懇懇也故揆間一一畫之以酬之然不能果中提領之目否因重識之是年四月晦日也孟俯書於鷗波亭中下有趙氏子昻松雪齋二印卷中每段俱有趙氏子昻一印卷首署九歌圗三字下有劉德新記云靈均之賦天問文生於畫松雪之圗九歌又畫生於文乃知文心畫心正在風水相遭之際耳甲寅秋日石癡子裕公劉德新記前有鄭朴之印蘭亭居士鑑賞二印又學士印半印又半印二不可識卷末有王霽字家珍藏柯氏清玩柯九思鑑定真迹三印又汪氏蔣印半印二又半印不可識卷髙一尺一寸一分廣二丈二寸有竒明文徵明疏林淺水圗并自書詩帖一卷上等地一宣德箋本前幅墨畫欵識云嘉靖庚子秋八月十又八日南衡侍御過訪草堂寫此奉贈徴明下有徴明一印又橫浦絶妙臣有書畫癖諸印後幅行書五七言律詩十七首欵云近作數首書似南衡先生請教徴明頓首上後有文徴明印晤言室印玉磬山房諸印前幅髙八寸廣三尺七寸後幅髙同廣一丈四尺二寸四分書畫合卷次等元趙孟俯書畫陶潛遺事一卷次等天一素絹本行草書墨畫書畫相間凡十五段欵識云大德三年五月草二日畫子昻引首虞集書靖節先生遺事六大字拖尾有石清跋一明文徴明盤谷圗并書敘一卷次等地一前幅素箋本墨畫未署欵後幅金粟箋烏絲闌本小楷書送李願歸盤谷敘欵識云徴明書時年八十有四石渠寶笈卷二十五
