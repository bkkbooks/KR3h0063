冬十月初吉桐江俞和臨于黃岡之寓所下有俞和子仲父印紫芝生三印卷前有清隱嘉祚㑹侯墨林子京所藏臨池清賞顧氏藝閣珍藏諸印又父印家藏半印二卷尾有檇李項氏世家寶玩耿㑹侯鑒定書畫之章子京項元汴印湛思墨林祕玩潄六主人積雪齊諸印又宫保半印前隔水押縫有字㑹侯一印後隔水押縫有丹誠閣半古軒書畫印二印引首有半古軒耿嘉祚印字㑹侯三印拖尾有真賞丹誠琴書堂耿嘉祚印諸印又文從簡跋云紫芝翁書學入趙魏公之室運筆肥潤有屋漏雨痕之妙此卷瘦徑緊嚴稜稜丰骨不露本色古人摹臨之拔至此故知得書中三昧筆便如龍變化固不可測辛未五月十日後學文從簡謹題又跋云余藏篋中黃庭經以趣勝此以法勝趣猶入佻越一乘法如山嶽莫可搖撼望之甚尊後五日再觀從簡卷髙七寸七分廣二尺一寸三分五元人墨蹟一卷上等列一宋箋本凡五幅第一幅趙蕃劄子行書款識云九月缺日文林郎監潭州南嶽廟趙蕃劄子前有王顓菴書畫記一印後有太原王掞藻儒父章顓菴二印幅髙一尺廣二尺五寸七分第二幅僧士璋尺牘行書款識云六月草九日士璋拜啓又另行云一印不及外奉安問附此致敬幸恕諒一印再拜前有墨林項墨林鑑賞章項元汴印子孫永保項墨林父祕笈之印惠泉山樵項子京家珍藏諸印又退密硯癖半印二後有退密惟心淨土西疇耕耦項墨林鑒賞章項子京家珍藏太原第八子項叔子諸印又項印平生宫保半印三幅髙一尺一分廣二尺三寸九分第三幅張雨詩帖楷書款云舊詩四篇為孔昭書登善菴主張雨下有句曲外史一印前有檇李項氏世家寶玩項元汴印子京父印項墨林父祕笈之印左廉察祭酒字藻儒號顓菴諸印又寄傲齊字半印二後有項元汴印天籟閣子孫永保項墨林鑑賞章周錫圭印諸印又墨林半印中幅有平生真賞墨林祕玩項墨林父祕笈之印三印幅髙一尺廣二尺二分第四幅倪瓚尺牘並詩楷書款云瓚草二日前有天籟閣復徵王孚藻儒鑒藏項元汴印墨林山人項子京家珍藏諸印又叔子世昌半印二後有退密項墨林鑑賞章檇李項氏世家寶玩墨林山人平生真賞賢者而後樂此諸印又項子京半印幅髙九寸廣一尺一分第五幅陳基自書七言絶句十首行楷書款云陳基謹次韻後有王掞印一印幅髙九寸七分廣一尺三寸五分明沈粲書千文一卷上等張一灑金箋本草書款識云余友徐尚賓得佳箋寶藏久矣一日持來簡菴次求作草書千文勉為書一過惜鈍拙之不稱耳正統丁卯秋七月初三日沈粲書後有雲間沈粲民望作德心逸日休中議大夫贊治尹之章三印卷後髙士竒跋云明初雲間二沈以書名天下民瞻草法尤工然傳于人間甚少向日得其千文一卷藏于信天巢頃以銷夏展觀覺有龍蛇飛動之勢與宋仲珩詩卷並寶藏焉康熙己卯七月朔記于柘上清吟堂江村髙士竒又跋云宋仲珩詩卷去歲贈漫堂中丞近來墨蹟甚少明初尚不可得安望宋元乎然觀宋元贋筆豈若勝國真本饒有趣味辛巳嘉平四日久晴暄和黃梅已破萼矣侍萊衣人竹忩卷前有竹忩一印卷中幅押縫有簡菴印凡九後隔水有高氏江村草堂珍藏書畫之印一印引首有瀛山館一印卷髙七寸八分廣一丈七尺九寸明文徵明自書雜詠一卷上等寒一素箋本行書七言律詩十首款識云久雨新霽情思爽然焚香煮茶亦人間快事也有粉箋一卷素潔可愛援筆漫録雜詠值麗卿至即與持去不足供展閲耳徵明下有文徵明印徵仲二印卷前有停雲惟庚寅吾以降玉蘭堂三印卷後有留餘堂記四明朱氏收藏圖書記二印押縫有玉蘭堂印二卷髙七寸九分廣八尺三分明董其昌書李白詩一卷上等來一宣德鏡光箋本行書款云其昌書太白詩下有知制誥日講官董其昌印二印卷髙八寸五分廣七尺二寸一分明董其昌雜書一卷上等來二宣德泥金箋本行書世說新語三則又張九齡白羽扇賦並唐明皇批答款識云史稱明皇知眷曲江每聞說名士輒曰風度得如九齡否既為李林甫所嫉作鷹詩見志以遺林甫林甫稍悟腹劍為之衰止焉此白羽扇賦預見其端矣董其昌書下有宗伯學士董元宰氏二印卷中幅押縫合同印凡三卷髙一尺一寸二分廣一丈三尺六寸明董其昌臨宋四大家書一卷上等來三朝鮮箋本行楷各體書臨蘇軾三則黃庭堅一則米芾一則蔡襄一則款識云偶觀四大家帖各臨數行後有宗伯學士董元宰氏二印卷髙六寸一分廣五尺四分明董其昌書早朝詩一卷上等來四宜德鏡光箋本楷書款識云賈曽賈至父子掌詞頭故早朝詩百首以四首有鳳字末韻者為及格兹納言元著次郎君六齡岐嶷誦五經如流水雖李鄴侯七歲賦方圓動靜詩無以過之無論賈至矣書二詩以贈其昌下有宗伯學士董氏元宰二印卷髙七寸二分廣四尺三寸七分明董其昌書旨帖一卷上等來五宣德箋本行書評晉唐諸家書凡十則款識云戊辰正月草六日書其昌下有董其昌一印卷前半印存收藏圖書四字中幅押縫有城南杜氏筆酣二印卷髙七寸七分廣五尺六寸書卷次等晉王羲之破羌帖一卷次等天一素箋本行草書無款姓名見跋中引首有隸書寶藏二大字款云竹坡隸古拖尾跋一未署名又揭傒斯班維志二跋又練髙常方壺題識二又吳治江虛白記語二又署劉光暘進四字唐懷仁集聖教序一卷次等地一素箋本剪字集晉王羲之書前隔水記語有天輔五年辛丑三月十日觀十一字上鈐御書之寶一璽後隔水有東府同觀四字拖尾有戴至德表文一李義琰頌一又蘇軾僧佛印虞集僧性慧諸跋又明藩潞王敬一跋一又題識一宋蔡襄茶録一卷次等元一素箋烏絲闌本楷書分上下篇前後俱有自序款識云治平元年三司使給事中臣蔡襄謹記引首有李東陽篆書君謨茶録四大字拖尾有康衢林璉吳湛然曹公密蔡卓陳堯龍盧貢純達溥化曹稹孫劉修真曹彌芳陳剛章仕堯陳昶鄭僖陳公圭汪與懋李迪彞方沁諸跋又題句一款署天趣又章沂春賦一後附文徵明隸書龍茶録考有文彭文震孟二跋宋蘇軾書陶詩一卷次等黃一素箋本大楷書自識云紹聖乙亥中元日書陶淵明飲酒一首拖尾有俞君猷跋一宋蘇軾書潁州西湖月夜泛舟詩一卷次等黃二素箋本大楷書款識云潁州西湖月夜泛舟聽瑟一首東坡居士拖尾有王俊華沈周陳昌言諸跋宋黃庭堅書五言古詩一卷次等宇一素箋本行楷大書款云黃庭堅書拖尾有劉基吳寬二跋宋黃庭堅書千文一卷次等宇二素箋本草書款云右倣懷素筆意鍾陵黃庭堅書拖尾有蘇文歡班惟志二跋宋黃庭堅書筆陳圖說一卷次等宇三金粟箋朱絲䦨本行楷書款署鍾陵黃庭堅拖尾有彭年吳奕祝允明文徵明諸跋又唐寅記語一宋米芾甘露一卷次等宙一素箋本行草書款云芾頓首再拜拖尾有周伯溫題句一宋朱子書游仙詩一卷次等洪一素箋本行楷書七言絶句款云右小游仙二絶朱熹書元趙孟俯尺牘一卷次等荒一素絹本行草書凡七則後隔水有董其昌跋一引首有松雪墨妙四大字款云少白為信孺寫元趙孟俯書唐宋人詩一卷次等荒二素箋本行楷書唐宋人歌行四首款識云大德六年七月十七日為道上人書此數詞子昻拖尾有僧景芳題識一元趙孟俯摹定武蘭亭一卷次等荒一素箋本款識云王右軍蘭亭帖古今難臨摹者也試為之乃信子昻云前裝墨搨蘭亭叙一卷並原跋拖尾有張翥張以寧二跋元管道升書孝經一卷次等日一素箋朱絲闌本小楷書後幅附女孝經款識云大德九年三月上浣天水管道升書拖尾有王世貞跋一明李東陽自書詩帖一卷次等月一灑金箋本草書七言絶句款識云芍藥始萌為鶴所啄戲成三絶酒半縱筆為孟清通判書之西涯翁識引首有周天球書西涯遺翰四大字拖尾有文徵明跋一明祝允明墨林藻海一卷次等盈一素箋本真草各體書詩帖二則後雜臨諸名家帖款識云莆陽鄭明府與允明為同寅蒙教受愛誼款日深嘗有鄙詩往復君既過為襲藏復粘綴素紙盈卷索拙筆滿墨之且請舉各家體貌為之豫素既無學力又坐公事障塞來使立階下不去乃勉為答之文房四君嶺外惟陶泓名天下而官舍初無良品餘三人則荒陋不可言覔之篋中間有蘇浙毛穎數輩遂取與廣豪錯雜用事如右西子鄰嫗又無金翠膏沐不覺加醜信不得已耳蛾眉輩見之幸勿破顏丙子十月草二日吳郡祝允明書于興寧縣齊引首有廖柿書墨林藻海四大字並跋拖尾有鄭郊跋二明文徵明自書詩帖一卷次等昃一素箋烏絲䦨本行書七言律詩十三首款識云戊午四月晦日閒忩漫書徵明時年八十九明董其昌書禪悅一卷次等辰一灑金箋本行書凡六則未署款有董其昌印太史氏二印明陳元素書留鶴詩一卷次等宿一素箋烏絲䦨本行楷書五言古詩二首款云元素具稿振先詞宗笑評明張弼雜書一卷次等列一灑金箋本行草書詩翰尺牘凡六則拖尾有郭淐題句一國朝人書卷上等沈荃仿晉唐人書一卷上等天一朝鮮箋本凡七則第一則臨薦季直表第二則節臨蘭亭叙第三則臨陸柬之蘭亭詩第四則臨地黃帖第五則臨敬祖帖第六則節臨枯樹賦第七則節臨爭坐位帖款識云庚申春日仿晉唐人書于內直史館沈荃下有沈荃之印宫詹學士二印卷前有承恩堂一印卷髙九寸五分廣一丈六寸八分沈荃書天馬賦一卷上等天二朝鮮箋本臨米芾書款識云康熙十年歲次辛亥仲秋朔三日酒後漫臨此賦時在燕邸二弟將南歸即以為行槖之贈舟次展閲不異一樽相對也下有繹堂一印卷前有傳經堂一印卷髙八寸五分廣七尺九寸五分石渠寶笈卷十三
