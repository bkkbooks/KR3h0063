  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_029-1a, image: WYG0824/WYG0824-0337c.png}
body:
  text: 貯養心殿四列朝人書卷上等晉王羲之書曹娥碑一卷上等天一素絹本卷中計缺六字卷首記語有元和十年十月三日觀九字又馮審字退脫四字下有僧權二字僧字缺其半又記語云㑹昌五年三月草八日翰林學士缺琮將仕郎李脫同觀有秋壑珍玩趙孟俯印二印又六印漫漶不可識卷後懷素識云缺大厯三年秋九月三日沙門懷素藏真題又𨽻書記語參軍劉鈞題此世之罕物又吏龍門縣令王仲儉借觀十字下分行小字書大厯二年歲次己未二月辛未朔三日癸酉百缺客奉縣令韓紹處命題二十七字又癸酉歲九月六又七字又句章令滿騫五字下有懷充二字又僧權二字又缺成四年七月草九日刺史楊漢公記十四字有張應甲印希逸氏訓忠之家三印又柯九思喬簣成氏墨印二又半印一又三印又中幅三印俱漫漶不可識中幅上方記語云進士盧𢎞禮同進士栁宗直來古缺元和缺年缺月十四日宗直留題于卷末州刺史馮缺刑部員外郎孟簡次缺同來看書國子博士韓愈趙元遇著作佐郎樊宗師處士盧同觀元和四年五月二十日退之題字橫書左旋讀後隔水有王元馭氏錫爵東海張應甲字先三號希逸寶藏書畫印宫詹學士沈荃之印韓世能印韓逢禧書畫印王衡之印緱山人王時敏印遜之諸印拖尾宋高宗跋云右度尚曹娥誄辭蔡雍所謂黃絹幼婦外孫􅐽臼者也雖不知為誰氏書然纖徑清麗非晉人不能至此其間草字一行則浮圖懷素題識也自古髙才絶藝而隱沒無聞于世者多矣豈獨書耶損齊書上鈐損齊書印一璽前有御書一璽後有天厯之寶一璽又虞集跋云右曹娥碑真蹟正書第一嘗藏宋德夀宫天厯二年四月己酉上御奎章閣閲圖書以賜閣參書柯九思奎章閣侍書學士翰林直學士亞中大夫知制誥同修國史兼經筵官國子祭酒臣虞集奉敕書後有臣九思訓忠之家張應甲印希逸氏柯九思印丹邱柯九思章諸印又趙孟俯跋云曹娥碑正書第一欲學書者不可無一善刻况得其真蹟又有思陵書在右乎右之藏室中夜有神光燭人者非此其何物耶吳興趙孟俯書又郭天錫書黃長睿跋云晉史稱王逸少書暮年方妙此帖升平二年書距其終才三載正暮年跡也故結字比樂毅告誓諸帖尤古質殊類鍾元常渾渾然有篆籒意非遇真賞未易遽識也長睿父題至元丁亥九月望日癸卯金城郭天錫祐之謹録于後前署跋逸少升平帖後七字後有韓逢禧一印又喬簣成跋云右小楷曹娥碑黃長睿跋云逸少升平二年書距其終才三載正暮年蹟也故結字比樂毅告誓諸帖古質非真賞者未易識也又前人品作魏邯鄲淳之書於字文邉有唐國子博士韓愈趙元遇著作佐郎樊宗師處士盧同并翰林學士韋琮刺史楊漢公參軍劉鈞諸公題名其餘名士尚多是可謂聚德星也又誄文空行間僧懷素小草題志特豪縱妙絶考之紹興裝褫格範云晉唐以來法書唐名士于欄道邊及前後題跋蓋所論正與此合然法書寶玩誠為世之尤物而乃以侵字題記者則似亦少缺貴惜也卷後髙宗題曰度尚誄辭雖不知為誰氏書然纖徑清麗非晉人不能至此以紹興內府圖書四角印之又古印章數處而磨滅難辨并唐懷允徐僧權署名法當第為上上神品此書韓托胄家故物已嘗刻諸石今并入羣玉帖中因念余平生獲閲書畫不啻數百千軸惟六朝者盡六種耳而謝稚三牛展子䖍北齊後主幸晉陽宫及余家陸探微降靈文殊是其三也而以書中但逸少子鸞關中二帖今曹娥碑繼此一也由是觀之則世間文物向不知兵燼幾經今存之者尚能幾何耶而好事家豈得不為之貴惜乎本理問官郭公祐之家物祐之沒十有餘年而散落于他門余訪求購得之噫物之興衰固有數焉又何但此而已姑述其出處流轉之脫一字云耳龍集癸丑十月望日燕山喬簣成仲山父書於錢唐客舍後有希世之珍一印又黃石翁跋云曹娥碑石刻善本亦未易得此卷乃在淡軒祕篋如嶽陽樓親見洞賓覺人間畫本俱不類淡軒什襲珍之黃石翁書後虞集又跋云近世書法殆絶政以不見古人真墨故也此卷有蕭梁李唐諸名士題識傳世可考宋思陵又親為鑒賞于今又二百餘年次第而觀益知古人名世萬萬不可及噫聖賢傳心之妙寄諸文字者精審極矣萬世之下人得而讀之然猶不足以神詣其萬一天台柯敬仲藏此安得人人而見之世必有天資超卓追造往古之遺者其庶幾乎泰定五年正月十日翰林直學士奉議大夫知制誥同修國史經筵官蜀郡虞集朝列大夫禮部郎中前進士薊邱宋本奉訓大夫太常博士遂寧謝端本之弟從仕郎翰林國史院編修官褧侍儀舍人蜀郡林宇同觀集題下注云謝公延祐戊午進士小宋泰定甲子進士又康里巙記云康里巙逯魯曽同觀于柯氏玉文堂子山書又宋本記云天厯二年春正月九日吏部侍郎宋本翰林修撰謝端太常博士王守誠太常奉禮郎簡正理著作佐郎偰玉立侍儀舍人林宇太常太祝趙期頥同觀于典瑞院都事柯九思家又跋云尤物世有終身不得見者本獨與謝林二君間歲一再見非幸耶是日期而不至者弟褧也本又題後虞集又跋云集比歲輒從敬仲求此一觀上開奎章此卷已入內府上善九思鑒辨復以賜之仍命集題閣下同觀者大學士忽都魯彌實承制李泂供奉李訥參書雅琥授經郎揭傒斯內掾林宇甘立集三記又另行記云九思敬仲名又記云金源紇石烈希元武夷詹天麟長沙歐陽元燕山王遇天厯三年正月草五日丁丑同觀是日賀敬仲有鑑書博士之命又記云天下惟理無對物則有萬殊之辨矣敬仲家無此書何以鑒天下之書耶集四題天厯庚午正月草七日參書雅琥經筵檢討白守忠髙存誠同觀集之子冏侍後元代國書一印下注云奎章閣初建從六參書印文也後閣升正二參書用五品印後文是也又寶藏一印又蔣惠跋云豫學書甫三十年嘗閲前代名筆至于曹娥碑曽覩一二善刻今復觀其真蹟則炫耀頓生於眵昏矣洪武己未正月季春下浣鄱陽蔣惠謹識又沈荃記云康熙十六年十一月二十二日奉敕賜翰林院學士臣喇沙里臣陳廷敬詹事府詹事臣沈荃侍讀學士臣葉方藹侍講學士臣張英觀曹娥碑真蹟臣等仰瞻皇上天亶聰明鋭意典學經史之暇怡神翰墨故古蹟應時而出上佐宸覽用光文治臣等侍從講筵得觀斯蹟不勝欣幸之至謹奉敕恭紀臣沈荃書又劉源記云康熙十六年十一月二十四日刑部主事臣劉源內閣撰文中書臣髙士奇奉敕審定真蹟最後記語有五茸趙禮用觀于居俟齊十字諸跋中押縫有喬氏柯氏敬仲喬簣成氏敬仲書印任齊柯氏真賞丹邱生諸印卷高一尺三分廣一尺六寸九分拖尾沈荃記語前聖祖仁皇帝御筆跋云曹娥碑相傳為晉右軍將軍王羲之得意書今覩真蹟筆勢清圓秀徑衆美兼備古來楷法之精未有與之匹者至今千餘年神采生動透出絹素之外朕萬幾餘暇披玩摹倣覺晉人風味宛在几案間因書數言識之前有宣文之寶一璽後有體元主人萬幾餘暇二璽御筆題籤籤上有乾隆宸翰一璽唐歐陽詬書千文一卷上等地一素箋本楷書未署款姓氏見跋中卷首有天籟閣式古堂書畫墨林子項子京家珍藏項墨林鑑賞章卞永譽印卞令之鑒定墨林生子孫世昌項叔子諸印又半印三俱漫漶不可識卷後有檇李項氏世家寶玩式古堂書畫寄傲子京所藏秋壑珍玩植齊家寶子孫永保子孫世昌蘇然諸印又縉雲半印又隸字淡齊一印卷中押縫有式古堂印七子京所藏印五墨林子墨林生印各一前隔水有古香書屋南昌縣印檇李項氏世家寶玩三印押縫有式古堂一印後隔水押縫有長字墨林生卞氏令之式古堂莆陽傅氏清叔玩府諸印拖尾王詵跋云東坡公云歐率更書非託于褊嶮無所措其竒其末流遂至李國主輩五降之後不容彈矣僕非唯愛此評又愛其筆札瓌偉遂先白主人而取之主人自有好弗之病憐我病更甚故取之而不拒也晉卿書前有項子京家珍藏項墨林鑒賞章二印後有檇李項氏世家寶玩式古堂書畫子孫永保項叔子子孫世昌墨林子子京所藏墨林生仙客卞永譽印卞令之鑒定植齊家藏蘇然諸印又縉雲半印又隸字淡齊一印又後有退密子孫世昌子京淨因庵諸印卷髙七寸八分廣九尺五寸六分御筆題籤籤上有乾隆宸翰一璽唐懷素論書帖一卷上等元一素箋本草書未署款姓氏見跋中卷首有御書一璽又神品子京項元汴印墨林祕玩子孫永保諸印卷後有子京所藏項子京家珍藏二印前隔水有天籟閣檇李子京父印項墨林鑒賞章曠菴諸印押縫有雙螭政和宣和諸璽又子京所藏一印又紹興御書二璽真賞世家二印俱缺其半後隔水有紹興一璽又髙岱退密項墨林父祕笈之印檇李項氏世家寶玩諸印押縫有政和璽二宣和一璽又子孫永保神遊心賞平生真賞墨林山人子孫世昌諸印引首有靜寄軒圖書一印拖尾項元汴篆書記語云宋徽宗御書金籤唐僧懷素行書論書帖真蹟神品珍祕明墨林山人項元汴真賞子孫保之下有子京所藏項墨林鑒賞章二印前有內府圖書之印一璽又靜寄軒圖書印墨林子項子京家珍藏項叔子秋壑圖書諸印後有子京半印二子孫半印一又張晏跋云藏真書多見五十幅亦皆唐僧所臨而罕有真蹟一二知書者謂此幅最老爛因錦襲珍藏之延祐元年十一月朔日集賢大學士榮祿大夫張晏珍玩前有曠菴子孫永保二印又彥清家傳半印二後有項子長氏項篤壽印項墨林父祕笈之印吳時芳印諸印又趙孟俯跋云懷素書所以妙者雖率意顛逸千變萬化終不離魏晉法度故也後人作草皆隨俗繳繞不合古法不識者以為竒不滿識者一笑此卷是素師肺腑中流出尋常所見皆不能及之也延祐五年十月草三日為彥清書翰林學士承旨榮祿大夫知制誥兼修國史趙孟俯書後有項子長氏項篤夀印墨林山人項子京家珍藏髙岱諸印後項元汴又跋云釋懷素字藏真俗姓錢長沙人徙家京兆元裝三藏之門人精意翰墨追仿不輟秃筆成冢一夕觀夏雲隨風頓悟筆意自論得草書三昧評其勢者以為若驚蛇走虺驟雨旋風又謂援豪掣電隨身萬變或謂張長史為顛懷素為狂以狂繼顛孰謂不可及其晚年益進復評其與張芝逐鹿亦有加無已考其平日得酒發興要欲字字飛動圓轉之妙宛若有神是可尚者此論書一帖出規入矩絶狂怪之形要其合作處若契二王無一筆無來源不知其肘下有神皆以狂稱之殆亦非㑹心者豫昔購自叙帖雖行草不倫其筆法與此帖一同但有肥瘦之異正不解真草各有態執而論書鮮不失矣汴也何幸覩此竒觀千百載之下吾謂君子有三樂此帖與存焉後人其寶之墨林項元汴在雙樹敬題諸跋中押縫有靜寄軒圖書一印卷髙八寸九分廣一尺二寸七分御筆題籤籤上有神品乾隆宸翰二璽唐李白上陽臺書一卷上等黃一素箋本草書款識云十八日上陽臺書太白卷首有子固秋壑圖書二印卷末有神品神竒墨林項季子章歐陽元印項元汴印子京珍祕項叔子檇李項氏世家寶玩煮茶亭長張晏私印諸印又墨印一漫漶不可識前隔水有宋徽宗書唐李太白上陽臺七字又天籟閣項元汴氏審定真蹟彞齊退密項墨林父祕笈之印蘧廬項子京氏子孫世昌諸印押縫有雙螭一璽又燕山張氏清暢印記項墨林父祕笈之印長宜子孫諸印後隔水有子京父印有何不可寄傲㑹心處香巖居士平生真賞諸印押縫有同文袁笠生子京父印項子京家珍藏河北棠村冶溪漁隱諸印引首有蒼巗子蕉林居士二印拖尾宋徽宗跋云太白嘗作行書乘興踏月西入酒家不覺人物兩忘身在世外一帖字畫飄逸豪氣雄健乃知白不特以詩鳴也後有墨林祕玩子京珍祕項墨林鑒賞章長宜子孫諸印又張晏跋云謫仙書傳世絶少嘗云歐虞褚陸真書奴耳自以流出于胸中非若他人積習可到觀其飄飄然有凌雲之態髙出塵寰得物外之妙嘗遍觀晉唐法帖而忽展此書不覺令人清爽當時沉香亭侍醉髙力士脫鞾宜矣時大德九年歲在乙巳正月草五日集賢學士張晏敬書前有野處墨林外史二印後有墨林硯癖逢山彥清端本家傳長宜子孫襄國張氏項子京氏檇李項氏世家寶玩諸印又杜本跋云唐人無不能書者蓋有其源流耳嘗聞趙文敏公之言以為賦詩作文及書與畫無不用工至於名世傳後則各有其品太白之書何如長史然豪雄渾壯固不異也杜本觀前有寄傲項叔子二印後有惠泉山樵項元汴印二印又歐陽元題云唐家公子錦袍仙文采風流六百年不見屋梁明月色空餘翰墨化雲烟歐陽元觀後有項墨林父祕笈之印一印又王餘慶記云至正丁亥正月乙卯金華王餘慶獲觀于同里陳達氏京師寓舍觀志之齊前有子京西疇耕耦二印又危素識云今日東陽童梓良仲攜此卷過余金臺坊寓舍獲觀之想其飄然有凌雲之思也臨川危素識前有幻浮神遊心賞二印又騶魯記云豐城騶魯觀於危太史家前有神遊心賞一印後有項元汴印子京父印又梁清標印蕉林祕玩二印押縫有河北棠村一印卷高八寸八分廣一尺一寸九分引首御題青蓮逸翰四大字上有乾隆御筆一璽御筆題籤籤上有御賞乾隆宸翰二璽唐顏真卿書朱巨川誥一卷上等宇一素絹本大楷書未署款姓氏見跋中卷後書年月處俱鈐尚書吏部告身之印共二十九印卷首有乾卦璽缺其半又文節世家一印又半印二存圖書二字卷後有陸友之印喬氏私印陳元時印寶藏諸印又喬簣成氏墨印一又半印三不可識押縫有寶藏印二拖尾有御前之印一璽又奉華堂印一印又紹興璽缺其半又半印二不可識又鄧文原跋云唐告多出善書者之手亦足以見一代文物之盛矧魯公道義風節師表百世其所書尤可寶也至大辛亥仲春草又二日古涪鄧文原書又喬簣成跋云右顏魯公書朱巨川告即宣和書譜所載者上有高宗乾卦紹興圖書而魯公之書蓋東坡先生已嘗論之矣不惟愛􅥬抑見唐代典故之式尤為可尚龍集辛亥仲秋朔喬簣成題又陸完跋云此唐德宗建中三年六月給授中書舍人朱巨川告身符年月職名之上用尚書吏部告身之印計二十九顆世傳為顏魯公書按唐式書符令史事也代宗之喪魯公以吏部尚書為禮儀使楊炎惡其直換太子少師領使事及盧杞益不容改太子太師併使罷之是時適在閒局而其忠義書法巍然為天下望巨川欲重其事特求公書亦如今世士大夫得請誥敕封贈多求善書者操筆同一意也米元章書史載朱巨川告顏書其孫灌園持入秀州崇德邑中余以金梭易之劉涇得余顏告背紙上有五分墨裝為祕玩王詵篤好顏書遂以韓馬易去此書今在王詵處宣和書譜載顏書亦有朱巨川告今卷中並無宣和印記獨存梁太祖御前之印前後押縫有宋髙宗乾卦紹興印耳豈舊藏御府靖康之亂散落人間南渡收訪應募者截去本朝璽跋耶然五代時既入御府則宋時不應在灌園處豈王詵所得乃别本耶不可得而知矣此卷作字雖小而與東方朔贊用筆同其為顏書無疑告中細書不知出何人唐制惟侍中中書令為真宰相其曰同中書門下平章事雖行宰相事而未為真中世以後藩鎮節度多授中書令故敕後細書首行云太尉兼中書令臣在使完是年四月盧杞忌張鎰出之鳳翔故第二行云守中書侍郎同中書門下平章臣張使其第三行云守給事中臣關播奉行杞愛播和柔易制是年十月即同平章事矣牒後細書首行云侍中闕第二行云守門下侍郎同平章事杞即盧杞也又吏部正員尚書一人侍郎二人其屬有四曰吏部司封司勳考功吏部郎中一人掌文官階品朝集祿賜告身尚書左右丞各一人掌辨六官吏户禮左丞總焉兵刑工右丞總焉故牒尾尚書侍郎左丞俱云缺而云判吏部侍郎范陽郡開國公翰者盧翰也後此二年為興元元年正月亦進同平章事符後書云判郎中滋者劉滋也貞元二年正月遂從吏部為左散騎常侍末後書令史不名益可驗此告非令史筆矣一展閲間而唐之典故歷歷可考且魯公書得其背紙墨蹟尚裝為祕玩况真蹟耶宜何如其寶愛之也正德丁丑五月望日陸完跋卷髙八寸三分廣五尺二寸御筆題籖籖上有乾隆宸翰一璽唐栁公權書蘭亭詩并後序一卷上等宙一素絹本行草書未署款姓氏見跋中卷首有睿思東閣貞元二璽又喬簣成氏墨印一卷後有泥金紹興一璽柯九思墨印一卷中有內府圖書璽三奉華寶藏印二又三印漫漶不可識前隔水有宋徽宗金書唐栁公權書羣賢詩八字下有雙螭一璽又伯起連印顧九德連印董其昌印鴻緒儼齊諸印押縫有宣和一璽又季雅江村祕藏雲間王鴻緒鑒定印諸印又御書璽缺其半後隔水有鼎元乾坤清賞有明王氏圖書之印鴻緒儼齊祕玩汝修顧氏藝閣珍藏諸印又宣和半璽押縫有政和宣和二璽拖尾記語有邢天寵借覽五字上有睿思東閣內殿書印二璽下有內府圖書一璽又奉華寶藏一印又祥符八年乙卯歲季夏月十日楊希甫十五字上鈐楊希甫記一印又蔡襄記云治平元年甲辰歲夏六月乙未朔十二日丙午㬠過在陳州項城縣吉義寺天王院內寄寓待慶糾何廓來年五月闕又記云嘉祐四年歲次己亥夏六月癸亥朔初五日丁卯㬠過時在蔡州淮安門裏街北監酒使臣廨署內寄寓虢郡日益習之謹志又記云嘉祐五年庚子歲八月丁巳朔初五日辛酉㬠過在汝南句祕校宗盛宅寄寓待陳州項城令姚闢來年三月闕莆陽蔡襄題又李處益跋云晉人宗尚元逺言皆曠淡唐室書法未墜筆力遒逸咸可觀焉宣和甲辰季秋六日平輿邑丞雒陽李處益又記語云緱嶺孫大年三槐王易政和四年七月草日同觀又黃伯思𨽻書跋云魏正始中務談元勝及晉渡江尤宗理以故郭景純始合道家之言而韻之孫興公許元度輩轉相祖尚又加以三世之辭而詩騷之體盡矣今山隂修禊諸賢詩體正爾然皆寄尚蕭逺軼跡塵外使人懷想深頃見晉人一帖云三日臨水詩文既佳興趣髙覽之增諸懷年少作亦各有心正謂此詩也是時預集者刪有一人今詩存者草六人而已此乃唐諫議大夫栁公權書故自不凡當為希世珍藏也政和元年十一月戊寅承議郎行祕書省校書郎臣黃伯思拜觀又記語云時明昌二年七月四日宋適題又記語云嵗壬戌夏四月六日淡游老人王萬慶題於潜玉堂又王世貞題云永和一敘筆神絶遺刻居然走千古興公文是擲地聲安石詩為碎金語羣賢爾時氣爭王那應零落同塵土絹素風神出豪鷙桞家新樣疇能覩鋒巨寧登由也堂委蛇恥效邯鄲步嗚乎開元以還骨格變誠懸亦是書中虎不辭傾槖為買將欲傍墨池追定武君不見魯男子矻矻可畏哉自云善學君之祖又跋云自禊敘出右軍筆玉匣蘭亭龍孫定武外石刻何啻百千本而孫興公文及諸賢詩寥寥無傳者獨栁誠懸少師嘗一録之見宣和書譜栁法遒媚徑健與顏司徒嫓美書家謂驚鴻避弋饑鷹下韝不足喻其鷙急去山隂室雖逺大要能師神而離跡者也余從顧氏所驟見之恍然若未識久看愈妙因損一歲奉獲之仍為歌志于後吳郡王世貞謹書又跋云公此書乍看之亦似有一二俗筆而久之則俗者入眼作嫵矣殆似髭聖之視羊鼻翁也鋒徑處真純鈎鐸矟遊絲細筆亦似鐵鑄中間一二行小楷以無意發之絶得晉人心印耳跋尾楊少師有書名乃不能佳宋適無書名乃致佳此亦不可曉也滄浪莆田海嶽無垢及長睿校書皆宋之諳八法者皆有跋淡游老人王萬慶庭筠兒也明昌金章宗年號然則此卷蓋入北矣萬厯改元初秋書于九江道中舟行如畫世貞又莫世龍跋云栁少師書興公後序及諸賢詩而不書禊帖政自不敢與逸少抗衡耳然此書每于險中生態枯潤鮮穠掩映相發豈後世所能髣佛者耶夫以昔人霏霏元著之談又得公書輒成兼美譬諸燕趙絶代快歌陽阿使人心愈目攝不能自制耳甲戌仲秋之望雲間莫世龍得觀于長安客舍因識年月又萬厯甲戌中秋日記八字小楷書上鈐太僕寺一印又乙亥中秋日記六字亦小楷書上鈐撫治鄖陽等處關防一又文嘉跋云栁誠懸行草鬱勃頓挫似顏魯公而乾濃畢備略無妍媚之態于此卷見之茂苑文嘉書又張鳳翼跋云唐人真跡世不多見矧誠懸為書家巨工者哉覽此卷不獨似山隂道上行亦可想見筆諫風度矣丁丑夏與錢山人穀暨仲氏獻翼同觀識此長洲張鳳翼又王鴻緒跋云栁太師自長慶間拜侍書學士以筆諫顯名逮事文宗有諍臣風平生博貫經術書法結體徑媚帝一日召與聫句賞其辭情具美命題于殿壁歎曰鍾王無以尚也當時大臣家碑志非其筆人以子孫為不孝外夷入貢者皆别署貨貝曰此購栁書嘗書京兆西明寺金剛經有鍾王歐虞褚陸諸家法自為得意史稱之者如此今觀所録蘭亭諸賢詩及後序入宣和御府收藏六璽燦爛宋名人俱有題識弇州公備極推許系以長歌董文敏刻之鴻堂帖中其為墨池瓌寶信不誣矣諦審其骨格遒徑中含姿態楷書數行與度人經一律自是栁家新樣至所云鍾王歐虞褚陸諸家法殆未可于筆墨蹊徑間得其髣佛始知古人妙處在師神而離跡故自目一家近代學書者流愈似而愈嫩去古人愈逺請以栁書為求度金針可也康熙五十七年冬十月草二日橫雲山人王鴻緒題于長安邸舍時年七十有四諸跋中押縫有貞元璽五雲間王儼齊收藏記一王儼齊祕玩印三江村祕藏印二又王儼齊鑒賞法書名畫髙士竒圖書記竹窗雲間王鴻緒鑒定印諸印卷髙八寸七分廣一寸一尺三寸六分唐杜牧書張好好詩一卷上等洪一素箋本行草書存三十七行餘缺前署張好好詩并序六字序云牧太和三年佐故吏部沈公江西幕好好年十三始以善歌舞來樂籍中後一歲公鎮宣城復置好好于宣城籍中後二年沈著作述師以雙鬟納之又二歲余於洛陽東城重覩好好感舊傷懷故題詩贈之卷首有神品𢎞文之印蘧廬張孝思項元汴印項子京家珍藏項墨林鑒賞章則之諸印卷後有宋犖審定梁清標印墨林懶叟項元汴印沮溺之儔諸印卷中幅有張則之項元汴印項子京氏田疇耕耨墨林項季子章張孝思諸印押縫有墨林項子京印袁笠生三印前隔水有宋徽宗金書唐杜牧張好好詩七字下有雙螭一璽又張覲宸蒼巗子張氏珍玩三印押縫有御書宣和二璽又天籟閣子孫世昌博雅堂寶玩印子孫永保墨林祕玩諸印又半印不可識後隔水有蕉林居士張覲宸二印押縫有政和璽二宣和一璽又退密子孫永保神遊心賞神品項墨林父祕笈之印項叔子諸印拖尾記語有京口懶逸張孝思珍藏祕玩十一字前有退密子孫永保項子京家珍藏項墨林鑒賞章檇李項氏世家寶玩諸印後有內府圖書之印張孝思張則之懶逸張氏珍玩北燕張氏珍藏蕉林玉立氏圖書觀其大略秋壑圖書諸印又記語有吳郡錢佑觀于西湖八字又寓吳伯顏觀五字大梁班惟志與仲亨子正敬思同觀十四字嚴陵汪鵬升永嘉薛漢同觀十一字又篆書大德九年吾衍觀七字後有商邱宋氏收藏圖書一印卷髙八寸七分廣五尺三分五代楊凝式夏熱帖一卷上等荒一素箋本草書尺牘一則卷前後項元汴印凡二又神竒連印墨林項季子章墨林祕玩項子京氏成子容芳楞伽真賞若水軒子京珍祕項墨林父祕笈之印楞伽子京所藏墨林山人成德楞伽山人諸印又容若書畫印凡二又卷前半印六暨卷後半印三俱漫漶不可識前隔水有楞伽山人成德容若二印押縫有神品楞伽二印後隔水有項元汴印項子京氏鴛鴦湖長寄傲子京所藏田疇耕耨虛朗齊曹溶鑒定書畫印項墨林鑒賞章檇李項氏世家寶玩趙孟俯印楞伽山人容若書畫墨林子子孫世昌桃花源裏人家諸印押縫楞伽印凡二又神品蘧廬墨林堂春草堂圖書印松雪齊瑞文圖書神遊心賞退密子京所藏子孫永保賢志堂印諸印拖尾王欽若𨽻書跋云右楊凝式墨蹟一紙字畫竒古筆勢飛動天地間尤物也公字與顏公一等俱稱絶異然公素不喜作尺牘後人罕能見此益可寶也紫薇閣王欽若定國題時大中祥符三祀天貺節日前有楞伽一印後有子京珍藏墨林項季子章成子容若楞伽真賞芾字詵字王莘之印王樂道印藏書洞印子京煮茶亭長諸印又項元汴印二又喬氏項墨林父賢志瑞文諸半印又半印不可識又鮮于樞跋云右楊景度行書山谷有云俗書祇識蘭亭面欲換凡骨無金丹誰知洛陽楊風子下筆便到烏絲闌為前輩推重如此王欽若在祥符天貺節尚有暇及此耶此帖絶無發風動氣處尤可寶也大德五年七月十九日直寄道人鮮于樞獲觀信筆書前有神竒項元汴印子京所藏墨林硯癖楞伽連印成子容若花間草堂諸印後有楞伽子孫世昌子京項子京氏墨林山人平生真賞諸印又趙孟俯跋云楊景度書出于人知見之表自非深於書者不能識也此帖沉著而又瀟灑真竒蹟可寶藏延祐丙辰歲十一月十三日吳興趙孟俯題前有成德退密項墨林父祕笈之印三印後有成子容若蘧廬楞伽真賞子京所藏楞伽墨林堂天籟閣子京父印子孫世昌項墨林鑑賞章檇李項氏世家寶玩曹溶連印墨林子田疇耕耨桃花源裏人家香界容若書畫諸印又張照跋云香光謂宋四大家並從楊少師津逮以造魯公之室此言非曽到毗盧頂者不能道夏熱帖世無刻本雖半漫漶存者如雲中龍爪令人洞心駭目松雪困學兩跋具是平生佳書張照敬記諸跋中押縫有楞伽一印卷髙七寸五分廣一尺二分御筆題籖籖上有內府珍祕乾隆宸翰二璽宋蘇軾自書詩帖一卷上等日一素箋本行書七言古詩一首款識云元祐元年二月草三日醉書下有趙郡蘇氏一印又卞永譽印式古堂書畫二印又一印不可識卷末李楶跋云用筆之妙如出鐫刻富家大族非貧窘所致徒羞縮耳舒城李楶觀元祐二年十二月晦卷前有式古堂書畫卞令之鑒定二印後有羅字鳳夀河中張氏懶雲窩珍藏三印前隔水有顓菴真賞印一印後隔水押縫有令之清玩一印式古堂印二拖尾萬金跋云右軍蘭亭醉時書也東坡答錢穆父詩其後亦題曰醉書較之常所見帖大相逺矣豈醉者神全故揮灑縱橫不用意于布置而得天成之妙歟不然則蘭亭之傳何其獨盛也如此至正二十年歲在庚子五月望日吳郡萬金題前有直指堂一印又鄭采跋云余嘗讀蘇公詩至數十篇怪其語率遂不讀而止今觀公自書答錢穆父詩其韻度頗類太白故知公之作如天地之生物妍醜精粗洪纎髙下隨物賦形耳是以深愧往者之謬將復取公全帙而盡讀之茍有所得其是詩之功耶若謂其書為何如余素不善書非所敢論也昆陽鄭采又僧清欲跋云東坡先生道德揭日月忠義貫天地文章翰墨雖髙出千古特其緒餘耳昔蘇潁濱與真淨文聖壽聰三公㑹于髙安夜二鼓同夢接五祖戒禪師詰朝而公適至從而感悟故南華詩曰我本修行人三世積精鍊中間一念失受此百年譴摳衣禮真相感動淚雨霰借師卓錫泉洗我綺語硯豫觀古今賢士夫鮮有不自僧中來者但隔隂都忘却翻轉面皮未始不與吾教作讐敵吁兹何圖耶求如公之悔過自責者能復幾人今觀答錢穆父長句酒酣落筆愈覺端謹以是知公平生造次顛沛確乎大節不可拔也天台碧劔泉寶襲久之俾豫著語因撮其梗槩云至正草年夏六南堂遺老清欲後有仙客卞令之鑒定二印又劉堪跋云堪年十五六時手鈔坡翁文若詩因得誦是詩已知富麗精妙為可愛也今劔泉師持翁書是詩墨蹟以示堪則書體雄健放逸又為可愛堪追念誦詩時已三十年三十年間詩翰皆不能學乎古人而少進焉觀翁詩翰之兼美獨無所愧乎哉彭城劉堪謹書又僧梵琦跋云此詩見東坡集中紙尾題元祐元年二月草二日醉書十一字以年譜較之元豐九年丙寅改元祐元年公以七品服侍延和改賜銀緋二月遷中書舍人尋除翰林學士送陳睦知潭州起句曰華清縹渺浮髙棟上有纈林藏石甕凡十韻末句曰湖南萬古一長嗟代與騷人發嘲弄集曰用前韻答西掖諸公見和今題為錢穆父借韻見和蓋未編次時書也細觀字畫真醉時所作黃太史跋坡字甚多云東坡道人少日學蘭亭故其書姿媚似徐季海至酒酣放浪意忘工拙字特瘦徑乃似栁誠懸中歲學顏魯公楊風子合處不減李北海又云髙述潘岐皆能贋作東坡書其論坡字如此真贋豈可掩耶固當與識真者詳辨耳至正草六年新春日楚石道人梵琦又張弼跋云此卷兵部武選郎中新昌俞振恭先生之所藏也前輩嘗評東坡書云溫潤豐腴如純綿裹鐵觀此信然學之者寧失其綿要得其鐵乃可耳成化三年丁亥七月四日雨霽新凉展閲數過遂書寅末華亭張弼識後有真率齊賞鑒令之卞永譽印式古堂書畫之印諸印又王顯祚跋云順治己丑元日西安藩司署中觀是日微雪初晴顯祚最後有萬厯五年春日吳郡湯少林重裝記語十三字押縫有式古堂印凡四卷髙七寸四分廣三尺六寸四分引首御題玉局風流四大字後有幾暇鑒賞之璽乾隆宸翰二璽御筆題籖籖上有乾隆宸翰一璽宋蘇軾書天慶觀乳泉賦一卷上等日二素箋本楷書卷後自識云庚辰歲七月十三日書未署名後有張子留侯之裔三不惑齊之印季鎮廣川開國成紀李氏華陽檇李李氏鶴夢軒珍藏記蒼巗子蕉林居士提舉淮南東路常平二字漫漶之印淮南東路轉運副使印日華李君實鑒定泰安州印諸印後李心傳跋云趙京兆所藏此軸竒偉特甚以歲月驗之蓋蘇公元符北歸所書也時方厄于章蔡之餘而人之貴重如此豈待百年而後定耶若夫筆老墨秀挾海上風濤之氣以平生所見論之當為海內蘇書第一紹定癸巳歲九月七日陵陽李心傳謹書後有成紀李氏一印又王遂題云天一生兮上浮羽人俟兮丹邱遡儋耳兮東注夾崑崙兮倒流嘉熙三年四月旦王遂題後有李肇亨印醉鷗二印又記語云尤焴劉厚南蔡抗林希逸王璞趙時煥髙斯得徐霖同觀於道山堂淳祐丙午季夏望日後有梁清標印蕉林玉立氏圖書二印又李肇亨印檇李李氏鶴夢軒珍藏記季鎮廣川開國成紀季氏諸印前隔水有蕉林書屋蒼巗子棠村審定諸印拖尾尤煓跋云此卷舊藏霅川向澤民家澤民以遺施武子甲戌歲同醉白記歸三桂晦夫姓歐陽梅聖俞嘗有詩贈之作八分體東坡跋數語于後今亦藏向氏云端平丙申暮春朔錫麓尤煓又王亞夫題云蘇公早聞道文章乃其戲乳泉出重海作賦聊紀異玉池咽中夜挈瓶非小智氣者水之生此語可深味淳祐甲辰孟夏朔峴山王亞夫書于西湖孤山之陽又陳仁玉題云坡翁謫海上人傳已仙去道逢章子厚遄復返塵路至言恐世驚猶閟乳泉賦遙憐嵩山邱千古不可駐是日仙居陳仁玉同書後尤煓又題云萬籟既寂一氣孔神吸彼沆瀣沃此肺膺至陽之精天一所生欽哉此詞展也大成煓又謝奕修跋云乳泉賦不待多贊特恨此軸尚有餘紙安得起坡翁書滿卷後耶天台謝奕修書于西湖淳祐甲辰首夏望後二日又孫子秀題云腥波暗天濁浪翻日蛟蜃元鼉之所出沒有屹其島清泉中發靜涵太虛寒侵孤月汲之無窮元氣所泄古今正理不可泯滅抑斯泉也為斯人設㑹稽孫子秀書後有季鎮廣川開國成紀李氏華陽諸印又宋濂跋云蘇長公以紹聖四年丁丑二月謫授瓊州别駕安置儋州六月渡海七月十三日至儋僑寄城南鄰于天慶觀觀有乳泉故公為援筆賦此元符三年庚辰公居儋已四年㑹正月祐陵登極大赦天下五月移公廉州六月還瓊復渡海至廉七月又以皇長子生國有大慶遷舒州團練副使量移永州八月終方自廉啓行賦後題云庚辰七月十三日書則正在廉時也十一月行至英州又復朝奉郎提舉成都府玉局觀任便而居公遂度嶺南還明年為建中靖國元年辛巳五月至毗陵六月因疾告老以本官致仕七月草八日遂薨公之書是賦時年已六十有五距其薨僅隔一歲實為晚年之筆李侍郎微之謂其筆老墨秀挾海上風濤之氣當為海內蘇書第一誠知言也哉濂嘗見漳水酈元輿跋公眉子石硯歌四十五字斷簡謂曰百閲而弗之厭使其見此吾知其必曰百拜而不止也然公之薨未幾辭翰皆為世大禁而狗鼠之徒如霍謹英輩猶鳴吠不已磨剗焚焫無所不用其極而斯卷無纎毫不完豈公妙墨所在或有鬼物呵護之耶金華宋濂謹書後有蕉林祕玩觀其大略二印又楊一清跋云是卷為蘇書第一前輩已有定論其所著述亦第一等議論也豫渡清淮望第一山盱眙陳質之出所藏相示不圖今日得數竒觀非平生第一快事耶𢎞治丙辰仲冬望後三日陜西按察司提學副使石淙楊一清最後李肇亨記云宋蘇文忠公匹紙正書乳泉賦與歐陽晦夫手書真蹟宋人題觀凡九段明人題二段崇禎己巳臘月得于甪里包氏鶴夢軒寶藏記下有李肇亨檇李李氏鶴夢軒珍藏記二印諸跋中押縫泰安州印凡四杭州通判之印一印成紀李氏印二華陽一印髙九寸廣一丈一尺八寸宋蘇軾書近作三篇一卷上等日三素箋本行楷書第一篇黃庭內景經像贊第二篇陸探微畫獅子贊第三篇韓幹畫馬跋款識云元豐二年端陽月書近作三篇軾上鈐趙郡蘇氏一印卷前有天籟閣西秦張瑛項元汴印姚豸王英時彥張髯審定諸印又吳鍾公孫後人圖書劉侃印俊華諸半印卷後有檇李項氏世家寶玩退密若水軒墨林子項篤壽印柯敬仲氏應龍私印張髯審定林彥章氏黃宗豫氏諸印又吳興少溪項子喬氏秋壑諸半印卷中幅有項子京氏顏樂齊項墨林鑑賞法書名畫六藝之圃田疇耕耨諸印拖尾有天籟閣項元汴印項子京氏三印卷髙八寸五分廣四尺五寸五分御筆題籖籖上有內府珍祕乾隆宸翰二璽宋蘇軾尺牘一卷上等日四素箋本行書卷後有子瞻一印拖尾董其昌跋云東坡先生此卷乃海外書不復作徐季海圓秀態將以顏清臣之徑王僧䖍之淡收因結果山谷所謂挾以文章忠義之氣當為宋朝第一者不虛也董其昌觀因題卷髙九寸一分廣二尺六寸九分御筆題籖籖上有御賞乾隆宸翰二璽宋黃庭堅書贈雲菴道人歌行一卷上等月一素箋本草書款識云大觀丁亥春正月燈節後三日為雲菴道人題庭堅下一印暨卷前半印俱不可識拖尾鮮于樞跋云黃文節公之筆如錐畫沙如印印泥無㸃畫之有差失此詩乃贈雲菴道人作雲菴即相傳辟穀棄家者其他詭祕不盡述蓋亦有道之流覩文節數語可想見其人矣鮮于樞伯幾父題卷髙九寸九分廣二尺八寸九分御筆題籖籖上有乾隆宸翰一璽宋米芾苕溪詩一卷上等盈一素箋本行書前款云將之苕溪戲作呈諸友襄陽漫仕黻後識云元祐戊辰八月八日作卷前有獨字小號又神竒神品墨林項子京氏項墨林鑒賞章桃里項元汴印墨林生子孫永保諸印又居士真賞全卿家珍藏諸半印卷後有紹興一璽又神品寄傲項元汴印項子京家珍藏田疇耕耨檇李項氏世家寶玩墨林硯癖蘭雪齊天籟閣士竒之印楊氏家藏武林錢子章玉鑒賞圖書六藝之圃蒼巗子梁清標玉立氏印章全卿真賞西楚王孫毛氏西疇珍玩陸父子京珍祕桃花源裏人家伯幾印章鮮于諸印又蘧廬墨林全卿半印三卷中幅有墨林祕玩印二又墨林項元汴印沮溺之儔墨林生鴛鴦湖長退密子京父印項墨林鑑賞法書名畫墨林項季子章諸印押縫有睿思殿印三璽又退密子孫世昌墨林項季子章長字項子京印若水軒蘧廬有何不可諸印前隔水有子京所藏項墨林鑑賞章二印後隔水押縫有安定冶溪漁隱二印引首有篆書米南宫詩翰五大字前有天籟閣項叔子二印後有項墨林父祕笈之印宫保世家武林錢子章玉鑒賞圖書諸印拖尾米友仁跋云右呈諸友等詩先臣芾真蹟臣米友仁鑒定恭跋前有神品子京珍祕墨林祕玩三印又父印全卿之印半印三後有子孫世昌子京平生真賞項墨林父祕笈之印檇李項叔子回俗亭子孫保之全卿珍賞蕉林梁氏書畫之印缺氏珍藏圖書武林錢子章玉鑒賞圖書吳原博印諸印又野處墨林半印二又李東陽跋云右米元章詩翰有紹興及睿思殿圖印其子友仁題其後稱先臣芾蓋君前臣名之義也元章書極精妙而友仁亦有家法父子並美自羲獻以後亦鮮聞之書法真贋每相混淆如米氏者江南僞本不知其幾此卷妙處望而可知太宰水村陸先生檢諸故篋重加表飾物之顯晦固自有數哉先生方操黜陟之柄振幽起滯天下之士賴以不汨沒于世者多矣識者幸毋以一事觀之正德丙子二月十二日長沙李東陽題前有寄傲項元汴印項墨林鑒賞章三印又處字軒字半印二後有退密子京父印墨林祕玩子孫世昌諸印押縫有蒼巗子冶溪漁隱元汴之印墨林外史項墨林父祕笈之印香巗居士子京珍祕子孫世昌諸印最後項元汴記云宋米元章苕溪詩帖友仁子跋李東陽識墨林項元汴真賞明嘉靖四十三年春裝池購于陸冢宰家又獨字小號又記云嘉靖庚戌秋閏月草日少林湯傑裝池于石翁山館記耳卷髙九寸五分廣五尺八寸三分御筆題籖籖上有乾隆宸翰內府書畫之寶二璽宋米芾拜中嶽命詩一卷上等盈二素箋本行書卷前署拜中嶽命作五字下署芾字前有全齊史繼源有孚氏祕竒閣圖書二印卷後有叶一堂珍玩書畫圖章劉德駕書畫記柯氏敬仲三印通卷押縫有御前之寶紹興各二璽又劉德駕書畫記印駙馬都尉永春侯圖書蔡汝楠印吳翁升氏晉昌諸印拖尾倪瓚跋云大蘇公謂米南宫清雄絶俗之文超妙入神之字當時已為識者所賞如此况後世誦其詩觀其書蹟者哉至正十三年癸巳歲正月七日陸養正出此見示于元素齊中觀已謹識倪瓚後有駙馬都尉永春侯圖書唐宇昭印朗波居士三印卷髙九寸一分廣三尺三寸二分引首御題南宫逸翰四大字款識云乾隆甲子嘉平月除夕前一日御題後有勤學好問乾隆宸翰二璽御筆題籖籖上有神品乾隆宸翰二璽元趙孟俯書待漏院記一卷上等昃一宋箋本行書款云孟俯書下有趙子昻氏趙氏書印二印卷首有積雪齊歸來印二印卷末有希之一印引首有篆書松雪墨妙四大字前有天籟閣項叔子二印後有檇李項子京家珍藏二印拖尾錢惟善跋云待漏院記孰不知而誦之承旨魏公為之書于是乎生民休戚有所賴官針邪正有所規寧獨夸翰墨以為觀美為人臣子者可不思所以自省曲江居士錢惟善前有希之一印卷髙八寸七分廣五尺四寸二分元趙孟俯書晝錦堂記一卷上等昃二宋箋本行書款識云歐陽永叔此記直記其事蓋一筆揮就善于形容者耳延祐七年八月三日快雨時晴天氣晶明書于松雪齊子昂下有趙氏子昻一印卷前有大雅趙字二印又軍假司馬一印卷中幅押縫有合同鷗波各二印卷髙一尺廣五尺四寸元趙孟俯跋定武蘭亭一卷上等昃三宋箋本行楷書凡十二則第一則款識云至大三年九月十六日舟次寶應重題子昻下有趙子昂氏一印第二則署十八日清河舟中七字下有趙字一印第三則自識云草二日邳州北題下有趙子昂氏一印第四則無款印第五則自識云草三日將過吕梁泊舟題下有天水郡圖書印一印第六則自識云草八日濟州南待閘題下有趙子昻氏一印第七則自識云是晚濟州北三十里重展此卷因題下有趙子昻氏一印第八則自識云十月一日下有趙字一印第九則自識云十月二日過安山北夀張書下有趙氏書印一印第十則自識云三日泊舟虎陂待放閘書下有趙子昻氏一印第十一則自識云七日書下有趙氏子昻一印第十二則無款印通幅前後有子京所藏若水軒項子京家珍藏宫保世家平生真賞項墨林父祕笈之印墨林外史隱居放言桃花源裏人家遊方之外墨林硯癖香巖居士有何不可博雅堂寶玩印田疇耕耨南華仙史項墨林鑒賞法書名畫沮溺之儔㑹心處項元汴氏審定真蹟檇李項墨林鑒賞章宋犖審定揚州季因是收藏印元汴之印墨林堂西疇耕耨諸印又項元汴一印前後押縫有墨林子印三又寄傲項墨林鑒賞章退密逸民諸印又二印不可識前裝定武搨本蘭亭叙一卷卷前有紹興一璽趙孟俯一印又季氏世外法寶項子京氏項元汴印清玩墨林祕玩煮茶亭長諸印後有紹興一璽又天水郡圖書記墨林項季子章子京珍祕宋犖審定諸印前隔水有吳廷書畫之印一印後隔水有項元汴真賞五字又神品揚州季因是收藏印寄傲項子京家珍藏項墨林鑑賞章子京野處癖茶逸士物外元賞檇李項氏世家寶玩季寓庸印因是氏用卿諸印又吳廷二印押縫有天籟閣印二又子孫世昌印二退密印二項墨林鑒賞章項子京家珍藏平生真賞江村諸印又退密鴛鴦湖長精舍半印三又半印不可識拖尾錢惟善題云萬金難購蘭亭帖定武刻本妙逼真區區模擬何足數獨稱貞觀四名臣惟善重題後有神竒平生真賞項墨林父祕笈之印吳廷之印墨林懶叟項叔子諸印又孫大雅記云霜融日暄觀于上竺道室老眼為之增明同