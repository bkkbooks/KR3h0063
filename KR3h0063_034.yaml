body:
  text: 貯養心殿列朝人書畫畫卷次等五代周文矩牧羊圖宋徽宗秋塘山鳥圖宋董源夏山欲雨圖宋郭忠恕臨王維輞川圖宋郭熙樹色平逺圖宋李公麟畫歸去來詞圖宋李公麟竹林七賢圖宋李公麟九歌圖宋陳居中蘇李别意圖宋謝元畫折枝碧桃宋陳自明花草元趙雍黃公望合卷元黃公望沙磧圖元黃公望溪山無盡圖元黃公望溪山雨意圖元黃公望畫九品蓮花元王振鵬畫伯牙鼓琴圖元倪瓚壺月軒圖元吳鎮畫竹元吳鎮萬峰幽壑圖元任仁發神駿圖明吳偉蘆雁明沈周秋窗客話圖明沈周溪橋雨景明沈周大夫松圖明仇英晴江春色圖明徐渭寫生明莫是龍湖山佳趣圖明沈士充雪景山水明張復秋山行旅圖無名氏書畫目録畫卷上等宋人寫梅花詩意畫卷次等宋人蘆雁宋人牧羊圖宋人摹郭忠恕四獵圖元人支遁洗馬圖元人四孝圖明人釣月亭圖明人畫瑞應圖明人畫騶虞圖明人長江萬里圖國朝人書畫目録畫卷上等王武花草寫意查士標烟江獨泛圖赫奕倣董其昌宿雨含烟圖冷枚倣仇英漢宫春曉圖畫院丹臺春曉圖畫院慶豐圖畫院清明上河圖畫卷次等髙簡探梅圖徐枚畫江南春王原祁西嶺雲霞圖蔣廷錫花草張若靄臨李迪荔子圖鄒一桂百花圖丁觀鵬太平春市圖余省倣林椿花鳥列朝人書畫目録書畫合卷上等唐閻立本孝經圖褚遂良書明唐寅臨李伯時飲仙圖並書歌明唐寅畫蘭亭文徴明書序明文徴明林泉雅適圖並書七言長句明陳淳源東圖並書嶽陽樓記書畫合卷次等明文徴明輞川圖王榖祥書詩明文徴明赤璧圖祝允明書賦明文徴明遊西山詩並繪圖
