front:
  text: 欽定四庫全書石渠寶笈卷三十一
  hash: sha256:c2a91afda77ed5543b1dcf7aa5c8c9c1725d533b8822c00c120dbaaedc545468
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_065-1a, image: WYG0825/WYG0825-0250a.png}
body:
  text: 貯御書房四列朝人書卷次等晉王羲之平安何如奉橘三帖一卷次等天一素箋本凡三則前隔水有晉王羲之奉橘帖七字下有宣和一璽卷後有開皇十八年三月草七日十字又諸葛穎桞顧言釋智果題名三拖尾有歐陽修韓琦吳中復吳奎劉敞蔡襄陸經唐詔王繹諸題名又舉正曾觀四字姓氏未詳又張靖諸人記語一又張孝思孫承澤項元汴記語三張孝思又跋語一又張覲宸項元汴記語二唐明皇賜毛應佺知恤詔一卷次等地一素箋本行楷書卷後署十七日三字又大書敕字拖尾有張雨文徵明二跋又項元汴記語一唐褚遂良摹王羲之長風帖一卷次等元一素箋本草書姓氏見跋中拖尾有曾棨董其昌王廷相汪道會諸跋唐張旭四帖一卷次等黃一素箋碧色箋相間凡四則草書第一則第二則書五言詩第三則書王子晉讚第四則書衡山老人讚無款董其昌定為張旭書拖尾有豐坊跋二董其昌跋一唐懷素自敘帖一卷次等宇一素箋本草書自識云大歷丁巳冬十月草有八日拖尾有蘇耆李建中邵周王紹顔邵篪諸記語又杜衍題句一又蔣之竒蘇轍蔣璨跋語三唐顔真卿爭坐位帖藁一卷次等宙一素箋本卷前署云金紫光祿大夫檢校刑部尚書上柱國魯郡開國公顔真卿謹奉書于右僕射定襄郡王郭公閣下拖尾有張治跋一王時敏𨽻書跋一宋孝宗賜周必大手敕一卷次等洪一誥敕箋本行楷書卷後署敕字又隆興元年三月草四日九字俱鈐御書之寶璽各一拖尾有董其昌跋一宋黃庭堅書七言絶句一卷次等荒一素箋本行楷書凡三首款云庭堅書拖尾有林雲程跋一宋黃庭堅書蘇軾海棠詩一卷次等荒二素箋本草書款識云子瞻在黃州作海棠詩殆古今絶唱也晦叔乞書故為落筆魯直拖尾有趙彥徵跋一又行書釋文後署煙霞外史漫録六字又董其昌跋一宋黃庭堅書髙松賦一卷次等荒三素箋本行楷書款識云元祐二年冬十月山谷道人黃庭堅書拖尾有仇逺貢師泰杜瓊諸跋宋黃庭堅書李白詩一卷次等荒四素箋本草書無款姓名見跋中拖尾有張鐸沈周二跋宋米芾臨定武蘭亭一卷次等日一素絹烏絲闌本無款卷後有米芾一印拖尾有周文褎書蕭翼賺蘭亭事實並跋語宋薛紹彭臨蘭亭序一卷次等月一素絹烏絲闌本無款卷後有薛紹彭一印拖尾有錢良右記語一倪瓚跋一文徵明題識一宋朱子自書五言古詩一卷次等盈一素箋本大楷書款識云乾道六年庚寅歲季秋望新安朱熹書宋陸遊詩翰一卷次等昃一素箋本行草書七言古詩款識云省庵兄以為此篇在集中稍可觀因命寫之遊引首李東陽篆書放翁詩翰四大字拖尾有陸釴謝鐸程敏政王鏊周經楊循吉沈周諸跋宋文天祥書木雞集序一卷次等辰一素箋本草書款識云咸淳癸酉長至里友人文天祥書於楚觀拖尾有宋獻諸人記語又宋玨記語一元趙孟俯書國語晉文請隧一卷次等宿一素絹本行書款識云仲時雅好作古文從余有年皇慶元年三月草三日過松雪齋持佳絹乞書此文余喜其識見與志俱非近小也故樂為録一過子昻卷後有張翥跋語拖尾有金琮跋語凡三則錯綜書元趙孟俯書千文一卷次等宿二素箋烏絲闌本小篆款識云大德三年吳興趙孟俯篆卷末項元汴記語一未署名引首有梅珊篆書筆端造化四大字元趙孟俯書千文一卷次等宿三素箋烏絲闌本行書款云吳興趙孟俯書拖尾有董其昌跋一最後有項元汴記語一元趙孟俯自書詩帖一卷次等宿四素絹烏絲闌本行書五言古詩六首款識云至元庚辰秋仲既望吳興趙子昻書于清逺堂元趙孟俯書洛神賦一卷次等宿五素箋本行楷書款署子昻前隔水有王鐸記語一拖尾有李路𨽻書跋一又髙啓王鐸曹溶諸跋元趙孟俯書明肅樓記一卷次等宿六素箋本行楷書款署吳興趙孟俯元鮮于樞書杜詩一卷次等列一素箋本行書款識云右工部行次昭陵詩困學民書拖尾有王禕宋濂二跋元鮮于樞書御史針一卷次等列三素箋本大楷書自識云右御史針大德三年七月十七日書姓名見跋中後隔水有趙孟俯跋一拖尾有鄧文原張楧周馳湯炳龍樂元璋郭大中泰不華莫昌諸跋又仇逺諸人記語一元鮮于樞書王安石雜詩一卷次等列三素箋本行草書七言古詩一首五言古詩三首款識云右荆公雜詩至元辛卯二月八日過君錫真味堂出紙命書遂為盡此君錫書法得前人之正又所收祕笈在諸家法帖上亦須拙筆亦愛忘其醜之意耶鮮于樞記拖尾有邢侗跋一元張雨自書詩帖一卷次等張一素箋本行書凡二則前則七言古詩一首七言絶句一首自識云録此卷時在石窗燈下余年五十有二也後則五言律一首七言絶句二首款識云至正二年冬句曲張雨拖尾有吳寬黃雲文徵明諸跋元眀人詞翰一卷次等寒一凡八幅第一幅素絹本趙孟俯草書陶詩第二幅素箋本張翥行書尺牘又五言排律一首第三幅素箋本姚樞楷書尺牘第四幅素箋本龔璛行書五言古詩第五幅素箋烏絲闌本周伯溫行楷書筆説第六幅素箋本楊基楷書憫獨賦第七幅素箋本王逢行書五言古詩第八幅素箋本宋克草書五言古詩明人墨迹一卷次等來一凡十一幅第一幅素箋烏絲闌本沈度𨽻書款識云右唐岑參漁父詩自樂𨽻古第二幅素箋本吳寬行書七言律詩一首款識云日來疏懶承命所作止此望勿以不如數見罪為幸新得沈􅋯樵畫一片聊奉去乞笑納萬萬寬再拜第三幅印花箋本祝允明行書七言律詩一首款云友生祝允眀頓首第四幅藍箋本祝允眀行書七言絶句一首款識云草一日允明頓首元和徵君知悉第五幅素箋本徐禎卿楷書七言絶句二首款識云久擬枉片帆奉訪舟次江隂又復不果東望悵然因書舊作託沈辨之以將情云八月十二日禎卿再拜子儋先生翰學第六幅素箋本唐寅行書七言絶句四首款云吳趨浪子唐寅第七幅印花箋本唐寅草書七言絶句三首款云唐寅戲書舊作第八幅素箋本唐寅行書尺牘後署唐寅再拜衡山先生足下第九幅素箋本文徵明行書蘇軾七言古詩款識云余少時頗喜師玉局公作字比年以來忘之久矣辨之嘗得余山谷體詩帖因以此紙請配漫録玉局僧伽塔詩所謂一解不如一解也庚申璧書第十幅素箋本文徵明行書尺牘後署徵明肅拜子庸茂才第十一幅素箋本王寵行書五言律詩欵署王寵後有陳淳周天球王世貞陸曾熙王雨謙諸跋明沈粲千文一卷次等暑一灑金箋本草書款識云足庵徐先生之孫墱好學不羣侍其尊府來京師間持此卷求書千文因寫以答庶足以酬其世契之好云時正統丁邜四月草又七日簡庵書于南薰里之官舍引首有篆書几上空青四大字欵署西園拖尾有張弼跋一明李東陽自書各體詩一卷次等往一素綾本行書五言古詩三首五律二首七律三首五言絶句八首款識云舊作數首偶為雲崖老兄録一過回思曩昔忽忽如夢中語亦可慨也西涯卷後有吳寬跋一引首東陽自書翰署餘情四大字明沈周書中秋詩一卷次等秋一素箋本行書七言古詩款識云𢎞治己酉八月望後書于雙峨樓長洲沈周卷後宋鴻書和詩並跋一引首有張瑞圖書靜月二大字明沈周書化鬚疏一卷次等秋二素箋本行楷書前序云茲因趙鳴玉髠然無鬚姚道存為之告助于周宗道者於其于思之間分取十鬛補之不足請沈啓南作疏以勸之後款云化緣生沈周識明王守仁自書詩帖一卷次等收一灑金箋本草書七言律詩五首款識云陽眀山人書于碧霞山房時正德辛巳至後十日也又二首識云至後又十日陽明山人復書又一首款云秋夜陽眀書引首陳淮篆書名賢翰墨四大字明祝允明書千文一卷次等冬一金粟箋本草書款識云余筆雖拙素不書此癸未閏四月望後過雲莊樓酒次出涇紙索書千文自與雲莊誼厚勉為書此誠為貽笑于大方也枝山老樵祝允明明祝允明詩帖一卷次等冬二金粟箋本草書七言律詩九首款云枝山書明祝允明書七言律詩一卷次等冬三灑金箋本草書款識云乙酉秋日叢桂堂酒次書枝山道人明祝允明詩翰一卷次等冬四凡十幅第一幅素箋本行書五言古詩一首款識云𢎞治丙辰枝指道士允明書第二幅印花箋本行書五言律詩一首款識云丁邜秋日復寓金陵辨之亦至客窗寫此圖一破顔枝山允明第三幅印花箋本行書樂府二首款識云偶憶二詩書詒辨之枝山允明第四幅素箋本行草書樂府一首款識云丙寅春半初晴過辨之几上筆墨之便寫此舊作一二允明第五幅印花箋本行書七言絶句二首款識云正德二年六月草日允明藁俟他日見之亦可想一時情事也第六幅印花箋本行書七言古詩一首款識云丁邜夏僑建康雞鳴山下偶然賦此不足為他人道也會辨之繼至問及新作來已二月止此而已辨之視豫在家時况味何如也辨之先歸持示故知當同此一笑允明第七幅印花箋本行書詞一闋款識云此調蓋眼兒媚作于數年前亦忘之矣今日到金陵見於友人扇上遂書一過詒辨之沈君且圖存稿耳允明第八幅素箋本行書七言律詩一首款云枝山居士允明書歸辨之一笑第九幅印花箋本行書七言絶句一首款識云邜夏書與辨之沈子允明第十幅印花箋本行書七言律詩一首款云允明漫筆前隔水有己邜秋七月雨中文徵明十字拖尾有文嘉孫沐史際邢侗張問仁王同休趙淳卿劉稚孫吳奕詹景鳯孫校諸記語又陳淳盧襄朱承爵顧嶼馬濬顧岎文彭王圖豐坊王良諸跋明祝允明雜書一卷次等冬五素箋本凡三幅第一幅楷書畸崖記第二幅𨽻書譙樓鼓聲記第三幅行書魂遊曲林記款識云允明作字倫弟多在側今謂允明無一筆在彼因草草書此文歸之弟豈謬喜允明字而為是誑語耶雖然亦不足以厭其意他日字學稍進當重疉有贈恐弟更厭我乎辛亥三月之晦拖尾有王稚登跋一明祝允明書離騷首篇一卷次等冬五素箋本草書款識云𢎞治九年秋九月朔日既望書于日新堂枝山祝允明明祝允明書宋儒六賢傳志一卷次等冬七宣德箋烏絲闌本小楷書分段署目凡六則濓溪先生行録康節先生墓志銘明道先生行狀伊川先生年譜橫渠先生行狀文公先生行狀欵云後學祝允明書引首有馬安書京兆真迹四大字拖尾又馬安跋一明祝允明雜書詩帖一卷次等冬八素箋本草書箜篌引美女篇白馬篇名都篇四首款識云冬日烈風下寫此神在千五百年前不知知者誰也枝山明祝允明詩帖一卷次等冬九素箋本草書七言律詩八首款署允明明文徵明書醉翁亭記一卷次等藏一素箋本行書大字款識云嘉靖十六年春二月草又一日書徵明明文徵明自書七言律詩一卷次等藏二灑金箋本行書凡十首款識云顧文學承之以此卷索書病懶因循久而未復六月之朔家居稍暇為録舊作數首昔歐陽公謂夏月據案作書可以消暑忘勞區區揮汗運筆祗覺困頓耳是嵗為嘉靖草又七年戊申余年七十又九矣徵明識卷後有錢虞山跋語一明文徵眀題宋髙宗賜嶽飛手敕詞一卷次等藏三素箋本楷書款識云右題宋思陵與嶽飛手敕墨本調寄滿江紅書似伯起評教徵明時年九十拖尾有袁尊尼彭年周天球黎民表龍膺皇甫汸文嘉詹仰庇王延陵張獻翼陳宣馮大受張鳯翼諸跋又余繼善顧大典文震孟諸記語明文徵明自書詩帖一卷次等藏四素箋本行書七言律詩二首款識云嘉靖壬寅三月草又四日書于東禪精舍徵明明文徵明書四體千文一卷次等藏五素絹烏絲闌本凡四幅第一幅楷書款識云嘉靖壬寅歲春二月九日徵明書于東雅堂第二幅草書款識云嘉靖甲辰夏四月既望徵明書於石湖舟中第三幅𨽻書款識云嘉靖乙巳八月二十有二日徵明書第四幅篆書款識云比嵗子脊以尺素索余書四體千文余素憚煩于此而辭之不獲勉為書之凡七年始完不惟不工不足供玩而徒費嵗月良可惜也戊申徵明識引首陸師道篆書衡翁四體千文六字拖尾有文嘉陸師道二跋明文徵明書前後赤壁賦一卷次等藏六素箋本行草書款識云嘉靖甲寅冬十月既望是夕初寒不能就枕因命童子篝燈書此聊以遣興工拙不暇計也時年八十有五徵明引首有查繼佐書意在削石四大字又識語一明文徵明自書七言律詩一卷次等藏七素箋本行楷大書款署徵明明文彭臨懷素自敘帖一卷次等閏一素箋本款識云偶得宋刻自敘帖戲臨一過三橋文彭明文彭書七言律詩一卷次等閏二灑金箋本草書凡七首款識云隆慶庚午九月書三橋文彭明王寵雜書一卷次等餘一素箋本行書凡四幅第一幅第二幅第三幅俱尺牘款署弟寵第四幅自書七言絶句三首款署履吉書前隔水有徐天瓊記語一後隔水又天瓊跋一明王寵書莊子內七篇一卷次等餘二素絹本小楷書款識云余昔年過補庵先生劍光閣見虞永興手書漆園內篇筆法絶似度人經而遒媚過之披次心賞留舟中閲數日不忍釋手丙子春王豫再過梁鴻溪上補庵持素縑屬豫手摹永興腕法書成七篇三閲月始報命要亦優孟衣冠虎賁之貌殊足愧也正德十一年月之望雅宜山人王寵識拖尾有文徵明文彭許初諸跋按此卷與貯乾清宫上等月一一卷次等宙一一册欵識皆同而神力較月一一卷稍遜亦係臨本也明王寵詩帖一卷次等餘三素箋本行草大書七言絶句六首款識云壬辰九月二日雨中書越溪病子王寵履吉父引首有越宦光篆書雅宜佳草四大字明王寵書韓愈送李願歸盤谷序一卷次等餘四印花箋本草書款識云己丑端陽日與原承修伯日宣燕石湖草堂醉後書此歸之原承他日展玩可識蹤迹書不足道也雅宜子寵明王寵書雜詩一卷次等餘五灑金箋本草書七言古詩一首五言律詩九首款識云嘉靖甲申十月十一日吳門王寵履吉甫書拖尾有黃之璧跋一明王寵書雜詩一卷次等餘六素箋本草書五言古詩二首五律二首七律四首七言絶句二首款識云壬辰秋日卧疴山房間寫雜詩數章呈明水先生求正雅宜山人王寵拖尾有徐渤跋二又文震亨跋一明陳淳書秋興詩一卷次等成一素箋本大草書款識云右杜少陵作甲辰春日白陽山人道復書明李夢陽詩帖一卷次等嵗一灑金箋本草書唐人詩凡二則前則八首識云已上為陳子昻集後則六首識云已上為杜審言集夢陽書明陸深書沛水行一卷次等律一灑金箋本行書款識云此詩豫戊辰嵗南還南徐道中所作後三年北上舟行觀漂痕敗渠水㶁㶁終夜鳴追想舊今感慨係之因寫寄王嘉定天宇天宇文古政通方有大志于拯救恐不可不聞余斯言也正德辛未夏四月四日三汀陸深書於吳淞舟中明朱潢南書應制詩一卷次等吕一素箋本行草書七言律詩十二首款署潢南道人明莫如忠自書詩帖一卷次等調一素箋本行書凡二幅首幅書七言律詩四首款識云中江莫如忠書後幅書五言古詩一首款署如忠明彭年臨蘇軾歸去來辭一卷次等陽一素箋本行楷書款識云余偶得東坡先生石刻此本椿齡上人見之愛玩不已因書以贈平日未嘗致臨摹之工而漫然著筆刻鵠之誚其容免乎嘉靖癸亥七月既望隆池山樵彭年識引首有許初書漫然著筆四大字明徐渭書千文一卷次等雲一素箋本草書款云徐渭書明許光祚書琴賦一卷次等騰一灑金箋本小楷書款識云右嵇叔夜琴賦丙辰秋日漫録于清真堂時年六十有六關西許光祚明董其昌書五言古詩一卷次等致一素絹本草書三首款識云久不作醉素書今夕徐通政貽桑落酒飲之大醉放筆書此詭形怪狀即不無屋漏折叉未夢見在不須後人評量也董其昌拖尾有王思任跋一明董其昌書雲笈一卷次等致二素絹本行書款識云壬子嵗除夕前一日書以為獻嵗發願學道之契董其昌明董其昌雜書一卷次等致三朝鮮箋本行書前書王安石金陵懷古詞一首自識云王荆公詞東坡稱服曰此老狐精也蓋不奈荆公何與荆公稱表忠觀碑事同看後書蘇軾赤壁懷古詞自識云山谷嘗以本家筆書東坡赤壁詞余以米海嶽書意為之米嘗自謂名在蘇軾黃庭堅之間不入黨與然坡公所作韓魏公贊余見米迹嘗亦書此詞恨世無傳耳後臨米芾詩帖三首自識云右米詩刻余家戲鴻堂帖又自書書評四則款識云戊子又四月十二日雨舟筆董其昌明董其昌書毛仙翁傳一卷次等致四素絹本行楷書款云董其昌書按此卷凡二篇前為裴度語後乃杜光庭撰傳今傳止存四行餘疑脫去又卷首書毛仙翁贈行詩六字固知卷後尚應有詩今并逸去也明董其昌書額一卷次等致五朱箋本楷書九如樓三大字款云其昌書明董其昌自書詩帖一卷次等致六金箋本行書七言律詩五首款識云舊作書似致虛詞宗覽正丁邜四月董其昌明董其昌書髙都護驄馬行一卷次等致七素絹本草書款識云杜子美畫馬歌詩皆竒宕有氣唐時曹霸韓幹雖一代名手亦幸與子美同時畫已無傳詩中自有畫也董其昌識明董其昌書王公弼誥一卷次等致八素箋本行楷書款識云賜進士出身資政大夫南京禮部尚書前禮部左侍郎兼翰林院侍讀學士纂修兩朝實録副總裁經筵講官華亭董其昌又識云今上嗣服式序在廷尤毖簡大藩王公以嶽伯領諸侯當天下之中保釐懋著適徼洊寵用晉崇階且恩覃三世矣頃入覲藩臬諸臣得蒙召到如公磊落慷慨且條䇿以聞天子當竦納特隆異數豈僅賜鉞榮世賞也元宰又題明董其昌書禪悅一卷次等致九宣德鏡光箋烏絲闌本行書凡六則款識云甲子十月之望其昌書又識云先自十二日大風揚塵次日冰凝硯池不能拈筆至是日客有持木罏置几上硯冰乃泮木罏蓋不灰木所造也元宰又題後有王瀚跋一明董其昌書燕然山銘一卷次等致十素絹本大楷書款識云辛亥重九董其昌書引首自書燕然山銘四大字明董其昌自書詩帖一卷次等致十一素絹本行書七言律詩五首五言古詩一首款識云侍御晶宇韓公祖以生絹徵書書舊作請教伏蒸揮汗殊不能佳祗堪覆瓿耳己酉六月董其昌明婁堅書五言古詩一卷次等雨一素箋本行書款識云辛亥六月雨窗婁堅呈拖尾有程嘉燧跋一明陳元素詩翰一卷次等露一素箋烏絲闌本行楷書五言古詩一首七言絶句三首款識云陳元素具草振先詞兄一笑無名氏書卷上等唐臨王羲之東方朔像贊一卷上等天一素絹本卷後米芾記云此唐人臨右軍書芾卷前有曹溶聫印吳廷二印又一印不可識卷後有宣和一璽又玉堂學士金華宋氏景濓玉堂學士沈度張丑之印美之曹溶祕玩諸印前隔水署唐人臨右軍東方朔像贊十字下有檇李曹氏一印後隔水有曹溶鑒定書畫印馮銓私印鹿庵三印拖尾宋濂跋云右軍小楷真迹人間絶少世傳黃庭多惡札而樂毅亦梁代模書像讚非晉筆米海嶽審定豈容議耶文皇書宗逸少當時自虞褚而下家臨户學右軍衣鉢遍天下然拘則乏趣蕩則踰矩下筆往往不逮前人今之去唐又何啻唐之去晉耶得唐人真書足稱寶矣豈其食魚必河之魴乎嗟夫老夫耄矣追思往哲實勞我心李觀周書七日興嘆患其無骨蔡入鴻都觀碣十旬不返嗟其出羣豫于此卷不能無感云故紀之洪武五年秋八月吉日翰林學士亞中大夫知制誥兼修國史金華宋濂書前署跋唐人臨右軍像贊卷後十字下有曹溶之印吳廷之印二印後有張丑之印一印又董其昌跋云東方生像讚陶隱居所稱右軍有名之迹即宋拓已如晨星况唐人臨本乎唐人故善書爾時必有唐以前拓下真迹無幾者今之不能為唐臨可知矣董其昌觀因題又汪道會跋云昔人云法書摹臨有二種摹帖如梓人作屋締造雖具準繩工拙自異臨帖如雙鵠摩天各隨所至而息此善喻也二法皆莫善于唐人彼其去古未逺學力更深用筆操縱自如所以可貴是帖為唐臨右軍東方像讚其結束波策若優孟之學叔敖至其隱徑于圓藏巧于拙黯淡有餘鋒穎不露信非唐人不能臻此此余所見韓宗伯家曹娥碑本正與此帖相類不必取證于米家數言也今世得晉人真迹甚難買王得羊已為希觀兹宋學士所為三復興嘆耳昔年曾見之吳敬仲處今歸用卿漫識數語于後己酉良月新安晚學汪道會書于白門長干里又陳子壯跋云此卷自唐至今不知幾易主矣而歸之大司空劉公倘亦桃花源中不知有漢何論魏晉者耶即勿論東方像贊誰氏之子蒼徑有餘力追作者而宋潛溪學士題跋語興會軒翥乃無一筆不逼肖右軍之神惡用是辨真贋較久近乎又所謂去其人而可矣崇禎九年上元日南海陳子壯書卷髙八寸三分廣一尺六寸八分唐鈎王羲之干嘔帖一卷上等地一白麻箋本前後有集賢院御書印鍾季寅氏喬簣成氏墨印三又寶玩喬簣成氏內合同印喬氏私印諸印又鼎元貞觀半璽二又合同半印又半印七俱漫漶不可辨前隔水押縫有政和宣和二璽後隔水又政和宣和二璽俱微缺又鼎元半印二倒用拖尾喬簣成跋云晉右軍王逸少書干嘔帖其字畫圓徑雄雅而紙亦古色是知唐初人所缺一字也於書行空間直界成路蓋為久而卷舒恐致禙絹絲紋磨損字面故置諸書筒而祕之乃知前人寶愛如此之篤太宗時已嘗刻諸淳化古帖石中上有南唐內合同并集賢院印及卷首尾古印朱文十數又鵝溪黃素革首前後皆用宣政內府圖書印之想當必有數帖成軸不然何以革首外邊各亦有印文耶今存者此帖耳是以書譜止載其首帖之號云皇慶二年十二月朔喬簣成仲山父題又班惟志跋云王羲之書惟淳化帖止得兩卷則知購收不盡者多矣宋臨所見髙廟與米南宫一拙而頗弱一徑而出竒若此帖唐人所藏祕自有過妙處知書者必能辨也大梁班惟志敬跋又危素跋云喬氏所藏書畫以印色定其髙下此帖有仲山甫自題尤足重也後五十有五年臨川危素書又文彭跋云右晉右將軍王羲之干嘔帖嘗刻之淳化帖中以石刻較之分毫無異真至寶也或者謂其紙墨蕭瑟或又謂其為唐模政不必計也其筆法髙古斷非後人所及今見石刻一行半段皆寶惜之况此帖典型具存非水月鏡象可比者乎其直界成路喬仲山以為置書筒中者非也古人寶愛名帖常以自隨如王世將得索靖草四日帖置之衣帶中至宣和間摺痕猶在即此類也其周遭諸印多用赭墨亦非後人偽為長洲文彭謹題又王稚登跋云干嘔帖在淳化卷中見者往往而是以此本較之彼僅得其什一耳米南宫所云若見真迹慚惶殺人信然與解嘲生王稚登敬題又王世貞跋云余生平所見右軍墨迹皆非本來面目其最琅琅者袁生褁鮓二帖考之書史諸家尚以為唐人臨本張懷瓘言鍾尚書紹京最為好事不惜破産求書計用數百萬錢惟得右軍行書五紙當時去右軍僅三百餘年耳而不易若此况距今又八百餘年耶措大有此真已踰分因便再識之世貞下有句吳人平林館印二印後記語有萬歷乙亥中秋日記八字上鈐撫治鄖陽等處關一印卷髙七寸八分廣五寸二分附刻絲書卷上等米芾書唐詩一卷上等天一宋本碧色絲織七言律詩一首行書大字款織襄陽米芾四字下織楚國米芾一印卷前織海嶽庵一印拖尾陶九成跋云昔女媧氏煉五色石以補天而後文采以黼黻成焉逮于秦符堅時蘇若蘭以織錦製回文而巧思極矣至宋宣和間又以刻絲縷為繪翰儼如筆墨所作可稱化工之妙當時已珍若拱璧况今日乎此卷乃摹米元章筆其鈎勒挑踢處無纎毫遺憾噫技至此乎真超神入化者矣陶九成識又宋燧跋云右魏國所藏宋刻絲一卷乃摹米南宫真迹耳食已久今得展觀誠厚幸哉稱揚之詞已具陶南村跋中兹不贅宋燧書卷髙一尺二寸八分廣七尺七寸書卷次等唐摹王羲之千嘔帖一卷次等天一素箋本拖尾有喬簣成危素班惟志王世貞周天球文彭王稚登諸跋最後又項元汴記語一國朝人書卷次等沈荃書漢詔一卷次等天一素綾本楷書漢髙帝詔三漢文帝詔六漢景帝詔三漢武帝詔十二款識云皇清康熙九年嵗次庚戌十二月二十四日原任通薊道按察司副使前內翰林國史院編修臣沈荃奉旨恭録漢詔二十四條進呈御覽沈荃書唐賦一卷次等天二宣德箋本楷書唐人天賦日賦日五色賦郊天日五色祥雲賦五色露賦中和節百辟獻農書賦麥秋賦刻漏賦山呼萬嵗賦海水不揚波賦垂衣治天下賦明堂賦駕幸太學賦藉田賦鳯鳴朝陽賦款識云皇清康熙九年十二月二十四日原任通薊道副使前內翰林國史院編修臣沈荃奉旨恭録唐賦一十五首進呈御覽沈荃書千文一卷次等天三宣德箋朱絲闌本草書款識云康熙丁巳孟冬朔日日講官起居注詹事府詹事兼翰林院侍讀學士臣沈荃仿沈荃臨米芾書一卷次等天四灑金箋本行書臨跋語一則款識云康熙戊午六月草八日客有持米海嶽真迹索鑒者真贋雖未可定而用筆竒宕殊刮人目因力疾漫仿其意充齋沈荃臨顔真卿爭座位帖一卷次等天五素箋本款識云康熙己未小春中浣偶仿爭座位帖殘菊映窗月色如濯以紙盡不能竟并識之充齋佺沈荃仿米芾書一卷次等天六素綾本臨丹徒行衙帖苖幕帖款識云己未九月臨海嶽帖二則於內直館沈荃沈荃書唐人截句一卷次等天七素箋本草書七言絶句八首未署款石渠寶笈卷三十一
