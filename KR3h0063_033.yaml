body:
  text: 貯養心殿六明朝人畫卷上等明王紱湖山書屋圖一卷上等藏一宋箋本墨畫欵識云仲鏞與僕有夙昔之好嘗命僕作湖山書屋圖久羈塵鞅未副其意兹復以此佳紙見遺乃促成之因寫是圖以歸焉吁佳紙佳畫斯為稱矣顧僕拙筆安敢以此紙相輝光哉然仲鏞知我者也必不以是為誚并書此以記其歲月云峕永樂庚寅仲秋望日毗陵王孟端識下有孟端遊戲翰墨二印前有冰壺秋月一印卷前有天籟閣項子京家珍藏二印卷後有淨因庵主項墨林父祕笈之印平生竒賞文彭印文徵明印項元汴印諸印又衡字半印卷中押縫遊戲翰墨墨林各五印拖尾文徴明跋云友石先生畫品在能之上評者謂作家士氣皆備然其人品特髙能不為藝事所役雖片楮尺縑茍非其人不可得也此湖山書舍圖聮六紙而成修凡三十尺耕漁出沒村舍近逺煙雲變滅種種臻妙非纍月搆思不可成豈獨今之所少哉子和藏此真希代之珍也正德丙子三月既望衡山文徴明題前有子字山字之圃半印凡三又俞允文跋云毗陵王友石此圖文公嘗為第次其品今觀其巖巒杳靄岞崿紛披參差出沒於蒼煙白浪之中以至溪橋林屋疏峰抗館農田漁艇畯父村樵幽淙往復恍若别在世外真可謂深詣湖山之致者矣讀書于此必能絶冥離類殊使人遙想而存之談太常思重性好博雅相示此圖輒遂題其後云隆慶二年夏六月十有八日俞允文記前有若水軒墨林山人二印後有項子京家珍藏退密項墨林鑒賞章諸印卷髙八寸七分廣二丈五尺七寸八分御筆題籖籖上有御賞乾隆宸翰二璽明夏昶竹泉春雨圖一卷上等閏一素箋本墨畫欵識云海虞周君季宏築室西疇修竹萬竿環繞溪上豫嘗造焉愛其泉石清幽竹色蒼潤足以洗滌塵慮一日季宏命中子廷悅持素卷來求墨君子方納涼松亭因想其勝為寫竹泉春雨圖以復之雖不能造古人閫奧抑亦仿佛乎西疇之勝概也耶季宏博雅君子見之豈無彼此相感之意焉時正統辛酉夏六月初吉東吳夏昶仲照識下有夏氏仲昭印乙未進士玉堂清暇三印前有樂清軒二十八宿中人二印卷前自題竹泉春雨圖五字有樂清軒一印又蘭圃金敏字曼遜二印又汝南半印又一印漫漶存家藏圖書印五字卷末一印同卷中幅押縫有唐字汝南印各十一拖尾蘇正題云東風過雨淇園曉萬玉參差淡煙繞積葉寒迷翡翠光新梢濕透琅玕小春前蕩漾光不流皎如玉鑑含清秋萬紫千紅自開落羣山絶壑俱颼飀何如此君青不改春到風雷爭變態錦繃茁地破蒼苔翠葆捎空動香靄一枝影落滄波浮魚龍不敢潛來遊一枝影拂碧雲裏儀鳯朝陽睡初起千竿萬竿何茂哉滿林櫛立無纎埃掃月時看緑煙淨隔花遙送清風來松風竹韻如琴調一派宫商來窈䆗洗盡紅塵萬古心誰識天聲有真妙吾聞三十六琯吹鳯皇鳥獸率舞虞廷旁又聞六竅候元氣軒轅藉爾窮隂陽簞之可以薦宗廟簡之可以書文章重為告曰汝之材兮足可珍吾將截爾之長竿拂天池之六鼇釣北溟之長鯨掀然一笑海天碧萬里滄浪恣濯纓景泰改元冬十二月望日海昌雲壑道人蘇正題又趙永言題識云考功夏君尚書郎雲煙萬壑胸中藏平生愛與竹寫真須臾滿幅皆篔簹春雲糾糾堆玉府蒼雪紛紛墮朱户長鎗摩戛颭緑沈細甲勾連紐金鎖昔剪諸吕誇絳侯正如此幅森戈矛一麾健兒齊袒左漢廷翛爾無旄頭梅邊數枝猶婀娜松下雜遝攢萬笴尋常白晳莫能到只許羊裘坐其下夜來春雨黯江干溪頭噴薄添流泉西疇沃土得潤澤孫枝頭角多嶄然開卷丐我賦長句我句不工良可愧強書鄙俚塞爾求滿林風雨寒颼飀此卷廷悅求題久矣余嘗賦七言長律四十韻已脫稿廷悅躍然喜而懷之後遺失不知下庸人俗子之手今復來徵非廷悅不能如此癡非豫不能應其求復於枕上搆思塞之不可與前長律比也浚儀趙永言書於尊經閣下又袁鉉題云竹下泉噴玉春來雨滿林橫斜連野潤淺澑與溪深嶰谷涼生早淇園晝卻隂半空飛濕翠萬壑暗鳴琴石罅疑鱗動風梢悟鳯吟景猶湘岸曲清逼渭川潯邈矣懷前古翛然感自今流觴仍共酌擊節更誰尋未遂鐫詩句無因淨客心倦逰山澤老憑此散塵襟會稽袁鉉後有金敏字曼遜一印卷髙一尺二寸八分廣四丈七尺三寸前隔水御題詩云淙淙復淅淅竹泉邈寥寂春雲暗逺天飛珠石崖滴颯沓動微籟琅玕韻相擊不惟眼界清亦令心源滌乾隆庚申暮春御題下有乾隆宸翰幾暇臨池二璽引首御題清聼二大字欵署乾隆御筆下有懋勤殿鑒定章乾隆御賞之寶二璽御筆題籖籖上有乾隆宸翰一璽明沈周臨錢選忠孝圖一卷上等餘一宋箋本著色畫葵花萱草二種欵識云成化甲辰夏日沈周臨錢舜舉忠孝圖下有啓南一印卷前有石田一印押縫有子孫保之印凡五卷髙九寸二分廣一丈五尺七寸八分明沈周春郊散犢圖一卷上等餘二素箋本著色畫欵題云春草平坡雨迹深徐行斜日入桃林童兒放手無拘束調牧於今己得心長州沈周下有石田一印前有有竹莊主人一印卷後有袁氏鑒賞章一印拖尾唐寅題云犁罷春郊小雨餘長林大野飽青芻未逢炎暑休教喘丞相經過恐下車蘇臺唐寅又文彭𨽻書題云栁邊一犢牛後出晴沙草暖春遲遲丹青何人畫此景使我見之心獨怡願令四海息征伐此景即是桃林時三橋文彭又祝允明題云周武除殘紂己擒駕牛亦使放桃林今看圖畫宛如昔筆筆都含太古心枝山老樵題又都睦題云問喘當年惟丙吉去官留犢有時苗要知芻牧關風化不意斯人竟寂寥南濠都睦卷高一尺一寸四分廣三尺三分明吕紀蘆雁圖一卷上等成一素箋本著色畫欵署吕紀下有四明吕紀一印卷高一尺四分廣二丈七尺三寸明趙汝殷風林羣虎圖一卷上等歲一素絹本著色畫欵識云府推宫侯命豫為淮庠司訓古莒姚先生作風林羣虎圖豫喜識者且求之篤故不辭繪成以復就筆以識之時正統辛酉春正月望日也下有古汴世家趙汝殷印二印卷前有子孫世昌半印引首有篆書風林羣虎圖五大字欵云翰林王叔安書拖尾姚子大跋云永嘉趙氏世善畫虎逮汝殷尤精妙得名當代豫嘗求作風林羣虎圖而未果宣德甲寅豫承乏淮郡庠後二年冬適庠之彥宫安士寧往倅是郡爰致禮幣託以求焉士寧信人也不數月以虎圖一卷走書復豫啓緘閲之但見風林瀟森雲山蒼崒而斑斕羣然氣勢生動不啻見生者於林壑誰之敢編鬚也虎凡二十有八或調雛或顧偶或眠草或礪木飲泉者而澗響嘯風者而木動轉其首則有聞舐其掌而欲發若潛伏若舒伸若坐若行若逐若戲雖變態不一莫不曲盡其妙然汝殷不寧工於是而其布置山水模寫景物又皆段段不同烘染有法而筆綽不滯深入畫之神品誠士大夫家珍玩而足傳厥後焉是用識之藏諸篋笥公餘一覽則神逸豪奮之氣未必不有以壯詩懷而雄文思也噫為吾後者知求之不易寶傳永久則庶乎承吾之志也時正統六年春三月朔旦養性道人子大甫書於淮庠官寓卷髙一尺三分廣二丈四尺七寸五分明唐寅毅菴小照一卷上等律一宋箋本著色畫欵云吳門唐寅為毅菴作下有吳趨唐伯虎二印卷前有南京解元毅菴二印引首書毅菴二大字欵署長洲文徵明拖尾盧襄讚云近仁者四毅居其次載采者九五曰擾毅半途弗畫逺道可致健哉強哉弗怠以肆署之菴楣朝夕斯視石湖盧襄為毅菴主人讚又王守題云大道邈無垠修途眇難即優遊百年間柔弱靡所植秉志厲堅強前驅未遑息元仗日操持太素於此得卓哉古先風矯矯方努力王守又趙應宿題云此身寄林泉夙有逺大志垂老竟不休因之還自視豈惟欲求仁而且能執義優優君子哉大道因可致應宿又王寵題云黃鵠一髙舉脫此羅網患松柏有恆性豈不罹嚴寒曷觀毅菴叟養晦遵林泉沖沖抱貞一過目徒紛然至老而不化徑氣充兩間雅宜子王寵書又袁褧題云庵前風月浩無邊庵內主人清且賢篤志詩書吾念覺力行仁義此心堅春花散漫看塵幻秋水澄泓養性天運甓即同陶侃事作庵應亦取韋絃汝南袁褧前署奉題毅庵一首六字又文徵明銘并序云秉忠朱先生僕三十年前筆研友也自少以馴行稱而性特精敏嘗作堂於所居之後名曰毅庵而因以自號特請子畏作圖復命子銘之銘曰擾而能毅是為不偏臯陶陳謨前聞斯言矯矯先生垂情簡編取毅名庵比之韋絃美矣庵居圖書秩然於時探索於時盤旋豈徒采譽要以心傳義當勇為疾如奔川茍不順適百璧可捐終始有常吉哉無愆衡山文徵明又陸南題云自強不息立規模欲使修為雄萬夫一毅名庵猶猛省斯人何愧聖賢徒道逺何期用力堅知君掘井必求泉懦夫未可同年語曾氏常常在目前陸南後有毅庵一印又黃魯曾題云近仁致果古有明文力行允蹈今有淑人聖賢為的果確在心奮然獨往保此令名黃魯曾又王金讚云𢎞貴不偏柔曰剛克有美斯庵義惟象德矯矣君子是遊是息笑傲宴嬉圖史翰墨於昭令聞強忍正直壁立峩峩未可摧抑里生王金拜讚又袁衮題云強立本自我躬修法天行懦夫亮圮績大賢乃遺明道存逺自致理悟物可輕考槃永寤歌素履忘組纓千章風雅合百拜禮飲成結茅依濠上啓忩雜雲英清曠暮山淨逍遙秋水泓賞心聊內適寡欲罕外營袁衮卷髙九寸四分廣三尺五寸明唐寅溪山漁隱圖一卷上等律二素絹本著色畫欵題云茶竈漁竿養野心水田漠漠樹陰陰太平時節英雄懶湖海無邊草澤深唐寅畫下有南京解元伯虎二印前有子畏一印卷後有清森閣書畫印一印拖尾王寵跋云六如此卷蒼潤蒙密淋漓暢快時一展玩則心與理契情與趣會令日從事於車塵馬足間者不無慚負於斯圖耶嘉靖癸未春石湖精舍書王寵又程大倫題云溪亭四面山楊栁半溪灣蟬響螳螂急魚深翡翠間水寒留客醉月上與僧還猶戀蕭蕭竹西齋未掩關暖枕眠溪栁僧齋昨夜期茶香秋夢後松韻晚吟時共戲魚翻藻爭棲鳥墜枝重陽應一醉載菊助東籬太倉程大倫又陸治跋云子畏先生此圖畫法蒼古出入營邱晞古之間丹楓黃葉瀑布流泉疊渚回汀悠然映帶詩翁野老縱談垂釣使觀者參物外之髙蹤豁心情之紆鬱天機流動潑潑眼底非先生靈腕之妙其能若是哉展卷披對能忘髙山景行之想包山陸治又顧德育題云鏡裏南屏空翠流雲中千樹隔清秋長竿只博餘年景不占人間特地愁波翻晴日亂鷗飛秋滿灘頭片石磯不是晝間人迹少自無塵到白雲扉間理扁舟湖水頭白雲遮盡碧山秋臨風一醉無餘事欲采蘋花不自由門栁陰隂湖水平扁舟來往短橈輕自炊菰米青精飯一飽蓑衣待月明顧德育前署湖上即事四字又居節題云染青烘翠濕未收連山畫出石湖秋船頭仰面吹橫笛明月滿身如水流吳市行歌懶負薪扁舟原是五湖人苧蘿女子曾逰地到晚雲山也效顰芙蓉樓在碧湖頭髙捲湘簾見水鷗屈膝屛前峰數點三湘煙樹九疑秋吳王行處錦江山賜劍人亡白日寒試上拜郊臺上望滿湖風雨一漁竿白石灘邊雙鷺鷥羽毛如雪立多時船頭一縷青煙起正是天隨茶熟時一卷漁經一釣竿年年江渚傍風湍酒酣月出披蓑卧雪滿千山生夜寒牧豕生居節卷髙九寸一分廣一丈九寸引首御題漁隱二大字欵云乾隆御筆上鈐乾隆宸翰一璽御筆題籖籖上有乾隆宸翰一璽明唐寅事茗圖一卷上等律三素箋本著色畫欵題云日長何所事茗碗自齎持料得南窗下清風滿鬢絲吳趨唐寅下有唐居士一印前有吳趨唐伯虎二印卷前有珍祕宜爾子孫二印卷後有會侯之章耿會侯鑑定書畫之章公字信公珍賞諸印引首𨽻書事茗二大字欵署徵明前有也園索氏收藏書畫一印後有九如清玩長白索氏珍藏圖書印二印前隔水有丹誠千山耿信公書畫之章耿會侯鑑定書畫之章諸印押縫有半古軒書畫印長字真賞友古軒東平諸印後隔水有耿嘉祚印耿湛恩章琴書堂都尉耿信公書畫之章諸印押縫有友古軒半古軒書畫印各二印又阿爾喜普之印樂庵信公鑑定珍藏會侯珍藏諸印拖尾陸粲書事茗辨云陳子事茗客曰陳子尚乎豫曰否陳子溺歟曰曷溺哉陳子寓也天下莫不由之孰則知之陳子誠知之斯寓爾然則陳子曷事曰列具綺寮分江貯月然松明瀹蟹眼爰發幽抱乃集良友酬嘉風物于于然也若是幾於溺矣曰缺徵諸羽濛哉夫誠深於茗恬於直遂於厄非溺耶陳子弗為也事必有道由事而知道有之矣陳子豈安於茗哉陳子操縵有雍門之遺一時學者頡頏未逮知其弗究於茗也弗究而事固寓也已曷弗於縵曰莫不飲食鮮能知味先民則之入道者邇焉陳子謂知茗也將淵其意於兹乎是益不可以究矣陳子平居抑抑不抗篤信質直介然有為故於事事亶乎其寓也客唯唯謝曰今而後知陳子事茗嘉靖乙未孟秋之吉平原陸粲著前署事茗辨三字有樂聖且銜杯御賜忠孝堂長白山索氏珍藏耿嘉祚印湛恩記耿嘉祚章諸印後有潄六主人印也園索氏收藏書畫讀畫諸印押縫有友古軒印凡二又耿昭忠信公氏一字在良别號長白山長收藏書畫印記半古軒書畫印會侯之章諸印卷高九寸九分廣三尺二寸九分明仇英漢宫春曉圖一卷上等吕一宋箋本著色畫未署欵卷後有十洲一印卷前有張靜齋珍玩圖書記一印前隔水押縫有神品一印拖尾顧秉鈞書唐人宫詞後識云自內景經以側勢紆回盡態極妍厥後褚河南倣之寫西升經益多恣致書評謂如瑶臺嬋娟不勝羅綺因祖其筆法書唐人宫詞如右蓋不敢以朴老之筆唐突此圖嬌艷也嘉禾顧秉鈞又髙兆跋云十洲真迹用烘染如大紅青緑諸色皆參悟唐小李將軍諸家祕法非近代畫苑能師承每一展對絢爛人心目動羡慕之情此卷獨以白描成之細於遊絲徑於秋毫直證松雪境地審視者非具離朱之明不能辨晰端倪其中位置樓觀器飾雜物具一本宋人稿本無一筆簡略揆其意以春曉系曰漢宫已備極紛華綺麗人間富貴之象使復增華從而觀覽不免弛張奢僣增益侈肆於是作為平淡示後素之意明尚質之本令開閲者生淡薄想恭敬想噫嘻聖賢繪事之旨寓意毫素十洲豈畫師也哉宜平洲方伯什襲齋館珍賞於公餘也丁丑九日侯官髙兆謹跋又杜首昌跋云十洲作畫多以青緑金粉見長而此卷獨以淡逺縹眇入妙謂之舍形而取影得畫家之三昧者隱見有無幾微變化間不容髮心思入之存其神於影中周其神於影外觀者不求形於筆墨則庶乎得作者之苦心也延津劍遇張博望漢宫圖遇靜逺主人神物各有幸遇也世世珍之永以為寶淮南杜首昌敬題卷髙一尺五分廣一丈七尺引首御書漢宫春曉四大字欵云乾隆御筆下有乾隆宸翰耽書是宿緣二璽前有含毫邈然一璽御筆題籖籖上有乾隆宸翰一璽明仇英列女圖一卷上等吕二宣德箋本白描畫欵云仇英實父製下有十洲仇英之印二印卷前有玉音讚美黃輝之印孫獻之印癡庵道人諸印卷後有桂坡安國賞鑒廣長庵主王稚登印捧之勿釋諸印卷髙九寸三分廣三丈二寸明文徵明畫松一卷上等調一素箋本墨畫欵題云變化勢難縛虬髯似戟森徵明下有文徵明印衡山二印後有魏塘貴主魏塘錢氏賜半印二卷髙八寸五分廣四尺三寸三分明文徵明真賞齋圖一卷上等調二宣德箋本著色畫欵識云嘉靖乙酉秋徵明為華君中甫寫真賞齋圖時年八十下有文徵明印一印卷前有徵仲父印停雲館二印卷後有宋犖審定項德枌印遼西郡圖書印諸印前隔水有緯蕭草堂畫記一印引首李東陽𨽻書真賞齋三大字欵署西涯别幅徵明又𨽻書銘云真賞齋者吾友華中甫氏藏圖書之室也中甫端靖喜學尤喜古法書圖畫古今石刻及鼎彝器物家本溫裕災畬所入足以裕欲而君於聲色服用一不留意而惟圖史之癖精鑒博識得之心而寓於目每併金懸購故所蓄咸不下乙品自弱冠扺今垂四十年志不少怠坐是家稍落弗恤而彌勤余雅同所好歲輒過之室廬靚深庋閣精好宴談之餘焚香設茗手發所藏玉軸錦幖爛然溢目卷舒品騭喜見眉睫法書之珍有鍾太傅薦季直表王右軍袁生帖唐虞永興汝南公主墓銘起草王方慶通天進帖顔魯公劉中使帖徐季海絹書道經皆魏晉唐賢劇迹宋元以下不論也金石有周穆王壇山古刻蔡中郎石經殘本淳化帖初刻定武蘭亭下至黃庭樂毅洛神東方朔贊諸刻則其次也圖畫器物抑又次焉然皆不下百數於戲富哉然今江南收藏之家豈無富於君者而真贋雜出精駁間存不過夸示文物取悅俗目耳此米海嶽所謂資力有餘假耳目於人意作標表者於戲是烏知所好哉若夫緹緗拾襲護惜如頭目似知所好矣而賞則未也陳列撫摩揚榷探竟知所賞矣而或不出於性真必如歐陽子之於金石米老之於圖書斯無間然歐公云吾性顓而嗜古於世人之所貪者皆無欲於其間故得一其所好玩而老焉米云吾願為螙書魚逰金題玉躞而不為害此其好尚之篤賞識之真孰得而間哉中甫殆是類也系之銘曰有精齋廬翼翼渠渠爰宬用儲左圖右書牙籖斯懸錦標斯飾乃緹斯緗于燕以適適如之何維衎以逰金題玉躞瑄璧琳璆品斯騭斯允言博雅誰其尸之中甫氏華惟中甫君篤古嗜文雋永道腴志專靡紛斷縑故楮山鐫野刻探賾討論手之弗釋亶識之真亦臻厥奧豈無物珍弗易其好維昔歐公潛志金石亦有米顛圖書是癖豈曰滯物寓意於斯乃中有得不以物移植志弗移寄情則朗弗滯弗移是曰真賞有賢中甫竒文是欣少也師古老而彌勤新齋翼翼圖史祈祈後有考德視我銘詩嘉靖三十六年歲在丁已四月既望長洲文徵明著并書時年八十有八下有文徵明印衡山二印前署真賞齋銘有序六字又項德枌印蘭石主人二印又别幅楷書齋銘釋文欵識云長洲文徴明著并書嘉靖丁巳三月既望時年八十有八下有文徵明印悟言室印二印前有項德枌印蘭石主人二印拖尾酆道生真賞齋賦云夫人之所以參列兩間優遊沒齒莫不應務彰性接物萌情適體求充委時感興固有承風雲以騁志附龍鳯以效能或載筆於鴻闈或假鉞於虎閫又有華轂日擊錦帳雲連蛾眉擁於後先鷺羽忘其冬夏又有取穀出絮執籖鑽李朽貫不忍虞躬滿籯惟圖裕後衆之所趨區以别矣揆厥心賞何者為真錫山東沙華子貞孝之胤藝文之英俶儻倬犖之懷𢎞廓瓌瑋之器等勳業於浮雲視侈富如土苴爰構齋居惟貯圖典六經之籍諸儒之論歷代之史百氏之言周秦漢魏之書晉唐宋元之繪固已盈几溢奩兼䑳壓棟至於藻鑑所注神情所鍾性命可輕頭目同寶則有鍾元常季直表貞觀之所珍藏也王右軍袁生帖祐陵之所眷題也顔魯公劉中使帖一曰嬴州帖及朱巨川誥宣和之所譜藏也王方慶通天進帖上有建隆新史館印嶽珂張雨跋金輪之所拓玩也永興汝南季海道德楷法矜於海嶽子山步虛康樂二贊草聖擬於季真此卷東明九芝蓋北闕臨丹水二詩乃庾信步虛詞後連謝靈運王子晉贊巖下一老翁四五少年贊有宣和鉗縫諸印及內府圖書之印世有石本末云謝靈運書書譜所載古詩帖是也然考南北二史靈運以晉孝武太元十三年宋文帝元嘉十年遇害庾信則生於梁武之世而卒於隋文開皇之初其距靈運之沒將八十年豈有謝乃預寫庾詩之理或疑唐太宗書亦非也按徐堅初學記載二詩連二贊與此卷正合其書則開元中堅暨韋述等奉詔撰述其去貞觀又將百年豈有文皇豫録記中語乎但記中棗花帖作棘花上元應送酒來枉蔡經家帖作應逐上元酒同來訪蔡家北閣臨元水帖作北闕臨丹水坐絳雲作生絳雲玉䇿石本同而帖作玉簡天火練真文帖作大火練真文難以之百年帖作難之以萬年登雲天作上登天愛清淨作復清曠冀見作既見繽翻作紛翻巖下一老翁五少年贊帖五上有四字以煆語上拙較之帖為優蓋木刻傳寫訛耳竊詳是帖行筆如從空擲下俊逸流暢煥乎天光若非人力所為賸有庾稚恭王子敬之逸趣唐人如歐孫旭素皆不類此唯賀知章千文孝經及敬和上日等帖氣勢髣佛知章以草得名李白溫庭筠詩皆稱之其棄官入道又在天寶疑其見初學記而輒録之也然東沙子謂卷有神龍等印甚多今皆刮滅昔米老云古帖多前後無空紙乃是剪去官印以應募也今人收貞觀印縫帖若是粘著字者不復再入開元御府蓋貞觀書武后時朝廷無紀綱駙馬貴戚丐請得之開元購時剪印不去者不敢以出也開元經安氏之亂內府散蕩乃敢不去開元印跋再入御府也其次貴公家或是賂入便須除滅前人印記所以前後紙慳也今書更無一軸貞觀開元同用印者但有建中與開元大中𢎞文印同用者皆此意也米又云陳賢草帖竒逸如日本書亦有唐氏雜迹字印與此卷正同意其實六朝人書余按陳代庾信在周南北為敵未嘗通也其石刻自子晉讚後截去十九行僅於謝靈運王而止因讀王為書字又偽作沈傳師跋於後傳師以行草鳴於時豈不識王書二字耶又元章及黃長睿皆嘗云祕閣所收唯務富博真贋相混然則書譜所紀可盡信歟抑以唐初諸印證之則余又未敢必其為賀書矣俟博雅者定之右丞輞川圖珍聲萬代曽入祕府恕先雪江卷寶著前朝徽宗題字及李文正吳文定程篁敬張滄洲等長句君謨留精於數牘詳賦注魯直擅美於五書山谷真行劉賓客經伏波神祠詩及冬日二士兩柬草書諸上座帖及太白憶舊逰詩高宗居九重而臨寫奪真黃紫黃庭忠穆挺大節而詞札更雅嶽鵬舉與奉使郎中劄子米兵部瀟湘景元暉雲山長卷若就楚江閻次平積雪圖頓忘三伏上題淳熙辛丑閻次平晝寒巖積雪松年九老院體一空有吳匏庵邵二泉詩馬麟四梅家法咸具晴雨雪月趙承旨臨書入二王之室臨黃庭有鄧善之貢仲章龔子敬等跋臨洛神有虞伯生李鳴鳯袁仲長栁道傳等跋諸圖鼓盛唐之風溪山仙館圖漂毋圖設色山水小圖夜景畫夾對題云翛然茅屋一青燈兩岸蛙聲徹夜鳴最是幽人眠不得扶笻起就月中行秋郊飲馬圖逸筆二羊圖邵庵蚊賦具體虞褚虞雍公允文賦伯生行書彥敬雲山同趣襄陽高房山絳色長卷趙子昻鄧善之柯九思倪雲林吳匏庵等題又一直幅倪雲林為彥清題彥清中甫八世祖也叔明青卞隱居小幀為趙氏作元鎮惠山春霽等幅惠山圖雲林自題并陳方子貞詩春霽圖雲林詩云開元道士來相訪索寫雲林春霽圖我别雲林已二載為濯滄浪逰五湖滿目波容蘸山黛撩人栁眼亂花須避喧正欲尋耕釣源上桃花無處無余與宗晉道兄别十有六年矣忽邂逅吳下杯酒陳情不能相舍老杜所謂夜闌更秉燭相對如夢寐者諷詠斯語相與愴然人生良會不易而况艱虞契濶若此者乎以十餘載而僅一面則人生果能幾會耶悲慨亦未有若此言也明日道兄將歸錢塘余亦鼓柁煙波之外因寫圖賦詩以寓别後戀戀不盡之情云耳至正十四年二月十二日倪瓉葑門客樓書是日昔刺正卿陸季𢎞顧思恭同集叔明和云五株煙樹空陂上便是雲林春霽圖仙老御風歸洞府隱君鼓柁入江湖幾回夢見清雙眼十載相逢白盡鬚此日五陵溪上路桃花流出世間無僕與倪雲林别已及二年雲林棄田宅攜妻子繫舟汾湖之濱日與逰者皆煙波釣艇江海不羈之士回視鄉里昔日之紛擾如脫敝屣真有見之士也至正十六年孟秋僕侍家叔元度於開元而宗晉宗兄持此見示風埃瞇目展卷浩然因為和詩其上吳興王蒙題飄蕭溟涬之表鏗鏘倡和之音又若壇山大篆鴻都石經夏承婁夀漢碑樂毅東方晉刻黃絹換鵝古題具在子敬植賦全本僅存王獻之好寫洛神賦世傳惟十三行中甫獨得其全且鐫拓精妙竒寶也淳化祖刻硃書見元祐之傳當時實用棗木板上有銀錠榐痕又多木橫裂文用李庭圭墨第六第七第八卷內有蘇字硃書辨證每卷首有子昻趙字印及雲房清玩印尾有巨鹿郡圖書印大清嗣摹墨彩乃大觀之舊暨乎劉氏史通玉臺新詠上有建業文房之印則南唐之初梓也聶崇義三禮圖俞言等五經圖説乃北宋之精帙也荀悅前漢紀袁宏後漢紀紹興間刻本汝陰王銍序嘉史久遺許嵩建康録陸遊南唐書載紀攸罕宋批周禮五采如新古注九經俞石澗藏守溪跋南雍多闕蘇子容儀象法要亟稱於朱子張彥逺名畫記鑒收於子昻相臺嶽氏左傳建安王善夫史記六臣注文選郭知達集注杜工部詩共九家曾噩校曽南豐序次李翰林集三十卷五百家注韓栁文在朱子前齊中諸書文選韓栁尤精劉賓客集共四十卷內外集十卷白氏長慶集七十一卷歐陽家藏集剛繁補缺共八十卷最為真完三蘇全集王臨川集世所傳止一百卷惟此本一百六十卷管子韓非子三國志大字本淳熙乙已刋於潼川轉運司公帑鮑參軍集十卷花間集紙墨精好雲溪友議十二卷范攄詩話總龜一百卷阮閲編經鉏堂雜志八卷㝘川倪思金石略鄭樵注笪氏藏寶晉山林拾遺八卷孫光憲刻東觀餘論樓攻愧等跋宋刻初拓紙墨獨精卷帙甚備世所罕見唐名畫録朱景元五代名畫譜劉道醇纂宋名畫評蘭亭考十二卷桑世昌集皆傳自宋元逺有端緒牙籖錦笈以為藏天球河圖而比重是以太師李文正公八分題匾曰真賞齋真則心目俱動賞則神境雙融翰林文公為圖為銘昭其趣也昔張彥逺弱年鳩集晝夜精勤或嗤其為無益之事則安能悅有涯之生貨衣減糲篤好成癖以千乘為輕以一匏為倦米元章每得一書既窮其趣輒以良日手自背洗客拱而後示屢濯而後展諦觀之際迅雷不聞與夫褚中令鑒定若視黑白黃長睿辨正不漏毫髮揆兹雅抱千載同符斯東沙子所以淹留歲時兩忘憂樂眇萬物而無纍超四海而特行者乎華之先晉孝子國史有傳李延夀南史傳云華寶父豪晉義熙末戍長安時寶八歲父臨别謂之曰須吾還為汝上頭及長安陷父竟沒戍所寶遂終身不冠婚以弟寬之子為後齊建元中表其廬下逮有宋將仕公克振其家趙文敏表其墓表云君諱銓字君選宋授將仕郎無錫縣主簿自幼頴悟讀書務達奧羲為鄉文人監稅公以善化俗揭文安銘其墓銘云君諱友聞字起濱銓之子也行省署監無錫稅為人教慤靜固躬耕率衆俗以和裕焉德珍處士堅辭總管黃文獻等稱之黃溍碣銘云璞公之諱其字德珍父曰友聞母曰袁氏沈靜有質遇事有條總管三品卒辭不就孟穜遺事曰處士家居簡素而周恤人乏萬緡不吝焉子舉都事自奮功名文獻復志之黃志云君諱鉉字子舉璞之子也奮志功名為使司都事以卒年僅二十六妻陳氏誓不他適而保其遺孤詔表其門厥配陳節婦堂有名公不一之書干文傳貞節堂記黃潛銘鄭元祐後記李祁詩序危素贊曾堅貢師泰等詩俞真木撰墓志尤詳其孤棲碧翁軒有文儒相繼之作張翥春草軒記陳謙詩序鄭元祐胡助楊維楨陳基段天祐潘純張世昌張雨髙明李孝光王逢楊鑄宇文公諒貢師泰王餘慶等詩俞真木為墓銘曰處士諱幼武字彥清號棲碧鉉之子也母陳氏早寡鞠以成立處士尤篤孝敬為春草軒以奉之讀書善吟有黃楊集貞固翁輯行家禮著于友同之傳浦江趙友同傳云翁諱宗韡字公愷號貞固元時家聲稍替翁克振之酌冠婚喪祭之禮為慮得集源長翁刲股活親顯于傳芳之集宗譜傳云公諱宗常字源長貞固之孫伯諄之子母疾醫弗效刲股療之果愈以烈婦名者翁室鄒忠公之裔也錢仲益傳云源長年二十六而得死疾妻鄒誓以不二夫以孤託毋顧而不及鄒鄒遂先期自盡以明其信鄭叔贊王黻趙友同孔友諒張思安陳鎰范景安等為詩胡概蔣用文殷序跋以序思詠者翁子守德孫廷元之孝也詹事篁墩程公存思四詠序曰源長疾而妻鄒先縊遺孤本常育於祖母顧氏比成而顧亦去世矣本常以早失怙恃而不克竟其祖母之養又不克顯其母之節題其所居之堂曰存思感憤終身守德子春求所以張之四詠者曰托孤撫胤捨生明志鳥鳥私情屺岵瞻慕西涯李文正公詩引云守德痛其少孤既不能報大母平生之恩又不能彰母氏既死之節以為終身悲其子春以告為作詩曰報劉恩罔極存趙祀終全骨肉存亡異乾坤覆載偏野行長岵屺遺澤尚杯棬有美江南俗他時海內傳本常字守德春字廷元尚書石城李公傑撰志云廷元孝友勤儉可謂特立之士配趙氏有賢德進士楊文表其墓南坡君遜業以成其義則喬太宰吕宗伯鄒司成之言可考白巖喬公序曰處士性至孝外和內剛不事矯飾宗族鄉黨有鰥寡者視力周之于同氣尤厚鄉人取以為法涇野吕侍郎詩云南坡真逸士八十尚童顔鳩杖時不策蠅書夜自刪東郭鄒祭酒序云財阜者易驕而翁持勤儉勢盛者易爭而翁以惠和居逸者易淫佚而娛之以文史維之以名士將其天常之厚能不背于君子之方乎文待詔志銘云君諱坦字汝平松巖子子也年十六代父理家母先亡諸弟孱弱哺訓底成凡屋廬田業器物童奴惟弟所欲而自取棄餘者壽九十有四見五世孫而終錢碩人備德以相其夫則王特進吳文端文衡山之筆有徵特進光祿大夫新建伯陽明王公序曰懿公之行柔嘉之德母儀婦軌無所不具雖紀傳所載亦無以加少保尚書白樓吳公碣銘曰錢出吳越忠獻王之後纍傳至章靖府君卓犖多奇節鄉人稱為希翁先生生碩人歸南坡翁時有題畫小詩貽之後二泉邵公題云吾契文希翁先生文詞追古人而行誼過今人逺甚此其季女歸華君汝平而貽之者也於是季籛年七十有一矣而翁所寄詩片紙猶在奩凡間內德之成於是乎在文待詔志云碩人仁明娟好慧而不煩值華中衰汝平方刻意振植日出應門户門內之事咸碩人特之卒起其家孝事舅姑尤嚴賓祭不喜佞佛而樂恤匱窮老而勤儉不怠陽明之稱信矣東沙子之先妣吕亦有衡翁之筆志矣待詔志云吕氏出東萊先生之後碩人叔柔懿恭中外歸賢焉待詔公慎許可而華南坡翁錢吕二碩人皆公為志親書之于石凡此髙文巨册照映齋中則又華氏寶玉大弓子姓世守當傳無窮以為衡鑑匪特玩好之供者猗嗟茂哉東沙子夏字曰仲甫中甫乃南坡之孫而小山翁欽之長子幼鞠於祖母錢碩人錢卒終身慕之李文正公為篆題東沙逰王陽明喬白巖之門而海內名公若邵二泉吕涇野都南濠王南原陳石亭蔡林屋文衡山鄒東郭髙公次林志道黃勉之尤相善余交其人僅垂三紀知其志乎古不同乎今也爰作賦曰有清華公子謁乎素履山人曰蓋聞九陔倚杵廣雅九天之外次日倚杵十形冰􅤓楊泉物理論地有十形冰尼京反􅤓若外反跳丸往來編珠縈帶二氣運其良能五行儲其靈粹山川通其竅液動植紛其恢佹固亦穹窿冥濛磅礴碨礧磅浦光反礴蒲莫反廣博貌碨烏為反礧盧戾反髙低貌煜爚煜於六反爚移灼反日光皎徹月光參差芒暳參千林反差千池反暳呼桂反星宿光一一闔闢一於斤反一於云反元氣運行之意燠寒雨霽扶搖飂飍飂利幽反飍香幽反風貌屏翳薈蔚屏上聲薈烏桂反蔚於桂反雲起貌砰磕䃸磹砰披并反磕可合反迅雷之聲䃸子兼反磹徐金反電光也雱沱浸漬雨迆迆屭屭迆演里反平遼貌屭虛器反壯大貌崺崺嶉嶉崺演吏反山卑長貌嶉即委反林木崇積貌泚泚濊濊泚淺子反水清濊烏廢反深廣貌壒壒畷畷壒伊蓋反塵埃貌畷朱衛反田畝相連貌薱薱茷茷薱徒對反茷蒲蓋反皆草木盛多貌韡韡􅀈􅀈韡於委反華盛貌􅀈倪祭反木枝盛斾斾馤馤詩任菽斾斾馤於蓋切香氣奰奰蹶蹶奰平祕反省作奰獸壯也蹶姑衛反獸行急遽之貌甡甡毳毳甡疏臻反詩甡甡其鹿毳充芮切獸多毛也齮齮踶踶齮語綺反齒齧貌踶文几反有力貌翍翍翽翽翍攀眉反張羽貌翽吁外反詩鳯皇于飛翽翽其羽褷褷泄泄褷所宜反羽生貌泄余世反浮沈貌交交噦噦詩交交黃鳥又噦噦鸞聲喓喓嘒嘒詩喓喓草蟲又鳴蜩嘒嘒睢睢旴盱睢宣追反盱胸于反皆喜悅貌或羣或類於是乎人也稟至貴以含生超衆靈以成性萬色歸乎善視萬聲攝乎善聽臭既别乎芳薉味亦甄乎邪正紛能言以能行乃時動而時靜其所以役其心思充其口體者蓋隨感以有觸或無涯以求騁於是巧暗相傾強弱相競欲海浩洋靡所底定聖王有作以道裁成室廬以處衣服以章庖厨以養車航以行有名位以嚴其限有親愛以屬其情勸之以爵賞董之以威刑鉏暴勘亂表忠逐良賢否以汰尊庳以疆民知向違咸樂其生嬴劉而降暨我皇明治忽迭易厯數幾更神帝嘉靖𢎞厥升平農服于野商踵于塗工竭其巧兵寢于隅塵積穰穰流貨膴膴士女相聚耆稚相餔姁姁雍雍靡婺靡孤毳服卉裳鳥言獸面龍伯鮫人之國雕題黑齒貫胸離耳三目四臂之徒大球南金犀貝明珠鷦鵬鷫鸘在子騊駼瑶籠綵絡盈篚充車奉表歸命滂溢乎名都當是時也有志之士涵菁莪朴棫之仁荷勸駕釋褐之寵莫不扼腕思奮彈冠望榮固有應六符法三光橫玉麟飫黃封撫華夷燮隂陽哂蕭魏而弗齒睨伊旦而與抗六卿分職厥屬攸宗太史臺諫實惟侍從有公卿文武以殿其內有藩臬守令以維其外棨戟霞連英豪雲萃籌策鬼神經綸天地寰瀛以之咸又億兆于焉永戴復有元勳世胄倚葭托肺丹書帶礪乎河山金貂趨蹌乎禁闕叶屈貴反貔貅林立乎白旄犬羊冰消乎紫塞珠玉隨咳唾風霆逐呼噫伊介反日月假其輝宇宙同其大精忠簡乎帝心勳名轟於萬代其或猿臂數竒霜蹄時蹶不與其進則圖其退爾乃在天時占星紀開阡陌制來耜耕耨以時又穫必倍若千若億為倉為積子利反或擅丹穴或儲紫貝出陳易新買賤賣貴雞鳴孳孳蠅頭惴惴量畜以谷閉門成市沈腦塗牆文繡被地玄妻素娥弄玉飛瓊之儔便娟巧麗顰眉睇目取憐乎左右叶盈異反戲魚龍而舞柘枝詠明月而歌百歲鐘鼗箜篌簫竽之音鏜鞈乎晝夜喧闐乎閭里所以快耳目而娛心志者亦足以稱豪於一時而不遂汶汶於斯世者也吾聞錫山有東沙子者俊偉人也粵其上世義熙惟寶始居慧山華里稱孝宋遷隆亭原泉則肇夷逃而華振業孔耀鵝津洋洋喬木杲杲節義之傳詩禮之教簮紱蟬聨蘭玉滋茂乃東沙子靡諧厥好蕭然一齋自樂其道胡于斯際匪則匪效上之不聞出才智佐明時以芥拾乎青紫下之不聞友豪俠置聲色以酣樂乎桑榆中又不屑廣田宅殖貨財以貽裕於胄胤其于世也若或醜之其于古也若或糾之自其幼壯至于艾矣頺然泊然不易厥守意其性爾殊乎抑無見乎聲利之徼歟蒙疑不釋願就正於有道素履山人默然不應瞿然直視已乃啞然而笑曰咈哉噫嘻子蓋未達乎真賞之趣也天地變化隂陽乘除曲成萬物理一分殊或清或濁合適其趣情别淑慝性分哲愚方五其俗人十其區玉不火燼金不土渝柏不霜摧橘不淮踰貉汶而斃蘭圃而枯薦嗜麋鹿帶甘即且物則有然而況于人乎宜子于此心猶豫而口囁嚅也且東沙子之賞真矣所得深矣請次第而宣之典午陽九豪沒于戍子憶父言老不冠娶既悲罔極亦傷國步終孝全忠克永厥譽弟嗣有傳慧麓延緒南北屢遷逮乎炎渡君選友聞德珍于舉配陳貞節勝國表著棲碧奉母堂軒是署貞固燹避國初定處乃經故莊佳氣鬱聚遺命克遵後昆斯裕玩易吟詩蟬脫鴻翥精誠動神明儀範昭士庶義烈維鄒存思弗措南坡孝友期頥繩矩即東沙父南坡翁痛母趙碩人值業中衰翁克振起而母不逮養故義讓于弟而自取其薄者希翁之媳嫓德二姥即東沙祖母錢碩人陽明諸公稱之謂其賢可繼陳鄒二姑也是鞠中甫敏而稽古其始也岐嶷秀頴成童耿介志超萬物之表心逰六藝之內諗雅頌之雍皥觀國風之成敗兼魯韓之旁博貫毛鄭之專治集歐王之新竒折朱吕之精粹細密義於繭絲振金石之清籟玩象辭於三聖誦典則於四代考禮樂於姬文審顧答於回賜明仁義於鄒輿談荒唐於莊惠伯陽尚其玄虛禦冦逞其恣睢孫吳備其竒詐管商顯其功利申韓忍於刻核屈宋陳其諷刺賈董敷其治策馬揚呈其詭麗遷固擬於春秋潘陸方於江海燕許誇其手筆李杜稱其雄偉王孟詠其幽雅儲韋味其清洌叶音例韓栁宗其典則曾蘇羡其汪沛以至岐黃之濟世曇摩之似是百家之殊途九流之異派靡不辨其瑕瑜導其肻綮飫其膏腴嘬其膋髓既填胸兮通理及援毫而吐思乍雲蒸而霞纈或川流以山峙發朝芳之芬葩謝夕叢之腓瘁軒乎蟉騰而獸駭翩兮鶴舞而鴻跂明揚文武經緯之略微闡天命性情之懿上敷帝王修治之範下述閭閻阽危之弊搜羅匪漏傾㵼無滯準古繩今規人矩世舉而措之固將黼黻乎皇猷而康濟乎品彚者也若乃締金朋啓蘭室合志方營道術濟唇齒染藍赤交以淡成言以忘得二泉師友乎希翁乃忘年乎膠漆南濠耽樂於圖書爰同趣乎米薛涇野忠直振時而健羡於夀席南原亷介絶俗而劇談乎月夕衡山耆德而文重於鈞石東郭同門而追蹤於淑實瓦屋髙簡而萬里致參同之益愧吾英爽而舊京賞蘭亭之迹石亭留夜坐之圖陳太史魯南有南雍夜坐圖詩林屋灑雞鳴之墨蔡九逵雞鳴寺贈詩資五嶽之麗藻黃勉之契蘿石之間逸海寧董澐樂何王之雄俊南贑何秦東廣王一為取月泉之空寂禪僧法聚自勉之等五人皆同逰陽明公之門相與切磨其功講習其業文會輔仁威儀是攝猶以為未足也白巖先生敦龎植性希叔旦之碩膚儕孔明之水鏡庶稚圭之無我齊君實之守正陽明夫子心學希聖超訓詁于關閩晤存養于曾孟播直聲于善感邁成功于李晟問氣之所鍾人望之所凝英才之所樂育曲木之所就正于焉鼓篋西行泛舟東競摳衣必慎執經求證學究淵源道廓蹊徑通乎常變達乎義命此其志豈效為我以自私曾無與乎天下之利病者哉嗟乎鞀鼓聲微吐握人邁顔異遭三卞和刖再寧人事之弗臧將天命之有在是故百藥恩深令伯情至元卿嚙指曹休垂涕臧循倉惶以無寢司馬徘徊而不對此東沙子之所以傷乎內也務光抱石魯連蹈海文舉樽空侯芭席敝子期賦于感音希範思乎絶藝此東沙子之所以感乎外也夫庶務前棼則清虛弗來七情中擾則衰白馴致易不云乎知進退存亡而不失其正也夫子亦云道之將行也與命也道之將廢也與命也君子知命亦審其進退而胡物之競矣爾乃闢故趾開三徑建新齋閟幽境珉磩平柏杗挺朱窗明素壁淨松關邃芝房迥青雲滃行月耿懸李書原米名去聲西涯八分齋匾米元章有生平真賞印梧隂垂砌荷香滿庭叶音定太湖靈壁英山武康錦川之石霞湧浪積鳥棲獸躑蛟潛魚躍菌秀英坼若醉若舞若戲若格嶜崟柴虒嵱嵷紆譎紛員兮庭實龍髯之松瓔珞之柏彌勒之竹合歡之橘丹桂青桐玉蘭木筆碧桃紅梅海棠朱楔紫蕙黃薇末麗杜若荼䕷瑞香水仙天棘宜男午葵姚黃紅藥昌陽日精鵑花瞿麥或蔭修除或森間隙欐力爾反佹音詭癹步葛反骩音靡藰音留蒞音利呹丑乙反肸希乙反猗伊以反柅尼已反的丁力反皪利力反葰音俊楙莫侯反芬茀凝甘露兮揚清颸蔽炎暉兮延皓月巢鸞鶴兮逰文魚噪寒蟬兮吟蟋蟀東沙子于是掃絶煩囂獨怡岑靜巷無車馬之音庭鮮襟裾之影置軒轅之棐几齋中又有紫桑小几寶晉舊物下有芾字押拭殷侯之金鼎白金羊鼎乃商時諸侯所用之器爇栴檀之珍香侑汝官之陶皿汝窑瓶洗各一官窑彜爐一色瑩如玉滌端州之紫硯小賁硯一旁有董草庭八分題字曰元與默為汝則學以全令德下上凡九眼似碧王青瑩東沙子常為余言河南提學副使王公韋有子石硯重不滿草兩色紫如嫩肝不假磨礲惟貯水處略加琢磨一眼徑寸餘圎極如太極有黃暈淺深八重中一重稍異間以白質青花點吳淑硯賦所謂點滴青花是也正合李白集中上皇西巡南京歌第七首楊齊賢注云葉三藏自西域歸過峩眉縣大峩山寶硯溪見兩石子鬬攬得其一今藏黑水寺石上有一日端正透底奚以此得名日照其石常五色光相王南原金陵人此石乃其先諌議辣齊公購于一僧云自蜀中得之豈即此歟東沙常借留齋中後歸丹陽孫氏列點蒼之秀屛叶上聲其一春景晴巒雲氣吞吐內凡七十二峯其二秋巖積翠山青雲白三逺畢其伏溪徐文晴物又小石屏二瀟湘雨晴逺岫凝緑最勝者一面雲峯石色濃淡悉分非筆墨所能髣佛一面春龍出蟄頭角爪鬛悉備目睛炯然幾欲飛動舊藏京口楊氏佩不衰之漢熊古玉小熊長不及寸腹下篆刻文曰能使人不衰細如米粒握如脂之古印白玉螭紐三印今改刻瓢印曰真賞方印一曰華夏一曰真賞齋印東漢楊彪文先四代相印朱文虎紐雕琢精工神韻生動旁皆碾花又一印曰三愧之裔通身古卧蠶朱文螭紐刻深而竒溫潤無比髙宗吳后二卬賢志堂印白文螭紐賢志主人覆斗卧蠶俱精絶被朱衣之翩翩啓瓊笈之縵縵叶眉孟反昔者周穆巡狩至乎壇山吉日癸巳親題石間弩張劍拔虎跳龍盤通古卧車而心悟李斯卧觀五日得其法作小篆中祐龕壁而跋存宋李中祐鑿石龕之廳壁間雖贊皇之未泯緊古意之邈然今趙州所傳蓋經摹勒多矣兹僅見乎齋中蓋唐宋之所傳此獨無跋義紙墨甚古乃宋以前拓本也漢世隆儒六經是訂雍立典賜八分稱聖蔡雍左立堂溪典楊賜等書石武定遷鄴而半沈北魏髙歡遷石經河岸崩遂沈于水貞觀寶墨而獨進唐祕府不收石刻惟珍此經矧蓬萊之摹本亦亡滅而莫問吾子行曰會稽蓬萊間有石經遺字翻本破碎磨滅不異真古碑今亡矣幸百許之遺文尚書三十三字論語百字諒虬驥之堪並東觀餘論云石經傳世止此若騏驥一毛虬龍片甲銘石之楷魏首元常幽深絶世古雅無方悵敬仁之俱逝王修愛宣示帖修卒取以入殉訝宣和之拓藏宣和書譜唯有克捷表歐陽永叔董逌皆以為非真薦賢表乎季直纂要紀乎士行叶音杭煥貞淳之寶印遺照乘之夜光季直表有頁觀淳化二小璽元張紳書學纂要記之李太僕應禎謂積筆成冢不能得其波拂真迹無疑誠曠代之至寶也草書之極晉惟逸少智聖大成形神俱妙孟子集大成者金聲而玉振之也金聲也者始條理也玉振之也者終條理也始條理者智之事也終條理者聖之事也玉皇心印經云形神俱妙與道合真彼王著之摹刻徒肉勝之遺誚咨袁生之真墨徵八璽之熀耀矧祐陵之金題覩孤鳳之縹眇方慶臣瞾文獻仍孫王方慶乃晉丞相王導十一世孫也廓填鑑影郢人運斤信得門而窺奧豈虎賁之旁尊始金輪之辱序終倦翁之見珍翁跋云態備衆妙摹逼天真非他帖可擬況棲碧之手澤帖復有貞節堂禮義傳家之印春草軒審是記蓋棲碧舊藏也幸青氊之得人初學詩讚編聨庾謝綵箋古色仙蹤疇亞燁霓裳兮逍遙絢春林兮布濩叶胡化反想投迹於虛空殆爭工乎造化詳竇泉述書賦注閲神龍而流芳載書譜而增價偉哉魯公忠誠川流叶去聲止擬劍峰書譜謂公正書如峰絶劍摧驚飛逸勢行超篆籒海嶽名言謂顔行書有篆籒氣象慰嬴磁之既平帖云近聞劉中使至嬴州吳希光已降足慰海隅之心耳又聞磁州為盧子竒所圍舍利將軍擒獲之吁足慰也凛英風之發秀燦碧箋兮宜墨駭龍蛇兮奔驟术史云碧箋宜墨神采艷發龍蛇生動覩之驚人此帖同之歷七君之品題實諸帖之領袖帖後王芝喬簣成鮮于樞張晏白珽田衍文徵明矯然季海楷法稱雄怒猊渴驥書譜許浩書如怒猊抉石渴驥奔泉父王祖鍾董逌云季海守鍾王舊法如禪家宗風相承各有主也述老彭之元訓老聃即彭祖通鑑前編路史等書可考而辨道家相傳之妄準樂毅之竒蹤董逌謂浩書自樂毅論來爛玄真之丹識有青若笠緑蓑衣印蓋玄真子張志和識縟黃素兮金龍唐絹精竒每行織成龍鳯問以花點僅如米大延之譝其第一尤袤謂唐人小楷徐季海第一原功詫其難能叶奴融反杜本跋非力挽千鈞何能爾耶乃若髙人摩詰前身畫師家輞川之幽勝寫詩景之瑰竒孟城坳華子岡丈杏館斤竹嶺鹿柴木蘭柴茱茰沜宫槐陌臨湖亭南垞欹湖栁堤欒家瀨金屑泉白石灘北垞竹里館辛夷塢漆園椒園凡二十景各賦五言絶龍眠摹本作十二段此卷長七尺餘總為一圖而諸景咸備𢎞治間金陵黃休叔伯賜剖古漆墩得之即斯卷也山盤紆兮挾霧林蹇産而藏暉水揚縠而渺渺雪篩粉以霏霏斯景元之攸録見未景元唐朝名畫録乃天府之所詒狂仙忠恕尤妙書法書譜忠恕妙于篆籒八分尤工小楷委羈宦而肥遁史忠恕謫江都一日遁去不知所在乃與陳摶同隱狀江行之霽雪景翳翳兮霾深波粼粼兮澌滑愴坎廩兮擁袂舟凌兢兮礙枻紛倡和之琳琅允誇詡之昭揭五季書亡君謨聿興世方宗其楷法妙實在乎真行詠山堂之秀句陳子發之至情啓平事而端謹示新記兮崢嶸統二八之并美山堂絶句並安道彥猷謝郎評事子發新記新弟郎中知郡通理公緯萊州長官公謹吕君共十六帖標五子之題名倪雲林袁凱陳文東陳迪吳匏庵元豐彌文豫章獨步變行押于清臣山谷行書本顔祭濠州蔡明逮等帖習顛草於懷素山谷見自敘草書遂大進伏波稱其神偉稱去聲諸座資其頓悟尺牘表其妍姿舊逰發其豪趣睨顔蔡而追隨軼蘇米而不顧思陵南渡繼體道君當金戈之倥偬乃留意乎斯文忽神逰兮太上遂手追乎右軍皎翔鸞之舞鏡邈羣鴈之凌雲奉華拜乎嘉錫卷有奉華堂印乃劉貴嬪堂名蓋帝書以賜之亨貞品其入神邵亨貞跋為江南法書神品元暉克肖播堂海嶽行書賞於光堯戲墨貴於京洛思襄陽之舊逰顧瀟湘之是貌吐洛反藹晴雨之變幻縱天真之揮霍象內則晦翁屢題畫表則子言斯度音鐸卷長文餘朱文公題云建陽崇安之間有大山橫出峰巒特秀豫嘗結茅於其巔小平處每當晴晝白雲岔入窗牖間輒咫尺不可辨當題間雲無四時蔽漫此山谷幸乏霖雨姿何妨媚幽獨下山纍月每竊諷此詩木嘗不悵然自失今觀米公所畫為左侯戲作橫卷隱隱舊題詩處似已在第三四峯間也義得并覽諸名勝舊題想像其人益深歎息錢子言跋云雨山晴山易此惟晴欲雨雨欲霽宿霧曉煙既冸復合景物昧昧時一出沒于有無難狀也此非墨妙天下意超物表者斷不能到王宗常考云故兵部侍郎襄陽米友仁元暉所畫瀟湘圖一卷其自題識凡兩見南渡後諸名勝題語凡若干人文公朱夫子手澤又先後出也沈啓南云如朱夫子之題象內見畫錢子言畫表求象斯圖之妙盡括于二作矣次平畫院髣佛李唐兼承直之家傳次年父閻仲紹興承直郎殆出藍之擅長當阜陵之辛丑灑積雪於回岡風隨盼而忽暝墨深黑而流光恍三伏之全失凛琉璃之對窗晉滿奮暑月坐武帝琉璃窗下變色而栗魏國王孫神仙玉倚灑翰齊乎王鍾繪事超乎韓李子昻畫馬取韓幹山水兼法李思訓經賦宛其神傳臨子敬洛神鍾紹京黃庭山水怡然天解叶箕里反塞翁讓其三百吳越羅塞翁隱之子也善畫羊詩無羊三百為羣暮江望其千里柯敬仲云韋偃暮江五馬圖與子昻氣韻相望洗晚宋之衰苶為來世之模楷叶溪已反至於淳化祖刻則廷圭墨色之古銀錠棗木之紋坡老硃書之辨趙公信印之文啓明向曙離劍還津中甫先得六卷後得三卷益原是一帙分開今乃復合文休承以為劍入延平是也較之師旦子明之刻次莊希白之臨叶力因及烏鎮福清之勒武光東庫之分精粗迥别不可得而並論焉論平聲小楷諸帖則毅論紳刻之真朔贊初鐫之勝黃庭遺字之精洛神全賦之敻尺璧斯陳懸黎孤映與夫虞之破邪論序歐之白鹿心經叶去聲褚之隂符度人栁之尊勝清淨金生玉潤咸可得而繼稱焉莫不重之逾琬琰寶之過頭目被古錦之縹囊飾美玉之籖軸知臭味之俱無白樂天太湖石記云無文無聲無臭無味而公嗜之何也苟適吾意其用則多何狗馬之可辱李易安金石録序云趙君愛書畫出于聲色狗馬之上蓋遊藝以依仁寧玩物而徇欲飲沆瀣兮吸朝霞沐咸池兮浴暘谷乘野馬兮逰泰初班由夷兮謁荼嚳量今古於一瞬量平聲攬宇宙於圭竇叶徒谷反心淡淡兮坐忘行踽踽兮背俗聊棲遲以容與每寓意而自足所謂皭然蟬蛻浮遊塵壒之外離人而立於獨者非耶言未既公子憮然而嘯逡巡曰避山人曰焰焰斯風乃炎崑峨涓涓斯濬乃瀰江河神明既啓粗穢則那公子居矣吾將授子以皓天之歌歌曰皓天明明森成性兮迷亡徇物孰知正兮福輕乎羽舉孰先兮釁重乎地避孰全兮息交絶逰聞齋中兮厥心冥冥若虛空兮左圖右書􅀈煙雲兮日月逝矣葆吾真兮公子聞之渙然顙泚下席而拜起而稱曰鄙人顓蒙溺乎荒俗之趨未聞大道之旨者也幸夫子迪我若發蒙矣願卒業為弟子乃賡之以中邱之歌歌曰相彼中邱勃窣壤兮行潦橫集又莽霜兮脂車結駟天貿貿兮日昃之離鑑鼓缶兮無纍之人迥絶代兮弟子釋疑真賞泰兮大夫能賦昭中甫兮琢珉龕齋俾無斁兮嘉靖二十八年屠維作噩月在鶉火之次日在參前進士天官尚書郎南禺外史豐道生人叔著前署真賞齋賦并序六字又項德枌印蘭石主人二印後有項德枌印五一倩士宛委堂印檇李懶道人賞鑑圖書諸印押縫有德枌印九卷髙一尺一寸一分廣三尺三寸二分按豐道生賦表忠遂賢良以汰賢字上疑脫一字又逡巡曰避曰字應是而字明陳栝三友圖一卷上等陽一宣德箋本墨畫欵識云嘉靖庚戌春暮作於黽勉齋沱江子陳栝下有沱江子朗吟樓二印卷前有致印宋氏稚佳書畫庫記聽雨堂印三印卷後有宋致稚佳收藏圖書休寧朱之赤珍藏圖書二印卷中幅押縫有擇木亭一印卷髙九寸廣七尺六寸明宋旭沈俊山水合卷上等雲一凡三幅前二幅俱宋旭墨畫第一幅宋箋本欵題云種梅花處幾經年映雪仍新屋一椽最是春思眠不得每逢花落益翛然甲申二月望宋旭識下有初陽一印第二幅素箋本欵識云西園寒夜浣筆寫雪堂清敘圖後有太原生一印第三幅素箋本沈俊著色畫欵云戴雪軒圖沈俊下有沈俊私印一印第一幅髙七寸六分廣二尺九寸第二幅髙八寸八分廣二尺七寸五分第三幅髙同前廣二尺八寸五分明許邦本摹輞川圖一卷上等騰一宣德箋本著色畫每段小楷書原詩欵云湘江許邦本育生繪於真如齋下有邦本一印後小楷書名人跋語四則一邢侗云摩詰有韻之言遂為李唐一代冠冕要以胸次灑然勝耳其丹青逰戲則又迥出世俗之表今所傳本名輞川圖之肖者蓋摩詰原自有圖圖分二十如所賦五言詩濃嵐疊嶂蒼蘚碧巢曲盡巧心而吳人或病其太著以為其不似近世之態此可笑也夫意致欲虛筆致欲實此正北宋以前箇中妙悟而吳人魔於勝國之技不能驟脫夏蟲遼豕之喻豈虛哉吳中故家藏有當日粉本郭忠恕曾摹一卷較祖迹不别毫髮庶藉以存藍田之舊亦使誦其詩者有所據以尋于縑素方丈間耳摩詰自謂宿世謬詞客前身應畫師可稱實録云濟南臨邑邢侗手跋一來復云右丞之與輞川蓋神情大半寄之者也輞川之締構盛于一時繪而傳之者至流布千古而鹿苑滋谷之舊迹浸淪沒于狐兔莽荻之間而莫可尋覔往關中曾有鐫圖拙陋不堪摩挲弔古訪幽者對夕陽咨嗟已耳沈澤腴明府以博雅通儒試宰藍田政搜其遺概清尊髙論若與右丞揖讓已則索不佞家藏郭忠恕繪圖邀晉人郭潄六氏摹臨勒石精巧生動幾集忠恕之神令人想肖右丞不可泯之風流也惟繪此圖者合有多種而余家所藏以善蒞兹土者也亦人代幾更而至澤腴之身始成此段雅事名迹名繪名器名手集賞一旦豈偶然哉池陽來復陽伯甫一郝經云余覽郭忠恕摹臨輞川圖恍惚蒼茫怪竒偉麗不啻觀濤廣陵之曲江也玉出崑山珠産南海此天下之至重矣然而非希世罕見之寶何足比哉余閲此卷不得不贊詞以同不朽為之志侍讀學士充國信史陵州郝經一楊士竒云輞川圖古今人品為畫家最上乘商德符長卷劉松年分景小幅余當時摹之大小方狹分聚總有粗細亦非二體摹者亦非一人後惟郭忠恕所摹極稱妙絶而諸名公跋語皆甚典雅乃推重右丞之意云楊士竒後署晚學許邦本書下有邦本一印卷前有畫禪花癖一印卷後有誠意齋珍藏一印押縫有誠意齋一印又二印不可識卷高九寸五分廣一丈五尺九寸五分御筆題籖籖上有乾隆宸翰一璽按跋語四則皆題郭忠恕輞川圖臨本者而字句舛誤頗多蓋亦傳寫失真耳石渠寶笈卷十五
