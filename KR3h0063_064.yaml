body:
  text: 貯御書房四列朝人書卷次等晉王羲之平安何如奉橘三帖一卷唐明皇賜毛應佺知恤詔一卷唐褚遂良摹王羲之長風帖一卷唐張旭四帖一卷唐懷素自叙帖一卷宋孝宗賜周必大手勑一卷宋黄庭堅書七言絶句一卷宋黄庭堅書蘓軾海棠詩一卷宋黄庭堅書髙松賦一卷宋黄庭堅書李白詩一卷宋米芾臨定武蘭亭一卷宋薛紹彭臨蘭亭序一卷宋朱子自書五言古詩一卷宋陸㳺詩翰一卷宋文天祥書本鷄集序一卷元趙孟頫書國語晉文請隧一卷元趙孟頫書千文一卷元趙孟頫書千文一卷元趙孟頫自書詩帖一卷元趙孟頫書洛神武一卷元趙孟頫書明肅樓記一卷元鮮于樞書杜詩一卷元鮮于樞書御史箴一卷元鮮于樞書王安石雜詩一卷元張雨自書詩帖一卷元明人詞翰一卷明人墨蹟一卷明沈粲千文一卷明李東陽自書各體詩一卷明沈周書中秋詩一卷明沈周書化鬚疏一卷明王守仁自書詩帖一卷明祝允明書千文一卷明祝允明詩帖一卷明祝允明書七言律詩一卷明祝允明詩翰一卷明祝允明雜書一卷明祝允明書離騷首篇一卷明祝允明書宋儒六賢傳志一卷明祝允明雜書詩帖一卷明祝允明詩帖一卷明文徵明書醉翁亭記一卷明文徵明自書七言律詩一卷明文徵明題宋髙宗賜岳飛手勑詞一卷明文徵明自書詩帖一卷明文徵明書四體千文一卷明文徵明書前後赤壁賦一卷明文徵明自書七言律詩一卷明文徵明臨懷素自叙帖一卷明文彭書七言律詩一卷明王寵雜書一卷明王寵書莊子内七篇一卷明王寵詩帖一卷明王寵書韓愈送李愿歸盤谷序一卷明王寵書雜詩一卷明王寵書雜詩一卷明陳淳書秋興詩一卷明李孟陽詩帖一卷明陸深書沛水行一卷明朱潢南書應制詩一卷明莫如忠自書詩帖一卷明彭年臨蘓軾歸去來辭一卷明徐渭書千文一卷明許光祚書琴賦一卷明董其昌書五言古詩一卷明董其昌書雲笈一卷明董其昌雜書一卷明董其昌書毛仙翁傳一卷明董其昌書額一卷明董其昌自書詩帖一卷明董其昌書髙都䕶總馬行一卷明董其昌書王公弼誥一卷明董其昌書禪悦一卷明董其昌書燕然山銘一卷明董其昌自書詩帖一卷明婁堅書五言古詩一卷明陳元素詩翰一卷唐臨王羲之東方朔像贊一卷唐鈎王羲之干嘔帖一卷米芾書唐詩一卷唐摹王羲之干嘔帖一卷沈荃書漢詔一卷沈荃書唐賦一卷沈荃書千文一卷沈荃臨米芾書一卷沈荃臨顔真卿爭座位帖一卷沈荃仿米芾書一卷沈荃書唐人截句一卷
