body:
  text: 貯御書房三列朝人書卷上等元趙孟俯書小學一卷上等秋一金粟箋烏絲闌本小楷書款云臣趙孟俯書明倫篇中缺九十六字邵彌補書押縫有邵僧彌聫印拖尾錢虞山跋云文敏公一生苦心學書得右軍之正傳行書又在大令北海之間至於細楷薄海內外窮搜不可得此卷成宗時書以進呈者字數約有三萬而小大勻圓則一誠希世之寶也所可惜者內府祕儲之物尚有時流落于人間安知千百年後此卷更屬何人凡吾子孫當以余言為鑑也宜寶惜之時天啓丙寅三月六日虞山識又邵彌跋云松雪老人細楷世不多見況纍數千言絶無魯魚亥豕之誤誠至寶也獨於中為後人失去九十六字深可惜哉一日在牧師耦耕堂中出卷索補彌且縮手固辭以老師言之再四莫敢相違敬填之時崇禎戊寅秋八月門人邵彌並識卷髙九寸廣二丈四尺一寸二分元趙孟俯書千文一卷上等秋二宋箋烏絲闌本楷書識云大德六年歲在壬寅季春望前三日後一印缺存趙字卷前有項元汴印項子京家珍藏項墨林鑑賞章墨林山人子孫世昌諸印卷後有神品檇李項氏世家寶玩項元汴印子京父印項墨林鑑賞章諸印卷中幅押縫有墨林子京所藏二印前隔水押縫有墨林子宫保世家項墨林父祕笈之印三印後隔水押縫有退密子孫世昌墨林山人宫保世家諸印引首有天籟閣項叔子子京虛朗齋諸印卷髙八寸廣一丈元趙孟俯書千文一卷上等秋三素絹烏絲闌本行書款云子昻書下有趙子昻氏一印卷前有趙字大雅二印又金書趙文敏公書五字又神品郭衢階印郭亨父氏廖字迂山人關大道印江陽郭氏家藏王澍印諸印又珍賞長公半印二又半印不可識卷後有閩迂仙廖守初氏郭衢階賞鑑筆硯精良永存珍祕吳廷之印諸印又珍賞半印廖氏尊樂半印又半印二不可識引首有徐霖篆書松雪千文四大字款云後學吳郡徐霖敬題前有良常王澍祕玩六字又長宜子孫尚書郎郭衢階印廖氏尊樂堂書畫記諸印後半印不可識拖尾張雨跋云智永書千文八百本散江南諸寺今無一二存吳興書嘗患其多去世幾何年若此本者霜曉長庚無與並其光采缺展對惘然老生張雨記後有尚書郎亨父衢階鑑賞顧之印顧朗哉氏諸印前有合同半印又莫雲卿跋云昔人謂方圓一萬里上下數百年絶無承旨書法觀此本信然吾不辨其師匠何代而要若此本之沈著穩便非其指捥間得書家三昧未易能也此公千文卷余所見亦不下數十種而獨此為尤妙郭亨父善八法故得藏之後學莫雲卿題後有守初懷迂道人二印又有至正丙戌良月望日元覽道人觀記語十三字又至正六年十月十二日趙雍拜觀十三字又至正丙戌十月二十日奕拜手謹觀十四字又王國器跋云嗚呼公今往矣生而文登琬琰珍藏內祕沒而篆記玉樓遊宴清都其流落人間者一波一戈偶爾見之不覺老淚淒落王國器拜題後有迂仙小雅堂印二印又鄭元祐跋云魏公書千文較之智永固不止八百本今散落人間者缺尚得見自宋渡南至國家一海宇法書第一蓋無及公者吾宗髙士君來自龍虎山山中寶藏公書者至與天真皇人按筆同又非人間世所得比也遂昌鄭元祐識後有亨父衢階二印又黃公望題云經進仁皇全五體千文篆隸草真行當年親見公揮灑松雪齋中小學生黃公望稽首謹題至正七年夏五書於龍德通仙宫松聲樓時年七十九後有迂仙亨父郭衢階印諸印又嘉靖庚子季夏望太原張湘觀記語十二字又詹景鳳跋云趙承旨此卷千文蓋學沈馨元魏受禪碑沈書世人罕見余固表而出之假令承旨有靈當必莞爾而笑且服詹生知公源委於三百年後也此卷筆法高古圓潤峻秀為承旨得意之作新安詹景鳳又郭衢階跋云逸少有名之迹不過數首黃庭勸進像贊洛神而已吳興公若此等書所謂字字注目畫畫抽心者足擬黃庭數首詎可多得耶張雨鄭元祐輩當時已甚祕惜之矧逾二百餘年而今神光猶自奕奕也後學蜀中郭衢階題又蘇雨跋云松雪翁書法宗逸少而有天然三昧自得之妙今去翁三百餘歲乃覩此真迹遇顧不竒哉萬厯甲申仲秋草九日渝人蘇雨識又徐霖識云吳郡徐霖拜觀於廖雲如之小雅堂時正德己卯又關大道跋云吳興公書法上追晉人此本尤其得意者誠可寶也汝南關大道跋後有吳復亨印吳孟嘉氏二印又廖守初識云正德己卯十月草二日江左廖守初觀於椿棣同華之堂又沈紹文跋云此卷匪直後輩所不易見亦文敏公所不易書者一刻披對便足千古敢識數字以附不朽丁亥春日華亭沈紹文同觀者新都吳景白氏又袁帙識云嘉靖辛丑仲春之月十有九日姑蘇後學袁帙觀於默齋先生之官舍又王守識云嘉靖辛丑仲春草五日吳郡王守觀於默齋先生白下官舍又東郭山人鄒守益拜觀九字又李本識云始見松雪真筆平生一快李本識又蘇术識云嘉靖辛丑中伏日陽川雙柏蘇术觀於清戎公署山隂龍溪王畿同觀後有衢階亨父鑒定真迹若林虛舟諸印又半印不可識諸跋中押縫合同印凡四卷髙八寸二分廣一丈一尺六寸四分元趙孟俯二體千文一卷上等秋四素絹朱絲闌本真草二體相間書款識云延祐戊午十一月二十七日子昻書下有趙子昻氏一印卷前二體署真草千文八字有趙字趙氏書印二印又天籟閣退密項墨林父祕笈之印王延世宫保世家檇李項叔子子孫世昌項元汴印墨林祕玩項子京家珍藏項元汴印諸印又神品連印卷後有項元汴印項墨林父祕笈之印王延世印子京子孫永保子京父印項墨林鑑賞章檇李項氏世家寶玩諸印又神品一印又賞心平生髻珠半印三别幅附尺牘一則云孟俯頓首啓事進之提舉友愛足下久不蒙惠字想為况清適不肖託庇平平無足道者前者發至朱絲闌絹今寫真草千文奉還冀示至因便率爾數字不宣十一月二十九日孟俯頓首前有寄傲項元汴印墨林山人項子京家珍藏神遊心賞諸印後有平生真賞檇李項氏世家珍玩子京墨林祕玩子孫世昌王氏思延諸印押縫有賞心樂事髻珠鑑定章二印卷髙八寸廣二丈五尺八寸元趙孟俯書歸去來辭一卷上等秋五素箋本行楷書款署子昻下有趙子昻氏天水郡圖書印二印卷中幅押縫有神品一印前别幅素絹本墨畫陶潛像一又别幅素綾本趙孟籲跋云余少年愛弄筆墨時亦染翰遊戲今兩目眵昏不復能爾回首疇昔政堪一笑至治元年十二月二十六日子浚題卷髙七寸五分廣四尺五寸五分元趙孟俯書稽康絶交書一卷上等秋六金粟箋烏絲闌本行書款署子昻上鈐趙氏子昻一印卷前有桂坡安國賞鑒一印卷髙七寸六分廣一丈元趙孟俯書間居賦一卷上等秋七素箋本行楷書款署子昻下有趙氏子昻一印又心賞淞洲二印前隔水有古香書屋一印拖尾有曹溶跋云趙文敏在元朝甚被寵遇洊厯中外勤於職事晏息水晶宫之日較短其書間居賦得無倦於仕進寄蓴鱸之思歟用筆純思李北海而運以姿秀不詭過江家法定為晚年合作倦圃老人曹溶卷髙一尺一寸八分廣七尺七寸三分元趙孟俯書雪賦一卷上等秋八素箋本行書款云子昻為仲逺書下有趙氏子昻一印卷前有神品珍賞項元汴印松郡米氏墨林祕玩諸印又一印缺其半存氏收藏之印五字卷後有篆書記語項氏子京真賞六字又寄傲墨林山人平生珍賞項子京家珍藏玉泉氏珍玩氏鑑古堂印神品項元汴印項墨林鑑賞章檇李項氏世家寶玩墨林祕玩若水軒墨林子子孫世昌文石米象元氏諸印又一印不可識前隔水有項墨林鑑賞章一印押縫有寄傲項子京家珍藏退密平生真賞諸印後隔水有子孫世昌一印押縫有寄傲子孫永保檇李若水軒項墨林父祕笈之印諸印引首有項元汴印宫保世家二印拖尾最後有項元汴記語云元趙魏國真行書晉謝惠連著雪賦明山人項元汴珍祕卷髙七寸八分廣五尺八寸九分元趙孟俯書歸田賦一卷上等秋九宋箋本行楷書款署子昻下有趙氏子昻一印卷前有扶風世家會稽梅梁馬藴仲陽印司馬蘭亭家藏三印卷後有司馬蘭亭家藏馬伯子藴仲元二印卷中幅有梅梁一印前隔水有錢氏素軒書畫之記一印押縫有敬美又錢氏合縫鼎印二印拖尾豐道生跋云張平子博學工文出處清正東都士之翹楚者也孟俯知録其賦獨不師其人品寧復有愧色耶此卷實其晚年真迹延祐以後七十餘矣頽筆老態顯然可驗終自二王中來略無俗氣余收趙書頗多皆識歲月遂能鑑定之耳隆慶己巳四月四日豐道生後有馬藴之印一印又王世貞跋云趙吳興子昻書張平子歸田賦有以為類宋人者當是見其取態謂米襄陽見其藏鋒謂薛河東耳不知結法自二王來而大令分數獨勝居然有閉門造車開門合轍之妙與余家所藏天馬圖贊雜詩迹正同大較髙處在肉不沒骨筋不外透雖姿韻溢發而波瀾老成譬之豐肌玉環作霓裳舞誰不心醉平子此賦殆是解太史令五年內作聊以寓其蕭散跌宕意耳春秋至六十三尚作尚書典樞要豈若淵明之真能咏歸去來者史固稱其少工屬文貫六藝善機巧似後身之蔡中郎始究八法而兼綜之千載而得吳興其才技風流大有相賞契者而豐生老悖不學僅取歸田之名而恣其甚口於宋王孫寧非所謂蜉蝣撼大樹耶且吳興卒於至治二年年六十九而今謂延祐以後七十餘時筆結法妙脫蹊徑惟祝希哲十九首略近之而蚩其頽筆老態遇殺風景人無可奈何因附志於此萬厯辛巳秋仲王世貞書又王世懋跋云余自辛巳歲解關中之綬始有此歸田賦壬午冬復召補浙江學憲以疾力辭癸未春得請養疴淡圃先是隂雨浹旬寒食日忽開霽籃輿抵家念所藏古墨迹久不披玩展卷首得此賦讀之正仲春時景象也平子能賦而不能歸子昻能書而不能踐余何人斯而果斯緣即賦中弋釣之事僕病未能老氏遺誡何敢多讓若夫承旨書法之妙人翁老悖之譏余兄已悉之矣萬厯十一年閏二月十三日王世懋書於日損齋中卷髙一尺九分廣四尺二寸二分御筆題籖籖上有乾隆宸翰一璽元趙孟俯書朱子感興詩一卷上等秋十素箋本行楷書款識云後學趙孟俯書下有趙氏子昻一印卷前有董氏元宰礎字二印卷末有鳳起礎字王儼齋鑑賞法墨名畫諸印卷中幅押縫有寶奎堂印凡二十二拖尾陳淳跋云趙文敏公書妙絶古今片紙隻字重如金玉況此巨卷尤為罕見余嘗藏公所書道德經小楷一卷文賦一卷今皆散失若併得之可相伯仲洛川其用心求購吾將快覩焉嘉靖癸卯仲冬望后白陽山人陳道復前有一印缺其半存齋收藏記四字卷髙八寸八分廣九尺八寸四分元趙孟俯書蘇軾古詩一卷上等一秋十素箋本行書款識云大德十年十月初余謁中峯老師適他出與我月林上人話及東坡次韻潛師之語出紙墨索書一通以為禪房清供呵呵三教弟子趙孟俯記下有趙氏子昻鷗波二印卷前有趙字一印拖尾董其昌跋云趙吳興為中峯書此卷全類李北海最稱合作其詩亦學韓昌黎石鼓歌後有鷗波小印蓋鷗波亭公家臨池處獨此卷見之董其昌題又程正揆跋云豫曾得祖榻淳化四卷李北海數日帖多藏鋒拙筆與世所刻尖露者不類故知文敏得其神髓非僅為優孟衣冠也程正揆又文從簡跋云趙文敏書法得嶽麓三昧評者云微傷於肥此卷瘦徑遒逸又入雲麾之彀公於北海變化隨筆神形俱符上下五百年縱橫一萬里信然文從簡卷髙一尺六寸廣四尺二寸二分按此卷相望落落句下脫一星字元趙孟俯書蘇軾西湖詩一卷上等二秋十宋箋本行楷書款識云延祐七年秋與明逺遊西湖諸名剎見東坡數作併録一過子昻下有松雪齋一印卷前有王顓菴書畫記半隱樓書畫記軍假司馬西漢曲逆侯裔皇宋文正公孫黃從志印餘春堂諸印卷後有王掞之印顓菴真賞煙客三印前隔水有協一堂珍玩書畫圖書太原王氏珍藏王遜之書畫記三印後隔水有協一堂珍玩書畫圖書一印拖尾有沈度跋云右趙文敏書坡仙西湖詩一卷筆力遒徑姿態橫溢正中年妙境之書不可不寶雲間沈度跋又彭年跋云余閲文敏書多矣每謂其微傷習氣獨此卷古致錯落深得二王遺法想其録坡翁詩尤為用意耳昌榖持示聊書數語於後沛彭年識於雲卧閣後有王時敏印煙客真賞二印卷髙一尺零五分廣四尺一寸六分元趙孟俯書前後赤壁賦一卷上等三秋十宋箋本行楷書前後二篇前則下有趙氏子昻一印後則款識云子昻為嶽上人書大德三年十一月晦下有趙氏子昻一印卷前有吳興莫氏雲房清玩二印卷末有都尉耿信公書畫之章巨鹿郡圖書印二印又一印不可識卷中幅押縫有趙氏子昻印二又渤海主人珍藏印凡三又莫昌景行時習齋二印前隔水押縫有渤海主人珍藏一印拖尾有月潭朱之赤二印卷髙九寸五分廣一丈三尺九寸六分元趙孟俯書秋聲賦一卷上等四秋十素箋本行書款署子昻下有趙氏子昻一印卷前有天籟閣退密雲麒吳子弄筆山房清玩苕南吳氏午峰鑒賞文徴明印徴仲若水軒項德機諸印又張氏半印又二印俱缺存圖字卷末有蝶菴書畫檇李項氏世家寶玩子孫永保墨林子子京父印墨林祕玩項德機印宛委堂印文彭之印文夀承氏文嘉休承諸印又張字吳氏半印二中幅押縫有張氏若水軒墨林點易臺德機蘭石主人諸印卷髙一尺一寸廣五尺八寸五分元趙孟俯書吳興賦一卷上等五秋十素絹烏絲闌本行楷書款識云至正二年春仲三日趙孟俯書似周正平學士教正後有趙氏子昻趙孟俯印瑞文圖書墨妙天水郡圖書印諸印卷前有趙字大雅松雪齋三印卷中幅押縫有松雪齋墨妙天水郡圖書印三印卷髙七寸七分廣六尺五寸九分元趙孟俯書間邪公家傳一卷上等六秋十素箋本楷書款云吳興趙孟俯書下有趙氏子昻一印卷前有李君實鑒定一印卷髙六寸七分廣三尺六寸八分元趙孟俯書萬夀曲一卷上等七秋十素箋本行楷書樂府四章款署臣孟俯下有臣孟俯一印卷末王令顯印一印拖尾柯九思題云曲破未終招大樂舞童舞女一時回普天率土祈洪福同上君王萬歲杯自注云右所進樂府蓋曲破所奏也曲破舞旋時丞相進酒致祝頌之詞曰普天率土祈天地之洪福同上皇帝皇后萬歲之夀教坊初奏月中仙曾侍前星拜御筵四海至今思聖主承平休養德如天自注云臣九思嘗被旨俾以説書侍英皇潛邸玉堂學士制新詞親見當年應詔時政是落花江外雨重歌遺調不勝悲至元四年後戊寅歲臣九思恭題卷髙八寸五分廣四尺四寸五分元趙孟俯書趵突泉詩一卷上等八秋十素箋本行書款識云右二題皆濟南近郭佳處公謹家故齊也遂為書此孟俯後有趙字大雅趙氏子昻松雪齋趙氏書印諸印卷首有陀羅濮陽李廷相書屋記氣士梵因三昧正受江表黃琳休伯關內侯印諸印卷後有琳印懷德堂歡喜藏三昧正受諸印前隔水有易菴圖書勝國文獻黃琳美之殿中司馬表功旌烈之家諸印後隔水有李夢弼氏圖書黃琳美之黃休伯父諸印拖尾僧來復和詩云厯下靈泉絶世無白河倒影侵氷壺三春渾作桃花漲六月潛回草樹枯元氣空濛蒸海岱大聲震蕩接江湖擬從天上尋源去振䇿東觀碣石孤右次趵突泉詩韻靈隱蒲菴前有黃美之氏易菴圖書二印後有黃琳美之一印又僧𢎞道題云魏國風流一代賢才華如錦筆如椽為官昔在濟南郡出郭曾題趵突泉鵠峙鸞停文力健龍蟠鳳翥墨花鮮玉堂學士今何有開卷令人獨愴然吳沙門𢎞道後有江表黃琳勝國文獻一江諸印又僧守仁和云玉堂文彩古今無厯下亭前酒一壺聲譽欲同丘嶽重墨痕不逐水泉枯謫仙壯氣橫青海賀老清風滿鑑湖春日題詩重悵望濟南山逺白雲孤右追和松雪道人趵突泉詩一首長干沙門守仁書時洪武己巳春三月十日也前有黃美之氏休伯二印又僧清濬跋云松雪老人詞翰妙絶天下當元初至元大德間館閣諸公皆推尊之下至閭巷小兒亦莫不知其姓名非其德行之重材學之美有以震耀乎當時能若爾乎或謂元朝士大夫字畫聲詩之盛一變夫故宋餘習蓋自公始信然今觀其所書趵突泉詩令人歎賞不已寧上人得此其善保之洪武己巳春三月天台沙門清濬識前有琳印美之二印又僧如蘭和云趵突奔泉世所無厯城佳處似蓬壺源頭但欠千波湧海眼何曾一日枯平地風雷藏尺澤滿天星斗落澄湖濟南名士多如雨翰苑題詩興不孤富春如蘭前有黃美之氏放情丘壑二印最後有江表黃琳美之休伯李夢弼氏圖書蒲汀家藏諸印諸跋中押縫有黃氏淮東書院圖籍印凡三卷髙一尺二寸三分廣二尺五寸四分按孟俯自識有右二題語意卷前尚有一詩後逸去耳元趙孟俯尺牘一卷上等九秋十素箋本行書款云表弟孟俯再拜上鈐趙孟俯一印卷後有仇承晉一印卷髙八寸九分廣二尺四寸三分元趙孟俯三札一卷上等十秋二行書凡三幅第一幅碧色箋本前後俱署孟俯頓首復書又趙孟俯謹封五字上鈐趙子昻氏一印第二幅金粟箋本前後俱署孟俯和南上覆第三幅素箋本前後俱署孟俯再拜拖尾有文元發跋云魏公三帖筆法飛動神彩煥發蓋聞之故老云公蚤年學思陵書故用筆遒徑至晚歲與伯機同摹晉帖遂升王氏之堂此帖蓋真為二王傳神巳丁酉三月題於蘭雪齋文元發又張鳳翼跋云文敏書少宗李北海故特具徑氣後法二王遂號稱入室此三札二與子敬一與達觀雖似信手師心而二法俱見真可寶也丁酉春抄張鳳翼題又王稚登跋云魏公書妙絶千古而尤妙於八行之扎此卷與子敬教授者二達觀長老者一二札自具一法縱橫爛漫疏徑妍密無不可意若天女散鬘陀寶花飛揚厯亂而皆得三昧五百年來無此扛鼎筆也丁酉三月既望王稚登題第一幅髙八寸九分廣一尺三寸八分第二幅髙七寸五分廣一尺三分第三幅髙七寸一分廣五寸八分御筆題籖籖上有乾隆宸翰一璽元趙孟俯書崇禧萬夀宫記一卷上等秋主宋箋本行楷書卷前署建康路三茅山崇禧萬夀宫記十二字款云從仕郎鎮江録事致仕王去疾為文前翰林學士承旨榮祿大夫知制誥兼修國史趙孟俯書並篆題卷後署延祐六年月日六字卷前有神品懷古閣項元汴印子京所藏寄傲淨因菴主項墨林鑑賞章歸來印項墨林父祕笈之印諸印又世家半印卷後有神品退密項墨林鑑賞章項元汴印子京父印項子京家珍藏㩦李項氏世家寶玩項墨林父祕笈之印希之玉書京口張氏珍藏諸印又項子京半印卷中幅有墨林祕玩印凡三又項元汴印子孫世昌項墨林鑑賞章各二印又墨林聨印神遊心賞平生真賞㩦李項氏世家寶玩若水軒子京父印寄傲子京所藏諸印又一印不可識押縫有笪重光印五印希之印四又江上光笪太辛氏江上外史寄傲墨林祕玩始青道人各二印又直指繡衣御史章子京笪在辛氏虛朗齋墨林子第一泉子京所藏歸來印晚號奉真墨林笪字印項元汴印江上重光葦莊諸印前隔水有重光鐵甕城西逸叟始青潤州笪重光鑑定印諸印押縫有壺隱枝指生家藏一印後隔水押縫有依庸居士葦莊重光直指之章松子閣諸印引首孟俯篆書建康路三茅山崇禧萬夀宫記十二字蓋題額也有退密墨林子希之墨林山人諸印又笪字直指宫保半印三拖尾附孟俯與南塢真人札云孟俯稽首復書南塢真人尊師侍者孟俯歲首徐提點下訪得所賜書俾書崇禧石記屬以賤體苦瘡痍不能執筆徐君目擊遂不作答字想不怪也草日承専價惠書就審即日道體清勝深慰懸仰今所苦瘡雖稍愈猶未全安辱一再之命力疾作行書寫納蓋茅山張從申元靖先生碑亦是行書可為例耳但恐筆墨荒陋不足上石更在鑒裁人還草草具復聞山中舊玉石望以十數斤見寄乃大幸也未承教間惟珍重之禱不宣孟俯稽首復書草二日前署南塢真人尊師六字下有趙孟俯謹封五字缺其半又子昂半印又項元汴印項墨林鑑賞章笪重光印墨林祕玩項子京家珍藏諸印又半印存家珍藏三字後有項元汴印子孫永保項墨林鑑賞章素存希之諸印後張正常記語云洪武九年閏月四日觀於崇禧之館嗣漢四十二代天師張正常書後有㩦李墨林山人項子京家珍藏張九徵印江上外史諸印又方豪跋云崇禧觀記王去疾所為也而託諸子昂書使人愛觀此山之託於三茅君陶隱居亦猶是也故曰術業弗精弗永弗託弗傳正德己卯冬方豪志後有子孫永保項墨林父祕笈之印希之諸印又胡纘宗跋云觀此松雪善學晉矣今之學松雪者能得其肯綮乎天水胡纘宗題前有檇李項元汴印項叔子諸印又應良書云棠陵可泉論字學誠得之第未知陶隱居謂如何應良觀又王俸跋云松雪真筆固自遒徑邇來學者多失之凡弱豈古今人真不相及耶過崇禧得覩此册為之灑然書以自警嘉靖戊子冬十二月吉旦長洲王俸公爵並書後有神遊心賞希之項墨林鑑賞章諸印又邵鏞記云嘉靖癸巳秋九月草三日曺鍷羅鳯趙俊顧僯邵鏞同觀於曲林山房前有天籟閣子孫世昌二印後有虛朗齋平生真賞二印又喬宇篆書記云正德癸酉上元日觀松雲真迹太原喬宇志十七字前有白碞一印後有墨林祕玩希之希大大宗伯印項子京家珍藏張玉書印張仕可印諸印又項子京半印諸跋中押縫有笪字始青寄傲笪太辛氏墨林祕玩江上光始青道人江上外史諸印又江左逸光元字太辛各二印又祕笈之印半印卷髙二尺二寸二分廣一丈七尺四寸元趙孟俯雜書一卷上等十二秋二宋箋本行楷書凡三假第一段書周易繫辭款識云大德九年十月十一日謁介真館為南谷尊師書此章弟子趙孟俯下有趙子昂氏一印前有嫡字小號又駙馬都尉神品耆德忠正㩦李李氏鶴夢軒珍藏記天籟閣項墨林鑑賞章卧雪齋博雅堂寶玩印項元汴氏審定真迹諸印後有長病仙墨林生神品遊方之外項元汴印墨林山人平生真賞項子京氏諸印第二段書元都壇歌欵識云大德十年正月十八日南谷尊師過我車橋之館要寫古詩乃書此篇弟子吳興松雪道人趙孟俯書下有趙子昂氏一印前有神品退密李肇亨檇李李氏鶴夢軒珍藏記會心處墨林祕玩子京珍祕項元汴印諸印後有赤松仙史項元汴印世外法寶項墨林鑑賞章神品子孫永保子京父印項墨林父祕笈之印梁清標印河北棠村諸印第三假書贈杜真人詩款識云吾昔年為先師杜真人賦此二詩今其弟子袁安道來索書因寫與使藏之延祐六年十二月二十九日松雪齋書子昂下有子昂一印又另行云前詩似更有二句然老昏忘之矣後有項元汴識云校松雪齋文集前詩所遺城市多囂塵山林幽且間一聨遂為補之又識云老作古清齋在上句焚香在下句我欲作稅駕洞門作洞府併正其所忘云墨林項元汴謹識前有神品寄傲李肇亨㩦李李氏鶴夢軒珍藏記墨林硯癖項子京家珍藏諸印後有墨林祕玩爽溪李亨李珂雪珍藏墨林硯癖西楚王孫子孫世昌神品項元汴印項墨林鑑賞章檇李項氏世家寶玩諸印又卧字半印卷中幅押縫有田疇耕耦煮茶亭長袁安道氏墨林硯癖墨林外史諸印前隔水有蕉林梁氏書畫之印家在北澶二印押縫有墨林父印項子京氏沮溺之疇有何不可諸印後隔水有桃花源裏人家一印押縫有墨林子項子京氏沮溺之儔墨林項叔子章諸印引首有篆書松雪墨迹四大字欵署自巖前有桃花源裏人家一印後有項元汴一印拖尾陳旅跋云右趙文敏公自壯至老之所書者袁安道次為一卷可以考見其平生筆力之日進而臻妙也古之為學者其亦若是乎哉至元後戊寅正月望日陳旅識前有元汴連印虛朗齋二印又齋字半印後有墨林子項叔子二印又張雨跋云唐吳貞節薦李太白於玄宗負天下大名不過一翰林供奉我谷翁真人當至元之初首舉浚儀公仁宗朝仕至榮祿大夫翰林承旨皇元之用賢養賢以布衣之論申於朝廷之上浚儀公不得不稱弟子也凡所交書札至多往往散逸安道僅存録此卷天雨感嘆為書其尾至元後戊寅正月二十九日甲子謹記後有墨林祕玩檇李李氏鶴夢軒珍藏記二印又杜本跋云真人弟子多一時名士然文敏趙公則自貌童時從其先太師已尊事於真人故出處之際書問往來無時無之且於諸徒孫咸若親昆弟焉足見情誼之篤故復寫二舊詩與安道使永藏之其視好其名而寶其遺墨者故不同也杜本拜題前有子京若水軒二印後有子京父印一印又揭傒斯跋云右故翰林學士承旨魏國趙文敏公與升元杜真人翰墨一卷文敏平生於真人雖片紙必自稱弟子真人固有道之士非文敏篤於情誼不能也語曰故舊不遺則民不偷余於文敏見之適從真人髙第弟子袁安道觀此卷為之感歎不已至元五年歲己卯三月十九日揭傒斯謹題後有墨林堂項子京家珍藏二印又張翥跋云升元袁髙士次吳興公所與南谷真人諸帖為一卷筆勢縱橫遒緊沈著妙絶當世信山房之至寶也然非谷仙之有道不能北面吳興非吳興之辭翰流風餘韻惡能偉然百世哉山中多密石勒而傳之人將爭睹又奚翅星鳯寶墨也邪髙士其圖之至正十年季春十又七日張翥識後有墨林祕玩平生真賞二印又王漸跋云道家以絀聰明去健羡為務有稱役於老氏者彼豈固使之為役哉道若是耳夫視位為械爵祿為泥塗或庶幾於道德性命之深焉此松雪翁所以為南谷尊師書之而屢贊之也安道出此卷以示余遂拜觀而識其後江右王漸前有墨林連印墨林外史長字三印後有六藝之圃一印又李孝光跋云唐時公卿大夫遺老子氏者尺牘稱曰尊師自稱曰弟子蓋當時之制而亦以尊其道也松雪老翁好師古故亦云至正八年二月二日李孝光在玄元真館觀前有項元汴印鴛鴦湖長二印後有子京所藏一印又釋廷俊跋云仲尼問禮老子而蘇子瞻氏蚤歲嘗從黃冠者遊用是知聖賢為無常師然則子昂之所以師尊南谷子者其又可以形服而識之也哉至正三年龍在癸未六月十八日番陽釋廷俊題前有墨林子一印後有紫芝山道人一印又趙篪跋云趙文敏公翰墨妙天下獨於南谷老仙施弟子禮執之甚恭余嘗目擊之今安道能寶藏真迹殊可嘉尚偶入山中因題其後餘不復云東平趙篪前有寄傲會心處虛朗齋三印後有癖茶居士項叔子二印又程文題云顔公乞米能留帖王子籠鵝為寫經不解吳興間紙筆天書雲篆共封扃婺源程文後有墨林主人一印又盛熙明跋云南谷尊師道德輝映朝野松雪翰林詞翰妙絶古今今為計籌之寶開卷展玩令人不厭古語云世人那得知數語當有脫誤至正十四年三月望日丘兹盛熙明記後有墨林山人神遊心賞蕉林祕玩觀其大略諸印又朱右跋云昔張子房漢代人傑而圯上取履逡巡甚至曺敬伯為相國舍蓋公而身事之古豪傑之士有大過人者必有賢人達士為之先也矧為南谷真人敡厯中朝世皇側席問道趙魏公執禮之唯謹冝哉嗟夫莫為之前雖美弗彰莫繼於後雖盛弗傳豫於南谷文敏又何較重輕於其間耶覽卷之餘殊增仰止至正十有三年癸巳秋九月丹丘生朱右頓首前有桃里惠泉山樵從吾所好三印後有項墨林父祕笈之印宫保世家二印諸跋中押縫有隱居放言二印虛朗齋退密子京珍藏墨林懶叟蘧廬子孫永保墨林主人惠泉山樵誠畏齋世外法寶墨林山人諸印卷髙九寸六分廣九尺五寸元趙孟俯管道升尺牘合璧一卷上等收一碧色箋本凡三幅俱行書第一幅趙孟俯書後署孟俯啓事再拜前有趙孟俯謹封五字上鈐趙氏子昂一印幅髙九寸三分廣一尺二寸七分第二幅趙孟俯書後署孟俯稽首再拜前有趙孟俯謹封五字上鈐趙氏子昂一印幅髙同前廣一尺三寸九分第三幅管道升書後署道升跪覆前有道升謹封四字上鈐趙管一印幅髙同前廣一尺二寸八分每段隔水押縫東壁掌書印凡五前隔水有子興真賞元象山房珍藏圖書記二印引首有趙士楨篆書鳯凰和鳴四大字款云東嘉趙士楨題又記語壬戌立夏東郡汪元范明生觀十二字前押縫有王瀾私印一印拖尾胡汝煥跋云先是長安中有勢力者以百金購此於趙彥卿不與一日損之贈南子興子興才人彥卿烈士哉無論神物終有所歸即兩君交際亦自大奇胡汝煥謹識又記語云江都方日新觀於小雅齋又趙徽彞跋云余弟常吉落魄不畜一物余八年兩至都下視其笥中帷此卷及一硯癸未春與關中南子興别將舉以贈子興明日硯即為邢直指取去惟此卷得歸子興物各有主信哉東嘉趙徽彞識又趙士楨跋云此卷乃我生平所最愛者今年子興還關西我歸東甌戀戀不能分手遲回京邑者半月視囊中無長物可贈因舉此以與之癸未又二月十二日友人趙士楨識按胡汝煥跋中損字當是捐字元趙孟俯一門合札一卷上等冬一宋箋本凡六幅俱行書第一幅趙孟俯書後署弟子趙孟俯和南拜覆謹封上鈐趙孟俯印一印幅前有蕉林鑒定一印又檇李所藏祕笈之印三半印幅後有天籟閣神品墨林祕玩項子京家珍藏檇李項氏世家寶玩董光裕印神遊項墨林鑑賞章諸印又檇李子京項墨林父三半印幅髙九寸二分廣一尺五寸六分第二幅趙孟俯書後署忝眷趙孟俯謹封上鈐趙孟俯印一印幅前有子孫永保項墨林鑑賞章欣遇三印幅後有檇李項氏世家寶玩墨林祕玩項子京家珍藏項元汴印淨因菴梁清標印諸印又世昌項墨林父半印二幅髙八寸二分廣一尺五寸四分第三幅管道升書前後俱署道升跪覆又前有道升謹封四字上鈐趙管一印幅前有天籟閣項元汴印子京父印項墨林鑑賞章諸印又家珍藏世家半印二幅後有退密淨因菴主項子京家珍藏項叔子檇李項氏世家珍玩曹孟昭印眀中清白傳家蕉林梁氏書畫之印董光裕印諸印又子孫寶古齋半印二幅髙九寸廣一尺五寸四分第四幅趙雍書後署趙雍頓首再拜覆幅前有天籟閣董光裕印項元汴印項墨林父祕笈之印四印幅後有檇李項氏世家寶玩墨林子項子京家珍藏墨林山人虛朗齋河北棠村諸印幅髙一尺一分廣一尺九寸二分第五幅趙雍書前後俱署趙雍頓首再拜上幅後有玉立氏蒼巖二印幅髙九寸三分廣一尺六寸一分第六幅趙由晢書後署由晢上覆幅前有子京梁清標印項元汴印墨林子諸印又山人半印幅後有檇李文石珍玩墨林祕玩諸印又天籟閣子京半印二幅髙八寸八分廣一尺二寸八分拖尾有蒼巖子蕉林居士圖史自娛三印元康里巙書顔真卿述張旭筆法一卷上等藏一素箋本草書款識云魯公此文議論精絶形容書法要妙無餘藴矣今之曉書意者蓋莫如公所以及此至順四年三月五日康里巙為麓菴大學士書下有子山正齋二印卷前半印二存祕玩二字卷後有天籟閣廣陵李書樓珍賞圖書李宗孔宋犖審定寄傲項元汴印子京父印項墨林鑒賞章檇李項氏世家寶玩諸印又天籟閣宫保世家半印二卷中幅押縫有子京子京所藏二印又六印俱剝缺不可識前隔水有檇李曺氏曺溶鑑定書畫印李書樓三印押縫有古林潔躬鋤菜翁三印後隔水押縫有曺溶祕玩一印卷髙一尺一寸二分廣一丈二寸御筆題籖籖上有乾隆宸翰一璽元鮮于樞書前赤壁賦一卷上等閏一素箋本草書款識云至正戊寅仲夏吉旦鮮于樞書下有鮮于一印卷後有公綬一印卷髙九寸六分廣一丈二尺七寸元班惟志二體千文一卷上等餘一素箋烏絲闌本真草二體相間書款識云至順四年閏三月草有四日大梁班惟志書後有班彥功氏恕齋二印卷前二體署千字文六字有天籟閣令之仙客卞令之鑒定若水軒子孫世昌寄傲子京父印平生真賞項墨林父祕笈之印六藝之圃子孫永保墨林祕玩諸印卷後有墨林生退密項元汴印項子京家珍藏項墨林鑒賞章令之仙客卞令之鑒定諸印押縫有墨林子京所藏各二印卷髙七寸五分廣一丈八尺三寸五分御筆題籖籖上有乾隆宸翰一璽元饒介書五言古詩一卷上等成一素箋本草書款識云癸未臘月十六日饒介卷前有濟之吳興張淵二印卷後有張謙楊廉夫二印黃氏半印卷髙八寸一分廣一丈一尺二寸明沈度沈粲各體書一卷上等歲一凡六幅前四幅灑金箋烏絲闌本楷書程子四針每幅有沈度私印一印幅髙九寸廣四寸五分第五幅素箋烏絲闌本𨽻書唐人七言律詩一首欵云雲間沈度𨽻古下有沈民則一印幅髙七寸二分廣一尺六分第六幅素箋本行楷書應制詩五首欵識云右硯墨紙筆筆山宣德丙午所賜臣粲者間成五詠以寓感恩頌德之萬一云時宣德五年九月望日書一通奉寄曉菴師一笑雲間沈粲識後有雲間沈粲民望作德心逸日休中議大夫贊治尹之章三印幅髙七寸六分廣二尺五寸明王守仁龍江留别詩一卷上等律一素箋本行草書款識云陽明山人王守仁拜手書於龍江舟中上鈐伯安一印又另行云餘數詩稿已不及録容後便覔得補呈也守仁頓首白樓先生執事上鈐伯安一印卷前有朱之赤千秋里人卧菴所藏三印拖尾朱彞尊跋云陽明子功烈氣節文章皆居第一特多講學一事為衆口所訾善夫西陂先生之言也曰陽明以講學故毁譽迭見於當時是非幾混於後世至謂其得寧邸金初通宸濠䇿其不勝而背之此謗毁之餘唾不足拾取斯持平之論乎龍江留别詩卷乃將之官南贑而作是時宸濠反狀未露而公已滋殷憂故詩中即有戎馬馳驅風塵兵甲等語而又云廟堂長䇿諸公在其後卒與喬莊簡犄角成功蓋公審之於樽爼間久矣詩律清婉書亦通神宜為西陂先生所愛玩嵗在癸未二月戊寅朏秀水朱彞尊年七十五書卷髙八寸七分廣九尺二寸二分明文徵明倣懷素草書一卷上等吕一素箋本書賈誼弔屈原賦款識云偶與陳淳閲藏真所書清淨經戲書此賦多見其不知量也甲子十一月草日文璧下有文徵明印停雲生二印卷前有停雲一印又第一希有卧菴所藏二印卷後有神物護持一印拖尾文嘉跋云懷素清淨經豫嘗見之後題云貞元元年八月草有三日西太平寺沙門懷素藏真書跋者為大梁劉世昌道卿云素師居零陵以蕉葉代書目其菴曰緑天又引其自敘中二語云醉來得意兩三行醒後却書書不得及人人欲問此中妙懷素自言初不知謂皆透徹向上不為律縛禪與書會宜其顚逸奔放也此卷舊藏孫鳴岐家故先君得頻閲之因發書興寫此弔屈原文同閲者陳淳即陳道復之名時方二十一嵗從先君習舉業遂直書其名而不以為嫌耳然亦可見當時師道之嚴如此萬厯甲戌四月草日文嘉書前有朱之赤鑒賞子孫保之休寧朱之赤珍藏圖書諸印又王稚登跋云倣藏真書者往往以狂態怒張鈎盤屈曲為能若效顰學步醜態畢陳惟文太史寓簡淡於爛漫之中貯嚴雅于飄忽之內如良將之師風雲魚鳥變化無窮而部曲森然紀律自在此所謂善學下惠者耶夫閲清淨經而書弔屈原文殆猶散僧入聖不縛禪律而頓悟三昧太史公視素師可稱上足弟子矣甲戌孟夏坐半偈新菴漫題太原王稚登後有朱卧菴收藏印一印又文從簡跋云先待詔此書如飄風遊絲以神行非以筆行閲者洞心駴目莫測其何自來何自往神龍乘風雲變幻不可端倪意先公頴端有龍耶草狂法縱謂之師素若使素與先公同搦管各著其妙亦師其心未嘗師素也學書者諦觀此卷形象波畫豈摹古之定法昔人評趙魏公云上下五百年縱橫一萬里深有味於魏公矣乙亥八月中秋日曽孫從簡百拜題前有聽雨堂印一印後有朱卧菴收藏印一印跋中押縫有擇木亭一印卷髙一尺一寸六分廣四尺八寸一分明文徵明尺牘一卷上等吕二素箋本凡十幅俱行草書署徵明款者八署璧款者一未署款者一第三幅第八幅第十幅俱有半印存氏字第四幅有卧菴所藏一印第五幅有卧菴一印後别幅文從簡跋云先待詔書札流傳遍天下即尺幅片紙人皆珍為家寶此十二帖字法精整尤為可貴豫嘗見右軍坐雨帖草率不滿數十字鑒古家寶重之以千金購得將古準今豈有異耶曽孫從簡百拜題第一幅髙八寸三分廣九寸八分第二幅髙八寸五分廣一尺八寸第三幅髙八寸一分廣五寸五分第四幅髙八寸三分廣五寸三分第五幅髙七寸三分廣一尺二寸第六幅髙七寸四分廣六寸第七幅髙七寸二分廣七寸二分第八幅髙八寸一分廣五寸六分第九幅髙八寸四分廣七寸第十幅髙八寸廣七寸四分按文從簡跋云此十二帖今僅存十帖眀王寵書出師二表一卷上等調一金粟箋烏絲闌本行草書款識云丁亥孟夏望後書於石湖精舍雅宜山人王寵履吉父後有王履吉印雅宜山人二印卷前有大雅堂一印又朱之赤鑒賞第一希有二印卷後有天與人文晴窗寶玩子孫保之休寧朱之赤珍藏圖書洞庭許氏珍藏諸印卷中幅押縫有辛夷館印凡七卷髙九寸五分廣一丈四尺七寸二分明陸深自書白雁詩一卷上等陽一灑金箋本行楷書款識云今世詩人之敏捷者豫嘗以談子東石為第一海內能與之敵帷棠陵方子竊比為二難然以豫之鈍而二公輒不豫鄙也豫每行歸東石得與周旋出遊時與棠陵追逐於班行之末甚樂也今嵗復知有鶴津談子者蓋不徒以敏捷為事而尤以古雅為工駸駸乎詩人之閫奧矣顧豫方以是奇鶴津誠有口之不置手之不釋者矣恨豫老去恐無以起鶴津暇日漫書此復寄鶴津俾世知鶴津與棠陵東石亦足以稱三絶云嘉靖丁亥九月之吉儼山人陸深子淵父試東坡藏硯書於三十六峯之卷懷堂時年五十有一下有陸氏子淵國史經筵官印二印卷前有古太史氏一印又令之仙客式古堂書畫三印卷後有令之仙客式古堂書畫三印卷中幅押縫式古堂印凡二拖尾陳繼儒跋云文裕公嘗云我與松雪翁同參李北海其自負如此然實從吾鄉沈學士得來故梁叔寶之與先世墨迹並藏不作野鶩視也若白燕諸詩氣骨髙邁變化感愴直可平抗海叟矣陳繼儒題卷髙九寸二分廣一丈九尺四寸五分按陸深所書乃白雁詩而陳繼儒跋為白燕詩誤明董其昌臨枯樹賦一卷上等雲一灑金箋本款識云丙寅正月晦書其昌卷髙六寸八分廣八尺八寸二分明董其昌書白居易樂府一卷上等雲二朝鮮鏡光箋烏絲闌本行書款識云書白太傅詩董其昌下有太史氏董其昌二印又自跋云盛唐人亦作達語然不落格律如李嶠汾隂行之富貴榮華能幾時山川滿目淚沾衣不見即今汾水上惟有年年秋雁飛可以動悟竟無僧氣元宰下有董其昌一印卷髙八寸廣三尺四寸明董其昌臨古一卷上等雲三朝鮮鏡光箋本凡九段第一假至第二假俱行書自識云書雪賦後五日再書月賦登樓賦稍以禇河南為法蓋家姪一帖運筆也元宰第三假第四假俱行楷書自識云前為右軍書此即家姪帖也第五假楷書臨王僧虔第六段行書評書帖自識云戊戌十一月九日書元宰第七假溫泉賦第八假竹扇賦俱楷書第九假行書九日送菊帖自識云此余在長安呵凍手書及還山舟中待放閘消遣永晝者仲醇兄為汰而裝池及自披之頗似五技窮鼠耳若曰徇知之合則吾豈敢董其昌書於來仲樓卷髙五寸九分廣一丈三尺七寸七分按其昌自識有殉知之合語未詳疑有誤明董其昌書答徐孝穆書一卷上等雲四朝鮮鏡光箋本行書款識云庚申除夕其昌書下有董其昌印一印後隔水沈荃跋云李那書思致藻密遂使徐庾恧其溫麗宗伯實愛之故輒書全篇筆力遒媚亦河南枯樹法也子山獲此於燕市急購之又不啻豐山之音流泉之奏矣記此志喜丁未六月初二日沈荃卷髙八寸一分廣七尺一寸一分眀董其昌書功臣傳贊一卷上等雲五素絹本大楷書款識云褚遂良有此帖頗類八分余以顔平原法為之山谷所謂送明逺序非行非隸屈曲瑰奇差得百一耳董其昌後有董元宰董其昌印二印卷中幅押縫有堅齋鑒定印凡四卷髙一尺一寸三分廣四丈九尺三寸三分明董其昌自書詩帖一卷上等雲六朝鮮箋烏絲闌本行楷書款識云丙子夏董其昌書卷髙八寸一分廣三尺三寸三分明董其昌書龍神感應記一卷上等雲七宣德鏡光箋烏絲闌本行楷書款識云前史官華亭董其昌篆額并書天啓元年嘉平之望下有知制誥日講官董元宰二印卷髙七寸五分廣九寸二分明董其昌書正陽門關侯廟碑一卷上等雲八宋箋本行楷書拖尾款云賜進士及第翰林院修撰焦竑撰賜進士出身翰林院庶吉士董其昌書又自識云此余為庶常時所書也出春明二十四年再召還朝碑石且泐字畫有漫者蓋不勝摹拓之衆也拓者雖衆而坐卧碑下三日不去者其人為誰一不為少耳覔此人不可得此一片石便當捶碎何煩祠部以儲胥護之乎濟南王琅琊於余書有昌歜之好兹於吳太學蹇叔購此原本幾傾其槖因屬余補名欵舊碑名欵出程福生手故也琅琊深於書道愧余無以應之然所謂一不為少者今有人矣太常寺少卿兼國子監司業董其昌重題又自識云昔不如人今不如我三紀之中自為今古觀舊書有感題其昌壬戌六月之朔苑西畫禪室識下有知制誥日講官董其昌二印卷前有商邱宋犖審定真迹一印卷髙一尺四分廣一丈二尺九寸八分按卷內有內府書印璽二又內府半璽蓋宋時原箋印記也石渠寶笈卷三十
