body:
  text: 貯乾清宫一宸翰書冊世祖章皇帝御臨諸名家帖五冊黃箋本第一冊為順治十五年書臨王羲之樂毅論分段署月日中楷書千文凡二則計二十四頁第二冊至第四冊皆順治十六年書第二冊臨黃庭堅嶽雲帖凡十三則計二十六頁第三冊節臨趙孟俯書離騷凡八則計十七頁第四冊雜臨鍾繇一則王羲之三則王獻之二則王廙一則懷素一則歐陽詢二則顔真卿一則蘇軾一則蔡襄一則董其昌一則計十五頁俱分段署月日第五冊為順治十七年書臨虞世南書孔子廟堂碑分十則署月日計二十五頁頁髙九寸五分廣一尺一寸八分書卷世祖章皇帝御書聖經一卷黃箋本行楷大書卷前署聖經二字卷髙一尺四寸五分廣三丈九尺二寸四分世祖章皇帝御臨蘇軾滿庭芳詞一卷黃箋本大楷書欵識云己亥冬對臨東坡之帖卷髙一尺三寸廣一丈九尺書軸世祖章皇帝御臨文徵明詩帖一軸素箋本行楷書七言絶句一首欵識云己亥冬臨文徵明書軸髙四尺八寸七分廣一尺九寸一分畫軸世祖章皇帝御筆梅花一軸素綾本墨畫欵識云順治乙未孟冬御筆戲寫上鈐廣運之寶璽一軸髙三尺四寸八分廣一尺七寸三分世祖章皇帝御筆山水一軸素綾本墨畫欵識云順治乙未仲冬朔日御筆寫上鈐廣運之寶璽一又另行署賜大學士劉正宗七字軸髙四尺七寸五分廣一尺六寸一分世祖章皇帝御筆葡萄一軸雲母箋本墨畫欵署御筆上鈐廣運之寶璽一右方下又識云順治乙未仲冬朔日寫上鈐萬幾餘暇寄興圖書潄六藝之芳潤怡情翰墨措萬物于筆端二璽軸髙三尺七寸廣一尺九寸二分世祖章皇帝御筆畫竹一軸素箋本墨畫欵識云順治乙未仲冬御筆戲寫上鈐廣運之寶璽一軸髙二尺六分廣八寸五分世祖章皇帝御筆竹石一軸素綾本墨畫欵識云順治丙申夏日御筆畫下有廣運之寶萬幾餘暇二璽前有體元齊璽一軸高四尺七寸七分廣一尺六寸一分世祖章皇帝御筆倣關同山水一軸素綾本墨畫欵識云丙申孟秋御筆倣五代關同筆意畫下有廣運之寶萬幾餘暇二璽前有體元齊璽一軸高四尺八寸五分廣一尺六寸四分世祖章皇帝御筆仿董源山水一軸素綾本墨畫欵識云丙申季秋御筆仿宋董源筆意畫軸髙四尺八寸五分廣一尺六寸二分世祖章皇帝御筆仿郭熙山水一軸素綾本墨畫欵識云丙申仲秋御筆仿宋郭熙筆意畫下有廣運之寶萬幾餘暇二璽前有體元齊璽一軸髙四尺八寸八分廣一尺六寸四分世祖章皇帝御筆倣范寬雪景一軸素綾本墨畫欵識云丙申仲秋御筆仿宋范寬筆意畫下有廣運之寶萬幾餘暇二璽前有體元齊璽一軸髙四尺八寸五分廣一尺六寸七分世祖章皇帝御筆仿夏圭雪景一軸素綾本墨畫欵識云丙申孟秋御筆仿宋夏圭筆意畫下有廣運之寶萬幾餘暇二璽前有體元齊璽一軸髙四尺八寸八分廣一尺六寸七分世祖章皇帝御筆倣米家山一軸素箋本墨畫欵識云順治歲在乙未仲冬望日御筆倣宋米元章父子畫賜司吏院承院王進善上鈐廣運之寶萬幾餘暇二璽左方上有寄興圖書潄六藝之芳潤怡情翰墨措萬物于筆端璽一軸髙三尺五寸二分廣一尺六分世祖章皇帝御筆倣米友仁山水一軸素綾本墨畫欵識云丙申孟秋御筆倣宋小米筆意畫下有廣運之寶萬幾餘暇二璽前有體元齊璽一軸髙四尺九寸廣一尺六寸四分世祖章皇帝御筆倣米友仁山水一軸素綾本墨畫欵識云順治丙申夏日御筆倣小米筆意畫下有廣運之寶太和主人二璽前有體元齊璽一軸髙四尺七寸廣一尺六寸二分世祖章皇帝御筆倣黃公望山水一軸素綾本墨畫欵識云順治歲在乙未仲冬望日御筆仿元黃子久畫賜尚方院左承議郭進忠上鈐廣運之寶萬幾餘暇二璽左方上有寄興圖書潄六藝之芳潤怡情翰墨措萬物于筆端璽一軸髙三尺六寸四分廣一尺五寸五分世祖章皇帝御筆仿倪瓚山水一軸素綾本墨畫欵識云丙申季秋御筆仿元倪瓚筆意畫軸髙四尺八寸六分廣一尺六寸五分書冊聖祖仁皇帝御書周易折中序一冊素箋本楷書末幅欵識云康熙五十四年春三月十八日書後有體元主人稽古右文之章二璽首幅前署御製周易折中序七字冊計六幅幅高六寸八分廣四寸六分聖祖仁皇帝御書性理精義序一冊素箋本楷書末幅欵識云康熙五十六年春二月初一日書後有體元主人萬幾餘暇二璽首幅前署御製性理精義序七字冊計六幅幅髙六寸八分廣四寸七分聖祖仁皇帝御書朱子全書序一冊素箋本楷書末幅欵識云康熙五十二年歲在癸巳夏六月敬書後有體元主人稽古右文之章二璽首幅前署御製朱子全書序七字冊計二十七幅幅髙六寸八分廣四寸聖祖仁皇帝御書佩文韻府序一冊素箋本行楷書末幅欵識云康熙五十年十月題後有體元主人萬幾餘暇二璽首幅前署御製佩文韻府序七字冊計十二幅幅髙五寸二分廣三寸四分聖祖仁皇帝御書御選唐詩序一冊素箋本楷書末幅欵識云康熙五十二年三月上旬題並書後有體元主人萬幾餘暇二璽首幅前署御選唐詩序五字冊計十幅幅髙五寸九分廣三寸七分聖祖仁皇帝御書避暑山莊記一冊素箋本楷書末幅欵識云康熙五十年六月下旬書後有體元主人萬幾餘暇二璽首幅前署御製避暑山莊記七字冊計十幅幅髙六寸一分廣三寸九分聖祖仁皇帝御書草訣百韻一冊灑金箋本草書後頁欵識云康熙乙未夏再書下有康熙稽古右文二璽冊計三十六頁頁髙五寸五分廣六寸聖祖仁皇帝御書千文一冊素箋本草書後頁欵識云康熙甲戌夏日書後有體元主人萬幾餘暇二璽首頁有康熙御筆璽一冊計十一頁頁髙七寸七分廣七寸六分聖祖仁皇帝御書千文一冊灑金箋烏絲闌本草書後頁欵識云康熙五十四年秋再書下有康熙稽古右文二璽冊計十六頁頁髙五寸五分廣五寸九分書卷聖祖仁皇帝御書太極圖說一卷灑金箋本行楷書欵識云康熙五十一年歲次壬辰六月山莊再敬書下有康熙宸翰敕幾清晏二璽卷前有淵鑒齊璽一卷髙一尺六寸二分廣三丈二寸五分聖祖仁皇帝御書上帝閣讚一卷灑金箋本大楷書欵識云康熙五十一年六月吉旦敬書上鈐康熙御筆之寶璽一卷前署上帝閣讚四字卷髙二尺二寸七分廣二丈八尺三寸六分聖祖仁皇帝御書操舟說一卷素箋本草書未署欵後有體元主人萬幾餘暇二璽卷前有康熙宸翰璽一卷髙八寸七分廣一尺九寸四分聖祖仁皇帝御書賜裕親王札一卷宣德箋本行楷書凡二則後有體元主人萬幾餘暇二璽卷髙七寸六分廣一尺六寸五分聖祖仁皇帝御書千文一卷宣德箋本楷書欵識云康熙庚午初夏臨下有康熙宸翰萬幾餘暇二璽卷髙七寸四分廣八尺八寸九分聖祖仁皇帝御書跋語一卷宣德箋本凡二則第一則小楷書跋資政要覽後有康熙稽古右文二璽第二則行楷書跋蘭亭帖後有康熙宸翰萬幾餘暇二璽卷髙七寸五分廣一尺八寸二分聖祖仁皇帝跋語一卷素箋本行楷書凡三則第一則跋董其昌書晝錦堂記第二則跋米芾書天馬賦第三則跋趙孟俯書不自棄文未署欵後有康熙稽古右文幾暇怡情三璽卷前有佩文齊璽一卷髙七寸六分廣一尺八寸聖祖仁皇帝御書長夀星賦一卷素綾本行書未署欵後有康熙宸翰稽古右文之章二璽卷前有淵鑒齊璽一卷髙一尺一寸廣九尺七寸六分聖祖仁皇帝御書行殿讀書賦一卷素箋本行書欵識云康熙甲子冬至前書後有體元主人稽古右文之章二璽卷前署行殿讀書賦有序七字又日鏡雲伸璽一卷末臣張英跋云敬觀御製併書行殿讀書賦仰見聖心稽古典學符乎天健雖當時巡彌勤誦讀賦辭鴻麗逺配典謨以此敦勵來兹垂法萬世猗歟盛矣御書圓徑相含體格精妙溫潤同于珠璧神采炳于日星備八法之楷模兼諸家之美善曠代巨觀瞻仰何極臣張英恭跋又臣顧藻跋云洪惟我皇上法天出治稽古敷文化成之盛迥越三五恭誦御製行殿讀書賦伏稔駐蹕行宫猶且左圖右史常勤丙夜宸章炳赫若挾風霆于尺幅飛泉瀑于毫端煥乎有文淵然莫測而睿翰流輝則雲漢為昭日星垂麗彚衆體而得其精集大成而臻于化臣藻學識淺疏遭逢聖主瞻仰光華真千載一時之遇敬抒歡忭敢效頌揚臣顧藻恭跋又臣勵杜訥跋云皇上勤民省方同咨田野駐蹕之時則披覽圖史丙夜不輟孜孜忘倦之淵衷發為天藻義藴𢎞博光嫓典謨聖學之髙深乾元之行健自有載籍以來未之前聞奎翰堅凝峭傑古欎絶倫結搆既極精嚴神采復極煒煥儼若山嶽聳峙日月昭融誠冊府之鴻模為藝林所永寶也臣獲仰瞻曷勝榮慶臣勵杜訥恭跋又臣胡會恩跋云皇上天縱之聖日勤萬幾聽政之餘必親經史雖時邁省方乙夜勿輟斯賦所由作也濬思淵發神藻天開玉振金聲超絶衆妙奎畫元氣中涵光華四照出入造化卷舒風雲敻哉集書學之大成矣臣承命賜觀得以仰瞻鴻製周環循誦晃耀心目頌揚讚嘆莫罄髙深微臣榮遇于斯為至謹拜手稽首書于卷末以志億萬年琬琰之傳永永無極云臣胡會恩恭跋又臣孫嶽頒跋云詩誦就將書陳遜敏法天行健蓋心乎學者也恭讀御製知稽古之功雖巡行靡間以萬幾之餘暇極夙夜之精勤含英咀華發揮心得始終條理該貫藝文洵垂世之典謨不僅為賦體之軌範也至御筆之心手調和法完神密擬之海􅉼山立日麗星輝斯堪倣佛臣幸際盛時獲觀宸翰不勝踴躍歡忭之至臣孫嶽頒恭跋卷髙七寸七分廣八尺二寸七分聖祖仁皇帝御書耕織圖序一卷宋箋本行草書欵識云康熙三十五年春二月社日題并書下有我思古人述而不作二璽卷前署御製耕織圖序六字有惜寸陰璽一卷髙七寸九分廣五尺八寸二分聖祖仁皇帝御書古文淵鑒序一卷素箋本行草書欵識云康熙二十四年十二月題并書下有我思古人述而不作二璽卷前署御製古文淵鑒序七字有佩文齊璽一卷髙六寸六分廣六尺三寸二分聖祖仁皇帝御書柏梁體詩序一卷素箋本楷書欵識云康熙二十一午正月十四日御筆上鈐康熙宸翰璽一卷後有沈荃書柏梁體聯句詩欵識云日講官起居注詹事府詹事兼翰林院侍讀學士加禮部侍郎臣沈荃奉敕書卷髙七寸八分廣四尺八分聖祖仁皇帝御筆書通鑑綱目後一卷宣德箋本楷書未署欵後有康熙宸翰萬幾餘暇二璽卷前署書通鑑綱目後六字卷髙七寸六分廣一尺三寸四分聖祖仁皇帝御書稼說一卷素箋本楷書未署欵後有康熙稽古右文萬幾餘暇三璽卷前署稼說二字有惜寸陰璽一卷髙六寸三分廣一尺六寸五分聖祖仁皇帝御書金蓮花賦一卷素綾本行楷書欵識云癸未書下有康熙宸翰保合太和二璽卷前署金蓮花賦四字有佩文齊璽一卷髙七寸五分廣六尺七寸九分聖祖仁皇帝御書題畫詩一卷素箋本行書七言截句一首欵識云題畫六十一年書卷髙八寸八分廣二尺一寸此卷暨唐句一軸皆康熙六十一年聖祖御筆賜我皇上者越雍正八年上在青宫時作聖祖仁皇帝恩賜御書記今敬鐫龍箱上記曰憶自年十二時隨皇祖聖祖仁皇帝駕往熱河避暑朝夕隨侍皇祖萬幾之暇輒流覽書史或親灑宸翰御名從旁竊觀心慕而未敢以請也皇祖顧御名曰汝愛吾書乎賜長幅一復賜橫幅一扇一皆持以告我皇父寶而藏之其年冬龍馭上賓哀痛沉篤每展閲御筆手澤猶存涕涔涔下乃肅容拜手而為之記曰嗚呼皇祖之孫百餘人其中聰明才識好學博文年長于御名而任事于朝者彬彬濟濟御名年甫弱齡性復鈍魯顧特被恩寵迥異他人者豈非我皇祖推愛我皇父之心比諸孫有獨摯乎今雖八載聖訓慈顔宛然如昨豈徒杯棬之慟已哉昔歐陽修作宋仁宗飛白記謂仁宗德澤涵濡于天下者四十餘年田夫野老猶悲歌思慕况得望清光而承恩寵者尤相與流涕不置我皇祖君臨天下六十餘年聖德之廣大化澤之𢎞深享年之有永過于仁宗萬萬歐陽修不過受知近臣為僚采作記尚流連咨嗟慨想而不能自禁况御名以孫枝日侍晨夕誨愛特深親侍皇祖之揮毫躬受錫豫其流連咨嗟慨慕更當何如因書以志不忘云聖祖仁皇帝御臨蘇軾潁州西湖月夜泛舟詩一卷素綾本大楷書欵識云康熙辛亥孟夏日臨東坡之帖後有體元主人萬幾餘暇二璽卷前署御筆二字上鈐宣文之寶璽一卷髙一尺二寸四分廣一丈六尺五寸二分聖祖仁皇帝御臨蘇軾前赤壁賦一卷素絹本草書欵識云臨蘇軾書下有康熙宸翰敕幾清晏二璽卷前有淵鑒齊璽一卷髙一尺五寸廣一丈一尺六寸五分聖祖仁皇帝御臨黃庭堅書孟郊詩一卷灑金箋本楷書五言古詩一首欵識云臨黃庭堅書下有康熙宸翰璽一卷前有淵鑒齊璽一卷髙一尺三寸二分廣七尺四寸四分聖祖仁皇帝御臨米芾詩帖一卷素絹本行楷書五言排律詩二首欵識云臨襄陽米芾書下有康熙宸翰保合太和二璽卷前有日鏡雲伸璽一卷髙八寸廣六尺六寸三分聖祖仁皇帝御臨米芾詩帖一卷素絹本行楷書五言排律一首未署欵後有康熙宸翰稽古右文之章二璽卷前有淵鑒齊璽一卷髙八寸廣七尺七寸聖祖仁皇帝御筆倣米芾千字文一卷素絹本行楷書欵識云康熙壬午夏六月初庚後二日避暑口外雨霽風清四圍山色乘朝爽揮筆倣元章書法下有稽古右文之章璽一卷前有日鏡雲伸璽一拖尾臣陳廷敬跋云臣惟書稱堯文思舜文明禹文命昔者史臣將紀一代之至德至道大經大法必先首稱曰文文綦重矣而伏羲龍書神農穗書黃帝雲書爰自三皇已崇書道書綦重矣我皇上𢎞帝王之治統闡神聖之心傳天文覃敷御書昭被紹隆皇古濟美唐虞猗歟盛哉弗可及已臣嘗見萬幾餘閒無他嗜好博覽羣書手不釋卷清明在躬英華發外煒煌聖製昱曜斯文良由天縱生知加以時敏典學故盛德日新大業丕顯如斯其至也若夫宸章睿翰旬月所書數餘萬幅祕府之藏充函屬棟時蒙賜賚寵逮臣工鴻寶流傳光被天壤至御書千文真行草書已有數種各極其妙逺過古人頃頒示倣米芾千文仙毫結字奎藻聯篇如日月星辰之麗于天而髙莫能窮焉如嶽鎮海瀆之奠于地而厚莫可極焉臣等前所謂體勢則經天緯地風采則出聖入神也璧合珠連龍翔鳳舉八文六義應手從心運闔闢之樞機用文章之矩矱髙掩東晉直轥襄陽臣等前所謂無美不臻靡法不備也神完氣足幾動天隨儼然太乙下觀自有百靈潛衛臣等前所謂千言長幅立刻揮成自始至終無一懈筆也遂以是卜聖祚之遐昌慶嵩齡于億萬凡此賡揚之實洵為遭遇之隆臣等前請橅勒貞珉恭綴跋語荷蒙俯允敢布愚忱臣廷敬不勝瞻仰榮幸之至經筵講官吏部尚書臣陳廷敬恭跋又臣勵杜訥跋云臣杜訥叨侍內廷久歷年所稔見我皇上萬幾稍暇即撰文賦詩抽毫染翰雖盛暑隆寒每至丙夜弗輟用是天藻星羅編垂百卷業成二集宸書繁富夥够纍笥連篋駢積藝齊曩荷賜觀恭展竟日僅及百分之一二數年以來時蒙頒賚內外諸臣邇者兼許自擬堂名旋濡御墨拂素淋漓靡弗標新創格出聖入神卿二侍射之頃猶獲瞻仰揮毫環跽籲干均邀恩寵今自春入夏綾縑之外書側理二千餘幅除經賞給計存字一十三萬有奇特宣手敕以所儲卷軸分錫閣臣以下凡三百餘人聖朝異數振古罕聞兹蹕駐塞垣時方炎夏裁答封事之後臨池未午結宇盈千郵筒馳付典司臣等稽首敬閲體全法備璧合珠聯遒徑如山嶽堅貞宕逸若鳳鸞鶱翥光儷日月勢沛江河至運筆之古茂沉欎盡脫從來蹊徑卓越歷代帝王名臣奚啻萬萬昭示䇿府藝林世奉鴻模異寶矧御書千文大小真楷行草無一不備斯復長綃霧薄迅管風生妙致縱橫中峰迥拔化工在手矩矱從心畫裡千鈞行間萬象盡善盡美讚誦難名益欽我皇上道氣充周德元深厚健行廣運永慶萬年臣既拜覲榮光更卜無疆聖瑞曷勝踴躍歡忭之至都察院左副都御史臣勵杜訥恭跋又臣孫嶽頒跋云欽惟皇上萬幾餘暇寄興臨池或大書題額或直揮長幅無不元氣渾涵八法具備良由天縱神姿加以聖功不息固宜超詣入化也兹者駕幸塞垣值風清雨霽之時倣米芾千字文一卷不竟日而成特賜翰林官恭覽臣嶽頒幸與其列仰瞻之下行欵適均結搆完密非精神力量萬分具足未易觀成于俄頃且盡美盡善如斯也聖算綿長于斯可卜私心慶幸忭舞曷勝臣仰承聖訓粗知㸃畫向雖於御書法帖中備觀千字文真行草各種而今兹所見益日異月新臣誠莫測聖學之髙深惟有俯首歎奇絶而已謹拜手稽首而獻頌曰惟天行健惟聖時憲敬德慎修厥中以建我皇勤政旰食宵衣巡行郊甸爰駕六飛順令夏苗塞垣駐蹕批答章奏早夜無逸留心書射天縱之餘决拾既閒澄懷以居染翰臨池墨光璀璨山色四圍環拱几案維時雨歇溽暑疑秋清風徐來披拂林邱絹素橫陳柔潤若水興酣落筆日不移晷立成千字自昔未聞得心應手布濩烟雲傳示外藩震驚匍伏如天在頂如日在目賜觀內廷萬象陶鈞吐納若海變化若神歷代書家難更僕數敏妙兼該卓絶今古幸逢聖世景運日新儒風士習返朴還醇字學天開儼同羲畫帝樹之程文貫金石循端竟委完固堅强氣充力厚永卜無疆䖍請鉤摹上符星紀天壤流傳以垂萬祀禮部侍郎仍管國子監祭酒事臣孫嶽頒恭跋又臣胡會恩跋云皇上峻德神功參贊天地當久道化成之㑹而宵旰勵精罔有暇逸左圖右史玉振金聲發為宸章昭日星而炳宇宙若乃萬幾清宴游藝臨池綜括晉唐宋元明諸家各體而神明變化悉超軼而上之祕府所藏琳琅充積臣工霑賜寵溢簪裾至于法駕時巡聽覽之餘濡毫拂素亦無虛晷乃者塞垣朝爽倣米芾千文不竟日而就字字蒼堅古徑機圓力厚結搆天然煒哉聖功純密意在筆先故一氣揮成俄頃之間颷發韻流毫髮無憾歷稽前代帝王及書家宗匠從未有精微敏妙克臻斯境者也臣等伏覩御書千字文各種真行草書皆冠絶前古凌智永于行間轢褚趙于腕下此本苞含雄渾遠過襄陽真莫可擬議仰惟天文飛灑時萬象澄鮮山川環拱雲舒霞卷氣靜神凝億萬年清寧强固之庥于此備徵之矣臣會恩拜手敬瞻欣幸無極謹綴數字于卷末以抒鳬藻之忱云兵部左侍郎臣胡會恩恭跋又臣張廷瓚跋云皇上亶聰天錫大業日新經綸則苞育乾坤聲教則洋洽宇宙而又精研邱索罔間寒暄探道法之淵源抉詞華之閫奧古稱堯文丕煥何以加兹至于露溢金莖雲生鏤管綾文似水墨瀋如波運造化于毫端掣風雷于腕下神明八法皆本天縱之雄奇囊括諸家不僅人工之摹倣所由頌來禁苑與丹文緑字以同傳賜在臣廬每心維手追而不得彼夫鍾家太傅雅號書仙王氏右軍爭推草聖墨池筆冢咸飛滄溟之魚北海南宫並掃中山之兔雖為藝林之模楷總歸宸翰之陶鎔乃者胞與遐方懷柔藩服挽强引滿巡行于龍荒大漠之區躍馬鳴鞭撫綏于夏日炎風之會駐蹕而開黃幄事且萬幾臨池以灑霜毫卷將十丈急草千文之帖何須竟日之功睿思凝而成局羅胸神鋒發而錯綜在手千端雲擁則游龍夭矯于天池五彩翬飛則鳴鳳翩躚于丹穴放同泉決徑類藤牽疏密行間仰三垣之麗斗回環紙上若五緯之編珠霧靄烟霏未盡卷舒之變淵渟嶽峙難形結撰之奇允垂後以光前洵超今而冠古小臣職司載筆學愧塗鴉敬請金石之鐫廣作津梁之寶則千翻側理羣僚齊捧奎章十笏隃糜百世共藏拱璧裝成玳瑁琅函燭雲翰之輝襲以藝香錦軸耀文昌之色欣逢盛事寵沐殊榮驚駭逾涯慶幸何極日講官起居注詹事府少詹事兼翰林院侍講學士臣張廷瓚恭跋又臣陳元龍跋云臣聞金天紀鳳體象丹霄炎帝書雲勢回清漢望嘉禾而濡翰撫寶鼎以成章道在無為藝多入聖伏見我皇上垂裳致治握鏡臨朝惜此寸陰所其無逸政事之暇書射是娛用以涵養性情發揮文物沍寒溽暑不輟臨池晝漏宵鐘時聞灑翰法書寶墨軼晉超唐大軸長箋堆床壓架盈庭拜珠璣之賜薄海瞻奎璧之光兹者時邁龍沙于苗雞塞射堋聲靜更試龍香帳殿風清還鋪剡紙六時未竟千字俄成彼智永遜此神奇若元章歸于陶鑄攬山川之雄秀筆底包羅覩雲物之澄鮮毫端流露傳來塞上侍從咸驚宣示禁中臣鄰胥慶較舊鐫之數種别運神明昭傑搆于千秋永垂模楷光華煥發知聖體之日强氣韻安和識天顔之有喜葡萄載剪益廣長編琬琰精鎪用傳鴻寶際此文明之盛能忘揚頌之私小臣識比管蠡書慚蛇蚓悚惶無已忭舞難名謹拜手稽首而獻頌曰於赫我皇聖敬無逸六飛于邁萬靈承蹕巡行塞垣民事以恤政餘游藝是訓是則正筆以心觀射以德千文迅成不俟終日擘窠大字逈殊舊刻拂紙珠聨揮毫電疾鳳羽孤騫虹彩四溢匪懈匪舒以嚴以密精明斯固蕃祉貞吉象已參三畫先得一能由天縱法垂聖律如日升霄繁星自匿如龍御天靈魚敢匹傳示禁庭肅仰心怵青瑤載礱金泥玉櫛九有咸覩萬年表率卿雲墨妙焜煌鬱筆煥乎文章拜稽莫述日講官起居注翰林院侍讀學士臣陳元龍恭跋又臣王原祁跋云欽惟皇上御極以來治功光被文教誕敷薄海內外固已久道化成乃萬幾之暇猶復網羅四庫殫精八法真可謂天縱多能度越千古者也兹者避暑口外行宫肅爽清泉密林環流拱翠宸衷恬曠揮灑臨池倣米書千字文不竟日而成體格精嚴筆法變化從古所未經見使米芾生于今日亦應俯首欽服斂手退避臣原祁幸叨侍從獲與傳觀跪捧拜展異采騰光淋漓照曜仰見精神充溢元氣磅礴可徵聖夀無疆不苐翰墨奇珍也心目開朗踴躍歡欣至書法之闡幽入微臣原祁自慚結蚓無能贊歎以管窺天惟知為希世之寶敢求勒之金石永垂昭示謹拜手稽首而為頌頌曰維天垂象雲漢昭回大文丕顯鴻濛肇開聖人則之光被有格精一傳心道先羲畫吾皇受命如日方中聲教四訖莫不率從造化因心陰陽合德垂裳揮絃行健不息順時暇豫三伏避炎清溪灌木氣爽神恬招凉滌暑頤養天和藝編翻閲古蹟摩挲文披興嗣書傳海嶽濡毫灑翰龍虎騰踔心通墨妙意在筆先直凌羲獻遠勝米顛天章彪炳㸃畫縱橫鵝溪十丈千字揮成從古臨摹精研歲月栁骨顏筋便稱津筏流峙方圓頃刻而就如此帝力豈非天授馳示臣僚驚心炫目如旋天樞若轉地軸希代奇珍百王居首何幸獲觀嘆所未有鳳舞鸞飛照臨旭日墨裡行間元氣所出是則是效文苑生光儼同丹篆用卜遐昌金石是勒什襲是寶紫極瑤宫萬年永保右春坊右中允兼翰林院編修臣王原祁恭跋又臣查升題云璇璣纒絡騰紫烟河苞雒符孕先天聖人則象惟自然三光璀璨筆底懸宸章昨灑帳殿前想見墨瀋磨山泉凉颸微扇溽暑蠲萬幾清暇披長箋如何寸晷影未遷大書陸離字盈千神速直有風霆鞭烟霏霧結星斗聨黃封馳來天語宣臣工瞻拜相差肩驚歎抃舞彌恭䖍驪珠顆顆光且圓龍翔虎跳鸞鳳騫剛柔相濟裹鐵綿羲繇退舍况米顛吾皇至德體行健游藝亦參造化權豪鋩轉摺八法全規橅精采琬琰鐫微臣遭逢恩獨偏幸附不朽何因緣涓埃未報心拳拳歌詠盛治億萬年日講官起居注翰林院編修臣查升恭跋又臣宋駿業跋云臣聞一畫開天六書首出煥乎文章唐虞尚矣我皇上宵旰勵精功成治定猶重惜寸陰留神翰墨講求筆法先于正心臣忝列禁廷十餘年每捧天章日輝星燦擘窠大字行楷箋幅或倣古臨摹或機杼獨運富有日新盡善盡美此皇上篤好専精寒暑靡間如一日者也在諸臣之究心染翰者終未能竊窺淵奧而皇上得心應手之妙當有默會于意象之先者即如今年春夏一兩月間所書宸翰約逾十三萬字之多而所賜匾額不與焉臣思古今書家日得五百字者遂以善書名世聖功遜敏數倍于斯此亘古未聞之神異也又蒙溥賜閣臣以及部院寺省諸臣御書于保和殿諸臣忭舞歡呼交相稱賀合疏陳謝誠悅誠服豈僅鋪揚盛美媚兹一人而已哉兹者恭逢皇上避暑塞垣凝思行殿攬山光之環翠挹朝爽之微凉抽毫展素無或少間晷刻之頃動書成帙六月二十五日蒙頒示臣等御書千字文一卷乃取米芾筆意濡墨立成妙入化工捷同神運諸臣拜手肅觀神彩煥發體勢矯健自首至尾無美弗備莫不恭頌聖學之精純聖躬之强固僉曰聰明作睿則天亶之聖也勤學不倦則日躋之功也歷久彌篤則無息之驗也精進日强則升恆之象也元氣渾全則厯數之徵也臣未諳操筆私幸遭遇非常叨荷殊寵與瞻龍藻列名卷末臣之榮幸更無與儔用敢直陳盛事紀實拜揚語慚朴遫無任悚惶兵科掌印給事中臣宋駿業恭跋又臣沈宗敬跋云康熙四十一年夏六月聖駕避暑行宫羣臣章奏及內外機務宸斷無闕萬幾之暇留覽圖書吮豪潑墨倣米芾千字文大書一卷馳驛敕示內廷詞臣臣等恭叩開函龍章璀璨照耀雲日字體縱橫筆法圓徑有嶽峙淵渟之勢伏惟皇上研精八法大小行楷俱超越千古即所書千字文亦不下數十本兹卷如風行電掃尤極氣足神完仰見聖學日新精力强固從來稽古右文之主罕有及者臣等踴躍忭舞賡歌志美請勒貞珉永昭法則臣宗敬竊附侍從之末躬逢盛事曷勝慶幸謹拜手稽首而獻頌曰大哉我皇道邁百王聰明淵廣聖德丕彰殫心宥密萬善允臧時届奎中避暑朔方髙山出雲清風送凉既豫聖躬兼奠遐荒亦籌民隱亦務朝常上煩宵旰宛在廟堂勤政餘閒漁獵縹緗聖心和樂揮灑天章曾不移晷一掃千行龍跳虎卧鳳舞鸞翔若羲與獻孰能仰望而况米芾何敢擅長聖不自聖疇咨是將琅函一啓雲錦輝煌氣骨雄渾體勢堅强聖文崇煥不可度量臣鄰永法拜手賡揚以卜萬夀天地無疆翰林院庶吉士臣沈宗敬恭跋卷髙一尺五寸五分廣三丈三尺聖祖仁皇帝御臨趙孟俯書輞川詩一卷宣德箋本楷書欵識云庚午春三月臨下有正心誠意二璽卷前有八表同文璽一卷髙七寸九分廣三尺四寸聖祖仁皇帝御臨趙孟俯書歸田賦一卷素箋本草書欵識云壬午夏閏六月立秋後四日臨趙子昻書歸田賦後有康熙稽古右文二璽卷前有中和璽一卷髙六寸一分廣六尺五寸聖祖仁皇帝御臨趙孟俯書紈扇賦一卷宣德箋本行楷書欵識云癸酉春臨子昻書卷前有康熙御筆之寶璽一卷髙七寸八分廣三尺五寸九分聖祖仁皇帝御臨趙孟俯書秋聲賦一卷素箋本行楷書欵識云庚午臨上鈐康熙御筆之寶璽一卷前有致中和璽一卷髙一尺一寸七分廣六尺五寸聖祖仁皇帝御臨董其昌詩帖一卷素箋烏絲闌本行草書七言律詩四首欵識云癸未仲夏避暑于暢春園時雨初霽曉窗清爽臨董其昌書唐律四首下有康熙宸翰保合太和二璽卷前有佩文齊璽一卷髙八寸九分廣三尺七寸七分聖祖仁皇帝御臨董其昌書舞鶴賦一卷素絹本行書欵識云乙酉仲春南巡臨董其昌書下有康熙宸翰保合太和二璽卷前有佩文齊璽一卷髙八寸六分廣一丈二尺九寸五分聖祖仁皇帝御臨董其昌書滕王閣序一卷灑金箋本行草書欵識云癸未秋八月臨董其昌下有康熙宸翰保合太和二璽卷前有日鏡雲伸璽一卷髙九寸八分廣一丈三尺六寸聖祖仁皇帝御臨董其昌書駕幸太學賦一卷素絹本行草書未署欵後有康熙宸翰稽古右文之章二璽前有日鏡雲伸璽一卷髙一尺五寸廣二丈七尺一寸聖祖仁皇帝御臨董其昌書麒麟賦一卷素絹本行楷書欵識云乙酉春南巡舟中臨董其昌下有康熙宸翰保合太和二璽卷前有佩文齊璽一卷髙一尺一寸五分廣九尺聖祖仁皇帝御臨董其昌書五栁先生傳一卷素箋烏絲闌本行書欵識云壬午夏臨下有康熙稽古右文二璽卷前有中和璽一卷髙六寸一分廣二尺七分書軸聖祖仁皇帝御書乾九五爻辭一軸灑金箋本行楷大書飛龍在天利見大人八字下有五味在和淵鑒揮毫二璽右方上有三無九有璽一軸髙六尺廣二尺一寸二分聖祖仁皇帝御書聖經一軸素絹本行楷大書欵識云康熙三十三年歲在甲戌仲夏穀旦書上鈐欽文之璽璽一軸髙九尺八寸三分廣五尺一寸五分聖祖仁皇帝御書唐句一軸灑金箋本行書五言截句一首後署唐句下有戒之在得七旬清健二璽右方上有坦坦蕩蕩璽一軸髙三尺二寸七分廣一尺三寸八分聖祖仁皇帝御書五臺碧山寺碑文一軸素絹本楷書欵識云康熙三十九年月日上鈐康熙宸翰璽一軸髙四尺八寸廣二尺五分聖祖仁皇帝御書五臺殊像寺碑文一軸素絹本楷書欵識云康熙三十九年月日上鈐康熙宸翰璽一軸髙四尺八寸廣二尺五分聖祖仁皇帝御臨米芾書泰階六符賦一軸素箋本行楷書欵識云襄陽米芾書泰階六符賦己卯臨下有康熙宸翰敕幾清晏二璽右方上有淵鑒齊璽一軸高七尺七寸八分廣二尺七寸八分聖祖仁皇帝御臨宋髙宗書漢髙祖求賢詔一軸素絹本行楷書欵識云臨宋髙宗書下有康熙宸翰保合太和二璽右方上有佩文齊璽一軸髙三尺八寸三分廣一尺一寸七分聖祖仁皇帝御臨董其昌詩帖一軸灑金箋本行書五言古詩一首後署臨董下有五味在和淵鑒揮毫二璽右方上有三無九有璽一軸髙六尺六寸廣四尺七寸七分聖祖仁皇帝御臨董其昌詩帖一軸灑金箋本行書大字五言律詩一首後署臨董下有五味在和淵鑒揮毫二璽右方上有三無九有璽一軸髙九尺三寸一分廣三尺七寸一分聖祖仁皇帝御臨董其昌書樂志論一軸素絹本行楷大書欵識云甲戌三月臨董其昌書樂志論下有體元主人萬幾餘暇二璽右方上有三無九有璽一上方中有康熙御筆之寶璽一軸髙一丈五寸廣五尺七寸七分聖祖仁皇帝御臨董其昌倣趙孟俯詩帖一軸素箋本行書七言律詩一首後署董其昌臨趙松雪詩帖下有康熙宸翰敕幾清晏二璽右方上有淵鑒齊璽一軸髙六尺一寸七分廣二尺四寸三分聖祖仁皇帝御臨董其昌蘭亭帖一軸素箋本行書欵識云癸酉春臨華亭董其昌書下有體元主人萬幾餘暇二璽前有三無九有璽一上方有康熙御筆之寶璽一軸髙一丈一尺七寸四分廣七尺聖祖仁皇帝御臨董其昌書老人星賦一軸素綾本行楷書欵識云康熙二十八年冬至前臨董其昌老人星賦恭進下有敬天勤民璽一右方上有日鏡雲伸璽一軸髙七尺九寸二分廣三尺六寸七分石渠寶笈卷一
