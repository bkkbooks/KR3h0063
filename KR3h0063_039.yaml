body:
  text: 貯養心殿九無名氏畫軸上等五代人秋林羣鹿圖一軸上等天一素絹本著色畫右方上有奎章一璽左方下有天厯一璽軸髙三尺六寸九分廣一尺九寸九分五代人丹楓呦鹿圖一軸上等地一素絹本著色畫右方上有奎章一璽下有李之粹一印左方下有天厯一璽右邊幅有九如清玩也園珍賞二印左邊幅有阿爾喜普之印東平二印軸髙三尺七寸廣二尺一分宋人秋瓜圖一軸上等元一素箋本著色畫右方中有黔寧王子子孫孫永保之太谷子晉二印左方下有梁陶侣書畫印東垣梁氏豫培家藏二印軸髙八寸四分廣一尺四寸二分宋人蕭翼賺蘭亭圖一軸上等黃一素絹本墨畫右方上有宣文閣寶乾卦二璽下半印二漫漶不可識左方下有紹興一璽又陳定一印又一印漫漶不可識軸髙四尺四寸九分廣一尺八寸六分宋人枇杷戲猿圖一軸上等宇一素絹本著色畫上方押縫有宣文閣寶一璽右方下半印漫漶不可識左方下有蕉林觀其大略二印下方邊幅有蕉林收藏一印軸髙五尺一寸五分廣三尺三寸五分宋人牧馬圖一軸上等宙一素絹本墨畫右方上一印漫漶不可識軸髙一尺三寸三分廣一尺三寸八分宋人雙喜圖一軸上等洪一素絹本著色畫上方有晉國寶章一印右方上有性命同珍依子孫永寶玩一印又一印惟珍藏二字可辨下有半印不可識左方上有晉府書畫之印敬德堂圖書印二印下有清和珍玩乾坤清玩二印又下有三河孫東瀛珍藏一印又半印漫漶不可識軸髙六尺三分廣三尺二寸一分宋人小寒林圖一軸上等荒一素絹本墨畫右方上有宣文閣圖書印一璽下半印漫漶不可識下邊幅有蕉林觀其大略二印軸髙一尺三寸廣一尺五寸三分宋人卻坐圖一軸上等日一素絹本著色畫軸髙四尺五寸八分廣二尺四寸二分宋人柳陰髙士圖一軸上等月一素絹本著色畫右方下有孫承澤印一印左方下有北平孫氏一印右邊幅有棠村審定蕉林二印軸髙二尺三分廣一尺二寸四分元人溪橋風雨圖一軸上等盈一宋箋本著色畫軸髙一尺七寸廣一尺二分元人柳塘白燕圖一軸上等畏一素絹本著色畫右方有珍祕宜爾子孫琴書堂都尉耿信公書畫之章諸印左方有真賞丹誠植庭清玩東平公字信公珍賞諸印下邊幅有也園珍賞一印軸髙九寸八分廣一尺八寸八分元人畫蘭一軸上等辰一素箋本墨畫上方王朝民題云此花出土最清香久逺三秋欲斷腸若把一枝深著意春來依舊又生芳江東文祥山人書又𨽻書題句云生自幽谷異爾瓊芳剩有天然素質休作羣樣巧粧夢之曽徵國瑞佩之可除不祥君子流芳百世不可一日無此清香下署昆石書軸髙三尺五寸八分廣八寸三分附刻絲畫軸上等富貴長春圖一軸上等天一宋本五色織牡丹軸髙二尺七寸四分廣一尺二寸一分蟠桃獻夀圖一軸上等地一宋本五色織下方有內合同印半印詩塘繡七言絶句云蟠桃一熟九千年方朔偷來獻夀筵才入齒牙甜勝蜜頓教凡骨變成仙上繡御書一璽軸髙三尺四寸三分廣一尺六寸九分花鳥一軸上等元宋本五色織右方上有中和位育一璽左方下有項子京家珍藏一印軸髙三尺六寸廣一尺七寸一分雙喜圖一軸上等黃一元本五色織梅花雙鵲右方中素織款題云曉風香萼獨開遲雙鵲娟娟報喜時最是上林芳信早分明春在萬年枝華陽王曉下織王曉一印軸髙二尺四寸四分廣一尺二寸六分畫軸次等宋人寒林待渡圖一軸次等天一素絹本墨畫宋人松月圖一軸次等地一素絹本著色畫宋人山齋邀客圖一軸次等元一素絹本墨畫宋人觀梅圖一軸次等黃一素絹本著色畫宋人桐實修翎圖一軸次等宇一素絹本著色畫宋人岷山晴雪圖一軸次等宙一素絹本著色畫宋人松泉盤石圖一軸次等洪一素絹本墨畫宋人寒塘羣雁圖一軸次等荒一素絹本著色畫宋人花竹翎毛一軸次等日一素絹本著色畫宋人花鳥一軸次等月一素絹本著色畫宋人秋荷野鳬圖一軸次等盈一素絹本著色畫元人買魚沽酒圖一軸次等是一素絹本著色畫元人風雨歸舟圖一軸次等辰一素絹本著色畫元人杏鵝圖一軸次等宿一素絹本著色畫元人畫虎一軸次等列一素絹本著色畫元人畫虎一軸次等張一素絹本著色畫元人古木寒鴉圖一軸次等寒一素絹本著色畫明人摹西園雅集圖一軸次等來一素絹本著色畫明人摹西園雅集圖一軸次等暑一素絹本著色畫明人山水一軸次等往一素箋本著色畫明人花下鴛鴦圖一軸次等秋一素絹本著色畫附刻絲畫軸次等崔白花卉一軸次等天一宋本五色織右方下素織崔白製三字竹杖化龍圖一軸次等地一明本五色織國朝人畫軸上等惲夀平臨吳鎮五清圖一軸上等天一素絹本墨畫水月松竹梅款識云梅花菴主五清圖白雲外史夀平戲臨後有惲正叔夀平二印軸髙四尺一寸六分廣一尺八寸八分王原祁仿李成筆意一軸上等地一宣德箋本墨畫款識云仿李營丘己卯春寫于東宅新構書室原祁下有原祁之印麓臺二印前有蒼潤一印左方下有畫圖留與人看一印軸髙一尺四寸八分廣二尺六分左方上張照書御題詩云宣紙一幅剛尺一中有千山髙嵂崒摩挲象軸認蟲文喜是麓臺老來筆麓臺年老筆亦老洗淨鉛華存秀質當軒為展玉屏幛别有石筍天邊出槎丫古木無萬數蒼松葉在陰猶密盤折羊腸圍山腰替戾鈴聲飄塔室憶昨盤山最上盤巉巖偶駐金吾蹕謂當積素復來觀旋念執事增寒栗今朝披圖正雪後十四從知原二七坐教心地足清涼把玩間吟看折堲乾隆御題下署臣張照敬書王原祁仿王蒙筆意一軸上等地二宣德箋本墨畫款識云上元節例得入禁苑陪宴余與同直諸公奉命候于邸寓心間身逸此小三昧時也興會甚合放筆寫山樵筆並記其事己丑春王作王原祁下有王原祁印麓臺二印前有畫圖留與人看一印右方下有西廬後人一印軸髙二尺九寸二分廣一尺二寸八分王原祁仿王蒙筆意一軸上等地三宣德箋本墨畫款識云畫法要兼宋元三昧元季四家學董巨又各自成家山樵尤從中變化莫可端倪所為冰寒于水者也學者體認神逸之韻窮究向上之理雖未能登堂入室亦不無小補云丁亥小春寫于雙藤書屋王原祁後有王原祁印麓臺二印前有畫圖留與人看一印右方下有西廬後人一印軸髙三尺一寸四分廣一尺四寸一分王原祁仿倪瓚筆意一軸上等地四宣德箋本墨畫款識云余近得雲林蕭間道館之作恬雅中有沈鬱非時趨清中帶軟所能夢見晨夕摹仿筆墨微旨如擊石火閃電光思之若有所得循之恐失其蹤此圖適成于倪畫未必無因緣會合處識之康熙辛巳九秋麓臺祁筆下有王原祁印麓臺二印前有掃花菴一印右方下有西廬後人一印軸髙三尺五分廣一尺五寸六分王原祁煙浮逺岫圖一軸上等地五宣德箋本墨畫款云臣王原祁恭畫下有臣原祁一印軸髙三尺八寸九分廣一尺六寸九分王原祁江鄉春曉圖一軸上等地六宣德箋本著色畫款云臣王原祁恭畫下有臣原祁一印軸髙四尺一寸九分廣一尺八寸王原祁華山秋色圖一軸上等地七宣德箋本著色畫款識云余癸酉歲遊華山歷娑蘿青柯二坪至回心石日暮而返作詩六章以紀其勝此圖就余所登陟者寫其大概南峰西峰目力所及也惜少濟勝之具攀躋無緣閣筆悵然麓臺祁識下有王原祁印麓臺二印前有古期齋一印右方下有石師道人一印軸髙三尺六寸一分廣一尺五寸五分王原祁晴翠浮嵐圖一軸上等地八宣德箋本著色畫款云臣王原祁恭畫下有臣原祁一印軸髙三尺七寸七分廣一尺六寸五分王原祁雲壑流泉圖一軸上等地九宣德箋本墨畫款云翰林院侍講臣王原祁恭畫下有臣原祁一印軸髙二尺九寸四分廣一尺五寸三分僧元濟王原祁合作一軸上等元一宣德箋本元濟墨畫蘭竹款識云風姿雪艷之中隨意點綴何物不成清賞所既有寒木又發春花新尚書亦應笑而首可時辛未二月寄上問翁老維摩清湘石濤濟道人下有苦瓜和尚臣僧元濟石濤諸印王原祁補坡石款云麓臺補坡石下有王原祁印一印右方下有問亭鑒賞圖書一印左方下有輔國將軍博爾都號問亭之章何可一日無此君二印軸髙四尺一寸九分廣一尺八寸徐枋溪亭納涼圖一軸上等黃一素箋本墨畫款題云緑樹敷陰白晝長清波蘸影曉山蒼還應走馬長安客輸我溪亭五月涼俟齋徐枋下有昭發一印軸髙二尺一寸三分廣九寸徐枋仿董源筆意一軸上等黃二素箋本墨畫款識云丙寅春日仿董北苑筆意于澗上草堂俟齋徐枋下有徐枋之印俟齋二印右方下有徐伯子俟齋畫記一印左方下有笠山笠水間居易堂印二印右邊幅有二魏印凡二軸髙三尺四分廣一尺三寸七分柳遇畫鶯粟花一軸上等宇一素絹本著色畫款署柳遇下有柳遇連印軸髙二尺二寸四分廣一尺二寸五分赫奕茆亭竹樹圖一軸上等宙一素絹本墨畫款云臣赫奕恭畫下有赫奕恭畫連印軸髙二尺七寸廣一尺二寸三分右方上聖祖仁皇帝書御製舊作云森萃青青繞碧塘霜姿靄靄動幽香寒風不變終身節緑葉紛然映晚涼下有康熙稽古右文二璽前署初秋咏竹四字有中和一璽赫奕晴嵐晚翠圖一軸上等宙一素絹本著色畫款云臣赫奕恭畫下有臣赫奕恭畫連印軸髙三尺一寸廣一尺五寸九分右方上聖祖仁皇帝御書唐人七言截句一首識云唐句下有康熙稽古右文二璽前有中和一璽赫奕畫漁父詞一軸上等宙三宣德箋本墨畫上方書漁父詞一首款識云辛卯秋日作併録梅花道人漁父詞赫奕下有赫奕之印淡士二印前有青靄軒一印軸髙二尺二分廣一尺九分蔣廷錫野菊一軸上等洪一素絹本著色畫款云臣蔣廷錫恭畫下有臣廷錫朝朝染翰二印軸髙二尺二寸五分廣八寸六分上方聖祖仁皇帝書御製舊作云山花墅菊喜清風塞北煙光報嶺楓無暑不知秋氣至數叢蘭蕊放離宫乙酉秋日山莊偶成併書下有康熙稽古右文二璽前有惜寸陰一璽王敬銘山水一軸上等荒一素絹本著色畫款云臣王敬銘恭畫下有臣敬銘一印軸高四尺九寸五分廣二尺一寸六分上方御筆題神字唐岱仿范寬山水一軸上等日一宣德箋本著色畫款識云乾隆八年孟夏仿范寬臣唐岱恭畫下有臣唐岱一印軸髙三尺八寸五分廣二尺一寸六分畫軸次等裕親王夏山圖一軸次等天一素綾本著色畫款識云康熙壬戌七月既望裕親王寫于還讀閣之晴窗藍瑛雪景一軸次等地一素絹本著色畫款識云仿范華原萬山積雪之意于吳山一目洞天己亥花朝蝶叟藍瑛劉億仙犬圖一軸次等元一素絹本著色畫款署陵川劉億王翬仿李成江干七樹圖一軸次等黃一宣德箋本著色畫款識云李營邱江干七樹圖壬辰夏五月畫于來青閣耕煙散人王翬又書董其昌畫旨並識云右董文敏論畫二則端陽日又書下署耕煙子又自識云枯樹最不可少時于茂林中見乃蒼秀王雲王翬合作一軸次等宇一宣德箋本王雲臨陸治著色花卉王翬雙鈎畫竹右方上王雲款題云晴華蕩日午風恬細草平沙暖布煙文鳥自眠花自舞江鄉春色弄清妍王雲臨包山叔平筆幅中空處王翬款識云耕煙散人王翬補飛白竹枝時庚辰六月朔王雲山水一軸次等宙一素絹本著色畫未署款左方下有王雲一印王原祁山川煥采圖一軸次等洪一素絹本著色畫右方上署山川煥采四字左方下款云右春坊右中允臣王原祁恭畫進王原祁平林罨翠圖一軸次等洪二素絹本著色畫款云翰林院侍講臣王原祁恭畫王原祁層巒積靄圖一軸次等洪三宣