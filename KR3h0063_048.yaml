body:
  text: 貯重華宫國朝人書畫書册上等王鑑倣古王鑑倣古惲向倣古惲夀平寫生惲夀平山水花卉合璧惲夀平摹古王翬圖繪王原祁畫避暑山莊三十六景蔣廷錫鵓鴿譜陳枚畫耕織圖閨秀錢陳書繪歷代帝王道統圖慎郡王允禧畫盤山十六景慎郡王允禧畫盤山十六景畫册次等惲夀平花卉畫幅集册王敬銘山水冷枚畫遊泳莊環泠枚畫歷朝賢后故事鄒一桂花卉余省寫生花卉列朝人書畫書畫合册上等明唐寅畫終南十景吳奕書國朝人書畫書畫合册次等冷枚畫聖帝明王圖院本陶冶圖戴臨書圖説赫達資畫麗姝萃秀
