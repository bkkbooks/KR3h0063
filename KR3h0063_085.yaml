body:
  text: 貯學詩堂列朝人晝册上等宋馬和之畫邶風七篇圖一册上等天一素絹本凡七幅著色畫式微旄邱泉水北門靜女新臺乘舟七篇款脫第四幅有張伯起氏一印邊幅有梁清標印蕉林二印第六幅邊幅有蕉林玉立氏圖書觀其大略二印又每幅有大明安國鑒定真迹一印後副頁陸師道跋云張伯起購得馬和之毛詩圖而亡其詩請余考定其篇余惟詩所以示勸懲畫所以昭法戒故昔人好以詩篇作圖如陸探微新臺衛協律黍離蓋與列女傳孝經圖同意至宋高孝二廟始盡寫三百篇令和之圖寫其迹既多故去今五百年而散落人間者往往不絶余嘗見采蘩等數章則思陵御書猶存可隨篇而命圖也而伯起此卷獨亡其詩亦無款印以其行筆飄逸立意高古非和之莫能作而考其意象亦有不待書而可知其篇名者其皆邶風之什耶如河上之臺既泚既灑而國人經從其下望者動色見者抑首皆有不忍見其籧篨戚施之態而相顧腹誹者非新臺乎城隅九雉而不見所愛者踟蹰搔首于其下則靜女也涉危遂往乘舟泛泛而無所薄而涯端父老望而傷思之中心養養如見其狀非二子乘舟其孰當之其君露次而諸臣鞠躬以諫者其黎臣之賦式微乎前高後下者旄邱也其上蔓延相及者旄邱之葛也而叔伯羣居有褎如充耳之容則旄邱之所以責衛也倚樹之女有深思焉而所臨者毖然之流所與謀者孌然之姬也豈非衛女之賦泉水以思歸乎城闉之外樹木叢蔚其背陽向隂之北門乎而羸馬疲童蕭然獨出有仕不得志之意焉其卒篇蓋北門也夫詩存而可名其圖者非善之善也詩亡而可決知為此詩之圖者乃真能圖詩者也此所以為和之也不知伯起以為何如倘以為然則請更定其次以從詩序長洲陸師道題又張鳳翼跋云此卷蓋先君子購以付不肖者也先君子精于賞鑑嘗向不肖言畫貴有士夫氣而宋代諸名家惟和之為獨得故纍葉所襲藏雖多而於此尤加珍惜焉時陸子傅先生以春官郎謝病家居方鋭意摹古一見此卷欣然攜歸遂為題識如左不數年間子傅疾作藻翰大減于前於是不復有精楷今化去又數年于此矣雖非精楷亦不可得也矧宋人名筆即存什一於千百所謂尚有典型亦豈可以散帙少之哉丁丑冬杪獨坐悟往齋忩明几淨偶一展玩漫爾識之張鳳翼後有蒼巗子蕉林鑑定二印幅高八寸一分廣一尺一寸四分對幅金粟箋本御筆書七篇本詩第一幅有茹古涵今攜筆流雲藻二璽第二幅有意在筆先含經味道耽書是宿緣三璽第三幅有觀書為樂一璽第四幅有含英咀華會心不逺二璽第五幅有清心抒妙理微言晰纎毫二璽第六幅有讀書依竹靜鏡清砥平二璽第七幅有乾隆御筆摛藻為春二璽後餘幅御筆跋云宋馬和之善畫人物山水志稱其筆法飄逸自成一家高孝兩朝深重其畫嘗敕畫毛詩三百篇每篇各為一圖寫景設色具繪水繪聲妙手而下逮列國上自朝廟凡風俗貞淫之故禮樂燕饗之儀犂然畢具尤足以備形容昭懲勸也流傳數百年大半殘失今入內府者有小雅三頌鄘風齊風邶風等圖而邶風原本十九篇所存者僅七篇耳其餘或燬于兵燹或散佚人間惜不復覩全璧之合然吉光片羽古人是重即今祕苑所藏亦足仿佛大槩矣豫以幾暇偶閲是圖爰取式微旄邱泉水北門靜女新臺乘舟七篇分寫每頁用相比偶豈特賞其藻繪之佳亦以見名人筆墨具有深意云耳乾隆甲子仲冬之月八日御識下有乾隆宸翰幾暇臨池清心抒妙理三璽元四大家名迹一册上等地一素箋本凡四幅第一幅黃公望著色畫小年菴圖前署小年菴圖四字欵識云大癡學人為復陽隱者作後有公望黃子久氏二印又後有題句云一峯老癡高且逸結屋虞山稱絶筆復陽學者懸此圖正是一日是兩日後署竹西老人幅前有三江吳克符氏二印又二印不可識幅後有文徴明印一印幅高二尺廣一尺四分第二幅吳鎮墨畫山水款云梅道人戲墨上鈐嘉興吳鎮仲圭書畫記一印前俞和識云吳仲圭山水得董巨正脈此圖筆墨淋漓氣韻生動宜顧仲瑛亟賞之也紫芝生幅前有天籟閣子京父印墨林山人希魯諸印又二印殘蝕存潭字敬字可辨幅後有平生真賞項子京家珍藏二印又半印二不可識幅高一尺六寸六分廣一尺三分第三幅倪瓚墨畫樹石款題云逸筆縱橫意到成燒香弄翰了餘生忩前竹樹依苔石寒雨蕭蕭得曉晴瓚幅高一尺四寸九分廣九寸六分第四幅王蒙著色畫雲岫篆書署春雲出谷四字款云王蒙畫幅前有常郡周氏一印幅高一尺四寸二分廣八寸八分對幅金粟箋本御筆題句第一幅題云千山葉落山容出吟秋萬竅翏翏疾蕭齋搆處面羣峯插架圖書三萬帙只此虛無守谷神坐來一日似兩日問誰多事泄山靈黃氏大癡走健筆御題下有惟精惟一乾隆宸翰二璽第二幅題云溪村待渡無輕舟略彴支波嘗入腳寒煙漠漠野塘秋似有行人隔叢薄漁兒一棹破滄浪短笛無腔隨意樂紛紛名利付青雲愛此蕭間興所託御題下有翌太和煙雲舒卷二璽第三幅題云枯枝疏葉披風霜颯然特立苔石旁下無幽人相徜徉上無繁葩弄芬芳倪迂妙筆徑且蒼繩墨不中庸何妨千年尺素含幽光不教金碧誇李唐御題下有所寶惟賢乾隆御筆二璽第四幅題云春氣濛濛濕林麓蒸為靈雲滿春谷板橋杖䇿者何人芙蓉為巾薜荔服悠然獨往不獨歸那愛世間榮與辱我亦無心如此圖長日臥遊猶不足御題下有修辭立誠潄芳潤二璽明人集錦畫一册上等元一凡十幅第一幅素箋本王紱墨畫竹石欵題云古石巑岏碧蘚生數竿疏翠雨初晴軒忩不必多栽植才有此君風便清紱下有孟端一印幅前有楊勉私印一印後有檇李李氏鶴夢軒珍藏記一印左方曾棨題云龍山道士筆如椽解寫篔簹古石邊仿佛渭川春雨外幾竿寒玉翠娟娟廬陵曾棨書幅高八寸五分廣七寸三分第二幅素箋本姚綬著色山水款識云成化辛卯九月公綬畫時在丹邱小蓬臺之七十二峰高處下有公綬一印又下有南峰高處一印幅高八寸八分廣一尺二分第三幅素絹本墨畫人物款署南山下有夢陽一印左方姚綬題云江頭緑柳飛黃鳥緑柳中間江路依依繞江水茫茫天影倒鏡光裏面間鷗小我住江鄉猶未老鷗喜忘機黃鳥又啼春曉酒債詩逋難得了此外青山情渺渺右詞蝶戀花丹邱兩鶴主者戲填幅高七寸廣六七第四幅素箋本著色畫人物款署莊瑾下有莊瑾半印幅高八寸五分廣一尺三寸第五幅素絹本文徴明著色山水有徴明一印左方自題云西風吹雨弄簷聲燈火寥寥夢未成剪取素綃臨瘦影小窗留得歲寒情徴明下有文徴明印徴仲二印幅高六寸七分廣五寸五分第六幅素絹本仇英著色畫人物款云仇英實甫製下有仇實甫氏一印幅前有十洲一印左方文謙光題云酒闌客散小堂空旋捲疏簾受晚風坐久忽驚涼影動一痕新月在梧桐文謙光幅高一尺廣六寸五分第七幅素箋本林良著色畫竹鵲款署林良下有以善圖書一印左方文寵光題云十畝園亭竹半分玲瓏月影上苔紋閉門莫道無知己盡日相看有此君八十一翁文寵光又文柟題云渭川急雨暗秋空無限琅玕淡墨中劍甲樅樅軍十萬欲將貔虎戰秋風文柟題幅高八寸三分廣七寸六分第八幅素箋本杜堇著色畫人物款署柳居杜堇幅高八寸五分廣一尺一寸第九幅素箋本陸治墨畫花卉款識云甲子仲春包山陸治下有陸叔平氏一印幅高九寸五分廣一尺二寸三分第十幅素箋本陳淳著色牡丹幅後有復父氏一印前有大姚一印左方自題云粉黛三千麗朝雲十二峯如何洛陽陌化作梵王宫道復下有白陽山人陳氏道復二印幅高八寸廣八寸三分前副頁有徴明隸書適興二大字款署徴明明沈周仿倪瓚筆意一册上等黃一素箋本墨畫凡八幅第一幅款題云山木半落葉西風方滿林無人到此地野意自蕭森沈周下有石田一印幅後又沈啓南一印第二幅款題云看雲疑是青山動雲自忙時山自間我看雲山亦忘我歸來洗硯寫雲山沈周下有石田一印幅前又啓南半印第三幅款題云疏篁古木都成老石澗莓苔亦有花排悶不須千日酒聊將小筆畫龍蛇沈周下有石田一印幅後又沈啓南一印第四幅款題云竹影疏隂清徹骨和風晴日淡宜人人能消受天分付便是羲皇之上民沈周下有石田一印幅前又沈啓南一印幅後有史鐵崖珍藏書畫子孫永寶二印第五幅款題云兀坐溪頭無個事清波厯厯見鬚眉微吟儘自送落日幽况滿懷人不知沈周下有石田一印幅前又沈啓南一印又史鐵崖珍藏書畫子孫永寶二印第六幅款題云赤城霞暖神芝秀洞裏桃花不記春何事却將山水腳鍾陵市上踏紅塵沈周下有石田一印幅後又沈啓南一印又史鐵崖珍藏書畫子孫永寶二印第七幅款題云缺館清虛五月秋疏簾珍簟看瀛洲忩前種得青桐樹時有鳳凰栖上頭沈周下有石田一印幅後又沈啓南一印又史鐵崖珍藏書畫子孫永寶二印第八幅款題云宜遠亭前春可憐數峰依約亂流邊若為倚劍崆洞外回望齊山九點煙沈周下有石田一印幅後又沈啓南一印又董其昌跋云沈啓南畫以學元季四大家者為佳絶就中學倪高士尤擅出藍之能此八幅皆作倪迂筆意缺馮侍御家缺真迹可寶也董其昌下有史鐵崖珍藏書畫子孫永寶二印前副頁其昌又識云王元美評沈啓南畫謂于諸體無不擅場獨倪雲林覺筆力太過此非篤論雲林早歲師董源乃黃子久為之導觀其稱大癡老師知傳受有自特具幽淡蕭灑以苒弱為絶俗是畫外别傳耳啓南助以筆力正是善學柳下惠國朝倣倪元鎮者一人而已因題八册及之董其昌幅高一尺一寸四分廣二尺明沈周寫景一册上等黃二素箋本墨畫凡十幅第一幅款題云疊崦重溪細路分雨餘厯亂鹿成羣藤枝管領佳山水行有飛花從有雲沈周下有啓南一印第二幅款題云先路不須雙白鶴扶衰還要紫藤條天光松影溪如鏡照個詩翁過野橋沈周下一印同前第三幅款題云滿地綸竿處處緣兩人同業不同船江風江浪無慿準相並相依是偶然沈周下有石田一印第四幅款題云竹密山齋冷荷開水殿香沈周下一印同前第五幅款題云白石齒齒清泉汨汨臨流兀坐已消長日沈周下有啓南一印第六幅款題云我愛碧江淨輕舟點破秋西風梢鬢腳直得不梳頭沈周下有白石翁啓南二印第七幅款題云重林高下樹青紅籹點人家似畫中秋色滿村藏不住隔溪分出一枝楓沈周上鈐白石翁一印第八幅款題云山徑蕭蕭落木秋字衍疏小橋流水限林廬秋風黃葉無人迹雞犬不聞惟讀書沈周下一印同前第九幅款題云秋水牽沙落寒藤抱樹疏沈周下有石田一印第十幅款題云一白千山合清光照膽寒小橋沽酒少步步玉痕乾沈周下有白石翁一印幅後自跋云右畫册凡數翻山水樹石溪亭仙館月露風雲各自為狀其間描寫逺背古人謂為得意則吾豈敢然觀者或有取焉當置我于牝牡驪黃之外可也𢎞治庚戌夏六月避暑有竹莊適性甫過訪日夕相對寫以贈之石田老人沈周識下有沈啓南氏白石翁二印前有有竹莊一印幅高一尺五分廣一尺八寸四分明唐寅摹古一册上等宇一素箋本凡十幅每幅有唐寅私印一印第一幅著色畫幅前有王鏞之印一印又一印漫漶不可識第二幅著色畫幅前有王鏞之印仲和父二印第三幅著色畫幅前有王鏞之印一印又一印漫漶不可識第四幅墨畫幅後有王鏞聯印第五幅墨畫幅後有王鏞仲和氏二印第六幅著色畫幅後有王鏞之印師古生二印第七幅著色畫幅前有王鏞聯印第八幅墨畫幅前有王鏞之印師古生二印第九幅著色畫