日一素絹本圓幅著色用海西法寫生凡十二幅每幅款云臣郎世寧恭畫末幅款識云乾隆五年正月臣郎世寧奉敕恭畫第一幅畫馬左方梁詩正書御題詩云伯樂今難遇誰空冀北羣橫風嘶逸韻意氣欲凌雲乾隆辛酉夏五御題後有涵虛朗鑑成性存存二璽餘十一幅任蘭枝蔣溥梁詩正汪由敦嵩壽鄂容安彭啓豐介福金德瑛秦蕙田莊有恭諸臣題句皆梁詩正書末幅款識云乾隆六年夏六月臣梁詩正奉敕敬書列朝人書畫合册上等宋高宗書孝經馬和之繪圖一册上等天一素絹本右方著色畫左方楷書章第九第十畫缺第十二書畫俱缺章第一第三第五第六第七第十八畫幅俱有尚義隂景萬記一印後副頁宋逢丑跋云高宗德壽皇帝宸翰孝經詔諸畫苑設像立儀以詔後人俾為人臣者知事君上之忠為人子者知事父母之孝則天理人倫咸在是矣今幸拜暏敢不盥薇露焚玉𬎼敬識於後端平乙未孟春吉旦耶溪宋逢丑書下有尚義隂景萬記一印又滕天驥跋云嘉陵以孝行治天下四方風嚮罔不克盡厥躬以忠其君以愛其親以敬其兄萬幾之餘又能敕諸良史繪孝經圖御筆親灑是經分章析類書畫兩絶光耀華夏為世珍寶天驥夙因慶幸得遇觀曕洗滌身心以記歲月時景定庚申四月望南陽滕天驥謹書又金應桂跋云高廟天姿英發神祖叶扶開太平中興之基復百二山河之主聖由天縱肆筆成書孝經一十八章章首繪像連篇纍牘罔或有間御府款識逐一附題恩錫近臣為世珍寶五孝有則百行俱彰天理人心孰不韙歟時咸淳丙寅夏結制日蓀璧金應桂拜觀于鑑湖修竹齋乂崔晉跋云山隂王府修竹乃祖嘗沭德壽宫寵賜御札連相孝經各於篇末俱有玉章天元啓運聖教益興其雲仍懼恐冒昧遂為芟去而于愛羊存禮之義何如哉信乎蓀璧居士之言不誣也兹因所獲姑托其略以記本末云歲次己亥中秋日武林崔晉拜手書又趙孟俯跋云孝者百行之首經為日用之常故夫子設教必以孝為先也而弟子授受以為日用常行之道誠事親始充而廣之至于事君立身修德不外是矣聖人之心豈外是乎中興皇上非獨以孝敬達于中國而以奎畫行于天下遒徑婉麗穠纖巨細一崇格法雖鍾王復書虞褚再世未易過此繼而詔下衆史推其能者作會各于章首對相標題使其本末相連文藻備具孟俯丱角習書至于聖翰沉潛展玩留心多矣可能浸漬毫釐尚且以貽衆望今之覽者其可忽諸三復加歎襲寶藏之大德三年秋七月望吳興趙孟俯敬題于進學齋下有尚義隂景萬記一印書計十七幅畫計十五幅幅高九寸廣一尺有竒按諸跋中誤字頗多今仍之存其舊也明宣宗書畫合璧一册上等地一宋箋本首幅墨畫竹樹雙鵲款識云宣德戊申御筆戲寫上鈐廣運之寶一璽後九幅行書自製小詞前署云御筆戲作一枝花後又署宣德三年空一字月五字後副頁黃道周隸書贊云豳風之亭觀彼穫者猗蘭之谷以求鄰雅淵哉聖思周念四野黃華始敷幽人則娛侣松友筠斗室歡呼閶闔閬風何繇曰都如或見之而稱華胥諒維聖人燭我海宇悅鳥鳴蟲各獲其所棗稻薁葵駢受天祜九閽之聽如婦子語於呼休哉生昌運時豳猗之餘復聞是詩風雲日星千春護之小臣黃道周前署崇禎十一年秋八月伏觀有識十三字畫幅高九寸二分廣一尺五分書幅高八寸四分廣四寸九分明陸治蔡羽書畫合璧一册上等元一宣德箋本右方陸治著色畫凡十幅左方蔡羽草書各體詩凡十一幅書畫相間畫末幅款識云啓之幸從林屋先生得詩十章豫乃圖之則又幸附啓之之册者也觀者不以象外求之則余之負林屋者多矣歲己亥三月陸治識下有陸氏叔平一印書第一幅前署山中送陳啓之六字後署蔡羽下有九逵一印第二幅前署登靈巗同啓之六字後署羽下有左虛子一印第三幅署潘修伯陳啓之秋日縹眇峯十一字後署羽下有元秀樓一印第四幅署四月寄啓之五字後署蔡羽下有南館一印第五幅第六幅署秋日啓之至京邸七字後署羽下有九逵一印第七幅署立秋日與啓之靜坐八字後署蔡羽下有左虛子一印第八幅署啓之折荷花至六字後署羽下有元秀樓一印第九幅署話别諸子月夜出于東城道十一字後署羽下有南館一印第十幅署都下送啓之五字後署蔡羽下有九逵一印第十一幅署秋盡虎邱四字後署蔡羽下有左虛子一印前副頁許初書厯示遊言四大字款識云嘉靖戊戌冬日許初為啓之題册計二十一幅幅高八寸三分廣九寸三分書畫合册次等明唐寅仇英畫前後遊赤壁二圖文徴明書賦一册次等天一首幅素絹本著色畫前赤壁圖款署蘇臺唐寅末幅素絹本著色畫後赤壁圖款云吳郡仇英實父製第二幅至第十幅灑金箋烏絲闌本行書前後二賦款署徴明前副頁徴明又隸書赤壁清遊四大字後副頁有文從簡跋一畫二幅書計九幅明董其昌書畫合璧一册次等地一前幅畫後幅雜書舊人詩詞書畫相間凡三十六幅畫幅第一幅素箋本著色畫款云倣大癡老人玄宰第二幅素箋本著色畫款云倣黃鶴山樵筆意玄宰第三幅素箋本墨畫款云雲林小景玄宰第四幅素箋本墨畫款云倣方方壺玄宰第五幅金箋本墨畫款識云仙巗圖乙亥秋仲玄宰第六幅金箋本淡著色畫款云仿子久溪山書屋玄宰第七幅金箋本墨畫款識云竒蹤祕千載一日敞神界玄宰寫淵明詩意第八幅素箋本墨畫款云倣李營邱筆其昌第九幅素箋本墨畫自識云寫米南宫但當以氣勝有吞吐千峯之勢第十幅金箋本墨畫自識云山川出雲為天下雨玄宰第十一幅素箋本著色畫自識云仿大年第十二幅素箋本墨畫自識云惠崇宋詩僧在巨然之前畫學王維特工妍麗如詩家溫李輩香奩集文生于情者東坡山谷嘗題其小景余所見有京口陳氏江南春卷及真