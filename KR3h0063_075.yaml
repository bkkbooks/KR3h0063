  text: 欽定四庫全書石渠寶笈卷三十六
  hash: sha256:2638f5adfa57d6e616bafb23ef18647a9905bb0faeaf50f65e44ebf249c9af7e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_075-1a, image: WYG0825/WYG0825-0429a.png}
body:
  text: 貯御書房九列朝人書畫合卷上等晋顧凱之畫女史針並書一卷上等天一素絹本著色畫凡八段每段節書本文款云顧凱之畫卷前有乾卦宣和御書三璽又神品子京父印項元汴印墨林祕玩張斌之印諸印又二印不可識卷後有廣仁殿宣和紹興𢎞文之印四璽又神品寄傲陸經國印張斌之印項元汴印墨林祕玩項子京家珍藏諸印各段中有睿思東閣璽凡五又墨林項氏子京讀志堂印南華外史項元汴印墨林祕玩項氏子京桃花源裡人家項墨林父祕笈之印項墨林子京父珍藏書畫之章墨林堂沮溺之儔子京珍祕有何不可項元汴印墨林山人墨林外史諸印後幅素箋本宋徽宗楷書女史針一則計十一行七十六字有桂坡安國鑒賞記張羽鈞二印又一印不可識前隔水有卷字七十號五字俱作半字下有政和一璽又天籟閣梁清標印項叔子宫保世家賓臣笪在辛博雅堂寶玩印檇李項元汴印鴛鴦湖長項子京家珍藏項墨林鑑賞章蘧廬田疇耕耨張則之諸印押縫有三槐主人項子京氏佳印思無邪諸印中隔水有內府圖書之印紹興二璽又天籟閣陸經筵印平生真賞楞嚴精舍項元汴氏審定真蹟檇李項氏世家寶玩項子京氏張則之項墨林鑑賞章蕉林玉立氏圖書秋壑圖書江上笪氏圖書印士竒印諸印又二印不可識押縫有羣玉中祕一璽又押字一印又項子京家珍藏墨林山人項叔子長字退密子孫永保賓臣神逰心賞宫保世家墨林子墨林山人子孫世昌諸印又一印漫漶不可識後隔水有梁清標印蕉林二印押縫有冶溪漁隱一印引首有游心於物之初净心抱冰雪二印拖尾項元汴篆書記語云宋祕府所藏晋顧凱之小楷書女史針圖神品真蹟明墨林山人項元汴家藏珍祕卷高七寸七分廣一丈八寸後書幅高同廣一尺四寸六分引首御筆書彤管芳三大字上有乾隆宸翰一璽御筆題籖籖上有乾隆宸翰一璽按書畫俱止八段似非全本疑前幅為賈人割去别售也晋顧凱之洛神圖一卷上等天二素絹本著色畫無款姓名見跋中卷前有松雪齊圖書印一印後隔水押縫有明昌御府寶繪羣玉中祕三璽後餘幅有明昌御覽一璽後幅素箋本趙孟俯行書洛神賦款識云顧長康畫流傳世間者落落如星鳳矣今日乃得見洛神圖真蹟喜不自勝謹以逸少法書陳思王賦於後以志敬仰云大德三年子昻下有松雪齊圖書印趙子昻氏趙孟俯印三印前有趙字大雅二印押縫有合同印凡二拖尾李衎跋云畫之有長康猶草書之有伯英楷書之元常發前人所未發開後人師承確乎三絶之一也是卷曾載宣和書譜鈐縫贉尾今止存明昌御府寶繪羣玉中祕明昌御覽四璽於後是又經金章宗祕藏而剪割宣政題璽者也何幸為敬仲博士所收敬仲鑑賞精絶收藏甚富名繪雖多吾固知其不能出此圖右矣敬仲其世寶之大德丁未秋九月薊邱李衎又虞集題云凌波微步襪生塵誰是當時窈窕身能賦已輸曹子建善圖惟數錫山人仙井虞集又沈度跋云晋人畫世不多見况烜赫如虎頭者耶觀其樹石竒古人物秀麗實開六法之祖譜稱天材獨步妙造精微雖荀衛曹張未足方駕洵不虛也永樂十五年修禊日雲間沈度謹識又吳寬題云仙妃不可即洛水遙相望手持青芙蓉逰戲水中央金翠耀容飾木難綴明璫飄颻白雲裾蕩漾青霓裳人神本殊道倐忽登北堂嫣然啓玉齒氣若幽蘭香馮夷與海若左右更舉觴洛水詎可測人壽安能量雲軿期再來少隔三千霜成化庚寅春三月長洲吳寬畫幅高八寸四分廣一丈七尺八寸七分書幅高九寸一分廣六尺二寸五分前隔水御題詩云賦本無何有圖應色即空傳神惟夢雨擬狀若驚鴻子建文中俊長康畫裏雄二難今並美把卷拂靈風乾隆辛酉小春御題下有幾暇臨池稽古右文之璽二璽引首御題妙入毫顚四大字上有乾隆宸翰一璽御筆題籖籖上有神品乾隆宸翰二璽宋蘇軾畫古柏圖張即之書畫松詩合卷上等地一素絹本前幅墨畫款署東坡作古柏圖六字後幅大行楷書唐杜甫畫松歌款識云張即之七十二歲寫時積雨連黴槐龍舞翠與客小飲醉中戲書下有張字張氏即之三印前有張字一印拖尾陳新跋云坡翁為宋朝名臣樗寮乃蓋世名士人間得其片紙隻字若獲至寶今東俞庭器先生購藏此卷柏圖松翰誠為合璧實希世之玩也庭器以豫言而惜之必有能辨之者時洪武壬戌花朝前二日後學陳新識又夏彥良跋云坡仙文章功績流傳後世不待僣言而熟聞之矣復能留心墨戲今觀此圖枝幹虬曲無端石皴老硬奇奇怪怪如胸中之盤欎也張即之號樗寮官至直祕閣以能書聞天下其字愈大愈佳後與金人書大金國三字故及上怒即之對以此國必有火不出一月果驗遂得釋庭器愛護此㢧雖結駟以先拱璧不易也幸珍藏之癸未夏四月六日東明夏彥良題於緑野亭中畫幅高一尺六分廣二尺六寸七分書幅高一尺六分廣三丈七尺三寸八分宋馬和之畫齊風圖一卷上等元一素絹本著色畫雞鳴子之還俟我於著敝笱載驅猗嗟凡六段每段前宋高宗書本詩書畫相間卷後有劉一真賞一印又一印漫漶不可識前隔水押縫有雲中一印後隔水有梁清標印蕉林二印卷高八寸二分廣一丈二尺二寸五分御筆題籖籖上有乾隆宸翰一璽宋高宗書小雅六篇馬和之繪圖一卷上等元二素絹本楷書著色畫書畫相間凡六段每段署篇名第一段南有嘉魚第二段南山有臺第三段蓼蕭第四段湛露第五段彤弓第六段菁菁者莪卷前署毛詩小雅四字下有梁清標印蕉林鑑定二印卷後有留侯半印前隔水有蕉林書屋一印後隔水有家在北澶蕉林祕玩二印押縫有蒼巗子一印拖尾文徴明跋云余平生所閲馬和之畫經無下數十卷若作家士氣兼備此六幅盡矣嘉靖丁未九月六日汝由奉使北還道出吳門持此相視漫為鑑定徴明後有蒼巗子蕉林居士觀其大略三印卷高八寸四分廣一丈一尺九寸八分宋高宗書小雅六章馬和之繪圖一卷上等元三素絹本楷書著色畫書畫相間凡六幅每幅署篇名卷前署鴻鴈之什毛詩小雅八字第一幅鴻鴈幅高七寸九分廣二尺四寸三分第二幅庭燎廣二尺第三幅白駒廣一尺九寸六分第四幅我行具野廣二尺五分第五幅無羊廣二尺四寸四分第六幅黃鳥廣二尺一寸高俱同前宋高宗書女孝經馬和之補圖二卷上等元四素絹本楷書卷首幅半印各一俱漫漶不可識下卷末幅有坤卦御書之寶二璽每段後馬和之著色畫補圖下卷末幅署臣馬和之四字微缺每幅有明安國玩一印上卷自開宗明義章起至賢明章訖下卷自紀德行章起至舉惡章訖書畫各九幅卷高八寸三分上卷第一幅廣三尺一寸六分第二幅廣二尺二寸三分第三幅廣二尺五寸第四幅廣二尺四寸八分第五幅廣二尺二寸第六幅廣二尺三寸二分第七幅廣二尺九寸八分第八幅廣三尺四寸第九幅廣四尺三寸三分下卷第一幅廣二尺九寸五分第二幅廣二尺六寸五分第三幅廣二尺八寸五分第四幅廣三尺八寸第五幅廣二尺三寸第六幅廣四尺一寸第七幅廣三尺第八幅廣三尺七寸二分第九幅廣三尺四寸二分元周朗畫杜秋圖一卷上等黃一素箋本前幅著色畫款署周朗伯高下有冰壺畫隱一印又浦江旌表孝義鄭氏一印又合同半印後康里巙行書杜牧之杜秋娘詩後識云至元二年歲丙子正月草四日氷壺為余畫杜秋娘遂書杜牧之之詩於其後二月十七日子山識後有仁義里白麟溪浦江旌表孝義鄭氏二印前有蒼巗子梁清標玉立氏印章一印又後有宋璲記云僕比留京師一友人酷嗜字學於是日相往來間取斫魚石樂毅論貽之未幾輒以此紙為報觀氷壺之畫全用篆籀法寫成至於體態俊逸處極類梵隆文忠公之書風神美茂腕力遒緊而行楷為尤勝識者謂得晋人筆意信二絶也僕攜歸浦陽青蘿山中同里鄭君仲辨見之愛賞弗置既而以情來求因不可得而靳也然莫邪干將獲歸烈士之手復奚憾哉洪武壬子正月草二日宋璲記又記云康里公或云諡文憲今當以史為正後有蕉林梁氏書畫之印家在北澶二印卷中幅押縫有安定印凡三前隔水有蒼巗子蕉林鑑定二印卷高一尺一分有竒廣八尺八寸五分元趙原初蘭亭圖一卷上等宇一素箋本白描畫畫中分段書蘭亭詩後自書和句並署趙𠂻和韻四字凡十三段卷前臨縮本蘭亭叙前後有清玩趙原初二印又前隸書署蘭亭觴詠圖五字自序云晋賢逰燕雖尚清虛而其君臣父子之道初未嘗廢世以獻之不賦詩固有高論余以獻之在諸子之末趨承父命惟恐不及雖有詠歌之懷豈暇形之於詞翰而實有所未敢也况𢋫唱迭和之道可以施之於親黨同志之文雅者而不可施之於父子之間古人父子不同席誠斯理也天理民彛又豈可以斯須而泯絶哉余臨龍眠居士觴詠圖約縮為小卷者故以獻之侍立於父之側尤見其雍容閒雅之氣象則又優於高坐之趣深矣觀此卷者毋以余臨摹繆戾於古人但以余言想像昔賢逰燕之所為自當有得於獻之不賦詩之深意矣余既臨觴咏圖蘭亭序又以所和諸賢之詩録於上庶以寄千載之遐思焉並書鄙言以為序趙𠂻原初書下有東吳野人主敬齊二印又考古正今傳世清玩二印卷後篆書欵識云東吳野人趙𠂻原初臨觴咏圖蘭亭敘並和羣賢詩時至正甲辰九月初二日識下有趙𠂻一印後又自題云蘭亭羣賢不復作山川清氣歸寥廓後人圖畫想像之文物衣冠儼如昨我和五言慕晋風繪事亦倣龍眠公摹書豈逮河南筆聊以規矩求其同晋賢清虛實高邁我愛風神本儒雅此身如欲與之俱觀圖哦詩特瀟灑當時盛事亦偶然豈意千載相流傳乃知清朝所涵養使我感慨懷昔賢驚颷颯颯動江浦木葉紛飛滿庭户閉門卷書净如水宴坐尸居守環堵鳳凰和鳴在朝陽梧桐生意依高岡臨風浩歌發長嘯回首落日天蒼茫十年韜光在林野文章翰墨消閒暇儘將情興寫新圖更為題詩寄來者東吳野人趙𠂻原初并題後有東吳野人趙𠂻趙原初主敬齊諸印前有趙字一印通幅有野人居一印天水印二趙氏印六清玩印五嘉興趙𠂻印六趙原初印五趙𠂻原初畫記印二又長宜天水隱居雲林清趣諸印前隔水有協一堂珍玩書畫圖章大塊假我以文章二印卷高五寸五分廣一丈三尺四寸九分引首御題山隂勝趣四大字款署御筆下有乾隆宸翰一璽御筆題籖籖上有御賞乾隆宸翰二璽元王冕畫梅趙奕書梅花詩一卷上等宙一素箋本前幅王冕墨畫題識云至正六年五月三日余偕永嘉鄭文中天台隱雲深逰赤松山道過龍壽覺慈蘭若㑹真叟師設茗供塵慮頓洗薄暮將訪智者故不得從容談笑借紙作墨梅一枝以謝桃花流水無半仙相見得無愧乎敢寫一絶句以贅經行枕流亭下過龍壽小溪一路行莓苔馮師說與赤松子只有青山知我來㑹稽王冕元章拜手下有元章一印幅後有蕉林一印後押縫有蒼巗子一印前隔水有蕉林書屋一印後幅趙奕行書前署梅花五十詠五字款識云至正五年四月一日古汴趙奕為殷起巗書下有趙仲光印西齊二印幅前有趙字西齊二印又許彥明圖書印一印前後押縫俱有冶溪漁隱印各一又一印殘缺不可識引首喬宇篆書梅花雜詠四大字款署白巗拖尾都穆跋云右元趙仲光所書梅詩今藏金陵許彥明氏仲光為文敏公次子觀其字畫宛然乃翁家法宜彥明之寶之也正德戊辰秋九月前進士吳門都穆又題句云仙人糧飯玉為餐隨地開花寄筆端爭奈西風吹不下至今聲價滿長安冕公梅得之楊補之千花萬蕊自不亂㸃前諸君子論字不知梅之妙也冕公豈為諸君子論字哉九里山此即歸隱處也後署柴翁當三字又戊寅時年七十紀事八字又黃謙跋云趙文敏以詞翰兼美擅譽當世仲光妙傳家法優入能品可謂善繼善學者矣梅花雜詠清淡古雅峻爽不羈足為世重彥明寶而藏之宜矣使其朝夕展玩想像其故家文獻之所以不乏者景行無巳而思齊焉亦君子學以成身之事若直求之於聲律筆畫之間以資玩好之具是亦奚足尚哉三復之餘是用卷鯨建業黃謙又陳沂跋云趙魏公書入神品至於夫人管氏子雍奕公之弟孟籲雍之子鳳麟皆以善書鳴元仁宗嘗取魏公與夫人雍之書作一卷識以御寶藏諸祕府使後世知有趙氏父子夫婦筆翰之妙意以自侈也余往年在金赤松家曾觀魏公十三書後有管氏孟籲書一卷在京師有貨魏公父子葡萄詩一卷在杭見雍父子書一卷又嘗有互見者其書品之高下大抵如其倫人有謂雍奕能亂父書蓋著筆意態不失家法耳若魏公之風神結搆如水中芙蓉天然標格非剪裁雕刻者所能亂之也今觀奕所書梅花五十咏雖不逮魏公逺甚而詩情筆態宛有餘澤若是亦可謂克肖者矣尚復過求哉彥明其藏之鄞陳沂題又顧璘跋云仲光書不多見然頗傳其善書名今觀此卷乃知其材品悉出魏公也可謂賢子矣名至今不泯有以也夫正德四年八月十九日東橋居士顧璘題又祝允明跋云魏公上祖王氏下托諸家以成體為元一代書宗自有公來學者多效之然每病乎易似而不真蓋乏其所自也今觀仲光筆亦已似近時人手路矣蓋髮膚之易而性氣風骨之難每如此夫然喬梓承襲之美甚重藏者其知之矣吳郡祝久明題又王韋跋云古來父子以書名者不啻數家如晋之王氏唐之歐陽氏元之趙氏為著然其家法規格皆同至其妙處皆子為不逮觀於此卷可見豈莊子所謂得之手而應之心雖父不能傳之子歟近世沈民則今金元玉家學皆然壬申閏五月七日葵邱王韋題又文徴明跋云趙仲光書雖不脫文敏家法而行墨結字微有不同王子敬云外人那得知要之不可臆論也今世傳文敏及仲穆書不少而仲光書獨不多見至其詩尤不易得金陵許彥明藏其手書梅花雜詠多至五十首可謂富矣仲光號西齊晚居吳中與崑山顧仲瑛交仲瑛稱其風流文雅有王孫風度而無紈綺故習觀於此詩有可想者文敏三子長亮次即仲穆名雍仲光其季也或以為次子豈以亮早卒無聞耶正德己卯秋留宿彥明之惟適軒雨中無聊因盡讀諸詩輒識其後八月初八日也衡山文徴明書又蔡羽跋云趙仲光之書初見於此卷其父子兄弟相傳之盛諸公已言不俟贅也而彥明堅委之夫家法盛者其傳必逺晋庾氏王氏可見矧松雪公酌諸家集大成首變宋字自為結搆元以來得見晋人法門公之力也仲光雖不逮公風儀宛然彥明善寶之吳郡蔡羽識又朱之蕃和詠梅詩云梅種江村玉作圍蓑披雪艇得魚歸不妨醉卧茆檐底清夢花間化蝶飛江梅素質氷心逈絶塵香魂搖月靜涵春清樽對月明窗啓子夜孤吟映玉人白梅赤龍潛影臥深潭宴罷仙娥酒欲酣可是停驂未歸去緑雲偏鬌墜瓊篸紅梅爐篆依微鶴夢閒瓶梅破萼識春還遙憐馬首香風度開遍江天雪後山憶梅蘧然身逐片雲浮信步俄經庾嶺頭童子褰惟呼嚼茗白瓷香泛小窗幽夢梅香來侵骨澗流清繞澗苔痕破獨行恐負幽期勞杖履一年春信正關情尋梅坐待歸鞭草色催一緘千里望君開窗前若解相思意未得身來遣夢來寄梅紅塵如海了難干巖谷盟深任嵗寒青鳯逐龍眠未穩玉鱗萬㸃灑琅玕竹間梅朱粉都捐别樣粧蕊珠宫裏按霓裳占將塵外千春色飄落人間萬斛香香梅休論月魄與雲魂一種清真萬古存雀噪寒溪驚幻夢飛英猶自繞柴門梅魂偃蹇懸崖衆玉龍春回一夜萬花同桃開莫訝三千嵗俄頃齊歸造化工蟠梅橫管中宵㺯未休亂隨融雪㸃新流只須醉月低垂幕何用臨風獨倚樓落梅春光泄漏有誰禁報道梅枝不待尋回首上林繞景物任教紅紫淺仍深早梅鐵幹珠英吐翠螺蒙葺巧叠蹙巾羅穠華莫怨開時晚低亞還知韻轉多千枼梅梅綻空庭薄暮天瑶霙寶月鬭鮮妍浩歌任客飛觥斚清興憐豫傲簡編庭梅培從畫閣占春光絶勝荒畦野水傍吏散亭閒吟緩步鳴琴調鶴聽微香官梅踞澗梅龍飲碧潺相將老屋寄巗間枝頭子落材堪棟榮瘁春風只等閒古梅梅開几席有餘清數蕊低枝無限情蒼璧硯池中弄影夜珠拳石上生明盆梅不忍攀條席每移詩脾香沁頓忘歸只愁風雨輕相妬㸃作苔間錦地衣愛梅翠葆朱跗半未開春晴猶得數徘徊鄰家莫奏風前笛野客頻傾月下杯賞梅寒林驀嶺轉溪深春隱梅梢未易尋醮影清流垂仄岸豁人青眼鬯元心探梅偏憐玉艷不勝春擬整重幃貯洛神青帝殷勤催爛漫留春須待惜花人折梅自釀幽香徹繡簾耻隨桃李弄柔纎供將騷客吟鬚撚賸得佳人翠袖沾嗅梅塵埃何得蔽瑤瓊旋噴玻瓈澗底瓶清露侵肌呈潤澤氷壺濯影倍輕盈浴梅空色須慿慧眼看披林冒雪不知寒三分遜白平章錯一氣同春天地寬觀梅春光來去恨匆匆未見梅開二月中訪得山家璀璨處半巗晴旭一溪風問梅不辭仄足履羊腸祗戀梅飄度隴香和雪嚼來神志爽依稀石髓薦瓊漿咀梅巡簷覔句費柔腸詩骨難成百鍊剛酒力半醒吟未穩月明風細立徊徨吟梅宴罷仙姝下太清雙成含醉倚飛瓊倩將水月留元賞影暗香踈浪得名下注又字亦咏梅也蒲芽欲茁雪融泥村店春風揚酒旗幾樹寒芳依曲水千枝明玉照疏籬溪梅根逐崖傾態轉多日穿峯隙影婆娑幽人䇿杖逢花發不醉爭如春去何嶺梅月印梅痕破暝昏衝寒有客到荒村看花不厭人忘寐沽酒何妨夜叩門野梅侵凌疏蕊渾無賴㸃綴喬柯若有神霽景恍從峰外出平添香色見天真雪梅春回大地逐葭灰浪說東皇許占魁一種寒香須自葆千林妖冶任爭開春梅老幹春滋翠蘚浮新枝影弄暖風柔狂吟醉藉苔根石千尺晴空舞玉虬苔梅窗前竹外一枝橫影落墻隂月倍明照我匡牀無長物蕭蕭正可伴孤清疏梅一樹寒梅擅晚芳野塘風度細生香琴書漫訝耽枯寂蜂蝶羞同競艷陽孤梅貝闕珠宫憶廣寒素娥環珮響珊珊輕飈為滌塵凡界玉樹玲瓏靜夜看月梅欲教梅影上窗移旋種橫斜傲雪枝䕃畝緣溪深繞屋荷鋤抱甕許誰知裁梅椒宫脂粉錦雲章千載芳華屬壽陽何似小橋流水外清風洗出道家粧宫梅美人幽抱立清宵白玉搔頭金步搖纎手攀花同一色盈盈相倚鬭丰標玉梅東風分與領韶華簷雀喧晴噪曉鴉碧玉成鱗留蛻骨明珠傾斛映窗紗緑萼梅丹霞白璧倚香肌濯影春池駐夕暉交頸漫將凡鳥擬同棲姑射欲翻飛鴛鴦梅看道枝稀蕊亦疏粉墻紛錯巧難模照巵拂砌知多少月冷雲孤半有無梅影黯淡芳魂何處求剡藤端澗為探幽江城五月添新漲屏掩梅仙枕碧流墨梅遁跡空林罷艷粧輕綃簇簇剪鵝黃氷霜上苑凋羣卉獨許擅心韜妙香蠟梅先春巳欲謝芳妍那值東風更放顛遲暮隂崖猶著蒂不禁消瘦尚蹁躚殘梅清溪蘸影盡梅花不數湖濱處士家巗壑窮搜遺佚者月明多處更添些移梅風遞幽香撲鼻聞山家清夢破梨雲虛堂不遣疏簾隔賔主渾忘我與君窗梅梅殘春老罷高吟豆實藏仁寄緑隂莫打鶯兒輕摘却生生總是惜花心青梅後識云萬厯三十五年丁未仲春十一日同顧鄰初丈飲許儒龍齊中出此卷縱觀之因屬追和原韻憶里中諸先逹賞閲時迄今又復百年乃得附名末簡良有原幸愧惡札俚言真成貂續姑以紀許丈世守之思云爾朱之蕃書又顧起元和云白下城西看打圍忽見江上早春歸岸邉幾片因風出水碧天青誤雪飛江梅盈盈一水不沾塵疏影輕翻縞袂春怪底月中看不見可知元是玉為人白梅瓊樹斜臨玉女潭霞姿微暈酒初酣花房宿露胭脂濕愁見風林雪滿篸紅梅嵗晚中林日月閒江南春信幾時還自從東閣飄香後夜夜相思繞碧山憶梅白雲飄眇駐羅浮月挂空村古樹頭鐵笛吹殘清夢逺瑶宫七十二峰幽夢梅百花潭水寒且清千峰凍雲人不行瑤華欲折渺何處來往幽巗無限情尋梅先春鶗鵙暗相催幽谷寒㽔幾樹開昨夜人歸庾嶺月一枝遙寄北風來寄梅葳蕤防露倚闌干掩映南枝素蕊寒不是風吹香氣合祇疑飛雪抱琅玕竹間梅奼女春臨青鏡粧紛披風捲素霓裳偏憐粉暈明如纈吹作瑤林樹樹香香梅蕊珠深殿鎖芳魂月下珊珊步幄存一曲關山招未得不知何處掩重門梅魂蟉枝弱蒂裊微風芳意誰言萬卉同猶有嵗寒孤性在不隨眠柳鬭腰工蟠梅琪樹西風撼未休玉房朝雨漾空流可憐金谷人先墜粉脆香危十二樓落梅樹樹風飄思不禁繁香翠羽未堪尋獨憐香信先時入星靨春藏繡幕深早梅軃軃瑤枝縈霧縠層層粉纈暈春羅臨風獨訝濃香重向月偏憐素影多千葉梅弱幹新粧倚暮天風前嫋嫋弄春妍何人共索巡檐笑獨向空庭擁斷編庭梅沉沉官閣斂寒光清吹春回曲檻傍可是後庭歌舞地年年先挹使君香官梅蒼山中劃水潺潺霜幹危欹萬壑間嵗嵗花開人自老長留清淺伴雲間古梅翠盆移值有餘清艷艷香飄散客情欲貌瓊姿何處是一窗疏影映燈明盆梅惜花那忍一花飛況復含芳雪際歸晝扃玉窗風不度恐飄香暈落春衣愛梅照日飄霜幾樹開清吟高咏共徘徊風吹粉蝶娟娟動爭入逰人緑酒杯賞梅姑射寒凝朔氣深白雲窈窕殢招尋枝頭似許偷春色青瑣分香夜夜心探梅玉樹臨窗不奈春風搖碧水淡風神不辭素手為攀折愁寄關山笛裏人折梅霏霏香散水精簾倚檻應憐玉手纎欲嗅一枝猶未折蕊宫清露已先沾嗅梅朔風昨夜透疏櫺含凍香凝玉膽瓶誰道江妃氷似骨華清新浴更寧馨浴梅千樹垂垂盡日看雪飛不度玉樓寒孤山一㸃西湖濶天豁幽人醉眼寬觀梅江妃幽恨苦匆匆十二巫山暮雨中試向南枝問消息幾回羯鼓閙春風問梅映日春回五色腸九英花發殿東香摘來試糝金莖露入咽還輸北斗漿咀梅嵗晏鬱鬱愁人腸仳離梅蕊隂風剛巫山嵯峨故園隔吟成雪樹空倣徨吟梅月滿空山露氣清新詩字字琢香瓊何人更咏孤山句贏得西湖處士名又暝壑隂風尚屢吹早芳偏得颭青旗沿溪樹樹花如雪倒載誰欹白接籬溪梅大庾山高瘴霧多嶺頭珠樹獨婆娑一枝欲寄憑誰折飄蕩春烟奈爾何嶺梅雲含暝色月華昏寂寂羅浮山下村飛盡玉鱗人不到孤烟一縷閉柴門野梅幾樹便娟怯傍春素華飄拂轉驚神搏香飛絮漫空落珠綴看來總未真雪梅春氣初飛玉琯灰一枝先占蕊宫魁上林如綺三千樹總向披香殿後開春梅枝上苔衣黯淡浮翻翻粉蝶戲春柔飛雲峰外羣仙集銀縷繽翻翳翠虬苔梅碧窗烟冷數枝橫歷歷光搖淡月明誰插繁花向晴吳最憐疏影對凄清疏梅霜葉參差委衆芳清飈零亂濕孤香亭亭玉立無人伴徙倚疏寮過夕陽孤梅香滿璇房夜不寒銖衣嫋嫋珮珊珊飛來海上氷輪潔共擬扶疏入鏡看月梅兔園物序早推移驚眼難忘白雪枝栽向臨風臺側畔可容幽艷翠禽知栽梅雲樹參差繞建章紅蕤披拂滿昭陽宫妃自厭鉛華色素靨惟施淺淡粧宫梅􅌑瓏素艷倚春宵月殿雲階影動搖不道藍田新琢就可令瓊樹失風標玉梅冉冉濃香結翠華曉看鬟黛濕宫鴉玉膚自畏春衣薄網户連娟映緑紗緑梅共憶同心上苑稀雙丹纈傾春暉氷魂豈妬青陵樹化作文鴛上下飛鴛鴦梅玉骨綃裳貌自殊幾枝低亞不堪模池邉清淺分明見檻外黃昏看却無梅影欲寫氷姿著意求臨池䑛筆意添幽袁郎宅畔烟迷户散作元香拂樹流墨梅㸃就含章殿裏粧可憐嬌額乍塗黃枝頭檀暈霏微合還似花房蜜滓香蠟梅濕雲不動雪姿妍急雨疏風滿樹顛飛蝶似憐春欲盡先拖花片舞蹁躚殘梅誰將却月觀中花移向山中處士家莫訝朔風吹雪易南枝春色露些些移梅翠鳥啼香院院聞歌塵先起畫梁雲碧紗不瑣春烟合明月飛來正憶君窗梅落花新動越人吟青子紛紛幕翠隂望處若能遙止渴也應撩亂惜花心青梅後識云仲光詩與字皆有魏公家法所謂王謝子弟縱復不端不正奕奕有一種風氣者也元人好作梅花詩馮海粟中峰道人多至百餘詠仲光豈僅得其十五耶中峰詩較仲光似饒情致余嘗與朱元介太史欲追和之未遑也此卷因許長卿出其曾大父攝泉先生所藏以示坐客因命之次韻元介一揮而就不啻超乘而上余視仲光瞪乎後矣詩屬和在丁未夏日余病腕痛孏作字卷留案頭凡十閲月今日閒坐齊中偶感梅花將放遂命筆復記數語如右萬厯戊申元日書於寸碧樓下小齊中江寧顧起元又題句云全拋塵土棄人間自種梅花自買山戲寫一枝羌笛外西風吹不到長安後署東道人三字後有蒼巗子觀其大略二印諸跋中押縫有冶溪漁隱一印河北棠村印二又逍遙逰安定二印畫幅高九寸六分廣二尺八寸七分書幅高同廣八尺一寸三分明沈周落花圖並詩一卷上等洪一畫幅素絹本著色畫後有石田沈氏啓南二印書幅素箋本行書落花詩十首款署長洲沈周下有啓南石田二印後文徴明和句十首亦行書款識云戊申六月書一過壁下有徴明一印引首沈周自書紅消緑長四大字款署沈周畫幅高九寸六分廣四尺三寸書幅高同廣一丈二尺九寸明唐寅夜飲圖並書歌一卷上等荒一素箋本前幅墨畫無款幅首有逃禪仙吏㑹侯之章二印幅後有公字信公珍賞湛恩記諸印前隔水有丹誠千山耿信公書畫之章二印押縫有漢水耿㑹侯書畫之章一印信公鑒定珍藏印二後隔水押縫有漢水耿㑹侯書畫之章一印信公鑑定珍藏印二㑹侯珍藏印二後幅行楷書款云前鄉貢進士吳郡唐寅書後有南京解元六如居士二印又㑹侯之章一印前署右作一年歌五字上有夢墨亭一印下有湛恩記一印中幅押縫有信公鑑定珍藏一印引首豐坊書摘竒二大字欵署南隅外史豐坊押縫有信公鑑定珍藏漢水耿㑹侯書畫之章二印畫幅高九寸七分廣二尺七寸九分書幅高同廣八尺明文徴明雪山圖並書一卷上等日一素箋本著色畫卷後行書雪賦款識云余早嵗曾見王摩詰雪溪圖筆法妙絶未嘗少忘每形諸夢寐幾欲模倣輒以事阻今日偶有佳紙漫用其筆法為之或作或止三載始就并書惠連此篇雖不能嫓美前人稍有生色處亦庶幾似人之喜也時嘉靖十八年歲在己亥夏五月十日長洲文徴明識下有文徴明印衡山二印卷前有晤言室印徴仲停雲諸印卷後有涵峰王履約印竹垞審定諸印拖尾記語云康熙三十四年二月晦吳江徐釚電發秀水朱彛尊錫鬯同觀於萱城給事之茹古樓卷高八寸一分廣一丈六尺二寸御筆題籖籖上有乾隆宸翰一璽明王穀祥摹趙孟堅水仙一卷上等月一素箋本前幅白描畫款識云嘉靖辛酉新正穀祥為玉田先生作下有穀祥王祿之印二印幅前有酉室一印幅後有蕉林玉立氏圖書一印前隔水有蕉林書屋蕉林鑑定二印後隔水押縫有秋碧蒼巗冶溪漁隱三印後幅文徴明行書水仙花賦款識云嘉靖乙卯春二月既望書於玉磬山房徴明下有文徴明印衡山二印前有停雲晤言室印二印幅後有蒼巗子蕉林居士二印押縫有河北棠村棠村蒼巗三印引首穀祥又篆書含香體素四大字款署穀祥下有王祿之印酉室二印畫幅高九寸一分廣四尺六寸書幅高同廣四尺明董其昌畫晝錦堂圖並書記一卷上等盈一素絹本前段著色畫款識云宋人有溫公獨樂園圖仇實甫有摹本蓋畫院界畫樓臺小有郭恕先趙伯駒之意非余所習兹以董北苑黃子久法寫畫錦堂圖欲以真率當彼巨麗耳董𤣥宰畫並題下有董其昌印一印前有畫禪一印後段行書晝錦堂記款識云蔡君謨歐陽永叔皆與吕申公相左石徂徠所為賦四賢詩者其直聲動天下已有日矣韓公晝錦記歐之文蔡之書雖繇魏公勳德世無間然假令出他朝士手不近於諛哉記中云士以此望於公乃歐公自占地步語不純以頌頌中有規施於韓公猶爾文人落筆何得容易此文既有君謨正書帖故以米行書之董其昌識於寶鼎齊下有𤣥宰一印前有元賞齊一印引首其昌自書晝錦堂記四大字欵署董其昌書下有董其昌印太史氏二印卷高一尺二寸七分廣四丈五尺四寸有竒書畫合卷次等唐閻立本畫十八學士圖于志寧書贊一卷次等天一素絹本著色畫每段楷書贊款識云龍朔二年春臣閻立本奉聖㫖圖像臣于志寧奉敕恭撰贊並書引首有沈括考證一則拖尾有朱光裔借觀尺牘一則又跋語一又韓持國諸人記語一又額森特穆爾諸人記語一又賈似道趙孟俯記語二宋李公麟九歌圖米芾書詞一卷次等地一素絹本白描畫每段米芾篆書本文卷首署九歌圖龍眠居士製八字卷末芾識云余嗜騷詞愛李畫癖不能解因用秦隸為述古書九歌述古善鑒者視斯起為余何如熙寧丁巳仲夏襄陽米芾記宋劉松年樂志論圖一卷次等元一素絹本著色畫款云劉松年造幅前有篆書樂志論三字後幅素箋本趙孟俯行書樂志論本文款識云元貞二年七月十日子昻書後有揭徯斯跋一明宋克書陶潛詩並畫竹石小景一卷次等黃一素箋本真行章草草書四體書卷前款云吳郡宋克書又行書一則下署宋克書後又識云庚戌九月僕來雲間寓於徐彥明氏彥明素慕僕書與僕盤桓甚久遂裝此卷徴書乃以真行章草草書四體録陶詩以為贈東吳宋克仲溫甫識卷後墨畫竹石小景自識云僕來雲間館徐彥明寓所日夕相與談笑幾踰四旬彥明酷愛鄙字乃以四體書陶靖節詩一卷餘紙尚多遂戲寫竹石小景僕素不精此聊復弄筆而塵俗之氣一洗盡去雖不入時流之目識者自能辨之庚戌九月草四日燈下東吳宋克仲溫記之又另行記云時年四十有四庚戌嵗也明仇英蘭亭修禊圖一卷次等宇一素箋本著色畫款云仇英實父製後幅文徴明行楷書蘭亭叙本文款識云嘉靖丙戌冬日書徴明明文徴明溪山高逸圖一卷次等宙一素絹本墨畫無款卷前有文徴明印停雲二印後幅素箋烏絲䦨本行書杜甫秋興詩款識云嘉靖乙卯八月十日書於停雲館徴明時年八十有六明文徴明西苑圖並詩一卷次等宙一素絹本著色畫幅後有文徴明印徴仲二印後幅素箋烏絲䦨本行書西苑詩并小序凡十則款識云嘉靖丙午嵗仲春衡山文徴明書於玉磬山房後有王錫爵王世貞徐中行諸跋明文徴明畫後赤壁賦圖一卷次等宙三素絹本著色畫款署徴明後幅烏絲闌行書後赤壁賦款識云徐崦西所藏趙伯駒畫東坡後赤壁長卷此上方物也趙松雪書賦於後精妙絶倫可稱雙璧余每過從輒出賞玩終夕不忍去手一旦為有力者購去如失良友思而不見乃倣佛追摹終歲克成并書後賦聊自解耳愧不能如萬一也昔米元章臨前人書畫輒曰若見真蹟慚愧煞人余於此亦云嘉靖乙巳秋九月十有二日徴明後有吳寬李東陽許初文嘉諸跋拖尾有王稚登跋一明文徴明陸治書畫合璧一卷次等洪一凡二幅後幅素箋本行書七言律詩三首款識云癸巳五月漫書於玉磬山房徴明前幅素絹本著色畫款識云嘉靖乙未春仲包山陸治補意引首陳淳書春在毫端四大字明董其昌書畫合璧一卷次等荒一素絹本卷前著色畫雲樹卷末行書唐人詩二則款云董其昌識明董其昌書畫合璧一卷次等荒二凡二幅前幅素箋本前楷書瘞鶴銘款識云黃涪翁云大字無過瘞鶴銘小字無過遺教經今世所傳遺教直唐經生手耳瘞鶴則陶隱居書山谷學之余欲縮為小楷偶失此帖遂以黃庭筆法書之昔人以瘞鶴為陶隱居書謂與華陽帖相類然華陽帖是率更筆文氏停雲誤標之耳後墨畫蕉山景款署𤣥宰後幅碧色箋本行書七言絶句五首款識云天啓三年嵗在癸亥十月書於東光道中董其昌石渠寶笈卷三十六
