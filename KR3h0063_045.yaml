front:
  text: 欽定四庫全書石渠寶笈卷二十一
  hash: sha256:7e5cbc4b311ff98a5aa257a8259ee5c515d633aa22b1788dafa986e6f372520a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_045-1a, image: WYG0825/WYG0825-0001a.png}
body:
  text: 貯重華宫二列朝人書册上等宋四家集册一册上等天一素箋本凡十幅第一幅第二幅蘇軾書第三幅第四幅黃庭堅書第五幅至第七幅米芾書第八幅至第十幅蔡襄書第一幅行楷書跋語一則欵識云元豐四年十一月二十二日眉陽蘇軾書幅前有蘇氏之印一印又項元汴印一印後有九如清玩也園珍賞天籟閣項子京家珍藏項墨林鑑賞章彭城陳氏子子孫孫永寶諸印幅髙八寸六分廣一尺八寸九分第二幅行書尺牘後署軾頓首再拜幅前有天籟閣青嵒鑑藏惟心淨土田疇耕耦項元汴印項墨林鑑賞章潤州笪重光鑑定印笪在辛笪重光印諸印後有兆睿青嵒江上外史子孫世昌山甫圖籍江上笪氏圖書印直指繡衣御史章重光陳定書印陳定平生真賞諸印幅髙八寸廣九寸五分第三幅山預帖無欵幅前有雙螭一璽下有江上笪氏圖書印張應甲印希逸氏清鑒堂圗書印諸印又重光司印半印二後有笪在辛笪重光印二印幅髙九寸五分廣八寸三分第四幅行草書尺牘後署庭堅頓首幅前後俱有緝熙殿寶一璽幅前又神品子京所藏平生真賞項墨林鑑賞章張孝思友古軒西江直指笪在辛潤州笪重光鑑定印黃琳美之項墨林父祕笈之印笪重光諸印又天籟閣李字墨林祕玩半印三又半印二不可識又幅後有江上笪氏圗書印張孝思項元汴印項子京家珍藏神品江上外史田疇耕耦張則之墨林山人平生真賞退密墨林子張孝思賞鑑印項叔子子孫世昌諸印又子孫宫保重光長字半印四幅髙八寸八分廣一尺三寸二分第五幅值雨帖後署芾皇恐頓首幅前有友古軒一印後有鄒式鑑印陸友之印二印又內府東字大雅半印三幅高八寸廣一尺二寸第六幅清和帖後署芾頓首幅前有神品項元汴印墨林祕玩張孝思張孝思賞鑑印田疇耕耦笪重光印諸印又江上子京永保半印三後有平生真賞江上笪氏圗書印張孝思退密虛朗齋項子京家珍藏項墨林父祕笈之印張則之干祿譙福慶吉祥諸印又神品香巖居士半印二又半印不可識幅髙八寸九分廣一尺二寸第七幅行草書尺牘前署芾頓首幅後有友古軒王承鼎印趙良佐氏柱國武靖侯印秋壑諸印又一印漫漶不可識幅髙一尺廣七寸九分第八幅行書尺牘後署襄上幅前有江上外史一印後有江上笪氏圗書印笪重光印兆睿青嵒復徴王孚張璂諸印又渤海半印幅髙八寸九分廣八寸八分第九幅行書尺牘後署襄頓首幅前有颻字小號又神品重光張孝思賞鑑印墨林子子敏干祿譙福慶吉祥張孝思桃里項元汴印項墨林鑑賞章諸印又退密寶玩印子章亭長半印四後有笪重光印寄傲子京所藏子孫永保張則之笪在辛江上外史神品張孝思天雞圓印會心處項子京氏墨林祕玩平生真賞諸印又友古江上笪氏句曲半印三又半印二不可識幅髙九寸七分廣一尺三寸第十幅行書尺牘後署襄再拜後有植庭清玩樂菴趙曦三印幅髙八寸二分廣一尺一寸第二幅第三幅第六幅俱有體元一璽第七幅又體元半璽聖祖仁皇帝璽也宋元寶翰一册上等地一凡二十二幅第一幅素絹本餘俱素箋本第一幅宋髙宗行楷書七言律詩一首後署賜億年三字上鈐御書之寶一璽幅前又親字小號又御書半璽又神品天籟閣桃里項元汴印子京珍祕項墨林鑑賞章吳廷私印諸印又半印四存裏人家寶玩印父印亭長諸字可辨後有若水軒虛朗齋項墨林父祕笈之印神品項子京家珍藏宫保世家長安諸印又退密檇李項氏半印二後邊幅董其昌跋云思陵書杜少陵詩趙吳興補圗乃稱二絶趙畫學王摩詰筆法秀古使在宋時應詔當壓駒驌輩為宗室白眉矣甲辰六月觀于西湖畫舫董其昌題有項墨林父祕笈之印宫保世家二印幅髙八寸四分廣一尺五寸一分第二幅楷書尺牘後署汴頓首後有植庭清玩東平二印幅髙九寸三分廣八寸九分第三幅行書尺牘後署舜民頓首幅前有張篤行印孫承澤印二印後有也園珍賞緯字印二印幅髙八寸三分廣一尺三寸四分第四幅行草書尺牘後署孝祥再行上問幅前有張篤行印珍繪堂記二印後有友古軒珍藏東平二印幅髙一尺一寸二分廣一尺三寸八分第五幅草書尺牘後署成大頓首幅前有孫承澤印一印後有張篤行印也園索氏收藏書畫二印幅髙九寸六分廣一尺三寸五分第六幅草書尺牘後署成大頓首成字缺幅前有友古軒張篤行印孫承澤印三印後有友古軒珍藏阿爾喜普之印二印幅髙一尺廣一尺二寸二分第七幅行書尺牘後署熹再拜上問上鈐熹字一印幅前有儒林世家克勤二印後有巘字退密項子京家珍藏三印幅髙八尺五分廣一尺七寸一分第八幅第九幅行書尺牘後署樓鑰劄子第八幅前有九如清玩一印幅髙一尺七分廣一尺二寸六分第九幅廣一尺一寸三分高同第十幅行草書尺牘欵署秀頓首再拜上呈幅前有李珂雪珍藏檇李李氏鶴夢軒珍藏記二印後有九如清玩一印後邊幅吳寬跋云周卿諱德文吾鄉王氏之先也仕宋雖不甚顯然其學實出于其曾伯祖信伯先生帖中所謂先著作是也故西山真先生特與之遊他如魏參政了翁遊丞相似杜丞相範王待制遂亦嘗舉薦陵陽李侍郎心傳因謂其所交皆天下正人然則此帖豈非其一左證也哉惟顒其善藏之吳寬謹題下有阿爾喜普之印東平二印幅髙八寸八分廣一尺四分第十一幅草書尺牘後署孟堅頓首上幅前有友古軒張篤行印二印幅髙七寸九分廣一尺三分第十二幅楷書小詞一首欵識云仲殊恭賦西江月詞攀送樞密太尉鎮錢塘伏惟采覽幸甚仲殊上幅前有御賜忠孝堂張篤行印珍繪堂記三印後有孫承澤印一印幅髙一尺二分廣一尺五寸六分第十三幅草書四言詩欵署玉蟾下有白玉蟾印一印幅前有子京所藏一印後有退密其烜寶玩青桐院印諸印幅髙七寸六分廣一尺六寸二分第十四幅草書七言律詩四首欵識云墨法四首録上南谷師一笑吳志淳下有曹南生一印幅後有吳志淳一印幅前又耿嘉祚一印幅髙九寸一分廣一尺八寸一分第十五幅行楷書七言律詩一首欵識云借謹齋髙韻為浩齋得子之賀春塘漫叟錢舜選拜手幅前有九如清玩一印後有友古軒樂菴二印幅髙九寸三分廣一尺五寸一分第十六幅行書五言古詩一首欵署白珽下有白珽廷玉一印又耿嘉祚一印幅髙七寸七分廣一尺第十七幅行書尺牘後署十二月空日契生朝奉大夫直徽猷閣知吉州節制軍馬兼江西提舉李河劄子三十字幅前有壬午西碧山房二印又琴式印一漫漶不可識後有友古軒李珂雪珍藏檇李李氏鶴夢軒珍藏記三印幅髙九寸七分廣一尺八寸第十八幅行草書尺牘後署康又上三字幅前有東平孫承澤印珍繪堂記三印後有張篤行印御賜忠孝堂長白山索氏珍藏二印幅髙九寸三分廣一尺三寸第十九幅行書尺牘後署六月空一字日表末周虎劄子九字幅前有也園珍賞一印幅髙一尺六分廣一尺四寸四分第二十幅行書尺牘後署修頓首幅前有雙桂方氏一印又心字半印後有也園索氏收藏書畫大千二印幅髙八寸七分廣九寸八分第二十一幅行書七言律詩一首欵識云清逺尊師相送至升山别後賦唐律一章兼寄懶菴用貞二上人聊寫越上相從之好吳中相會之情耳教正幸幸時至正甲辰良月十九日也契生陳修頓首再拜幅後有豐人季氏山水中人耿嘉祚三印幅髙九寸八分廣一尺四寸第二十二幅行書十六應真跋語一則欵云西岡無礙居士沈復書于陳氏竹所幅前有存存半印後有乾坤清氣字會侯嘉祚印耿嘉祚三印幅高八寸廣一尺五寸六分第七幅有聖祖仁皇帝朱書太平押字下有體元一璽第十三幅有精一一璽按第一幅宋思陵書杜甫暮春一詩董其昌跋有趙吳興補圗云云蓋當日尚有孟俯畫幅今逸去也元人法書一册上等元一素箋本凡十一幅第一幅草書唐人水簾洞詩欵云鮮于樞書下有鮮于一印幅髙一尺二寸廣八寸六分第二幅楷書凡五則第一則前署為張來儀賦匡山讀書處第二則前署賦潘公鳴皋軒俱五言古詩第三則前署馬國瑞東皋軒第四則前署次韻通書記同過鄭先生舊宅皆七言律詩第五則五言律詩前署贈郭本齋欵云瓚録呈大臨徴君併似德和郎官仲博廣文求教益幅前有項篤壽一印後有耿嘉祚一印幅髙七寸一分廣一尺七寸二分第三幅行書七言古詩一首前署晚節堂詩為竹洲仙母賦欵識云至正辛丑春三月十有二日鐵笛道人在清真之竹洲館試奎章賜墨書後有楊維禎亷夫鐵笛道人諸印又檇李項氏世家寶玩寄傲項叔子錫圭私印諸印幅前有九山白雲居一印又天籟閣項叔子周錫圭印清白傳家子孫永保項墨林父祕笈之印耿嘉祚項子京家珍藏諸印中幅有項元汴印項墨林鑑賞章二印幅髙八寸四分廣一尺七寸七分第四幅行書題畫七言絶句凡二則前則欵云前集賢待制馮子振奉皇姊大長公主命題下有海粟一印後則欵署趙巖下有魯瞻一印幅髙八寸七分廣一尺五寸三分第五幅行楷書題畫諸詩跋凡四則第一則跋語欵云奎章閣鑑書博士文林郎臣柯九思鑑定恭跋下有臣九思一印第二則七言古詩一首欵云侍書學士臣虞集奉敕題下有臣集一印第三則五言古詩一首欵云承制學士臣李泂奉敕題第四則七言律詩一首欵云奎章閣授經郎從仕郎臣揭徯斯奉敕題幅髙一尺三寸二分廣一尺七寸第六幅草書七言律詩一首欵云題同耕所張奎下有文石生一印幅髙八寸五分廣五寸六分第七幅行書七言絶句一首前署句曲外史賦聽泉亭絶句後署雨字上鈐句曲外史一印下有耿嘉祚一印幅髙九寸五分廣四寸六分第八幅行書七言絶句凡二則前則欵云方外張雨奉題下有張雨私印句曲外史二印前有退密翁澎元龍諸印又祕笈之印徹字世家半印三後有寄傲平生真賞項墨林鑑賞章諸印後則署臨川饒介下有五公世家一印前有袁忠徹印墨林山人二印後有半印二存子孫二字幅髙七寸九分廣一尺三寸三分第九幅行書七言律詩三首前序云虞山人勝伯陳山人唯寅皆為鄉里邂逅共飲問及仙逰事欲所賦詩未果寫既去僕已醉矣酒醒遂和以答二賢初意此凡四也十八日介録幅後有耿嘉祚一印幅髙七寸六分廣一尺五寸三分第十幅行書七言律詩一首前識云近體詩一首奉呈白雲堂上大和尚兼簡南峯天起禪友所有懷思之意具在乎辭流虹良琦九拜後識云至正庚子立秋後四日秋林仲立還山謹書以附行李下有良琦印龍門墅雪道者諸印前有復徴王孚二印幅前有遊戲三昧耿嘉祚新安吳廷釣雪灘上人諸印又祕笈之印半印幅髙八寸三分廣一尺六寸六分第十一幅行書七言律詩二首第一首前署至日遣興第二首前署即事欵云伯溫奉元懿貢元一笑幅前有耿嘉祚子長項篤壽印諸印幅髙八寸六分廣一尺九寸一分第一幅有康熙半璽元趙孟俯集册一册上等黃一凡十二幅第五幅碧箋本餘俱素箋本第一幅楷書畫跋一則欵識云大德八年春二月十四日吳興趙孟俯子昂後有趙子昂氏一印又後記語云皇慶元年十二月甲申員嶠真逸河東李倜獲觀又張紳觀于玉山草堂記語八字幅髙八寸七分廣一尺三分第二幅行書尺牘後署孟俯頓首上鈐趙孟俯印一印後有許志古許氏二印幅前半印不可識幅髙六寸三分廣九寸四分第三幅行書李白峴山詩欵署子昂下有趙氏子昂一印又王掞字藻儒號顓菴又號復軒一印幅髙七寸八分廣二尺一寸第四幅至第九幅皆行書尺牘第四幅後署孟俯頓首上鈐趙氏子昂一印下有