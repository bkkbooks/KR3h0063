天二璽後副頁自跋云國家重熙纍洽受天申命皇上體上聖之姿纘承鴻業宵旰懋勤是以精誠感格疊致嘉祥遐稽史牒罕有比倫在皇上聖不自聖歸美前猷而臣子生逢盛際目覩休嘉踴躍慶幸頌揚之誼胡能自己皇四子粹質性成加以勤學不怠寢門侍膳之餘恭列連歲諸祥撰成九符一篇凡一千九百二十言宗萬侍直內廷幸獲觀覽竊見炳炳琅琅援引該博詞采蔚然上追虞廷復旦之歌周室嘉禾之什漢唐以下所稱芝房寶鼎白麟赤雁以及鮑昭河清之頌魏徵醴泉之銘皆不足言也夫雅頌之音宜被諸金石用垂不朽矧鴻篇出於帝胄度越恆流尤為盛事斯亦文章之上瑞也夫雍正十年十有一月鴻臚寺少卿勵宗萬謹跋并書册計十頁石渠寶笈卷二十一
