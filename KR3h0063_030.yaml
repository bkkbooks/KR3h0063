  text: 貯養心殿列朝人書畫書卷上等唐閻立本畫蕭翼賺蘭亭圖唐孫位髙逸圖五代胡瓌畨馬圖宋徽宗四禽圖宋徽宗御河鸂鶒圖宋徽宗十八學士圖宋郭忠恕摹輞川圖宋孫知㣲江山行旅圖宋燕肅春山圖宋李公麟輞川圖宋李公麟畫唐明皇擊毬圖宋梁師閔蘆汀密雪圖宋楊補之雪梅宋馬和之畫召南八篇宋馬和之畫鄘風四篇宋李唐長夏江寺圖宋李唐畫晉文公復國圖宋李嵩畫錢塘觀潮圖宋馬逺松泉居士圖宋馬逺四皓圖元趙孟頫水村圖元趙孟頫蘭蕙圖元趙孟頫管道昇趙雍木石蘭竹合卷元管道昇叢玉圖元管道昇碧琅菴圖元趙雍畫馬元髙克恭夜山圖元黄公朢江山勝覽圖元黄公朢溪山雨意圖元王䝉仙居圖元倪瓚獅子林圖元趙元剡溪雲樹圖明王􅌧湖山書屋圖明夏㫤竹泉春雨圖明沈周臨錢選忠孝圖明沈周春郊散牧圖明吕紀蘆㕍明趙汝殷風林羣虎圖明唐寅畫毅菴小照明唐寅溪山漁隠圖明唐寅事茗圖明仇英漢宫春曉圖明仇英列女圖明文徴明畫松明文徴明真賞齋圖明陳栝三友圖明宋旭沈俊山水合卷明許邦本摹輞川圖
