body:
  text: 渠寳笈卷三十三目録貯御書房六列朝人畫卷上等元趙孟頫鵲華秋色元趙孟頫浴馬圖元趙孟頫甕牖圖元錢選觀梅覔句圖元王振鵬龍池競渡圖元顧安風雨竹元王䝉太白山圖元呉鎮山水元王冕雪梅圖元姚廷美有餘閒圖元王庭吉凌波圖明宣宗花鳥圖明冷謙蓬莱仙奕圖明徐賁仿巨然惠崇二家筆意明王紱萬竹秋深圖明王紱萬竹秋深圖明王紱畫竹明陳叔起王紱合作瀟湘秋意圖明邉景昭胎仙圖明姚公綬梅花明人上方石湖圖詠明沈周溪山茒舍圖明沈周法宋人筆意明沈周仿巨然山水明沈周林壑幽深圖明鄒衡緑香泉圖明唐寅春風酒盞圖明仇英赤壁圖明文徴明三友圖明文徴明秋林飛瀑圖明文徴明滸谿草堂圖明陳淳擕琴圖明陳淳冩生花卉明陳淳冩生明陳淳花卉明陳栝冩生游戱明陳樾冩生花卉明錢榖芙蓉湖贈别圖明王榖祥冩生明謝時臣山水明陸治蘆雁冩生明項聖謨松風圖明孫克宏文窻清供圖明孫克宏寫生花卉明孫克宏冩生花卉明周之冕百卉圖明陳粲冩生花卉
