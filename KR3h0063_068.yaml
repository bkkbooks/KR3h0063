body:
  text: 渠寶笈卷三十三目録貯御書房六列朝人畫卷上等元趙孟俯鵲華秋色元趙孟俯浴馬圖元趙孟俯甕牖圖元錢選觀梅覔句圖元王振鵬龍池競渡圖元顧安風雨竹元王䝉太白山圖元吳鎮山水元王冕雪梅圖元姚廷美有餘閒圖元王庭吉凌波圖明宣宗花鳥圖明冷謙蓬萊仙奕圖明徐賁仿巨然惠崇二家筆意明王紱萬竹秋深圖明王紱萬竹秋深圖明王紱畫竹明陳叔起王紱合作瀟湘秋意圖明邉景昭胎仙圖明姚公綬梅花明人上方石湖圖詠明沈周溪山茒舍圖明沈周法宋人筆意明沈周仿巨然山水明沈周林壑幽深圖明鄒衡緑香泉圖明唐寅春風酒盞圖明仇英赤壁圖明文徴明三友圖明文徴明秋林飛瀑圖明文徴明滸溪草堂圖明陳淳擕琴圖明陳淳寫生花卉明陳淳寫生明陳淳花卉明陳栝寫生游戲明陳樾寫生花卉明錢榖芙蓉湖贈别圖明王榖祥寫生明謝時臣山水明陸治蘆雁寫生明項聖謨松風圖明孫克宏文窗清供圖明孫克宏寫生花卉明孫克宏寫生花卉明周之冕百卉圖明陳粲寫生花卉
