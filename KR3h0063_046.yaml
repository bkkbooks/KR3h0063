body:
  text: 貯重華宫三列朝人書畫畫册上等歷代名繪紈扇畫册集古圖繪明項聖謨寫生明人畫扇集册明人畫扇集册明文氏畫扇集册畫册次等名繪薈萃集古圖繪歷代名繪宋徽宗花鳥寫生厯代集繪名畫薈萃厯朝名繪明仇英花鳥明陸遠摹古無名氏書畫畫册次等宋人歷代琴式歷朝名人圖繪歷代畫幅集册紈扇集錦紈扇畫册宋元紈扇畫册明人倣宋元諸家山水明人百獸率舞圖刻絲畫册上等附鏤繪集錦
  hash: sha256:6e5437e4372bccc806ff76f03cdac12ef14949aad84b4d58f2714e65ec7c093c
