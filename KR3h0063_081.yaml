front:
  text: 欽定四庫全書石渠寶笈卷三十九
  hash: sha256:b75934e47562047695c39d6b718cfe59ed16f4ca1715c72ad1d5ea7239831729
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_081-1a, image: WYG0825/WYG0825-0508c.png}
body:
  text: 貯御書房十二列朝人畫軸次等唐戴嵩春林放牧圖一軸次等天一素絹本著色畫款署戴嵩五代黃筌長春竹雀一軸次等地一素絹本著色畫款署黃筌五代黃筌久安圖一軸次等地二素絹本著色畫款識云太平興國二年黃筌謹製宋徽宗錦雞芙蓉圖一軸次等元一素絹本著色畫款題云秋徑拒霜盛峩冠錦羽雞已知全五德安逸勝鳬鷖下識云宣和殿御製並書又押字一宋許道寧關山密雪圖一軸次等黃一素絹本著色畫款云許道寧學郭咸熙關山密雪圖宋崔白蘆雁一軸次等宇一素絹本著色畫款署濠梁崔白左邊幅有孫承澤題句一宋張擇端春山圖一軸次等宙一素絹本著色畫款署張擇端詩塘有俞允文識語一宋馬和之柳溪春舫圖一軸次等洪一素絹本著色畫款署和之宋李迪三顧圖一軸次等荒一素絹本著色畫款署李迪詩塘有方孝孺題句一宋林椿花鳥圖一軸次等日一素絹本著色畫款署林椿宋蔡京環翠圖一軸次等月一素絹本墨畫款云尚書右僕射臣蔡京謹進上方署環翠圖蔡京筆六字後有宣和璽詩塘有記語一則未署名元趙孟俯窠木竹石一軸次等盈一素絹本墨畫款署子昻右方上跋語一署疇齋二字下有倪瓚跋一元錢選秋葵一軸次等昃一素箋本著色畫款題云金杯傾側粉垣空筆意經營慘淡中仙掌有人擎露重不知浮世幾秋風錢選舜舉元錢選觀梅覔句圖一軸次等昃二素箋本著色畫款題云山童野鶴伴吟身結托梅花作子孫要看先生衣鉢處暗香疏影月黃昏霅溪錢舜舉畫並題元商琦溪亭坐隱圖一軸次等辰一素箋本墨畫款云溪亭坐隱商琦寫意元方方壺高高亭圖一軸次等宿一素箋本墨畫款識云李君子高昔於南谷丈人坐上會之今不遠百里求余圖此已三年矣醉後縱筆寫之如此方方壺右方上有隸書高高亭圖四字元柯九思畫梅一軸次等列一素絹本墨畫款云奎章閣博士丹邱生柯九思元王蒙松山書屋圖一軸次等張一素絹本淡著色畫篆書款識云松山書屋至正九年八月香光居士王蒙寫元王蒙劍閣圖一軸次等張二素箋本著色畫篆書款云劍閣圖黃鶴山樵王蒙畫元王蒙溪山高逸圖一軸次等張三素絹本著色畫款云叔明王蒙為菊窗琴友製圖詩塘有李茀李嗣賢題句二左邊幅有董孝初孫孟芳二跋元王蒙桃源春曉圖一軸次等張四素箋本著色畫款題云空山無人瑶草長桃花滿缺一字流水香漁郎短棹花間發兩岸飛飛散香雪花飛煙暝正愁人一溪緑水流明月明月團團如有意春夜沉沉花下宿月明風細衾枕寒天風吹珮玉珊珊白雲洞口千峰碧流水桃花非世間洪武唐缺一字春二月黃鶴山樵王蒙畫桃源春曉圖元王蒙層巒聳翠圖一軸次等張五素箋本著色畫篆書款識云至正元年三月望日寫黃鶴山樵王蒙元吳鎮松下扶笻圖一軸次等寒一素箋本墨畫款云梅道人戲墨元盛懋柳隂書屋圖一軸次等來一素絹本著色畫款云盛懋作元盛懋授經圖一軸次等來二素絹本著色畫款署盛懋明憲宗嵗朝佳兆圖一軸次等暑一素箋本著色畫款識云成化辛丑文華殿御筆右方上題云一脈春回暖氣隨風雲萬里值明時畫圖今日來佳兆如意年年百事宜前署柏柿如意四字明冷謙山水一軸次等往一素箋本墨畫款題云挂冠北闕已多年喜放篔簹構數椽蘆葦老長方織壁茆茨不剪任齊簷採薇製就為茶供汲瀑調羮勝酒泉縱目大觀巔頂上歸來滿袖白雲還至正癸未秋與劉伯溫訂朝白嶽泛艦溯流由桐江經嚴臺之睦州路聞水砰砰心懷駭駭轆轤而上於萬山之中至時已十有七天星月矣歷階而升幾十里始得睹一天門參謁聖像眺玩山川步壺天五老峰仙洞珠簾遠映瘦僧異獸岌而參天穿雲森森而列前詢及鄉人答以黃山計一日程可至其間於是乘興悠逺見怪松竒石巍峩峭壁飛溫泉丹臺鼎圶猿吟鳥語留我心身過我神思援蘿及巔長江一線金陵瞭然南北無幾四隅八荒悉障目前而劉曰冒誤入仙山也吟咏不已於是強余模寫余亦勉塗黃冠道人冷謙作併題於硃砂菴又劉基題句一張居正贊一按題句中字多誤蓋臨本也明王紱古木竹石一軸次等秋一素箋本墨畫款云九龍山人王孟端寫上方有王汝玉王達善題句二又題句一署用行二字明王紱溪亭高話圖一軸次等秋二素箋本墨畫篆書款云九龍山人王孟端寫明王紱松亭高士圖一軸次等秋三素箋本淡著色畫無款左方下有孟端一印明姚綬竹石一軸次等收一素箋本墨畫款題云寫竹任濃淡似分新舊枝驪黃與牝牡自不許誰知欲得髯高問豫生亦後時雲東逸史姚公綬畫並題明姚綬寒林讀書圖一軸次等收二宣德鏡光箋本墨畫款識云雲東逸叟姚綬為彥成高士戲作寒林讀書圖辛丑九月二日明吳偉歌舞圖一軸次等冬一素箋本墨畫無款右方下有小仙吳偉一印上方有唐寅祝允明題句二又題句四無名署云金庭居士九華遺士七一居士髯九翁明沈周秋林讀書圖一軸次等藏一素箋本墨畫款題云山迥煙雲重門間草木深讀書不出户誰識道人心辛亥孟秋草日沈周寓雙蛾僧舍畫並題明沈周參天特秀圖一軸次等藏二素箋本墨畫款題云我聞東海醫巫閭山中有樹青瑶株參天直上有竒氣文章滿身雲霧俱無雙自以國士許況是昔時稱大夫人間草木各適用大材必待明堂須嗚呼大材必待明堂須不與榱桷論區區獻之劉先生遼陽材士來吳與余識於姑蘇臺因寫參天特秀圖侑詩贈之己亥沈周又識云豫作是障子於己亥逮今乙巳凡七寒暑蓋以松為材木以其材擬獻之之材也獻之謙不自擬而轉贈陳君鳳翔鳳翔常熟材士為士林之喬木則豫之誦於松者前言盡之矣兹不復贅長至日長洲沈周重題明沈周山水一軸次等藏三素箋本著色畫款題云不到天平經二載每于圖畫寫遺蹤何時倚杖尋春樂坐看松頭萬笏峰沈周明沈周蒼崖高話圖一軸次等藏四素絹本墨畫款題云長松落落不知暑高坐兩翁無俗情琴罷清談猶半餉不妨新月印溪明長洲沈周明沈周聽松圖一軸次等藏五素箋本淡著色畫款題云風送濤聲帶草香溪山深處任疏狂放開雙眼乾坤外看遍浮雲空自忙辛酉暮秋畫並題長洲沈周明沈周策杖圖一軸次等藏六素箋本墨畫款題云山靜似太古人情亦淡如逍遙遣世慮泉石是安居雲白媚崖客風清筠木虛笠屐不限我所適隨邱墟獨行固無伴微吟韻徐徐沈周明唐寅芙蓉一軸次等閏一素箋本著色畫款題云拒霜花綻秋風落緑水紅橋畫閣前何物將來堪領略金杯檀板小詞篇唐寅為南谷趙君寫明唐寅洛神圖一軸次等閏二素箋本墨畫款題云鼎湖舊有駕魚仙一住人間八百年珮紉芙蓉蓮貼步輕風吹到壽尊前唐寅明唐寅山茶仕女圖一軸次等閏三素絹本著色畫款署唐寅明文徴明春雲出山圖一軸次等餘一素箋本墨畫款題云春雲半出山突兀春樹亂搖風雨來誰識杜陵新句法浣花溪上草堂開徴明明文徴明雪滿羣峰圖一軸次等餘二素絹本著色畫款題云雪壓溪南三百峰溪流照見玉巃嵸等間十里溪山勝都落高人跨蹇中徴明明文徴明溪山秋霽圖一軸次等餘三素絹本著色畫款題云最愛吳王銷夏灣輕橈短楫弄潺湲涼風數點雨餘雨落日千重山外山徴明明文徴明蒼巗漁隱圖一軸次等餘四素絹本著色畫款題云蒼巗千尺鎖煙霞雞犬漁梁隔隱家何處流來春水遠自停蘭棹看飛花徴明明文徴明倣董源林泉靜釣圖一軸次等餘五素箋本墨畫款識云嘉靖丙申仲夏日徴明仿董北苑林泉靜釣圖明文嘉聽泉圖一軸次等成一素箋本淡著色畫款題云仲宣故宅生春草千古高風愧鹿門今作小堂巢翡翠依稀水竹峴南村己卯三月為雁村兄作文嘉明陳惠梅花一軸次等歲一素箋本墨畫隸書款題云花間少女剪春寒燦燦霓裳舞隊仙夜月遙看環珮冷莫教吹落玉花鈿陳惠明陳淳赬榴蒼石圖一軸次等律一素絹本著色畫款題云晝長添午倦洗硯獨臨池何物醒吟目葵榴正及期道復明陳淳畫桃花一軸次等律二素絹本著色畫款題云江南春雨足杏子正開花茆屋青簾下遙知是酒家道復明孫啓畫梅一軸次等吕一素絹本墨畫款署雪軒明王問雙鴛圖一軸次等調一素絹本著色畫無款右方下有仲山王問一印明陸師道攜卷對山圖一軸次等陽一素箋本著色畫款題云紅塵擾擾滿人間十日應無一日間羡殺茂林蒼壁下獨攜書卷對青山嘉靖甲辰臘月師道作明謝時臣夏山飛瀑圖一軸次等雲一素箋本淡著色畫款云夏山飛瀑樗仙謝時臣寫明謝時臣林巒秋霽圖一軸次等雲二素箋本墨畫款云林巒秋霽姑蘇謝時臣作明陸治仿王蒙還丹圖一軸次等騰一素絹本著色畫款識云余少師黃鶴山樵頗亦窺其蹊徑後以草草漫應久不為之蓋山樵筆意古雅多蕭間林壑之趣非澄懷弄筆罕臻其妙嘉靖戊申之秋山居纍月悠然有山樵之思遂作此幅雖筆墨蒼老差勝于前而山樵之意失亦多矣使觀者求之驪黃之外未必無所取也后一年己酉秋日包山陸治識明陸治仙山玉洞圖一軸次等騰二素絹本著色畫款題云玉洞千年祕溪通罨畫來元中藏窟宅雲裏擁樓臺巗竇天光下瑶林地府開不須瀛海外只尺見蓬萊張公洞作包山陸治明徐渭牡丹一軸次等致一素箋本墨畫款題云醉餘灑墨暮窗涼竹下花枝艷洛陽共指蕭娘騎鳳去翠裙拖處尾偏長大環明項聖謨山水小景一軸次等雨一素箋本著色畫分三幅上幅款書云山晚黃雲合項易菴作中幅款書云地僻秋將盡山高客未歸項孔彰下幅款書云古廟松杉巢水鶴易菴明項聖謨菊花竹石一軸次等雨二素箋本墨畫款題云秋光何潔尚遲霜新酒煨成百草香意在臨池猶未飲黃花先我醉重陽項聖謨筆明顧正誼溪山秋爽一軸次等露一素箋本淡著色畫款識云萬歷乙亥秋日仲方顧正誼左方上有高士竒題句一明趙左秋山紅樹圖一軸次等結一素絹本著色畫款識云萬歷辛亥秋九月華亭趙左倣唐人楊升畫上方有董其昌跋一明趙左寒江草閣圖一軸次等結二素絹本淡著色畫款識云五月江深草閣寒乙卯夏日趙左明周之冕枇杷珍禽一軸次等為一素絹本著色畫無款左方中有之冕之印一印明周之冕花竹鵪鶉一軸次等為二素絹本著色畫款云汝南周之冕寫上方有范允臨陳繼儒朱之蕃董其昌左方有文震孟薛明益嚴澄杜大綬諸題句明尤求山水人物一軸次等霜一素箋本墨畫款云長洲尤求製明李士達瑞蓮圖一軸次等金一素箋本著色畫款識云萬歷丙午仲夏九芝先生山池中碧蓮一幹成兩花色貌種種可人此佳兆也余不善花枝遂敢戲圖以志瑞李士達明王中立花鳥一軸次等生一宣德箋本著色畫款識云天啓元年二月既望王中立寫于訪雪航中明董其昌畫王維詩意圖一軸次等麗一素箋本墨畫書閉户著書經歲月種松皆作老龍鱗二語款識云元宰丙寅六月畫前署右丞詩意四字又題云青林鬱蒙茸長松度林表所以蔣生徑無竹亦自好余題畫舊作與此圖境界復相似元宰重題明陳繼孺倣倪瓚山水一軸次等水一宣德鏡光箋本淡著色畫款云倣雲林筆意眉公明倪元璐朱竹一軸次等玉一素箋本研硃畫款題云今朝正是天中節不寫鍾君寫此君贊曰碧其骨丹其色問君何為近朱者赤崇禎己卯蒲月元璐醉筆右方中有陳子龍跋一明王綦東籬秋色圖一軸次等出一素箋本著色畫款識云丙寅秋日王綦明張宏倣陸治茶花水仙一軸次等崑一素絹本著色畫款識云天啓丙寅季冬仿包山翁筆張宏明楊文驄溪山訪友圖一軸次等岡一素箋本墨畫款識云癸未夏避暑山中修篁古木炎蒸不至朝來跂腳北窗流泉入耳白雲滿目覺荆關董巨真本自呈于前人間粉墨恐未必有此靈幻也架上舊楮弄筆偶摹其意所謂獨師造化為真得不向荆關乞唾餘者也楊文驄並記明陳洪綬花蝶寫生一軸次等劍一素絹本著色畫款云洪綬畫於靈鷲精舍明陳洪綬瓶花一軸次等劍二素絹本著色畫款識云溪山老蓮洪綬畫於無見閣明陳洪綬梅花一軸次等劍三素箋本淡著色畫款云老遲洪綬畫於柳莊明陳嘉言時時報喜圖一軸次等號一素箋本墨畫款識云時時報喜圖戊午春日寫於墨寶齋中八十叟陳嘉言明吳令棠上白頭圖一軸次等巨一素箋本著色畫款識云己丑小春俊明親丈索為振玉先生韭溪老人吳令明張寧歲寒三友圖一軸次等闕一磁青箋本泥金畫款題云萬紫千紅委路塵蒼筠白石自為鄰蕭條落日空林晚寂寞東風野水春九畹廢來猶有賦三閭去後更無人繁華到處笙歌滿回首江臯夜月新方洲張寧題右方署恩深雨露四字明俞笙花鳥一軸次等珠一素絹本著色畫款署四明八十山人俞笙明王時敏松巗靜樂圖一軸次等稱一素絹本著色畫款識云辛亥秋日寫為淡翁老親臺西廬老人王時敏前隸書松巗靜樂四字明史端木倣黃公望山水一軸次等夜一素箋本著色畫款題云平生落魄放江鄉詩酒為期作醉狂寫幅雲煙消白晝得些風月缺一字紅粧天真自不知工拙理性從人較短長卻有南宫能鑒賞時人幾個識蘇黃金臺楊天澤過癡樓談及乃兄天德知癡之為人能鑑癡之拙筆可為米南宫能鑒賞也因作此以贈之江東癡史寫缺二字十七年歲缺一字子立春後一日也明僧志中枯木竹石圖次等光一素箋本墨畫款題云古木作禪意青山淡若愚秋風蕭瑟處應許質倪迂志中前有魏之璜鄭重二題句石渠寶笈卷三十九
