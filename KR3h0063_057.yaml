  text: 欽定四庫全書石渠寶笈卷二十七
  hash: sha256:cf612ef2c2e293b1f463becfd8e31734d58c7d3e7aab5ea1eb8670277de2b49b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_057-1a, image: WYG0825/WYG0825-0125c.png}
body:
  text: 貯重華宫八國朝人畫軸上等惲夀平五清圖一軸上等天一素絹本墨畫水月松竹梅欵識云辛酉初秋南田夀平製下有惲正叔夀平二印前署五清圖三字下又自識云畫有髙逸一種用筆之妙如蟲書鳥迹無意為佳所謂遺筌捨筏離塵境而與天游清暉淡忘不可以言傳矣夀平識下有南田草衣一印軸髙二尺六寸八分廣一尺二寸惲夀平枯木竹石一軸上等天二素箋本墨畫欵題云竹影滿忩凉似水斷崖踈雨數竿秋雲溪外史下有雲衣居士夀平二印右方下有錬雪鑑定一印左方下有松喬堂書畫印一印軸髙二尺五寸二分廣一尺一寸四分王翬平林散牧圖一軸上等地一素絹本著色畫欵識云文湖州平林散牧圖唐解元有橅本致佳因仿之康熙歲次壬午小春望日耕烟外史王翬下有王翬之印石谷子二印前有海虞一印右方下有滄江白髮耕烟外史時年七十有一二印軸髙二尺六寸六分廣一尺七寸五分王原祁秋山圖一軸上等元一素箋本著色畫欵識云康熙壬午長春仿黃子久秋山于京師邸舍婁東王原祁後有王原祁印麓臺二印前有古期齊一印左方下有興與烟霞㑹一印軸髙二尺三寸二分廣一尺二寸八分上方張照書御題詩云三庚無那暑氣炎紗櫺八面開書室吟哦靜裏遣小年左圖右史陳無逸挂壁吳綾裝尺幅本朝作者麓臺筆規模唐宋弱元明胸中自有天然質一川平逺萬里空插天青嶂髙無匹尤愛老松巖腰出羊腸難上疑盩厔溪亭對此聽飛濤蒼石白泉復澎泌如是坐觀兼臥遊觀遊兩忘三即一滿座清凉似作秋梧梢輕籟飄瑟瑟不知題句者為誰長掇菁芬消永日乾隆御題臣張照敬書下有臣照聨印王原祁虞山秋色圖一軸上等元二宣德箋本著色畫欵題云人說秋光好秋光此處尋紅黃間樹裏雲水映山岑康熙辛巳春日長安邸舍憶虞山秋色仿大癡筆麓臺祁下有王原祁印麓臺二印前有掃華菴一印右方下有石師道人一印軸髙三尺七分廣一尺四寸四分詩塘御題詩云虞山山色朝夕變惟有秋光最可人老筆蕭蕭為寫照髙松落落皆傳神儘繞紅葉爭繁豔却與白雲結好鄰吳下年年秋不改麓臺幾度參迷因御題下有潄芳潤乾隆宸翰二璽王原祁山村雨景一軸上等元三素絹本墨畫欵識云近溪幽濕處全借墨華濃唐人此語真所謂詩中畫也偶圖數筆覺滿幅冷光又非畫中詩耶戊子深秋適樹翁老先生南歸言别遂以贈之其工拙不復問矣王原祁下有王原祁一印前有畫圖留與人看一印右方下有麓臺一印軸髙四尺六寸三分廣一尺七寸二分詩塘皇帝青宫時題詩云竹樹宴濛處溪橋杳靄時水風翻栁浪霧雨沐山姿氣韻三秋潤烟嵐尺幅宜司農瀟灑筆似讀許渾詩寶親王長春居士題下有寶親王寶長春居士二璽前有樂善堂圖書記一璽王原祁草堂烟樹圖一軸上等元四素箋本著色畫欵識云古人用筆意在筆先然妙處在藏鋒不露元之四家化渾穆為蕭灑變剛徑為和柔正藏鋒之意也子久尤得其要可及可到處正不可及不可到之處箇中三昧在深參而自㑹之康熙乙未暮春畫于穀貽堂并題王原祁年七十有四下有王原祁印麓臺二印前有畫圖留與人看一印右方下有西廬後人一印軸髙二尺六寸三分廣一尺二寸六分詩塘梁詩正書皇帝青宫時題詩云屋壁淋漓懸尺素琅琊妙筆寫烟樹草堂空對夕陽間伊人宛在知何處蒼蒼暮景遙空白雲山滃翠迷咫尺檐前弗弗起飄風獨與髙秋留本色寶親王長春居士題後有寶親王寶染翰二璽前有樂善堂一璽後署梁詩正謹書五字下有梁詩正養仲二印王原祁仿倪瓚山水一軸上等元五宣德箋本墨畫欵識云畫忌率筆于荒率中得平淡涵泳之致雲林筆墨出人一頭地處也余還家後理楫迎鑾興到不覺技癢漫寫此意倉猝中自無佳趣應為識者所笑耳時乙酉上已後一日求是堂中作麓臺祁下有王原祁印麓臺二印前有畫圖留與人看一印右方下有西廬後人一印軸髙二尺廣一尺三寸王原祁仿黃公望山水一軸上等元六素箋本墨畫欵識云大癡畫經營位置可學而至荒率蒼莽不可學而至思翁得力處全在于此此圖余仿其意丙戌冬日消寒漫筆王原祁下有王原祁印麓臺二印前有畫圖留與人看一印右方下有西廬後人一印軸髙三尺二寸八分廣一尺五寸七分王原祁松亭山色圖一軸上等元七素絹本著色畫欵云翰林院侍講學士臣王原祁奉敕恭畫下有臣原祁一印軸髙六尺一寸四分廣二尺九寸九分王原祁仿北宋人山水一軸上等元八素箋本墨畫欵識云世人論畫以筆墨而用筆用墨必須辨其次第審其純駁從氣勢而定位置從位置而加皴染略一任意便疥癩滿紙矣每于梅道人有墨猪之誚精深流逸之故茫然不解何以得古人用心處余急于此指出得其三昧即得北宋之三昧也康熙乙未長夏畫并題王原祁年七十有四後有王原祁印麓臺二印前有畫圖留與人看一印左方下有西廬後人一印軸髙三尺三寸一分廣一尺八寸七分赫奕雨壑風林圖一軸上等黃一素絹本墨畫欵云臣赫奕恭畫下有赫奕恭畫二印軸髙一尺七寸八分廣一尺四寸上方聖祖仁皇帝書朱子六言詩一首識云録朱子詩下有康熙稽古右文二璽前有心手相師一璽赫奕畫唐人詩意圖一軸上等黃二素絹本著色畫欵云臣赫奕恭畫下有赫奕恭畫二印軸髙二尺六寸五分廣一尺八寸四分左方上聖祖仁皇帝書唐人七言截句一首識云唐句下有康熙稽古右文二璽前有中和一璽赫奕丹楓翠岫圖一軸上等黃三素絹本著色畫欵云臣赫奕恭畫下有臣赫奕恭畫二印軸髙二尺五寸五分廣一尺一寸九分上方聖祖仁皇帝書唐人五言律一首識云録張祜下有康熙稽古右文二璽前有中和一璽赫奕秋山雲樹圖一軸上等黃四素絹本著色畫欵云臣赫奕恭畫下有臣赫奕恭畫二印軸髙四尺三寸七分廣一尺九寸一分左方上聖祖仁皇帝書唐人七言截句一首識云録唐張祜詩下有康熙宸翰保合太和二璽前有日鏡雲伸一璽張鵬翀翠巘髙秋圖一軸上等宇一素箋本著色畫欵題云佳辰獻圖畫曉出鳯城西雙澗遙看落層峯近可躋繞林紅葉滿隔岸白雲低籬菊花爭插囊萸酒共擕玉泉縈御苑瓊島接招提優渥花糕賜從容綵筆題晚歸吟思好新月印前溪臣以下直餘閒作山水一幀當九日登髙之㑹侑萬年獻夀之觴臣學畫以來將及三紀通籍後所遇山水古蹟觸發殊少倘蒙睿鑒指示祕要得所師承庶稍脫凡近也乾隆九年甲子重九日詹事臣張鵬翀恭進下有臣鵬翀玉堂仙吏二印前署翠巘髙秋四字右方下有人境廬翠交庭二印軸髙三尺一寸五分廣一尺五寸五分左方上御題詩云問我繪事應師誰橫嶺近在帝城西從來師心非所貴師古道逺勞攀躋鵬翀汝詩脫筌蹄欲侔元白志不低我于詩畫涉藩籬安能示汝匪手擕得其環中遊方外疇謂半偈非全提佳節展汝山水竒興酣走筆一漫題黃花笑我拈吟髭蕭蕭寫影臨清溪乾隆九年九月九日御題下有乾隆宸翰幾暇臨池二璽董邦達九陽消寒圖一軸上等宙一宣德箋本著色畫九陽節候風景欵云臣董邦達恭繪下有達字侍從臣二印軸髙三尺六寸二分廣二尺一寸七分幅中御筆分九則小楷書題句其一云大易竒爻數紀乾陽初回日九方權却教繡户拈紅侣都把少陵詩意傳下有幾暇怡情一璽其二云觱發寒威淡逺空兩峯誰鏤玉西東後凋顏色分明在便是當年黃綺翁下有澄觀一璽其三云積素迷蹊掩舊扉春和一室獨研幾山隂舟繫相尋者訪戴伊人是也非下有染翰一璽其四云侵肌栗烈颯寒風卒嵗茅簷念寠窮識得貞元旋轉處梅梢春信已標紅下有太璞古香二璽其五云唐風讀罷嵗云休好樂無荒共酢酬臘鼓喧鳴春草發分陰誰惜白駒流下有德充符一璽其六云融融淑氣慶昭蘇仙木椒盤入畫圖酌酒介眉增樂事春風頭踏到皇都下有清玩一璽其七云花樹烘霞送尾寒太平鼓吹滿長安春光六月蓮為火九陌通宵焰是蘭下有㑹心不逺一璽其八云七月詩傳于耜宜東郊俶載老農知服疇念彼長年苦乘屋閒來未幾時下有得佳趣一璽其九云桃漸紅時栁漸青餘寒消盡落階蓂授時惕息深宫裏不共詩人醉野亭後欵識云祕府舊傳消寒圖按九陽之次各系一詩不知誰氏所作今仿其意命繪為圖因各題斷句一首亦欽若授時之意也乾隆甲子長至御識後有乾隆宸翰幾暇臨池二璽董邦達灞橋題句圖一軸上等宙二宣德箋本淡著色畫欵云臣董邦達恭畫下有達字侍從臣二印軸髙三尺五寸廣一尺七寸五分右方上御題詩云驢背風流未足思來今去古只如斯可知學士忘筌畫便是相公得意詩乾隆甲子暢月御題後有乾隆宸翰幾暇臨池二璽董邦逹溪山霽雪圖一軸上等宙三宣德箋本淡著色畫欵云臣董邦逹恭畫下有逹侍從臣二印前篆書署溪山霽雪四字軸髙二尺四寸五分廣二尺九寸五分左方上御題詩云太行之麓森巍峩陽崖牝壑糾紛羅經千年樹䕃軟莎沍寒不凋緑在科青女借得雲錦梭一夜幻出瓊瑶葩曉來開霽寒劇加旗亭有酒不可賖誰能驢背尋詩哦回巒復谷何逶迱中有逸民三兩家太古歲月忘羲娥迷離積素隱峯螺如有風來飄玉沙盈三尺幅千里多無畫家習同擘窠題詩筆凍煩頻呵乾隆乙丑年新正人日御題下有乾隆宸翰幾暇臨池㑹心不逺三璽前有御賞一璽唐岱孫祜合仿李唐寒谷先春圖一軸上等洪一素箋本著色畫欵識云寒谷先春乾隆九年春王月奉敕倣李唐臣唐岱孫祜恭畫下有臣唐岱朝朝染翰二印軸髙一丈一尺一寸廣八尺六分左方上御題詩云涉海覔方蓬登陸凌岱華鞭石豈逹舉雲軨亦難駕平生山水心不減東山謝坐遊千里路兼消萬幾暇李唐古之人藝圃堪稱伯繼跡羌孰能丹青空滿架我欲傳其神求諸其匹亞是圖合作成如集奈與蔗奧域邃且幽稜峯露天罅判勢異旗鼓親形譬姻婭流泉寒不凝珠顆崖間瀉精藍隱樹顛午梵鐘聲罷兩山環抱處盤土可以稼小軒三四檻詎必凌雲榭蕭然太古民笑傲何不嗄梅妻微破顔胎仙倚而訝貌此寒谷春信是探元化若無李唐蹟誰辨雞林價圖繪誠餘事今古何冬夏無怪讀書人頽風吁日下乾隆甲子仲春御題并書下有惟精惟一乾隆宸翰二璽唐岱倣趙孟俯山水一軸上等荒一素絹本著色畫欵云仿趙孟俯臣唐岱恭畫下有臣唐岱恭畫二印軸髙二尺五寸廣一尺七寸右方上御題詩云天際新螺翠欲浮坐來九夏似深秋岩腰古寺開青嶂渡口欹橋鎖碧流清籟吟空金氣肅寒鴉歸樹暮烟收丹青妙處誇生動每對溪山一為留御題下有惟精惟一乾隆宸翰二璽余省東籬秀色圖一軸上等日一宣德箋本著色畫菊花欵識云乾隆九年九日臣余省奉敕臨生恭畫下有余省聯印右方中梁詩正和御製元韻題云秋容誰寫照筆妙化工施欲釀泉中味猶傳籬下詩雁橫寒露外人瘦晚風時憶許賡題句重陽不負期重陽前一日奉命書和題菊詩臣梁詩正恭和左方中張照和云猶輕甘谷隗肯比苧蘿施有影皆成畫無言亦可詩金風玉露下蟬去雁來時手把離騷客清香若與期臣張照恭和下勵宗萬和云鉛華都洗淨冷艷傲威施貌入王維畫如吟靖節詩香留殘墨裏影怯薄寒時一自邀宸詠芳名萬古期臣勵宗萬恭和又下張若靄和云五色秋呈艷霜毫巧設施寒香彭澤韻晚節魏公詩纈額安黃候緇衣賜紫時酈泉通太液咫尺與仙期臣張若靄恭和軸髙三尺六寸五分廣二尺一寸右方上御題詩云如是空非色誰教鉛粉施能知花外趣堪作畫中詩露朵盈盈際風枝灑灑時落英如可啜何必學安期御題下有乾隆宸翰㩦筆流雲藻二璽左方上御筆署東籬秀色四字後有㫖逺辭文陶冶性靈二璽沈源畫新月詩意一軸上等月一宣德箋本著色畫欵識云乾隆十年春正月臣沈源恭畫下有臣沈源恭畫聯印軸髙三尺九寸廣一尺七寸右方上御書新月詩云新月如鈎低玉繩誰參形色得相應半全省識渾無礙三五未臨亦絶勝大樹烘春燃麝粉蓮花照夜剪吳綾琉璃一盞餘膏盡古佛分明謁寶燈後識云今年正月哉生魄天角一痕逺明積素致可愛玩因成新月長律一章敕院臣沈源繪為圖以志風光節物之佳非誇詩句工好也乙丑上元後八日御識下有乾隆宸翰樂天二璽畫軸次等惲夀平東籬秋色圖一軸次等天一素絹本著色畫詩塘欵題云我對黃華默不語黃華對我如有情瘦莖葉葉帶霜氣繁英片片含秋清黃鵝紫鳳嬌欲舞金幢玉節紛來迎南山悠然長在眼滿手秋光餐落英宋人有東籬傲霜枝圖因仿其意然模花範葉之間猶未能盡態極妍聊與賞音發笑雲溪外史夀平題惲夀平富貴圖一軸次等天二素絹本著色畫欵題云曽依瑶圃三株樹長護蓬萊五色雲甌香館橅北宋人法夀平惲夀平菊花一軸次等天三素絹本著色畫欵題云我對黃花默不語花枝向我如有情瘦莖葉葉帶霜氣繁花片片含秋清江南種菊之盛無如練川婁東而吾郡澄江欲與相敵每深秋遊賞載丹粉以玩化工之靈竒意甚樂之南田夀平王翬岩栖髙士圖一軸次等地一宣德箋本墨畫欵題云髙士岩栖趣自幽白雲天半讀書樓銀河落向千峯裏長和松濤萬壑秋石谷王翬畫并題前有惲夀平題句一後有笪重光題句一王原祁仿倪瓚山水一軸次等元一素箋本墨畫欵識云畫家惟雲林最為髙逸故與大癡同時相傳有倪黃合作兩家氣韵約略相似後之筆墨家宗焉余于此中亦有一知半解近日辦公之暇適當靜攝見案頭側理便為塗抹未識稍有相應處否識者自能辨之康熙壬辰二月下浣畫于京邸榖詒堂麓臺祁年七十有一赫奕禁園秋霽圖一軸次等黃一素絹本著色畫欵云臣赫奕恭畫左方上聖祖仁皇帝題云樹冷催蟬咽荷疏表影長深秋殘暑氣微爽待髙陽户外逺塵跡園中多蕙香溶溶新雨霽吟乏愧成章壬午書下有康熙稽古右文二璽前署禁園秋霽四字有暢春一璽赫奕煙江漁艇圖一軸次等黃二素絹本著色畫欵云臣赫奕恭畫右方上聖祖仁皇帝書米芾七言截句一首識云仿米下有康熙宸翰保合太和二璽前有佩文齊一璽赫奕山水一軸次等黃三素絹本著色畫欵云臣赫奕恭畫蔣廷錫瑞蔬圖一軸次等宇一素絹本著色畫自書贊并識云雍正三年十月初五日宣示圓明園畦圃萊蔔一根九枝紅潤鮮潔彩色煥發謹按瑞命紀曰王者德被四海則草木連理果實駢蒂分枝皇上德洋恩溥御極以來嘉庥瑞應屢見叠呈兹御園萊蔔九枝駢蒂天人交感之理信可徴也臣廷錫謹繪圖書贊以進贊曰聖皇德澤被九有天禧地瑞集孔厚黍穀九穗稻九岐紫花菘根復呈九九為乾德九為陽九九相承寶厯長應與九英芝並列濡毫拜進九如章經筵講官户部左侍郎內閣學士裏行臣蔣廷錫前署御園瑞蔬圖贊六字蔣廷錫牡丹一軸次等宇二金箋本著色畫欵云臣蔣廷錫恭畫右方上聖祖仁皇帝題云晨葩吐禁苑花蒔就新晴玉版參仙蕊金絲雜緑英色含潑墨發氣逐彩雲生莫訝清平調天香自有情後署詠各種牡丹五字下有康熙宸翰一璽前有佩文齊一璽蔣廷錫藤花山雀圖一軸次等宇三素絹本著色畫欵云臣蔣廷錫恭畫左方上聖祖仁皇帝題云石上生孤藤弱蔓依石長不逢髙枝引未得凌空上何處堪托身為君長萬丈下有體元主人萬幾餘暇二璽前有日鏡雲伸一璽蔣廷錫蟠桃圖一軸次等宇四素絹本著色畫欵云臣蔣廷錫恭畫左方上聖祖仁皇帝書唐人七言截句一首下有康熙宸翰保合太和二璽前有佩文齊一璽髙其佩八駿圖一軸次等宙一素絹本著色指畫欵云髙其佩指頭畫右方上皇帝青宫時題詩云苜蓿平川數十里幾株楊栁秋風裏兩駒竝馳若驚鴻一匹齕草閒且喜卧者有二立者一老馬摩癢如龍視就中紫驑獨稱神滚地生風塵欲起奚官無事但立望兩人容與疏林底古人畫馬用秋毫髙君畫馬用十指腕下生風何足云指頭運意得神髓懸之髙堂秋意多哂余興在南海子雍正甲寅暢月寶親王長春居士題後有寶親王寶不為物先長春居士三璽前有隨安堂一璽上方中御筆大書神字髙其佩雙駿圖一軸次等宙二素絹本著色指畫欵云髙其佩指頭畫右方下皇帝青宫時題詩云平川苜蓿烟濛濛一株老栁秋陽中二馬昻藏趂西風蹀躞意態傑且雄一匹摩癢一匹卧驚鴻脫兔凡馬空當年畫馬稱韓幹安排筆墨成欵段何如一指運千鈞墨汁淋漓法不亂自今繪院傳竒觀不在毫端在指端寶親王長春居士題時甲寅秋七月下有寶親王寶長春居士二璽前有芝蘭室一璽髙其佩廬山瀑布圖一軸次等宙三素絹本著色指畫欵云髙其佩指頭畫詩塘皇帝青宫時題詩云廬山髙髙插天瀑布千尺飛其顛擘開玉峽白龍走空濛萬古生雲烟七十老翁戲作此不用霜毫用十指丈山尺樹都不論壁間仿佛流寒水寶親王長春居士題下有寶親王寶染翰二璽前有樂善堂一璽慎郡王允禧山靜日長圖一軸次等洪一素絹本著色畫未署欵上方署甲寅元月四字左方上梁詩正書皇帝青宫時題句云吾叔乃詩翁裁句清而好近復參畫襌頗得畫中道髙齊長日暇為我濡毫掃即景繪為圖筆法特髙老一峯插天青波面池亭小峰腰瀑布飛亭畔清流繞更無别粧㸃寫意殊了了我聞詩兼畫妙品古來少摩詰真跡無元鎮清風渺吾叔乃升堂況值青年早從知天授竒不憑人力巧嗟我學畫法年來曽探討髙山但景仰興洽林泉杳寶親王長春居士題梁詩正謹書戴天瑞春山勝事圖一軸次等荒一素絹本著色指畫欵云臣戴天瑞指頭恭畫右方上聖祖仁皇帝書唐人五律一首下有康熙稽古右文二璽前有淵鑒齊一璽戴天瑞山水一軸次等荒二素絹本著色指畫欵云臣戴天瑞指頭恭畫詩塘梁詩正書皇帝青宫時題句云玻瓈貯碧無涯津田田荷葉出水新草堂坐對清埃塵忘機養得鶴性馴瀟灑更有松與筠逺峰掃黛青嶙峋有客有客來訪頻髙山流水無俗緣苔徑曲轉過栁樊主人不用迎出門筆墨渲染古來聞指頭蘸墨見此人吁嗟絶藝工且神一指乃能探其元無因得悟天龍禪寶親王題下有寶親王寶染翰二璽前有樂善堂一璽後署梁詩正謹書張鵬翀松梅清韻圖一軸次等日一素絹本淡著色畫欵題云鬱鬱蒼髯古大夫藐姑仙客雪肌膚無聲有韻憑真賞管領新年入畫圖其一冷然松籟挹禖魂幾度橫琴與雪煩琴曲有梅花三弄風入松等名虛閣倚吟風寂歷空廊勾夢月黃昏其二小園數樹婆娑影嵗晏蕭閒坐半龕一餉松風吹夢醒宛隨驛使度江南其三萬事無營任自然紙窗燈火餞華年呵寒寫出雙清影擬薦新詩玉殿前其四乾隆七年壬戌嘉平日講官少詹事臣張鵬翀恭進前署松梅清韻圖五字朱倫瀚瀟湘烟靄圖一軸次等月一素絹本著色指畫欵云臣朱倫瀚指頭恭畫上方聖祖仁皇帝題云梅花一調入江干分出瀟湘五月寒地北天南無謫叟長安逺近在毫端後署得江城五月落梅花八字上有康熙御筆之寶一璽唐岱千山落照圖一軸次等盈一素箋本著色畫欵識云萬葉秋聲裏千山落照時雍正十年九月望擬黃鶴山樵筆意靜巖唐岱詩塘梁詩正書皇帝青宫時題句云我愛唐生畫數作意未已昨來街市中買得澄心紙好趂靜室閒為我圖山水著墨濃淡間萬壑秋風起水亭跨明波磴道延步履斜陽映天末咫尺有萬里瞑對意彌遙不獨披圖是位置古人中誰能别彼此雍正甲寅夏五月朔寶親王題下有寶親王寶長春居士二璽前有隨安室一璽後署梁詩正謹書唐岱夏山髙逸圖一軸次等盈二素絹本著色畫欵云仿趙孟俯臣唐岱恭畫前署夏山髙逸四字院本新豐圖一軸次等昃一素絹本著色畫欵云臣唐岱孫祜沈源丁觀鵬王幼學周鯤吳桂奉敕恭畫左方上張若靄書御題詩云上皇不樂居關中詔徙豐沛為新豐通闤帶闠開九市簇簇旗亭凡五重貨别隧分庶且富甲第連雲車馬凑沽酒屠兒煮餅商一一物色皆惟舊老幼初來似久居雞鳴于塒犬守閭統紀咸遵三輔尉市致無煩周大胥鈎陳之外接閣道穹隆曽命般爾巧枍詣天梁户對開憑軒下視凌空鳥古今都㑹稱長安誰與營者匠胡寬秖今荒土基難覔還留圖畫人間看乾隆甲子春月御題臣張若靄敬書石渠寶笈卷二十七
