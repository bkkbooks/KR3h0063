南村陶九成右方上有神品墨林山人天籟閣項墨林鑑賞章諸印下有子京父印項元汴印墨林祕玩諸印左方上有退密項子京家珍藏檇李項氏世家寶玩諸印下有項墨林父祕笈之印尚書世家二印軸髙二尺八寸五分廣一尺一寸七分詩塘御題詩云霜落澄湖魚不餌釣車偶弄滄浪意丹楓緑嶼靜髙秋獨坐閣閭無一事無數溪山幽復深科頭把釣喬柯陰底事白鷗不飛去之子原無羡魚心乾隆戊午長夏御題下有稽古右文之璽乾隆宸翰二璽御筆題籖籖上有乾隆宸翰一璽元馬文璧秋江釣艇圖一軸上等騰二素箋本墨畫款識云至正庚寅八月望扶風馬文璧為鐵崖先生畫下有馬氏文璧一印軸髙四尺七寸五分廣一尺三寸二分明宣宗嘉禾圖一軸上等致一素絹本著色畫款識云宣德丁未九月草九日御筆戲寫嘉禾圖賜太監莫慶左方下有白石山房書畫之記一印軸髙一尺一寸九分廣九寸四分御筆題籖籖上有乾隆宸翰一璽明宣宗戲猿圖一軸上等致二宣德箋本著色畫款識云宣德丁未御筆戲寫上鈐廣運之寶御府圖書二璽右方上有欽賜臣權一印左方下有臣犖子孫永保二印軸髙五尺五分廣三尺九寸七分明宣宗畫三陽開泰圖一軸上等致三素箋本著色畫款識云宣德四年御筆戲寫三陽開泰圖上鈐廣運之寶一璽軸髙六尺六寸廣四尺四寸八分明王紱畫竹一軸上等雨一素箋本墨畫款題云我愛君家雖帶郭囂塵不到南薰箔相過聊為寫閒情楚雲數葉秋陰薄寫餘自覺襟抱清鬢絲颯颯新涼生何當為君作長笛持向君山吹月明僕偶過逢吉髙軒茗話餘出此紙求畫遂寫此並賦詩以塞責云時永樂元年五月既望九龍山人王紱孟端識下有孟端王紱之印二印前有氷壺秋月一印上方有滕用亨題云龍山筆意肖房山秋影秋聲户牖間不是此君清似玉何由埃壒化髙閒南陽滕用亨又張肯題識云書法元于畫法同半窗秋影墨池中同州仙去房山逺賴有王君繼此風趙吳興詩有云石如飛白竹如籒此法還如八法同是吳興公以畫而作書者也同州房山亦同此妙若薊邱息齊皆不足以論此者也今觀友石公著此筆深有契于吳興公所論者之妙坐中朋來同軒二先生以僕之言為然故書其右云浚儀張肯識又梁用行題識云此君畫意非畫畫髙子賞激俗子罵我亦生平頗諳此許君不在房山下閒齊雨晴風日妍偶呼筆硯置几前為寫黃陵廟前景鷓鴣啼處煙蒼然座中有客皆俊逸尤解監之稱嘖嘖明朝風雨更來看只恐蛟虬夜穿壁太原王公孟端寫竹雅得房山筆趣翛然窗几似有清籟與南薰偕來僕素嗜此不覺技癢遂邀南陽滕朋來俊儀張夢菴同賦焉同觀者蘭陵繆伯髙是日午飲主人二茂異也永樂乙酉孟秋既望安定梁用行題右方下有金石盟一印軸髙三尺九寸七分廣一尺二寸六分明王紱溪亭夜讀圖一軸上等雨二素箋本墨畫款云九龍山人王紱下有孟端一印左方下有王汝玉一印軸髙三尺二寸二分廣一尺三分明王紱秋景一軸上等雨三素箋本墨畫款題云玉署坐凉旦野人忝簮纓謬以染翰職遂得陪羣英疏雨淡東旭嘉樹蔭西清樂茲館閣靜悠然抱閒情于焉弄豪素澗谷紛縱橫幽徑遵曲岸鳴泉繞孤亭同遊固未暇寓目猶可并菲材惜何補生幸承休明永樂十年秋七月毗陵王紱寫並詩後有孟端游戲翰墨二印前有友石生一印軸髙三尺六寸四分廣一尺二寸九分明王紱竹石一軸上等雨四素箋本墨畫款識云永樂十二年冬王紱寫下有孟端一印右方上有天籟閣一印下有子京項元汴印項元汴氏審定真跡諸印左方上有檇李墨林子子京珍祕諸印下有寄傲項墨林父祕笈之印宫保世家項墨林鑑賞章諸印軸髙一尺五寸七分廣九寸八分明夏昶清風髙節圖一軸上等露一素箋本墨畫款識云東吳夏昶仲昭為太守何公作時景泰改元春二月望日也下有東吳夏昶仲昭書畫印古二千石二印前署清風髙節四字後有題句云筠州不是清饞守手吐琅玕落硯池相見澄江何竹鶴也從名郡賦歸時底須煙雨三千􅒪只可風雷一兩枝江左周郎今老矣郤從髙邑縣題詩成化壬辰季夏四月疑舫老人左方下有曹程之印鄴仙二印軸髙四尺二寸七分廣一尺三寸四分明夏昶竒石修篁圖一軸上等露二素箋本墨畫款云竒石修篁仲昭下有夏昶仲昭印自在居士太常卿圖書三印軸髙八尺八寸廣三尺二寸五分明夏昶半窗晴翠圖一軸上等露三素箋本墨畫款云東吳夏昶仲昭作下有夏氏仲昭印太常卿圖書二印前署半窗晴翠四字軸髙四尺三寸二分廣一尺四寸一分明邊景昭三友百禽圖一軸上等結一素絹本著色畫款識云永樂癸巳秋七月隴西邊景昭寫三友百禽圖于長安官舍後有湘府殿賜怡情動植邊氏文進三印又一印漫漶不可識軸髙四尺七寸廣二尺九寸三分明邊文進栗喜圖一軸上等為一素絹本著色畫款云景昭作栗喜圖下有一印漫漶不可識右方下有石鷗書畫之章三槐之裔二印左邊幅有梅栁江村樂漁船二印軸髙一尺四寸五分廣一尺七寸六分御筆題籖籖上有乾隆宸翰一璽明杜瓊聽泉圖一軸上等霜一素箋本墨畫款題云閒對溪泉歌濯纓濯纓歌罷獨留情從知活水源頭在遂使流來日夜清徐君孟祥讀書修德而又天資明敏強記多聞千言過目即能成誦作為詩文雅有體裁所謂吾當避路放他出一頭地者也間以此紙徴豫鄙作因詩其上併系此云正統八年癸亥嵗夏五東原杜瓊書下有杜氏用嘉一印前有太古心旌節名門二印上方徐庸題云跳珠濺玉韵泠泠幾度來聽上小亭莫向溪山長寄跡朝宗隨意到滄溟南州徐庸又王應題識云君居城郭我山林誰向西齊對榻吟今日無端見圖畫暮雲春樹思尤深杜君用嘉寫圖賦詩以貽余友徐君孟祥復綴數言以稱美之世之知孟祥者謂其言之有徴不知孟祥者謂其言之過情語云如有所譽者其有所試矣用嘉之美孟祥非有所試乎余故書此以諗乎世缺二字知孟祥者王應識軸髙三尺二寸廣一尺二寸三分明沈周秋塘野鶩圖一軸上等金一素箋本著色畫款題云甫里先生愛吾今亦愛之傳神聊一過如在碧䦨時沈周下有啓南一印軸髙三尺六寸廣九寸五分御筆題籖籖上有乾隆宸翰一璽明沈周夜坐圖一軸上等金二素箋本淡著色畫上方書記云寒夜寢甚甘夜分而寤神度爽然弗能復寐乃披衣起坐一燈熒然相對案上書數帙漫取一編讀之稍倦置書束手危坐久雨新霽月色淡淡映窗戶四聽閴然蓋覺清耿之久漸有所聞聞風聲撼竹木號號鳴使人起特立不回之志聞犬聲狺狺而苦使人起間邪禦冦之志聞大小鼓聲小者薄而逺者淵淵不絶起幽憂不平之思官鼓甚近由三撾以至四至五漸急以趨曉俄東北聲鐘鐘得雨霽音極清越聞之又有待旦興作之思不能已焉余性喜夜坐每攤書燈下反覆之逮二更方已為常然人喧未息而又心在文字間未嘗得外靜而內定于今夕者凡諸聲色蓋以定靜得之故足以澄人心神情而發其志意如此且他時非無是聲色也非不接于人耳目中也然形為物役而心趣隨之聰隱于鏗訇明隱于文華是故物之益于人者寡而損人者多有若今之聲色不異于彼而一觸耳目犁然與我妙合則其為鏗訇文華者未始不為吾進修之資而物案句內有脫字足以役人也已聲絶色泯而吾之志沖然特存則所謂志者果內乎外乎其有于物乎因得物以發乎是必有以辨矣於乎吾于是而辨焉夜坐之力宏已哉嗣當齊心孤坐于更長明燭之下因以求事物之理心體之妙以為修己應物之地將必有所得也作夜坐記𢎞治壬子秋七月既望長洲沈周下有啓南石田二印前署夜坐記三字軸髙二尺六寸五分廣六寸八分明沈周畫白頭長春圖一軸上等金三素絹本著色畫款題云堂前種此靈椿樹滿地碧雲宜白頭壽到八千還健在人間又見一莊周沈周下有啓南一印後署為宗瑞寫壽五字又記云鄧宗盛八十宗瑞蓋其壻能勤敬如此可謂半子矣上方吳瑞題云白頭偏喜說椿年八十從今到八千不向明堂作梁棟深山貞節老彌堅吳瑞又浦應祥題云摩挲老樹千年物蔭我百年雙白頭左右瑟琴忘把弄四時花草度春秋浦應祥又沈誠題云霜皮溜雨色參天閲到春秋已八千玉潤氷清相照映新圖聊祝壽彌堅沈誠又唐寅題云八十詩翁隱者流手裁椿樹破青邱而今枝幹大如斗下有長春上白頭唐寅軸髙二尺五寸廣一尺四寸七分明沈周畫雞一軸上等金四素箋本著色畫款題云昨夜客窗下三聲曉夢驚不眠思早起布被覺霜清𢎞治改元清和月沈周下有啓南石田二印前有煮石亭一印左方下有吳郡陳氏同壽堂珍寶一印軸髙四尺七寸九分廣一尺一寸三分明沈周畫雞一軸上等金五素箋本著色畫款題云絳冠髙幘不須裁一身潔白脫一字中來平生不解多言語一叫千門萬戶開沈周下有啓南一印軸髙四尺二寸三分廣一尺五寸三分明沈周雙松一軸上等金六宋箋本墨畫款題云堂下有松樹參雲數百年種松人未老常作地行仙沈周下有沈啓南氏白石翁二印軸髙五尺三分廣一尺三寸七分明沈周春水新鵝圖一軸上等金七宣德箋本淡著色畫款題云春水緑于苔新鵝黃似酒獨立在溪邊負却山陰友沈周下有啓南白石翁二印軸髙二尺四寸八分廣八寸明沈周溪居讀書圖一軸上等金八素箋本墨畫款題云溪居久不到落葉滿階除愛是髙人坐清風亂卷書沈周下有啓南一印右方下有道普一印左方下有嚴澤之印西方之人桂坡安國鑑賞三印軸髙二尺八寸一分廣六寸九分明沈周金粟晚香圖一軸上等金九素箋本墨畫款題云一樹黃金粟秋風吹晚香姮娥新折得贈與少年郎沈周下有啓南石田二印右方下有張靜齊珍玩圖書記平川珍賞靜逺堂印燕平張氏家藏諸印軸髙三尺二寸九分廣一尺一寸八分明沈周仿倪瓚筆意一軸上等金十素箋本淡著色畫款題云迂叟秋風客晚年江海家致仙當化鶴語靜已餐霞南國天宜放西湖月可賖而今清祕閣誰與一澆茶長洲沈周下有沈氏啓南白石翁二印軸髙二尺五寸廣七寸五分明沈周抱琴圖一軸上等一金十素箋本淡著色畫款題云川色巒光照客顔柳風不動鬢絲閒抱琴未必成三弄趣在髙山流水間沈周下有啓南石田二印軸髙四尺七寸六分廣一尺八寸六分明沈周畫重陽景一軸上等二金十素箋本墨畫款識云兩隻蟹一甕酒為問東籬菊放否把酒持螯看菊花一首詩成酒一斗沈周下有啓南白石翁二印左方下有南田翁滄江白髮二印又半印不可識軸髙一尺七寸八分廣一尺三寸明沈周雨意一軸上等三金十素箋本墨畫款題云雨中作畫借濕潤燈下寫詩消夜長明日開門春水濶平湖歸去自鳴榔丁未季冬三日與德徴夜坐偶值興至寫此以贈云沈周上鈐啓南一印軸髙二尺一寸廣九寸六分明沈周寒林獨蹇圖一軸上等四金十素箋本淡著色畫款識云成化四年冬十一月長至夜漫作寒林獨蹇沈周下有石田白石翁二印軸髙三尺廣九寸一分明沈周蔬菜一軸上等五金十素箋本墨畫款題云南園昨夜雨肥勝大官羊党氏銷金帳何曾得一嘗沈周下有啓南石田二印左方下有髙卧東山一印軸髙二尺八寸六分廣九寸八分明唐寅江南農事圖一軸上等生一素箋本淡著色畫款題云四月江南農事興漚麻浸榖有常程莫言嬌細全無事一夜繅車響到明庚寅畫下有吳趨唐伯虎二印右方下有汪氏在我一印左邊幅有李肇亨跋云子畏畫品在文沈間卓然自成一家非一時流輩所能企及此幀神韻溢出尤其愜意者不可多得矣識者寶之醉