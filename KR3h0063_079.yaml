  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_079-1a, image: WYG0825/WYG0825-0465a.png}
body:
  text: 貯御書房十一列朝人畫軸上等唐董展三顧草廬圖一軸上等天一素箋本著色畫無款姓氏見識語中詩塘薩都刺識云往豫宦遊長安亷訪楊孟載出所藏道經變相視豫覺骨氣竒偉豐神奪目其後有數小楷字書汝南弟子董展敬圖董展字伯仁汝南人隋唐間為光祿大夫與展子䖍齊名時人號為智海其所繪山水人物深濃淺淡多蒼古聳翠層折曠宕為世所最尚亦不數見然每不下名氏前賢皆然人罕知之頃觀吳子壁間三顧圖漠漠有雲霧起人馬儼如也大非俗史所能夢見此非凡筆乃伯仁所作也吳子曰先生何以知之余曰譬之野鶴立于雞羣其霜姿自然炯目嫠婦子都美惡奪心吳子乃長揖曰非先生幾茆塞矣于是索録所述遂匿而不出至正甲午秋八月燕山天錫山人薩都刺識軸髙一尺三寸五分廣九寸二分御筆題籖籖上有乾隆宸翰一璽唐李昭度山水人物一卷上等地一素絹本著色畫無款姓名見識語中軸中半印三皆不可識詩塘識云大小李將軍思訓昭度也昭度本非武將特以憲章思訓故得名爾其描法徑利思致精密豈復可及若更飄揚神放便自與吳生齊軌聞張侯得之甚易信竒物自有所歸也後署無言二字軸髙二尺四寸二分廣一尺一分五代關同蜀山棧道圖一軸上等元一素箋本著色畫款脫軸髙四尺三寸九分廣二尺八分上方御題詩云關同真蹟天下少十人規橅九背馳蜀山棧道之子作橫雲劍閣髙嶷嶷五丁斧痕留絶壁秋風落葉流水澌裝池屢易姓氏去細認手筆無然疑試看氣韻生動處猶使人饒蜀道思御題下有稽古右文之璽乾隆宸翰二璽御筆題籖籖上有乾隆宸翰一璽宋徐熙玉堂富貴圖一軸上等黃一素絹本著色畫款署金陵徐熙下半印二不可識右方下有仲陽一印又一印不可識軸髙三尺五寸一分廣一尺一寸九分宋米黻岷山圖一軸上等宇一素箋本墨畫款識云芾岷江還舟至海應寺國詳老友過談舟間無事且索其畫遂爾草筆為之不在工掘論也左方上魏了翁題云淡淡雲林小小山誰家茆屋隱松間石橋雨過天台逺采藥仙人去未還魏了翁右方上有天籟閣一印下有神品項子京家珍藏楊嘉亹子諸印左方下有退密項墨林父祕笈之印檇李項氏世家寶玩祚明私印潘紀鑑定真蹟諸印軸髙二尺八分廣一尺二寸詩塘御題詩云尺幅衡箋畫蜀山雲嵐層叠許誰攀密圍古樹四時翠獨閉柴扉鎮日間苔色侵眸紛緑縟溪聲入耳隱潺湲渾如雨霽輕煙斂矗矗稜峯濯曉鬟乾隆庚申夏四月御題下有幾暇鑑賞之璽乾隆宸翰二璽御筆題籖籖上有御賞乾隆宸翰二璽宋李迪翎毛花卉一軸上等宙一素絹本著色畫無款詩塘有董其昌書宋李迪筆四字下署元宰軸髙九寸六分廣九寸一分宋馬逺竹鶴一軸上等洪一素絹本著色畫款署臣馬逺上方宋楊后題云不禱自安緣壽骨人間難得是清名淺斟仙酒紅生頰永保長生道自成賜王都提舉為壽上有坤卦楊氏書印二印右方下有半印不可識左方下邊幅有蕉林收藏一印軸髙三尺八寸八分廣一尺七寸七分宋馬逺乘龍圖一軸上等洪二素絹本著色畫款署馬逺右方下有蒼巗子蕉林居士二印軸髙三尺三寸八分廣一尺六寸五分宋梁楷東籬髙士圖一軸上等荒一素絹本著色畫款署梁楷右方上有天籟閣一印下有公貞吳氏公一子孫永保項子京家珍藏諸印左方上有神品項墨林鑑賞章二印下有公貞項元汴印墨林山人李繼泉真賞章吳于庭元賞印張羽鈞諸印右邊幅有蒼巗子蕉林居士二印軸髙二尺二寸四分廣一尺一寸四分元趙孟俯吹簫仕女圖一軸上等日一宋箋本著色畫無款姓氏見題識中左方上宋濓題云玉簫輕按柔荑指鳳鳥聲中天似洗胡蝶紛飛茉莉風蜻蜓亂㸃芙蓉水膩音凝花團粉紅蛛巢墮鬢雲朦朧胭唇濃眉照秋緑腰身騕裊如游龍蕭郎不來宫水咽時將幽素題蕉葉巫雲巫雨斷無蹤翩翩桂花落寒月鮫衣紅透腥腥血曲中不見山石裂右吹簫美人圖吳興趙孟俯作也豫為題老不能書呈醜金華宋濓軸髙二尺三寸三分廣八寸元趙孟俯夏木垂陰圖一軸上等日二宋箋本墨畫款識云至大三年六月草五日作夏木垂陰圖子昻下有趙氏子昻一印右方下有羅惟祥氏一印又一印漫漶不可識軸髙四尺八寸五分廣一尺四寸五分元趙孟俯觀泉圖一軸上等日三宋箋本著色畫款識云至大二年九月四日吳興趙孟俯畫下有趙孟俯印一印右方上有趙字一印下有趙氏子昻天水郡圖書印二印軸髙一尺六寸六分廣七寸八分元管道升竹石一軸上等月一素箋本墨畫無款左方下有魏國夫人趙管一印右方下有商邱宋犖審定真蹟一印詩塘董其昌識云管魏國寫竹自文湖州一𣲖徑挺有骨與宋廣平作賦正相反或曰吳興借之為名董其昌題軸髙二尺七寸廣八寸九分元趙雍采菱圖一軸上等盈一宋箋本著色畫款識云至正二年十月望日仲穆畫下有仲穆一印右方中有蒼巗子棠村審定二印下有吳廷之印瞻衮堂二印左方下有南昌袁氏家藏珍玩子孫永保一印軸髙三尺四寸五分廣一尺九分御筆題籖籖上有乾隆宸翰一璽元趙雍竹石鸜鵒圖一軸上等盈二素絹本墨畫款識云缺正九年吳興趙雍仲穆下有仲穆魏國世家二印右方李至剛題云待制退金鑾濡毫寫秋影鸜鵒忽飛來㸃破瀟湘景至剛題軸髙三尺六寸一分廣一尺二寸六分元髙克恭林壑髙風圖一軸上等昃一素箋本墨畫款署克恭上鈐房山髙氏一印右方上署林壑髙風四字下有清森閣書畫印一印左方上有棠村審定蕉林二印下一印漫漶不可識軸髙二尺二寸四分廣一尺一寸八分御筆題籖籖上有乾隆宸翰一璽元髙克恭林巒煙雨圖一軸上等昃二宋箋本著色畫款識云元統癸酉夏六月克恭下有髙氏房山一印上方俞和題云雲氣濛濛繞澗流眼明誰辨數峰頭深林茆屋依然見應是前村雨腳收至正草三年秋七月紫芝俞和又吳寬題云村居隱隱却通舟中有山人舊姓仇二百餘年遺墨在令人欲作武林遊成化庚寅修禊日長洲吳寬右方下有彭氏文貞楊氏家藏二印左方下有于思緝印桐江余銓二印軸髙三尺八寸五分廣一尺九寸一分上方御題詩云溟濛那辨菰蒲嶼林鳥低飛亂煙雨前溪漁父棹舟歸不覺蓑衣重幾許御題下有乾隆宸翰幾暇臨池二璽御筆題籖籖上有乾隆宸翰一璽元髙克恭雲山一軸上等昃三素絹本著色畫款識云延祐二年六月克恭下有髙彥敬房山二印右方下一印漫漶存珍玩二字詩塘有董其昌記語髙彥敬尚書設色山真蹟十字後署董其昌鑒定軸髙三尺八寸廣一尺七寸三分元錢選秋瓜圖一軸上等辰一素箋本著色畫款題云金流石爍汗如雨削入氷盤氣似秋寫向小窗醒醉目東陵聞說故秦侯吳興錢選舜舉後有舜舉印章舜舉錢選之印三印前有希壽一印軸髙一尺九寸六分廣九寸三分元陳琳疏枝雙雀圖一軸上等宿一素箋本著色畫款署陳琳下有琳印一印左方下有卧菴所藏一印軸髙一尺六寸七分廣九寸御筆題籖籖上有乾隆宸翰一璽元柯九思夏山欲雨圖一軸上等列一素箋本墨畫款云丹邱柯九思畫下有柯氏敬仲一印左方上嶽榆識云豫自無錫倪元鎮蕭閒館與丹邱柯先生同載至義興大溪口時雨新霽指南山謂豫曰我昔留京時于李平章家觀董北苑畫正與此山相似若船中有紙我亦髣佛其萬一遂至顯親寺主大方崖方丈數日宴里人王子明同同軒臨夏山欲雨圖歸憶前言即索紙臨寫同集者吳下盧淙小山京口張京德常畫竟潘子素後至先生笑曰並為我記中原士大夫姓名時至正甲申六月八日嶽榆識右方下有霜華山人一印左方下有吳氏家藏一庭香雪二印軸髙四尺一寸二分廣一尺四寸五分詩塘御題詩云蒼岫出竒雲喬柯吟微風未雨雨意來濕潤含穹窿對此迷茫景益覺憂思忡擬鞭癡龍起沛然灑長空乾隆甲子三月既望御題下有幾暇鑑賞之璽乾隆宸翰二璽御筆題籖籖上有御賞乾隆宸翰二璽元柯九思溪亭山色圖一軸上等列二素箋本墨畫款署丹邱邱字缺右方上曹文題云結茆占斷一溪雲水光山色隔座分心逺竟忘塵外事卷簾閒坐對爐薰譙國曹文為一源佳友題又游戲翰墨一印又一印漫漶不可識下有汲郡林氏家藏一印軸髙一尺九寸六分廣一尺五分御筆題籖籖上有乾隆宸翰一璽元朱德潤林下鳴琴圖一軸上等張一素絹本墨畫款云林下鳴琴朱澤民作下有朱氏澤民一印右方上王逢題云霜降木落潦水收鶀鴈起影苽蒲洲巨微萬象體俱露三人琴㑹當髙秋衣冠鼎足坐松下天風冷然露如灑六么腸斷苦竹宅五絃思入蒼梧野誰其洗勺笑回首意者殷勤勸杯酒不緣生逢賢聖君安得繪圖傳不朽朱翁在天吾在棷梧溪王逢在致逺西齊題左方下有希之一印軸髙三尺八寸二分廣一尺八寸一分元王淵花鳥一軸上等寒一素箋本墨畫款識云至正丁亥錢唐王淵下一印漫漶存王字左方上嶽武題云竹雲飛短夢花露浥仙翰似解蒙莊意聊同斥鷃安漳餘嶽武為介澤題軸髙二尺七寸一分廣八寸六分元郭天錫寫髙使君意一軸上等來一素箋本墨畫款識云己卯四月六日京口郭天錫寫髙使君意前署雲藏山外寺雨暗樹中村句右方上有桃里若水軒虛朗齊諸印下有神游心賞項墨林鑑賞章二印左方上有天籟閣一印下有孫誠夫氏圖書墨林江上繆昌期家藏圖書記沈周寶玩諸印又邊幅有牧翁一印軸髙二尺五寸三分廣九寸五分元顧安竹石一軸上等署一素絹本墨畫款云至正十九年三月二日顧定之寫下有顧定之印山月吟窗二印又一印漫漶不可識右方下有蕉林觀其大略二印又一印缺其半存家字左方下有半印不可識軸髙五尺三寸二分廣三尺一寸二分元顧安倪瓚合作古木竹石一軸上等往一素箋本顧安墨畫倪瓚補苔石左方中有顧定之印迂訥老人二印又張紳題並識云通元以此紙求定之翁墨君余以木丈為友詩曰白沙翠竹天新雨古屋疏林道少人季主不來徐庶缺與誰同卜嵗寒鄰雲門山樵紳上方楊維楨題云迂訥老漁久不見醉中畫竹如寫神金刀剪得蒼龍尾寄與成都賣卜人鐵戲筆右方上倪瓚題識云雲門古木龍蛇走迂訥琅玕缺風吼鐵崖健筆老縱橫萬卷缺胸隨所取張公僵卧玉山岑楊顧騎箕上南斗我來東園梅未花凍木㦸立森槎丫半醒半醉住一月柳眼漸碧草欲芽雲門屢約來看竹未聞拄杖拖氷玉開門一笑如夢中便應襆被從茲宿癸丑初月草一日雪齊示此幅並為添作一石又賦此詩以贈通元隱士倪迂右方中有鹿車一印又棠村審定蕉林二印下有元龍江一䕫印二印左方下有墨農所藏又新心賞二印軸髙二尺九寸二分廣二尺八寸八分元衛九鼎洛神圖一軸上等秋一素箋本白描畫無款姓氏見識題中右方中倪瓚題云凌波微步襪生塵誰見當時窈窕身能賦已輸曹子建善圖惟數衛山人雲林子題衛明鉉洛神圖戊申下有張則之一印左方中有蒼巗子棠村審定二印下有張羽鈞一印軸髙二尺八寸二分廣九寸九分御筆題籖籖上有乾隆宸翰一璽元朱叔重秋山叠翠圖一軸上等收一素箋本著色畫款識云至正乙巳嵗春三月五日叔重寫秋山叠翠下有朱叔重印一印右方中有翼山父印映雪齊仲章圖書山中白雲諸印下半印殘缺不可識左方下有宋承基印鳳槃賞鑑二印軸髙二尺一寸八分廣八寸二分御筆題籖籖上有乾隆宸翰一璽元黃公望鐵崖圖一軸上等冬一素箋本墨畫款云鐵崖圖大癡為廉夫畫下有黃氏子久黃公望印二印左方上唐棣跋云一峯道人晚年學畫山水便自精到數年來筆力又覺超絶與衆史不侔矣今鐵崖先生出示此圖披玩不已當為之斂袵也至正十年十月十五日吳興唐棣子華題右方上有天意子孫暹書畫記常郡周氏二印左方上有胡惟性印墨池仙史二印軸髙四尺八寸九分廣二尺三分御筆題籖籖上有乾隆宸翰一璽元王蒙竹石流泉圖一軸上等藏一素箋本墨畫款題云蕭脫翠葉復蕭蕭何處仙人吹脫簫環佩聲隨丹鳳逺碧空如水夜迢迢黃鶴山中樵者王蒙為心齊老師畫並題下有王蒙叔明黃鶴山中人二印後有僧衍題云短短風梢拂澗碨淡雲寒影暮徘徊却思林館深秋夜曾共挑鐙聽雨來僧衍又王行題識云翳有皓者唯神仙人閲彼世中孰吾之真心去夫嬰迹亡于塵因將秋興還與安仁今日鍊師出此示坐客敬夫有欲炙色師曰爾意在是耶因顧余而笑余曰師意在吾耶師不畣有筆在几遂援而書王行右方上有京麓鑑賞吳郡沈氏恆吉圖書印二印左方下有吳氏宗髙珍藏圖書子子孫孫永保其用二印軸髙二尺九寸四分廣一尺八分御筆題籖籖上有乾隆宸翰一璽元王蒙蘭亭雪霽圖一軸上等藏二素箋本墨畫款云黃鶴山中樵者作于蘭雪齊清玩下有王蒙印香光居士二印右方下有公貞吳氏公一二印又一印漫漶不可識左方下有吳奠貞印子孫永保國泰項墨林鑑賞章諸印軸髙三尺九寸廣二尺七寸元王蒙幽林清逸圖一軸上等藏三素箋本著色畫款識云至正十年九月王蒙下有王蒙印一印前署幽林清逸四字右方上有深處半印下有雲西小館一印左方下有毗陵犀辟堂書畫記一印右邊幅上有李書樓一印下有桃園書樓真藏二印軸髙四尺一寸四分廣一尺四寸七分元王蒙坡石煙篁圖一軸上等藏四素箋本墨畫款云叔明王蒙畫下有王蒙印一印右方下有元美汪氏伯玉二印又一印殘缺不可識軸髙二尺二寸八分廣八寸七分元王蒙有餘清圖一軸上等藏五素箋本著色畫款識云壬戌嵗八月望日吳興王蒙叔明為時用作前署有餘清圖四字上方有燕皓題云蔚兮山蓊兮木湛兮水陋兮屋橫琴何代人無禍亦無福燕皓和又王彥強題云茅舍臨流半掩扃覆簷竹樹有餘清久疏黃鶴山中客展卷猶能記姓名息安又孫份題云寂寂書齊坐清曉自愛雲山畫中好鶴鳴晝靜人跡稀一個茆亭傍林小兩翁相對心共閒有琴時和松風彈何省添我踞盤石放懷長嘯天地寬生還子又題識云惟名董先生得黃鶴山人所畫耕學軒圖求名缺題詩其上未缺五字時用缺二字今持贈平叔欲其想見婦翁于岩缺之中意亦厚矣詩以志之人去畫猶存重携過小軒畫中無限意欲與阿誰言左旋讀未署名下有雲軒一印右方下有子安珍藏記吳希元印二印左方下有程因可氏收藏鑑賞章一印詩塘題句云英英東山雲萋萋南浦草子期招不來伯牙坐中老絃琴為誰彈知音絶傾倒有懷輸以寫浪說被花惱黃鶴人中英千軍筆能掃辭采紹吳興煜煜麗文藻悠然寫斯圖清芬逼晴昊徐披挹餘清見事苦不早山水有佳趣長缺懷綺皓未遂賦歸來惄然心如缺後署恆菴二字軸髙二尺三寸九分廣一尺三寸七分元倪瓚疏林逺岫圖一軸上等閏一素箋本墨畫款識云壬子嵗七月五月雲林子寫又題云屋角春風多杏花小齊容膝度年華金梭躍水池魚戲彩鳳栖林澗竹斜亹亹清談霏玉屑蕭蕭白髮岸烏紗而今不二韓康價市上懸壺未足誇甲寅三月四日檗軒翁復攜此圖來索謬詩贈寄仁仲醫師且錫山豫之故鄉也容膝齊則仁仲燕居之所他日將歸故鄉登斯齊持巵酒展斯圖為仁仲壽當遂吾志也雲林子識右方下有舊來鑑定顧氏書畫圖記二印軸髙二尺二寸七分廣一尺一寸六分御筆題籖籖上有乾隆宸翰一璽元倪瓚清閟閣圖一軸上等閏二素箋本墨畫款題云家在梁溪􅀈底之里以泥水自閉柴門掩于白日䔧牀穿而未起棐几如練甌香若空傳缺書淫聊以卒嵗云爾戲效董體寫其幻而賦之干木淒肥蔭草廬芙蓉山下是儂居橫塘一夜來春漲髙閣蕭然讀我書壬子四月十又七日雲林子右方下有正葵印一印左方下有程大本印嘉客南垞三印軸髙三尺四寸廣一尺三寸七分元倪瓚楓落吳江圖一軸上等閏三素箋本墨畫款題云楓落吳江獨詠詩九峯三泖酒盈巵楊梅鹽雪調氷碗夏簟開圖慰所思至正丙午秋永貞架閣自吳城復還吳淞之袁部場因寫此圖贈别又為之詩瓚左方上有王汝玉題云清閟髙人一散仙尚留遺墨世間傳當時曽寫相思意誰信如今重惘然吳下王汝玉右方下有太原王氏長安二印軸髙二尺九寸二分廣一尺五寸一分元倪瓚松林亭子圖一軸上等閏四素絹本墨畫款題云亭子長松下幽人日暮歸清晨重來此沐髮向陽晞至正十四年初冬倪瓚為長卿茂異寫松林亭子圖並詩其上右方上有潘純題云山中舊茆屋見此忽思歸最愛長松上朝陽露未晞潘純次韻右方下有四佳昌黎世家二印左方下有王廷稱印一印詩塘有董其昌跋云雲林松林亭子猶是董源的𣲖為中年用意筆董其昌題軸髙二尺六寸廣一尺六寸四分元倪瓚春雨新篁圖一軸上等閏五素箋本墨畫款題云今朝姚合吟詩句道我休糧帶病容缺贈湘江青鳳尾相期往宿最髙峯辛亥秋寫竹梢並詩奉贈次宗徴士瓚右方中有題句云哭君我有淚淋漓正似湘江雨後枝憶得秋聲夜同聽蕭閒館裏對牀時後署本字左方上有題句云缺二字處士氷雪姿愛寫秋林最老枝直作龍吟起風雨硯泓吸灑墨淋漓後署湜菴又題句云綺窗晝寂自焚香十日春陰不下堂幾度吟成微醉後興來拈筆寫修篁後署立菴又句題云不見髙人倪幼霞流傳遺墨尚清華鳳毛影落湘江水春雨新梢整復斜後署謨字下方題句云春江低唱竹枝歌春雨蕭蕭傍竹多欲借淇園一竿玉桃花磯下釣寒波後署筠軒又葉著題云先生清氣逼人寒愛寫森森玉萬竿湖海歸來已蟬蛻一枝留得後人看葉著又梁時題云江鄉處處憶陪遊見寫湘林數葉秋今日仙魂乘鶴去獨留遺墨動人愁梁時又題識云魯望宅前湖水深湖風吹雨秋陰陰蓬窗溫酒斫鱸鱠醉聽竹枝歌楚音右雲林倪先生所畫竹梢近代之絶作也雖宋之文蘇元之髙李其法度高妙風韻超逸則此作又不在乎下矣余友繼善徴士好學嗜古持此為贈後署禋字右方下有汪養用珍藏印一印右邊幅有棠村審定蕉林二印軸髙二尺二寸二分廣一尺二寸元倪瓚桐露清琴圖一軸上等閏六素箋本墨畫款題云暮投齊館靜城郭似幽林落月半牀影涼風鳴鶴音汀雲縈逺夢桐露濕清琴卑喧淨塵慮蕭爽集沖襟至正癸未嵗八月雲林子倪瓚上方顧愚題云南枝有髙士乃在延陵東拂石坐蘿月絃琴寫松風焚香誦黃庭望雲送歸鴻乘興畫滄洲古人未為工干戈攘末路白首遂飛蓬名山乖始願羈遊無所終流俗輕髙賢貧賤困豪雄孤鳳混雞羣野鶴摧樊籠豈乏梁伯鸞不聞臯伯通吾將傳遺逸清芬千載同洪武庚戌春仲雪軒老人顧愚題又楊維楨題云古木巃嵸鴻爪細篠參差鳳翎尚憶雲林堂下幾株蒼石苔青老鐵題又識云往過雲林君山堂虛敞竹木蔭翳每于惠風佳日輒有禇墨合作覽其蕭散恬適或經旬始就或瞬刻數幀令人俯仰盡意今從玉霄遊矣梧亭槲院杳不可尋煙雲過眼輒為惋悵盡日不復能喚奈何惜哉後署空菴老人識右方上有退密若水軒子京所藏三印下有希之子京淨因菴主墨林祕玩諸印左方中有墨林子平生真賞二印下有吏隱歸來項元汴印子京父印子孫世昌鳳字物外元賞楞巖精舍諸印又二印漫漶不可識軸髙二尺八寸廣九寸六分元倪瓚古木竹石一軸上等閏七素箋本墨畫款題云篝燈共聽蕭蕭雨已是摧花二月過翠竹喬柯渾漫興斫山忽覺蘚文多至正三月三日雨宿無礙方丈元璞長老命寫竹石寫已並賦倪瓚左方中任賀題云林石蕭蕭聽雨時為摹清祕閣前枝倪迂仙手今何在東海投竿掣巨緇翠屛道人右方上有神品項元汴印墨林山人三印下有子京父印墨林山人二印左方上有項墨林鑑賞章方和徐氏元玉墨林諸印下有墨林祕玩一印軸髙一尺五寸四分廣九寸二分元倪瓚孤亭秋色圖一軸上等閏八素箋本墨畫款題云七月一日風雨急旁作集桐里湖邊吟夕涼蕉旁作柳葉滴愁旁作顰煙籠翡翠荷花迷睡旁作濺淚鎖鴛鴦却疑身在瀟湘渚且著舟停雲錦鄉笑旁作顧我雖旁作自非徐孺子陳蕃旁作煩君下榻更銜觴七月一日留昌言髙尚書堂戲寫此圖并賦贈焉瓚壬子下有雲林子一印右方上有項字一印下有項篤壽印一印左方下有平生真賞一印右邊幅有蒼巗子蕉林居士二印軸髙二尺廣八寸四分元倪瓚修竹圖一軸上等閏九素箋本墨畫款題云二月六日夜宿幻住精舍明日寫竹枝遺無學上人并賦長句春水蒲芽匝厈生閶門山色上衣青出郊已覺清心目適俗寧堪養性靈花落鳥啼風嫋嫋日沉雲碧思冥冥禪扉一宿聽魚鼓喚得愁中醉夢醒無住菴主寶雲居士懶瓚甲寅上方張紳題云窗前疏雨過石上晚雲生不是雲林叟無人有此清門山居士紳又王汝玉題云瘦倚清風玉一枝滄溟回首已塵飛三生石上因緣在應化遼東白鶴歸青城山人王汝玉又有題句云曉出閶門道西山滿意青金壺有遺墨寫得鳳皇翎後署東皋妙聲又題句云以墨畫竹以言作贊竹如泡影贊如夢幻即之非無覔之不見謂依幻人作如是觀後署丁巳逃虛子戲語七字二則俱左旋讀右方上有墨林子京所藏二印下有子孫永保平生真賞子京父印項墨林鑑賞章諸印左方上有退密項元汴印淨因菴主三印下有㩦李項子京家珍藏二印詩塘有杜堇題云記得曾攜枕簞游葑溪溪上草堂幽北來誰識賢君子歸卧江南煙雨秋柳居杜堇又吳寬題云寫竹仍題句僧房一宿淹如何書甲子猶學晉陶潛鹿場居士寬軸髙一尺五寸八分廣一尺七分元倪瓚秋亭嘉樹圖一軸上等閏十宋箋本墨畫款題云七月六日雨宿雲岫翁幽居文伯賢良以此紙索畫因寫秋亭嘉樹圖並詩以贈風雨蕭條晚作涼兩株嘉樹近當窗結廬人境無車轍㝢跡醉鄉真樂邦南渚殘雲宿虛牖西山青影落秋江臨流染翰摹幽意忽有衝煙白鶴雙瓚右方下有白衣人一印左方中有商邱宋犖審定真蹟第一希有朱之赤鑑賞諸印詩塘有吳寬題識云千年霜月積靈氣給入倪郎手與心一掣便歸天上去人間留影尚森森雲林此幅與其詩皆精妙蓋其得意筆也漫為題之吳寬又朱果題云雲林漫寫雲林意筆底縱橫妙入神多少洛陽騎馬客千年空作草間塵朱果軸髙三尺五寸二分廣一尺六分元倪瓚畫竹一軸上等閏十一宋箋本墨畫款題云雨後空庭秋月明一枝窗影墨縱橫沈君雅有臨池興蕭灑濡毫意自清雲林子寫晴梢并詩贈日章貞士七月草一日軸髙二尺七分廣一尺二分元吳鎮竹石一軸上等餘一素箋本墨畫款識云梅花道人學竹半生今老矣歷觀文蘇之作至于真蹟未易得獨錢塘鮮于家藏脫堵一枝非俗習之比力追萬一之不及何哉蓋筆力未熟之故也如此友人出此紙索勉為之以為他年有鑑賞之士方以愚言之不謬也至正七年丁亥初冬作于檇李春波之客舍下有梅花菴嘉興吳鎮仲圭書畫記二印左方下有徐樹藩印一印軸髙二尺八寸二分廣一尺三寸五分元盛懋秋林蕭散圖一軸上等成一宋箋本墨畫款識云己丑仲春四日武唐盛懋子昭作秋林蕭散下有盛懋子昭二印昭字微缺右方上有題句云坡頭石子擁蒼頑隱隱疏林見逺山猶有晉人風度在悠然孤立賞清閒後署伯成二字軸髙二尺四寸廣九寸二分上方御題詩云佳蔭之下鋪芳蘅是何處兮曰蓬瀛青鸞白鶴兩不藉