  text: 欽定四庫全書石渠寶笈卷四十四
  hash: sha256:0e641e77892f32c55aab5b79b38fe687e9051ab3ab9af86deb75f70737392c27
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_090-1a, image: WYG0825/WYG0825-0626a.png}
body:
  text: 貯翠雲館列朝人書冊上等明王寵臨帖二冊書卷上等元趙孟俯書絶交書一卷畫卷上等明董其昌關山雪霽圖一卷明董其昌疏林逺山圖一卷貯潄芳齊國朝人畫冊上等王翬山水一冊列朝人畫卷上等宋李迪牧羝圖一卷元錢選秋江待渡圖一卷元盛懋江楓秋艇圖一卷貯靜怡軒列朝人畫卷上等晉顧愷之畫女史針一等宋李公麟蜀川圖一卷宋李公麟九歌圖一卷宋李公麟瀟湘卧遊圖一卷貯三友軒列朝人畫卷上等宋元梅花合卷一卷元曹知白十八公圗一卷元人君子林圖一卷
  hash: sha256:ce36185eba51fa26bdd930514fb673799d63a48b1e857dfc63e6973dc6d8d5cb
