body:
  text: 貯翠雲館列朝人書册上等明王寵臨帖二册書卷上等元趙孟俯書絶交書一卷畫卷上等明董其昌關山雪霽圖一卷明董其昌疏林逺山圖一卷貯潄芳齋國朝人畫册上等王翬山水一册列朝人畫卷上等宋李迪牧羝圖一卷元錢選秋江待渡圖一卷元盛懋江楓秋艇圖一卷貯靜怡軒列朝人畫卷上等晉顧愷之畫女史針一等宋李公麟蜀川圖一卷宋李公麟九歌圖一卷宋李公麟瀟湘卧遊圖一卷貯三友軒列朝人畫卷上等宋元梅花合卷一卷元曹知白十八公圗一卷元人君子林圖一卷
