front:
  text: 欽定四庫全書石渠寶笈卷七
  hash: sha256:75d52ccaf82c9193aff0802a33485bed822c3f936b46752dd3cd0d2da45450e5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_017-1a, image: WYG0824/WYG0824-0212a.png}
body:
  text: 貯乾清宫七列朝人書軸上等宋朱子書題懸崖水詩一軸上等天一素箋本行草書後署右懸崖水四字下有晦翁朱熹之印二印右方上半印不可識軸髙三尺九寸廣九寸元趙孟俯書七言律詩一軸上等地一素絹本行書款署子昻下有趙氏子昂一印軸髙三尺三寸八分廣九寸八分元趙孟俯書七言律詩一軸上等地二素絹本行書款署松雪道人下有趙氏子昻一印軸髙五尺四寸九分廣一尺六寸七分元趙孟俯書七言律詩一軸上等地三素絹本行書款云翰林趙孟俯子昻筆下有趙氏子昻一印軸髙四尺六寸廣一尺六寸一分元趙孟俯書師說一軸上等地四素絹本行楷書款識云至大丙午二月草五日胡汲仲提舉學士持東絹乞書于余汲仲與余為契友情意有在故連書四軸不自知其倦也吳興趙孟俯下有松雪齊趙氏書印二印右方下有趙字一印幅中有墨妙連印軸髙五尺六寸二分廣一尺七寸二分元張雨書七言律詩一軸上等元一宋箋本行楷書款識云暮春望日適書此而雲林攜酒澗阿喜劇因記之耳張雨下有張雨私印句曲外史二印右方上有貞居一印押縫有阿爾喜普之印東平二印右邊幅有也園索氏收藏書畫一印軸髙三尺二寸一分廣九寸三分明董其昌書飲中八仙歌一軸上等黃一灑金粉箋本行書款識云賀監一見太白稱為謫仙人觀其鑑湖一曲何減東門二疏明皇首唱寵行千載盛事後世及有皓首戀闕黜逐方去者仙凡之隔如弱水三千里矣飲中八仙以知章為冠以此其昌乙丑五月望書下有宗伯學士董氏元宰二印又晴嵐珍藏印一軸髙四尺六寸八分廣一尺一寸五分明董其昌臨顔真卿書一軸上等黃二素箋本節臨送劉太冲序六句款識云臨顔魯公其昌下有宗伯學士董𤣥宰二印軸髙二尺八寸一分廣一尺三分明董其昌節書月賦一軸上等黃三素箋本楷書月賦四句款識云為彥采詞文書其昌下有董其昌印大宗伯印二印軸髙三尺一寸六分廣一尺九分明董其昌書周美成詞一軸上等黃四宣德箋烏絲闌本楷書款識云周美成夏景隔浦蓮詞壬申仲夏之望其昌下有宗伯學士董氏元宰二印又孫耆珍藏一印軸髙二尺六寸八分廣一尺三寸三分書軸次等宋蘇軾書滿庭芳詞一軸次等天一素絹本大楷書款識云調中吕滿庭芳元祐六年十月二日眉山蘇軾書邊幅有匪懈堂跋一又張英勵杜訥胡㑹恩史䕫顧藻孫嶽頒張廷瓚陸肯堂强國忠葉長芷諸跋元趙孟俯書五言律詩一軸次等地一素絹本行書款署子昻元趙孟俯臨帖一軸次等地二素箋本臨王羲之隔日帖款識云至大二年九月草五日子昻臨於松雪齊元趙孟俯書太極圖說一軸次等地三素絹本凡二幅上幅圓光繪圖下幅書太極圖說款識云延祐二年四月草五日後學趙孟俯書明祝允明書仰山堂銘一軸次等元一素箋本楷書款識云𢎞治十三年八月既望鄉貢進士長洲祝允明著前署仰山堂銘四字明文徵明書七言律詩一軸次等黃一素箋本行楷大書款署徵明明文徵明書七言絶句一軸次等黃二素箋本行書款署徵明明董其昌書李白宫詞一軸次等宇一素絹本行書款署董其昌明董其昌書五言絶句一軸次等宇二素綾本行書款云其昌書明董其昌書五言絶句一軸次等宇三素綾本行書款云董其昌書明董其昌書七言絶句一軸次等宇四素綾本行書款署董其昌明董其昌書七言絶句一軸次等宇五素綾本行書款署其昌明董其昌書七言絶句一軸次等宇六素綾本行書款署董其昌國朝人書等上軸沈荃臨米芾書一軸上等天一素箋本行書臨苕溪詩一首款識云辛酉夏五沈荃下有沈荃之印掌詹宗伯學士二印右方上有承恩堂一印軸髙八尺一寸九分廣三尺四寸五分張英書七言律詩一軸上等地一素綾本行楷書款云翰林院掌院學士臣張英軸髙五尺五寸二分廣一尺六寸五分陳奕禧書七言截句一軸上等元一素綾本行書款署奕禧下有陳奕禧印六謙二印右方上有御賜日巖一印軸髙四尺二寸二分廣一尺四寸五分張照臨董其昌書柳公權蘭亭詩帖一軸上等黃一灑金箋烏絲闌本行書款云張照謹臨下有張照瀛海仙班法華庵三印軸髙三尺五寸九分廣一尺七寸八分陳邦彥書盛京賦一軸上等宇一素絹烏絲闌本小楷書御製盛京賦款云臣陳邦彥敬書下有臣邦彥學書二印軸髙三尺二分廣一尺四寸三分書軸次等劉若宰書墨菊詩一軸次等天一素綾本行草書款署劉若宰沈荃臨顔真卿書一軸次等地一素綾本臨送劉太冲序款云臨顔平原沈荃石渠寶笈卷七
