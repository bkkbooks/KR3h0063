  text: 欽定四庫全書石渠寶笈卷二十九
  hash: sha256:26ac084b6d918df26058dc346afabcb3a1b674a346664c621b559f789c2239b9
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_061-1a, image: WYG0825/WYG0825-0171c.png}
body:
  text: 貯御書房二列朝人書卷上等晉王羲之二謝帖一卷上等天一素箋本行書計七十六字後署羲之頓首下有嚴澤之印有明文靖世家圖書二印前隔水有宋司徒兼侍中魏國公晝錦堂永傳于家一印押縫有明文靖世家圖書印凡二下一印倒用後隔水有康成懋勳桂坡安國賞鑑諸印又臣字半印拖尾趙抃記云熙寧九年十一月十四日趙抃閲道越州清思堂之西至樂齋觀前有桂坡安國賞鑑一印又蘇頌跋云右軍真迹近世漸少觀二謝帖紙札尚完殊可愛也按貞觀目録洎淳化法帖皆缺一字收此豈當時為好事者祕藏不出耶熙寧丙辰冬至日丹陽蘇頌子容餘杭郡西閣題又記語云假守徐師回丁巳仲春十日覽之郡倅朱正民同觀熙寧九年七月六日書又會稽關景暉五字又存中熙寧九年五月草五日三司北軒觀十六字華陽王仲修觀六字旁注云丙辰仲夏旦日又崔彥博記云清河崔彥博唐公元豐乙丑五月望日觀於西安縣東齋又何世昌記云朝儀大夫致仕何世昌元祐二年八月十七日觀於衢州衙之大廳又武夷范鏜觀五字下注云元祐二年八月十有七日三衢龜峰廳筆又崔希仲跋云右軍書法萬世所宗昔人稱歐虞之體謂如壯士美人者但能精於一偏尚能傳之後代而況得其全者哉是知此字當使好事者寶之也元豐乙丑五月望日西安縣齋丹陽崔希仲德舉題東陽鄭汝賢無伐同觀又曹輔跋云貞觀尤愛右軍書訪求殆盡其後並葬昭陵今所存法帖人皆謂哀疚之問故不復進上得傳於後豈其然乎此書亦然又法帖之所遺也當用墨錦玉軸重裝以遺子孫寶之海陵曹輔子方信安郡齋書又記語云曹使君借玩出示通守郭庭誨與觀者五人林師醇醇仲余廙肅之梁秉文憲古林季淵萬宗葉常權之紹聖五年三月二十日又劉欽止跋云元符二年季秋九日鄭子猶出此帖於滎陽尉舍以示余因得以觀右軍筆畫之妙第有嘉歎而已吳興劉欽止純祖書又李炳記云樂安李炳崇寧元年十二月初九日滎澤思軒敬觀又記語云張子和髙適正梁濟道李晦叔母仲山同觀於陳留大觀元年五月草日後有喬氏半印又桂坡安國賞鑑一印又文嘉跋云右軍書唐貞觀間所收至三千餘軸當時人間已無藏本至宋淳化刻石祕閣及宣和聚所藏草書章草正行共二百四十有三而蘇子容謂貞觀目録淳化法帖皆不收此疑為好事者所祕而曹子方又謂哀疚之問不以上進其説俱是然子又考宣和書譜草書中亦有二謝帖而此本前無御書籖題後無內府圖書及諸縫印則是亦未嘗入宣和內府也今真迹之傳世及余所目覩者草書則有袁生帖平安帖破羌帖思想帖章草則有豹奴帖行書則有書鍾繇千文近又見其草書雨後帖諸帖惟平安豹奴是絹本餘皆紙本此本紙色與破羌絶相類而跋語多宋之名人破羌不及也此帖今藏錫山安氏者四世矣萬厯三年仲秋為安茂卿題茂苑文嘉又王稚登跋云右軍書余所見不下二十餘本唐人橅者十七襄陽父子橅者十九真迹寥寥不能一二此二謝帖與破羌皆神采半埋風骨不露如吕先生遊嶽陽獨行獨坐非城南老樹精孰測其袖有青蛇哉袁生豹奴而下不有若即虎賁所謂本初之徒安足數耳茂卿四世之藏此當為赤刀銀甕今將北征慎無携之度江淮涉汶泗恐不免為天吳紫鳯諸水族所睥睨請篋而藏諸白榆閣中丁酉四月十日王稚登題又俞安期跋云余每過茂卿必索此卷展玩屬饜乃罷乙巳茂卿捐館舍此卷與壑舟同移其叔司封小范亟索之始得溝竇中嗟乎此安氏四世所藏之物前人手澤猶潤何忍使蒼頭奴歸之别主小范一時之索豈在天之靈默主而使之耶又明年六月過茂卿悉陳所藏再展一過小范命余援筆識其事震維居士俞安期諸跋中押縫喬氏玩閲印桂坡安國賞鑑印各三印卷髙八寸三分廣九寸一分晉王獻之中秋帖一卷上等地一素箋本行草書計二十二字後小楷書君倩二字有乾卦御書紹興廣仁殿四璽又宣和紹興二璽俱缺其半又神品𢎞文之印賢志主人墨林項元汴印諸印又三印俱漫漶不可識又半印存印字前押縫有子京所藏墨林祕玩子孫永保諸印後押縫有退密平生真賞項子京家珍藏項墨林鑑賞章諸印前隔水晉王獻之中秋帖七字按係宋髙宗書有宣和半璽又墨林懶叟鴛鴦湖長神竒墨林硯癖諸印又二印漫漶惟真迹之印四字可辨押縫有項墨林父祕笈之印宫保世家妙無以加諸印後隔水有內府圗書之印一璽又蘧廬子京珍祕項叔子檇李項氏世家寶玩仁哲私印平生真賞申胤登印繩武之印王延世印墨林項季子章宫保世家諸印又半印不可識押縫有退密墨林山人神逰心賞項子京家珍藏部曲將印天籟閣博雅堂寶玩印項墨林父祕笈之印項子京氏吳廷私印子孫世昌田疇耕耨諸印拖尾董其昌跋云大令此帖米老以為天下第一子敬書又名為一筆書前有十二月割等語今失之又慶等大軍以下皆闕余以閣帖補之為千古快事米老嘗云人得大令書割剪一二字售諸好事者以此古帖每不可讀後人強為牽合深可笑也甲辰六月觀於西湖僧舍董其昌題又記云閣帖已至也分張可言止係此後今離而為二自余始正之刻之戲鴻堂帖又項元汴跋云晉王獻之字子敬羲之第七子官至中書令清俊有美譽而髙邁不羈風流藴藉為一時之冠方學書次羲之密從其後掣其筆不得於是知獻之他日當有大名後其學果與羲之相後先獻之初娶郗曇女羲之與曇論婚書云獻之善𨽻書咄咄逼人又嘗書樂毅論一篇與獻之學後題云賜官奴即獻之小字獻之所以盡得羲之論筆之妙論者以謂如丹穴鳯舞清泉龍躍精密淵巧出於神智梁武帝評獻之書以謂絶妙超羣無人可擬如河朔少年皆悉充恱舉體沓拖不可耐何獻之雖以𨽻稱而草書特多此十二月帖未審其由割去前行又稽諸米元章寶章録止存此數字乃大令得意書歷代傳寶今散落南北不知凡幾家適復至於此信天下至寶當神護汴也重值購藏永為書則雖威武聲勢不可畏而授與是亦從吾所好也來裔豈可以易而忽之須世守斯可矣墨林項元汴敬題跋中押縫有寄傲墨林祕玩項子京家珍藏諸印卷髙八寸四分廣三寸六分幅後上方御筆小楷書如印印泥四字上鈐乾隆御賞一璽引首御題至寶二大字上有乾隆宸翰一璽御筆題籖籖上有乾隆宸翰一璽唐褚遂良臨王獻之飛鳥帖一卷上等元一素箋本楷書款云臣褚遂良臨卷末記語有項元汴珍祕五字卷前有神品鳯字項元汴印子京所藏項孔彰項聖謨子京珍祕項墨林鑑賞章諸印又半印二漫漶不可識卷後有應召蘭雪齋沮溺之儔神竒項元汴印墨林硯癖子孫世昌子固彛齋東郡家藏子京所藏項元汴印墨林項季子章神品子京珍祕項氏孔彰心賞祕印諸印又紹興一璽又半印不可識前隔水有藎臣子孫永保平生真賞楞嚴精舍官保世家蘧廬諸印押縫有應召珍藏歐陽元印子孫永保項墨林父祕笈之印諸印後隔水有幻浮有何不可平生真賞應召檇李項子京家珍藏檇李項氏世家寶玩香巖居士子孫永保諸印押縫有墨林子天籟閣墨林堂桃花源裏人家諸印拖尾柯九思跋云古褚河南臨大令飛鳥帖唐人所摹具有元常遺法足以知字畫源流之有自也况絶無宋人氣是唐無疑耳奎章閣學士院鑒書博士柯九思跋前有退密項氏子京項墨林父祕笈之印項元汴氏審定真迹藎臣諸印又為好半印後有項子京家珍藏寄傲子京父印項叔子項墨林鑑賞章諸印又王守誠記語云至正二年夏五月十有九日左司貟外郎闕里孔思立左司都事上黨李獻同觀中書參議趙郡蘇君所藏唐臨晉帖於上都省中右司郎中太原王守誠題後有項氏孔彰心賞祕印檇李墨林山人平生真賞子孫世昌應召珍藏諸印押縫有墨林子項元汴印子孫永保寄傲子京父印宫保世家應召珍藏諸印最後有項元汴記語云有唐褚遂良臨晉王大令獻之飛鳥帖項元汴真賞卷髙六寸九分廣一尺四寸七分御筆題籖籖上有御賞乾隆宸翰二璽唐褚遂良書倪寬傳贊一卷上等元二素箋烏絲闌本楷書款云臣褚遂良書卷前半印二存印字圗書記三字又半印二不可識卷後有韓逢祐印蕉林梁氏書畫之印家在北澶古泰和楊士竒圗書記俠如陳以御陳定書印朝延子家藏韓逢禧印諸印又士竒楊氏半印二又半印二不可識中幅押縫有楊士竒氏一印前隔水有梁清標印河北棠村二印後隔水押縫有安定棠村二印拖尾趙孟堅跋云河南三龕孟法師二刻早年所書房公喬聖教記序長安同州本並晚年書此倪寬贊與房碑記序用筆同晚年書也容夷婉暢如得道之士世塵不能一毫攖之觀之自鄙束縛於毫楮間耳諸王孫趙孟堅子固書又跋云羣玉帖中帝京篇贋迹可笑蓋枯且露矣河南晚年書雖瘦實腴孟堅又云前有韓逢禧一印又之印家藏齋字半印三又半印不可識又鄧文原跋云文原曩在史館獲覩褚河南書今見此帖恍若久别而復覩其風儀也泰定四年秋分日鄧文原識又栁貫跋云褚河南漢倪寬贊正書三百四十字中刮去五字蓋宋國諱也河南書豈待贊而顯子固所謂容夷婉暢者殆得之矣至順四年閏三月草四日栁貫識又楊士竒跋云評者論河南書字裏金生行間玉潤法則溫雅美麗多方觀此贊真不虛也吾求數嵗始得之謹珍襲之吾先世蓄河南書廉頗藺相如而下數十傳節文終以優孟遭世兵亂家隳于寇此書散落人間雖或見之力不能復後亦莫知存否舉家為憾平洲府君及劉子髙先生之文具著其事故覽此益重先世之感正統七年五月既望廬陵楊士竒謹識後有子孫世保蕉林鑑定二印又錢溥跋云唐文學館學士褚遂良嘗為文皇臨羲之蘭亭帖最多然喜作正書其磨崖孟師聖教等帖亦世著聞嘗得見之獨此倪寬贊未之見也婉麗清徑尤非諸帖所及廬陵楊文貞公之子叔簡寶藏先愛久矣展玩之頃敬書此歸之成化乙未冬東吳錢溥謹題後有蒼巖子蕉林祕玩觀其大略三印諸跋中押縫有楊士竒氏士竒之印蒼巖子三印卷髙七寸七分廣五尺二寸七分唐陸柬之書文賦一卷上等黃一素箋本行楷書按通卷剝􅝚十四字無款姓名見跋中卷首有孫氏珍玩真逸山房傳家諸半印卷後有河東李倜士𢎞章員嶠真逸擬晉山房忠信傳家諸印又一印不可識卷中幅押縫員嶠真逸河東李倜士𢎞章孫氏印各七引首李東陽篆書二陸文翰四大字款署西崖又沈度𨽻書陸機文賦陸柬之書八大字欵云華亭沈度𨽻古拖尾孫承澤跋云陸司諫所書文賦全摹禊帖而帶有其舅氏虞永興之員徑遂覺韻法雙絶唐初諸公倣晉率涉板直如此妙腕未見其匹趙文敏晚年書法全從此得力人鮮見司諫書遂不知文敏所自來耳北平孫承澤記又趙孟俯跋云右唐陸柬之行書文賦真迹唐初善書者稱歐虞褚薛以書法論之豈在四子下耶然世罕有其迹故知之者希耳大德二年十二月六日吳興趙孟俯跋後有北平孫氏硯山齋圗書一印又李倜跋云唐陸柬之書世不多見惟張繡江參政家蘭亭詩馬德昌左司家蘭若碑與此文賦三卷而已其筆法皆自蘭亭中來有全體而不變者識者知之耳大德辛丑二月八日員嶠真逸河東李倜士𢎞題又歐陽元跋云中書辨章良公成甫家所收藏唐陸柬之文賦帖真名墨也柬之本虞世南甥書法得於渭陽而神俊過之第傳世極少故為艱得李圎嶠所見張繡江家蘭亭詩不知何自近年亦有一本轉至吾家其詩不全蓋後人拆散而出售者歟今經赭冦之亂焚蕩不存方重惋惜因觀此帖筆勢翩翩相類令人神情惘然但李公謂其書變態不同此正東之妙處近代米元章書矯亢跌宕世咸稱其自創一法乃不知其全學柬之頭陀寺碑耳元章祕而不言以陸書少傳於世也吾家蘭亭詩後有頭陀寺碑墨本數行昔人重其書隨所得多寡而著存之若文賦纍千百言當為方今陸帖第一至正丁酉閏月十八日廬陵歐陽元跋又揭徯斯跋云右陸柬之行書文賦一卷唐人書法結體遒徑有晉人風格者惟見此卷耳雖若隋僧智永猶恨嫵媚太多齊整太過也獨於此卷為之三嘆至元四年嵗在戊寅三月十六日揭徯斯跋李倜又跋云近觀絳帖有陸書得告草五字筆法意韻與此書全不相類其他書又與此並看雖點畫參差亦各有妙處故晉唐能書者斷不如印板一一相似政要如浮雲變化千態萬狀一時之書一時之妙也識者知余言之不妄大德乙巳秋九月既望於夀春郡齋重題士𢎞又有曺氏寶藏一印又子孫保之一印又危素跋云素久從平章公治農事公薨之後獲覩家藏陸氏文賦豈勝悲惋正卿其寶襲之至正草一年五月壬戌臨川危素書又宋濂跋云唐人之書論者以其臨晉往往少之殊不察其變化之妙也柬之此筆神俊超詣尤非諸家所能及歷世既久乃獲覩之是猶拾驪珠於煨燼者也識者尚慎藏之洪武八年三月既望之五日金華宋濂書於玉堂之署又劉基跋云晉陸之詞唐陸之書可謂二美具矣撫卷三嘆遂識之洪武八年春三月草六日誠意伯劉基題又董琰跋云古今善書者法同而體異論者不此之察特以其偃仰屈伸方圎髙下之態而進退焉此正後世臨書之病也晉唐來以書名家者多矣未嘗一一相似由其法雖同而結體不同故也柬之此書精神遒徑趙文敏謂其不在歐虞褚薛下揭文安謂其有晉人風格者是已或者以為其學得於渭陽而筆勢全不相類者蓋知其然而不知其所以然也琰昔自巴蜀回舟中見燕客所藏羲之樂毅遺燕惠王書墨迹愛其如金繩鐵索珊瑚玉樹而莫名其妙徒往來於懷者數年及聞海岱謝養民論書法思見前所見者不可復得矣今觀柬之之筆則向者夢寐之想釋然於中益信書法之有自矣惜乎知之者寡而好之者尤寡也是書流落滇南蓋有年矣未見知而好之者金川缺四字購而得之不啻獲重寶非好之深者能若是乎嗚呼金玉之重富貴之樂田宅園池之勝孰不好之然未有歷千百年而能存者是書自唐迄今其間人事之變不知其幾而猶獲見之非可寶者歟繼今為缺二字之後者尚珍襲之可也洪武三十一年嵗在著雍攝提格孟夏之月臨川董琰書又謝觀跋云同邑缺三字氏銜卷詣豫曰此唐陸柬之所書士衡文賦近遊滇南得之將襲而東歸以為家玩幸留一言共傳永久豫觀書法多自蘭亭中來真超逸神俊有非唐臨晉帖者所可同然唐初以書名家則虞歐褚薛惜陸書世不多見故未得與四子並稱以識者觀之當無優劣其戈波之法雖得於虞祕書而變化不拘結搆自成一體殆有逼於永和遺迹者矣宜為相府珍藏諸名公題跋及歷考評以為陸帖第一今缺二字嗜書以其可法挾之歷萬里畏途歸至山房靜中臨玩毋拘點畫形似求其瀟灑風神異日臨池有得必將如米襄陽於頭陀寺碑又豈徒祕玩而已哉玉笥謝觀跋後有間崖寶玩一印又曺倣跋云歐陽公作李晸筆説云唐所謂歐虞褚薛至於顔栁皆自名家以陸書少傳於世及或以歐虞褚薛為疑又附柬之書學品第之詳其子之亦深矣今觀所書陸機文賦真有晉人風格較之蘭亭臨本果孰右耶子昻李士𢎞皆號善書者鑒定之餘稱許不已余於是益知柬之書法之妙但寶之勿失存乎其人為吾後者慎諸京口曺倣識跋中押縫有圎嶠真逸河東李倜士𢎞章二印卷髙八寸廣一丈一尺一寸御筆題籖籖上有御賞乾隆宸翰二璽唐孫禮虔書譜一卷上等宇一素箋本草書卷前款云吳郡孫過庭撰有半印三俱不可識卷末自識云垂拱元年寫記上鈐一印漫漶不可識後有蒼巖一印又半印二俱不可識卷中幅押縫印俱殘缺不可識前隔水籖書唐孫過庭書譜序七字按係宋徽宗書有雙螭宣和二璽又蒼巖子觀其大略二印又一印漫漶不可識又一印缺其半存氏珍藏書畫印六字後隔水有政和宣和二璽押縫有北海孫氏珍藏書畫印一印拖尾有梁清標印蕉林祕玩二印卷髙八寸五分廣二丈八尺七分御筆題籖籖上有乾隆宸翰一璽唐孫虔禮書景福殿賦一卷上等宇二素箋本草書卷前署何平叔景福殿賦七字無欵姓名見跋中卷末項元汴記語云萬歷癸未仲春望墨林山人項元汴手裝於天籟閣永存珍賞下押字一又曽肇跋云書家評孫過庭章草用筆雋拔如丹崖絶壑筆勢堅徑豫不能無疑觀此帖用筆稽古有漢魏之風終卷結字無點畫差謬書賦云千紙一類一字萬同蓋知非虛談也近見王內翰所書書譜真迹與此賦極相類又有墨本千文差不逮矣建中靖國元年春三月曽肇題於玉堂之西軒又張孝思記語云嵗在甲申孟春懶逸張孝思藏卷前有神品項元汴印項墨林父祕笈之印項墨林鑑賞章墨林祕玩項子京家珍藏神竒諸印又半印漫漶不可識卷後項元汴印凡四又退密張覲宸虛朗齋子京父各二印又項墨林鑑賞法書名畫項子京家珍藏項墨林鑑賞章檇李項氏世家寶玩若水軒子孫世昌西疇耕耦懶逸張則之蔬菊老人韓松書印子孫永保墨林子淨因菴檇李墅處張孝思寄傲博雅堂寶玩印項叔子宜子孫世外法寶諸印又一印不可識卷中幅押縫莆劉篔谷圗書珍玩印張則之印各七印項氏子京子京珍祕各二印又張孝思有何不可懶逸項叔子桃花源裏人家子孫永保項元汴氏審定真迹項墨林父祕笈之印香巖居士楞嚴精舍墨林項氏季子章項子京珍藏諸印前隔水有中欽張覲宸二印押縫有退密平生真賞項叔子諸印後隔水有天籟閣張孝思賞鑑印二拖尾項元汴楷書釋文欵云大明萬歷甲申嵗仲夏端陽後五日墨林山人項元汴録是賦於攖寧菴中前有檇李孝思張則之子京子孫永保墨林子鹿石走諸印後有退密項元汴印子京父印項墨林父祕笈之印墨林山人則之懶逸諸印卷髙九寸廣二丈二尺三寸三分御筆題籖籖上有乾隆宸翰幾暇臨池二璽唐吳彩鸞書唐韻一卷上等宙一素箋本楷書并注無款姓名見跋中凡二十四幅俱正背兩面書第一幅只書一面幅前有文府寶傳一印又吳俊仲傑一印末幅有明德執中一璽又清真軒駙馬都尉王府圗書吳俊仲傑諸印又押字一上鈐河南書記一印又半印三漫漶不可識又宋濂跋云右吳彩鸞所書刋謬補缺切韻宋徽廟用泥金題籖而前後七印俱完裝潢之精亦出於宣和內匠其為真迹無疑余舊於東觀見二本紙墨與之正同第所多者栁公權之題識耳誠希世之珍哉翰林學士承旨金華宋濂記前隔水有洪武叁拾一年肆月初九日重裝十三字又裱褙匠曺觀五字押縫有文華之記一印後隔水押縫有政和璽二宣和一璽拖尾有內府圗書之印一璽又吳俊仲傑橫河精舍三印幅髙八寸三分廣一尺五寸二分按宋濂跋所云宋徽宗泥金題籖今缺宣和七印亦祇存其四顧嵗月既久轉屬多人而草四幅全韻猶宛然完璧豈世間至寶真有神物呵護耶宋太宗書蔡行敕一卷上等洪一八寶泥金箋本行書卷後署十四日三字又大書敕字又敕蔡行三字上鈐御書之寶一璽卷前一璽同又飯字小號一又天籟閣神品退密項叔子項子京家珍藏項墨林鑑賞章諸印卷後又子京印二又神逰心賞項墨林印墨林子京父帝陶唐之苖裔項墨林鑑賞章桃里平生真賞項墨林父祕笈之印諸印押縫御書之寶璽凡三又若水軒項元汴印墨林子子京所藏子孫永保墨林祕玩墨林主人子孫世昌項元汴印檇李項氏世家寶玩諸印前隔水有蒼巗子蕉林居士二印押縫有平生真賞墨林祕玩二印又二印又半印三俱漫漶不可識後隔水押縫有墨林項氏子京神逰心賞微缺寄傲有何不可墨林子諸印又田疇耕耨印凡二拖尾記語有元祐三年五月草六日給事鄭穆拜觀十五字前有子京墨林祕玩項子京家珍藏三印後有項翰墨印神品寄傲仁夀開國諸印又一印漫漶不可識又黃庭堅跋云天生聖人與物自殊拜觀是敕蓋可見矣行公在當朝功績大著宜膺是寵亦為不薄其德望之盛子瞻已詳述堅不暇及聊志嵗月云時元祐乙亥五月八日山谷黃庭堅前有項元汴印項墨林鑑賞章二印後有審定真迹子京子孫永保平生真賞項墨林父祕笈之印諸印又鄭清之跋云此卷乃缺一字宗皇帝御筆敕一道蓋不允蔡行辭中書省事者覿兹字畫飛動若虎踞龍騰風雲慶會正以見聖天子生知不測逺異常流當時在廷之臣得之為至寶中書公非學問忠勤有素曷承寵錫若是哉誠金玉錦繡奚足比具宜乎蔡氏子孫當知其所重永永其藏用是書之以志景仰云淳祐丙午三月望日鄭清之頓首書於養魚莊前有檇李子孫世昌項墨林印三印後有考古正今子京父墨林祕玩項叔子諸印又蒼巗子梁清標玉立氏印章觀其大略二印最後項元汴記語云宋太宗手敕蔡行中書省事明嘉靖四十一年秋八月得於鄞中范氏墨林項元汴家藏又飯字小號一諸跋中押縫有墨林博雅堂寶玩印元汴子京項元汴印蒼巗項墨林鑑賞章墨林懶叟宫保世家諸印卷髙一尺八分廣六尺六寸三分御筆題籖籖上有乾隆宸翰一璽宋徽宗書七言律詩一卷上等荒一素箋本行書大字無款有御書御書之寶二璽卷前有篤夀連印雲煙過眼項子長父鑑定項德枌印遼西郡圖書印諸印卷後有項德枌印五一倩士宛委堂印諸印卷中幅押縫有御書之寶凡五項字印五卷髙八寸四分廣一丈三尺三寸八分御筆題籖籖上有乾隆宸翰一璽宋徽宗書千文一卷上等荒一泥金雲龍箋本草書款識云宣和壬寅御書下有押字一上鈐御書一璽卷髙一尺九分廣三丈六尺四寸六分宋徽宗書千文一卷上等荒三素箋朱絲闌本楷書款識云崇寧甲申嵗宣和殿書賜童貫上鈐御書之印一璽卷前有長樂未央雪堂二印卷後有長樂未央仙客卞永譽印式古堂書畫雪堂諸印前隔水有古香書屋一印卷髙八寸八分廣一丈一寸一分宋髙宗敕張浚手書一卷上等日一誥敕箋本行楷書凡二幅前幅署云皇帝特賜川陕京西湖南北路宣撫使張浚手書後識云建炎三年七月二十八日上鈐御書之寶一璽後幅署云皇帝遣內侍黃保賜樞密院使張浚鞍馬手書又識云隆興元年五月二十六日上鈐一璽與前幅同前幅髙一尺四分廣二尺二分後幅髙同廣一尺八寸六分御筆題籖籖上有乾隆宸翰一璽宋髙宗書洛神賦一卷上等日二素絹本行草書後識云德夀殿書上鈐德夀殿御書寶一璽卷前有雪軒真淡二印又半印不可識卷後有皇姊圖書一印又梁清標印蕉林鑑定張維節印諸印前隔水有卷字七十五號六字俱作半字後隔水押縫有蒼巗冶溪漁隱二印又一印不可識引首有子孫世保蕉林玉立氏圖書二印拖尾趙巖題云花石綱間四海分錢塘日日雨如春孔明兩表無人讀德夀宫中寫洛神趙巗又宋獻記語云崇禎癸酉九月草五日宋獻獲觀於俞光祿觀玩軒後有蒼巗子焦林祕玩觀其大略諸印最後有韓逢禧一印卷髙八寸六分廣八尺六寸三分宋髙宗賜嶽飛手敕一卷上等日三素箋本行楷書後署付嶽飛三字上鈐御府之寶一璽下有押字一卷後有髙承延印吳氏書畫之印二印卷髙一尺一寸四分廣一尺九寸二分宋髙宗書養生論一卷上等日四金粟箋朱絲闌本真草二體相間書無款有德夀御書一璽又御書一璽又坤卦一印卷前有宏誼姚叔子子子孫孫永寶之三印卷後有天厯之寶一璽又姚氏珍玩姚宏誼珍玩書印梁清標印諸印押縫有河北棠村印凡十前隔水有蕉林書屋一印後隔水有端本一印押縫有蒼巗蕉林二印拖尾李東陽跋云右稽康養生論一卷真草相間用智永千文體後有德夀御書印德夀宋髙宗宫名作於紹興十八年戊辰實中興之二十二年也又九年丙子孝宗受禪始尊髙宗為太上皇退處德夀又十四年年八十一而崩於是宫此書蓋倦勤時筆計其年當過耳順而楮墨精密乃如此豈真有得於養生之説故與史稱其博學強記繼體守文而撥亂反正復讐雪耻為未足觀於是書者其亦有所感矣吾友楊應寧都憲得此而藏之敬題其後正德三年六月十三日長沙李東陽書又王世貞跋云右太史姚君繼文藏宋思陵手書稽中散養生論一篇行楷真草相間後有德夀御書印德夀思陵為太上時所居宫也思陵初擬豫章在青氷之間晚始刻意山隂傍及鐵門限此尢其得意筆正書時於督䇿露章法一二蓋欲以拙救熟耳行草翩翩二王堂廡間而不能脫蹊徑然要當於六代人求之繼文工八法無俟余贅余獨嘆中散之精於持論而身不能免也其微言奧旨若遺丹之在藏數百千年尚能起痼離凡中所謂一怒足以侵性一哀足以傷身思陵深戒之故德夀三十年不減玉清上真而五國之逰魂不返矣單豹食外彭𣆀為夭其思陵與中散之謂耶萬厯紀元秋七月晦吳郡王世貞書於武昌南樓後有蒼巗子梁清標玉立氏印章觀其大略二印押縫有冶溪漁隱一印卷髙七寸七分廣一丈八尺七寸八分御筆題籖籖上有乾隆宸翰一璽宋韓琦尺牘一卷上等月一凡二幅前幅素箋本後幅粉箋本俱楷書前幅後識云琦再拜啓有簡靜齋髙士竒圖書記江村祕藏三印後幅未署名有士竒髙淡人竹窗三印押縫有竹窗一印又髙岱連印拖尾蔡景行跋云忠獻平生立朝大節勳業之盛炳炳照映穹壤為一代偉人故不必贅陳矣至於天性清簡一無所好惟家藏圖籍數萬卷每卷尾必題曰傳賢子孫信乎子孫之賢而後可傳於永久也今觀二帖銀鈎鐵畫出入於唐賢顔栁之間其端重剛徑類乎為人百世之下見者肅容瞻慕焉元帥蕭侯珍藏既久聞公嫡孫誠之篤學好修克紹乃祖風烈遂不逺千里以奉之忠獻在天之靈殆非偶然者誠之其賢子孫哉二帖之傳當不墜先志檇李蔡景行拜手書又泰不華題云誠之廣文出先世魏公所書二帖見示端謹遒徑得顔魯公法為多垂紳正笏端居廊廟之氣藹然見於紙墨間噫魯公為唐之忠臣魏公為宋之賢相故其書法之妙亦相倣佛若是也前輩謂魏公每登朝堂視進止如有尺寸載觀斯帖於是乎取證矣元統三年清明前一日泰不華題後有竹窗玉山程以魁審定真迹二印又楊敬德跋云右魏公真迹也蕭元帥北野相君藏缺矣未嘗出以示人以誠之敦厚長者特還以合浦之珠克獲舊物豈不為韓氏慶乎噫自古及今初不借才於異代人茍自朂求所以稱元帥遺故家手書之意而勉於功名則我元豈無名臣哉古語有之公侯之子孫必復其始斯為元帥期待之盛心至順癸酉六月四日石塘山人楊敬德謹書又跋云誠之作餉為禮甚盛話及魏公真迹乃繼祖四年前所遺誠之之物談經道舊之餘敬德適在坐援筆識之舉不忘其所親明道先生之不欺也元帥公命書之不敢辭敬德再拜謝不敏又祝蕃跋云魏公相業煌煌在簡册間固不待翰墨而後傳二帖筆意渾厚雖粉墨漫漶猶奕奕有生氣流亡撫字數語藹然仁義之心其克終令名宜矣萬户蕭君以韓廣文為公裔孫而歸之且勉其見手澤而發孝思蓋期以繩祖武也廣文氣岸魁然神采煥發充其所學詎可量哉他日當不愧此帖至順改元冬十一月草又四日上饒祝蕃謹題又班惟志題識云戰六國臣幾何獨子房為韓報千百世下窅無所聞天復以韓忠國其於天道周復元始世昧於屈強豈能博通天人之道也豫于忠獻公有感焉天耶人耶感而遂通互相為黃鐘之律塵世不可得而知也因綴數語四時行在天何語片雲四海成霖雨將謂不能軍近安無一人歸來儀百揆騎虎尋常耳多少窅無聞千年蘭玉孫恕齋班惟志漫書同坐郝時叔王景平趙季文後有苑西樂此齋之圖書二印又李齊跋云流亡撫字宰相之所當用心也魏國公垂紳正笏不動聲色而措天下如泰山之安因是一語而可以類推矣無徒以翰墨論也蒲隂李齊又張聖卿題云魏公立朝謀國之大節固不待綴辭也今其遺墨雖不多見寸金片玉誰不寶襲余獨愛誠之以文獻能敬其祖北野之與能成人之美可謂兩得之矣喜而為之書大瑰畸人張聖卿題後有江村髙詹事二印又李懋𨽻書跋云晉唐諸名賢墨妙天下所共寶然其存者不數本茍或出售人爭購之雖幾百千緡在所不較外此則漫不加意慕名之習一至於此天台蕭侯説禮樂而敦詩書者也英賢札翰靡所不畜其仰止髙山之意深矣堂堂魏公亘古幾見誦其遺言餘論猶足使人感慕而興起况夫手澤之華缺半字然者珍藏熟玩不猶愈於徒尊字畫之工哉蕭侯不惟寶藏之而已也又能推錫類之心割所愛以奉公之耳孫誠之誠之載拜登受喜而後可知也意者神物護持知誠之與侯善故假手於侯以歸之耳不然何以得之有其道如此也二帖前後凡四十三字粉墨磨滅財可見者已十之三寶之寶之誠之又以蕭侯手書並裝於帖後以無忘所自得是亦宜書至順辛未立春日中山李懋端肅謹跋又陳梁跋云韓夫子執政三朝相業端正青苖相公豈可同朝而立語云相字如相人此二札筆筆正峰有一些邪氣否其藏鋒鍔於不見可以想其慎重持國陳梁拜觀於小寒山後有抱甕翁髙氏江村竹堂珍藏書畫之印二印又王鴻緒跋云右宋韓魏公二帖第一帖公與歐陽公書謝其作晝錦堂記者公相州人仁宗至和中由武康軍節度使求知相州英宗治平四年神宗初立公除鎮安武勝軍節度使司徒兼侍中判相州辭兩鎮但領淮南神宗熙寧元年復請相州以歸六年還判相州公秉節以居相州者凡再四矣而此帖則公與歐公同在政府時所與或在嘉祐八年之秋冬或在治平元年之春蓋公以英宗嗣位封衛國公其後太后還政即封魏國公英宗嗣位於八年四月有疾至七月始瘳明年夏五月太后即還政歐公記文云大丞相衛國公其末係銜尚書吏部侍郎參知政事歐陽修記其私家堂圃而仕宦將相之榮不宜於危疑時誦述故決知為英宗疾瘳以後太后還政以前也公為昭文館大學士監修國史故記文云大丞相堂以武康節度治相所作公追屬歐公記之歐公方參政晨夕政府帖中云信宿不奉儀色殆歐公偶休沐時耶記文不動聲色而措天下於泰山之安指定䇿英宗調和兩宫事帖中之褒假太過非愚不肖之所勝捧讀慙懼而不能自安者謂此即答門人親客臣子何與之意也第二帖某公旬日前得手書雖云近苦多病勉強親筆而草𨽻遒徑雖少年所不能及未知某公何人所與書何人其某字磨滅右半微可辨蓋土字以意度之則杜公也廬陵云杜公筆法為世楷模考亭云杜公以草書名家祁公本傳云真書行草皆有法蓋祁公書最為當時所重故公云少年不及也年月皆不可考中有前在并云云又跋中所云流亡撫字一段今已失按公拜武康軍節度使知并州在慶厯皇祐間後求知相州未久召入此帖當在知相州或召入以後二帖端嚴謹重正合考亭金華所云與荆公之躁擾急迫傾欹偃仆相反者跋語中泰不華周仁榮弟子一稱逹兼善其學由朱子六傳得何文定基王文憲柏之緒元史周仁榮傳云其所教弟子多為名人而泰不華實為進士第一李齊元史本傳云字公平廣平人工詞章元統元年進士第一知髙郵府招降張士誠被拘不屈死論者記大科三魁若泰不華殁海上李黼殞九江洎齊之死皆不負所學二君子皆文章節義士附見卷中尤可貴也其餘諸名人跋亦俱堪什襲江村先生得此卷命豫識其尾因覼縷及之其永寶無斁康熙乙亥夏五月草四日雲間王鴻緒謹題又髙士竒跋云有宋故多名臣其間出入將相身繫天下之安危而復能以文采照後世者則范文正韓忠獻二人為稱首是時西夏數用兵二公以帷幄重臣出總戎機日不暇給忠獻定䇿兩朝典政最久疑於翰墨之事不復留意今所流傳筆札字畫端謹結構精密若燕居無事從容而出之者雖書法專家蔑以過焉因想見古大臣居心凝重事無論巨細罔有慢易欲速率意以為之者栁誠懸心正筆正之説殆不虛矣往余得文正二札寶之篋笥甲戌十月蒙召再至京師復得忠獻遺迹喜不自勝按吳郡朱存理鐵網珊瑚書品載有忠獻公二帖一為乞歐陽文忠記晝錦堂札一為記成謝文忠札今止後札存而另以一柬益之雖紙墨漫漶字法實出一手御史大夫王儼齋先生玩索偏傍斷是與杜祁公尺牘先生精鑒博雅當非妄語又按書品後有晦翁跋語惜不可得所存九跋率元時巨公以文章節義傳者但諸跋內有撫字流亡之語而二帖中無此豈更有一帖今失之耶自古能書者不少非其人品事業卓卓可紀祗一藝耳若二公者與日月爭光可也忠獻凡三領相州所與文忠書年月前後儼齋先生考據甚核余故不復贅云康熙丁酉九月草六日舟過仲家閘書於卷末江村髙士竒又跋云康熙乙亥六月作跋丁丑秋九月草六日舟發任城過仲廟蓬忩無事始得書之前二日已立冬水村晴靄與籬落畦蔬相映帶自津門至此方見山色因口占云一行官栁染輕霜籬落寒蔬擷野香乍見遙山隔煙浦聞消晴日喚漁航并記一時興會云髙竹窗前幅髙九寸六分廣一尺一寸六分後幅髙同前廣一尺六分有竒御筆題籖籖上有乾隆宸翰一璽宋范仲淹道服贊一卷上等盈一素箋本楷書前署道服贊并序五字款見序中卷前有髙陽圖書東漢太尉祭酒家學髙陽德暉圖書庚寅才子之裔髙陽之瑞十六世孫主奉右勝謹藏圖書諸印又髙陽印二又鼎元半印卷後有東漢太尉祭酒家學仙系髙陽德暉圖書諸印又髙陽印二又髙陽半印卷中幅有夀國公圖書一印後押縫有頤齋之印髙氏圖書之印孔愈之印十六世孫主奉右勝謹藏圖書諸印又髙陽半印前隔水有古香書屋一印拖尾有文同跋云希道比部借示文正辭筆觀之若侍其人之左右令人既喜而且凜然也熙寧壬子孟夏丙寅陵陽守居平雲閣題石室文同與可跋後一印不可辨又吳立禮𨽻書跋云獲觀文正公之詞翰淳重清徑如其為人每展卷諷誦未嘗不想見風采何名德之重使人愛慕如此其深也富川吳立禮題又戴蒙跋云觀范文正道服贊文醇筆徑既美且針以盡朋契之義有以見高陽公之德矣傳曰不知其人視其友諒哉熙寧壬子年十一月甲子吳興戴蒙正仲題後有懷州軍資庫記懷州考試院記監德州鹽務新朱記監德州酒務印監德州商稅印諸印又懷州常平倉給納之記懷州常平庫給納之記二印又一印不可識又栁貫跋云范文正公祥符八年進士也其為同年許比部作道服贊辭莊義舒懿乎有德之言哉南北分合餘二百年而幅貟疆理復混為一區公之孫曾嗣守先業不懈益恭得公書遺蘇才翁韓文公伯夷頌真迹而寶蓄之且摹刻於石今年至正元年益都宗人復自北㩦此贊并公侍祠像來南而歸之合浦之珠曲阜之履得於既失所以委重宗祊藩飾世緒者夫豈偶然之故有相之矣熙寧間文公與可題識云希道比部而不著其名宋登科記當自可考也卷中有東漢太尉祭酒家學印髙陽及仙系小印皆緣許氏則是贊之為許氏物蓋已久矣不知何時而遂失之也耶作贊時許公為平海掌書記耳熙寧始轉至比部其恬於進取如此於以見許公亦盛德之士不然公豈肯輕以清其意潔其身者而許之哉昔公書伯夷頌以遺才翁今復見公為希道撰書此贊則希道亦才翁一等人哉宋三百年文運休明泰治熙洽自景德祥符而始盛觀公此贊則公與許公之聨芳科甲信人才與時升降者為不誣矣元年冬十有一月二十七日東陽栁貫書又黃庭堅跋云范文正公當時文武第一人至今文經武略衣被諸儒譬如蓍龜而吉凶成敗不可變更也故片紙隻字士大夫家藏之世以為寶至其小楷筆精而瘦徑自得古法未易言也黃庭堅書又胡助題識云文正公為同年友許書記作道服贊言皆至理書特清徑至今觀之悚然增敬所謂寵為辱主驕為禍府重此如師畏彼如虎是又美不忘規益可玩味乃知異時丞相堯夫布衾銘實權輿於此歟然是贊不載文正集中則公之文之遺者有矣抑亦盛年之作而或失於編次也耶因綴草字以寓景行之意云文正道服贊忠宣布衾銘家乘揆一德名言符六經至正癸未春正月草日金華胡助書又劉魁跋云黃山谷古今名書者猶推文正公小楷筆精而瘦徑自得古法世人可不知所重耶成化辛丑六月草日髙唐劉魁拜題又戴仁贊并序云范文正公道服贊其書有法而詞有氣前人題跋盡之矣余復何言敢僭用公韻敬作遺墨贊欲范氏後裔益知所寶重云式觀遺墨端嚴濟楚栁骨顔筋微公孰與龜文龍鱗或翔或處烈士忠臣兼文兼武畫見諸形曰心為主詞發諸口曰學為府石抉怒猊章成繡虎百世珍藏弗替厥祖成化辛丑秋八月八日句曲戴仁題贊又司馬垔跋云豫嘗謂士君子能為光明俊偉之事業必先有髙潔灑落之胸次為之地也范文正道服贊所見如此其心固若蕭然在風埃之外者則其所立之卓越千古者有以哉成化甲辰鞠月蘭亭司馬垔題又吳寬跋云右范文正公為同年許書記作道服贊真迹道服之制不可考許公為此其意蕭然物外必非不臧之服也不然文正公豈率易為人下筆者哉此贊今藏范氏義莊贊後又有文與可諸賢跋語亦不可得者也延陵吳寬謹題又廬濬跋云嗚呼道服非儒也而文正有取焉其自清自潔之謂豈誣也耶然則紆青曳紫而自蒙不潔者誦此多芒刺矣𢎞治十年夏四月朔後二日刑部郎中赤城廬濬拜題於姑蘇公館又王世貞跋云范文正楷書道服贊遒徑中有真韻直可作散僧入聖評贊語亦古雅所謂寵為辱主驕為禍府是厯後得之非漫語也跋者皆名賢大夫而獨文與可黃魯直栁道傳吳原博最著魯直結法端雅了不作生平險側而過妍媚極類元人筆如揭伯仿陳文東輩亦能辦之恐魯直真迹已亡佚為元人所補耳成化中御史戴仁贊書頗得吳興意而名不琅琅故拈出之己卯王世貞識後有蒼巗子焦林祕玩觀其大略吳舜升印康文氏書畫記諸印諸跋中押縫有東漢太尉祭酒家學印三庚世印四十六世孫主奉右勝謹藏圖書印五蒼巗印三又文正書院主奉范元理印一印又清白傳家髙氏圖書之印葆光之印尹誠私印髙常利印髙常利監德州鹽務新朱記才子之裔頤齋珍玩東蜀文氏范原理氏適軒棠村審定諸印又元理半印又三印不可識卷髙一尺九分廣一尺三寸三分宋儒遺墨一卷上等昃一凡六幅俱尺牘第三幅第四幅粉箋本餘俱素箋本第一幅范仲淹行書後署仲淹頓首又正月十五日五字上鈐一印漫漶不可識幅髙八寸八分廣一尺三寸第二幅司馬光楷書後署光惶恐再拜前有半印不可識幅髙九寸廣一尺五寸九分第三幅杜衍草書後署衍拜手幅髙八寸七分廣一尺二寸四分第四幅唐介楷書後署介再拜幅髙七寸八分廣一尺一寸二分第五幅韓絳行楷書後署絳再拜幅髙八寸一分廣八寸六分有竒第六幅韓維楷書後署維再拜幅髙七寸八分廣一尺二分每幅俱有宋犖審定一印引首有陳綱篆書宋儒遺墨四大字欵云中憲大夫致太僕少卿前直文淵閣經筵國史官陳綱題拖尾豐熙跋云范文正公司馬溫公二帖林文安所藏傳少司馬儀部郎三世什襲猶新熙燥髮知慕二賢今獲覩手墨如承顔色後學四明豐熙謹識又跋云杜唐張二韓書世罕見匏翁博古稱藻鑑要為不誣豫謂數公非以書擅名今去之五六百年而名家珍襲如此其可重固有在哉嘉靖庚寅蠟月既望四明豐熙識又宋犖跋云右宋儒遺墨一卷卷首篆書四字大徑五寸為明中憲大夫致太僕少卿前直文淵閣經筵國史官陳綱題綱成化朝進士篆法與程南雲相伯仲第一范文正公與秀才仁弟札昔人評公書以為得樂毅論筆意清徑中有法度當時善書者如蘇才翁子美蔡君謨咸推重之曩從吳門范公祠見公楷書伯夷頌誠烜赫名迹其他多贋本此札正符清徑二字為真迹無疑第二司馬溫公啓太師劄子世傳公書若𨽻端正以其為人此劄舊刻文氏停雲館帖中僅存騏驥之骨今觀真迹楮香墨彩浮動几案且文筆古致錯落尤堪寶玩後跋云范文正司馬溫公二帖林文安所藏傳少司馬儀部郎三世什襲猶新熙燥髮知慕二賢今獲覩手墨如承顔色後學四明豐熙識再為太師祁國正獻杜公致留守龍圖札祁公暮年學書與壻蘇舜欽討論筆法遂有草聖之目停雲館所刻一札其墨迹今在豫處粉箋剝落不似此紙墨完好觸目皆琬琰光也又唐介啓侍講待制晦叔一札介字子方江陵人擢第為殿中侍御史直聲動天下後參知政事諡質肅其筆墨具徑直之氣令人望而起敬韓絳字子華忠獻公億之子官司空檢校太尉康國公諡獻肅弟維字持國官翰林承旨並以豪翰名此絳札致文通大尹維札啓平章太師一以蕭散勝一以渾厚勝皆宋賢劇迹也後跋云杜唐張二韓書世罕見匏翁博古稱藻鑑要為不誣數公非以書擅名今去之五六百年而名家珍襲如此其可重固有在哉嘉靖庚寅蠟月既望四明豐熙識張札不知為誰吳文定當亦有跋今並逸去可惜按杜祁公書蘇黃諸公咸所心折此云非以書名誤矣林文安瀚閩縣世族官南吏部尚書子廷㭿工部尚書諡康懿廷機工部尚書諡文僖孫燫禮部尚書諡文格烴工部尚書廷櫛子炫儀部郎此卷為文安及廷㭿與炫三世祕藏豐跋稱廷㭿為少司馬蓋未為尚書時即寶此也熙鄞縣人𢎞治朝一甲進士官翰林學士其子南禺坊尤擅翰墨之長足為此卷增重明末歸福清葉臺山相國相國裔孫貧不能守為男致購得康熙辛卯二月致遷蜀藩便道來省以此卷為豫夀摩抄一再過願吾子孫亦如林氏纍世寶異無為大力者負之而趨幸矣是年七月七日西陂七十八翁完菴犖志下注男筠代書四字宋司馬光通鑑藁一卷上等辰一素箋本楷書後附答送物狀稿一則姓名見跋中卷前有長字小號又神品項元汴印墨林項季子章子京珍祕子京父印項墨林鑑賞章明安國玩寶硯樓圖字印瞻衮堂墨林外史桃莊戴叔能印岐國汝述明可圖籍煮茶亭長趙汝讚印尚寶少卿袁氏忠徹印長病仙子京所藏貞白子后山珍玩諸印又退密世家袁氏祕笈之印諸半印又半印不可識卷後有墨林山人項子京家珍藏子孫世昌趙汝讚印墨林子廷玉趙子昻氏玉比德齋忠徹貞白子梁清標印無恙一鶴諸印卷中幅有考古正今忠徹蘧廬諸印押縫有墨林子忠孝世家墨林山人子京父印忠徹諸印前隔水有棠村審定蕉林玉立氏圖書蕉林書屋三印後隔水押縫有冶溪漁隱河北棠村二印拖尾任希夷跋云溫公修通鑑起草於書牘間可見當日用意之勤至答送物狀亦自為檢前輩之不茍如此可師也已嘉定八年十二月十四日任希夷觀於玉堂夜直前有明安國玩旡恙一鶴二印又蘧廬硯癖齋記半印三又明可跋云溫公起通鑑草於范忠宣公尺牘其末又謝人惠物狀草也副紙之間三絶具焉誠可寶哉岐國汝述明可識前有墨林項叔子二印後有玉比德齋無恙一鶴桃里墨林主人子孫世昌諸印又記語云此屬稿耳而字畫無一欹傾惟公不欺之學何往而不在哉葛洪程玖趙崇和同觀因相與嘆仰如此前有蘧廬墨林堂項墨林鑑賞章諸印後有赤松仙史墨林項季子章危素私印程玠之印紫雲溪翁無恙一鶴諸印又栁貫跋云四百五十三字無一筆作草則其忠信誠慤根於其中者可知己永昌元年其歲壬午晉元帝即位之五年也自正月王敦將作亂至十二月慕容皓入令支而還每事第書發端一二字或四五字其下則以云云攝之校今通鑑是年所書凡目時有異同此或初藁而後更刪定之歟始公辟官置局前後漢則劉貢父自三國七朝而隋則劉道原唐迄五代則范淳父至於削繁舉要必經公手乃定此永昌一年事公不以屬道原而手自起草何歟然則文正忠宣之手澤所存猶足企想元祐一時際會之盛豈固以翰墨爭長為可傳哉至順二年嵗次辛未夏四月乙丑東陽栁貫題後有子京所藏惠泉山樵無恙一鶴三印又黃潛跋云溫公於通鑑書晉永昌元年事視此尤為詳備此特其初藁耳而作字方整不為縱逸之態其敬慎無所茍如此宜其十有九年始克成書歟今之文人類以敏捷為髙貴輕揚而賤持重使溫公復生未必能與之相追逐也展玩之餘惟有掩卷太息而已至正元年夏四月二十三日後學黃潛書前有墨林主人一印又宇文公諒跋云張南軒跋荆公書謂丞相平生何得有許忙事此言深中其病今觀溫公此稿筆削顛倒訖無一字作草其謹重詳審乃如此誠篤忠厚氣象凛然見於心畫之表彼浮躁急迫者安能如是耶後學宇文公諒書前有博雅堂寶玩一印後有項元汴一印又朱德潤跋云司馬公通鑑編年一變班馬舊史之習而國家興衰生民休戚善可為法惡可為戒者備此書矣故以事繫月以月繫年而不以日或以年不以月者蓋周嵗之中紀事之要總為一編而君臣父子是非得失之互見使人得便觀覽有春秋之義例焉此稿標題晉永昌元年事是年王敦還鎮元帝崩此江左立國之一變故公不得不手書之范忠宣與公繼居相位今獲觀二公手筆於一紙豈勝幸哉至正三年十月朔旦後學朱德潤書前有子京五公世家虛朗齋三印又鄭元祐題云典午渡江後盜臣接迹起由其創業初所事不以理溫公成通鑑善惡悉就紀心畫既嚴正形見在藁紙藁蓋人所忽敬慎不少弛固宜公之心天地同終始鄭元祐前有墨林子京父印二印後有退密項墨林鑑賞章檇李項氏世家寶玩明安國玩無恙一鶴項氏子京隱居放言諸印又蒼巗子蕉林祕玩觀其大略三印諸跋中押縫有雲中印三又考古正今忠孝傳家袁忠徹印項墨林父祕笈之印諸印卷髙一尺零三分廣三尺三寸御筆題籖籖上有乾隆宸翰一璽按明可跋云溫公起通鑑草於范忠宣公尺牘則此卷幅前應尚有范札一則蓋經後人重裝逸去也宋陳洎自書詩帖一卷上等宿一素箋本行楷書七言律詩七首五言排律一首五言律一首七言絶句七首無款姓名見跋中卷前有項子京家珍藏一印卷後有項元汴印項墨林鑑賞章二印卷中幅有韓氏之印凡五師仲印四又項元汴印項墨林鑑賞章項子京家珍藏蕉林諸印又仲字山人半印二前隔水有蕉林書屋一印後隔水押縫有河北棠村冶溪漁隱二印引首有蕉林梁氏書畫之印棠村審定二印拖尾顔復跋云陳公亞之三十丈復不逮承其教誨也事業在卿士大夫者以補國利民傳復少於先子遺書中得公啓問詩章讀之往往意在栖退若送行閬中詩公時為審刑官朝中望譽始充大已有乞醉墦間之嘆是知君子自重而不茍合者虞富貴以非道而至如盜窬禽暴焉則非道者惡得而及之然後踐履無非義施張莫不仁事功可勝紀哉公忠言美庸固易考清逺之趣疑多在文章常恨不得盡見之熙寧九年冬居彭城公孫師仲出雜詩稿一卷辭格秀古造句愈工則入淡泊愈深若借宅云四壁舊貧寧畏盜一枝雖小易容巢贈旡已師云他年逺公社若箇是遺民蘭溪間適云露侵僧履蘭三徑秋入農歌雨一犁秋居云井臼貧雖樂溪山逺未歸貽漁者云擬共停橈醉天幕緩歌纓足不回頭聞之者孰不灑然而若醒超然而自愛復疑在文章者今一卷之稿已得如是之多固足為喜又得玩君子始終之尚篤吾所好顧何樂如之詩大小二十二篇閬中送行不與焉逸者可知已十一月三日曲阜顔復書前有韓氏之印一印後有檇李項氏世家寶玩項子京家珍藏項墨林鑑賞章諸印又鄭穆跋云穆覽詩緬想風迹而欽鹽鐵君趣尚逺矣後有韓氏之印一印又張徽題云破錦囊開玉振金舍人胸臆右丞心為時黼藻衣冠藪與國丹青翰墨林慷慨似誰雙舞劍風流隨處一歌琴燕貽苦志追先烈子夏何須論淺深元豐二年三月草三日前署書故三司副使陳公詩軸後陳留張徽十五字又天籟閣墨林山人子京父印項子京家珍藏諸印後有留侯裔孫項元汴印二印又孫覺跋云陳公固所嘗聞然不及見也今公之孫以公詩為示讀之亦足想見其風采矣元豐四年七月一日髙郵孫覺題前有韓氏之印一印又林希記語云元豐四年七月于禾興始識公孫師仲師道遂得公之遺藁以觀長樂林希又蘇轍跋云轍頃在南都傳道陳君以鹽鐵公詩草相示轍甚愛公詩之精且嘉君之孝恭不墜世德後六年自歙州還京師見君於鄼陽復出此詩為示不可以再見而不之志也丙寅正月七月趙郡蘇轍題前有韓氏之印墨林山人項叔子諸印後有墨林山人項子京家珍藏二印又徐積跋云故吏部彭城陳公在仁廟時以御史奉使關中積以故人子見公又見之於河內其後五十年見公孫於淮南於是獲其詩稿伏而歎息蓋不敢少有述焉也即幸而有如平日公以父黨教之讀詩可也如與之言詩則未可也已元祐六年春二月十三日山陽徐積謹書前有韓氏之印墨林山人項子京家珍藏諸印後有墨林祕玩項墨林鑑賞章二印又錢世雄跋云世雄竊服吏部陳公之賢與令德之孫有以顯榮其後皆見於名卿偉人之所論載幾於成書矣世雄不復形容其略獨念元豐壬戌年間初識傳道於松陵獲見此書又三年一邂逅無己於京師今草有二年矣而二君皆以不遇卒崇寧癸未端午傳道之子孝友復抱此書泣以相過撫卷悲懌益以知臧孫之有後竊意此書自是與陳氏之祖孫隱矣疑其可自致於斗牛間者金石所不能礙也南蘭陵錢世雄謹書前有城南書院韓氏之印二印後有項元汴印一印又李􅌫跋云按陳公名洎彭城人國朝正史實録俱無傳然嘗以歲月考求公嘗厯知懷州審刑院寶元間自屯田外郎為副端尋升臺端已而出漕京西淮南京東慶厯五年轉吏部外郎加直史館改使益梓路六年入為度支副使尋轉鹽鐵後山集載公皇祐元脫年字以副使行河還卒今史亦失書信矣史之多放軼闕遺司馬遷所謂滅功臣賢大夫之業不述非此之謂歟倘非因詩卷長留天地間曲阜長道顔公侯官宏中鄭公而下諸大賢表而出之行事不得書於史册得見褒述於諸大賢輯成巨軸於百年之後又獲歸諸博雅君子之藏使當世士大夫玩繹歎詠之不足則其榮何必在彼一時之遇乎嘉定癸酉仲秋十七日眉山李􅐉題前有墨林山人神逰心賞二印後有墨林祕玩項叔子項墨林鑑賞章諸印又任希夷題云如彼泉流必有源陳家詩律自専門後山得法因鹽鐵不減唐朝杜審言嘉定丙子寒孟二十四日眉陽任希夷敬題後有墨林山人子京父印項墨林鑑賞章諸印又王稚登書文徴明所撰諸賢爵里姓氏記云陳公名洎字亞之彭城人其詳具李季永跋但當時復有陳亞字亞之者咸平進士官司封郎中以藥名詩知名雖與同時同字而實别一人也師仲字傳道亞之之孫榮州資官縣尉之子於後山為羣從兄弟與東坡友善集中倡和詩及簡牘可考溫公集亦有與陳法曹二書顔復字長道顔子四十八世孫以有道應薦賜進士知永康縣元祐中官國中子字訛祭酒與其父太初皆居彭城故與陳通家太初字醇之有文學東坡為敘鳬繹先生集者也嘗官閬中主簿故跋中云云鄭穆字閎中侯官人官寶文閣待制國子祭酒德學為時所稱神宗尤重其人張徽字伯常陳留人寶元元年進士有詩名史雖無傳而藝文志載詩集三卷瀛奎律髓謂張徴誤矣孫覺字莘老髙郵人神宗時名臣官吏部侍郎龍圖閣直學士林希字子中吏部尚書翰林院學士同知樞密院事希實吳人而史稱長樂從所始也蘇文定公轍字子由即頴濵先生徐積字仲車山陽人治平四年進士以耳聵不仕終楚州教授有至行政和中賜諡節孝先生東坡稱其文怪放類玉川子而此跋殊草草也錢世雄不詳其履厯史亦無傳惟元祐中鄭雍攻宰相劉摯目世雄為摯黨且與劉安世諸公並列而帖中自敘與後山友必佳士也李􅐉字季永眉山人文簡公燾第四子以文行世其家由館職為淞江制置副使入為禮部尚書資政殿學士卒諡文肅任希夷字伯起元祐名臣伯雨曽孫官端明殿學士簽書樞密院事權參知政事卒諡宣獻少從朱子得正學之傳周程諸公贈諡皆其所請希夷稱眉山蓋先世所居其實邵武人也稚登又跋云亞之先生詩草四十年前余嘗見黃翁楙父家文太史疏諸跋者爵里姓名宛然在也是時余方弱冠已歎先生博雅為不可及去嵗見於曹重父齋頭陳詩及諸公跋皆無恙獨文翁此書已烏有後乃知鬻書者割以歸他人重父購之不可得録其疏俾余繕寫綴卷尾余書拙且惡豈堪代先生捉刀獨謂先生疏諸公行事非貯宋史在腹中者不能五車三篋無以過此而猶欲俟博雅君子謙尊而光寧可及哉今世鯫生目覩邱墳未盈卷便沾沾自誇行祕書讀此能無汙下及踝己亥七夕前三日王稚登書後有蒼巗子蕉林祕玩二印最後有南京管兵部督理馬政關防一印諸跋中押縫河北棠村印凡七蒼巗子印三又墨林山人項元汴印秋碧諸印又寄傲半印二又半印五俱殘缺不可識卷髙九寸四分廣四尺八寸按詩止十六首而顔復跋謂二十二篇其六篇蓋與文徴明書記皆為鬻書人割去也宋蔡襄自書謝表并詩一卷上等列一素箋本楷書七言古詩一首前書表文款云朝奉郎起居舍人知制誥權同判吏部流內銓上騎都尉賜紫金魚袋臣蔡襄上進卷前有雙螭半璽又鮮于秋壑半印二又項元汴字子京子京父印項墨林鑑賞章諸印卷後有子孫永保墨林祕玩項子京家珍藏審定真迹清和堂圖書諸印又寄傲宣文閣鑒書畫半印二拖尾文及甫記語云大觀三年仲冬上休日青社郡舍之簡政堂觀河南文及甫書又記語云舅家物藏之久矣今得觀於檇李良可歎也乙丑四月三日嵩謹識後有項元汴字子京子京父印項墨林父祕笈之印諸印又鮮于樞跋云蔡忠惠公書為趙宋法書第一此玉局老語也今觀此帖藹然忠敬之意見於聲畫又不可與茶録牡丹譜同日言也鮮于樞獲觀謹題又吳寬跋云蔡忠惠公書名重當時上嘗令寫大臣碑志則以例有資利辭曰此待詔職也與待詔爭利可乎力不從竟已其人品如此其書之莊重凡落筆皆然豈以御前表疏始不茍耶謙齋宫傅先生得此甚加珍惜蓋非特重其書重其人也長洲吳寬題後有子京所藏項墨林鑑賞章二印卷高七寸六分廣三尺三寸七分御筆題籖籖上有御賞乾隆宸翰二璽宋蘇軾書御書頌一卷上等張一素箋本楷書款識云元豐七年九月十日汝州團練副使本州安置不得簽書公事騎都尉臣蘇軾謹書後有趙郡蘇氏一印卷前有政和宣和二璽又紹興一璽微缺又半印存之印二字卷後有政和宣和紹興內府圖書之印四璽又困學齋太行史氏李琪家藏子子孫孫永為寶用諸印又一印不可識又一印缺其半存都書二字卷中幅有酸齋得間堂子敬之章思敬龍江鄧文原印王用臣家寶印諸印拖尾何薳跋云東坡先生翰墨精妙自經崇寧大觀焚燬之餘人間所藏蓋一二數也至宣􅛱間內府復加搜訪一紙定直萬錢而梁師直以三百千取族人英州石橋銘談稹以五萬錢輟沈元弼月林堂榜名三字至於幽人釋子所藏寸紙皆為利誘盡歸諸貴近及大卷軸輸積天上丙午年金人犯闕輪運而往疑海南無一字之留也建炎初余於中貴任源家見其所藏幾二百軸佳者有徑寸字書宸奎閣記行書南遷乞乘舟表與酒子賦而已今見此卷御書頌其合處不減顔平原可謂無上神妙故山谷有云本朝善書自當推為第一數百年後必有知余此論者誠哉此言也薳學公書迄今二十載不能有毫末肖似更為慚惶久之紹興四年嵗在甲寅相月八日何薳謹識前半印不可識後有春暉堂圖書記困學齋世藏真賞諸印又隴西半印又鄧文原跋云坡翁御書頌觀其字畫乃規模顔平原者真為墨寶余雖鄙野所見無多亦嘗有數十帖皆去欵識以遭元祐黨禍當時收藏家皆削去之獨此書莊重有餘欵識俱全可稱完璧善夫其寶諸巴西鄧文原又倪瓉跋云東坡與子由論書云吾雖不學書曉書莫如我茍能通其意嘗謂不學可故其子叔黨跋公書云吾先君子豈以書自名哉特以其至大至剛之氣發於胸中而應之以手故不見有刻畫嫵媚而端冕章甫若有不可犯之色少年喜二王書中年喜顔魯公故時時有二家風度也至正十三年冬十月東海倪瓚又文徴明跋云長公書余所見凡十餘卷而滿意者寡養生論粉澤紙書大草千文乃黃蠟箋所寫乞居常州奏狀雖小楷淳古而剝蝕處多如赤壁賦則前缺數行宜春帖子又中失一紙其寒食篇芙蓉城詩與九辨帖皆削去題名都非長公完璧惟伯時三馬圖贊宸奎閣記煙江疊嶂歌與此御書頌可謂拔乎萃者矣時正德庚辰修褉日漫識於玉磬山房長洲文徴明卷髙七寸七分廣七尺七寸一分宋蘇軾書前赤壁賦一卷上等張二素箋本楷書款識云軾去嵗作此賦未嘗輕出以示人見者蓋一二人而已欽之有使至求近文遂親書以寄多難畏事欽之愛我必深藏之不出也又有後赤壁賦筆倦未能寫當俟後信軾白卷前有天籟閣子孫永保項元汴印神品諸印又山人真賞軒字全卿半印四卷後有墨林子寄傲子孫永保平生真賞項墨林父祕笈之印項子京印項墨林鑑賞章諸印又秋壑珍珍秋壑虛朗齋墨林從吾所好項子京家珍藏考古正今墨林主人神遊心賞項叔子檇李子孫世昌項墨林印檇李項氏世家寶玩項元汴印宫保世家子孫保之全卿珍賞神品蒼巗子長字諸印又子京父印二又全卿墨林寄傲半印三卷前押縫有退密桃里墨林祕玩項子京家珍藏諸印卷中幅押縫有墨林印二神品印四項元汴印二賈似道印四子京印二元汴印三又若水軒子京所藏墨林山人諸印原卷缺三十六字文徴明補書於前另行小楷注云右繫文待詔補三十六字前有停雲文徵明印衡山諸印前隔水有蒼巗子蕉林居士二印後隔水押縫有河北棠村冶溪漁隱二印引首有天籟閣一印又墨林山人項叔子二印拖尾文徴明跋云右東坡先生親書赤壁賦前缺三行謹按蘇滄浪補自敘之例輒亦完之夫滄浪之書不下素師而有極愧粳粃之謙徴明於東坡無能為役而亦點汚其前愧罪又當何如哉嘉靖戊午至日後學文徴明題時年八十有九又董其昌跋云東坡先生此賦楚騷之一變此書蘭亭之一變也宋人文字俱以此為極則數百年來所藏名迹雖多知無能逾是矣萬厯辛丑攜至靈巗村觀因題董其昌後有梁清標印蕉林觀其大略諸印又文彭之印夀承氏停雲晤言室印文氏圖書之印諸印卷髙七寸五分廣七尺二寸五分宋蘇軾書歸去來辭一卷上等張三素箋本行楷書無款有東坡居士一印卷前有金書蘇文忠公書五字前有西蜀郭衢階賞鑒二印下有雨拜手往郭亨父氏珍賞圖書二印又衢階亨父珍祕長公半印四卷後有雨拜手往郭衢階印蕉林梁氏書畫之印諸印又顧渚顧氏合同半印三又半印不可識卷中幅押縫有武林開國珍玩各二印又二印不可識前隔水有古香書屋一印拖尾解縉跋云書之為藝非他藝比也厯世聖賢重之蓋宣人文施治化述六經應萬事經天緯地不能外此至百千萬年日用而不可闕者而豈他技藝之能比哉是故自庖犧作書契三皇五帝無不通於書者世逺不能得見其迹古文尚書與世傳石刻亦倣佛其萬一皆非謬惡者矣周人善篆書孔子為人作題扁大字觀闕里牀前硯延陵季子墓石可見已漢晉唐宋帝王皆學書漢光武章帝晉武帝元帝唐太宗宋太宗髙宗其尤也當時臣庶多能書者杜度張芝鍾元常王逸少歐虞褚薛顔栁蘇黃米蔡其尤也其悉工於書者豈圖為人觀美哉蓋天之文與地之文人之文一也景星卿雲人皆仰之精金美玉人皆寶之謬惡之書見者亂吐覆瓿且不暇何以垂世傳逺哉余嘗患世之不能書者不自咎其拙惡而以書為末技藉口也蘇文忠公大節表著文章妙天下其書師顔魯公規模淳厚筋骨隱映古意渾成中藏至巧如周鼎秦鍾使人可愛固可以破愚起懦於千百載之下今趙君景輝既耽學古人書於文忠公此紙玩之不啻拱璧書之所進他日安知不與古人並傳哉余姑識此為之兆云永樂元年癸未九月十一日翰林學士廬陵解縉書後有郭衢階記語此文鋟在格古要論八字下有亨父一印又玉堂學士印章臣量士雅諸印前有子孫世昌郭亨父氏永存珍祕諸印又一印不可識又巗字之印生亨父木字道人諸半印又半印不可識又蘇雨記云甲申長至前侍御龔一清憲僉蘇雨同觀於內臺署中又跋云此卷筆法遒徑飄逸非長公不能作豫初觀已殊竒之及得江州碑刻細憶往閲則布置結構宛無二迹益信此卷之真非後世臨摹贋玉希重值而貨者比然則江碑郭民部家藏卷其古今一符節歟萬厯丙戌八月草七日豫以楚兵憲入賀萬夀得再一縱觀不勝歡賞因書此以紀歲時川東蘇雨以時甫筆於郭亨甫長安僑寓跋中押縫有治書之印心賞二印卷髙一尺零三分廣五尺六寸九分宋黃庭堅書千文一卷上等寒二素箋烏絲闌本楷書款識云建中靖國元年季春山谷老人雞毛筆書卷首有陳氏道復一印卷中幅押縫安定印四十一河北棠村印二十前隔水有華陽蕉林祕玩觀其大略諸印押縫有內合同印醒石圖書二印又四印殘缺不可識後隔水有蒼巗子蕉林鑒定李振裕印諸印又嘉義堂半印押縫有近晙珍藏白石山房書畫之記時習鑒賞性命同珍依子孫永寶玩諸印又二印殘缺不可識卷髙七寸三分廣三丈零四寸八分御筆題籖籖上有乾隆宸翰一璽宋黃庭堅摹懷素一卷上等寒二素箋本草書諸上座文款識云此是大丈夫出生死事不可草草便會拍盲小鬼子往往見便下口如瞎驢喫草樣故草此一篇遺吾友李任道明窗淨几他日親見古人乃是相見時節山谷老人書上鈐山谷道人一印卷前有長宜子孫元賞華夏鴻緒孫承澤印周元亮借觀一過李甡私印貞白父諸印又半印二不可識卷後有北平孫氏硯山齋圖書寄傲周亮工敬臨承澤鴻緒華夏貞白父李應禎印元素私印長字諸印又紹興一璽又一印缺存石氏二字卷中幅押縫內府書印凡九孫氏印八儼齋祕玩印九李應禎印八又李甡私印應禎二印前隔水有北海孫氏珍藏書畫印一印押縫有孫氏珍玩二印後隔水有長宜子孫孫承澤印北海孫氏珍藏書畫印子孫永保雲間王鴻緒鑒定印元亮諸印押縫有孫氏珍玩二印拖尾吳寬跋云昔東坡見山谷草書從傍稱歎錢穆父獨惜以為未見懷素真迹後山谷見自敘帖書法遂覺頓異不審此卷作時是嘗見耶抑或未見耶職方公深於書者藏此必能辨之吳寬題後有子孫永保雲間王儼齋收藏記二印又梁清標跋云涪翁此卷摹懷素書昔嘗觀於退谷翁齋中見其紙墨完好神氣奕奕後有紹興小璽秋壑印記知屬宋大內所藏尤為可寶退谷蓄古法書頗富此卷實為甲觀今從儼齋司農所又獲展覽流連不能已司農孜孜好古每獲寶墨愛護如天球琬琰豫更幸此卷得所歸矣河北梁清標書跋中押縫有儼齋祕玩一印卷髙一尺零三分廣二丈二尺六寸六分按梁清標跋有紹興小璽秋壑印記語今紹興璽尚存而秋壑印已逸去宋米芾書天馬賦一卷上等來一素箋本行書無款姓名見跋中卷前有東吳生一印後隔水孫承澤跋云米元章天馬賦余於滄桑後得之故內其竒逸處全倣顔魯公余取魯公送劉道沖序墨迹對觀無一不相合者古人書法皆有原本如此記之以自勉退道人澤拖尾王鐸跋云丙戌春過北海齋觀米海嶽天馬賦矯矯沉雄變化於獻之栁虞自為伸縮觀之不忍去噫兵燹之餘一時文獻凋剝乃僅存此卷光怪陸離不滅沒於瓦礫物之遭由蹇遇亨可勝歎耶北海孫公雅嗜古博通海嶽何不幸嘉書經戎行何幸出之象弭俴輈登之君子之堂逢北海為異代知已也天下事盛衰顯晦豈不有數存乎其間乎哉豫不意今年復見北海又復觀海嶽及諸家字畫疇謂豫顛沛後非幸歟孟津王鐸卷髙七寸七分廣六尺零二分前隔水御筆題至寶二大字下有乾隆宸翰一璽宋米芾書秋夜詩一卷上等來二素箋本行書大字五言古詩一首前署秋夜二字無款有米姓之印一印卷前有乾卦紹興二璽又江表黃琳美之休伯關內侯印諸印又半印惟之寶二字可辨押縫有黃美之氏一印又一印不可識卷後有紹興璽凡二又唐子連印槎溪黃氏仲安三印又墨豪墨一印拖尾米友仁跋云右先臣芾秋夜詩一首紹興八年十月十二日臣米友仁審定真迹恭題後有內府圖書一璽卷髙一尺三寸九分廣二丈三尺九寸御筆題籖籖上有御賞乾隆宸翰二璽宋米芾尺牘一卷上等來三素箋本行草書凡九幅第一幅未署名有鴻緒吳廷之印二印又半印不可識後押縫有儼齋祕玩一印髙八寸一分廣一尺三寸六分第二卷前署芾頓首有吳廷之印鴻緒書樓真藏諸印後押縫有儼齋祕玩一印又半印存書樓珍三字髙七寸九分廣一尺三寸五分第三幅後署芾頓首有鴻緒宗孔二印後押縫有儼齋祕玩一印髙七寸四分廣一尺二寸二分第四幅後署芾頓首前押縫有鴻緒之印一印後押縫有儼齋祕玩一印髙同前廣一尺一寸三分第五幅後署芾再行有吳廷之印王鴻緒宗孔諸印後押縫有儼齋祕玩一印又吳字半印髙同前廣一尺一寸五分第六幅後署芾頓首有吳廷之印鴻緒儼齋祕玩廣陵李書樓珍賞圖書諸印髙同前廣六寸一分第七幅後署芾頓首有韓世能鴻緒之印翰逢禧印徐守和印吳廷之印李宗孔諸印又司印半印後押縫有儼齋祕玩一印髙八寸廣六寸一分第八幅後署芾頓首有鴻緒之印儼齋書印吳楨孔字儼齋祕玩諸印髙七寸一分廣一尺零四分第九幅書七言古詩一首前署芾字有芾字米章二印又紹興一璽又鴻緒之印廣陵李書樓珍賞圖書吳禎周生李錦吳廷之印諸印後押縫有儼齋祕玩一印髙七寸四分廣一尺零八分後隔水有子孫永保雲間王儼齋收藏記二印押縫有子孫永保雲間王鴻緒鑒定印二印拖尾王鴻緒跋云右米南宫九札勒石於宋元明諸名帖中天下後世已得共見其􅋵翰時風度矣然其用筆之妙出入二王及顔平原之處石刻所不能傳者非見真迹無由領悟也趙吳興有其妍麗而乏其俊爽董華亭有其靈秀而乏其沉雄後有作者不知何以過之九札今經六百餘年而紙墨如新光華奪目雖收藏家珍護天亦若愛惜之故能致此尤為可寶也康熙五十七年歲次戊戌冬十一月朔橫雲山人王鴻緒題御筆題籖籖上有乾隆宸翰一璽宋米芾捕蝗帖一卷上等來四素箋本行書卷前署芾頓首有寓庸寶藏黃琳美之二印卷後有八十一翁因是寶玩陳定平生真賞二印拖尾吳奕跋云米老書如天馬脫御追風逐電雖不可範以馳驅之節要自不妨痛快朱文公評語也此帖奔放不羈以文公之言觀之尤信嘉靖壬午春三月書於東莊竹下長洲吳奕又王時敏𨽻書跋云董文敏公嘗言宋代四家書法皆宗顔歐而米海嶽尤為超絶脫盡前人窠臼自出機軸故能沉著痛快直抉晉人之神髓捕蝗帖向為名家歎賞余今得見真迹遒徑奔軼真是平生得意筆信可寶也甲辰春杪西廬王時敏題卷髙九寸五分廣一尺四寸四分御筆題籖籖上有乾隆御賞幾暇怡情二璽宋米芾摹王羲之此月帖一卷上等來五素箋本行書前隔水有秋壑虞集伯生長字諸印又一印不可識又鼎元半印又半印不可識後隔水有奉使新鑄之印一印又一印不可識拖尾陸修正跋云此本視慶厯大觀中真書諸刻最為佳也丹山竒隱居士購得之常置書筒中每溽暑蒸潤之月又加蠟封裹其外其保護甚於嬰兒也時取展玩則淨拭几席而對之或者譏其有宋人燕石之藏居士因復之曰昔人論右軍書樂毅論太史針體皆正直有忠臣烈士之象隨所在而有神物護持之也如辨才於蘭亭殆逾性命况千餘載之下寶玩尚無斁者余於此帖豈為過耶或者遂服其精鑒如此唯唯而退居士因徴余言以志其意於後使其傳家者當知其所自者焉時洪武三十年春二月上浣吉日陸修正識欵字俱微缺又莫是龍跋云此月帖王長公鑒為米家風良是非深於書學者不能辨也世間無論有晉魏幾人解識真唐隋當時薛米諸人第得見我輩不至矜詡若爾甲戌仲秋望日莫是龍題又王世貞跋并贊云右此月帖二十五字結法圓美遒逸而微有米家風疑為此君臨本贊曰優孟抵掌卒驚楚王虎賁登筵蔡為不亡屈邯鄲脛步襄陽堂柔脫虛和役圓就方誰其最工米顛襄陽世貞謹題幅髙七寸四分廣三寸宋米芾書易義一卷上等來六素箋本行草書款識云元符元年春二年夏三年秋遊中天竺訪堂頭禪師紹聖四年同佛印訪禪師師已垂年苦留心於易芾遂贈其易義并大書讀易堂三字併遺之襄陽米芾元章書卷前有乾卦神品會侯檇李李氏鶴夢軒珍藏記項元汴印墨林祕玩子孫永保項子京家珍藏項墨林鑑賞章思無邪堂退密墨林硯癖子京珍祕隱居放言桃花源裏人家諸印又半印三存心賞祕笈之印世昌諸字又半印不可識卷後有神品博雅堂寶玩印項元汴印子京父印墨林堂鴛鴦湖長秋壑圖書墨林項季子章野處子孫世昌諸印又半印三存籧廬有何南華六字卷中幅有子京墨林山人曺子文子京所藏項氏子京田疇耕耨諸印引首有天籟閣項叔子宫保世家三印又半印存子孫二字又半印不可識拖尾有周伯溫篆書讀易堂三大字又跋云豫觀米襄陽為天竺大士書易義數語深得乾造坤化之奧世每以能書稱襄陽而其學識乃如此豈知米公者哉蘇君昌齡請篆讀易堂三字以補其闕用鎮山門遂書於左方鄱陽周伯溫識後二百六十一年當大元至正十五年三月朔旦也前有檇李項子京家珍藏二印又子京父印西疇耕耦二印又半印三不可識後有平生真賞神遊心賞二印又鄭元祐跋云米南宫於書無不讀生承平時以絶倫之姿日接賢士大夫緒言餘論故其造詣益深使其僅能字學則當時諸賢豈肯前席也世言王右軍能書而已殊不知其卓識偉見貽書殷深源勸其交歡桓溫使深源從其言則溫不至于跋扈而晉室尚可以扶持襄陽豪逸乃肯與佛印同訪中天竺至為之書讀易堂豈以少林指心單傳固與羲皇周孔元無間耶襄陽論易以及於洪範五行五位五性五味然所謂五行其五味人皆可知獨金曰從革從革作辛辛為辛辣使以金銀銅鐵百計鬻之不能辛也此雖細事然子朱子門人固嘗以為問終不能折其為何如今已矣恨不能起襄陽於九原而質之吳人李君士明寄迹老子法中而嗜古好學出此卷以求題故粗書襄陽之為人而非敢及於讀易也下有鄭元祐印鄭氏眀德遂昌山樵三印前有項子京家珍藏一印後有蘧廬子京所藏桃花源裏人家項墨林鑑賞章諸印又董其昌記語云此卷豫從項氏借摹刻於戲鴻堂帖甲戌修禊日再展觀於長安苑西邸中董其昌後有項墨林鑑賞法書名畫一印又半印三不可識最後有項元汴記語宋米元章行草書易説帖名賢題識項子京珍祕十九字諸跋中押縫有茶癖居士惠泉山樵逸民世外隱居香巗居士諸印卷髙一尺零七分廣四尺零二分宋陸遊自書詩帖一卷上等暑一素箋本草書五言古詩一首七言古詩一首七言律二首五言律一首七言絶句三首款識云近詩一卷為五七郎書嘉泰甲子歲正月甲午用郭端卿所贈猩猩毛筆時年八十矣後有山隂始封放翁二印卷前有潘沂希哲寶積一印又藏書印半印卷後有太原王掞藻儒父章顓菴孫承澤印潘沂希哲寶積諸印卷中幅有許安國二印押縫有孫氏印凡九許安國印七西田印八卷後押縫有許安國印承澤西田諸印拖尾郭畀跋云宋南渡後放翁先生文章號大家數一時學者所宗暮年休致後詩法圓美蓋傳之於曽茶山也此卷字畫遒徑實先生得意書秋泉其善藏之若夫先生出處之詳則有二南詩文盛行於世豫復何言京口郭畀題又俞庸跋云放翁居紹淳講好偃兵之時天下休息疆埸無事入掖垣出藩宣晚年優遊若耶溪上夀八十餘宜乎劍南前後續集之富大而天地日月星辰之運行小而昆蟲草木之動植內而朝廷外而邊徼以至於禮樂法度刑賞兵財凡所見聞一寓之詩世間妙語竒對騷人墨客呫嗶推敲之所未到莫不網羅搜獵畢盡無遺真可以泣鬼神祛癘瘧讀之使人倘然止贄然立而獨未嘗見公之翰墨秋泉髙侯暇日以巨軸示展視乃翁所自為詩音調諧雅字畫遒徑猶龍躍鳯翥鵬摶鯤運對之精爽飛越誠見所未見也侯蹙然曰先公以戎行從太傳伯顔公戰勝攻取將校惟珠玉金帛是競先公獨以圖書文史寓意焉凱旋輦以踰嶺衆有薏苡之疑先公發篋示之悉皆驚嘆悅服平定以來往往為博雅之士奪其所好今存無幾此卷母夫人藏之久矣近始以畀曰而父下江南所得者也蚤暮披閲當有益勿廢墜拜而受之不啻獲至寶願識諸左方以信後豫聞放翁唐內相宣公之裔二百年後乃能以文章事業晃耀一世振其家聲侯家傳帶礪笥襲簮裳遭聖明繼武垂拱守成四方無戰伐以恆人遇之孰不縱恣自肆而侯也日與繁弱忘歸鞭弭櫜鞬周旋公退燕間左圖右書紬今繹古客至圍棋投壺且馭禆佐如嚴師友撫士卒如親子弟雖古之名將向寵杜元凱之流不能過也侯能觀放翁之文章翰墨思放翁之勳名事業如放翁之振耀家聲行將易金莬大符樹崇牙髙節妙年未艾為天子出於南土以成考志以悅母顔使功烈洸洸赫赫吾見不止如今日之所觀也斯卷也其殆無恤袖簡也耶捲錦之餘因書以寓針規焉放翁姓陸氏名遊字務觀山隂人至治元年二月八日永嘉俞庸題前後俱有時中齋一印又程郇跋云放翁文章妙天下出處大節載之宋史世庸有不知者石湖范公帥蜀辟為元僚金摏玉撼人以為醉翁門下客輕裘緩帶雅歌酒應是投字壺當時意氣何如耶錦官城蓋翁朱同鄉也東歸還朝本非素志嘗有詩云杜鵑言語原無據悔却東吳萬里歸其心事蓋可見矣投老會稽世故盡絶東村西鄰田翁野老爾汝相忘猶有栗里柴桑氣象余往歲長尹和靖堂正在翁故里嘗得逰厯栁姑廟道士莊遺趾尚在翁之髙風猶可遐想秋泉髙侯出示此卷正歸老會稽所作時翁年已八十字畫遒徑詩律古淡乃如此中有夢為孤鶴過青城之句益知翁思蜀之念未始一息忘也余蜀人也岷山錦水寧不介然於懷耶嘉泰甲子距今歲泰定甲子恰兩周甲子矣感今懷昔慨前修之不作為之太息是歲四月望日眉山程郇書於京口郡幕後有王藻儒收藏圖書一印又陳璉跋云鎮江楊時中元至正初為郡庠直學有識鑒購得髙秋泉所收陸放翁親書所作詩若干首共為一卷有元人永嘉俞庸眉山程郁京口郭天錫題跋後歸其姪敏所尤寶愛之洪武中敏僑居南詔以所蓄書畫留其親戴處及回索原寄物俱已遺落幸而此卷獨存重加裝潢屬浙江僉憲致仕顧君仲謙馳書徴豫言按史翁諱遊字務觀越州山隂人年十二能詩文及長蔭補登仕郎為秦檜所疾檜死始赴福州寧德簿用薦為敕令所刪定官直言無隱尋遷大理寺司直兼宗正簿孝宗即位遷樞密院編修官兼編類聖政所檢討官史浩黃祖舜薦其善詞章諳典故召見上曰遊力學有聞言論凱切遂賜進士出身後出判建康隆興夔府時王炎宣撫川陕辟為幹辦公事翁為炎陳進取䇿後皆驗後范成大帥蜀翁為參議官以文字交不拘禮法人譏其頺放因自號放翁後纍遷江西常平提舉江西水災檄諸郡發粟與民召還改知嚴州過闕陛辭上諭曰嚴陵山水勝處職事之暇可以賦咏自適再召入見上曰卿筆力髙非他人可及除軍器少鑒紹熙元年遷禮部郎中兼實録院檢討官嘉泰二年以孝宗光宗兩朝實録及三朝史未就詔翁權同修國史實録院修撰尋兼祕書鑒三年書成升寶章閣待制致仕翁才氣超逸尤長於詩今卷中諸詩蓋致仕回山隂時所作者翁書於後曰嘉泰甲子歲正月甲午用郭端卿所贈猩猩毛筆時年八十矣嘉定二年卒年八十有五若公之詞翰在當時已為人主所重有不待豫言之贅因備記其仕迹俾覽者有所考與直學之識鑒敏之知所寶愛俱可嘉也時正統四年乙未冬十月既望嘉議大夫禮部左侍郎羊城陳璉書後有北海孫氏珍藏書畫印孫承澤印無住道人王掞藻儒之章顓菴諸印又沈周跋云放翁詩大類石湖書法亦大同小異在當時蓋二公互相取益也宜乎其忘勢遺位與之傾倒平生後世推范公之知人陸公之自信今人重勢位而輕人材者比比觀此卷重有感焉𢎞治庚戌後學長洲沈周跋前有洗心亭一印後有王掞之印西田居士二印諸跋中押縫許安國印凡三西田印二又時中齋王掞拙修堂諸印卷髙九寸一分廣二丈一尺八寸二分按程郇跋陳璉作程郁當有誤宋張即之書唐詩一卷上等往一素箋本大楷書七言律詩二首款識云淳祐十年八月下浣樗寮時年六十五寫卷前有神品王澍印長宜子孫子安珍藏記諸印又二印漫漶不可識卷末有王澍之印樂無事日有喜宜酒食二印卷中幅押縫有虛舟印凡二十卷髙一尺零七分廣四丈零一寸八分石渠寶笈卷二十九
