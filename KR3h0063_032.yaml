  text: 貯養心殿明朝人畫卷上等明王紱湖山書屋圖一卷明夏㫤竹泉春兩圖明沈周臨錢選忠孝圖一卷明沈周春郊散犢圖一卷明吕紀蘆雁圖一卷明趙汝殷風林羣虎圖一卷明唐寅毅菴小照一卷明唐寅溪山漁隠圖一卷明唐寅事茗圖一卷明仇英漢宫春曉圖一卷明仇英列女圖一卷明文徴明畫松一卷明文徴明真賞齋圖一卷明陳栝三友圖一卷明宋旭沈俊山水合卷明許邦本摹輞川圖一卷
