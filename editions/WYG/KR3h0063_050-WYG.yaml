body:
  text: 貯重華宫列朝人書畫書卷上等宋蘇軾自書二頌元趙孟頫天冠山詩帖明文徴明書赤壁賦明董其昌書濬路馬湖記書卷次等明文徴明自書詩帖明文徴明自書詩帖明文徴明書蘭亭序明莫是龍供花閒語明董其昌臨蘇軾黄庭堅帖國朝人書畫書卷次等王鐸擬古帖列朝人書畫畫卷上等宋徽宗五色鸚鵡圖宋徽宗花鳥寫生宋李成茂林遠岫圖宋李成小寒林圖宋祁序江山放牧圖宋李公麟君明臣良圖宋王詵漁村小雪圖宋馬逺江山萬里圖遼陳及之畫貞觀便橋㑹盟圖元吳鎮夏山欲雨圖元吳鎮清溪垂釣圖元盛懋畫烈婦刺虎圖明沈周寫生明沈周寫生花鳥明項聖謨後招隠圖
