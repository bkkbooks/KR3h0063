body:
  text: 貯重華宫三列朝人書畫畫册上等歴代名繪紈扇畫册集古圖繪明項聖謨冩生明人畫扇集册明人畫扇集册明文氏畫扇集册畫册次等名繪薈萃集古圖繪歴代名繪宋徽宗花鳥冩生厯代集繪名畫薈萃厯朝名繪明仇英花鳥明陸遠摹古無名氏書畫畫册次等宋人歴代琴式歴朝名人圖繪歴代畫幅集册紈扇集錦紈扇畫册宋元紈扇畫册明人倣宋元諸家山水明人百獸率舞圖刻絲畫册上等附鏤繪集錦
  hash: sha256:aff6a45f8f8ea35edbac9796fc7d102ec5616e46b5c54cbbc8056ce0d1016d57
