body:
  text: 貯飬心殿列朝人書畫目録書軸上等明董其昌書劉禹鍚謝春衣表書軸次等元張雨書七言律詩明王守仁書五言古詩明婁堅書王縉詩明董其昌仿蘓軾筆意明董其昌書五言絶句國朝人書畫目録書軸次等沈荃節臨枯樹賦張英書七言絶句張廷玉書七言律詩列朝人書畫目録畫軸上等六朝張僧繇雪山紅樹圖五代黄筌梨花山雀圖宋宣和溪山秋色圖宋黃居宷山鷓棘雀圖宋巨然層巖叢樹圖宋郭熙早春圖宋米芾雲山圖宋揚補之畫梅宋李安忠雪岸寒鴉圖宋馬麟静聽松風圖元趙孟頫白鼻騧圖元管道昇竹溪覽勝圖元趙雍山鷓棠梨圖元錢選花冠秋色圖元柯九思晚香髙節圖元柯九思畫竹元黄公望九珠峯翠圖元王䝉坐聽松風圖元王蒙石壁飛流圖元王蒙雙松漁隠圖元王蒙秋林萬壑圖元王蒙秋山讀書圖元倪瓉溪山圖元倪瓉江亭山色圖元倪瓉紫芝山房圖元倪瓉容膝齋圖元倪瓉筠石古槎圖元曹知白羣峰雪霽圖元陳貞白雲山房圖元方方壺神嶽瓊林圖元馬文璧山水元馬文璧春江問渡圖明宣宗花下貍奴圖明冷謙白岳圖明徐賁蜀山圖明王紱草亭烟樹圖明王紱淇渭圖明王紱勘書圖明王紱獨樹圖明商喜戯猫圖明戴進聽泉圖明陳憲章萬玉圖明沈周杏林書舘圖明沈周放鴿圖明沈周畫虎明吕紀寒雪山鷄圖明唐寅燈宵閨話圖明唐寅松溪獨釣圖明仇英碧梧翠竹圖明仇英林亭佳趣圖明仇英西園雅集圖明文徴明春山烟樹圖明文徴明松聲一榻圖明文嘉仿王蒙南村草堂圖明文嘉巖瀑松濤圖明文伯仁方壺圖明文伯仁松岡竹塢圖明文伯仁溪山秋霽圖明閨秀趙文俶寫生明陳淳江流澄碧圖明陳淳重陽風雨圖明陳栝畫海棠明錢糓仿王蒙蕉石圖明陸治天池石壁圖明項亢汴栢子圖明項徳新秋江雲樹圖明宋旭雲巒秋瀑圖明董其昌烟樹茒堂圖明董其昌秋林書屋圖明董其昌竒峰白雲圖明項聖謨古木幽篁圖明項聖謨桃花冩生畫軸次等五代關仝秋山晩翠圖宋徽宗紅蓼白鵝圖宋巨然秋山圖宋巨然富春山圖宋趙昌四喜圖宋江参摹范寛廬山圖宋劉松年溪亭客話圖宋王庭筠花隂􅃧猫元趙孟頫栁隂雙駿圖元趙孟頫荷花水鳥圖元趙孟頫蘭竹元趙雍春郊遊騎圖元趙雍羣峯雪霽圖元薩都刺嚴陵釣臺圖元王淵寒江蘆鴈圖元倪瓉平林逺岫圖元倪瓉江千秋樹圖元呉鎭篔簹清影圖元呉鎮漁父圖元盛懋松鶴圖明倪端捕魚圖明林良畫鷹明陶成菊花雙兎圖明呉偉寒山積雪圖明沈周古松圖明吕紀荷渚睡鳬圖明吕紀桃栁雙鳬圖明吕紀雪景翎毛明唐寅竹溪髙士圖明仇英春遊晩歸圖明仇英琵琶行圖明文徴明寒山風雪圖明文徴明溪山深雪圖明文徴明緑隂清話圖明文徴明古洗蕉石圖明姜隠文石甘蕉圖明謝時臣青松白雲圖明陸治春山溪閣圖明陸治捕魚圖明徐渭冩生牡丹明董其昌仿燕文貴筆意明董其昌仿米元章瀟湘白雲圖明董其昌虞山雨霽圖明董其昌春湖烟樹圖明趙左寒山石澑圖明趙左秋山紅樹圖明劉邁杏林春燕圖明郭甸寒鴉宿鴈圖明陳洪綬倚杖閒吟圖明陳洪綬松岡梅塢圖明崔子忠桐隂博古圖明陳嘉言畫端陽景
