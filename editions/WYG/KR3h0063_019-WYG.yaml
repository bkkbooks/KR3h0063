body:
  text: 貯乾清宫八列朝人畫軸上等宋易元吉池塘清景圖一軸上等天一素箋本著色畫款署元吉軸髙二尺四寸五分廣三尺二分宋崔慤槲鳩圖一軸上等地一素絹本著色畫𨽻書款識云崔慤熙寧三年畫上方有晉國奎章一印右方上一印漫漶不可識下有商邱宋犖審定真跡一印左方上有晉府書畫之印敬徳堂圖書印二印下有清和珍玩乾坤清秘二印軸髙四尺四寸廣一尺七寸五分詩塘御筆題俊逸二大字有乾隆御筆之寶一璽御筆題籖籖上有乾隆宸翰一璽宋林椿花竹草蟲圖一軸上等元一素絹本著色畫款云林椿寫畫右方上有晉國奎章一印左方上有晉府書畫之印敬徳堂圖書印二印下有清和珍玩乾坤清秘二印軸髙三尺五寸七分廣一尺七寸四分御筆題籖籖上有乾隆宸翰一璽宋米芾雲山圖一軸上等黄一素絹本著色畫款識云元符元年夏襄陽漫仕米芾下有米芾之印一印左方下一印漫漶不可識下方張照奉勅識云米黻自叙云山水古今相師少有出塵格者因信筆作之多烟雲揜映樹石不取細意似便已知音求者只作三尺横掛三尺軸更不作大圖無一筆李成闗同俗氣黻天資髙邁趣尚竒古又流寓金焦北固間久江山神秀盪其胸腑故能以筆花墨雨賦無聲之詩千品萬狀與造物爭巧自黻創格子友仁紹之横絶千古後賢仿效終無有入室得髄者葢蒼茫中有分疏雄渾中具秀潤蕭灑中逾濃郁兩頭並到中邊俱甜曠代竒作也鄧椿云元章字札流傳四方獨于丹青誠為罕見南宋時已然况今又閱六七百年耶乾隆八年閏四月初九日賜觀此幅並勅題記神悚心幸筆舌罔措臣張照敬識左方下一印漫漶不可識軸髙一尺五寸四分廣一尺一寸五分宋李唐寒谷先春圖一軸上等宇一素絹本著色畫款脱軸髙九尺八寸五分廣八尺八寸五分宋蘓漢臣鎖諫圖一軸上等宙一素絹本著色畫款識云戊辰蘓漢臣畫下有復父氏一印軸髙三尺二分廣一尺六寸六分宋劉松年東山絲竹圖一軸上等洪一素絹本著色畫款云劉松年畫右方上有晉國奎章一印下有司印半印左方上有晉府書畫之印敬悳堂圖書印清和珍玩乾坤清秘諸印下一印漫漶不可識右邊幅有蒼巖子蕉林居士二印軸髙一尺六寸八分廣一尺七寸七分宋馬逺嵗寒三友圖一軸上等荒一素絹本著色畫款署臣馬逺左方上有題句云絳蕋多妍麗春風艷筆端若無枝上雪幾作杏花看未署款右方下有梅澗錢塘朱氏二印又司印半印軸髙六尺三分廣三尺三寸宋吕健翎毛一軸上等日一素牋本著色畫𨽻書款署吕健下有吕健之印吕氏六陽二印軸髙九尺九寸五分廣三尺六分元趙孟頫夏木垂隂圖一軸上等月一宋箋本墨畫款識云至大三年六月卄五日作夏木垂隂圖子昻下有趙子昻氏松雪齋二印軸髙四尺五寸八分廣一尺八寸四分元趙孟頫疎林秀石圖一軸上等月二素牋本墨畫款署子昻下有趙氏子昻一印右方上王行題云玉署當年雅度苕川晚日髙居每向詩中見畫今於畫裏觀書姑蘓王行左方上柯九思題云水晶宫裏人如玉牕瞰鷗波可釣魚秀色疎林秋色滿時將健筆試行書丹邱柯九思題又危素題云叢篁偏映寒雲色古石猶凝翠蘚痕曾是碧瀾堂上月獨臨苕水憶王孫臨川危素題右方上有鍊雪一印下有晴嵐珍藏式古堂書畫印石民瞻印諸印左方下有鍊雪鑒定卞令之鑒定諸印又一印漫漶存小字可辨軸髙二尺一寸四分廣一尺三寸元管道昇畫竹一軸上等盈一素綾本墨畫款題云步搖鳴向水晶宫修竹千竿兩袖風濃墨飽濡兼縦筆不知遺滴茜裙紅仲姬戯筆下有管氏仲姬魏國夫人趙管二印後虞集𨽻書題云魏公書畫工夫人巧書畫睠兹庭上竹雙雙玉相亞道園虞集又宋克題云水精宫製姓名香野竹蕭蕭帶夕陽錦繡似霞人似玉柔荑輕握綵毫長東吳宋克右方下有男趙奕百拜觀六字下有藏真一印左方下有柳莊一印軸髙四尺九寸六分廣一尺七寸元錢選鷄冠一軸上等昃一素牋本著色畫款題云紫冠金鈿覆千層赤玉丹砂血染腥雨餘似鬭還無力風動如鳴只少聲錢選下有舜舉印章一印右方下有燮五珍藏一印軸髙一尺八寸四分廣九寸四分元錢選茶竹山雞一軸上等昃二素絹本著色畫款云吳興錢選畫下有舜舉一印軸髙三尺四寸三分廣一尺五寸八分御筆題籖籖上有乾隆宸翰一璽元陳琳筍竹乳雀圖一軸上等辰一素絹本著色畫無款姓名見䟦中左方上趙孟頫識云仲美作筍竹乳雀圖落筆便有生意近之畫者莫能及也子昻軸髙三尺五寸三分廣一尺七寸六分元柯九思古木新篁圖上等宿一素絹本墨畫𨽻書款識云至正辛邜春日丹邱柯九思上鈐敬仲一印上方王士㸃題云新篁添嫩葉古木長虬枝竒石無塵染悠然世外思東平王士㸃題又張羽題云修篁古木傲霜姿歳晩蕭森寄所思風月一庭人寂寂茗杯書卷自相宜潯陽張羽又徐憲題云苔封一竒石雲拂數琅玕風月蕭蕭地清隂生晝寒東海徐憲題左方下有陸氏子傳瓜涇耕讀人家二印軸髙一尺九寸五分廣九寸八分元柯九思修篁樹石一軸上等宿二素絹本墨畫款識云至正癸邜菊月望日柯九思寫下有柯氏敬仲一印前有劉基題云蒼龍倒掛雲入地囘首郤攀雲上天夜深水散明月出化作修篁舞翠烟括蒼劉基軸髙四尺四寸廣三尺七寸二分元王淵花鳥一軸上等列一宋箋本墨畫𨽻書款云若水王淵畫下有王淵之印澹軒居士二印上方陸繼善題云池上新花鏡裏粧韶華輝映彩鴛鴦風前湛露濛濛濕翠羽翻飛錦浪香陸繼善又吳瓘題云露翻霞堕亂香飛蓮女歌聲風外㣲妒殺鴛鴦花裏戲月明清影亦依依竹莊主人又宋旡題云文禽浮緑水唼荇共荷香花態如相訴憐儂情夢長宋无又甘立題云一枝出水本天然色映雙鴛更可憐好似採珠臨合浦凌波㣲步自仙仙甘立題又鄭元佑題云夜舒荷是若耶人香散鴛鴦共影身一段柔情看未足故教綺筆寫來真尚左生右方上有真賞一印下有耿嘉祚印潄六主人勤僖公後人珍秘宜爾子孫諸印左方上有丹誠一印下有琴書堂都尉耿信公書畫之章公字信公珍賞湛恩耿㑹侯鑑定書畫之章諸印軸髙三尺八寸七分廣一尺五寸五分元王淵古木鳴禽圖一軸上等列二素絹本著色畫𨽻書款識云元統改元十二月朔為彦暉作古木鳴禽圖於願學齋中錢塘王若水識下有一印漫漶不可識軸髙四尺八寸廣三尺二寸二分元王淵山叢野雉圖一軸上等列三素絹本墨畫𨽻書款云王淵畫左方上有蕉林書屋一印右方中有棠村審定蕉林玉立氏圖書二印軸髙四尺七寸六分廣一尺八寸七分元唐棣疎林䇿蹇圖一軸上等張一素絹本墨畫款署子華右方上有咸熙之印一印又一印不可識下有李君實鑒定子孫永保二印又一印不可識左方上有耿昭忠信公氏一字在良别號長白山長收藏書畫印記一印下有東海徐元玉父李廷震珍藏二印軸髙三尺四寸九分廣一尺七寸詩塘御題云石泉咽危灘輕烟散林表新豐酒難沽寂寂空山曉風吹墊角巾斜月猶皎皛颯然風月懐豈慕長安道試問灞橋人新詩得多少御題下有乾隆宸翰陶冶性靈二璽御筆題籖籖上有乾隆宸翰一璽元唐棣松隂垂釣圖一軸上等張二素牋本墨畫款云缺唐棣子華作下有唐棣一印又審定真蹟缺韓氏家藏二印左方下二印漫漶不可識軸髙一尺九寸五分廣九寸九分御筆題籖籖上有乾隆宸翰一璽元唐棣山水一軸上等張三素牋本著色畫款題云青山不趂江流去數㸃翠收林際雨漁屋逺糢糊烟村半有無興酣飛醉墨秋與天争碧浄洗綺羅塵一巢棲亂雲詞寄菩薩蠻至正十年冬孟唐棣子華寫下有唐棣一印右方下有收藏書畫圖記半印軸髙一尺七寸四分廣一尺一寸元王蒙臨平秋早圖一軸上等寒一宋箋本著色畫右方上篆書署臨平秋早四字款云黄鶴山中人王叔明為進之畫下有王叔明氏一印左方下有棠村審定蕉林二印軸髙四尺一寸七分廣一尺七寸四分左方上御題云楓丹松翠自天成不繫人間枯與榮無住相中藏住相何勞落葉賦秋聲乾隆庚申夏五題下有乾隆宸翰涵虚朗鑒二璽御筆題籖籖上有乾隆宸翰一璽元王蒙松林書屋圖一軸上等寒二素牋本墨畫篆書款云黄鶴山樵畫下有王叔明一印右方下有衡貞一印軸髙一尺九寸七分廣七寸八分元倪瓚松亭山色一軸上等來一素牋本墨畫款題云阿翁好讀閒居賦桃李春風滿庭户時與華陽道士行還鄰甫里先生住寶净僧居共齋粥已看富貴如風霧我來三宿夜連牀行路荆榛歳將暮壬子九月十九日為潘翁仲輝寫松亭山色圖并賦七言題右方瓚前有墨林一印後有項元汴印墨林秘玩二印下有墨林主人一印左方上有天籟閣一印下有梅壑檇李項子京家珍藏子孫世昌諸印詩塘右方沈周題云華屋不留留此圖秀色今來照書户夸父空將碧嶂移羽人仍在丹邱住非人玩物物玩人老墨重披眼迷霧門前桃李換春風只有青松自遲暮此圖實吾蘓貴㳺家物嘗目擊其人之愛䕶比珠玉人往物移今為淮陽趙文美所得文美號賞識其致重將愈扵前而保於久也雲林先生戲墨江東人家以有無為清俗此筆先生疎秀迭常然非丹青焙耀人人得而好之於此而好者非古雅士不可先生之道迨見溢於南而流於北矣文美特來求䟦因次先生韻為詩庸寓夫得失之歎云𢎞治甲子五月二日長洲沈周題前有退宻若水軒子京父印後有項墨林父秘笈之印墨林秘玩項子京家珍藏項叔子恒山梁清標玉立氏圖書諸印軸髙三尺六分廣一尺四寸五分詩塘左方御題云蒼松白石皆堪賦㸃筆秋光罨軒户我偶得之不忍捨彼草亭中曾少住何須更詠石田句世間得失空雲霧蕭齋一榻篆烟清牕外羲娥任晨暮款云用倪瓚元韻題下有乾隆宸翰務時敏二璽御筆題籖籖上有乾隆宸翰一璽元倪瓚南渚春晚圖一軸上等來二素牋本墨畫款識云至正十二年暮冬將游吳松舟過甫里為元素翁留寓其處泊舟南渚忽然四改月元素翁之季子叔陽隠蹟為黄冠師頗以詩酒自放三月卄日賦詩見贈余輒次第其韻云誰道南湖來往少白雲明月自相過鶯啼寂寂看將晩花落紛紛稍覺多金陌谷疑衍銅駝荆棘滿石魚酒艇醉顏酡日斜睡足衡門下更聴吳歈子夜歌是日適仲賢瞿君來訪親戚且徵余畫戲為寫此并題是詩畫上以贈吾叔明見之當共一笑也滄浪漫士倪瓚記是歳為十三年後楊維禎題云雨晴春水緑生波八柱樓船海上過隔屋白雲飛絮亂滿簾紅雨落花多書行仙客榴皮濕酒上美人花面酡醉提鐡龍吹小海停杯更索莫愁歌抱遺老人奉和滄浪漫士韻在水心雲景樓醉筆右方下有水東金李穉仙父桐孫堂家藏書畫之印一印左方中有汪丁立張照之印太原王遜之氏收藏圖書諸印軸髙三尺二寸八分廣一尺三寸八分元倪瓚溪亭山色圖一軸上等來三素牋本墨畫款題云至正乙巳閏十月五日因瓊野上人以此紙來需畫旣為寫溪亭山色並書洪容齋所筆僧具圓復詩三首畫上贈之灘聲嘈嘈雜雨聲舍北舍南春山平拄杖穿花出門去五湖風浪白鷗輕右送僧朝入羊腸暮鹿頭十三官驛是荆州具車秣馬曉將發寒燭燒殘語未休右送翁士特一篇云燒燈過了客思家獨立衡門數暝鴉燕子未歸梅落盡小牕明月屬梨花又吳門僧惟茂住天台山一禪刹喜其旦暮見山作絶句曰四面峰巒翠入雲一溪流水潄山根老僧只恐山移去日午先教掩寺門甚有詩家風㫖而或者謂山若欲去豈容人掩住葢吳人癡獃習氣也其説可謂不知音净名庵主懶瓚書於蝸牛廬後孫大雅題識云雨中留緑浄軒友人髙彦舉出示所藏倪雲林山水並識僧詩復求余題余為兩詩以一效僧閉門留山之語一以歎雲林筆思之清且此詩此畫可見其人不可復得寧不興觀者之思而重彦舉之什襲云時洪武十五年歳壬戌中秋日江隂孫大雅書過雨山如罨畫明溪聲直到白雲亭雲遮不斷溪聲去流出平蕪兩岸青白髪雲林老畫師一生辛苦竟誰知何須更上峰頭望滿目清秋滿目詩上方有神品一印右方下有成子容若楞伽真賞二印左方下有成徳楞加山人容若書畫三印軸髙四尺八寸七分廣一尺七寸四分元倪瓚林石小景一軸上等來四宋箋本墨畫款題云山郭幽居政向陽喬林古木鬱蒼蒼剡藤百幅誰能置為掃虬枝蔽日長荆蠻民題下有雲林子一印後鄭元祐題云雲林雨過踏春陽澗水濺濺老樹蒼不是硯㘭雲作陣疎篁空拂脱一字簷長尚左生次韻又陳基題云邱崇崇兮下有流水樹森森兮匪櫟伊梓彼櫟滋兮且壽梓棄為薪兮與材何有造物孔仁兮將誰歸咎韋羌山人陳基又胡寧題云千年石上苔痕裂落日溪囘樹影深我亦江南樵隠者人間何處有雲林胡寧又陸繼善題云十年不鼓江湖檝木葉蕭蕭鬢影秋忽憶滿川風雨夕雲林㟁口獨維舟陸繼善又顧盟題云偶因滌硯寫從容㸃染那能似化工千載風流誰可擬令人猛憶米南宫甬東顧盟右方中有玉山人清森閣書畫記二印下有元朗鑒定二印左方中有李應禎印貞伯父二印右方上押縫有元賞齋一印左方下押縫有董𤣥宰一印右邊幅董其昌䟦云雲林畫以荆蠻民為第一前人品題有據蓋學董北苑唯見於此他幅無印款此尤異云董其昌題於戲鴻堂庚子四月之望軸髙二尺二寸廣一尺九分元倪瓚古石脩篁圖一軸上等來五素牋本墨畫款署雲林生瓚上方有六言題句云朽株半承雨澤翠篠徒倚溪濵留伴山中黄石蕭然林下無人後署中山又錢惟善題云惟松也茂以貞惟竹也直以清惟石也静以寧君子有之是為歳寒之盟後署曲江又七言題句云古石離離野水濆疎篁幽木帶寒雲雲林畫裡藏書法要識先秦篆籀文後署冰玉堂牛馬走又右方中七言題句云懶瓚先生守太𤣥髙懷水墨寄雲箋山中化鶴尋仙後清閟無人繼尚賢徳署苕東生軸髙一尺八寸廣八寸有竒元倪瓚溪山亭子一軸上等來六宋牋本墨畫款識云東海倪瓚畫溪山亭子贈孟佶文學歳乙未閏正月八日又自題云戲墨重看十七年闔閭樓閣蕩飛烟簡村蘭若風波外坐對湖山一惘然辛亥十一月九日復覽因題雲林子後王植題云故人揖别動經年雲樹雲山隔逺烟來看畫圖如夢裏焚香清對意悠然植與雲林髙士在儒林酌别今隔嵗矣謹用韻寫上海雲方丈一教之王植右方上有神品真賞二印下有珍秘宜爾子孫成徳姚𢎞道印朱氏義濟堂珍藏圖書古歙世家諸印左方上有丹誠一印下有琴書堂都尉耿信公書畫之章公字信公珍賞吳友鳯印清森閣書畫印何氏元朗成子容若楞伽真賞諸印又榆溪程因可半印軸髙三尺二寸九分廣一尺八分元倪瓚秋林野興圖一軸上等來七素牋本墨畫款題云余旣與小山作秋林野興圖九月中小山攜以索題憶八月望日經鉏齋前木樨盛開因賦下韻今年自春徂秋無一日有好興味僅賦此一律錄於左方政喜秋生研席凉卷簾㣲露浄琴張林扉洞户發新興翠雨黄龍籠逺牀竹粉因風晴靡靡杉幢承月夜蒼蒼焚香底用添金鴨落蕋仍宜副枕囊己邜九月四日倪瓉又自識云今年歳在甲午冬十一月余旅泊甫里南渚陸益徳自吳松歸攜以相示葢藏于其友人黄君允中家余一時戲寫此圖距今十有五年矣對之悵然如隔世也瓚重題其左而還十九日右方上陸繼善題云晻藹生青暉空㝠照秋影遐眺修亭虚一覽心已領西泠陸繼善題右方下有澤漁一印詩塘吳寛題云經鉏堂前木樨黄何人晏坐聞天香迂翁胸中有清癖欲掃繁花歸枕囊秋林野興圖親寫百年流落燕都下市門不遇杜長垣殘墨誰將手重把𢎞治壬子臘月子開至京偶見此圖識其為雲林真筆也因購得之重加裱褫請予題其上葢此圖破闇已甚知好者少其亦可謂遭矣吳寛又王鏊題識云百年遺墨尚精神鑒賞還歸杜老真今日長垣傳法眼固知少嫩亦如人頃余讀東原遺藁其論雲林畫品云世率以其書辨真贋不知早嵗作尤少嫩如其人故余詩云然先生知畫之深者也王鏊軸髙二尺三寸五分廣二尺九分元吳鎮赤壁圖一軸上等署一素牋本墨畫款識云至正二年春梅花道人畫下有梅花葊嘉興吳鎮仲圭書畫記二印右方下有心逺堂圖書一印左方下有廷綱一印軸髙三尺三寸八分廣一尺三寸九分元吳鎮秋江濯足圖一軸上等暑二素牋本墨畫款題云古木垂蘿一老夫亂山蒼靄入看無不知多少城居者誰解秋溪濯足圖至正八年戊缺九月梅道人戲墨下有梅花庵嘉興吳鎮仲圭書畫記二印軸髙三尺七寸八分廣一尺七寸一分御筆題籖籖上有乾隆宸翰一璽元盛懋山莊對奕圖一軸上等往一素絹本著色畫款云武唐盛懋子昭畫下有一印漫漶不可識軸髙五尺二寸四分廣二尺六寸七分御筆題籖籖上有乾隆宸翰一璽元曹知白松溪蕭寺圖一軸上等秋一素牋本墨畫篆書款署雲西二字下一印殘缺不可識左方下有彦敬氏古杭瑞南髙氏賞鑒二印軸髙一尺四寸五分廣一尺六分元陸廣古木幽篁圖一軸上等收一素牋本墨畫右方上署古木幽篁四字款云天㳺生陸廣下有陸廣天㳺生二印左方上王士㸃題云兩岸青山烟霧生一天秋水暮潮平何時共載陸徵士重汎中流醉月明王士㸃題下有停雲一印軸髙一尺三寸一分廣九寸元王元中古木幽篁圖一軸上等冬一素牋本墨畫款識云至元四年正月九日伯京攜此紙徵拙作為寫幽槎新篁以記嵗月京口王