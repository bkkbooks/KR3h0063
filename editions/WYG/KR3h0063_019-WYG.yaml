五寸五分廣一尺一寸二分明董其昌雲岫圖上等騰三素牋本墨畫左方上署山矗天中半天上洞穿江底出江南句款云𤣥宰畫下有昌字董元宰二印右方上陸彦章識云雷轟三峽景電掃千巖霏此圖氣勢彷彿似之陸彦章題于流波榭中下有珍藏記半印詩塘陳繼儒題云偶借王洽墨潑成雲與岫下有猿猱啼上有霹靂鬭𤣥宰真蹟如雷如霆眉公題於黄鳥緑隂間軸髙三尺六寸七分廣一尺四寸九分眀杜霖髙冠柱石圖一軸上等致一素箋本著色畫款云小癡杜霖寫軸髙三尺三寸一分廣一尺七寸明顧懿徳山水一軸上等雨一宋牋本墨畫款署顧懿徳下有原之懿徳二印右方上陳繼儒識云畫格精㣲以右丞為第一文徵仲初學畫時専以輞川為師其後出入元四家而不離規檢原之筆墨無一㸃粗氣俗氣即𤣥宰極心折之此幅可証今人不師古人而下筆草草目無臨本雖成未免帶縦横家餘習此原之所呵也眉公題於頑仙廬緑隂之下軸髙一尺六寸廣八寸九分明王時敏層巒秋霽圖一軸上等露一素牋本著色畫左方上署層巒秋霽四字款識云丁邜八月畫王時敏下有王時敏印遜之二印右方上董其昌䟦云遜之璽卿嘗聞沈石田嵐容川色之妙為此欲擬之已先得其神照矣其昌題左方下有教忠堂藏衣園居士二印軸髙三尺四寸七分廣一尺四寸一分畫軸次等唐王維林峯積雪圖一軸次等天一素絹本著色畫款署王維唐王維闗山行旅圖一軸次等天一素絹本著色畫無款姓氏見詩塘文徵明識語中宋徽宗通臂摘果圖一軸次等地一素牋本著色畫未署款上方押字鈐宣和御墨一璽宋李成寒林積雪圖一軸次等元一素絹本墨畫款識云建隆三年八月望日寫寒林積雪李成上方有宣和御題一宋董源烟浮逺岫圖一軸次等黄一素絹本墨畫無款左方上有董源烟浮逺岫圖七字按係宣和筆宋黄居宷山水并寫生一軸次等宇一素絹本著色畫凡二幅上幅圓光下山水下幅竹鶴款署黄居寀宋翟院深溪山霽雪圖一軸次等宙一素絹本墨畫款署翟院深宋郭熙秋山紅樹圖一軸次等洪一素絹本著色畫款署郭熙上方有詹希元題句一宋郭熙雙松泉石圖一軸次等洪二素絹本墨畫款云河陽郭熙筆宋王詵三白圖一軸次等荒一素絹本著色畫款云大宋駙馬都尉王晉卿寫三白圖宋戴琬太平時樂鳥一軸次等日一素絹本著色畫款署戴琬宋蘓漢臣毛女圖一軸次等月一素箋本著色畫無款姓名見詩塘豐坊題識中元趙孟頫百駿圖一軸次等盈一宋箋本著色畫詩塘款題云沙樹歴厯沙草荒江上誰開芻牧場馬羣所聚凡一百飲秣而俯嘶而昻寢訛浴涉踶且驤或乳或駐或軋瘡三縦五横不成行若龍若􅗬青紫黄烏騅赤兔照夜白連錢桃花鬭文章牝兮牡兮未可辨亦莫可識駑與良相骨相肉俱已矣老夫兩眼徒茫茫但愛各各無羈韁自縱自得肥而駫肥哉肥哉空老死未試何以知爾長我知馬亦待駕御人馬兩得氣始揚請看溝汗流血漿争前欲逐左賢王追風掣電一般走一百之中當有强百馬余十年前所畫仲時秀才近得於錢唐市上歸而持以示余余因作歌以寄意大徳元年二月孟頫識元錢選寫生一軸次等昃一素箋本著色畫薔薇白燕款署吳興錢選元錢選折枝桃花一軸次等昃二素絹本著色畫款題云絶憐春意太芳妍晴色紅霞照滿川郤憶𤣥都乆蕪後花神故使筆端傳舜舉元黄公望浮嵐暖翠圖一軸次等辰一素絹本著色畫自識云浮嵐暖翠圖時年八十有二下有黄公望一印元王蒙長夏幽居圖一軸次等宿一素箋本著色畫款云黄鶴山人王䝉作右方上有葉顒題句一元倪瓚山水一軸次等列一素牋本墨畫款題云筆鋒雖小劣景物亦清新蕭瑟楓林晩江湖有逸民舍留南湖黙庵髙士扁舟相過不一月而來數番酒肴殷勤情意甚美醉後偶寫此圖以贈而邱止善適至復取以脱止善雖片紙亦可觀也至正癸邜五月二十二日偶過伯昻徵士書齋中忽以相示轉瞬十有二年矣世殊事異為之慨然時同集者徳機𨼆君也瓚元倪瓚荆溪書屋圖一軸次等列二素牋本墨畫款識云至正七年春三月卄七日憲僉相公徳昭先生捩柂相過其情義之厚可謂至矣四月三日舟還荆溪既作此圖以贈復賦詩其上云我識部使者曹姓徳昭字氣和而心平腹為五經笥遇酒亦酣暢賦詩轉清駛僦居荆溪上映户山擁髻桐隂覆書帙白石明水涘樂易近樵牧曠達忘省寺冬墨收松煤夏佩紉山蕙悠悠意不愜鼓枻涉吾地援蘿以永嘯乃尋衆所棄連牀語至旦自卯坐忘寐髙談雜諧謔情真無畏避嵗百過已半㑹遇良不易非公有賞識那得傾意氣公其愛體素潔白古亦忌前署東海生倪瓚元倪瓚浦城春色圖一軸次等列三素牋本淺著色畫款題云遜學親契其先世居閩之浦城為寫浦城春色圖并賦詩云七閩嵐翠合山勢浦城髙春靄浮青壁晴曛醉碧桃吟猿儔木客飛瀑亂松濤夢入千峰裡雲霄一羽毛倪瓚甲寅二月元倪瓚樹石小景一軸次等列四素牋本墨畫款云至正癸邜夏五月四日畫於西溪仙館倪瓚元盛懋漁樵圖一軸次等張一素絹本著色畫款云武唐盛懋子昭明宣宗獅子圖一軸次等寒一素絹本著色畫款識云宣徳丙午製明宣宗黑猿圖一軸次等寒二素牋本著色畫款識云宣徳七年御筆明宣宗觀梅詩思圖一軸次等寒三素絹本著色畫金書款識云宣徳戊申御筆戲寫下方白綾本有明臣翟鑾題句一明夏㫤淇園春雨圖一軸次等來一素絹本墨畫款云淇園春雨仲昭明邊景昭花鳥一軸次等暑一素絹本著色畫款云隴西邊景昭寫明邊景昭錦桃山雉圖一軸次等暑二素絹本著色畫款云隴西邊景昭寫明商喜桞隂散牧圖一軸次等往一素絹本著色畫款署商喜明温良百蝶圖一軸次等秋一素絹本著色畫款云温良畫明林良秋塘雙雁圖一軸次等收一素絹本墨畫款署林良眀林郊蘆雁一軸次等冬一素絹本淡著色畫未署款右方上有南海林郊一印明戴進海屋鶴􅄸圖一軸次等藏一素絹本著色畫款云錢唐戴進寫明戴進前赤壁圖一軸次等藏二素絹本著色畫款署静庵明張路蟠桃九熟圖一軸次等閏一素絹本著色畫款署平山明沈周江亭待月圖一軸次等餘一素絹本著色畫款題云溪雨乍晴秋水濶夕陽猶在晩山明江亭獨坐月未出白鬢翛然風忽生沈周下有戴明說記語一明吕紀茶梅竹雀圖一軸次等成一素絹本著色畫款署吕紀明吕紀花卉一軸次等成二素絹本著色畫款署吕紀明吕紀雪柳寒兔一軸次等成三素絹本著色畫款署吕紀明吕紀蘆洲秋雁圖一軸次等成四素絹本著色畫款署吕紀明吕紀雪桞魚鷹圖一軸次等成五素絹本淡著色畫款署吕紀明吕紀荻浦雁來圖一軸次等成六素絹本著色畫款署吕紀明唐寅秋亭逺岫圖一軸次等嵗一素牋本墨畫款署晉昌唐寅明仇英松亭放鶴圖一軸次等律一素絹本著色畫𨽻書款云仇英製明仇英蘭亭㑹圖一軸次等律二素絹本著色畫款云仇英實父為溪山先生製明文徵明楓林詩意圖一軸次等吕一素牋本著色畫書唐人停車坐愛楓林晩霜葉紅於二月花句款署徵明明文徵明古樹竒石圖一軸次等吕二素牋本墨畫款識云古樹竒石勝國柯敬仲曾有此幀漫仿之徵明明謝時臣湖山春晚圖一軸次等調一素絹本墨畫款云湖山春晚謝時臣寫明陳子和蘆雁一軸次等陽一素絹本淡著色畫款云七十七叟灑仙陳子和寫明王偕蓮鷺芙蓉圖一軸次等雲一素絹本著色畫款署王偕明周之冕梅花一軸次等騰一素絹本著色畫款署汝南周之冕詩塘有張鳯翼題句一明董其昌秋山圖一軸次等致一素絹本著色畫款題云紅樹秋山飛亂雲白茅簷底界斜曛此中多少逍遙處難說於君畫與君董𤣥宰畫并題明董其昌秋山書屋圖一軸次等致二素牋本墨畫款題云雲開見山髙木落知風勁亭下不逢人夕陽淡秋影𤣥宰明董其昌春景山水一軸次等致三素絹本著色畫款題云渡水傍山尋絶壁白雲深處洞天開幽人來往行無跡石徑春隂長緑苔董𤣥宰畫明項聖謨􅃪泉圖一軸次等而一素絹本著色畫款題云此老閒如鶴逍遙山水間祗縁心太古終日聴潺湲項聖謨詩畫明鄭文林採芝圖一軸次等露一素絹本著色畫款署溟山明薛素素畫蘭一軸次等結一素牋本墨畫款識云辛丑初秋日寫薛素素前後有荆明璋錢貢張永昌周之冕陳煗馬鳴霆諸題句石渠寶笈卷八
