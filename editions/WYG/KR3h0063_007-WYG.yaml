黄綺輩千秋稱大隠漢庭豈金堂何須摇唇吻蒼蒼虬枝外望望迷處所莫云足寂寥爛漫雲堪侣後識云秋隂忽晴天髙氣爽林木眀瑟几研清潤拂箋作松隂髙士圖覺寒濤滿空與鳴泉相和聲出紙上也甲子七月二十四日御筆下有乾隆宸翰幾暇臨池二璽右方下有烟雲舒卷一璽軸髙三尺六寸七分廣一尺五寸四分御臨倪瓚秋原古樹圖一軸宣德箋本墨畫欵題云修篁幾箇不成林古樹猶無鴉可尋誰道秋來多寂寞寒郊烟靄望中深冩罷枯枝意洒然將無詩畫合同禪泬寥心與秋空浄若有漁歌古渡邊閒來消夏恰相宜極目疎林秋晩時憶得前年重九日灤河别墅一枝枝倪迂多作秋原古樹澹逸天然使人意逺余偶倣其筆法為之愧未得神似而㸃綴蕭曠滿目秋情或亦畫中有詩耶乾隆甲子長夏并識下有㑹心不逺乾隆宸翰二璽右方下有筆端造化一璽軸髙一尺五寸七分廣一尺御臨倪瓚平林秀石圖一軸宣德箋本墨畫欵識云元四大家畫獨雲林格韻尤超世稱逸品幾閒偶仿其意作平林秀石小景喜無畫史縱横習氣瓣香故在可為知者一道乾隆嵗在甲子立秋前一日并識下有乾隆宸翰幾暇臨池二璽左方下有清心抒妙理一璽軸髙二尺四寸三分廣一尺一寸九分御臨沈周雙松一軸宣德箋本墨畫欵識云沈周雙松圖筆意養心殿戲橅下有乾隆宸翰幾暇臨池二璽左方中有繪事後素一璽軸髙五尺二寸廣一尺四寸七分御臨唐寅蘆汀繫艇圖一軸宣德箋本墨畫欵題云萬頃烟波浮舴艋飄颻直在秋雲頂夢中宜作廣寒遊雙手攫將孤月影甲子小春仿唐寅筆即用其韻題句下有乾隆宸翰筆端造化二璽中幅有㑹心不逺一璽右方下有澂觀一璽軸髙二尺二寸九分廣一尺三寸四分御臨唐寅折梅仕女圖一軸宣德箋本墨畫並臨原題句欵題云羣芳譜裏冠春臺抝得南枝幾朶開恰似夀陽初睡起渾忘㸃額玉珠來摹唐解元折梅仕女圖因臨其題句于左並用其韻御筆上鈐乾隆宸翰一璽左方上有冩生幾暇臨池二璽下有意在筆先一璽軸髙三尺七寸廣一尺八寸五分御臨陳洪綬髙士圖一軸宣德箋本白描畫欵識云眀陳洪綬善畫古人物與崔子忠齊名不屑屑規橅顧陸神味翛然自標一格畫史稱其賦性狂放眀經不仕葢隠于翰墨者流故所製多髙人逸士風致予所倣兹幅即其一也骨理清超或未能手追三昧而蕭逺閒澹塵絶筆端差喜得其遺意用併識數語于右甲子暢月九日下有㑹心不逺乾隆御筆二璽左方下有繪事後素一璽軸髙三尺三寸廣二尺三分御臨惲夀平五清圖一軸宣德箋本墨畫水月松竹梅欵識云惲夀平五清圖養心殿戲橅下有乾隆宸翰一璽左方下有游六藝圃一璽軸髙二尺八寸四分廣一尺三寸二分書畫合軸御筆洛神圖並臨十三行帖一軸宣德箋本白描畫欵識云偶繪洛神并臨十三行于左御筆下有乾隆宸翰幾暇臨池二璽右方下有冩生一璽軸髙二尺二寸五分廣一尺御筆瓶荷一軸宣德箋本墨畫左方中行書御製舊句云含芬雅合伴書惟兩字標名可作師但似清髙塵不染逺觀近玩總相宜後識云此予瓶蓮舊句也幾暇偶仿白陽山人冩意即録舊句以當題詠甲子小春并識下有乾隆宸翰幾暇臨池筆端造化三璽前有冩生一璽右方下有澂觀摛藻為春二璽軸髙三尺五寸七分廣一尺四寸八分御筆梨花山雀圖一軸宣德箋本墨畫右方上行書御製舊句云含姿映𤨏牕弄影臨芳埒娑娑媚晩風裳裳酬令節瓊葩比梅艷姱朶方桃潔雅致入閒吟幽芳供静掇庭院引蜂攢畫圖宜燕頡偶來花下立㣶徊不忍擷韶華詎久駐㑹看霏香雪後識云仿江南徐氏法作梨花山雀頗饒冩生氣韻因檢舊咏梨花短句竝録于右春林香雪拂拂楮墨間矣乾隆甲子夏六月既望并識有乾隆宸翰幾暇臨池二璽左方下有研露一璽軸髙三尺七寸五分廣一尺九分御筆秋瓜一軸宣德箋本墨畫右方上行書御製舊句云雲刄剖氷瓤清甘沁齒香黄沈惟讓李翠冷不誇霜邵圃名猶艷王園種最良何人方病渇一瓣試分嘗後識云右舊作消夏十咏之一甲子四月廿又三日長晝幾餘頗苦煩熱因憶古人瓜飲圖此自遣竝檢録舊咏青門風味宛于尺楮遇之乾隆御識下有乾隆宸翰幾暇臨池二璽前有冩生一璽左方下有筆端造化一璽軸髙二尺四寸五分廣九寸九分御筆盆梅一軸宣德箋本墨畫左方上行書御製詩云浄几眀牕一室中重陪處士舊家風瓣姿借月裁氷碧蕾影臨缸卷燭紅試味真香方遞遞愛觀生意始融融栽培漫說花師巧消息先春總化工後識云甲子暢月六日對盆梅有作因并冩意為圖御筆下有乾隆御筆摛藻為春二璽右方中有含毫邈然一璽軸髙四尺七寸七分廣一尺八寸七分御臨宋人觀梅覔句圖并書建福宫新春詩一軸宣德箋本墨畫上方行書御製建福宫新春詩云禁城景物報和韶初轉寅方玉斗杓漏洩春光梅破蕾招揺風信栁拖條池心鏡面氷將解墻角銀根雪欲消掁撥詩腸量多少新年覺比舊年饒含陽苔色兆根荄勝裏宫花鬭早梅堂構萬年綿福履黄黎九有上春臺蘭苕翡翠相容與鳯閣枌寮各實枚試看新蟾睂様細分眀報道上元來照壁態丸燦九華祥煙濃作赤城霞土牛新看牽春至綵燕初飛掠曉斜臈雪猶然戀鴛瓦東風全不發綾花欲將建福宫中福錫與寰區萬姓家後識云建福宫新春觀梅覔句得七律三首近見宋人有此圖爰仿其筆意而書舊作于上京師地寒梅皆南至唯盆蒔瓶供耳然得梅之意便在萬重香雪海也御筆下有乾隆宸翰攜筆流雲藻二璽右方下有清心抒妙理一璽軸髙三尺五寸八分廣一尺一寸六分石渠寶笈卷二
