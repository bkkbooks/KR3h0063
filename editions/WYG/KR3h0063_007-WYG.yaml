body:
  text: 貯乾清宫二宸翰書冊世宗憲皇帝御書律厯淵源序一冊素箋本楷書末幅欵識云雍正元年十月朔敬書下有雍正宸翰朝乾夕惕二璽首幅前署御製律厯淵源序七字冊計八幅幅髙七寸廣九寸六分世宗憲皇帝御書駢字類編序一册素牋本行書末幅欵識云雍正四年五月初九日上鈐雍正御筆之寶一璽首幅前署御製駢字類編序七字冊計八幅幅髙七寸二分廣八寸世宗憲皇帝御書音韻闡微序一册素牋本行書末幅欵識云雍正四年五月十八日上鈐雍正御筆之寶一璽首幅前署御製音韻闡微序七字冊計六幅幅髙八寸二分廣九寸六分世宗憲皇帝御書子史精華序一冊素牋本行書末幅欵識云雍正五年四月初九日上鈐雍正御筆之寶一璽首幅首署御製子史精華序七字冊計七幅幅髙七寸三分廣八寸六分世宗憲皇帝御書七詢一册素絹本行草書聖祖仁皇帝御製七詢一篇凡五十幅第四十九幅第五十幅跋云我皇上有道持盈健行弗息亦謨亦典乃垂經今緯古之文念聖念狂而示乾朝惕夕之㫖作師兼作后如日復如天直接千聖之淵源克眀百王之著作是培國家久逺之金鑑兼昭萬代楷模之寶符是以汪洋斯文之大義皆平時庭訓之格言成于十載之睿思特示立言之匪易今兹七詢之聖藻永欽至文之不磨至若泉湧風馳思如江湖之注珠輝玉耀燦若瓊玖之林此葢皇父才本天縱學極真銓析性理之精純備詞華之妙麗無微不闡洵兩間不朽之文羣美悉臻亦千古無兩之作斯豈愚臣所能仰讚者也敢不凜為箴銘而佩服勿替乎臣謹熏沐録呈之次拜書簡末永識欣慕之私云爾和碩雍親王臣廟諱下有樂善不倦廟諱之章二璽幅髙一尺二寸七分廣一尺六分世宗憲皇帝御書萬夀詩一冊素絹本楷書恭進聖祖仁皇帝萬夀無疆詩十章末幅欵云臣廟諱恭撰敬書下有迪德廟諱之章二璽首幅署萬夀無疆詩十章有序九字冊計十一幅幅髙七寸廣四寸六分世宗憲皇帝御筆臨董其昌書登樓賦一冊素絹本行草書未署欵末幅有御賜朗吟閣寶和碩雍親王寶墨池清興三璽冊計十幅幅髙七寸五分廣四寸六分書卷世宗憲皇帝御書柏梁體詩序一卷泥金畫絹本行楷書欵識云雍正四年秋九月御筆上鈐雍正御筆之寶一璽卷髙一尺廣四尺二分世宗憲皇帝御書喜雨詩一卷素絹本行書七言律詩一首卷前署三月三日得雨六字卷末有雍正御筆之寶一璽卷髙一尺二寸六分廣二尺七寸八分世宗憲皇帝御書魏徵十思疏一卷素絹本行書欵識云御筆雍正四年二月初九日書下有朝乾夕惕雍正宸翰二璽前有為君難一璽卷髙四尺一寸六分廣七尺七寸世宗憲皇帝御書愛蓮說一卷素絹本行書欵識云雍正五年五月初三日御筆下有朝乾夕􅅥雍正宸翰二璽前有為君難一璽卷髙一尺四寸三分廣八尺四寸五分世宗憲皇帝御書唐人律句一卷灑金絹本行草書七言律詩一首欵識云雍正五年六月十九日後有雍正御筆之寶一璽卷髙一尺一寸三分廣二尺二寸世宗憲皇帝御筆臨米芾書鷹賦一卷朝鮮牋本行書大字未署欵卷後有御賜朗吟閣寶和碩雍親王寶二璽卷髙一尺二寸六分廣一丈六尺九寸世宗憲皇帝御筆臨趙孟頫千字文一卷素絹本行楷書未署欵卷後有御賜朗吟閣寶和碩雍親王寶二璽卷髙七寸三分廣七尺七寸五分書軸世宗憲皇帝御書黒龍潭碑文一軸素絹本行楷書欵識云雍正三年八月十五日上鈐雍正御筆之寶一璽軸髙五尺二寸五分廣二尺七寸二分世宗憲皇帝御書蘇軾對月詞一軸素綾本行書欵云雍正御筆下有朝乾夕􅅥雍正宸翰二璽前有為君難一璽軸髙五尺一寸廣二尺五分世宗憲皇帝御書七言截句一軸粉花絹本草書後署夏日泛舟下有雍正宸翰朝乾夕惕二璽前有為君難一璽軸髙四尺四寸廣一尺九寸五分世宗憲皇帝御書七言律詩一軸粉花絹本行楷書欵識云雍正六年二月十六日御筆後有雍正宸翰朝乾夕惕二璽前署仲丁詣祭文廟敬成八字有為君難一璽軸髙五尺二寸五分廣二尺四寸九分世宗憲皇帝御書七言律詩一軸粉花絹本草書唐句欵署御筆下有雍正宸翰朝乾夕惕二璽前有為君難一璽軸髙五尺二寸五分廣二尺四寸七分世宗憲皇帝御書五言截句一軸素綾本草書唐句未署欵後有朝乾夕惕雍正宸翰二璽前有為君難一璽軸髙四尺八寸廣二尺二寸五分世宗憲皇帝御書五言律詩一軸粉花絹本行草書後署荷花舊作下有朝乾夕惕雍正宸翰二璽前有為君難一璽軸髙四尺七寸五分廣一尺九寸二分世宗憲皇帝御書五言律詩一軸粉花絹本行書後署雍正己酉永春亭留春之作下有朝乾夕惕雍正宸翰二璽前有為君難一璽軸髙四尺六寸四分廣一尺九寸世宗憲皇帝御書五言律詩一軸粉花絹本草書觀稻詩欵署御筆下有雍正宸翰朝乾夕惕二璽前有為君難一璽軸髙四尺八寸五分廣一尺八寸五分世宗憲皇帝御書五言律詩一軸粉花絹本行草書後署晩登海河樓舊作下有朝乾夕惕雍正宸翰二璽前有為君難一璽軸髙四尺七寸八分廣一尺九寸三分世宗憲皇帝御書五言律詩一軸粉花絹本行書唐句欵署御筆下有朝乾夕惕雍正宸翰二璽前有為君難一璽軸髙四尺八寸三分廣一尺九寸一分此軸暨登海河樓五律一軸皆上在青宫時蒙世宗憲皇帝書賜者敬藏寶匣併鐫御製記文于上記云乾隆元年丙辰恭送皇考梓宫自泰陵迴忽忽若有失也迺開琳笥啟錦囊展向日所賜手蹟敬觀之慰與悲俱來瞻與否罔措爰拜手稽首而為之記曰惟我皇考世宗憲皇帝本天亶姿懋日新學養潛朱邸三十餘年朝夕書史自娛每當眀牕净几輒弄翰作書凡晉唐宋元諸名家蹟罔不心摹手追實集古今書法之大成較之漢帝唐宗逕庭過之逮臨御區宇勵精圖治自朝至于日中昃不暇時親筆墨然間一臨池而翔鸞翥鳯之奇印泥畫沙之妙薈萃行間𢎞璧天球無足為重也臣御名承顔侍膝猥被寵光迄今霜露屢易龍髯莫挽墨瀋猶新每一啟椷肅容仰閲輒嗚咽流涕而不能自已記有之父没而不能讀父之書手澤存焉爾矧我皇考拂素飛毫駕顔凌栁俾予小子獲瞻天藻之光華兼誦宸章之美富興思手澤視古人所云不能讀者殆有加焉其能弗愴然于懐而翹然思屢覩耶世宗憲皇帝御書萬夀賦十二軸素牋本行書恭進聖祖仁皇帝萬夀賦末幅欵云皇四子多羅貝勒臣廟諱敬書後有廟諱之章御賜朗吟閣寶二璽首幅前署萬夀賦并序五字軸髙二尺六寸廣七寸八分書册御書孝經一冊宣德牋本楷書末幅欵識云乾隆九年甲子嘉平月下浣養心殿齋居三日書成下有乾隆宸翰含經味道二璽首幅前有意在筆先摛藻為春二璽册計十六幅幅髙九寸一分廣八寸八分御臨黄庭堅墨竹賦一冊宣德牋本楷書末幅欵識云乾隆甲子孟夏上澣御筆臨於長春書屋後有萬物静觀皆自得乾隆宸翰二璽册計十七幅幅髙八寸一分廣一尺二寸御臨米芾尺牘一册宣德牋本行書凡五則末幅欵云御臨米芾尺牘下有乾隆宸翰一璽首幅前有意在筆先一璽冊計十二幅幅髙九寸五分廣五寸一分御臨趙孟頫書陶潛詩帖一冊宣德牋本行草書末幅欵識云淵眀歸去來辭有見道之言兹飲酒二十首上下數千年間慨然晤嘆是葢不獨以酒隠者矣若夫子昻書法流麗中具整肅余何能贊一辭哉乾隆甲子季夏御臨並識下有乾隆宸翰幾暇臨池二璽冊計二十二幅幅髙七寸九分廣五寸御臨趙孟頫書紈扇賦一冊宣德牋本行楷書後頁欵識云乾隆乙丑新正人日御筆臨上鈐乾隆御筆㑹心不逺二璽首頁前有游六藝圃一璽冊計三頁頁髙九寸廣一尺五分御臨俞和摹定武禊帖一冊宣德牋本末幅欵識云乾隆甲子孟夏御筆又識云俞和此帖余規仿數過不得仿彿乃棄置浹旬走筆背臨不中不逺因悟凡為學者求諸皮毛形肖所為北轅而適越也浴佛日再識下有烟雲舒卷乾隆宸翰含經味道三璽首幅前有游六藝圃一璽册計七幅幅髙八寸四分廣四寸三分御臨董其昌摹蘭亭叙一册仿製宋印花牋本末幅欵識云乾隆甲子仲秋月下浣五日御筆上鈐乾隆宸翰一璽冊計八幅幅髙八寸二分廣四寸三分御臨董其昌書顔真卿帖一冊宣德牋本行書臨顔真卿送劉太冲序後頁欵云乾隆御筆後有乾隆宸翰擕筆流雲藻陶冶性靈三璽首頁前有意在筆先一璽冊計八頁頁髙七寸五分廣一尺御臨董其昌書晉唐人詩一冊宣德牋本行草書晉人詩四首唐人詩九首末幅欵識云乾隆甲子長至日御筆下有乾隆御筆一璽首幅前有意在筆先觀書為樂二璽冊計二十八幅幅髙七寸五分廣四寸九分書畫合冊御筆風候冩生書畫合璧一冊金粟牋本墨畫二十四候花信每候各繫一詩凡十二幅第一幅右頁署小寒一候梅花題云玉梅標格稱仙粧頭踏春風領衆芳設使東皇編甲第南枝合作探花郎下有宸翰一璽前有擕筆流雲藻一璽臣梁詩正敬録云寒雪侵凌更助粧百花頭上占年芳鉛華洗盡留真色不學緋桃媚阮郎臣梁詩正恭和左頁署小寒二候茶花題云紅葩粉蕊艷欺霞趙叟邱翁莫浪誇卉譜有時傳蜀種春風無處不唐花下有幾暇怡情一璽臣勵宗萬敬録云絳雪晴烘十丈霞鶴頭犀角艷争誇水仙孤迴江梅痩此是三冬富貴花臣勵宗萬恭和第二幅右頁署小寒三候水仙題云生機消息不終窮底用灰飛驗葦筒一例清風眀月下仙人遥在水晶宫下有德充符㑹心不逺二璽臣張若靄敬録云霏霏滕六浩無窮一線春回黍谷筒何處天花忽飄墮玉玲瓏散蕊珠宫臣靄㳟和左頁署大寒一候瑞香題云露甲曽聞悟比邱昌條獨弄紫風流漫言寂寞遲花事衮衮韶光速置郵下有雲霞思一璽前有含毫邈然一璽臣梁詩正敬録云廬阜蟠根寄一邱通家茉莉鬭風流時來移種蓬萊殿錦繖香囊逐水郵臣詩正恭和第三幅右頁署大寒二候蘭花題云春畹秋塘盡裊姗冰霜傲得是真蘭摘來香色都清浄鼻觀從參古佛壇下有寫生一璽前有含經味道一璽臣勵宗萬敬録云招來空谷步姍姍鄭女休輕賦采蘭若與羣葩論臭味國香端合主騷壇臣宗萬恭和左頁署大寒三候山礬題云繁花如雪雪中開香是荀郎袖裏來仿彿人從庾嶺過臨風寄得幾枝梅下有中和染翰二璽臣張若靄敬録云鶴翎剪處逗寒開曽伴風姨月姊來若使凌波逐仙侣更宜兄事嶺頭梅臣若靄恭和第四幅右頁署立春一候迎春題云無須剪綵畫屏裝花信迎春四出黄迎得好春縁底事千花百卉任争芳下有潑墨一璽前有含英咀華一璽臣梁詩正敬録云雪砌都成玉閙裝𢃄圍依約認腰黄憑他探取春消息喚醒從頭百草芳臣梁詩正恭和左頁署立春二候櫻桃題云半軃雲鬟整翠翹斜臨玉鏡凍將消含章殿裏人何在依舊東風散綺寮下有幾暇臨池一璽臣勵宗萬敬録云紅綃翠袂壓雲翹但見花時渇已消若待寢園新薦後玉盤珠顆賜羣寮臣勵宗萬恭和第五幅右頁署立春三候望春題云幽花婀娜笑庭堦也報番風到小齋真是不辜引領望昭蘇萬彚樂春皆下有内府珍秘得佳趣叢雲三璽臣張若靄敬録云雲凝三素朗三階祈穀元辰甫散齋早向瑶林問消息望中瓊朶滿庭皆臣若靄恭和左頁署雨水一候菜花題云冩意無妨作圃菘繁花結穂葉蒙茸書生省識春蔬味玉食應無羨九重下有樂天一璽又虚衷澂照一璽臣梁詩正敬録云老圃生涯事種菘黄雲匝地影茸茸偏宜㸃綴滕王蜨亂眼踈籬隔幾重臣梁詩正恭和第六幅右頁署雨水二候杏花題云輕勻麝粉淡調脂斜倚東風不語時若是詩中