圖欵云經筵講官户部左侍郎内閣學士裏行臣蔣廷錫前署瑞穀圖頌四字蔣廷錫疎林翠巘圖一軸次等張四素絹本著色畫款云臣蔣廷錫恭畫戴天瑞秋山圖一軸次等寒一素絹本著色指畫款云臣戴天瑞指頭㳟畫左方上聖祖仁皇帝御書七言絶句識云倣米下有康熙宸翰保合太和二璽前有佩文齋一璽張問達馬圖一軸㳄等來二素絹本著色畫款云臣張問達恭畫僧超揆攜琴訪友圖一軸㳄等暑一素絹本著色畫款題云蟠曲松藤覆石幢烟波汀沚似湘江天香陳陳秋風𦂳野客攜琴訪竹窻臣僧超揆僧超揆畫杜牧詩意一軸㳄等暑二素絹本著色畫上方書杜牧逺上寒山石逕斜絶句一首款云臣僧超揆謹寫閨媛周禧畫石橊一軸㳄等往一素絹本著色畫款識云癸巳新秋江上女子周禧設列朝人書畫合軸上等明唐寅琵琶行圖一軸上等天一宣徳箋本淡著色畫款署吳趨唐寅下有唐伯虎一印右方下有吳趋一印左方下有謝湖一印上幅素箋烏絲䦨本文徴明小楷書琵琶行款識云嘉靖二十一年壬寅秋八月五日書於玉蘭堂徴明時年七十三下有徴明連印前有晤言室一印畫幅髙二尺三分廣一尺二寸六分書幅髙九寸三分廣同書畫合軸㳄等元趙孟頫酒誥圖一軸㳄等天一素絹本著色畫上方書酒誥本文款識云至大改元八月十三日吳興趙孟頫畫並書明文徴明朱竹一軸㳄等地一宣徳鏡光箋本研朱畫上方書髙啟詞一首款識云右調水龍吟髙季迪先生作嘉靖十三年歳在甲午二月五日徴明因戯寫朱竹遂録其上國朝人書畫合軸上等王武書畫合璧一軸上等天一素箋本分三幅上幅朱絲䦨行書五律二首並小序一則款云王武頓首下有梅谷一印前有竹牕一印幅髙七寸廣一尺中幅著色畫牡丹款題云碧玉窻欞赤玉欄三春富貴畫中看沈香亭子猶堪作那得亭前供奉官小春晦日王武戯筆上鈐王武私印震澤二印前有東邨草堂一印幅髙九寸三分廣一尺一寸六分下幅墨畫靈芝款云雪牕呵凍為陽春子博笑忘菴下有勤中一印左方下有碧梧翠竹之堂一印幅髙九寸六分廣一尺一寸六分石渠寶笈卷四十
