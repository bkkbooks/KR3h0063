body:
  text: 貯御書房無名氏畫軸上等五代人浣月圗一軸上等天一素絹夲著色畫右方上有緝熙殿寳一璽軸髙二尺四寸一分廣一尺五寸七分宋人盤車圗一軸上等地一素絹夲著色畫左邉幅有蕉林玉立氏圗書觀其大畧二印軸髙三尺三寸八分廣一尺五寸三分宋人梧隂清暇圗一軸上等元一素絹夲著色畫右方上有晉府圗書一印中有清秘珍玩一印左方上有晉府書􅀞之印敬徳齋圗書印二印軸髙一尺五寸七分廣一尺二寸八分宋人秋山文㑹圗一軸上等黄一素絹夲著色畫右方上有懐古閣蔵一印下一印漫漶不可識左方上半印存印字下有希之一印軸髙二尺九寸五分廣七寸八分宋人大儺圗一軸上等宇一素絹夲著色畫軸髙二尺八分廣一尺八寸二分宋人黄鶴樓圗一軸上等宙一素絹夲著色畫軸髙五尺八分廣二尺八寸宋人枯木竹石一軸上等洪一素絹夲墨畫右方下有一印漫漶不可識軸髙三尺三寸六分廣一尺五寸九分宋人捕魚圗一軸上等荒一素絹夲著色畫軸髙三尺二寸八分廣一尺五寸四分宋人寒林樓觀一軸上等日一素絹夲著色畫軸髙四尺六寸八分廣二尺七寸八分宋人富貴花貍一軸上等月一素絹夲著色畫右方下有半印不可識左方下有緝熙殿寳一璽軸髙四尺四寸一分廣三尺三寸六分宋人華燈侍宴圗一軸上等盈一素絹夲著色畫上方題句云朝回中使傳宣命父子同班侍宴榮酒捧蜺觴祈景福樂聞漢殿動驩聲寳瓶梅蕊千枝綻玉柵華燈萬盞眀人道催詩須待雨片雲閣雨果詩成後一印漫漶不可識下方邉幅有棠村審定蕉林二印軸髙三尺四寸七分廣一尺六寸七分玉池上御識云近得馬逺華燈侍宴圗軸憶舊入石渠寳笈中有相似者檢閱此幅籖題宋人華燈侍宴圗畫景題句無不脗合惟畫中階墀部位微有㕘差而筆意深厚同出宋時院夲觀題句中有父子同班侍宴榮之句盖當時勑作此圗以侈一時盛事或一稿兩幅分賜侍宴者之父子耳新得者則有臣馬逺三字欵在左側樹石之間逼近邉幅幸未裁截此幅無欵想亦署欵幀邉屢經􅏻裱致被損壊割去今将兩幅同弆石渠此幅因無欵仍標宋人以存其舊乾隆癸夘冬御筆下有古稀天子之寳猶日孜孜二璽又御識云華燈侍宴圗内府有兩夲此為石渠舊蔵已入前編者欵經裁去標題宋人其一則近年所得入續編者有馬逺欵兩幀畫筆均沉厚絹素亦古雖階墀部位微有参差而軒楹人物大局悉同且上方題句字體亦如出一手或當時一稿兩幅分賜侍宴父子二人以誌榮遇亦不必求其人以實之當續得馬畫時已兩相印證各為識語分題兩幀首矣但前編所載者貯御書房入續編者貯乾清宫溯此圗流傳七百餘年先後同入内府邀鑒賞真可謂翰墨縁而分貯各誌合而未合仍未得為延津之遇因命同弆一箧貯乾清宫以徴兩羙之必合耳乾隆六十一年丙辰小春月御識臣董誥奉勑敬書鈐印二臣誥宋人山茶寫生一軸上等昃一素絹夲著色畫軸髙一尺八寸二分廣一尺二寸三分宋人清溪晚牧圗一軸上等辰一素牋夲著色畫右方下一印不可識左方下有袁氏鑒賞圗書一印軸髙二尺三寸六分廣一尺三寸七分宋人春山瑞松圗一軸上等宿一素絹夲著色畫右方上有興霞殿寳一璽下半璽存殿寳二字又玉堂柯氏九思私印一印左方上半璽不可識下有黄琳一印詩塘宋髙宗題云天鈞瑞木得自嶔岑枝蟠數萬榦不倍尋怒騰龍勢静奏琴音凌寒鬱茂當暑隂森封以腴壌邇以碧潯越千萬年以慰我心後有太上皇之寳御書之寳二璽軸髙一尺九分廣一尺三寸六分元人老圃秋容圗一軸上等列一宋箋本著色畫軸高三尺九寸六分廣一尺一寸七分元人青山竹閣圖一軸上等張一宋箋本墨畫詩塘有邊武題云曉風吹徹碧雲寒夢駕𤣥螭謁紫壇玉露一杯霞綺燦歸來不作刈蘭看至正丁亥歳孟春上元日隴西邊武伯京為士民隱君雷師書讚軸高二尺二寸七分廣九寸九分元人花鵞小景一軸上等寒一宋箋本著色畫軸高一尺七寸九分廣一尺一寸五分元人江天樓閣圖一軸上等來一素箋本白描畫軸高二尺六寸三分廣一尺二寸六分元人春山圖一軸上等暑一素箋本墨畫上方有楊維禎題云巨然不作惠崇景秀逺最愛春山圖危峰戴出若孤缺大樹林立如千夫杖藜誰行天姥道酒船間出賀家湖道人自指讀書處文壁峰前宅一區鐵笛右方下有元缺珍藏一印左方上有棠村審定蕉林二印軸高二尺二寸七分廣一尺三寸二分元人秋山圖一軸上等往一宋箋本淡著色畫右方下有半印存山樵二字軸高三尺六寸廣一尺一寸六分明人七星古檜圖一軸上等秋一素箋本墨畫右方上有蒼巗子棠邨審定二印左方下有卞氏呆菴珍賞一印軸高二尺四寸七分廣一尺二寸七分明人秋山高士圖一軸上等收一素箋本著色畫左方下一印漫漶不可識右方下押縫有培風堂珍蔵圖書一印軸高二尺五寸二分廣八寸二分明人山水一軸上等冬一素箋本墨畫左方下有半印存崇雅二字又一印漫漶不可識詩塘有文彭題云春深綠樹静陰陰童子遥將七尺琴流水高山堪自寄底須城市覓知音文彭軸高二尺六寸一分廣一尺二寸九分附刻絲畫軸上等喬枝雙鵲圖一軸上等天一宋本五色織軸高二尺九寸四分廣一尺六寸二分八仙圖一軸上等地一宋本五色織軸高五尺六分廣三尺九寸七分羣仙拱壽圖一軸上等元一宋本五色織軸高五尺一寸七分廣三尺七寸三分孔雀圖一軸上等黄一宋本五色織左方上織孔雀圖三字下織欵識云開寳二年季春三月錫山華氏三畱堂製下織季子後裔一印軸高五尺二寸廣七尺一寸二分玉洞仙芝圖一軸上等宇一宋本五色織右方上織玉洞仙芝四字後織常伯一印左方下織一印存九山二字可辨軸高一尺三寸三分廣七寸一分蟠桃圖一軸上等宙一宋本五色織上方織題句云萬縷千絲組織工仙桃結子似丹紅一絲一縷千萬壽妙合天機造化中款織延陵呉煦製下織子潤一印軸高一尺四寸五分廣一尺二寸一分海棠圖一軸上等洪一宋本五色織軸高一尺六寸一分廣一尺三分蟠桃春燕圖一軸上等荒一宋本五色織軸高二尺七寸五分廣一尺二寸九分羣仙祝壽圖一軸上等日一宋本五色織左方下織陳氏敬亭二印右方下一印不可識軸高四尺四寸五分廣三尺六分附繡線畫軸上等梅竹山禽圖一軸上等天一宋本五色繡右方上有明昌御覽一璽軸高四尺七分廣一尺六寸九分白鷹一軸上等地一宋本素繡軸高二尺九寸九分廣一尺四寸八分畫軸次等五代人雪漁圖一軸次等天一素絹本著色畫宋人千巗萬壑一軸次等地一素箋本墨畫上方有陳儀傳純劉昭陳韶胡澂諸題句宋人竹石鳩子圖一軸次等元一素絹本著色畫宋人秋塘雙雁一軸次等黄一素絹本著色畫宋人折枝枇杷一軸次等宇一素絹本著色畫宋人梅竹聚禽圖一軸次等宙一素絹本著色畫宋人蟠桃圖一軸次等洪一素絹本著色畫宋人宫沼納涼圖一軸次等荒一素絹本著色畫宋人秋林放犢圖一軸次等日一素絹本著色畫宋人竹樹鳴鳩圖一軸次等月一素絹本著色畫宋人杏林鸂􅈑圖一軸次等盈一素絹本著色畫詩塘御筆題樂意二大字上有乾隆宸翰一璽宋人山花墨兎一軸次等昃一素絹本著色畫宋人竹林清話圖一軸次等辰一素絹本著色畫宋人桃竹雙鳬圖一軸次等宿一素絹本著色畫宋人子母雞圖一軸次等列一墨箋本著色畫詩塘有明憲宗題句宋人花王圖一軸次等張一素絹本著色畫宋人蘆汀雙鴨圖一軸次等寒一素絹本著色畫宋人疎篁晴翠圖一軸次等來一素絹本墨畫元人秋山圖一軸次等暑一素絹本墨畫元人疎枝竹鵲圖一軸次等往一素絹本著色畫元人魚藻圖一軸次等秋一素箋本著色畫元人嘉穀鳴禽圖一軸次等收一素絹本著色畫元人花陰卧犬圖一軸次等冬一素箋本著色畫元人獵騎圖一軸次等蔵一素絹本著色畫元人折枝秋葵一軸次等閏一素絹本著色畫明人狻㹸圖一軸次等餘一素箋本著色畫明人花叢雙燕圖一軸次等成一素絹本著色畫明人豐稔圖一軸次等歲一素絹本著色畫瓶中瑞穀附刻絲畫軸次等羣仙祝壽圖一軸次等天一宋本五色織瑶池獻壽圖一軸次等地一宋本五色織芙蓉雙鴈圖一軸次等元一宋本五色織花卉翎毛一軸次等黄一宋本五色織芝蘭圖一軸次等宇一宋本五色織詩塘素織題句一未署名仙桃圖一軸次等宙一明本五色織上方織沈周題句一又素繡祝允明都穆和句二國朝人畫軸上等王鑑仿巨然秋山蕭寺圖一軸上等天一宣德箋本墨畫款識云丁未春孟仿巨然筆王鑑下有員照染香菴主二印右方下有宋氏穉佳書畫庫記一印左方下有鴻雪一印軸高六尺一寸八分廣一尺六寸五分惲向秋亭嘉樹圖一軸上等地一宣德箋本墨畫欵識云甲午十二月初九日寫香山向下有惲本初道生二印上方又自識云呉竹嶼之爲雲林也吾惡其太秀藍田叔之爲雲林也吾惡其太老秀而老乃真老也老而嫩乃眞秀也此是倪迂眞面目後五日又題下有惲本初道生二印右方下有宋氏穉佳書畫庫記卧菴所藏二印左方下有休寧朱之赤珍藏圖書一印軸高二尺九分廣九寸一分顧大申秋日山居圖一軸上等元一素絹本著色畫款識云壬辰冬十二月朔爲殿翁廖公祖寫于青溪道中華亭顧大申下有大申一字震治二印軸高五尺五寸七分廣二尺一寸六分惲壽平百合一軸上等黄一宣德鏡光箋本墨畫款題云墨雨灑金壺香風滿瑶圃玉簫明月夜一隊霓裳舞臨唐解元爲山言先生鑒之白雲溪漁壽平下有壽平惲正叔二印前有寄岳雲一印左方下有以二字未辨處南田正叔二印軸高一尺六寸八分廣一尺八分王武仿元人溪亭對菊圖一軸上等宇一宣德箋本著色畫款識云余不諳山水適有攜元人真蹟求售披玩三日摹其形似至筆墨神氣十未得一也丁未秋日王武識下有勤中王武忘菴二印前有震澤一印軸高五尺二寸二分廣一尺四寸一分王武天竹水仙一軸上等宇二素絹本著色畫款識云癸亥暮春畫於西城草堂王武下有王武一印軸高四尺四寸三分廣一尺五寸五分王翬荆溪清逺圖一軸上等宙一素箋本墨畫摹倪瓚上方書倪瓚原記款識云丙寅八月摹於呉門舟次海虞石谷王翬下有王翬之印石谷二印軸高二尺六寸八分廣一尺王翬仿黄公望筆意一軸上等宙二羅紋箋本墨畫款題云别一山川眼更明幽居端的稱幽情由來老筆荆關意施粉施朱笑後生乙亥七月十有三日長安客舍剪燭戱墨奉寄穉佳老世臺先生耕烟㪚人王翬下有王翬之印石谷子二印前有太原一印左方下有滄江白髪一印軸高三尺四寸廣一尺六寸五分王原祁逺岫歸雲圖一軸上等洪一宣德箋本著色畫款識云營邱烟景藏鋒歛鍔董巨趙黄皆於其中變化元人筆兼宋法不出於此矣王原祁下有石師道人一印軸高一尺七寸六分廣一尺一寸六分左方上御題詩云平生山水興有餘欲買名山都無價呉綾裝池盈尺幅千里烟嵐此中化置之五嶽伯仲間若非東岱即西華􅏭嶪筍尖碧玉削每有白雲出其罅陡澗懸厓若無路畧彴幾板凌空架下有泠泠珠玉聲俯瞰始見清波瀉谷轉荒村綠樹叢掩映竹籬與茅舍蒼松皆作老龍鱗盤挐不祈斤斧赦仄仄曲徑相通處别有軒蕭水雲榭省我逰歴蠟雙􅄚更無須向山靈借常住是中讀我書何用勞勞説消夏御題下有乾隆宸翰惟精惟一二璽王原祁倣米芾雲山一軸上等洪二宣德箋本墨畫款識云戊子