body:
  text: 貯御書房五列朝人畫卷上等晉顧凱之列女圖唐閻立徳職貢圖唐閻立本王㑹圖唐韓幹馬性圖唐韓滉豐稔圖唐周昉宫人調鸚鵡圖五代闗穜秋山平遠圖五代李賛華射鹿圖五代顧閎中畫韓熙載夜宴圖五代黃筌寫生珍禽五代阮郜女仙圖宋徽宗梹榔雙雀圖宋徽宗池塘秋晚圖宋李成畫大禹泣辜圖宋趙昌蛺蝶圖宋燕肅秋山晚靄圖宋劉宷落花㳺魚圖宋蘇軾偃松圖宋李公麟豳風圖宋李公麟畫女史箴宋李公麟便橋㑹盟圖宋趙令穣鵞羣圖宋米黻雲山圖並自書䟦宋喬仲常後赤壁賦圖宋趙白駒蓮舟新月圖宋馬和之袁安臥雪圖宋馬和之畫風雅八篇宋劉松年蠶織圖宋李嵩貨郎圖宋王希孟千里江山圖宋馬逺豳風圖宋馬逺溪山秋爽圖宋馬逺水圖宋夏珪秋江風雨圖宋夏珪江山佳勝圖宋陳容九龍圖宋趙黻江山萬里圖宋趙孟堅水仙宋趙孟堅水仙宋鄭思肖畫蘭宋何浩萬壑松濤圖宋夏東叟宋五賢圖宋僧法常花卉翎毛宋僧温日觀畫葡萄宋僧温日觀畫葡萄宋楊媫妤百花圖
