body:
  text: 貯學詩堂列朝人書畫畫册上等宋馬和之畫􅆁風七篇圗元四大家名蹟明人集錦畫明沈周倣倪瓚筆意明沈周冩景明唐寅摹古明文嘉詩意圗明居節八景詩意圗明王時敏畫杜甫詩畫册次等宋馬遠小品元柯九思竹譜明呂紀花竹冩生明沈周摹古明沈周倣吳鎭畫明陳楫雲巖佳勝圗明曹有光孫杖畫合册明人蘇臺古蹟明陳繼儒梅花明人便靣畫明董其昌便靣畫無名氏書畫畫册次等歴朝集錦畫國朝人書畫畫册上等惲夀平摹古王翬山水王原祁山水沈宗敬山水張偉冩生花卉蔣廷錫畫鳥譜焦秉貞畫歴朝賢后故事畫册次等惲夀平冩生王原祁仿古沈宗敬山水沈宗敬山水沈宗敬山水蔣廷錫臨宋徽宗花卉冩生蔣廷錫倣宋人筆意蔣廷錫倣宋人筆意蔣廷錫倣元人筆意蔣廷錫花卉蔣廷錫花卉蔣廷錫畫牡丹譜蔣廷錫百種牡丹譜院本夀意圗朱倫瀚畫詩意圗張鵬翀十景詩意圗强國忠山水郎世寜冩生列朝人書畫書畫合册上等宋髙宗書孝經馬和之繪圗明宣宗書畫合璧明陸治蔡羽書畫合璧書畫合册次等明唐寅仇英畫前後逰赤壁二圗文徴明書賦明董其昌書畫合璧
