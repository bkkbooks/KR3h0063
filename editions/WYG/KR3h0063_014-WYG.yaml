  text: 欽定四庫全書石渠寳笈巻六
  hash: sha256:f3685d10006c19e3a93a469c7f71b2036bae870f0af32c8f6d6cdf8c455202a4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_014-1a, image: WYG0824/WYG0824-0157a.png}
body:
  text: 貯乾清宫列朝人書畫目錄書巻上等唐韓滉田家風俗圖五代周文矩飲中八仙圖宋李祐茶花鴿子宋李公麟二馬圖宋李公麟石鼎聯句圖宋李公麟畫明妃出塞圖宋李迪畫韓盧圖宋劉松年畫香山九老圖宋馬逺瀟湘八景圖宋馬逺江山深秀圖宋曹古百牛圖宋梵隆歸去來詞圖元趙雍破忩風雨圖元王淵蓮塘鸂􅈑圖元倪瓚水竹居圖元吴鎮畫竹元周郎貢馬圖元任仁發調良圖明宣宗鸜鵒圖明王紱江山漁樂圖明沈周江山送别圖明沈周仿倪瓚畫明唐寅釣魚圖明唐寅欵鶴圖明文徵明江天别意圖明文徵明湖山新霽圖明文徵明五君子圖明陳淳牡丹明陸治種玉圖明孫克𢎞及各家朱竹明董其昌仿古明董其昌山水明董其昌山水明董其昌山川出雲圖明董其昌仿黄公望山水明董其昌仿黄公望山水書巻次等唐韓幹駿馬圖唐荆浩長江萬里圖宋李成松河圖宋趙昌茶花鵓鴿宋燕文貴江干雪霽圖宋燕文貴江干積雪圖宋燕文貴江干雪霽圖宋趙令穰江鄉雪意圖宋范坦梅花鳥雀宋崔白秋塘聚鴈圖宋崔白平沙落鴈圖宋李嵩太平春社圖宋劉松年雪山行旅圖元錢選花卉元錢選秋𤓰元黄公望江山萬里圖明唐寅山莊寒霽圖明仇英仿唐人駕車圖明仇英駕車圖明仇英山水明仇英貢琛圖明仇英五雲樓閣圖明文徵明春林翠靄圖明董其昌雲山明董其昌摹煙江疊嶂圖明王節仿髙克恭畫無名氏書畫目錄書卷上等宋人九聖圖明人清明上河圖稿本刻絲畫卷上等附宋織徽宗桃竹長春圖畫巻次等宋人鵪鶉元人秋山懸瀑圖元人春牧圖國朝人書畫目錄書卷上等程正揆江山臥遊圖程正揆仿富春山圖王翬仿黄公望山水王翬鶴林清賞圖楊晉溪山􅀷秀圖沈宗敬江山無盡圖慎郡王允禧江山勝覽圖畫院繪萬夀圖畫卷次等黄鼎漁父圖蔣廷錫畫蘭蔣廷錫梅花蔣廷錫蔬果勵宗萬天中獻瑞圖勵宗萬蓬池競渡圖朱倫瀚仙嶺松風圖朱倫瀚晴江翠嶂圖朱倫瀚雨中春樹圖唐岱山水唐岱仿黄公望浮嵐暖翠圖唐岱仿關仝翠嶺丹楓圖唐岱溪山雪霽圖余省羣魚戯荇圖余省仿林椿梅圖余省仿劉永年茶竹雀免張雨森摹燕文貴江干雪霽圖列朝人書畫目錄書畫合巻上等宋趙伯駒桃源圖宋馬和之三頌圖宋王蒙多寳塔院圖書畫合巻次等明唐寅王寵書畫合璧國朝人書畫目錄書畫合巻上等張照書豳風周鯤繪圖
