front:
  text: 欽定四庫全書石渠寶笈卷二十五
  hash: sha256:4f8180942b9d2e95f86c52781cb78c72628a481241d062d712ffb8c16bcacb90
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_052-1a, image: WYG0825/WYG0825-0090c.png}
body:
  text: 貯重華宫列朝人書畫畫卷次等晉戴逵剡山圖六朝陸探㣲五岳圖唐李思訓海天落照圖五代周文矩仙姬文會圖宋徽宗翠竹雙禽圖宋董源山口待渡圖宋郭熈關山積雪圖宋米芾山水宋王詵烟江叠嶂圖宋趙伯駒江山秋色圖宋劉松年香山九老圖宋馬逺千巗競秀圖宋馬麟荷鄉清夏圖宋陳居中文姬觀獵圖宋方椿年瑶池獻壽圖元錢選寫生元啇琦春山圖元黄公望仿巨然溪山暖翠圖元王振鵬畫魯恭三異圖明沈周雪景明沈周倣李晞古山水明仇英清明上河圖明仇英山水明常倫草蟲無名氏書畫畫卷上等宋人江帆山市圖國朝人書畫畫卷上等王原祁秋山不老圖畫院漢宫春曉圖余省百蝶圖畫卷次等王翬長江萬里圖王原祁西湖十景圖王原祁西湖十景圖宋駿業繪南廵圖蔣廷錫花果冩生張鵬翀秋來讀書圖董邦逹萬􅊤松風圖沈源清明上河圖院本十八學士圖院本漢宫春曉圖列朝人書畫書畫合卷上等元趙孟頫畫箕子授書圖並書洪範元趙孟頫書九歌並繪圖明文徴明踈林淺水圖並自書詩帖書畫合卷次等元趙孟頫書畫陶潜遺事明文徵明盤谷圖並書叙
  hash: sha256:28f5ff5b959c762adf1f999102dc86f9143c5c4c0348337083190bfec1ff2fc8
