body:
  text: 貯乾清宫列朝人書畫目錄書巻上等後五代楊凝式韭花帖宋蔡襄自書詩帖宋蘇軾春帖子詞宋米芾苗幕帖宋張即之書古柏行元趙孟頫書文賦元趙孟頫書歸田賦元趙孟頫書耤田賦元趙孟頫書普照寺藏殿記元趙孟頫書千文元趙孟頫書中峯上人懐浄土詩元迺賢詠古詩帖明祝允明書續書譜明文徵明書盤谷序明文徵明自書詩帖明文徵明自書詩帖明文徵明自書詩帖明王寵書南華經明董其昌臨鍾王帖明董其昌臨蘇軾帖明董其昌書樂志論明董其昌臨天馬賦明董其昌書栖真志明董其昌書牡丹賦書卷次等唐敬宗書竹賦唐禇遂良臨鍾繇戎輅表唐趙模集王羲之千文宋髙宗臨古宋朱子書大雪游天湖詩元趙孟頫書千文明吴寛沈周合書明文徵明自書七律明趙崇禮臨聖教序無名氏書畫目錄書卷上等唐撫晉帖刻絲書巻上等附宋織米芾臨帖國朝人書畫目錄書卷次等陳奕禧雜書張榕端臨諸家書王澍臨聖教序王圖炳書樂善堂全集序王圖炳書昇平嘉宴詩序王圖炳書唐宋文醇序王圖炳書日講春秋解義序潘乙震書落葉詩
