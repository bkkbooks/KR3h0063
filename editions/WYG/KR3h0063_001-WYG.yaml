body:
  text: 乾隆九年二月初十日奉上諭三朝御筆藏之金匱者焜煌典重實為超越前古朕毎一捧觀輙増永慕所當敬為什襲貽我後人又内府所儲厯代書畫積至萬有餘種籖軸既繁不無真贋頃釋道二典已編為秘殿珠林一集此外並宜詳加别白遴其佳者薈萃成編朕少年時間涉獵書繪登極後毎緣幾暇結習未忘弄翰抒毫動成卷帙應一並分類詮次用誌歲月至臣工先後經進書畫暨傳入御府者往往有可觀覽選擇排比亦足標藝林之雅且我列聖貽留墨寳厯乆逾新即前賢斷紙零縑用是有所稽考朕於清讌之餘偶一披閲悦心研慮左圖右史古人豈其逺哉欽此
