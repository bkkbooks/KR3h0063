  text: 欽定四庫全書石渠寳笈卷三十四
  hash: sha256:56a9f664afab215a9659715cb8e54fc87c26fedc8b4e1bc0d079958ffeb4323d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_071-1a, image: WYG0825/WYG0825-0392a.png}
body:
  text: 貯御書房七列朝人畫卷次等唐閻立本畫步輦圖一卷次等天一素絹本著色畫卷中幅署步輦圖三字卷後章伯益篆書本事竝署云唐相閻立本筆拖尾有米黻黄公器張向劉次莊曹將美陶舜咨鄧忠臣張偓佺曾巽申諸記語又江瀜篆書記語一又田儼諸人記語一又蔚宗記語一姓缺下署闗把二字又琰記語一姓竝缺又記語二未署名又劉忱李康年張知權林定姚雲郭衢諸跋又張舜民許善勝題句二唐王維溪山雪渡圖一卷次等地一素絹本著色畫欵云缺王維作拖尾有沈周王鼇題句二又董其昌顧仲子二跋唐李昭道畫蓬莱宫闕圖一卷次等元一素絹本著色畫欵署昭道拖尾有吳元莭書王建宫詞四首又邱濬䟦一又李東陽記語一前隔水皇帝青宫時題詩云縹緲樓臺隔五雲神姑是日㑹茅君霓裳按舞飄霞帔星步凌波濕霧裠清淺曾傳羣羽客風流今見小將軍想伊夙世饒仙骨筆述三生應不羣寳親王題下有寳親王寳勤學好問二璽前有隨安室一璽五代周文矩七賢過闗圖一卷次等黄一素絹本著色畫欵署文矩二字微缺宋徽宗王濟觀馬圖一卷次等宇一素絹本著色畫卷首署王濟觀馬圖五字上鈐雙螭一璽拖尾有張斯立楊肯堂郭天錫馬昫諸記語宋徽宗金英秋禽圖一卷次等宇二素絹本著色畫卷後署御筆二字幷押字一上鈐御書一璽前隔水署天水金英秋禽圖七字宋董源重溪烟靄圖一卷次等宙一素絹本墨畫欵署董源拖尾有龔璛記語一又仇逺張瑛栁貫馬琬倪瓚諸題句又題句一後署醉樵又喬簣成跋一又郭􅂌題名一宋郭忠恕摹顧愷之蘭亭讌集圖一卷次等洪一素絹本淡著色畫每段注姓名爵里竝原詩于上欵云臣郭忠恕又署忠恕二字拖尾何旭書記一則前署容菴續古記五字宋燕文貴倣王維江干積雪圖一卷次等荒一素絹本著色畫欵云燕文貴倣王右丞筆拖尾有沈周題句一前隔水皇帝青宫時題詩云遙巒積翠含清冷長江雪浪翻千頃生綃一幅萬里遊筆端瀟灑江南景渡口風吹驢背寒十千貰酒呼舴艋世態炎涼何足憑還如波浪飄浮梗欵云寳親王長春居士題後有寳親王寳染翰二璽前有樂善堂一璽宋燕文貴溪風圖一卷次等荒二素絹本墨畫無欵姓氏見跋中拖尾有朱僎跋凢二又馮子振李源道王約劉賡袁桷趙世延張珪鄧文原陳庭實栁䝺陳顥魏必復李泂杜禧趙巖諸題句宋許道寧烟溪夏景圖一卷次等日一素絹本墨畫欵署許道寧宋劉永年花隂玉兔圖一卷次等月一素牋本著色畫金書欵云臣劉永年畫拖尾有趙孟頫題句一前隔水皇帝青宫時題詩云一幅生綃擬廣寒寳珠斜傍碧琅玕鵲橋未向河邉駕蟾影疑從月裏看漫許嫦娥供搗藥空傳抱朴欲和丹蘭谿莎徑蕭閒甚東郭何如箇裏安寳親王長春居士題下有寶親王寶染翰二璽前有樂善堂一璽宋郭熙山水一卷次等盈一素絹本墨畫無欵姓氏見跋中拖尾有龍巖跋一宋李公麟丹霞訪龎居士圖一卷次等昃一素絹本墨畫無欵姓氏見跋中拖尾有僧溥洽跋一又姚綬題句一宋李公麟西園雅集圖一卷次等昃二素牋本白描畫每段金書署名無欵姓氏見跋中拖尾有曾㡬劉克莊宋渤諸跋又趙淇髙棅鄭定陳賡陳公亮王恭諸題句又隸書題句一後署牧隠宋李公麟十八學士圖一卷次等昃三素牋本白描畫欵署公麟二字拖尾有劉三吾謝復馬存中張遯王俊華夏行諸題句又盧廷綱跋一宋趙令穰湖莊清夏圖一卷次等辰一素絹本著色畫欵識云元符庚辰大年筆後隔水有董其昌跋一拖尾有蔡昻吕顓王鳳靈諸題句後其昌跋語又六則宋米友仁雲山圖一卷次等宿一素絹本墨畫款署友仁拖尾有張雨徐賁徐達左諸題句又王行䟦一又髙啟諸人記語一又姚辯諸人記語一宋張擇端清明上河圖一卷次等列一素絹本著色畫欵云臣張擇端畫卷前署清明上河圖五字拖尾有戴表元跋一又李冠李巍蘇舜舉諸題句又岳璿記一又陳繼儒跋一宋張擇端清明上河圖一卷次等列二素絹本著色畫無欵姓氏見跋中前隔水有五言律詩一首後署賜錢貴妃四字上鈐御府之印一璽後隔水有東府同觀四字拖尾有岳璿戴表元二跋又蘇舜舉李冠題句二按此卷題跋四則與前卷同皆臨本也宋趙伯駒仙山樓閣圖一卷次等張一素絹本著色畫欵云臣伯駒上進拖尾有馬琬鄧文原文徴明諸題句又許初記語一引首皇帝青宫時題詩云雲山縹緲列仙鄉海隔紅塵路渺茫只許人間圖上看廣寒宫殿午風涼彩鳳時來閬苑西瑤華枝上暫教栖晚歸畱却乗雲去輸與王喬一局棋雲衣散作幾絲霞清淺蓬萊似若耶莫倩麻姑說接待此間不是蔡經家霞帔蹁蹮瑞靄生飄飄金舄步風輕飛花一任隨流水劉阮何能借問程雍正乙夘秋七月寶親王長春居士題下有寶親王寶勤學好問二璽前有隨安室一璽宋趙伯駒畫滕王閣宴㑹圖一卷次等張二素絹本著色畫欵署千里伯駒拖尾趙孟頫書滕王閣序又袁桷題句一又危素跋一又記語一署員嶠山人前隔水皇帝青宫時題詩云當年髙㑹喜追陪傑閣臨江曲宴開樂奏陽春調玉管蟻浮湛露引金杯一時賔主筵前美㡬日風光秋晚催勝事祗今圖畫裏賦心空憶子安才甲寅立秋日寶親王長春居士題下有寶親王寶長春居士二璽前有芝蘭室一璽宋馬和之桃源圖一卷次等寒一素絹本白描畫欵署和之宋朱銳畫春社醉歸圖一卷次等來一素絹本著色畫欵識云紹定二年三月朱銳筆拖尾有鮮于樞栁貫倪瓚俞和諸題句宋徐本歴代錢譜一卷次等暑一素絹本著色畫歴代錢式竝小楷書譜卷後欵識云紹興二十四年歳在甲戌冬東海徐本繪引首董其昌書歴代錢譜四大字拖尾又其昌跋一宋江貫道千巖萬壑圖一卷次等往一素絹本墨畫無欵姓名見跋中拖尾有跋語一欵署董正翁宋劉松年西園雅集圖一卷次等秋一素絹本著色畫欵署松年宋艾淑武夷山圖一卷次等収一素絹本著色畫欵署臣艾淑卷首有篆書武夷山圖四字横書宋僧法常寫生一卷次等冬一素箋本墨畫各種花卉蔬果翎毛欵識云咸淳改元牧溪拖尾有項元汴僧圓信查士標諸人跋宋范安仁魚藻圖一卷次等蔵一素絹本墨畫無欵姓名見跋語中引首有天機活潑四大字未署名拖尾有魯治沈仕吳炳三跋元趙孟頫畫陶潛軼事圖一卷次等閏一素絹本白描畫凡十四段每段節書本傳卷前署陶淵明小像五字欵識云皇慶三年十月七日識子昻元趙孟頫前後赤璧賦圖一卷次等閏二素絹本著色畫欵識云大徳二年春日畫子昻拖尾有李昌期跋一王守題句一元趙孟頫古木散馬圖一卷次等閏三素箋本墨畫欵識云大徳四年十二月廿八日為彦逺作古木散馬圖子昻拖尾有王賔跋語一引首俞宗大篆書松雪散馬圖五大字元趙孟頫畱犢圖一卷次等閏四素絹本白描畫欵識云大徳元年七月廿日畫子昻卷前署夀春令畱犢五字拖尾有宋克跋一元趙孟頫洗馬圖一卷次等閏五素絹本著色畫欵識云至正元年秋七月寫吳興趙孟頫引首皇帝青宫時題詩云平郊拖邐迤一川清且泚怪石刺波青槲林紅間紫奚官驅天閑盡就明波洗酡顔斜坐鞍奚童任指使其數乃萬乗其品皆騄駬名駒志氣殊好境亦知喜或馳若龍飛或靜若鴻止竝驅爭後先滚地烟塵起或牝求其牡或母乳其子亦有獨立者昻昻鬃上指駿馳千里遙怒破萬軍壘我閱李伯時畫馬夙擅美雪翁寫全景妙意得神髓如遊汾漢間似歴渥洼裏是時金風奏郊外秋蒐始擬欲試金鞭一箭落雙雉雍正乙夘秋七月朔寶親王長春居士題并書後有寶親王寶勤學好問二璽前有隨安室一璽元趙孟頫管道昇合作一卷次等餘一素箋本趙孟頫著色畫楓林撫琴圖欵云皇慶二年春子昻管道昇墨畫補新篁坡石欵署仲姬卷前孟頫又自題云南望多春雨江湖日夜深不知空谷底誰與共芳心玉莭去翩翩誰招海上仙青鸞三尺影猶舞鏡臺前子昻重題拖尾有虞集于思緝顧禄倪瓚王寵楊循吉諸題句又吳寛跋一元管道昇修竹圖一卷次等成一素絹本墨畫卷前書賦署修竹賦松雪作六字欵署仲姬卷後自識云墨竹君子之所愛者余雖在女流竊甚好學未有師承難窮三昧及侍吾松雪十餘秋傍觀下筆始得一二偶遇此卷閒置齋中乃乗興一揮不覺盈軸與余兒女輩翫之仲姬識後隔水有方亨咸跋一引首有隸書魏國夫人遺蹟六大字拖尾亨咸又記語一元錢選七賢圖一卷次等歳一素牋本著色畫欵題云晉人好沈酣人事不復理但進杯中物應世聊爾耳悠悠天地間媮樂本無媿諸賢各有心後世毋輕議錢選舜舉拖尾有宋濂哲馬魯丁二䟦又薛超善題句一元錢選畫錦灰堆一卷次等嵗二素牋本著色畫欵識云世間棄物余所不棄筆之於圖消引日月因思明物理者無如老莊其間榮悴皆本於初榮則悴悴則榮榮悴互為其根生生不窮達老莊之㫖者無名公公既知言余復何言吳興錢選舜舉拖尾有張雨唐寅二跋又陳彦博文徴明記語二元錢選荔支圖一卷次等歳三素箋本墨畫卷後書蘇軾本詩欵云錢選書畫元錢選荔支圖一卷次等嵗四素絹本著色畫無欵姓名見跋中拖尾文徴明書蘇軾本詩欵云右荔支嘆蘇長公作也偶有客持錢舜舉所畫荔支卷索題因為書此戊午春日徴明元錢選畫忠孝圖一卷次等嵗五素絹本著色畫葵花萱草二種欵題云葵萼傾心向太陽萱花樹背在髙堂忠臣孝子如佳卉憑仗丹青為發揚吳興錢選舜舉畫并詩元錢選青山白雲圖一卷次等歳六素牋本著色畫欵題云逺山鬱蒼翠勝境非人間白雲自出岫髙聳誰能攀隱居得其趣邱壑藏一斑扁舟任來往慰我浮生閒吳興錢選舜舉後隔水有董其昌跋一拖尾有鄧士瑛陸景善馮愷繆侃王謙胡燾鄭思老張著陳繹馬祖常姚公綬諸題句又邈夫寓樵生佯狂生徐生婁東愚者戲鵝亭林隠松陵樗散諸題句未署名又楊循吉題名一最後有項元汴記語一元王振鵬畫鍾馗送嫁圖一卷次等律一素牋本墨畫欵識云孤雲處士王振鵬畫元王振鵬金明奪錦圖一卷次等律二素絹本墨畫欵云臣王振鵬卷後又隸書自識云崇寧間三月三日開放金明池出錦標與萬民同樂詳見夢華録至大庚戌欽遇仁廟青宫千春莭嘗作此圖進呈題曰三月三日金明池龍驤萬斛紛遊嬉歡聲雷動喧鼔吹喜色日射明旌旗錦標濡沫能幾許吳兒顛倒不自知因憐世上奔競者進寸退尺何其癡但取萬民同樂意為作一片無聲詩儲皇簡澹無嗜慾藝圃書林悅心目適當今日稱夀觴敬當千秋金鑑録恭惟大長公主嘗覽此圖閲一紀餘今奉教再作但目力減如曩昔勉而為之深懼不足呈獻時至治癸亥秋暮廩給令王振鵬百拜敬畫謹摹字缺元王振鵬五雲樓閣圖一卷次等律二素絹本著色畫欵云孤雲處士王振鵬製拖尾有文徴明題句一又彭年周天球二跋又陸師道記語一前隔水皇帝青宫時題詩云仙家何事好樓居應愛雲霞入綺疏漫笑荒唐傳漢武只今披卷信非虚蓬萊樓閣五雲端海日初升映石欄多少仙人飛鶴去孤雲處士畫中看寶親王長春居士題下有寶親王寶長春居士二璽前有隨安室一璽元王淵荷花鸂􅈃圖一卷次等吕一素絹本著色畫隸書欵云澹軒王淵畫拖尾有髙啟丘璿二跋元黄公望溪山雨意圖一卷次等調一素牋本墨畫欵識云此是僕數年前寓平江光孝時陸明本將佳紙二幅用大陀石硯郭忠厚墨一時信手作之此紙未畢已為好事者取去今復為世長所得至正四年十月來溪上足其意時年七十有六是歳十一月哉生明識後隔水有王國器題詩一拖尾有倪瓚跋一元王蒙松窻讀易圖一卷次等陽一素牋本著色畫隸書欵識云松窻讀易圖至正辛未秋日黄鶴山人王蒙元王蒙畫芝蘭室圖一卷次等陽二素箋本著色畫篆書欵云王蒙畫卷前篆書寶石泉壑四字引首陶宗儀篆書芝蘭室三大字拖尾俞和書芝蘭室記又僧夢觀來復慧隠危素徐一䕫白笵字文公諒宋燧諸題句又題句三後署徳祥夷簡如蘭又項元汴記語一元吳鎮竹譜一卷次等雲一素絹本墨畫凡十二段卷前草書蘇軾篔簹谷偃竹記欵識云梅道人為佛奴畫竹譜書此記於卷首至正十年庚寅夏五月八日雨窻筆第一段題識云晴霏光煜煜曉日影曈曈為問東華塵何如北窻風梅道人戲墨於醉李春波門笑俗陋室老飲氷先生以樗翁所書笑俗二字未刻示余揭之陋室為問俗之移人而賢者猶不能自免而况愚者而能免之乎俗之可笑不可笑何則蓋習氣所積化之而然也然而俗之果可移人而人果不可移俗者乎使其喜名者而乏才識喜利者而尚浮華皆習俗移人而然焉間有墮於其中而自覺者得非心出天賦人能移俗者至是乎俗果可笑乎果不可笑乎因誦東坡詩曰士俗不可醫之句先生乃掀然大笑捧腹出門疾走而去余遂歌曰我有淵明琴長年在空屋客來問宫商胡盧捫軫足纔俗不可醫那使積習熟我慚疲欲眠清風動修竹第二段自識云孔子適衛公孫青僕子在淇園有風動竹蕭洒團欒之聲欣然忘味三月不肉顧謂青曰人不肉則瘠不竹則俗汝知之乎梅道人寫至此遂寫竹以破俗云至正庚寅夏五月時宿雨未霽勞倦少息第三段自識云鮮于伯機題髙房山墨竹詩云涼隂生研池葉葉秋可數京華客夢醒一片江南雨至正十年夏六月九日因雨窻孤坐捉筆寫此枝以識歳月梅道人戲墨第四段自識云東坡先生守湖州日遊何道兩山遇風雨回憩賈耘老溪上澄暉亭令官奴執燭畫風雨竹一枝於壁間題詩云更將掀舞勢秉燭畫風篠美人為破顔恰似腰肢裊後好事者刻於石今置郡庠余遊霅上摩挲久之歸而每筆為之不能仿彿萬一時梅雨初歇清和可人佛奴出此卷索作竹譜遂因而畫此枝以識歳月也至正十年夏五月一日梅道人年已七十一矣又叧行記云試貂鼠毫筆潘衝舊墨兒誦論語第五段自識云梅花翁寄興於橡下第六段題識云抱節兀無心凌雲如有意寫之空山中凛此君子志梅道人為佛奴戲此竹書此詩當此日有此枝成不成竒不竒口不能言心自知聊寫此語為娛嬉梅老寐語也第七段題識云愁來白髪三千丈戲掃清風五百竿幸有阮奴知此意時來几上弄清寒梅道人戲墨時驟雨忽至清風涼肌第八段題識云逕深茒屋陋樹倚夕陽斜行遍青丘路何山不可家至正庚寅夏六月梅花老戲墨也第九叚題識云俯仰元無心曲直知有節空山落木時不改霜雪葉此懸崖竹如此立意可也梅道人戲墨第十段自識云簡齋詩云意足不求顔色似前身相馬九方皋梅花親書也第十一段題識云有竹之地人不俗而况軒忩對竹開誰謂墨奴能倒景一枝移上紙屏來梅道人一日與人寫紙屏而作此枝佛奴索寫此詩於譜上遂為書也至正庚寅夏五月十三日飲醉時第十二段題識云輕隂䕶緑苔清風翻紫籜未參玉版師先放揚州鶴梅老戯作於慶餘之東閣住且喫茶處按題識中語多脫誤元張中畫菊一卷次等騰一素牋本墨畫欵識云至正庚子秋張中子政畫拖尾有陸子榮周琰匡顯吳晉程禧歐陽遂初王子充張柄廖敬先吳哲諸題句明宣宗萬年松圖一卷次等致一素牋本墨畫引首欵識云宣徳六年四月初一日長子皇帝瞻基敬寫萬年松圖奉仁夀宫清玩明吳偉倣李公麟洗兵圖一卷次等雨一素牋本白描畫欵識云𢎞治丙辰秋七月湖湘小仙吳偉為獻蕰真黄公前隔水有周荃識語一明張珪神龜圖一卷次等露一素絹本著色畫欵署隨駕張珪四字拖尾跋一後識云成化二十一年乙巳秋九月望日薰沐頓首謹跋未署名又錢士升題句一明沈周畫松石間意一卷次等結一素牋本墨畫欵云石田翁倣梅道人筆明沈周淇園春雨圖一卷次等結二素牋本墨畫卷前有啟南白石翁二印拖尾欵識云成化庚子仲夏避暑大石雲泉菴積雨初霽策杖訪宿田老兄坐談移日出所藏元人吳仲圭竹卷求鑑疎枝蕭蕭幾欲紙上作聲而懸崖噴瀑行筆竒縱大得董巨妙處遂借歸置案頭數日予生平不善畫竹見此卷輒興效顰之思漫臨一過即持示宿田并歸仲圭卷宿田擊節稱賞云優孟之學叔敖其神肖不是過也然不知仲圭墨氣易似而蒼勁之色􅆟難摹倣此卷雖未能入其堂奥邯鄲之步亦或不至盡失云爾沈周明沈周林隠圖一卷次等結三素牋本著色畫欵署沈周前隔水皇帝青宫時題詩云碧潭水澄泓古寺風蕭索巖巒濃淡間村墅辨依約當年林隠人常住箇中樂筆思紛縱横老手石田作神韻足卧遊爽籟生隂壑一篇髙士傳披閱心胸廓寶親王長春居士題下有寶親王寶鳶飛魚躍二璽前有隨安室一璽明沈周畫邃菴圖一卷次等結四素綾本著色畫欵識云庚申歳八月一日沈周製引首李東陽篆書邃菴二大字拖尾東陽書邃菴解一則又吳寛銘一又李夢陽題詞一又張孝思記語一明沈周畫梅花一卷次等結五素箋本墨畫欵識云𢎞治癸亥春長洲沈周拖尾有鄒璧題句一明唐寅畫對竹圖一卷次等為一素絹本著色畫欵署唐寅拖尾自題云簞瓢不厭久沉淪投著虚懐好主人榻上氍毹黄葉滿清風日日坐陽春此君少與契忘形何獨相延厭客星苔滿西堦人跡斷百年相對眼青青晉昌唐寅又沈周黄雲祝允明文璧都穆諸題句明唐寅坐臨溪閣圖一卷次等為二素絹本著色畫欵題云空山春盡落花深雨過林隂緑玉新自汲山泉烹鳯餅坐臨溪閣待幽人輒作小絶并畫以為贈存道老兄具儔昔之歡并居處之勝焉時𢎞治甲子四月上旬吳趨唐寅引首文徴明書六如墨妙四大字拖尾附文徴明落花詩四首欵云嘉靖戊申三月既望書徴明明唐寅折枝花卉一卷次等為三素絹本著色畫卷後欵題云寫罷花枝却有神十年磨脱筆頭塵明朝雨露天恩降不比繁華十様春晉昌唐寅畫并題畫凡十六種毎種有文徴明題句拖尾有王穀祥䟦一前隔水皇帝青宫時題詩云藝苑髙標最數誰六如能畫又能詩品兼二妙饒風韻筆染羣芳帶露枝蛺蝶窺牕將採際美人臨鏡欲簪時何須谷口尋春去粉本天然奪女夷寳親王長春居士題下有寳親王寳染翰二璽前有樂善堂一璽明唐寅秋林髙士圖一卷次等為四素絹本著色畫欵署唐寅引首皇帝青宫時題詩云寒溪引入仙鄉深一川風景含秋林霞衣雲帔結知心徘徊稱意羞華簪或浮輕舠或卧岑把釣蘆岸垂絲沉有來童子斜抱琴髙山流水彈清音拏空松栢虬龍吟白鷗為伴浮碧潯商山遺跡復見今箖箊晚籟寒窻侵生綃一幅重南金唐君妙筆何森森乗槎他日擬追尋祇今卧遊瀟灑滌煩襟寶親王長春居士題時甲寅七夕下有寶親王寶鳶飛魚躍二璽前有芝蘭室一璽明唐寅煮茶圖一卷次等為五素絹本著色畫欵云吳郡唐寅寫引首文徴明篆書六如墨妙四大字拖尾有祝允明書茶歌又陳淳記語一明仇英乞巧圖一卷次等霜一素牋本白描畫欵署仇英實父拖尾有王逢年書李白宫中行樂詞八首明仇英花鳥寫生一卷次等霜二素絹本著色畫欵云仇英實父製明仇英漢宫春曉圖一卷次等霜三素絹本著色畫欵云仇英實父謹製明張崟秋色圖一卷次等金一素牋本著色畫秋花二種自題云北林鵲夜飛南軒月馭近調絃發清徴蕩心祛褊恡變作離鴻聲還入思歸引長歎未終極秋風飄素鬢未署名後有張崟私印石樓二印明文徴明畫新燕篇詩意一卷次等生一素絹本著色畫欵云徴明戲筆别幅自書詩云杏花飛飛春燕来主人花下新堂開花間相見如相識綠樹東風捲簾入漠漠疎烟碧草齊斑斑小雨春泥濕城中甲第連雲起畫棟朱甍春旖旎故壘寧無繡幕思多情却向茅簷底苑簷日暖繡幕寒去來只作尋常看乃知物性無新故人情自爾分貧富我家舊宅經幾遷僅有此屋三年前一朝差池忽在眼便覺華煥生榱椽不嫌香土汚書帙時有飛花落舞筵人言禽鳥得氣先主人貧病何當痊人生未怕長貧賤但願年年見新燕嘉靖甲辰春二月廿又八日為惟用書徴明記語有四世孫寒溪同揆謹記九字引首有陸師道隸書春滿江南四大字明文徴明赤壁賦圖一卷次等生二素牋本著色畫前赤壁賦欵識云辛亥秋日徴明製引首自隷赤壁賦圖四大字拖尾有董其昌書後赤壁賦又陶隠居與梁武帝論書啟並跋一明文徴明存菊圖一卷次等生三素絹本著色畫卷後有徴明徴仲二印拖尾自題云西風采采弄秋黄種菊人遙菊未荒老圃尚餘清節在殘英長抱故枝香愁侵九日還逢雨寒入東籬忽踐霜珍重孤兒偏䕶惜百年手澤自難忘達公先生不忘其先府君菊菴之志因號存菊友生文徴明為賦此詩并系拙畫明文嘉畫㑹景堂圖一卷次等麗一素牋本著色畫欵識云癸夘九日文嘉作拖尾王穉登書㑹景堂七詠詩附雜詩四首竝尺牘一則明陳淳山水一卷次等水一素絹本著色畫欵署道復拖尾有王寵跋一明陳淳洛陽春色圖一卷次等水二素牋本著色畫牡丹欵署道復引首自篆洛陽春色四大字明陳淳牡丹一卷次等水三素牋本著色畫拖尾自識云嘉靖辛丑夏日白陽山人道復作于五湖田舎之浩歌亭明陳淳雲白山青圖一卷次等水四素牋本墨畫卷前有陳道復氏一印别幅草書李白詩欵云金陵江上逢蓬池隠者唐李太白作白陽山人道復書於雲山卷後引首自書雲白山青四大字欵署道復明錢穀氷蘗齋圖一卷次等玉一素牋本著色畫欵識云嘉靖丙辰日長至錢穀寫氷蘗齋圖引首王穀祥篆書氷蘗齋三大字拖尾穀又自題云先生安素業歳月讀犧經絶俗同原憲清修類管寧謀時心自拙懷徳志偏醒閉户窮探索青藜徹夜熒彭城錢穀前有王穀祥張鳳翼張鵬翼諸題句後有毛公瑾黄禮曾方儀諸題句明錢穀溪閣髙閒圖附文徴明詩帖一卷次等玉二素牋本著色畫欵署彭城錢穀别幅文徴明書絶句三首欵識云嘉靖丙午夏四月望後一日書舊作三絶句引首彭年書溪閣髙閒四大字明徐渭畫竹一卷次等出一素箋本墨畫卷後自題云齋中一夜雨成河午榻無緣遣睡魔急搗𤣥霜掃寒葉濕淋淋地墨龍拖右咏雨竹客裏鹽虀無一寸家鄉笋把束成柴畫取陂塘聊遣興翻引長涎濕到鞋右咏笋竹欵云積齋丈出卷索書予書其半而竹其半緣日來初習乏紙借人牋素打稿故也一笑天池山人徐渭又識云余學竹于春不踰月而至京此抺掃乃京邸筆也􅂝來重觀可發一笑渭明宋懋晉摹諸家樹譜一卷次等崑一素牋本墨畫凡三十九段每段書諸家姓氏及畫訣後識云惟畫松樹各家一法雜樹雖小異大都相類自唐至元無慮數百人而成家為人師法者不過二三十家而已余摹得二十家如畢宏張璪及元人之寫意者或可髣髴其一二若伯時與二李二趙輩不能得其萬一蓋院體俱入細落墨數次烘染設色一樹便可竟日豈草草之筆所可臨摹若能以死功臨之則反易於畢宏張璪之寫意者以故文人學畫須以逸品為宗丙辰清和望後宋懋晉識明黄彪畫九老圖一卷次等岡一素絹本著色畫欵識云繪事得神為上儼然生氣惟唐人有焉凌烟登瀛圖由帝王動費不貲莫可尚已白公以考槃繼美執彩筆者通達深造故此本獨擅古今景慕興者睢陽洛陽耆英盛矣崑山城南朱君璧家藏㑹昌本北城朱澤民家藏睢陽本邑舉斯文㑹時出一觀珍如大訓河圖然北朱好文學雖移於夏太常不逺復有及第科級南朱好飲博遂移於黄太常太常褒忠臣列於俎豆近因盗失千里贖歸有禎祥夫圖繪小物也興替闗焉何也蓋榮夀大老製作華國紀載維風係國家神氣神氣復而元氣培莫測所鍾此理難言也畫者亦間出杜子美謂好手難再遇即學書者世人皆學蘭亭面欲換凡骨無金丹余逺遊好道而歸七十有四嵗矣樓居謝客重圖以繼絶天假之年神實相之皇明萬厯甲午蜡月立明年春黄彪圖識拖尾陸士仁隸書九老詩并序明趙左倣黄公望富春大嶺圖一卷次等劍一素絹本著色畫欵識云甲辰夏五月摹黄子久富春大嶺趙左前後隔水皆有王鐸題識凡三則明周之冕花鳥一卷次等號一素絹本著色畫欵署周之冕明黄希憲江村圖一卷次等巨一素牋本著色畫欵云黄希憲寫拖尾有王鐸跋一明董其昌巖居圖一卷次等闕一素牋本墨畫欵識云癸丑春二月為汪履康寫岩居圖董元宰卷前有陳繼儒識語一明董其昌倣小米瀟湘奇境圖一卷次等闕二宣徳牋本墨畫欵識云記憶巴陵舟中望洞庭空闊之景寫此乙夘春元宰識拖尾又自跋云米老居京口嘗以清曉登北固眺望烟雲之變曰此􅆟似瀟湘虎兒楚山清曉圖進道君大都寫瀟湘奇境也余嘗謂畫家須以古人為師久之則以天地為師所謂天廏萬馬皆吾粉本也虎兒有長圖自題曰夜雨初霽曉烟未泮則其狀有類於此余亦時倣之董其昌自題寄嵩螺侍御明陸逺倣巨然谿山無盡圖一卷次等珠一宣徳箋本著色畫欵識云乙亥五月倣巨然筆陸逺前篆谿山無盡四字明鄒典金陵勝景圖一卷次等稱一素牋本著色畫欵識云甲戌秋鄒典寫拖尾有魏之璜葛一龍二跋明陳嘉言花卉一卷次等夜一素牋本墨畫無欵有陳嘉言印孔彰二印明程士椷萬松圖一卷次等光一素牋本墨畫欵識云歳在辛丑為葦溪老先生寫程士椷明王時敏倣宋元諸家畫一卷次等果一素牋本墨畫凡十幅每幅欵署烟客第一幅云倣北苑第二幅云倣倪迂筆第三幅云倣大癡第四幅云倣吳仲圭第五幅云倣雲林第六幅云倣叔明第七幅云倣巨然第八幅云倣米家山第九幅云倣子久第十幅云倣黄子久明楊文驄蘭石一卷次等珍一素牋本墨畫空勾著色三種後隔水欵識云素心仁兄得晤於澄江出卷索畫戲作芳蘭數本此所謂同心之言也戊寅六月廿七弟楊文驄識拖尾有陳函煇跋二又朱灝惲本初李令晳蔣邁錢振先沈戩穀顧夢麟諸跋明馬守貞畫蘭一卷次等李一素牋本墨畫欵題云莫訝春光不屬儂一香已足壓千紅縱令摘向韓娘袖不作人間腦麝風丙寅春三月偶寫湘蘭馬守貞石渠寶笈卷三十四
