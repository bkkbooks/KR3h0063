body:
  text: 卷一貯乾清宫一巻二貯乾清宫二巻三貯乾清宫三巻四貯乾清宫四巻五貯乾清宫五巻六貯乾清宫六卷七貯乾清宫七卷八貯乾清宫八巻九貯乾清宫九卷十貯養心殿一卷十一貯養心殿二巻十二貯養心殿三卷十三貯養心殿四巻十四貯養心殿五巻十五貯養心殿六卷十六貯養心殿七卷十七貯養心殿八巻十八貯養心殿九卷十九貯三希堂巻二十貯重華宫一卷二十一貯重華宫二巻二十二貯重華宫三卷二十三貯重華宫四巻二十四貯重華宫五巻二十五貯重華宫六巻二十六貯重華宫七巻二十七貯重華宫八巻二十八貯御書房一卷二十九貯御書房二巻三十貯御書房三巻三十一貯御書房四卷三十二貯御書房五卷三十三貯御書房六巻三十四貯御書房七巻三十五貯御書房八巻三十六貯御書房九巻三十七貯御書房十卷三十八貯御書房十一卷三十九貯御書房十二卷四十貯御書房十三卷四十一貯學詩堂卷四十二貯畫禪室巻四十三貯長春書屋随安室攸芋齋巻四十四貯翠雲館潄芳齋静怡軒三友齋臣等謹按欽定石渠寶笈四十四卷乾隆九年奉勅撰書評畫品肇自六朝張彦逺始彚其總依據舊文粗陳名目而已不能近見真迹也唐宋以來記載日夥或精於賞鑒而限於見聞或長於蒐羅而短於辨别迄未能兼收衆論定著一編為藝林之鴻寶我國家承平景運一百餘年内府所收既多人間所未睹我皇上幾餘㳺藝妙契天工又睿鑒所臨物無匿狀是以品評甲乙既博且精特命儒臣録為斯帙以貯藏殿閣依次提綱以書冊畫冊書畫合冊書巻畫巻書畫合巻書軸畫軸書畫合軸分條列目其箋素尺寸印記姓名賦詠䟦識與奉有御題御璽者皆一一臚載纎悉必詳而三朝宸翰皇上御筆尤珍逾球璧光燦儀璘仰見未明勤政之餘乙夜觀書之暇松雲棟牖穆穆凝神所為頗養天和怡情悦性者不過㳺心翰墨寄賞丹青與前代帝王務侈紛華靡麗之觀者迥不侔也乾隆四十六年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
