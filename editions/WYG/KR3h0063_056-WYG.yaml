  text: 貯重華宫國朝人畵軸上等惲壽平五清圖一軸惲壽平枯木竹石王翬平林散牧圖王原祁秋山圖王原祁虞山秋色圖王原祁山村雨景王原祁草堂烟樹圖王原祁倣倪瓚山水王原祁倣黄公望山水王原祁松亭山色圖王原祁倣北宋人山水赫奕雨壑風林圖赫奕畵唐人詩意圖赫奕丹楓翠岫圖赫奕秋山雲樹圖張鵬翀翠巘髙秋圖董邦逹九陽消寒圖董邦逹㶚橋覔句圖董邦逹溪山霽雪圖唐岱孫祜合倣李唐寒谷先春圖唐岱倣趙孟頫山水余省東籬秀色圖沈源畵新月詩意畵軸次等惲壽平東籬秋色圖惲壽平富貴圖惲壽平菊花王翬巖棲髙士圖王原祁倣倪瓚山水赫奕禁園秋霽圖赫奕烟江漁艇圖赫奕山水蔣廷錫瑞蔬圖蔣廷錫牡丹蔣廷錫藤花山雀圖蔣廷錫蟠桃圖髙其佩八駿圖髙其佩雙駿圖髙其佩廬山瀑布圖慎郡王允禧山靜日長圖戴天瑞春山勝事圖戴天瑞山水張鵬翀松梅清韻圖朱淪瀚瀟湘烟靄圖唐岱千山落照圖唐岱夏山髙逸圖院本新豐圖
