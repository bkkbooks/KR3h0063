body:
  text: 貯養心殿列朝人書冊上等晉王羲之快雪時晴帖晉王謝雨後中郎二帖宋髙宗千文宋人箋牘宋諸名家墨寶宋蘇軾書楚詞宋元寶翰元名家尺牘元趙孟俯尺牘元趙孟俯書出師陳情二表元趙孟俯題畫詩元趙孟俯鮮于樞合冊元陸繼善摹禊帖元髙翼書通書元曹善書山海經元明人題錢譜雜文蟬離詩帖明祝允明書和陶飲酒詩明董其昌仿古十種明董其昌書輞川詩明董其昌臨諸家帖明董其昌書千文明董其昌仿古三種明董其昌臨帖
