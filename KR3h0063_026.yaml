body:
  text: 貯養心殿列朝人畫冊上等元方方壺山水明沈周溪山草閣明陳洪綬畫𨼆居十六觀明人便面集錦明文徴明畫扇畫册次等厯代名繪五代徐崇嗣花草宋馬逺畫小品元盛懋幽風圖明戴進太平樂事圖明陸治寫生明欽揖摹古明人便面畫明人畫扇明人扇頭畫無名氏書畫畫冊次等漆牋畫刻絲畫冊上等附花鳥寫生國朝人書畫畫冊上等惲夀平寫生文㸃詩意圖王原祁山水張鵬翀畫桃花寺八景焦秉真耕織圖冷枚耕織圖畫冊次等惲夀平花草惲夀平山水費而奇花草僧傳綮寫生僧瀞睿仿宋元人山水張畫花草蔣廷錫花草閨秀錢陳書花草閨秀錢陳書摹古列朝人書畫書畫合冊上等明董其昌書畫合璧書畫合冊次等元趙孟頫書蘭亭序明張路繪圖明王時敏董其昌書畫合璧國朝人書畫目録書畫合冊上等蔣廷錫張照書畫合璧
  hash: sha256:fde9925f40b5b2181f8379f003464b706bb8eb6857e90671e62c2f0b2a133607
