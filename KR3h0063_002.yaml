front:
  text: 欽定四庫全書石渠寶笈凡例
  hash: sha256:8d28512675a62138953ecdcd8d8826d3c809fb807a3fe0c487fe6304f7a4ba43
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_002-1a, image: WYG0824/WYG0824-0002a.png}
body:
  text: 一是書首冠四朝宸翰其人手蹟則謹依年代前後先列朝次無名次國朝先冊次卷次軸書畫既區上次攸别各以周興嗣千文中一字編記並仿祕殿珠林體例顧此書卷帙更繁叙録不無小異而大段規模則總歸一致也一我朝聖聖相承道德光華發為文藻四朝宸翰焜耀萬世冊卷軸各以類分就中以標題尤典重者辨首至臨摹古人則仍從舊蹟次第凡青宫時翰墨又歸於後不以編年為序也一秦漢以來尚矣六朝五代唐宋元明列朝大較燦如眉列而各朝內又詳考本人列傳依年叙録國朝亦以先後年歲自為分别臺閣山林及方外女史更不另為位置文字因緣固當如是一是編所收皆古今名蹟雖或臨本逼真亦暨置之次等題疑俱仍其舊而真贋自別如次等書有二王褚桞次等畫有荆關董巨一冊卷軸之後又别為書畫合璧一門然必其工力悉敵方稱雙美其有年代懸殊及書畫未必兩佳者則仍各從其類等諸附庸不為並重也一釋道二氏既編為祕殿珠林一集是編亦間有涉二氏語者然所書非某偈某經所畫非祗林丹室則亦同為月露風雲而已故是編仍為收入一書畫首詳本幅先分别箋絹與書之真草篆𨽻畫之墨畫著色及本人欵識圖章或他人題跋在夲幅者暨收藏押縫諸印以次叙録不奸不僣其冊則前後副頁次及餘副卷則前後隔水次引首又次拖尾軸則左右邉幅次及詩塘題記夥􅀈謹依其次欲使條理井然觀者可無留目也一上等叙述尤詳總無一字之遺惟題跋人圖印後刪以欵字已明不須重贅也次等則但記本人題識不叙印章其有經御筆題跋者仍謹為詳録至他人題跋則但云某題一某跋一不録全文禮從其降所以别於上等又上等本幅則謹記高廣若干用明珍惜次等則略之以省登記之繁一凡所登記其題跋與印章俱謹依前後冊則曰幅前幅後卷則曰卷前卷後軸則曰左方右方上方下方其為前代內府收藏之寶統以璽書之名人印章統以印書之其間有諸印或幾印如三印四印云有卷前卷後或卷首卷尾不無小異一書畫中有聖祖暨我皇上書籖並題跋者則於各項叙述之後敬為登載不敢與諸人題跋一例一名跡流傳幾經裝背欵字已失或原無題欵經名人鑒跋確有據依或書法畫宗的然無欵為某某者則以無欵或未署欵書之仍歸列朝有名人類其稍涉疑似未為傳信則分别墨氣絹色約略唐宋别為無名氏一門亦夏五缺文之意一上等中題跋既全録原文其間有但署别號及無名者其印章可識或别有考據則仍書某某其概無可證則但書題句云跋語云直録其題跋之詞而以後署某字書之不敢臆為附㑹用以闕疑存考一真蹟中如羲獻手墨一字亦不易得其殘縑斷幅必以幾行幾字謹記之所以别於後代諸家吉光片羽珍重應更逾十倍也一全幅中或有割裂弗全題識中或有訛舛字句又白璧無瑕或俗子贋作一詩一跋此類則間加按語祗以别白是非而贊美之詞不贅一古人名蹟輾轉流傳收藏不一手前人無論矣本朝則雙峰閣思原堂二家題識圖章概刪不録以其無關輕重且春秋遺意也一刻絲繡線雖工亦為降格皆附於本項無名氏之後毋庸别分門類又便面盛於有明名人真蹟往往可見然一冊多至數十家其年代前後參差不等亦總歸於列朝之末一書畫分貯乾清宫飬心殿重華宫御書房四處俱各用鑒藏璽以别之又石渠寶笈乾隆御覽之寶二璽冊卷軸皆同上等者則益以乾隆鑒賞三希堂精鑑璽宜子孫三璽既分貯四處所編字號仍分部排次取其便於觀覽一我皇上宸翰富有日新又御府後此所收古今名蹟亦未可槩以起訖並擬另入續集再為編次一是編始於乾隆甲子仲春成於乙丑冬十月奉敕排纂諸臣有不能終始其事者然既均效編摩即當與名其列今仍照被命名次署銜用志緣起臣張照臣梁詩正臣勵宗萬臣張若靄臣莊有恭臣裘曰修臣陳邦彥臣觀保臣董邦逹恭記
