body:
  text: 貯御書房八無名氏畫卷上等唐人洛神賦全圖五代人雪霽捕魚圖宋人耆英㑹圖宋人胡笳十八拍圖宋人蠶織圖宋人摹顧凱之斵琴圖宋人畫九歌圖宋人西園雅集圖宋人錦江圖元人青山白雲圖元人雪江漁艇圖刻絲畫卷上等附趙昌花卉翎毛慶壽圖並米芾書畫卷次等唐人畫女孝經圖五代人别苑春山圖宋延祐畫院鹵簿圖宋院夲景德四圖元人畫竹元人奪錦標圖元人癅女圖明人百花圖國朝人畫卷上等吴歴雲白山青圖王翬層巒曉色圖王原祁層巒茂樹圖王原祁富春山圖畫卷次等邵彌載鶴圖王鐸花卉王原祁秋山書屋圖沈宗敬溪山深秀圖王敬銘仿趙孟頫雲嶠長春圖赫奕烟樹山亭圖郎世寜百駿圖唐岱秋山不老圖李鱓四季花卉
