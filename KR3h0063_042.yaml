body:
  text: 貯重華宫一四朝宸翰書畫合冊御筆詩經全圖書畫合璧御製豳風圖並書御筆生香樂意御筆渉筆成趣御筆臨古御臨蔡襄謝賜御書詩帖御臨蘇軾詩帖御臨黄庭堅五言古詩御臨米芾尺牘御臨董其昌書枯樹賦御臨董其昌書樂志論御筆澄海樓圖御筆葡萄蘭花御筆秋英八種御筆泉石蘭竹御筆秋花三種御臨趙孟頫蘭蕙圖御臨趙孟頫浴馬圖御臨倪瓚修竹學亭圖御筆蒼松暎日圖御筆三餘逸興園御筆九思圖御臨李公麟明君出塞圖御臨唐寅文徴明蘭亭書畫合璧御臨蘇軾梅花詩帖御臨趙孟頫節書歸去來詞帖御臨俞和詩帖御筆秋𤓰一軸御筆烟波釣艇圖御筆冩去鶴歸僧詩意御筆冬卉冩生御臨文徴明蘆汀放鴨圖御筆松齡眉夀圖御筆瑞芝圖御筆秋蘭詩畫合壁
