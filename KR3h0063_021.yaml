body:
  text: 貯乾清宫九無名氏畫軸上等唐人勘書圖一軸上等天一素絹本著色畫右方上宇文材題云枕藉山窗靜褰簾玉樹脫牙籤搖竹影縹帙散藝香客照應吹杖兒攤解滿牀絶勝投閣老空自有文章京兆宇文材下一印漫漶不可識左方中有蕉林觀其大略二印軸髙三尺八寸七分廣一尺八寸一分宋人梅花鸂鶒圖一軸上等地一素絹本著色畫軸髙三尺九寸四分廣一尺九寸三分宋人月落堪眠圖一軸上等元一素箋本著色畫軸髙二尺五寸四分廣二尺八寸五分宋人秋溪雙鴈圖一軸上等黃一素絹本著色畫軸髙五尺五寸七分廣三尺一寸四分宋人憩虎圖一軸上等宇一素絹本著色畫右方下一印左方上二印俱漫漶不可識軸髙四尺四寸三分廣二尺四寸七分宋人麗景集禽圖一軸上等宙一素絹本著色畫軸髙三尺九寸四分廣一尺九寸三分宋人折枝棠梨圖一軸上等洪一素絹本著色畫上方有乾卦一璽又天厯之寶一又晉國寶章晉府書畫之印二印又一璽並半印二俱漫漶不可識左方下有紹興一璽又晉府圖書一印右方下有珍祕希世之寶子孫保之清和珍玩諸印軸髙三尺一寸九分廣一尺八分宋人桃花鸂鶒圖一軸上等荒一素絹本著色畫軸髙四尺二寸廣二尺七寸六分宋人觀馬圖一軸上等日一素絹本著色畫軸髙三尺二寸七分廣四尺三寸宋人鶺鴒圖一軸上等月一素箋本著色畫右方上題句云國風詩裏急難情千里孤飛亦暫停露冷蓮房吳水濶南歸有日振修翎後署石村襄軸髙一尺九寸八分廣八寸四分宋人杏鵝圖一軸上等盈一素絹本著色畫右方下有秋壑圖書聊復爾齊之印二印軸髙五尺一寸八分廣三尺三寸八分宋人山丹孔雀圖一軸上等昃一素絹本著色畫右方下有半印漫漶不可識左方下邊幅有棠村審定蕉林二印軸髙五尺五寸一分廣三尺三寸二分宋人杏花雙鵝圖一軸上等辰一素絹本著色畫軸髙五尺六寸四分廣三尺三寸七分宋人香獐圖一軸上等宿一素絹本著色畫上方有晉國寶章一印右方上一印漫漶不可識軸髙四尺八寸六分廣三尺二寸四分宋人蕉隂仕女圖一軸上等列一素絹本著色畫左方上有趙氏仲光徐氏寶藏珍玩魏國世家趙􅘢家藏書畫琳字休伯諸印又一印並半印三俱漫漶不可識左方下有吳士諤印一印軸髙一尺五寸三分廣一尺六分元人翎毛一軸上等張一素箋本淡著色畫左方上有子子孫孫永保一印下有江氏家祚圖書一印軸髙一尺一寸九分廣七寸三分元人樓閣一軸上等寒一素箋本白描畫右方下有公素布衣之士二印軸髙一尺五寸三分廣七寸二分元人雪景一軸上等來一素箋本著色畫右方下有㑹侯鑒賞一印又半印不可識左方下有吳下沈皓印記劍光閣圖書記二印軸髙三尺廣九寸八分元人蓮喜圖一軸上等暑一素箋本著色畫右方中有四明吕廷振一印軸髙二尺六分廣七寸一分明人淮隂平項圖一軸上等往一素箋本白描畫右方中半印不可識軸髙一尺七寸四分廣一尺三分明人寒潭清白圖一軸上等秋一宣德箋本著色畫軸髙四尺八寸四分廣三尺一寸七分附刻絲畫軸上等長春圖一軸上等天一宋本五色織花鳥右方上織唐范長夀長春白頭圖九字有宣和押字上鈐御書一璽上另幅圓光素織米芾書七言絶句一首款署米芾下有米芾元章印一印軸髙七尺三寸六分廣二尺觀奕圖一軸上等地一宋本五色織軸髙四尺八寸一分廣二尺四寸八分花卉蟠桃一軸上等元一宋本五色織款織吳煦二字下織吳煦印一右方上有珍賞一印下有珍祕宜爾子孫㑹侯珍賞漢水耿㑹侯書畫之章諸印左方上有丹誠一印中有琴書堂都尉耿信公書畫之章二印下有公字信公珍賞二印軸髙一尺九寸廣一尺六寸二分九老圖一軸上等黃一宋本五色織軸髙四尺八寸五分廣二尺六寸二分荷花鴛鴦一軸上等宇一宋本五色織軸髙一尺八寸三分廣一尺三寸九分花卉翎毛一軸上等宙一宋本五色織軸髙三尺七寸九分廣一尺四寸七分海棠雙鳩一軸上等洪一宋本五色織軸髙二尺九寸二分廣一尺一寸四分秋山詩意圖一軸上等荒一宋本五色織軸髙二尺六寸八分廣一尺一寸八分梨花鸂鶒圖一軸上等日一宋本五色織軸髙三尺四寸二分廣一尺六寸八分附繡線畫軸上等王維山水一軸上等天一宋綾本五色繡右方上有安陽開國印記子京㑹心處三印下有子孫永保西楚王孫項墨林父祕笈之印三印左方上有天籟閣一印下有項元汴印田疇耕耨二印詩塘素繡七言絶句一首款繡米芾題三字下有米姓之印一印右方上有寄傲一印下有若水軒項墨林鑒賞章二印左方上有檇李項子京氏二印軸髙一尺三寸廣一尺三寸四分畫軸次等宋人雪江垂釣圖一軸次等天一素絹本著色畫宋人美人觀奕圖一軸次等地一素絹本著色畫宋人溪山秋霽圖一軸次等元一素絹本著色畫宋人秋徑拍鵰圖一軸次等黃一素絹本著色畫宋人蒼鷹顧鴙圖一軸次等宇一素絹本著色畫宋人坐看雲起詩意圖一軸次等宙一素絹本墨畫上方隸書王維詩宋人海青天鵝圖一軸次等洪一素絹本著色畫宋人秋花雁雀圖一軸次等荒一素絹本著色畫宋人風雨歸漁圖一軸次等日一素絹本著色畫宋人梅花竹雀圖一軸次等月一素絹本著色畫宋人通臂嬉飲圖一軸次等盈一素絹本著色畫宋人鷹揚圖一軸次等昃一素絹本著色畫宋人鎖諫圖一軸次等辰一素絹本著色畫宋人郤坐圖一軸次等宿一素絹本著色畫宋人貨郎圖一軸次等列一素絹本著色畫宋人貨郎圖一軸次等張一素絹本著色畫宋人仙山樓閣圖一軸次等寒一素絹本墨畫宋人起蛟圖一軸次等來一素絹本著色畫宋人鵲籠戲嬰圖一軸次等暑一素絹本著色畫宋人秋鷹摶擊圖一軸次等往一素絹本著色畫宋人秋山蕭寺圖一軸次等秋一素絹本著色畫宋人探春圖一軸次等收一素絹本著色畫宋人三章圖一軸次等冬一素絹本著色畫左方下有記語臣蔡受益進五字宋人三猿摘果圖一軸次等藏一素絹本著色畫元人訪道圖一軸次等閏一素絹本著色畫元人花鳥一軸次等餘一素絹本著色畫元人喬松鶚跱圖一軸次等成一素絹本著色畫元人策蹇春逰圖一軸次等嵗一素絹本墨畫明人蓼花野鳬圖一軸次等律一素絹本著色畫明人蘆雁一軸次等吕一素絹本墨畫明人九陽消寒圖一軸次等調一素絹本著色畫每候書絶句一首詩塘有識語一未署款明人寒禽雪圖一軸次等陽一素絹本著色畫明人仙山樓閣圖一軸次等雲一素絹本墨畫明人溪山深秀圖一軸次等騰一素絹本淡著色畫明人梅窗詩意圖一軸次等致一素絹本著色畫明人仙姝獻夀圖一軸次等雨一素絹本著色畫詩塘有莊坰生臨顔真卿麻姑仙壇記明人雪蓑垂釣圖一軸次等露一素絹本著色畫附刻絲畫軸次等瑶池獻夀圖一軸次等天一明本五色織款云長洲朱良棟製國朝人畫軸上等惲夀平喬柯修竹圖一軸上等天一宣德箋本墨畫右方上款識云喬柯修林臨柯敬仲左方又自識云元人逸品其意難言矣殆如盧敖之游太清列子之御泠風也白華居士下有叔子一印又識云筆墨簡潔處最為慘淡運其神氣於人所不見之地惟懸解者得之美人之光可以養目于畫亦然新秋在湘雨亭南田夀平下有夀平雪衣居士二印軸髙一尺九寸廣九寸一分王原祁仿米家雲山圖一軸上等地一素箋本墨畫款識云辛巳九秋寫米家雲山於燕臺客館麓臺祁下有王原祁印麓臺二印前有蒼潤一印右方下有興與烟霞㑹一印軸髙一尺八寸八分廣九寸七分王原祁松溪仙館圖一軸上等地二宣德箋本著色畫上方款識云辛卯小春寫松溪仙館即丹臺春曉大意倣黃鶴山樵麓臺下有王原祁印麓臺二印前有三昧一印軸髙一尺八寸廣一尺二寸一分王原祁富春山色圖一軸上等地三宣德箋本著色畫款識云擬一峯老人富春山圖王原祁下有王原祁麓臺二印軸髙一尺六寸一分廣一尺三分王原祁倣董源雲山圖一軸上等地四素箋本墨畫款識云寫北苑雲山大意麓臺庚辰年筆下有茂京一印右方下有石師道人一印軸髙一尺四寸七分廣二尺六分王原祁仙山樓閣圖一軸上等地五宣德箋本著色畫款識云趙承㫖有仙山樓閣圖特師其意時辛卯九月草七日王原祁下有原祁茂京二印前有峭倩一印軸髙一尺八寸七分廣一尺一寸王原祁峭石喬柯圖一軸上等地六素絹本墨畫款云臣王原祁恭畫下有臣原祁一印軸髙一尺八寸六分廣一尺一寸二分上方聖祖仁皇帝書唐人五律一首識云録張祐下有康熙稽古右文二璽前有惜寸隂一璽赫奕山居圖一軸上等元一素絹本著色畫款云臣赫奕恭畫下有臣赫奕恭畫二印軸髙四尺四分廣一尺九寸七分右方上聖祖仁皇帝書元人七律一首識云元成廷圭題山居圖下有體元主人萬幾餘暇二璽前有佩文齊一璽赫奕紅樹秋山圖一軸上等元二素絹本著色畫款云臣赫奕恭畫下有赫奕恭畫二印軸髙五尺一寸廣二尺五寸六分左方上聖祖仁皇帝書董其昌七言截句識云董𤣥宰句下有康熙稽古右文二璽前有心手相師一璽閨秀錢陳書倣王蒙筆意一軸上等黃一宣德箋本墨畫款識云清暉山人曽示余倣黃鶴山人華山松壑鳴泉二圖束本本領絶佳後見家長孺倣松壑鳴泉疏老蒼秀覺清暉猶有名家習氣秋窗無事偶為合景然終以未見黃鶴山人真跡為恨也南樓老人陳書并識雍正四年九月既望下有陳書之印上元弟子二印前有米珠一印左方下有香樹齊一印軸髙三尺二寸七分廣一尺二寸九分畫軸次等王原祁熱河勝景圖一軸次等天一素絹本著色畫款云日講官起居注詹事府詹事兼翰林院侍讀學士臣王原祁恭畫王原祁西湖圖一軸次等天二素絹本墨畫西湖十景款云翰林院侍讀學士臣王原祁奉勑恭畫赫奕秋林晚靄圖一軸次等地一素絹本著色畫款云臣赫奕恭畫右方上聖祖仁皇帝書唐人五律一首識云録張祐下有康熙稽古右文二璽前有中和一璽赫奕溪橋結廬圖一軸次等地二素絹本著色畫款云臣赫奕恭畫左方上聖祖仁皇帝書董其昌七言截句識云臨董其昌下有康熙宸翰保合太和二璽前有佩文齊一璽蔣廷錫菊花一軸次等元一素絹本著色畫款云臣蔣廷錫恭畫左方上聖祖仁皇帝題云山花野菊喜清風塞北烟光報嶺楓無暑不知秋氣至數叢蘭蕊放離宫乙酉秋日山莊偶成并書下有體元主人萬幾餘暇二璽前有佩文齊一璽蔣廷錫剪秋羅寫生一軸次等元二素絹本著色畫款云臣蔣廷錫恭畫右方上聖祖仁皇帝題云可惜輕羅任剪裁名傳南國尚徘徊未知紫塞多佳種雜置深紅配緑苔咏剪秋羅下有康熙稽古右文二璽前有中和一璽蔣廷錫蓮塘白鷺圖一軸次等元三素絹本著色畫款云臣蔣廷錫恭畫右方上聖祖仁皇帝題云濃淡色中勻粉膩淺深痕上著胭脂華堂展處南薰起一似西湖六月時下有康熙宸翰保合太和二璽前有佩文齊一璽蔣廷錫文明富盛圖一軸次等元四素絹本著色畫錦雞牡丹款云臣蔣廷錫恭畫蔣廷錫蘆雁一軸次等元五素絹本著色畫款識云宋人殷宏本臣蔣廷錫恭臨左方上御筆題妙字蔣廷錫畫何爾其圖一軸次等元六素絹本著色畫款云臣蔣廷錫恭畫按何爾其雞類出于黑龍江興安南北地康熙四十六年秋命廷錫畫圖蔣廷錫畫山羊圖一軸次等元七素絹本著色畫款云臣蔣廷錫恭畫宋駿業晴巒瑞靄圖一軸次等黃一素絹本著色畫款識云晴巒瑞靄臣宋駿業恭畫