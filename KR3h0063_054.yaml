body:
  text: 貯重華宫列朝人書畫書軸上等明董其昌書座右銘書軸次等明文徴明書七言律詩國朝人書畫書軸次等勵杜訥書冒雨尋菊序列朝人書畫書軸上等唐韓幹猿馬圖宋徽宗梨花宋李成寒林平野圖宋馬和之荷亭納凉圖元唐棣霜浦歸漁圖元黃公望洞庭竒峯圖元王蒙秋山蕭寺圖元王蒙林泉清趣圖元王蒙花溪漁隱圖元王蒙谷口春耕圖元倪瓚溪亭山色元倪瓚古木竹石元倪瓚秋樹筠石元盛懋春塘禽樂圖元曹知白貞松白雪軒圖元曹知白疏林亭子元陸廣仙山樓觀明宋克鸞尾清風圖明啇祚秋葵圖明沈周蔬筍寫生明沈周花下睡鵝圖明沈周畫郭素圖明沈周雙烏在樹圖明沈周畫枇杷明唐寅寫春風第一枝明唐寅葑田行犢圖明仇英水仙蠟梅明文徴明倣雲林松石明文徴明空林落葉圖明文徴明古石喬柯圖明文徴明疏林茒屋圖明文徴明嵗寒三友圖明文徴明茂松清泉圖明文徴明溪亭客話明錢穀松隂趺坐圖明陸治雙鳩紅雨圖明項聖謨山水明李紹箕溪山訪隱圖明丁雲鵬東山圖明董其昌倣倪瓚山隂邱壑圖明董其昌倣倪瓚筆意畫軸次等宋徽宗杏花鸚鵡圖宋徽宗荔支圖宋范寬溪山行旅圖宋郭熙峩眉雪霽圖宋崔白竹鷗圖元趙雍秋原駿馬圖元王蒙丹臺春曉圖元王蒙松壑樓居圖元吳鎮雙松圖明邊景昭百喜圖明倪端山水明沈周仙桃圖明吕紀蘆汀來雁圖明吕紀秋鷺芙蓉圖明袁崝邱溪山小景無名氏書畫畫軸上等宋人松隂訪隱圖元人訪米氏雲山刻絲畫軸上等附山水圖羣仙慶夀圖仙妹獻瑞圖繡絲畫上等附丹鳯朝陽圖畫軸次等唐人文㑹圖宋人折檻圖宋人畫鷹宋人貸郎圖宋人寒汀蘆雁圖宋人溪山初雪圖元人花鳥元人射雁圖明人望海樓圖
