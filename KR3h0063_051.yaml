  text: 欽定四庫全書石渠寶笈卷二十四
  hash: sha256:f015eafafc158a712a1a61437c6277a2d19ca6f9a816ee7c6fc77d26e7db60fe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_051-1a, image: WYG0825/WYG0825-0076a.png}
body:
  text: 貯重華宫五列朝人書卷上等宋蘇軾自書二頌一卷上等天一素箋本行楷書石恪畫維摩讚魚枕冠頌二篇款識云僕在黃岡時戲作此等語十數篇漸復忘之元祐三年八月草九日同僚早出獨坐玉堂忽憶此二首聊復録之翰林學士眉山蘇軾記卷前有張氏淡嵒珍祕之印半印卷後有柯九思墨印一又柯氏祕笈袁通父氏趙果正初默菴方虞杼基本初越來子圖書記虞集諸印又張氏淡嵒三吳半印二前後隔水俱有徐氏珍玩乾學二印拖尾杜本跋云東坡先生之文之書所謂如我按指海印發光者也維摩讚其室中八萬四千師子座一一演説妙法未能答此半偈魚枕頌非鏡鐙光中所見世界耶在近世惟邵菴道人與之同參杜本又張雨跋云大慧與富公書曰如是得與究竟相應豈獨於生死路上得力異日再秉鈞軸致君於堯舜之上如指諸掌耳伏觀蘇公真書二頌益信其為究竟此所以為蘇公歟方外張雨又楊維禎跋云余讀蘇玉局在玉堂所寫維摩贊魫冠頌二首而知是老遊戲人間世其所見卓然獨立乎造是物者之表雖東方曼倩號為滑稽之雄豈能及哉玉堂瘴海一升一沈世間以為利害禍福者又豈足以入其舍哉世以是老之學溺般若而不知般若之學不能出其文字之妙也吁維摩欲以無語現不二門而是老欲以橫説豎説現妙喜語默雖殊三昧一也故會是法者所至為玉堂淨土不然者雖玉堂淨土惡海而已耳至正三年冬十月朔鐵心道人識於錢塘湖上又王慶跋云盛宋稱文章蘇翰林當一代之雄然觀其書奏皆忠言讜議深謀逺慮為國家世道計豈居文章之下耶及其鬼蜮之謗橫逆之加朝玉堂夕嶺海而公處之泰然未嘗以死生得失纍於其心是皆順受之乎天也豈真所謂有無幻化深得於禪學者哉所書維摩讚魫冠頌自以為録其戲言此又嬉笑怒罵之緒餘耳遺墨粲然誠為世寶後之觀者當與公書所撰昌黎伯廟碑並參庶無惑焉巨鹿王慶百拜書卷髙七寸七分廣六尺四寸九分元趙孟俯天冠山詩帖一卷上等地一素絹本行書五言絶句款識云詩二十八首率爾而成非有佳趣而張貞居見之反以為好裝絹成卷間來索寫乃為應命云爾孟俯識下有趙子昻氏一印通卷暨前後押縫有汴陸氏家藏書畫印寶墨樓印各五印引首有松雪遺墨四大字卷髙九寸四分廣九尺四寸九分明文徵明書赤壁賦一卷上等元一素箋本行書款識云嘉靖丙辰春日間書徵明時年八十七後有文徵明印衡山二印卷前有停雲一印卷後有夢硯樓賞鑑章璵沙珍玩二印卷髙九寸廣一丈四尺四寸三分明董其昌書濬路馬湖記一卷上等黃一朝鮮鏡光箋烏絲闌本行楷書款云賜進士出身資政大夫南京禮部尚書前禮部左侍郎兼翰林院侍讀學士詹事府少詹事掌南京翰林院事實録副總裁經筵講官年家眷弟董其昌撰並書又記篆額及建立銜名二條又自識云路馬湖俗名駱馬湖今正之卷首有賜金園主人子孫寶之二印卷末有緼真閣圖書記子孫永保儼齋祕玩王鴻緒印諸印通卷暨前後押縫有鍊雪鑑定印三蘭雪堂收藏印四又張晴嵐印一後隔水沈荃跋云此碑筆意極仿北海而亦時近季海宗伯作書每有合諸家者惟其神與法會變化不自知耳乙巳四月草四日後學沈荃書於龍潭舟次前半印存珍玩二字卷髙九寸三分廣一丈九尺書卷次等明文徴明自書詩帖一卷次等天一素箋本行草書七言律詩七首款識云庚子新正十日書舊作徴明明文徴明自書詩帖一卷次等天二素箋本行草書各體詩未署款卷末有王揚記云衡山先生詩稿共二十四首癸巳秋日記引首曽𢎞篆書本色文章四大字拖尾有張魯唯董其昌王揚李孫宸諸跋明文徴明書蘭亭序一卷次等天三素箋本款識云戊午春三月望日書徴明時年八十有九明莫是龍供花間語一卷次等地一素箋烏絲闌本行書二段凡九則款云莫雲卿撰並書前署供花間語四字明董其昌臨蘇軾黃庭堅帖一卷次等元一宣德鏡光箋本行書前臨蘇軾書凡五則款云其昌書蘇子瞻語後臨黃庭堅書凡三則款云倣山谷書其昌國朝人書卷次等王鐸擬古帖一卷次等天一素箋本臨王筠虞世南柳公權陸柬之薛稷各帖凡五則款署孟津王鐸列朝人畫卷上等宋徽宗五色鸚鵡圖一卷上等天一素絹本著色畫款題並序云五色鸚鵡來自嶺表養之禁籞馴服可愛飛鳴自適往來於苑囿間方中春繁杏遍開翔翥其上雅詫容與自有一種態度縱目觀之宛勝圖畫因賦是詩焉天産乾臯此異禽遐陬來貢九重深體全五色非凡質惠吐多言更好音飛翥似憐毛羽貴徘徊如飽稻粱心緗膺紺趾誠端雅為賦新篇步武吟後署字缺存製并二字下有押字亦微缺上鈐御書一璽卷後有天厯之寶一璽下有商丘宋犖審定真迹一印前隔水有米芾畫禪煙巒如覿明説克傳圖章用錫一印後隔水有宫保司馬之孫大司農之章戴明説印二印卷髙一尺六寸五分廣四尺宋徽宗花鳥寫生一卷上等天二素箋本墨畫無款凡十二段第一段杏花啼鳥第二段榴花畫眉第三段梔子練雀第四段木槿戴勝第五段雨梢立雀第六段晴篠嚶鳴第七段踈幹栖禽第八段叢篁鳥語第九段梅幹春鳩第十段古柏栖紅第十一段莎草鶺鴒第十二段沙鳥雙雛卷前有政和宣和二璽又梁清寯印常山世家元映齋藏梁清標印諸印每段押縫有雙螭璽共十一卷後有梁清寯印一印卷髙八寸五分廣一丈六尺三寸第一段御題杏苑春聲四字下有乾隆宸翰幾暇怡情二璽第二段御題薰風鳥語四字下有翌太和一璽第三段御題薝蔔栖禽四字後有中和染翰二璽第四段御題蕣花笑日四字上有乾隆宸翰一璽第五段御題碧玉雙栖四字下有墨雲一璽第六段御題淇園風暖四字下有浴德潄芳潤二璽第七段御題白頭髙節四字後有潔矩涵虛朗鑑二璽第八段御題翠篠喧晴四字上鈐研露一璽第九段御題踈枝喚雨四字後有比德朗潤二璽前有席上珍一璽第十段御題古翠嬌紅四字下有會心不逺一璽第十一段御題原上和鳴四字下有樂天惟精惟一二璽第十二段御題樂意相關四字下有乾隆幾暇臨池三璽宋李成茂林逺岫圖一卷上等地二素絹本墨畫無款姓氏見跋中卷前有天籟閣檇李項氏世家寶玩二印卷後有神品一印又安定退密半印二又九印俱漫漶不可識拖尾向上跋云曽祖母東平夫人實申國文靖公之孫樞使惠穆公之女也右李營丘成所作茂林逺岫圖即祖母事先曽祖金紫時奩具中小曲屏大父少卿靖康間南渡與趙昌徐熙花攜以來今皆保藏敬書所自以詔後世嘉定乙卯嵗冬至日古汴向上若氷因再裝池以示友人姚子晦徐元海夏齊卿朱仲幾劉宋儒前有退密項元汴印墨林祕玩項叔子項子京家珍藏若水軒諸印又棠村桃花源裏人家世家寶玩閣書畫記黃字封字諸半印後有寄傲墨林生西楚王孫困學齋平生真賞墨林祕玩項子京家珍藏子孫世昌諸印又倪瓚跋云李營丘平生自貴重其畫不肯輕與人作故人間罕得米南宮至欲作無李論蓋以多不見真者也此卷林木蒼古山石渾然徑岸縈回自然趣多類荆浩晚年合作至正乙巳六月草日吳城盧氏樓觀延陵倪瓚前有𨝍上張鏐黃美拜觀子京桃里子孫永保虛朗齋項墨林鑑賞章神遊心賞諸印後有子京所藏項元汴印平生真賞項墨林父祕笈之印諸印又張天駿跋云李營丘作茂林逺岫圖倪雲林評其有渾然天趣者也東平夫人之曽孫嘗識其曽祖金紫時小曲屏之具今觀其峯巒疊翠草木聫青舟車往還亭館森鬱有無限真賞良可嘉也內監吳公用誠得之不啻拱璧余特識之如右云時𢎞治三年秋八月草五日也文華殿直之暇雲間張天駿前有子孫永保一印後有蒼巗子蕉林鑑定觀其大略三印押縫有墨林子項子京氏淨因菴項叔子諸印卷髙一尺四寸二分廣四尺四寸三分前隔水御題詩云淡沱蒼山蔚古枝惟應造物與為師何人著論名無李是處營丘放筆時御題上鈐幾暇鑑賞之璽乾隆宸翰二璽御筆題籖籖上有乾隆宸翰一璽宋李成小寒林圖一卷上等地二素絹本墨畫無款有宋徽宗籖題李成小寒林圖六字卷首有乾卦半璽又半印不可識前隔水押縫有蕉林居士一印後隔水有蕉林梁氏書畫之印觀其大略二印押縫有棠村蕉林書屋二印引首有棠村審定蒼巗子梁清標玉立氏印章二印卷髙一尺二寸四分廣二尺二寸五分引首御題小寒林三大字上有乾隆御筆一璽御筆題籖籖上有乾隆宸翰一璽宋祁序江山放牧圖一卷上等元一素絹本著色畫無款有宋徽宗籖題祁序江山放牧圖七字卷前有耿昭忠信公氏一字在良别號長白山長收藏書畫印記一印押縫有信公鑑定珍藏印一印又半印二漫漶不可識卷後有西蜀柳寅東鳯詹圖書一印押縫有半古軒書畫印一印又內殿珍玩一印又一印漫漶不可識前隔水又西蜀柳寅東鳯詹圖書一印後隔水有珍祕宜爾子孫二印拖尾有蕉林觀其大略二印卷髙一尺四寸七分廣三尺七寸三分宋李公麟君明臣良圖一卷上等黃一素箋本白描畫款云龍眠居士李公麟畫下有李龍眠記一印後有虞集題云漢業崇藩屏姬親重本支藉茅因割土剪葉總分圭衛叔空申誓荆元雅好詩只云聯萼秀豈若豫章竒瓜瓞綿何逺椒聊實在兹有蹄皆汗血無羽不長離公族誇隆準諸孫擅白眉銀潢雖九𣲖玉樹已千枝競采春華藻爭摛月露詞五車元半托二酉祕全窺帝賞東平頌人傳北海碑蕭郎能畫扇魏俗盛彈碁禮樂羣居講貂蟬對坐垂曳裾紛後乘飛蓋擁南皮處處開宮苑家家集履綦河間榻乍掃碣石騎先馳賦雪停蘭阪歌風侍雁池舞筵熏玳瑁藥碗進琉璃爭旦猿啼早鳴陰鶴和遲佳人工妙伎才子善微辭並以風流命俱將意氣推未忘耽弋獵寧止應塤箎車怠無安鞞途窮屢泣歧魯丘家不逺楚服世常疑欲識司空鍔來尋孺子祠龍沙驚谷貿滕閣愴星移幸努千秋力無煩十日期醒慙行處設書借枕中披旅食隨芳草鄉愁亂子規匡山雲樹近好與慰相思蜀郡虞集識前署頌君明臣良三十韻八字後有蕉林觀其大略二印卷髙一尺一寸八分廣一丈三尺五寸六分御筆題籖籖上有乾隆宸翰一璽按虞集題句醒慙行處設醒字應作醴字宋王詵漁村小雪圖一卷上等宇一素絹本墨畫無款前隔水有宋徽宗書王詵漁村小雪六字王字缺上鈐雙螭一璽缺其半卷尾有商邱宋犖審定真迹一印前隔水押縫有宣和一璽又一印漫漶不可識後隔水押縫有政和璽二宣和璽一拖尾有緯蕭草堂畫記一印又宋犖跋云昔人云書中唐模畫中北宋得之便足自豪駙馬都尉王晉卿北宋中巨擘也其遺迹最烜赫者為煙江疊嶂圖次之為瀛山圖陳眉公云煙江卷舊藏王元美家余曽見於萬卷樓下後轉質虞山嚴氏遂如泥牛下海董文敏云瀛山圖在嘉禾項氏惜不戒於火已歸天上余二十年前於棠村梁相國齋中見設色一幛相傳為晉卿筆恐尚未確都尉風流殆隨雲煙滅沒盡矣漁村小雪卷載宣和畫譜歷代藏弆御府鼎革時為滄州戴侍郎巗犖所得侍郎殁其後人求售輦下烏目山人王石谷購作枕中祕康熙庚辰正月山人來吳出以相誇為之叫絶按晉卿畫源本營邱此卷清蒼秀潤人物林木大類摩詰尺幅中具有雅人深致非范寬醉許可比瘦金題字宛然璽印纍纍誠希世之珍也夫漢碑在人世略可指數曹全碑晚出頓煥人耳目此卷得毋類是綿津山人宋犖題卷髙一尺三寸八分廣六尺九寸宋馬逺江山萬里圖上等宙一素絹本墨畫𨽻書款署河中馬逺卷前有傅臘藨印史鑑之章明古氏宋濂之印陳彥亷氏傅嘉薦印允公諸印卷後有燕山傅氏家藏史鑑之印史氏日鑑堂藏侍御吳思安家珍藏金華宋氏景濂筆硯精良人生一樂吳越王孫墨興諸印又二印不可識拖尾有子中父印梅軒二印又俞和題識云河中馬逺重毫素愛寫江山千萬里上有蓬萊五色雲下有仙家幾庭户清霜點作秋滿林咫尺瑶窗起煙霧蒼松吹動晚山橫雲峯矗矗猶堪數迢迢錦水泛雙鳬漠漠青天飛雪鷺人間畫手非不多誰似馬公得真趣千斤徑鐵筆力堅更有何人同出處老我披圖一愴然落日長歌漫為賦南渡畫家以馬逺為第一蓋其資稟敏拔筆力遒徑畫院中無能出其右者若此卷風骨挺挺如堅剛毅士人不敢犯者而其態度布置展閲真有萬里之趣因漫題短句以珍其重紫芝山人俞和識又宋濂跋云右宋馬逺所畫江山萬里圖蒼松竒石筆法神秀較之平時應制之作不啻天淵矣逺為光寧朝畫院待詔士人稱南渡畫院中之尤者曰劉李馬夏則逺居其三蓋以定年數之先後非以其畫之優劣也余得之於勝國瑩之吳氏真足稱繪林至寶矣金華宋濂題記時洪武庚戌孟秋十日又史鑑跋云此卷乃南渡後進呈之作也筆法遒徑思致老到圖江山雲物之變泉石竹木之竒曠達髙逺自元及明殆二百餘年不知幾經兵燹完好如初無纎毫遺缺舊藏之鴦湖朱氏朱氏蓄古書畫數十本獨於此卷為最每過齋頭得一展閲神情開爽佳氣襲人後朱氏變遷因遂歸余石田契友見過拂几開閲時帷秋暑覺涼風座隅石田精於六法元賞此為竒絶今古音人云李成馬逺之法著意臨摹遙隔千里信然後學史鑑謹識又沈周跋云畫之淵源法從荆關以下往往縱橫不一獨於馬逺遒逸秀拔髙出當世生平所見真迹約略數本此卷江山浩濶筆勢豪邁亦數本中之得意作也俞宋二公題語精確豫於史明古齋頭把玩復得借歸飽閲三日始知古人用筆各有精意所寄者顧陸之法莫謂後世無傳焉後學沈周謹識又沈荃跋云畫家有南北二宗南宗則王摩詰北宗則李思訓父子而馬逺其北宗俊嗣也此卷天真豪邁筆力蕭森真如岷江春水直下瞿塘俄頃之內一㵼萬里而重巒復嶂所在峭拔往往放意楮墨之外聚精毫芒之內想其盤礴時却有奏刀砉然揮斤成風之妙若使左思李白輩見之便當振袖濯流搔首大叫如置身其間也同時劉李馬夏先後齊名皆金題玉躞珍重尚方數百年來此卷嵬然獨存何異寶劍出匣古色照耀誠翰苑之異珍矣順治戊戌仲冬華亭沈荃漫識卷髙一尺二寸五分廣四丈四尺四寸五分引首御題江山萬里四大字前有德日新一璽後有乾隆宸翰陶冶性靈二璽御筆題籖籖上有乾隆宸翰一璽遼陳及之畫貞觀便橋會盟圖一卷上等洪一宋箋本白描畫款識云祐申仲春中浣富沙竹坡陳及之作上鈐竹坡及之戲作一印卷前有蒼巗子蕉林鑑定二印卷後有蕉林玉立氏圖書一印又一印漫漶不可識前隔水有蕉林書屋一印引首梁清標籖書陳及之便橋會盟圖八字拖尾有觀其大略蕉林收藏二印卷髙一尺一寸五分廣三丈一尺六寸八分元吳鎮夏山欲雨圖一卷上等荒一素絹本墨畫款識云夏山欲雨圖至正六年秋七月既望梅道人戲墨於西湖寓舍也下有嘉興吳鎮仲圭書畫記一印卷首有二泉郭畀天錫史氏日鑑堂藏王元美鑒賞諸印卷末有危素之印柯九思敬仲鄭元祐印鄭明德氏諸印拖尾俞和題識云梅菴點筆有神助開卷颯颯薰風涼巨然去後無何有屈指於今獨擅長仲圭品格髙絶有晉人風裁至於詩文繪理特其緒餘耳别來三載忽見畫卷不啻見仲圭也因題短句於左時至正丙申七月晦日紫芝山人俞和書後有柯九思敬仲二印又危素跋云吳梅菴吾之至友也有髙世之行書無不讀而繪事更精所謂魯之原憲晉之陶潛殆其儔乎豫固愛其書而更愛其人豫每有所請無不應之而悉佳妙就中畫卷種種入神即使王洽復起董巨再生亦何過焉書於卷後使梅菴見之必以豫為知言是嵗四月十有一日臨川危素又篆書記語元明善觀於此靜軒八字又邵寶跋云元季畫家不勝指屈而散漫四方唯江左為最若吳仲圭其一也仲圭居諸家之右獨得董家正傳至於竹石寫生又稱妙絶所謂淡而不厭簡而文仲圭有之矣此卷今屬吾友史明古所藏觀其畫想其人固可重而人尤足重後之覽者若止以畫視之其亦淺之乎知仲圭矣二泉邵寶又記語有松陵史氏家藏之寶八字卷髙一尺四寸七分廣一丈四尺一寸五分前隔水御題詩云夏山欲雨雲先凝暗靄乍失峰崚嶒幽人杖策獨歸去已濕緑荷衣上層我時望雨經春半披圖聊慰賦雲漢見説蛟龍筆底飛繪水有聲兹豈但叶起視空宇明星爛掩卷無言祗三嘆御題下有乾隆宸翰得句因新意二璽御筆題籖籖上有乾隆宸翰一璽元吳鎮清溪垂釣圖一卷上等荒二宋箋本墨畫款識云至正二年夏六月梅花道人戲墨後有梅花菴嘉興吳鎮仲圭書畫記二印卷前有子壽劉氏廷美金氏元玉韓士能印張則之黃姬水印諸印卷後有青松白玉王履吉印于思緝印楊氏家藏諸印拖尾有金氏元玉黃姬水印韓士能印三印又王士熙題云蒹葭渺無際逺水接平川間雲曳歸鳥影落鏡中天若人載書畫倣佛米家船遵彼灌木隂對此佳山前誰能結鷗社忘機終淡然至正三年秋七月題擁翠山人王士熙又王紱題云春雲作隂知幾日春雨連朝疏更密浦樹含滋山氣昏杜若生香溪水溢霏微潤物聽無聲霡霂如膏似有情多處人家踰冷節幾村榆栁變清明山塘路轉林亭側賈舶漁艖盡停息鵓鳩聲歇鷓鴣啼滑滑深泥行不得東山癡客興尤佳冒雨從容立水涯短屐緣溪粘碧蘚飛蓋張油映緑槐浮漚滿汀波不起喚得渡邉舟欲艤應過隔岸野人家相約晴來看桃李聞説髙人住處清九峯三泖在簷楹還憶東郊勸農日時將蓑笠餉春耕九龍山人王紱又于思緝題云江雲漠漠曉寒生出户行吟傍水行沙鳥底緣棲不定背人飛過栁邉鳴黃葉西風古屋秋霅溪南去記曽遊年來為減尋詩興常對青山懶下樓洪武十年秋九月錢塘于思緝又董其昌跋云元時梅花道人與盛子昭俱工畫望衡對宇求子昭繪者屨相接梅花道人之居閴如也子弟以為言梅花道人曰待之二十年及二十年盛氏之門亦閴如而梅花之名始振至今稱四大家此卷乃其得意時筆蒼徑有董巨遺意昔沈啓南先生云梅花菴裏客端的是吾師信然丙寅夏五董其昌識卷髙一尺五寸八分廣一丈三尺前隔水御題云一江春水如油緑滿目春山看不足春水春山共我三南華二篇不須讀渟淵清泚猶堪掬聊把絲竿寄幽獨扁舟不繫任去來誰與為羣鷗鷺鶩頗知水清本無魚亦令人識求緣木乾隆庚申中秋後一日御題下有稽古右文之璽乾隆宸翰二璽御筆題籖籖上有乾隆宸翰一璽元盛懋畫烈婦刺虎圖一卷上等日一素絹本著色畫款識云至正七年錢塘盛懋畫烈婦刺虎圖下有子昭一印卷前有延陵吳氏家藏莊氏珍藏淡菴鑑賞徐氏元玉諸印卷末有延陵吳氏家藏宋克二印拖尾錢鼒題云客車何焞焞夫挽婦為推問君將安去言往耒陽戍官車有程宿車下夜半可憐逢猛虎夫命懸虎口婦怒髮指天十步之內血相濺夫難再得虎可前寧與夫死毋與虎生呼兒取刀力與爭虎死夫活心始平男兒節義有如此萬嵗千秋可以奉明主馮婦卞莊安足數彭城錢鼒書前署烈婦行三字有延陵吳氏珍藏一印又宋廣跋云盛子昭作畫大率工緻細密而此烈婦圖尤其合作者越中少年不勝家雞之賤余得其片楮未嘗不磅礴竟日也具眼者宜珍重之桐柏山人宋廣題於維揚舟次卷髙七寸九分廣二尺七寸八分明沈周寫生一卷上等月一素箋本墨畫凡二十四段第一段牡丹題云不須千萬朵一柄足春風第二段梔子題云花如白玉刻香過紫沉清第三段芙蓉題云不得春風力何曾怨後開第四段山茶題云一紅深雪裏補淡與梅花第五段石榴題云看他開口處笑落盡珠璣第六段枇杷題云從來金剋木何事壓枝黃第七段柿題云蜜漿包火齊思煞渴文園第八段蓮藕題云碧房藏玉蛹瓊腕雪冰絲第九段瓜題云遺種蔓天下無人念故侯第十段紫茄題云紫包初摘露僧吻欲流泉第十一段萊蔔題云拔出金城玉凝酥帶土膏第十二段水晶蔥題云叢藂翡翠葉濯濯水晶根第十三段新筍題云錦綳初茁雨頭角已崢嶸第十四段山藥題云托根知紫塞拔地出金莖第十五段菱角題云刺波雙角鋭剝玉一鈎涼第十六段茭白題云新臺一尺玉風味説吳鄉第十七段王瓜題云四月南風裏髙棚摘墮瓊第十八段蕓薹菜題云老夫諳至味絶勝爛蒸羊第十九段鴝鵒題云本是髙飛物多言每受籠第二十段雙鳩題云恩情薄離合夫婦雨晴中第二十一段蠟嘴題云嘴痕黃可愛猶帶蜜脾香第二十二段雞題云曙光三唱裏心事五更人第二十三段鴨題云甫里舊遊地碧闌煙水東第二十四段題云世人空碌碌無人知卯君每段題句下俱有啓南一印又自跋云凡花者葉者果者蓏者飛者走者舉囿於化工非人力所能效矣可學王君強余筆墨以置其像其説猶捕風捉影余何能哉余與可學交二十餘年各及老日而再見於今兹情有不可拒故強其所不能也𢎞治甲寅嵗沈周跋後有沈啓南氏白石翁二印前有煮石亭一印卷髙一尺三分廣三丈六尺一寸三分引首御題筆參造化四大字款署乾隆御筆上有乾隆御筆一璽御筆題籖籖上有乾隆宸翰一璽明沈周寫生花鳥一卷上等月二素箋本墨畫凡十三則款識云𢎞治庚申十月戲寫於有竹莊長洲沈周下有石田沈氏啓南二印卷前有明古珍藏子孫保之二印卷後有秋水閣錢氏珍藏一印拖尾董其昌跋云沈啓南徵君寫生為一時之冠陳白陽王酉室諸公瞪乎其後矣此數種尤有生意不可不寶其昌識卷髙一尺三寸六分廣一丈一尺九分御筆題籖籖上有乾隆宸翰一璽眀項聖謨後招隱圖一卷上等盈一素絹本著色畫卷末款云項聖謨製卷首𨽻書署後招隱圖四字卷髙一尺一分廣二丈四尺一寸石渠寶笈卷二十四
