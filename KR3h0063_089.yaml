front:
  text: 欽定四庫全書石渠寶笈卷四十三
  hash: sha256:0e2bcc86a0568ba49d4ed1f2992d2cac8d8dea55279be6a94b43098f1c1f2ccb
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_089-1a, image: WYG0825/WYG0825-0610c.png}
body:
  text: 貯長春書屋列朝人書冊上等眀董其昌雜書一冊上等素箋本行書計七幅第一段臨吳琚跋云吳琚書自米南宫外一步不窺京口北固山有天下第一江山榜書即其筆也始于都下見七言絶一幅不款名姓但有雲壑居士印偶閲宋經籍志雲壑集吳琚撰則知為琚書已于新安白嶽山客持晦翁書歸去來辭乃絶似米元章後有雲壑二字因得審定今藏于家此詩沒于焦山江中潤州守霍君為余拓墨本然已在若明若晦間不可臨摹矣辛亥四月草六日董其昌識下有昌字一印第二段書蜀四賢詠款署季秋朔日書其昌下有董其昌一印第三段書洞庭詞第四段書春景詞後識云學李北海書五十五年矣初時専習頗為近之近復忘其舊學然時一擬書亦不落吳興後也其昌下有董其昌印一印冊髙八寸廣四寸八分冊尾御跋云董文敏自謂作書不使一實筆今觀此冊轉掣停頓腕有萬鈞力蓋運實于虛要在無所結滯耳乾隆丙寅春正御題下有所寶惟賢乾隆御筆二璽引首御書羣鴻戲海四大字前有乾隆御筆一璽後有㑹心不逺乾隆御賞之寶二璽御筆題籖籖上有乾隆宸翰二璽畫卷上等元錢選觀鵝圗一卷上等素箋本青緑畫款題云修竹林間爽致多閒亭坦腹意如何為書道德遺方士留得風流一愛鵝吳興錢選舜舉前有永年子孫保之伯駿吳楨周生珍祕宜爾子孫諸印又重貴書畫印珍藏半印三又半印不可識後有真玩字㑹侯嘉祚印公信公珍賞張伯駿範我氏清玩書畫之印宜爾子孫㑹侯珍藏湛思記耿會侯鑑定書畫之章賀仲來鑑定珍藏新宇圗書諸印又二印糢糊不可辨又一印存翰墨流三字又潄六半古軒半印二又半印二不可識又引首前有㑹侯珍藏一印又私印半印一又半印不可識後有湛思記一印卷髙七寸二分廣二尺八寸五分卷中御筆題蒼字上鈐稽古右文之璽前隔水御題用錢選元韻云誓墓髙風有足多獨推書聖却云何行雲流水參神韻筆陳傳來祇白鵝御題上鈐乾隆御筆一璽拖尾臣梁詩正等識云乾隆丙寅人日敕示內廷諸臣同觀並題句梁詩正和韻云髙閣虛憑春水多黃庭書罷更亡何他年待化沖霄鶴此日閒看泛渚鵝臣梁詩正又汪由敦和韻云修竹清流野趣多虛亭逰目興云何底須曇􅙓村邊過籠取沙頭似酒鵝臣汪由敦又勵宗萬和韻云竹林池館晚涼多內景書成興若何樂意相關憑靜對換經鵝是聽經鵝臣勵宗萬又張若靄和韻云家雞遺與後人多昨夜大醉真如何老媪不知書法重却將恭敬一烹鵝臣張若靄又裘曰修和韻云題扇橋邊往蹟多空亭小立又如何偶然逰戲成佳話不必虛傳化鶴鵝臣裘曰修又陳邦彥和韻云蘭亭三昧㑹心多草閣臨池得幾何叉股沙痕神妙處家雞野鶩本籠鵝臣陳邦彥又董邦達和韻云竹裏空亭碧蔭多閒􅐼弄筆意如何烏絲寫就擕籠去從此爭談墨沼鵝臣董邦達引首御書山陰逸興四大字上鈐乾隆御筆一璽御筆題籖籖上有神品御賞二璽眀唐寅山居圗一卷上等素箋本著色畫幅中款題云霜前柿葉一林紅樹裏溪流極望空此景憑誰擬何處金昌亭下暮煙中下有六如居士一印幅後又題云隱居深在碧山空澗壑才堪側步通芋栗一園秋計足僮奴百指治生同短牆甃石牢牽荔薄酒盈罈共轉筒我欲相隨卜居去此身一脫世塵紅下有唐寅私印一印前有世寶一印押縫有陳定平生真賞一印後隔水有武清李氏寶德堂賞鑒圗書一印又陳定跋云子畏先生一代竒才而遭讒被放不見用于當世乃托興翰墨以抒其胸中之磊磊者故命筆輒竒曠超軼非凡史可及若此卷是也世傳先生蹟有斤斤繩尺者皆非捉刀人本色鑒賞者當具隻眼始得潁川陳定敬跋卷髙八寸五分廣一丈三尺二寸八分卷中御題云幽人結茒處愛在山水間片雲出岫白亂葉當秋殷或望太白瀑或放顛翁船源中爼豆古池上雞犬閒三復仲長論快哉白駒篇御題下有乾隆宸翰幾暇臨池二璽拖尾臣梁詩正等識云乾隆丙寅春正月敕內廷諸臣同觀並題句臣梁詩正題云鯉魚風過鷗波碧三兩漁人話秋色菰蒲聲響雨欲來萬笏山頭數㸃墨季鷹歸舟趁落潮離離帆影移楓橋吳歌喚醒蓴鱸夢煙舍青帘隔岸招臣梁詩正又汪由敦題云騷客多秋懷幽居市塵屏孤雲淡逺天空曠心自領縱棹將何之楓落吳江冷臣汪由敦又勵宗萬題云幽居無别事隨意作秋山波逺歸舟小天空去鳥閒半林風颯㳫一澗石孱顔軒牖延西爽飛來襟袖間臣勵宗萬又張若靄題云記取支笻訪劒池楓林颯颯動秋姿東塘潮退寒煙暝載酒扁舟栁繫之耳根清淨千尺雪眼界髙寬萬笏雲子美詩成月亭午此景未許他人分臣張若靄又裘曰修題云乍可浮家泛宅兼之鋤雨耕煙應是白蘋洲上居然黃葉村邊鹿門有客招隱蓮社無心結緣山寺鐘來夜半一塵不到翛然六言二截句臣裘曰修敬題又陳邦彥題云秋日淡林麓煙中鳥下稀臨流望田舍隔樹插荆扉澗曲樵歌逺山多竹徑微閶門城似畫沽酒放船歸臣陳邦彥敬題又董邦達題云幽人卜築處當此青山隈老屋何年葺名花自手栽隨嵐雲色換狎浪釣船回逺市秋煙起樵歌向晚來臣董邦達敬題引首御題金昌秋色四大字乾隆御筆上鈐乾隆御筆一璽前有觀書為樂一璽御筆題籖籖上有天府珍藏幾暇臨池二璽眀文徴明溫蘭圗一卷上等素箋本墨畫欵題云草堂安得有琳琅傍案傍小書間字漪蘭奕葉光千里故人勞解佩一􅖠幽意自生香夢回涼月甌江逺思入秋風楚畹長漸久不聞餘馥在始知身境兩相忘近承友人寄贈溫蘭秋來著花甚盛因作此詩謝之張辨之適以蘭卷相示既為補空就録此詩其上文璧下有衡山文徴眀印二印卷前有墨林子京項元汴印子京父印卧翁之赤項墨林父祕笈之印諸印又裏人家半印一後有成雲閣藏髙宜齊印寄傲子京墨林生六藝之圃卧菴諸印又香巖鴛鴦長字半印三拖尾都穆跋云近世畫蘭者多拘拘于形似殊乏天然蕭散之趣徴明此幅雖草草若不經意而天趣溢目知非俗工所能到也丁卯蠟月草有四日前進士吳都穆𤣥敬父又祝允眀題云湘波平楚岫青美人羅袂障風橫光風綰作騷人佩還帶三閭一卷經右題辨之所藏衡山畫蘭允眀又跋云蘭不與衆草為伍君子以之寂寥幽谷知己何人祇自芳而已爾尚暇求于所謂故舊者哉因覽此卷感交逰之涼薄漫為辨之書之南峯山人未署姓名又陳淳跋云秋日辨之㩦此卷索余畫既展卷見吾文師墨戲不敢援筆敬書數語歸之丁卯陳淳謹識又黃雲題云一回展卷懷千古無數青峯近可招旅雁北征雲慘淡漁舟南下水迢遙蒼梧帝子魂應斷空谷佳人恨未消憔悴誰知吟澤畔欲傾緑醑慰無聊黃雲又顧璘跋云蘭香草也騷人亟稱其幽獨離塵以況君子之操取其類也聞楚江湘谷之間固多佳種行將采之以遺辨之幸謝衡山更當傳神一番耳癸酉九月赴官湘源書于平望舟次東橋顧璘又徐霖跋云秋日觀徴眀墨戲于清樾亭上喜其絶無塵筆與吾意境若冥合也徐霖又陳沂題云别來芳跡杳難尋千里相思契結深漢館月眀幽客夢楚江秋盡美人心含風嫋嫋香生佩隔水悠悠思入琴百卉無情自春緑不堪于此易沾巾余嘗題文衡山墨蘭寄友人今為辨之録此時癸酉歲九月十八日在松陵舟中書湖光月色相映且與衡山方别其情不言可知也鄞陳沂又盧襄題云幽貞不自媚空谷遺芳馨端居念離索對此真忘形文衡山作墨蘭再贈辨之辨之可謂知所親與者矣展卷漫題甲戌春日石湖盧襄諸跋前有白巖欲作片時圗畫中人橫鶚樓印都元敬氏髙擇木印月潭朱之赤印退密墨林祕玩項墨林鑑賞章三韓髙宜齊珍藏印諸印又硯癖半印一跋中有平生真賞項子京家珍藏二印跋後有項元汴印項墨林父祕笈之印子子孫孫保之聽雨堂印第一希有朱之赤鑑賞卧菴所藏諸印又蘧廬子京半印二押縫有若水軒煮茶亭長墨林子寄傲桃花源裏人家墨林主人田疇耕耨西楚王孫墨林私印虛朗齊諸印後餘幅有留耕堂月潭朱之赤印江東方外士卧菴老人靜虛齊圗書印諸印又有休寧朱之赤珍藏圗書朱卧菴收藏印二印卷髙八寸三分廣二尺八寸卷中御題熊字上鈐幾暇鑑賞之璽一璽前隔水御題云寫花生動葉倉琅叢下仙男抱夜光楚畹風清佩無斁藍田日暖玉生香逐炎漫誚隨伊去引興應知為爾長珍重停雲館裡客本無身境可相忘御題下有乾隆宸翰幾暇臨池二璽餘幅梁詩正題云别種移楚畹芽茁甌江晚離披巖嶠中生香發婉娩空谷誰傳姿妙筆圗墨本亂葉叢以長幽花偏其反安得紉為佩緬懷君子逺臣梁詩正敬題又汪由敦題云閩天鬱炎風秋澤荒宿莽猗猗谷中蘭寧辭衆草伍千里結同心故人渺何許殷勤玉罄翁自寫國香譜橫斜風葉交一一折叉股緬思問絹年清芬足千古待詔父林曽臣為溫州太守汪由敦敬題又勵宗萬題云空谷無言水一方煙橫南浦宛相望雨飄别緒來甌嶠風送閒情到楚湘騷客臨階思結佩幽人入室恍聞香淡描九畹春如許待詔風流老擅場臣勵宗萬敬題又張若靄題云交柯亂葉動無數一一皆可尋其源坡詩移贈待詔筆臣也斂袵無間言安得祕瓷作清供斗室光明清且溫所南畫蘭露斧匠痕然命筆清超絶塵土氣生世外想繪苑珍重後無匹者徴明山水步越一時間亦寫生神入北宋此老能事如如來夜光可傾出一栲栳也臣張若靄敬觀神品並題識又裘曰修題云乍含幽露乍披風整整斜斜寫未工春色一䦨才到眼故人千里許分叢香生空谷迢迢發夢轉清江灔灔通自信素心堪折贈不須評入楚騷中臣裘曰修敬題又陳邦彥題云王者香原比君子甌閩種合寫沅湘一經玉管重題品墨汴花痕態並芳臣陳邦彥敬題又董邦達題云八閩分異種九畹發幽姿自許髙人品誰當楚客思紛披香可纈疏淡佩相宜貌取溪藤上如逢裛露時臣董邦達敬題引首御書紉佩餘芬四大字上鈐乾隆御筆一璽御筆題籖籖上有神品乾隆御賞幾暇怡情三璽貯隨安堂列朝人書冊上等眀董其昌書杜詩一冊上等素箋本計十幅行楷書録杜甫秋興八首之五款署董其昌書下有宗伯學士董氏𤣥宰二印冊髙七寸廣三寸二分御筆題籖籖上有幾暇怡情乾隆宸翰二璽畫卷上等宋趙幹江行初雪圗一卷上等素絹本淡著色畫款署云江行初雪畫苑學生趙幹狀卷中有神品上三字前有半印一存圗書二字又半印存司印二字又半印漫漶不可識卷中有天厯之寶一璽後有柯九思印一印前隔水有蕉林鑑定一印押縫有祕府明昌寶玩二印後隔水有吳瑞徴印吳仲庚二印押縫有御府寶繪內殿珍玩羣玉中祕三璽前隔水標題趙幹江行初雪圗七字拖尾記云天厯二年十一月日進入奎章閣學士院典籖臣張景先奎章閣學士院參書文林郎臣柯九思奎章閣學士院參書奉訓大夫臣雅琥奎章閣供奉學士承德郎臣李訥奎章閣供奉學士中議大夫臣沙刺班奎章閣承制學士奉訓大夫臣李泂奎章閣承制學士朝散大夫中書左司郎中臣朵來奎章閣侍書學士翰林直學士中奉大夫知制誥同修國史兼經筵官臣虞集奎章閣侍書學士資善大夫中書右丞臣撒迪奎章閣大學士光祿大夫中章平章政事知經筵事臣趙世延奎章閣大學士光祿大夫知經筵事臣忽都魯都兒迷失前有明昌御覽一璽又蒼巖子蕉林鑑定二印押縫有冶溪漁隱吳瑞徴印二印後有蕉林梁氏書畫之印家在北澶二印卷髙八寸二分廣一丈六寸五分前隔水御題云吳頭楚尾滄江清元冥試令飛初霙驢背客寒風打笠江心漁樂舟衝凌蘆腰已折鬚添白山頭乍失髻矗青或見沙觜翁舉網尚有船唇兒弄罾夫豈皸瘃之不懼衣食切已勞經營氷魚凍蟹入盤活誰家羊膏佐軟烹造物不齊有如此對之令人感慨增瑶機錦綍識異物傳來北宋騰清聲奎章學士丹邱生一時法眼精品評燭照意移生栗烈畫時不知呵凍幾度方能成乾隆御題下有幾暇怡情乾隆宸翰二璽前有􅊹觀一璽御筆題籖籖上有神品乾隆宸翰二璽宋馬和之豳風七篇一卷上等素絹本著色畫第一段七月第二段鴟梟第三段東山第四段伐柯第五段九罭第六段狼跋每段前書詩小序及詩經本文卷末有豳風七篇四字卷前有項篤夀印項子長父鑑定二印卷後有蕉林梁氏書畫之印項篤夀印少溪主人項竤之印項德芳印五一倩士宛秀堂印檇李懶道人賞鑑圗書吕中諸印前隔水押縫有蕉林書屋一印後隔水押縫有棠村蕉林居士二印拖尾押縫有冶溪漁隱一印卷髙八寸一分廣一丈七尺五寸引首御書葦籥餘風四大字後署乾隆御筆下有乾隆宸翰勤學好問二璽前有含味經籍一璽御筆題籖籖上有御賞乾隆宸翰二璽按豳風七篇破斧一篇今闕明陸治丹楓秋色一卷上等素箋本著色畫欵題云雲間遙島三山出籟起寒空兩岸聞落盡丹楓秋鏡濶野鷗飛㸃亂沙文陸治下有叔平連印一卷髙八寸廣一尺九寸御筆題籖籖上有乾隆宸翰一璽貯攸芋齊列朝人書冊上等明董其昌仿顔真卿告身一冊上等髙麗箋本計八幅楷書自識云魯公自書告身米元章家藏墨蹟所列今在吳門韓宗伯館師家米評顔楷為後世挑剔惡扎之祖獨于此語寶愛不置大都英雄欺人身所不習即加詆毁不可信為篤論也歲在庚午八月十二日臨并題思翁時年七十六冊髙六寸七分廣三寸六分冊尾御跋云香光臨古人書别具神解不以形似為工老米幼學顔行何乃忽持異議駁之良當御題下有乾隆宸翰幾暇臨池二璽御筆題籖籖上有乾隆宸翰一璽畫卷上等宋王詵瀛海圗一卷上等素絹本著色畫款署云保寧賜第王晉卿瀛山既覺因圗夢中所見甲辰春四月夢逰者卷前有蕉林書屋梁清標印河北棠村三印又篤夀半印二又二印不可辨卷後有蘭石半印押縫有秋碧冶溪漁隱二印又長字半印前隔水有蕉林梁氏書畫之印檇李李氏鶴夢軒珍藏記嘉禾李氏珍藏諸印又宋王晉卿瀛海圗標籖七字拖尾田亘題識云他日緘幐屬貴遊詎知遷徙過南州天涯與汝共淪落淚濕湓江煙雨秋王晉卿圗瀛山筆畫精緻京師貴遊蓄之為希代之寶貨圗書棄擲于路陽翟張飛卿見而得之過九江以遺友人傅延之延之出以示余余悲而賦詩建炎初元九月草八日陽翟田亘元邈又陳章跋云蓬島圗本張飛卿所寶後以遺傅延之紹興七年飛卿之弟共甫與延之及章皆㑹集于南昌逰從之樂殆無虛日是歲中秋同賞月共甫之舍章亦預焉延之出此以示衆客既而謂共甫曰此公家舊物也遂歸共甫願寶惜之次年冬至後二日共甫持節湖湘道由清江章適寓是郡因得再觀痛延之下世已一年矣相與慨歎云嵩山陳章漢卿書後有篤夀遼西郡圗書印灤陽灤陽趙氏灤陽趙忠愍公家曾收諸印又袁立儒云珍木文禽王佩環清都絳闕色蘭玕香山居士蓬萊院借與王郎夢裏看建人袁立儒題駙馬都尉所作夢逰瀛山圗又董其跋云云王晉卿瀛海圗載宣和畫譜有宋人題跋米元章所謂青緑設色類補陀巖用李將軍海岸圗法髙出趙大年伯駒之上良由與蘇米山谷輩為友自然脫去畫史習氣董其昌題後有真賞齊懋和吳時芳印雲煙過眼蘭石主人項子長父鑒定灤陽灤陽趙氏灤陽趙忠愍家家曾收蕉林鑒定忠愍伯子諸印又胡世安跋云向見摩詰著色山水小大逺近似銖衡寸度而成生趣浮動又超界畫一等今觀此圗正堪伯仲信古人遊藝一端皆以全副精神辦之秀巖老史胡世安題後有蕉林祕玩觀其大略子孫世保梁雍之印諸印跋中押縫有秋碧印五卷髙七寸七分廣四丈五寸卷中御題云海上三山逺隔塵雲屏霧嶂玉嶙峋底緣紛見拏舟侣想共君房採藥人都尉由來閥閲家詩情畫意足煙霞飽參玉局心如月逺謝安期棗似瓜漫云海水變桑田一例鷗汀鶴嶼邊歷歷肄農還學圃但心閒者合成仙乾隆丁卯夏日御題引首有奉三無私一璽後有幾暇怡情乾隆宸翰二璽前隔水御書縹眇塵外自成一家八字下署乾隆御題下有乾隆宸翰一璽卷尾沈德潜奉敕題云玉室金堂有路通樓船難任片帆風細摹小李將軍筆縹眇三壺一望中晉卿位望本豪華寫出蓬瀛海外家舊與蘇仙同討論故應骨髓入煙霞寶笈收藏重鼎彛當年偶屬傅延之從知天筆標題者曾遇湓江灑淚時臣沈德潜敬題御筆題籖籖上有天府珍藏乾隆宸翰二璽宋李唐清溪漁隱圗一卷上等素絹本墨畫款署河陽李唐筆卷中標李唐清溪漁隱六字上鈐御書之印一璽卷前有子京元汴之印墨林祕玩平生真賞項子京家珍藏神品蒼巖棠村審定諸印又半印一不可辨卷後有神品項元汴印子京珍藏項墨林父祕笈之印諸印又紹興半聫印又一印漫漶不可識前隔水有退密墨林祕玩項子京家珍藏三印押縫有墨林子京珍祕桃花源裏人家項墨林印諸印後隔水有和齊甘氏家藏丹陽開國三印押縫有子京神逰心賞墨林山人寄傲蘧廬墨林項伯子章文夀承氏諸印拖尾跋云李唐河陽人亂離後至武林年已八十光堯喜其山水至今人稱之夀樂主人多寓日下不惜金富得中貴甘氏所藏聚而復失今歸于此嘉熙丁酉孟冬旦書又趙子固題云李唐老人精天機筆墨簡古世所稀石林沙嶼布逺近野橋雲碓相因依漁舟穩泊蘆花渚一竿低拂珊瑚樹心與江鷗一樣閒不著羊求弔名譽君不見侯門子弟悅清玩湘奩犀軸光凌亂何由同載米家船應有長虹夜相貫大德五年吳興趙子固奉題跋前有棠村蕉林居士文彭之印三橋居士天籟閣考古正今子京珍祕項墨林鑑賞法書名畫諸印跋中有葉蕃米氏家藏書畫于子孫孫永保用享二印又一印不可識又子京項叔子項墨林鑑賞章檇李項氏世家寶玩乾坤浩氣子孫永保墨林祕玩神逰心賞虛朗齊項墨林父祕笈之印琴書清暇蒼巖子梁清標玉立氏印章觀其大略諸印跋中押縫有桃里若水軒項子京家珍藏引首有王顯之篆書清溪漁隱四大字欵署顯之書前有天籟閣項元汴印項墨林印三印後有項元汴印逰方之外二印卷髙七寸九分廣四尺五寸御筆題籖籖上有御賞乾隆宸翰二璽元王冕吳鎮梅竹雙清圗一卷上等素箋本墨畫前段王冕畫梅自題云朔風撼破處士廬凍雲隔月天糢糊無名草木混色界廣平心事今何如梅花荒涼似無主好春不到江南土羅浮山下蘼蕪煙瑪瑙坡前荆棘雨相逢可惜年少多競賞桃杏誇豪奢老夫欲語不忍語對梅獨坐長咨嗟昨夜天寒孤月黑蘆葉卷風吹不得髑髏夢老皮蒙茸黃沙萬里無顔色老夫瀟灑歸巖阿自鉏白雪栽梅花興酣拍手長嘯歌不問世上官如麻後有竹齊圗書㑹稽外史二印又題云君不見漢家功臣上麒麟氣貌豈是尋常人又不見唐家諸將圗凌煙長劍大羽聮貂蟬龍章終非塵俗狀虎頭乃是封侯相我生山野無能為學劒學書空放蕩老來晦迹巖穴居夢寐未形安可模昨日冷飈動髭鬚拄杖下山聞鷓鴣烏巾半岸衣露肘忘機忽落丹青手器識可同莘野夫孤髙差擬磻溪叟山翁野老爭道真松篁節􅋵梅精神吟風笑月意自在只缺鹿豕來相親江北江南競傳寫祝君歎其才盡下我來對面不識我何者是真何者假祝君放筆一大笑不須攬鏡亦自了相攜且買數斗酒坐對青山自傾倒明朝酒醒呼鶴歸白雲滿地芝草肥玉簫吹來雨霏霏琪華亂颭春風衣祝君許我老更竒我老自覺頭垂絲時與不時何以為時與不時何以為贈君白雪梅花枝下有王元章文王孫二印前有右前司馬一印卷前有長字式古堂書畫印子孫保之三印又鼎元聮印一又半印不可識後有仙客卞令之鑒定乾坤清賞三印又半印二不可識卷髙七寸廣二尺五寸三分後段吳鎮畫竹題識云圗畫書之緒豪素寄所適垂垂歲月久殘斷爭寶惜始由筆硯成漸次忘筆墨心手兩相忘融化同造物軒􅖠雲靄溶屏障石突兀林麓繆槎牙禽鳥翥翰翮可憐俗澆漓摸摹竟紛出裝褫雜真贋丹粉誇絢赫千金易弊帚十襲寶燕石米也百世士賞㑹神所識伶倫世無有寄響竟寥寂良藥難再遇抱懷長太息左圗右書取其怡悅瞻視陶寫情性近好事者以為市道商賈真贋為事反害性情盲目聾耳哀哉至正甲申梅花道人戲墨而書下有梅花菴嘉興吳鎮仲圭書畫記二印前有曽光題云梅花道者列仙流落筆全無李薊邱呼酒南湖夜燒燭一枝涼雨寫新秋曾光卷前有仙客卞令之鑒定二印又鼎元聨印一又仲氏元言鑒定圗章半印二卷中有乾坤清賞嚼菜根道人二印押縫有雙螭一印合同式古堂各二印卷後有卞永譽印令之式古堂書畫三印又半印二不可識卷髙七寸廣二尺七寸八分拖尾周鼎跋云王山農之寫梅自出新意梅花菴之寫竹自得真趣皆入妙品具二妙于一卷中又各有長詩皆自寫其情于畫意之外可觀也竹上曾德用一絶句梅之前一七言古詩不名而尤可觀前輩但落筆便自不凡近時沈民侍讀隸書梅竹雙清四字亦不俗今此卷藏闤闠坊栁子學所又可謂具四美矣乙巳三月丙午與黃日升王惟安惟顒同觀嘉禾周鼎時年八十又五前有半印二不可識後有令之式古堂書畫東吳文學世家三印又王世貞題識云野夫策杖村南復村北處處東君吝消息瞥然縞素一枝橫又見琳琅數竿碧一枝春之先數竿冬之後俯仰天地間與爾成三友衡門掩卧不一旬淇園大庾無精神樵青已侵翠鳯毛颶母吹散玉龍鱗賴得吳鎮及王冕前與二友傳其真虛堂展看僅盈尺二友居然侍吾側問之不言對以臆眉宇蕭蕭吐佳色吾不能學范詹事西遣關中使却寄江南春消芳悴粉何足論吾不能學家騎曹不可一日無所至植此君封籬護籜何紛紜二友寓我麓儼若洛下東西兩頭屋一頭剪得瀟湘雲一頭小貯羅浮玉鎮也九咽吞吐天漿腴冕亦磊砢節目非凡夫扶輿清氣合此圗快矣乎快矣乎此圗此友吾不孤梅獨為百花魁而竹能離卉木而别自成髙品者以其精得天地間一種清真氣故也竹自文湖州蘇端眀後有梅道人吳仲圭以至近代王孟瑞而梅則楊補之外獨推山農王元章然吳子輩謂其命旨涉淺為境易窮而往往下其品幾于無處生活今年六月信陽王太史祖嫡以元章梅仲圭竹合一卷寄余開卷時令人鼻端拂拂有玉清蓬萊想遂乞仲承諸君為詩歌美之而余繼焉或謂戴凱之范至能所撰二譜至數百千種且以大庾萬樹渭濵千畝而此寥寥一枝胡取也是不然正復以簡貴勝耳卷首為沈民則學士題元章仲圭各有詩辨尾而梅前有一歌亦自豪粗周疑舫伯器跋苐賞其語不能辨其人考印章有所謂㑹稽外史似楊維楨而詞氣亦類之苐不聞其别號竹齊闕疑可也卷後收藏有東吳文學世家印豈故為吳中物太史偶得之耶似有不偶者故附記于後己卯王世貞識後有令之仙客卞令之鑒定三印跋中押縫有式古堂一印引首有沈民則隸書梅竹雙清四大字欵署自樂後有雙螭半印御筆題籖籖上有御賞乾隆宸翰二璽按王冕畫梅前七言古詩二首均未署款後詩有王元章圗章可據前詩并無姓氏印章然細閲其詩格筆跡實出一手為王冕自題無疑而周鼎王世貞二跋中一以為不名一疑為楊維楨所作皆誤石渠寶笈卷四十三
