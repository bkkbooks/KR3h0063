body:
  text: 一貯重華宫二列朝人書畫書冊上等宋四家集冊宋元寶翰元人法書元趙孟頫集冊元趙孟頫書説補標題元趙孟頫書急就章元鮮于樞行草書元俞和急就章釋文明人翰墨明祝允明書劉基詩明文董畫扇集冊書冊次等宋米芾寶章待訪録厯朝名家集冊明王寵書遊包山詩明陸一岳諸體篆書明董其昌臨褚遂良蘭亭敘明人便面無名氏書畫目録書冊上等明人書治平金鑑國朝人書畫目録書冊上等張照書九符張照書九符張照臨董其昌書書冊次等沈荃自書雜詩沈荃倣古二十則王圖炳書合錦勵宗萬書九符
