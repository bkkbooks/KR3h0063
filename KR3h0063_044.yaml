body:
  text: 一貯重華宫二列朝人書畫書册上等宋四家集册宋元寶翰元人法書元趙孟俯集册元趙孟俯書説補標題元趙孟俯書急就章元鮮于樞行草書元俞和急就章釋文明人翰墨明祝允明書劉基詩明文董畫扇集册書册次等宋米芾寶章待訪録厯朝名家集册明王寵書遊包山詩明陸一嶽諸體篆書明董其昌臨褚遂良蘭亭敘明人便面無名氏書畫目録書册上等明人書治平金鑑國朝人書畫目録書册上等張照書九符張照書九符張照臨董其昌書書册次等沈荃自書雜詩沈荃倣古二十則王圖炳書合錦勵宗萬書九符
