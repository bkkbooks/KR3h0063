body:
  text: 貯重華宫一宸翰書畫合冊御筆詩經全圗書畫合璧三十冊宣德箋本墨畫全經三百五篇竝御製補笙詩六篇凡三百一十一篇篇為一幅對幅各體書本詩每冊前一幅金粟箋本大書署篇目第一冊周南十一篇末幅款識云乾隆己未暮春月御筆第二冊召南十四篇末幅款識云乾隆己未夏五御筆第三冊邶風十九篇末幅款識云乾隆己未秋八月御筆第四冊鄘風十篇末幅款識云乾隆己未冬十月御筆第五冊衛風十篇末幅款識云乾隆己未季冬月御筆第六冊王風十篇末幅款識云乾隆庚申春二月御筆第七冊鄭風二十一篇末幅款識云乾隆庚申孟夏御筆第八冊齊風十一篇末幅款識云乾隆庚申孟秋御筆第九冊魏風七篇末幅款識云乾隆庚申九秋御筆第十冊唐風十二篇末幅款識云乾隆庚申仲冬御筆第十一冊秦風十篇末幅款識云乾隆辛酉春正月御筆第十二冊陳風十篇末幅款識云乾隆辛酉夏五月御筆第十三冊檜風四篇曹風四篇末幅款識云乾隆辛酉八月御筆第十四冊豳風七篇末幅款識云乾隆辛酉仲冬御筆第十五冊小雅鹿鳴之什十篇末幅南陔一篇御製補詩云我逝南陔言陟其岵昔我行後瞻望有父欲養無由風木何補我逝南陔言陟其屺今我行役瞻望有母母也倚閭歸則寧止南陔有筍籜實包之孱孱孩提孰噢咻之慎爾溫凊潔爾旨肴今爾不養日月其慆右南陔三章二章章六句一章八句款識云乾隆壬戌春正月御筆第十六冊白華之什十篇白華一篇御製補詩云有白者華不汚纎塵咨爾士兮宜修其身不修其身乃貽羞于二人有白者華婉兹靜好咨爾女兮宜修婦道不修婦道乃貽羞于二老白華匪玉涅而不緇白華匪蘭芬乃勝之我擷白華載咏載思白華匪玉質玉之令白華匪蘭臭蘭之淨我擷白華載思載咏右白華四章章六句華黍一篇御製補詩云瞻彼阪田厥黍始華胝足胼手嗟嗟我農夫瞻彼阪田黍華以秀胼手胝足惟勤斯殖茂華有不秀兮秀有不實兮其雨其雨兮杲杲日出矣惄子愁之恤矣右華黍三章二章章四句一章五句由庚一篇御製補詩云王庚便便東西朔南六符調燮八風節宣王庚容容朔南西東維敬與勤百王道同王庚廓廓東西南朔先憂而憂後樂而樂王庚恢恢南朔東西皇極孰建惟德之依右由庚四章章四句崇邱一篇御製補詩云澗松童童蛙黽鄰兮邱草萋萋蕩青雲兮凡百君子慎乃託身兮澗松童童澗則卑兮邱草萋萋邱則﨑兮凡百君子審乃所依兮有崇者邱物無不遂有卓者道愚無不智資生育德永植毋替右崇邱三章章六句由儀一篇御製補詩云在上曰天在下曰地君君臣臣父父子子在下曰地在上曰天父父子子君君臣臣由其儀矣物則熙矣儀其由矣物則休矣右由儀四章二章章四句二章章二句末幅款識云乾隆壬戌暮春御筆第十七冊彤弓之什十篇末幅款識云乾隆壬戌夏五月御筆第十八冊祈父之什十篇末幅款識云乾隆壬戌中秋御筆第十九冊小旻之什十篇末幅款識云乾隆壬戌冬十月御筆第二十冊北山之什九篇末幅款識云乾隆癸亥初春御筆第二十一冊桑扈之什十篇末幅款識云乾隆癸亥春杪御筆第二十二冊都人士之什十篇末幅款識云乾隆癸亥六月御筆第二十三冊文王之什十篇末幅款識云乾隆癸亥九月御筆第二十四冊生民之什十篇末幅款識云乾隆癸亥十二月御筆第二十五冊蕩之什十一篇末幅款識云乾隆甲子春三月御筆第二十六冊周頌清廟之什十篇末幅款識云乾隆甲子夏六月御筆第二十七冊周頌臣工之什十篇末幅款識云乾隆甲子孟冬月御筆第二十八冊周頌閔豫小子之什十一篇末幅款識云乾隆乙丑春三月御筆第二十九冊魯頌四篇末幅款識云乾隆乙丑夏五月御筆第三十冊商頌五篇末幅款識云乾隆乙丑季夏月御筆每冊末幅款下俱有惟精惟一乾隆宸翰稽古右文之璽三璽餘書幅俱有乾隆宸翰幾暇臨池二璽每冊書幅首篇俱有思無邪一璽每畫幅俱有筆端造化一璽每冊前一幅篇目俱有乾隆御筆一璽後餘幅又識云宋馬和之善畫人物山水供奉髙孝兩朝嘗取毛詩三百篇篇為一圖以進至今膾炙藝林特流傳零落未覩完璧為憾向在書舍稍解六法輒欲追擬全圗有志未逮御極後偶值幾餘檢內府書畫舊蹟得所圗毛詩若干篇筆法飄逸務去華藻洵如畫史所稱爰敕畫院諸臣規橅筆意舊有者臨之已缺者補之各圗梗槩清燕情閒間亦隨筆㸃染人物及山林水石致趣又仿束廣微作笙詩補亡六章竝寫大意蓋始事于己未春積以嵗月迄今秋七月之望獲竟斯業雖畫法未克與和之先後而翰墨風流繼踪曩軌亦足標文苑雅事且不啻此詩之教以垂懲勤一披覽間里巷貞淫之故朝廷郊廟之遺犂然在目因是有以考其得失朱子云本之二南以求其端參之列國以盡其變正之于雅以大其規和之于頌以要其正則修身齊家平均天下之道不待他求而得之然則是圗成而可興可觀其禆益不更深切著明耶乾隆十年嵗在乙丑處暑日御識後有乾隆宸翰稽古右文之璽含經味道三璽後臣張廷玉跋云古之聖人左圗右史亦越後王往往繪無逸豳風于殿上豈非以載于詞者口熟而夙義不新繪于象者觸目而感心尤切耶昔者孟子善說詩曰以意逆志朱子解之曰逆之為言迎也臣則以為迎以虛不若迎以實迎以心不若迎以目形往者滯想神來者印心形接而神通則繪圗之功載無言之教焉皇上抉經之心執聖之權載展詩圗因舊為新功百古人選意命工覃思遊情七載乃就其于經也可謂篤矣蓋皇上以仁義純厚之聖抱追寫千載以上忠孝貞良之性情其則不逺妙乃入神三百篇詩心如揭焉伏羲之圗易也得文王周公孔子之辭而其義始備詩圗緣辭以立象觀象以玩辭互相資而其義益顯引之翼之鼓之舞之使自得之皇上之心其即伏羲文王周公孔子之心也夫保和殿大學士臣張廷玉恭跋又臣梁詩正題云伊古垂訓左圗右書覽觀鑒戒如與遊居我皇稽古道存目擊無逸豳風髙張殿壁娛情翰墨清燕餘閒萬象天秀隨元氣還詩三百篇繪事流美惟馬和之超宋畫史風雅攸寄尚有典型匪刪匪逸不見全經爰整曩規羣工待詔仿舊補遺擬追筆妙能品備矣未進于神仙毫㸃染飛動疑真乃眷左方御書章句逺邁思陵諸體畢具南陔以降束晳補亡周情孔思更撰篇章幾暇從容程功勿亟七載集成藝林動色生氣逺出鎔冶化爐遺文總録合璧聨珠糾縵烟雲昭回星漢萬丈光華天章縈貫神心逺運大義載宣匪曰遊藝進德在焉五際六情條綱可述理趣環深藴涵微密寫氣呈貌屬采附聲美刺審象心開目明受詩卒業求端要止大㫖所存聞子朱子斯圗重炳可興可觀開卷自得無勞仰鑽由缺得完因文見道舊蹟流傳儼然師保小臣稽首大哉王言妙闡經義德成教尊形四方風繫一人本但凛陳詩何煩補衮丹青法戒矇瞍誦針此焉竝舉不顯亦臨盛德形容千載一遇歌頌無文聊充傳注户部尚書臣梁詩正敬題又臣汪由敦題云稽古正學則左圖而右史史以紀善敗圗以肖臧否豫欲觀成象典訓徴帝紀咸平五經圗臚列器服爾毛詩肖物形開成有芳軌我皇博羣籍葩經探奧旨齊魯韓三家風雅頌四始一篇繪一圗情真態逼似美刺别薰蕕可愕亦可喜雍容陳廟廊瑣細及婦子仰象日月星俯察禽魚豸風人聚一堂名物瞭如指遊藝及適情而實通治理從容萬幾暇玉案雲藍紙一圗系一篇爛矣天章煒天章藴元氣揮灑何淋漓子曰詩三百蔽以無邪思心正筆乃正六體隨所宜湘管列三品虞戈縱一麾八法神運用萬象歸爐錘聖能本天縱神畫追皇羲風則婉以入婀娜含丰姿雅則溫而栗端莊出委蛇頌則肅且嚴正容無傾欹毫端結搆新溯古頡籀斯雍鵠羲獻繇草聖皇象芝鸞龍紛蔚跂圭璧燦陸離超軼光堯閣方駕神禹碑殷勤七載功味道研文辭文辭豈糟粕皇心妙經營㸃翰涵造化敷政本穆清博綜全詩理鑒古攄遙情王化起二南雅頌陳典型觀風知正變保泰在持盈聖朝綿景運百年仁化成世德美作求既醉歌太平沐膏咏勤苦萬族慶盈寧夫豈無風謠洋溢為頌聲廟堂述功德揄揚振鍧鏗宫中奏元音鏘然叶韶韺憂勤底和樂風教覃八紘旃厦日兢兢緝熙于光明雲漢仰昭回萬古星日晶拜手歎觀止遂歌有餘榮刑部尚書臣汪由敦敬題又臣勵宗萬題并序云臣惟詩為義府畫有化工業則分鑣道原合轍自宣聖刪詩而後鍾吕薪傳粵史皇作畫以來圗書鬱起載考文明之世聿推濬哲之君五采斯章九歌惟叙道貫端倪而無兩才參輪軸以成三嗣後各具專長能事罕聞兼擅帖傳快雪宣和幾首風詩書賜建炎趙鼎兩篇雅什至若采桑播榖紀豳土之嵗華流火肅霜譜夏時之月令選場勝事别室流輝大都獻自臣工不盡出于宸翰自非睿思廣運安能菁藻紛披昔宋髙宗御筆親書翰墨擷藝林之秀命馬和之繪圗象物丹青增畫院之榮乃雲散星流遺逸較尚書而倍蓰寸鱗片羽留傳僅大衍而有竒恭逢我皇上心契兩儀目周三古星機月杼燦天經地緯之文道藪書山藴嶽峙海涵之象兹萬幾之清暇得太素之淵微偶傳毛穎中書括寫葩經全部翥髙岡之威鳳尋行見萋菶梧桐躍靈沼之嘉魚展幅掇參差荇藻緬惟文武周召如接寤言直教毛鄭齊韓自慚箋注籥連章而合繪八法兼精笙有序而無辭六篇可補十城完璧合成羣玉之山九野繁星羅列渾銅之象總三百篇興觀羣怨展也大成垂億萬載忠孝貞良呼之欲出臣學同耳食識類面牆蠡不量而思傾魚有情而竊聽難形美備比象鼎以長新欲頌升恆竝龍圗而永麗慕知來之如賜愧悟禮之非商謹志七言賡揚有志略該六義黼黻何能不比尋常翰墨香仙毫分潤到經箱搜將百代蟲魚注譜出千秋雲漢章生面頓看開蠧簡陳編也慶荷龍光聖人手筆風人旨願附言詩賜與商六首空題缺舊藝獨綿綿緒接餘芬陋他束晳笙詩補逺邁周宣石鼓文續到朱絃原不斷圑來玉盒本難分信知聖聖心相印清廟新篇重典墳傳神本有化工司豈但風騷仗鼓吹冊府定無經外史御屏新譜畫中詩周原禹甸長相對鎬露豳風宛在斯須識我皇操管意莫將花樣詫新竒經田隻手掃荒蕪三百雖多義不殊但覺㽔葩生寶翰始知分墨盡訏謨全詩抄後成全璧一字藏來值一珠只有繪聲難措筆升平歌詠遍天衢工部侍郎臣勵宗萬敬題又臣張若靄跋云生數千百年之後而能攝數千百年以前之人之事之境宛然見之几席則我皇上所製詩經圗有益于天下後世風雅人倫者教思彌切觀感尤深也夫口耳習而心思通學詩者類然然于三百篇中忠孝貞淫興衰治亂與夫山川鳥獸草木之情狀徒倣佛想像于詞章行墨間形往者故其神不來雖鄭康成箋之而意緒不親陸元恪疏之而恍惚無定也皇上萬幾之餘流連四始玩辭取象乃舉三百篇繪之一篇為一圗每一圖皆承御筆㸃定復親書本詩且御製補經之亡者六篇既成頒示臣靄等臣等展玩移時往復感歎竊謂圖此非為筆墨之遊戲卷軸之玩好以誇示藝林已也誠欲觀斯圖者因辭以徴象因象以㑹意因意以度志因志以論世因世以知人則詩之有益于風雅人倫也愈久彌新而我皇上以詩教教天下後世之聖心豈不與周情孔思後先一揆哉臣謹拜手而為之跋通政使臣張若靄又臣裘曰修記云臣以謭陋獲厠侍從儤直內廷親見皇帝陛下萬幾之餘無他嗜好深于詩兼工書畫乃取風雅頌三百五篇以真草篆𨽻四體書其詞採小序暨漢諸儒之說一折衷于朱子集注而製為圖自己未至乙丑凡七閲嵗始訖事為冊三十其笙詩六篇舊所逸者又補其詞之缺臣聞書畫之興其來甚逺周易繫辭謂上古結繩而治後世聖人易之以書契此為書之始易通卦驗云伏義作易無書以畫此為畫之始曹植又謂畫者鳥書之流古者左圖右史史以徴其文圖以考其象故陸機云宣物莫大于言存形莫大于畫然則始自二南終于三頌寫氣圖貌屬采附聲數百年治化升降之故十五國民風正變之端一展視而燦如眉列所以備勸戒昭治忽者其用為尤著昔宋高宗嘗命馬和之繪詩圖而親書之至今流傳往往而有然臣竊謂思陵當南渡偏安之際臨安一隅幾于不國是宜外攘內修奮揚刻厲日夜與賢士大夫講求治具以張皇威武而顧殫心觚翰坐銷嵗時是公劉亶父肇造邠岐之篇衛文秦襄定中小戎之什皆未嘗肄業及之也今皇帝德隆化洽東至日出西至日入南踰重洋北越大漠悉主悉臣億兆熙熙享太平無事之樂而深宫穆清愈弗敢稍自暇逸聲色狗馬之事一不得陳于前政治之暇圖史是娛用以攄寫性靈涵暢理道下視宋髙所製豈特霄壤過之也哉至于揮毫濡墨妙契化工天縱多能直以餘事視之而己未足為我聖天子頌也少詹事臣裘曰修謹記又臣陳邦彥贊并序云蓋聞五帝以至德表其功用三王以道法相與授受宇宙炳蔚文章備焉仲尼定六經垂教本易象春秋尚書尚已至夫原人情通政事移風易俗逹幽宣微莫善乎詩故傳謂詩者天地之心星辰之度百福之宗萬物之户而君德之祖是以孔子勤勤致訓于學詩也欽惟我皇上紹至治于前徽宏成周之盛軌化成于閭里學懋于深宫加以天縱多能博文遊藝究四始之深趣抽五際之瑤篇以為古者學問所存必左圖而右史精微所寄在㑹意以象形于是三百五篇全攄宸翰分章命景默契曩賢燠寒罔輟經嵗告成賦比興隨篇㸃染極能事于難名風雅頌逐幅描摹如化工之肖物質性情于千載共欽書畫通神垂筆墨于萬年足與球圖共寶緬維從來聖哲雅意窮經自永平甘露以逮漢之宣明未聞躬書六經也唐明皇𨽻書孝經于石矣未聞其繪為圖也宋髙宗書詩經刻石始附以圗然出其臣馬和之之手圖雖工未必能得經之旨也若夫潄芳潤而極乎神妙象物宜而㑹其淵源器與道俱理因事顯所謂關雎麟趾覘風化者于是乎在焉卷阿泂酌陳勸納者于是乎見焉寫鳲鳩行葦之什即物狀而可以知仁譜七月大田諸章即謠俗而可以知政則是圖之作也固我皇上夙夜敬止之餘所以寄其紹三五而隆道心昭治法者歟茍徒謂聖人之能事無所不備而以鴻編巨冊與藝苑墨林爭勝是則測海于蠡窺日于牖亦烏足與語天地之大哉臣趨承祕殿親侍揮毫欣瞻睿藻之紛披仰識天心之深逺謹拜手稽首而歌為之贊曰維德廣運博矣如天淵涵古籍三百斯專謂自朝廟迄乎紘埏宣導情性四宇熙然漢始尊經唐宋紹焉思陵灑翰繪事未兼惟我哲后深慕經筌楓宸綈几書畫相宣書以昭逺畫以代詮聲詩載補亡軼仍全銀鈎鐵畫體格精妍緣情適況寫景通原心隨筆正意在象先觀圖證詠纎悉畢傳何勞文字毛詁鄭箋折衷盡善超越前編寶章妙㑹珍並璣璿輝煌冊府用垂萬年翰林院侍讀學士臣陳邦彥又臣董邦逹題云輝輝清旭明金鋪香烟翠裊鵲尾爐幾暇怡情寄翰墨緗縑細寫毛詩圖我皇稽古邁前哲遊心逺溯殷周初洵知晨宵圖至理峻筆不獨春華敷豳風一卷古有繪誦詩三百舉一隅豈如全詩盡周遍默鼓槖籥旋天樞起自關雎迄殷武四始六義篇章殊一圖一詩相附麗燦若合璧與聨珠紛紛蟲魚苦箋注陋彼馬鄭言多膚當年紹興祕府志碧鸞綾褾供清娛亦具此圖兼衆什臣和之畫思陵書流傳至今五百載嵗久未免丹青渝宸章重與開生面日月一出爝火虛興觀羣怨備全藴含豪邈然意有餘緬昔宣聖刪詩日南陔六章詞久無有晉束晳曽補綴筆力萎薾文義蕪于今更復經睿製元音壓倒千羣儒詩與書畫兼衆妙鄭䖍三絶嗤覆瓿無聲詩耶有聲畫掩映回環如合符千秋鴻寶垂藝苑裝成玳瑁架珊瑚側聞九重下明詔敷天同免明年租幅􅊷萬里湛恩濊汝墳江漢墟猶拘大田多稼遺秉穗吹豳飲蠟齊歌呼宴樂笙簧聽蘋鹿春田草木看騶虞鄉國風謠定可采太平景象殊難摹小臣未學等蠡測曽治葩經失則愚校讐蓬萊歷十載驚捧天藻欣且愈敬濡柔翰志幀尾靜看花影搖蝦鬚翰林院侍讀學士臣董邦逹敬題書畫幅俱高九寸八分廣一尺二寸六分御製豳風圖並書一冊左方宣德箋金絲闌本行楷書本詩右方太子倣箋本墨畫詩圖御筆繪人物董邦逹補樹石舍宇書畫各八幅書幅第一幅有摛藻為春豳風無逸念民依二璽第二幅有有吾與㸃也之意含經味道二璽第三幅有清心抒妙理耽書是宿緣二璽第四幅有潄芳潤廣闢四門聰二璽第五幅有茹古含今攜筆流雲藻二璽第六幅有含英咀華㑹心不逺二璽第七幅有樂天讀書晰理觀天地生物氣象三璽第八幅款識云乾隆乙丑中伏日御筆下有乾隆宸翰萬國農桑寤寐中二璽畫幅第一幅前有稽古右文之璽一璽後有意在筆先一璽第二幅有遊六藝圃一璽第三幅有筆端造化一璽第四幅有見天心一璽第五幅有煙雲舒卷一璽第六幅有墨雲一璽第七幅有浴德一璽第八幅款識云乾隆乙丑夏日敬勝齊製下有德充符幾暇怡情二璽後有幾暇臨池一璽又董邦逹款云臣董邦逹奉勑恭補樹石舍宇後有臣逹侍從臣二印後餘幅臣梁詩正等跋云我皇上敕幾熙載庶績用康清燕多閒遊情翰墨既以積嵗之功為詩經全圖復念豳風七月陳王業之艱難所言農夫紅女趨事赴時勤力務本尤為親切有味爰御楮翰分章為圖系詩左方裝成巨冊臣等侍直禁廷得與賜觀且承命恭跋于後欽惟我聖祖仁皇帝繪耕織圖賦詩授梓傳示宇內世宗憲皇帝暨我皇上三朝睿藻輝映冊府男耕女績之景狀纎悉具備有老農村嫗親執其勞所弗能自道者一經天筆曲繪其情仰見聖意所存周浹于閭閻幽隱非獨詞藝之工妙奪造化而已揆之往古惟周以穡事開基豳風所述后稷公劉太王文武之遺先聖後聖有同揆焉聖天子紹聞衣德惓惓民依耕藉親蠶典禮修舉風化所覃海澨山陬無不闢之土田野婦孺以至賨僰蠻羌無不知耕耘織作之當務休養百年馴至今日王道化成之效稱極盛矣而九重邃密無刻不以引飬引恬為心于雨暘霜雪蚤晚之候黍稌菽麥髙下燥濕之宜漚麻治絲鉤筐曲薄之用廣咨博詢考古驗今施之政而授之民見于實事者既如此即至娛意藝林舉念弗釋殷然溯古先聖哲之心于千載而上指事肖貌如親見之不啻衮衣繡裳雍容諷諭于黼座左右聖意淵微有得之筆墨之表者臣等竊幸見而知之所愧弇陋不文未能揄揚萬一云爾臣梁詩正臣汪由敦臣勵宗萬臣張若靄臣裘曰修臣陳邦彥臣董邦逹恭跋臣梁詩正敬書後有臣梁詩正朝朝染翰二印書畫幅俱髙九寸五分廣一尺四寸二分御筆生香樂意四冊金粟箋本右方墨畫左方行楷書五言絶句每冊末幅署御筆二字第一冊折枝花卉第一幅有筆端造化一璽左方詩云禁苑春暉麗花蹊綺樹裝綴條深淺色㸃露參差光下有乾隆宸翰一璽第二幅有研露一璽左方詩云郁烈膩香溫丁星亂蕊繁言歡風䀨語勾夢蝶迷魂下有朗潤一璽第三幅有墨雲一璽左方詩云春園芳已遍緑蔓雜紅英獨有深山客時來辨藥名下有古香一璽第四幅有寫生一璽左方詩云不受霜雪侵自足中和氣欲知清淨身即此林間是下有樂天一璽第五幅有雲霞思一璽左方詩云緑樹競扶疏紅姿相照灼不學桃李花亂向春風落下有得佳趣一璽第六幅有潑墨一璽左方詩云新開寒露藂逺比水間紅豔色寧相並嘉名偶自同下有幾暇臨池一璽第七幅有叢雲一璽左方詩云老圃芳名舊炎天吐蕊新陶潛北窗下自謂羲皇人下有㑹心不逺一璽第八幅有德充符一璽左方詩云姚魏變衰藂繁華夢已空素娥留國色小立試金風下有染翰一璽第九幅有幾暇怡情一璽左方詩云未植銀宫裏寧移玉殿幽枝生無限月花滿自然秋下有中和一璽第十幅有澄觀一璽左方詩云數萼初含雪孤標畫本難香中别有韻清極不知寒下有乾隆宸翰一璽第二冊各種花朵第一幅有寫生一璽左方詩云映庭含淺色凝露泫浮光日麗參差影風和輕重香下有宸翰一璽第二幅有中和一璽左方詩云霞文光啓旦珠琲密封條積潤含仙露濃隂奪海綃下有朗潤一璽第三幅有澄觀一璽左方詩云行逢二三月九州花相映川原曉服鮮桃李晨粧靚下有研露一璽第四幅有潑墨一璽左方詩云移萱樹之背丹霞間縹色我有憂民心對君忘不得下有德充符一璽第五幅有叢雲一璽左方詩云擢秀三秋晚開芳十步中分黃俱笑日含翠共搖風下有㑹心不逺一璽第六幅有含輝一璽左方詩云露寒清透骨風定逺含芬爽致銷煩暑髙情謝曉雲下有幾暇怡情一璽第七幅有筆端造化一璽左方詩云曠然塵慮靜為對夕花明密葉低層幄冰㽔亂玉英下有樂天一璽第八幅有墨雲一璽左方詩云接葉有多重開花無異色含露或低垂從風如偃抑下有得佳趣一璽第九幅有古香一璽左方詩云爽氣浮朝露濃姿帶夜霜泛杯傳夀酒應共樂時康下有染翰一璽第十幅有浴德一璽左方詩云黃羅作廣袂絳帳作中單人間誰敢著留得護春寒下有乾隆宸翰幾暇臨池二璽第三冊蛺蝶圖第一幅有筆端造化一璽左方詩云春至百花繁名園蛺蝶翻美人將扇撲搨得一雙痕下有宸翰一璽第二幅有寫生一璽左方詩云尋豔復尋香似閒還似忙暖煙沈蕙徑微雨宿花房下有朗潤一璽第三幅有潑墨一璽左方詩云雙眉捲鐵絲兩翅暈金碧初來似爭妍忽去渾無迹下有涵虛朗鑒一璽第四幅有墨雲一璽左方詩云朝出南園裏暮依花萼端露葉乾來易風池渡覺難下有中和一璽第五幅有幾暇怡情一璽左方詩云隨風繞緑蕙避雀隱青薇映日忽爭起因香乍共歸下有乾隆宸翰一璽第六幅有樂天一璽左方詩云重傅秦臺粉輕塗漢殿金相兼惟栁絮所得是花心下有㑹心不逺一璽第七幅有叢雲一璽左方詩云入院依雕檻穿樓撲鏡函阿誰最憐惜描在泥金衫下有染翰一璽第八幅有􅊹觀一璽左方詩云蝶解傳花魄花能引蝶來蝶疑雙宿影花作並頭開下有幾暇臨池一璽第九幅有雲霞思一璽左方詩云趂暖戲晴川依人上畫船粉銷煙翅薄香冷露鬚拳下有德充符一璽第十幅有得佳趣一璽左方詩云粉翅嫩如水繞砌乍依風日髙山露解飛入菊花中下有乾隆宸翰一璽第四冊畫草蟲第一幅有寫生一璽左方詩云躍者躍其股顧者注其目乃知造物靈未抵毫端速下有乾隆宸翰一璽第二幅有墨雲一璽左方詩云號作牽牛郎亦云豆娘子呼之兩不譍并簡莊生旨下有雲霞思一璽第三幅有中和一璽左方詩云絡緯不停聲從昏直到明不成一絲縷徒負織作名下有幾暇臨池一璽第四幅有潑墨一璽左方詩云遊漾下晴空尋芳到小叢帶聲來蕊上連影在房中下有得佳趣一璽第五幅有叢雲一璽左方詩云金翼挾花心翩翩小苑隂螳螂襲其後相對莫彈琴下有宸翰一璽第六幅有幾暇怡情一璽左方詩云兩角徒自長空飛不服箱為牛竟何事利吻穴空桑下有染翰一璽第七幅有澄觀一璽左方詩云六月鱗塍間蚱蜢閙如雨田水如熱湯藝耔亦良苦下有內府珍祕一璽第八幅有樂天一璽左方詩云聲流上林苑影入侍臣冠得飲旻天露何辭髙栁寒下有德充符一璽第九幅有研露一璽左方詩云約綽草間飛清恬風日美我本狎鷗人蜻來得無喜下有㑹心不逺一璽第十幅有筆端造化一璽左方詩云金風肇殘伏玉樹正秋涼喓喓草間蟲感時振衣裳下有乾隆宸翰一璽後副頁款識云幾暇㺯墨隨意㸃染花枝草蟲蜂蝶各種漫取舊人詩句對題左方積成四十幅分帙裝潢命曰生香樂意乾隆甲子中秋後二日御識下有潄芳潤乾隆宸翰二璽書畫幅俱髙三寸六分廣二寸一分有竒御筆涉筆成趣四冊金粟箋本右方墨畫左方行書舊人詩句每冊末幅署御筆二字第一冊山水冊前一幅御筆自繪聖容左方題識云世界空華底認真分明兩句辨疏親寰中第一尊崇者却是憂勞第一人夢中自題小像舊作乾隆乙丑季夏清暉閣御筆下有德充符乾隆御筆二璽第一幅有煙雲舒卷一璽左方詩云雲中叠嶂翠糢糊深樹茒堂隱若無莫向昔人論畫品開窗聊對謝公圖下有樂天筆端造化二璽第二幅有涵虛朗鑒一璽左方詩云山光淡淡樹隂隂溪水湯湯潄玉琴此境不知何處有清風吹起鹿門心下有浴德觀書為樂二璽第三幅有有吾與㸃也之意一璽左方詩云山外溪聲不斷流夾堤楊栁易知秋人間儘有清涼地只許伊人著釣舟下有含英咀華㑹心不逺二璽第四幅有潑墨一璽左方詩云積雨空濛烟樹重翠崖千丈削芙蓉招提更在秋雲外只許行人聽曉鐘下有墨雲天根月窟二璽第五幅有半榻琴書一璽左方詩云逺山幾叠護雲屏梧竹風涼鳥自鳴最是幽人無一事捲簾獨坐看黃庭下有茹古含今一璽第六幅有㑹心不逺一璽左方詩云千尺飛流落半空散為烟雨晝濛濛草堂留在匡廬曲時聽松風暗靄中下有雲霞思染翰二璽第七幅有讀書依竹靜一璽左方詩云江雲烟靄樹髙低竹裏人家傍水西滿地松隂春雨過好山青似若耶溪下有叢雲內府書畫之寶二璽第八幅有澄觀一璽左方詩云片石叢篁豈在多丹青只論意如何若能咫尺看千里即是瀟湘壁上過下有潄芳潤微言晰纎毫二璽第九幅有扇以淳風一璽左方詩云十畝繁隂欲破空當時曽受大夫封廟廊正爾需梁棟未許長潛澗底蹤下有遊六藝圃一璽第十幅有禮園書圃一璽左方詩云隂隂翠幄草堂低曉雨初晴水滿溪門徑晝長人不到垂楊深處一鶯啼署款下有乾隆宸翰幾暇臨池二璽第二冊折枝花卉第一幅有大塊假我以文章一璽左方詩云千朵濃芳倚樹斜一枝枝綴亂雲霞憑君莫厭臨風看占斷春光是此花下有寫生幾暇臨池二璽第二幅有芝閣一璽左方詩云香中人道睡香濃誰信丁香臭味同一樹百枝千萬結更應薰染費春工下有染翰墨雲二璽第三幅有鳶飛魚躍一璽左方詩云枝頭窈窕魚雙貫風裏蹁躚鳳對飛莫把根苗方芍藥留春不似送將歸下有齊物落花滿地皆文章二璽第四幅有浴德一璽左方詩云一根曽寄小峰巒薝蔔香清水影寒玉質自然無暑意更宜移就月中看下有翌太和天根月窟二璽第五幅有㑹心不逺一璽左方詩云短籬新見出梢梢葱蒨都無尺許髙茜色芳葩工㸃綴莫教容易渾蓬蒿下有遊六藝圃一璽第六幅有潄芳潤一璽左方詩云香紅嫩緑正開時冷蝶饑蜂兩不知此際最宜何處看朝陽初上碧梧枝下有見天心朝日輝二璽第七幅有攜筆流雲藻一璽左方詩云露洗金蟲一半開層層碧玉映樓臺西風昨夜吹香過人在欄干待月來下有清心抒妙理一璽第八幅有衆花勝處香千尺一璽左方詩云花自深紅葉麴塵不將桃李共爭春今日驚秋自憐客折來持贈少年人下有研露筆端造化二璽第九幅有叢雲一璽左方詩云羞與春花豔冶同殷勤培溉待西風不須牽引淵明比隨分籬邊要幾叢下有樂天雲霞思二璽第十幅有宸翰觀天地生物氣象二璽左方詩云空庭一樹影橫斜玉瘦香寒領嵗華寄語凌波水仙子蠟梅誰許嫁山茶署款下有乾隆御筆一璽第三冊飲中八仙圖左方書杜甫詩第一幅賀知章有雲霞思一璽左方書知章騎馬似乘船眼花落井水底眠句下有攜筆流雲藻乾隆御筆二璽第二幅李璡有茹古含今一璽左方書汝陽三斗始朝天道逢麴車口流涎恨不移封向酒泉三語下有翌太和含英咀華二璽第三幅李適之有研露一璽左方書左相日興費萬錢飲如長鯨吸百川銜杯樂聖稱避賢三語下有叢雲幾暇臨池涵虛朗鑒三璽第四幅崔宗之有浴德一璽左方書宗之瀟灑美少年舉觴白眼望青天皎如玉樹臨風前三語下有讀書晰理觀天地生物氣象二璽第五幅蘇晉有寫生染翰二璽左方書蘇晉長齊繡佛前醉中往往愛逃禪句下有意在筆先㑹心不逺二璽第六幅李白有天根月窟一璽左方書李白一斗詩百篇長安市上酒家眠天子呼來不上船自稱臣是酒中仙四語下有墨雲含味經籍二璽第七幅張旭有筆端造化潑墨二璽左方書張旭三杯草聖傳脫帽露頂王公前揮毫落紙如雲煙三語下有樂天煙雲舒卷微言晰纎毫三璽第八幅焦遂有宸翰內府書畫之寶二璽左方書焦遂五斗方卓然髙談雄辨驚四筵句署款下有乾隆宸翰一璽第四冊百蝶圖第一幅有天根月窟一璽左方詩云春山處處客思家淡日村烟酒斾斜蝴蝶不知人事别繞牆閒弄紫藤花下有乾隆宸翰樂天二璽第二幅有墨雲一璽左方詩云橘蠧如蠶入化機枝間垂繭似蓑衣忽然蛻作多花蝶翅粉才乾便學飛下有清心抒妙理一璽第三幅有宸翰一璽左方詩云不並難飛繭裏蛾有花芳處定經過天風相送輕飄去却笑蜘蛛漫織羅下有煙雲舒卷幾暇鑒賞之璽二璽第四幅有筆端造化一璽左方詩云滿叢鮮碧露團香院落春紅過野芳蛺蝶一生花裹活飛來還戀竹風涼下有研露一璽第五幅有御賞一璽左方詩云何處輕黃雙小蝶翩翩與我共裴􅏆緑隂芳草佳風月不是花時也解來下有微言晰纎毫一璽第六幅有浴德一璽左方詩云長養薰風拂曉吹漸開荷芰落薔薇春蟲也學莊周夢化作南園粉蝶飛下有得佳趣乾隆御賞染翰三璽第七幅有幾暇怡情一璽左方詩云緑隂窗下春草碧無數栁花吹近牀一雙蛺蝶總無賴飛到小欄還過牆下有叢雲稽古右文之璽二璽第八幅有有吾與㸃也之意一璽左方詩云烟雨凄迷晚不收疏簾曲几寄悠悠多情蛺蝶來何許㸃盡青青百草頭下有意在筆先一璽第九幅有潑墨一璽左方詩云春光淡淡日遲遲正是名園撲蝶時却憶小橋流水過東山春色寄桃枝下有染翰涵虛朗鑒二璽第十幅有幾暇臨池一璽左方詩云泥香江暖燕來時紅白花深桃李枝草色一簾門半掩臥看雙蝶趂遊絲署款下有乾隆御筆一璽後餘幅又識云天地間大造為罏凡山川草木人物一皆化工所寄而前人體化工之肖物寓意于畫不名一家要其生趣自在尋常筆徑外也豫每思心摹手追今夏幾餘偶得經紙輒隨筆㸃染作山水花卉人物各若干頁裝成四冊未審于化工有合與否姑以俟之識者乾隆乙丑初伏并識下有研露攜筆流雲藻二璽書畫幅俱髙六寸五分廣三寸六分書卷御筆臨古一卷宣德箋本前後二幅前幅草書款識云懷素自叙帖乾隆甲子秋日御臨下有乾隆御筆摛藻為春二璽幅前有意在筆先清心抒妙理二璽後幅行書款識云米元章蘭亭跋御臨下有乾隆宸翰攜筆流雲藻陶冶性靈三璽幅髙八寸廣二尺四分二幅同御臨蔡襄謝賜御書詩帖一卷宣德箋本楷書款識云乾隆癸亥季冬月御臨下有乾隆宸翰攜筆流雲藻二璽卷前有研露一璽中幅有幾暇臨池一璽卷髙七寸八分廣三尺七寸六分御臨蘇軾詩帖一卷宣德泥金箋本行書五言古詩一首款識云東坡此書務追險絶未兔貌怪細體㑹之無一筆越晉唐人矩矱也故能傳流八百載書云事不師古以克永世匪說攸聞御臨并識下有乾隆御筆摛藻為春二璽前有含英咀華一璽卷髙七寸八分廣二尺二寸九分御臨黃庭堅五言古詩一卷宋箋本行楷書款識云乾隆甲子夏五月望御筆臨黃山谷下有稽古右文之璽乾隆宸翰二璽卷髙八寸三分廣二尺三寸御臨米芾尺牘一卷宣德箋本行書款識云乾隆甲子秋九月上浣五日御臨于長春書屋下有煙雲舒卷乾隆宸翰二璽又陶冶性靈一璽卷前有研露含經味道二璽卷髙七寸五分廣三尺一寸御臨董其昌書枯樹賦一卷宣德箋本行楷書款識云乾隆壬戌小春月之望御筆偶臨後有稽古右文之璽乾隆宸翰二璽卷前有研露攜筆流雲藻二璽中幅押縫宸翰璽幾暇臨池璽各二卷髙七寸五分廣九尺一寸三分御臨董其昌書樂志論一卷宣德箋本行楷書并臨其昌自跋八則後識云董香光此卷行楷隨意翛然獨逺自是君身有仙骨未許後人問津也豫幾暇率爾臨仿敢希神似特存之以驗書學云乾隆甲子仲冬朔日並識後有幾暇臨池乾隆宸翰二璽卷前有宸翰稽古右文之璽二璽卷中幅有乾隆宸翰一璽押縫有御賞一璽卷髙五寸三分廣四尺四寸四分畫卷御筆澄海樓圖一卷金粟箋本墨畫款題云我有一勺水瀉為東滄溟無今亦無古不減亦不盈臘雪難為白秋旻差共青百川歸茹納習坎惟心亨却笑祖龍癡鞭石求蓬瀛誰能忘天倪與汝共濯清昨冬自盛京回蹕入關登澄海樓望海乾端坤倪軒豁呈露洵屬宇宙大觀曽題句壁問以志勝逰今長夏幾餘想像斯槩輒仿王孤雲筆意繪為此圖萬里三山近在咫尺亦消暑一奇也乾隆甲子夏五月望後二日御識後有寫生㑹心不逺二璽卷末有乾隆宸翰一璽拖尾臣張照書聨句詩並序云乾隆八年秋展謁祖陵禮成還軫十月十六日道入榆關登澄海樓望海雪霽千峰波明萬里天容海色洵屬竒觀時張照梁詩正侍從因與聨句凡字涉水部者概不用倣歐陽修咏雪禁體也御製康回昔馮怒使地東南傾太始本無始常盈是不盈雙丸出其裏元氣鼓為營島嶼藐拳石臣張照御製軒樓敞繡甍巄􅀈疑貝闕倣佛見瑤京鞭石橋終斷噓煙市乍更星槎何處轉鼇柱若為擎邈矣端倪豁臣梁詩正御製雄哉氣象崢禹功思四載秦業剩孤城萬壑朝宗此纎珠茹納并由來無寸土亘古只空明直上到天險臣張照御製橫處據地棖目迷光皛皓耳駭聲砰轟精衛填難盡長虹駕可成三壺逺縈帶重嶴消飛鯨賦羡木華博臣梁詩正御製吟推玉局英平鋪歷劫雪喜遇初冬晴望嘆曽聞若來遊誰逐蜻內光含煜煜隂火涼熒熒絶域隨風逹臣張照御製方諸應月呈坎重不失信天一乃居貞比樂韶觀止如山聖景行空傳香象踏謬執窄蠡評有以謙能受臣梁詩正御製虛將白自生苞乾恢度量吐日煥晶瑩永奠寰區晏仙鄉底問程後臣張照又跋云昨嵗臣照蒙恩從登澄海樓偕臣詩正賡句天章之後今年夏皇上追憶昔逰之竒曠斯樓之壯觀命子墨徴毛穎舉靈海萬里歸于尺幅之中復勑臣照書原句于卷末欽惟皇上將聖多能生知力學九變復貫萬化生心于斯時也憑虛縱目茹納靈和陋漢武之羡蓬萊笑魏帝之臨碣石萬象一白天水空明日光風力之所蕩若億兆京垓摩尼寶珠晃朗煜爚干類萬聲自相喧聒皇歡既洽天筆斯賁毫不停綴文不加㸃二臣惶汗蠠沒若跛鱉之追飛龍惜乎奇境勝因千秋所豔而無東方朔枚皋劉向之儔以襄盛事以稱詔旨也豈但欲成唐虞三代之治無皋䕫尹旦其人哉臣承旨録詩恭述緣起古人有言兹榮也兹所以為愧也夫時乾隆九年七月既望臣張照奉勑敬書并跋卷髙八寸四分廣一尺七寸御筆葡萄蘭花一卷倣製金粟箋本前後二幅俱墨畫前幅葡萄款署御筆二字上鈐乾隆御筆一璽下有寫生一璽後幅蘭款璽同又筆端造化一璽前幅髙七寸七分廣一尺二寸六分後幅髙同廣一尺四寸六分御筆秋英八種一卷宣德箋本墨畫第一段葵花題云梳風翠羽翻承露金盤潔堪作素秋朋豈為清齊折下有叢雲一璽第二段菊花題云菊本瀟灑姿陶潛託幽好却被人傳說東籬轉厭閙下有宸翰一璽第三段秋海棠題云海棠一例好娟娟春復秋試向羣芳問爭如得自由下有德充符一璽第四段桂花題云馥馥月中香裳裳檻外黃姮娥酬白帝天酒復天糧下有染翰一璽第五段杜若題云遜菊態偏嫮當秋芳轉盛試問著經人應為何品命下有㑹心不逺一璽第六段蘭花題云香以清不釅色匪妖而美臨風笑芙蕖得作秋君子下有潑墨一璽第七段洛陽花題云周阿迥出羣蜂蝶任紛紛不與蘼蕪伍終因近此君下有乾隆宸翰一璽第八段蓼花題云秋波一片霞寫影稱疏斜夜月難分色棲鴻隱荻花下有寫生一璽卷末款識云世人愛春華繁豔而露砌霜籬寒芳㸃綴鮮有賞識者子素愛秋英幽趣輒于幾暇繪為八種並各題以絶句非僅遊情染藻緬想詩人託興蒹葭意頗同之乾隆甲子夏六月下浣并識下有乾隆宸翰幾暇臨池二璽卷前有筆端造化一璽卷髙七寸二分廣三尺九寸七分御筆泉石蘭竹一卷倣製金粟箋本墨畫署清泉白石翠竹猗蘭八字款識云甲子秋季養心殿齊居製後有乾隆宸翰幾暇臨池二璽卷前有叢雲一璽卷髙五寸八分廣二尺一寸一分御筆秋花三種一卷宋箋本墨畫秋葵菊花秋海棠三種題秋葵云梳風翠羽翻承露金盤潔堪作素秋朋豈為清齊折下有寫生一璽題菊花云菊本瀟灑姿陶潛託幽好却被人傳說東籬轉厭閙下有染翰一璽題秋海棠云海棠一例好娟娟春復秋試向羣芳問爭如得自由下有潑墨一璽卷未款識云古人論畫當以造化為師蓋謂得生趣乃佳也頃于長晝隨意濡筆作秋花三種雖逺乏師承生趣正復不減或猶勝以刻楮為工者乾隆甲子長夏御識下有乾隆宸翰幾暇臨池二璽卷前有筆端造化一璽卷髙七寸九分廣三尺一寸二分御臨趙孟俯蘭蕙圖一卷倣製金粟箋本墨畫款識云甲子仲秋月上浣九日御臨下有乾隆宸翰筆端造化二璽卷前有研露一璽卷髙七寸九分廣四尺三寸四分御臨趙孟俯浴馬圖一卷宣德箋本墨畫款識云甲子季夏倣趙孟俯筆意製于長春書屋下有乾隆宸翰一璽卷末有浴德一璽中幅押縫有德充符璽二卷髙六寸一分廣二尺九寸御臨倪瓚修竹草亭圖一卷金粟箋本墨畫款題云烟篁列為屏草亭剛作蓋咫尺湖山中興寄雲霞外雲林筆意簡淡惟簡益深惟淡益厚是以不可及也伏日消暑偶臨并題下有乾隆宸翰一璽卷末有煙雲舒卷一璽卷髙八寸七分廣一尺六寸四分御筆蒼松映日圖一卷灑金箋本著色畫款識云杜詩云我有一匹好東絹請君放筆為直幹可謂得畫松三昧此雖不經意之作要以蒼徑勝耳癸丑初夏抑齊製並題後有德充符㑹心不逺二璽前有澄觀一璽卷髙二尺五寸二分廣五尺五寸御筆三餘逸興圖一卷素絹本前後二幅俱著色畫前幅菊花款題云瀟灑東籬無客賞祗應野雀領寒若壬子秋季抑齊製前有澄觀一璽後有㑹心不逺寶親王寶二璽卷首有樂善堂圖書記一璽後幅水仙款題云寫罷花枝對素娥珮環裊裊出湘波不知弄影澄潭畔博得春風幾度過壬子冬日抑齊畫前有樂善堂一璽後二璽及卷末一璽與前幅同另幅跋云憶余己酉嵗偶習繪事而獨愛寫花鳥因博覽所載畫冊如林椿邊鸞黃荃徐熙諸名家得意之作無不規模殆遍然惟形肖于氣韻何有後乃悟大塊文章即目可尋正不在效顰前人也于是出以己意任筆所之不拘拘于規矩法律每于春淡風清之際桃李盛開或夏䕃濃深秋英瀟灑以至嵗寒松柏或薰蕊亞盆稽古之暇撫景興懷抒清思而消永日良可㑹心但裁花纈葉之間動經旬月始成尺幅即以與人故所存極少兹檢舊篋惟餘兩幀而豫無暇繪事者又復經年矣因思所曽留心不忍棄置乃命裝成長卷時娛目焉覽者莫謂熟處難忘但作鏡花水月㑹可耳甲寅夏五寶親王識並書下有寶親王寶染翰二璽前有樂善堂一璽後有樂善堂圖書記一璽引首書三餘逸興四大字款云長春居士自題下有寶親王寶勤學好問二璽拖尾和親王臣𢎞晝題云妙筆全侔造化功東籬秋色尺綃中名禽解哢寒香裹為助枝頭渲染工崚嶒瘦石倚霜縑粉瓣紅枝著意添拂拂毫端生氣動詩人畫史一時兼甲寅十月朔和親王𢎞晝謹題又臣邵基題云筆含清露絹流霜數朵寒花映袖黃更繪凌波仙子影十分冰雪試春芳錦囊貯得寫生枝講藝餘閒㸃筆時渲染化工縑素上幾回親切案頭彼邵基謹題又臣梁詩正題云夙欽餘事為排詩妙手還移學畫師漫說徐熙落墨處應誇梁廣㸃毫時東籬處士凌秋晚洛水神人步襪遲半幅霜綃都貌得化工憑寄許誰知梁詩正謹題又臣任啓運題云毖彼原泉發渚流盡泚泚太虛淨無雲霞蒸倐成綺所以君子功依仁亦遊藝造化藴我胸寫生出我指寫鳥鳥飛飛寫石石齒齒粲粲東籬友盈盈水仙子白雲煥其英寒霜秀其蕊即彼秋冬姿賦以春生意唯我不一物物物肖其理誰云此尺幅渾淪乃爾爾任啓運謹題又臣張照等題并序云右圖皇帝在青宫時作也當時受學緑圖問道柏招敦說典墳彌淪今古日昃耽玩臨登披尋上下數千餘年得失之林以周知數萬里遙民物之故講誦之勤著述之富蓋從來布衣韋帶中所未有間或怡情翰墨涉筆繪事傳神寫貌與真不别信夫造化生乎心非人之所能為也乾隆九年夏內出菊花水仙二幀賜觀並敕臣照臣宗萬臣若靄題于左方臣照焚香盥手恭述贊曰甘谷泉馨玉笥霞委大雲曽青下有佳士邃古神逰少海香瀰秋鶴與飛人淡如此延之上座影落在紙神假天造英靈奚軌菊蘭紉可佩菊纈可餐清未到聖不開沍寒藐姑射人御龍遊觀其膚冰雪其心旃檀上天本樣今落毫端玉眸微睇神風珊珊水仙臣張照敬題臣勵宗萬題云凌波絶代姿傲霜髙士節兩美結同心清標如一轍瀲灩泛金杯低徊解瓊玦相對淡忘言長天共㵳泬誰能繪其神筆與化工埒帝昔居龍樓天襟愛芳潔遊藝有餘閒寫此自怡悅當陽育羣彚階墀生屈軼敦俗黜浮華選士首孤孑寒根與晚香罔或老巖穴暇日示兹圖生枝宛可折灑然風露涼一洗五中熱回看桃李花品格盡猥屑願得餐落英嵗寒勵冰雪臣勵宗萬敬題臣張若靄題云琉璃硯匣塵不生墨君管子相逢迎紛披紅紫何足貌此中寄託殊遙情冰霜肌膚旃檀心大羅仙子來玉京金尊牙板豈復垢皎然萬劫瑤杯擎西風吹草草不緑重臺猶占東籬名坐枝雙鳥鳴嚶嚶淵明乍參師語清同生淨土良足貴西湖配食堪餐英毫端造化信㸃染春風秋露來無聲以此栽培遍萬物都看弱植喬林成青宫閒暇窮物態徐黃邊趙難抗衡萬幾偶一展蜀素那能如昔多經營臣得拜觀重命識墨林藝圃沾恩榮臣張若靄敬題幅髙一尺一分廣九寸九分二幅同御筆九思圖一卷素絹本著色畫前署鷺立蘆花秋水明七字款識云壬子秋日抑齊製下有㑹心不逺寶親王寶二璽前有樂善堂圖書記一璽後隔水又題云風起蘆洲鷺翿斜欲飛還竚水程賒凌波雪羽輕翻節倒影羅紋皎奪花宛在伊人深白露幾分秋色淡明霞遙看景物蒼茫意擬共鷗盟荻浦沙長春居士再題下有微言晰纎毫寶親王寶二璽引首書君子有九思五大字款云長春居士製下有寶親王寶勤學好問二璽拖尾臣張照等奉敕題並序云右圖皇帝在青宫時作也思蒹葭之伊人美振鷺之有序揚扢乎風雅旁流乎翰藝記所稱好賢如緇衣者歟題云鷺立蘆花秋水明又製七言律一首乾隆九年六月敕臣照臣詩正臣宗萬臣若靄題識圖末臣等仰瞻天藻丕賁千秋恩光下逮私慶蠅附恭和御製元韻各二首敬題于左臣張照和云陂塘淨麗水橫斜野色迷茫入望賒羣立遙疑霜著草獨盤載下雪翻花閒心清迥當秋日倒影空明蘸晚霞翠竹江村新月好歸來自在宿圓沙雪㸃紛飄舞態斜釣磯翹駐逸情賒風騷物色宜秋士烟雨生涯付水花豈望海綃圖狀貌况煩天筆灑雲霞羡魚莫遣詩家誚振迅雙翎立素沙臣張照敬題臣梁詩正和云水天一抹墨痕斜㸃染江鄉秋意賒白鷺乍盟爭舞翿青蘆將老欲飛花風回逺嶼翻輕雪烟淡長汀送落霞箇裏南華真趣在那容眼底著塵沙荻港鷗波小艇斜西湖風景夢猶賒六橋寒浸潭潭月十里秋添浦浦花邈矣伊人疑在水佳哉公子勝標霞一從妙㑹重看識依約飛鴻印淺沙臣梁詩正敬題臣勵宗萬和云霜枝雪羽帶烟斜滿眼蕭疏引興賒祗覺蒹葭宜素侣絶殊鶯燕殢春花玉笙舊欲招雲鶴天藻時還散綺霞倣佛秋風生荻港一羣飛起篆紋沙涼天晚眺鬢絲斜栁惲汀洲覺未賒漁艇不驚波外影月光全奪雪中花澄江一色疑寒練孤鶩齊飛有落霞玉陛傳觀銘至訓素襟清節照溪沙臣勵宗萬敬題臣張若靄和云照眼溪光匹練斜靜觀物態逸情賒一拳烟破翹寒翠四面風來鬭雪花戲染濯龍池上水閒揮棲鳳閣邊霞于今此鳥成仙骨長傍銀灣踏玉沙朵殿幾餘日每斜睿毫瀟灑興猶賒瑞翎十二紅為鳥寶芷三千嵗作花萬彚情形羅指掌九天風味寄烟霞小臣太液承鸞藻也似舂鋤學畫沙臣張若靄敬題卷髙一尺一寸八分廣五尺三寸五分書畫合卷御臨李公麟明君出塞圖一卷宣德箋本白描畫卷後行書御製舊作云萎紅飛碧春風老琵琶抱出長安道長安北去逹王庭四弦彈破知音少君王不是憐妾面未畫時應賜一見君王不是憐妾身猶勝獨閉漢宫春四絃嘈嘈絃絶聲髙絶絃續絃馬上音調青山緑水皆聽取生女應須辭父母此日穹廬號閼氏不愈老作巫山女後識云右豫曩時咏王明君舊作今偶檢禁中藏畫得李龍眠所繪出塞圖偶倣一過非爭筆墨之工聊以傳詩意云乾隆甲子夏五御識下有寫生乾隆宸翰二璽卷髙九寸六分廣一尺四寸三分御臨唐寅文徴明蘭亭書畫合璧一卷宣德箋本幅前墨畫臨唐寅後有宸翰幾暇鑑賞之璽二璽幅後小楷書蘭亭序臨文徴明後有墨雲一璽卷末款識云內府所藏有此唐伯虎及文待詔合璧蘭亭卷愛其書畫各臻神妙因并橅之以娛幾暇莫作熟處難忘觀也乾隆甲子重九日長春書屋並識下有乾隆宸翰幾暇臨池二璽又茹古含今㑹心不逺二璽卷首有意在筆先一璽中幅押縫有內府珍璧涵虛明鑒二璽卷髙五寸八分廣四尺八分書軸御臨蘇軾梅花詩帖一軸金粟箋本行楷書款識云乾隆甲子夏日御筆臨東坡書下有乾隆宸翰攜筆流雲藻二璽軸髙二尺二分廣七寸二分御臨趙孟俯節書歸去來詞帖一軸金粟箋本行楷書識云臨趙松雪下有乾隆宸翰幾暇臨池二璽軸髙一尺五寸六分廣七寸八分御臨俞和詩帖一軸金粟箋本草書七言古詩一首款云御臨俞和書下有乾隆宸翰含經味道二璽軸髙一尺八寸七分廣九寸九分畫軸御筆秋瓜一軸宣德箋本墨畫款識云乾隆壬戌新秋倣宋人筆意寫于長春書屋後有乾隆宸翰幾暇臨池二璽右方下有筆端造化一璽軸髙一尺一寸九分廣一尺五寸四分御筆烟波釣艇圖一軸宣德箋本墨畫署烟波釣艇四字款識云乾隆甲子夏𢎞德殿製下有乾隆宸翰幾暇臨池二璽左方下有潑墨一璽軸髙一尺八寸七分廣一尺三分御筆寫去鶴歸僧詩意一軸倣製金粟箋本墨畫前書寥天雙去鶴古寺一歸僧句款云養心殿偶作後有乾隆宸翰幾暇臨池二璽左方下有清心抒妙理一璽軸髙一尺六寸二分廣六寸五分御筆冬卉寫生一軸金粟箋本墨畫款識云甲子陽月養心殿寫冬卉數種以為幾暇清玩下有乾隆宸翰幾暇臨池二璽左方下有遊六藝圃一璽軸髙一尺七寸四分廣九寸三分御臨文徴明蘆汀放鴨圖一軸倣製金粟箋本墨畫款識云倣徴明筆意靜怡軒製下有乾隆宸翰一璽右方下有攜筆流雲藻一璽軸髙一尺四寸四分廣六寸六分御筆松齡眉夀圖一軸素絹本著色畫款云松齡眉夀御名謹畫下有德充符㑹心不逺二璽軸髙二尺七寸廣一尺六寸七分御筆瑞芝圖一軸素絹本著色畫右方中有御名圖書皇四子章二璽左方下有樂善堂圖書記一璽詩塘款題并序云雍正十年十月十七日敬觀景陵寶城山上所産石芝一本彩芝四本欣兹上瑞恭繪為圖并成長律二首瑤光星耀麗重霄瑞産芝英玉露調最是顯承通有赫可知陟降本於昭日暄寶頂金幢粲風拂明樓玉節飄千載嘉祥綿國祚由來虞舜繼唐堯扶輿積氣炳貞符芝蓋繽紛護鼎湖上瑞兩逢得未有靈根五本自來無光天雨露謳歌切大地恩波浩蕩濡總是覲揚同一揆庥徴草木慶昌圖孫臣御名恭紀下有御名圖書皇四子章二璽軸髙一尺七寸七分廣一尺五分書畫合軸御筆秋蘭詩畫合璧一軸金粟箋本上下凡二幅上方圓幅墨畫款署御筆二字下有筆端造化一璽下方方幅行楷書御製舊作云芽茁紫箭新葉抽青劍短著雨生意佳逗風真馥逺緑窗影遲遲篸瓶作清伴逸興吟五言遐心企九畹後識云雨窗畫蘭憶得詠蘭舊作漫書以寄餘興下有乾隆御筆摛藻為春二璽書幅髙八寸三分廣同畫幅髙九寸廣九寸二分石渠寶笈卷二十
