body:
  text: 貯御書房九列朝人書畫合卷上等晉顧凱之畫女史針並書晉顧凱之洛神圖宋蘇軾畫古柏圖張即之書畫松詩宋馬和之畫齊風圖宋髙宗書小雅六篇馬和之繪圖宋高宗書小雅六章馬和之繪圖宋高宗書女孝經馬和之補圖元周朗畫杜秋圖元趙原初蘭亭圖元王冕畫梅趙奕書梅花詩明沈周落花圖並詩明唐寅夜飲圖並書歌明文徴明雪山圖並書明王榖祥摹趙孟堅水仙明董其昌畫晝錦堂圖並書記書畫合卷次等唐閻立夲畫十八學士圖于志寧書贊宋李公麟九歌圖米芾書詞宋劉松年樂志論圖明宋克書陶潛詩並畫竹石小景明仇英蘭亭修禊圖明文徴明溪山高逸圖明文徴明西苑圖並詩明文徴明畫後赤壁賦圖明文徴明陸治書畫合璧明董其昌書畫合璧明董其昌書畫合璧
