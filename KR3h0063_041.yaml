front:
  text: 欽定四庫全書石渠寶笈卷十九
  hash: sha256:72e60e9ed6e22546d2bb2469a308fbaf32916c2663a787d0a9332e846f00151d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3h0063_WYG_041-1a, image: WYG0824/WYG0824-0544a.png}
body:
  text: 貯三希堂列朝人書冊上等晉王羲之快雪時晴帖一册上等册中應載欵識題跋俱見乾清宫石渠寳笈卷之一册前邊幅有快雪時晴帖晉右將軍㑹稽内史王羲之真蹟標籖前副頁御題神乎技矣四大字前有三希堂内府圖書二璽後有乾隆二璽次頁御題云丁甲呵持信有之墨池終古法書垂試思走筆明窻際應是吟成桞絮時數來二十八驪珠翥鳯翩鸞有是乎笑我凍蠅參未破從今擬欲廢操觚阿大中郎未足多東山絲管久消磨何如内史風流筆占盡千秋聽講鵞錦囊樂毅久成煙老子西昇只廓填獨有山隂雙逸士尚携海水歴桑田賺得蘭亭蕭翼能無過玉匣伴昭陵賸留快雪公天下一胍而今見古朋乾隆丙寅春正摹是帖一過得句五章用題册首前有雲霞思一璽後有天根月窟乾隆御筆二璽三頁御書雪詩云蘇辭遭遇多枝葉倒綳禁題先犯雪起舞浮白意匠殊縱横驅用堪叫絶元冥恰喜交初節過水真如遇方折平原羃䍥寒颸逼長空晻靄暮光滅旌門鐃吹雲璈奏幔城漏響金魚掣徘徊中夜聽拉瑟行檠熻赩蓮花纈天窻取氣揭薄紗地爐生火燃枯屑遥想林岫已婆娑却愛郊坰正飄瞥即景朅詠都官句占年夙記農家說醉翁髯老垂號令㑹取陳言能㸃鐵前有清玩一璽後有乾隆御賞一璽又御書雪詩云同雲一色難分葉禁體苦吟雪非雪背觸如參竹蔑子歐令蘇傳兩竒絶蝗深可卜田火除心喜應敎屐齒折况復督亢舊膏腴恰似藍田未淹滅梁王已命兔園宴杜老那擅鯨魚掣慿輿攬結吟興飛拈鬚何慮氷花纈十餘字耳乃區區不因歩韻宜避屑却憶澄海禁水部癸亥冬澄海樓與張照梁詩正聫句凡字涉水部者概不許用倡和豪情嵓電瞥試看滕六御風行彼則有言可無說獨憐呵凍賡吟者毳衣布帳寒如鐵藝圃曽聞輕楮葉營邱夙擅能圖雪設如白戰遇歐蘇錯手無從堪笑絶昨從清苑返行旌范陽古道循曲折雲羃朔天漸低黯煙凍僧寮乍昇滅吟詩未覺冰硏寒行圍却喜饑鷹掣簁簁著體化如幻綏綏壓帽緐于纈從來此景我所躭興豪擬問誰遺屑却慙未透即離禪還應為譜風花瞥耳聽目眎本一例約畧林嵐為指說畫成傳示同事看命董邦達圖是景邦達是次未扈駕故詩以告之重教宵寐衾鋪鐵下有澄觀一璽又御書雪詩云拈出天花示迦葉一笑至今鬚鬢雪昨吟禁體效歐蘇沓拖風流殊未絶冀北方欣麥鍼緑江南應報梅腰折望中峯勢忽如迷旋教萬徑人踪滅收餘活火煑三清茶名颼飂古鼎松風掣亂侵屐齒乍凹凸細灑簾旌仍委纈詩翁競勝巧形容島瘦郊寒全不屑清歡渴望兩相爭此景年來曽幾瞥朱鳥温暾綿襖披三希佳事還堪說明窻凈几展時晴古法平沙劃錐鐵定興道中雪用東坡聚星堂體并元韻四首丙寅長至後三日御筆下有比徳朗潤幾暇怡情三璽又御繪踈林亭子識云乾隆丙寅新正幾暇因觀羲之快雪時晴帖愛此側理輒寫雲林大意下有乾隆宸翰一璽後副頁御跋云琳瑯球璧世間所有若此帖乃希世珍耳下有乾隆宸翰幾暇臨池二璽又御跋云右軍此帖跋語俱佳紙亦清瑩可玩朕題識數番喜其與筆墨相和愛不釋手得意輒書無拘次第也乾隆偶識下有乾隆御賞幾暇怡情二璽前有清玩一璽又御書龍跳天門虎卧鳯閣八字上鈐乾隆聫璽又御書詩云放勲命羲和定時以閏月今嵗閏在春二月不妨雪密雲連宵旦庭樹緑隂歇時而散氷花時而灑瓊屑但覺春融盎不苦寒栗冽縱賞意固佳倚吟情堪結被井乳欲酥壓梅腰豈折分茶潄芳潤展帖挹清絶破臈懸望餘素景慰心别已疾氣昭蘇宜麥月單閼白詩遣幾暇事同異其說堪方雨有靈漫比霜不殺孫賦亦熟讀詎厭聞妖孽農語有明徴未至清明節春雪和白居易韻偶展右軍帖遂書册上乾隆御識引首有席上珍一璽下有得佳趣内府珍秘二璽又御書詩云誓墓髙風有足多獨推書聖却云何行雲流水參神韻筆陣傳來秪白鵞近題錢選觀鵞圖之作春日齋居清暇展閱此帖輒復書之下有乾隆御賞幾暇怡情二璽前有清玩天府珍藏二璽又御繪觀鵞圖并識云左幅繭紙光潤可愛即效霅溪體補空仲春下浣之二日長春書屋御識并書後有乾隆宸翰硏露筆端造化三璽又御識云丙寅仲冬雪後過淑清苑讀舊作積素墜枝全作雨之句歸展此帖欣然有㑹命筆書之下有乾隆宸翰一璽又御識云丁卯嘉平之望幾暇重展是卷適天際同雲密布瑞葉頻飄對景揮毫不覺為之一快用書册尾以志欣幸下有徳充符幾暇怡情二璽又御跋云王右軍快雪帖為千古妙蹟収入大内養心殿有年矣予幾暇臨仿不止數十百過而愛玩未已因合子敬中秋元琳伯逺二帖貯之温室中顔曰三希堂以志希世神物非尋常什襲可竝云丙寅春二月上澣御筆又識引首有三希堂一璽下有乾隆二璽册尾臣梁詩正等跋云晉右將軍書龍跳虎卧歴代寶傳趙孟頫蘭亭跋云昔人得古刻數行專心學之便可名世此快雪帖二十八字迄今數千百年楮墨猶新神采耀發豈鎸拓鈎摹所可比擬臣等奉勅編纂石渠寶笈獲見内府所藏右軍墨翰斯為第一我皇上好古敏求萬幾之暇精硏八法是帖心摹手追不下數十百本而聖懐虚受猶臨池未輟也丙寅春正清宴是娯復臨兹帖御製七言斷句五章題于册首因副頁宋牋古潤可愛更濡筆作雲林小景傳示臣等伏惟右軍書為千古藝林神品得逢稽古右文之主黙契薪傳鑑賞珍重金壺墨汁親灑簡端睿藻古香輝聫璧合臣等敬觀之餘曷勝慶幸因石渠寶笈成於乙丑之秋是以御筆詩畫未及恭載云臣梁詩正臣汪由敦臣勵宗萬臣張若靄臣裘曰修臣陳邦彦臣董邦逹敬跋臣梁詩正敬書末幅張若靄繪梅花一枝自記云羲之快雪時晴帖美擅千古皇上幾餘臨寫形諸詠歌又以册前側理古潔可愛御製踈林亭子於上臣靄再承命繪梅花一枝於末幅右軍書法天然出塵較鄧尉曉風羅浮夜月古香絶態殆欲過之愧臣拙筆不能傳神萬一耳乾隆丙寅春月臣張若靄拜手敬識幅中御筆書妙字書卷上等晉王獻之中秋帖一卷上等卷中應載欵識題跋俱見御書房石渠寶笈卷之三前隔水御跋云大内藏大令墨蹟多屬唐人鈎填惟是卷真蹟二十二字神采如新洵希世寶也向貯御書房今貯三希堂中乾隆丙寅二月御識下有乾隆二璽後隔水御書神韻獨超天姿特秀張懷瓘書估十三字下有乾隆宸翰一璽又御繪墨梅一枝欵署三希堂製下有乾隆御賞幾暇怡情二璽拖尾御書擬中秋帖子詞有序金祇行政素昊司時蟬噪風秋臺上律披閶闔鵲飛月曙樓前鏡對嬋娟於時有象西成倉箱叶萬千之盛無邊佳景團圞正三五之宵露滿芝盤鳷鵲髙而玉繩低影氣澄蘭戺鴛鴦敞而丹桂飄香不須弦管吹開所喜篇章遞進宜春綵帖體反蘇家儤直金鑾詞懷韓氏爰成四什各賦七言風月今宵非等閒等閒風月總須删南極六星臨北闕西華一鏡掛東山底縁覺得好秋光桂影婆娑華黍香試想昨年蟾窟景一秋毫分不曽匡閭閻節物騐嘉師圓餅雕𤓰入好詩太液秋風瀲金縠不須重拓影娥池璇霄珠露五雲樓可識春光也讓秋試創玉堂新事例擘牋催進月詞頭乾隆丙寅八月擬成此詞既命内廷詞臣屬和適橅大令中秋帖因録于卷後際此良時實獲心賞竝誌之以紀幾餘雅興三希堂御筆後有惟精惟一乾隆宸翰攜筆流雲藻三璽又卷尾勅丁觀鵬繪圖觀鵬記云乾隆丙寅春蒙賜觀王獻之中秋帖真蹟令臣觀鵬繪圖卷尾秋色平分梧梢月上臣輒擬議此景伏惟前賢墨妙重以天題臣仰陟上清足迷雲氣翹瞻閬苑目眩星辰自媿鴉塗真成貂續臣丁觀鵬恭紀晉王珣伯逺帖一卷上等素牋本行書計四十七字前有半印後半印二俱漫漶不可識前隔水標題晉王珣伯逺帖六字後隔水有董其昌跋云晉人真蹟惟二王尚有存者然米南宫時大令已罕謂一紙可當右軍五帖况王珣書視大令不尤難覯耶既幸予得見王珣又幸珣書不盡湮没得見吾也長安所逢墨蹟此為尤物戊戌冬至日董其昌題拖尾有王肯堂跋云右晉尚書令諡獻穆王元琳書紙墨發光筆法遒逸古色照人望而知為晉人手澤經唐歴宋人主崇尚翰墨收括民間珍秘歸於天府不知其幾矣而尚有遺逸如此卷者即賞鑒家如老米輩亦未之見吾於此有深感焉元琳書名當時頗為弟珉所掩故為之語曰法䕶非不佳僧彌難為兄法䕶珣小字僧彌珉小字也此帖之逸頗為近世王穉登山人濫觴其劣於乃弟得無謂是乙巳冬十二月至新安呉興宇中秘出示留賞信宿書以歸之延陵王肯堂卷髙七寸九分廣五寸三分前隔水御書家學世範草聖有傳宣和書譜十二字下有乾隆宸翰幾暇臨池二璽又御識云唐人真蹟已不可多得况晉人耶内府所藏右軍快雪帖大令中秋帖皆希世之珍今又得王珣此幅繭紙家風信堪竝美幾餘清賞亦臨池一助也御識下有乾隆宸翰涵虚朗鑑二璽又御識云乾隆丙寅春月獲王珣此帖遂與快雪中秋二蹟竝藏養心殿温室中顔曰三希堂御筆又識下有乾隆二璽後隔水御繪枯枝文石并識云王珣帖與其昌跋皆可寶玩即裝池側理亦光潤堪愛漫製枯枝文石以配之乾隆丙寅春正長春書屋御識下有幾暇怡情一璽後有墨雲一璽卷尾勅董邦逹繪圖邦逹記云上既以王氏三帖貯三希堂詔臣逹繪為圖又以此伯逺一札卷尾餘紙命補其空臣謹按札中有志在優游及逺隔嶺嶠語輒彷彿情景作林下蕭散之致竊念希世竒珍屢得附名其後簪筆之榮實深蹈抃臣董邦逹稽首敬記又沈徳潛三希堂歌江左風流數王氏司徒以後多聞人羲獻父子樹清節法䕶文學超常倫勲名一家著史册翰墨百代流精神快雪時晴洵書聖中秋姿媚中藏筋伯逺一帖推後勁遒逸自足追前塵東晉至今十六代離合聚散同煙雲太清樓空幾冺滅寶晉齋廢疑沈淪至寶閱世永不壞鬼神呵䕶留乾坤從來法物聚所好歸之秘府紛羅陳聖皇勤政得清暇披玩卷軸時討論一字品題物逾重圖球竝作天家珍三希名堂世希有何啻采鳯兼白麟吾皇寄意别有在字同義異窮聖真寓意於物匪留意頤神養性常欣欣遊心理窟無止步濓溪易通曽有云惟士希賢賢希聖聖人希天直欲探天根萬里雖逺終可到立志恢廓無涯垠士人黽勉臻上逹而况上聖徳性通髙旻法書珍重祗簡翰游心六藝縁依仁小臣拜手敬瞻玩摩挱那敢指掌捫晉人筆墨貴鳯髓睿藻箴朂揚龍文承命作歌識卷末疑有寶光騰起爛爛輝星辰乾隆丙寅春三月臣沈徳潛奉勅敬題引首有御書江左風華四大字上有乾隆御筆一璽御筆題籖籖上有御賞一璽石渠寶笈卷十九
