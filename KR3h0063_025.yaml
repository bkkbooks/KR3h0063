body:
  text: 貯養心殿二列朝人書冊次等唐孫䖍禮書孝經一册次等天一宋箋烏絲闌本草書未署款姓氏見跋中後餘幅有祝允明董其昌陳繼儒王一翥許纘楊彦洸鄭如薫諸跋冊計二十七幅宋蔡蘇黄米四家書一册次等地一宋牋本第一幅第二幅俱蔡襄尺牘第三幅第四幅第五幅俱蘇軾尺牘第六幅黄庭堅詩帖無款第七幅米芾尺牘第八幅米芾詩帖俱行草書宋黄庭堅書王羲之論書一册次等元一素牋本行楷書款識云元祐元年冬日庭堅書後副頁有史爾鉉李春芳跋二又王涯記語一冊計三十一幅宋黄庭堅書興慶池侍宴詩一冊次等元二素牋本行楷書款識云右唐人李義府興慶池侍宴應制一首元祐五年過寶繪堂書山谷庭堅後副頁有鮮于樞呉寛張弼三跋又文嘉記語一册計十五幅元趙孟頫書孝經一冊次等黄一磁青牋本泥金行楷書并錄原序款識云孝為民生之本故吾夫子有此經特以質性不齊習染有異雖知此經為聖人之作而不知用心者或多徳俊有意于淑後人乃特過余松雪齋求泥金書之使之知所重省厥心而勵厥行也但愧余書雖美未可以稱聖經耳至治元年十一月十六日呉興趙孟頫再拜志册計四十一幅元趙孟頫書孝經一册次等黄二墨牋金絲闌本泥金行楷書并録原序款識云孝為民生之本故吾夫子有此經特以質性不齊習染有異雖知此經為聖人之作而不知用心者或多義卿有意於淑後人乃特過余松雪齋求泥金書之使之知所重省厥心而勵厥行也但愧余書雖美未可以稱聖經耳至大二年正月十六日呉興趙孟頫再拜志後副頁有朱孟淵髙巽志記語二文徴明董其昌跋二冊計四十一幅按前冊與此款識俱同特名稱年號小異蓋臨本也元趙孟頫尺牘詩翰一冊次等黄三素牋本行草書凡十三幅第一幅至第八幅俱尺牘第九幅第十幅書七言絶句第十一幅至第十三幅書七言律詩元趙孟頫書雪賦一册次等黄四素絹烏絲闌本行楷書款識云大徳四年七月晦日子昻書於松雪齋後有張孝思笪重光記語二冊計十六幅元趙孟頫書蘇軾稼説一册次等黄五素絹本行書款署子昻册計二十幅元趙孟頫書鏡智禪師銘一册次等黄六素絹本楷書款識云至元後庚辰嵗杪欽心書于夀丘山龍華㑹上未署名下有趙氏子昻松雪齋印二後副頁有趙肅跋一册計二十幅元趙孟頫尺牘一冊次等黄七素牋本行書款云孟頫頓首册計三幅明文徴明自書詩帖一冊次等宇一素牋本行草書七言古詩一首款識云嘉靖乙未九月廿三日前翰林院待詔將仕佐郎兼修國史長洲文徴明書册計二十四幅明文彭書千文一冊次等宙一素牋烏絲闌本楷書款識云嘉靖丙寅三月庚子書病目未明殊不成字覽者幸亮之文彭時年七十冊計十三幅明王寵摹東方朔像贊一册次等洪一素牋本楷書款識云嘉靖丁亥二月二十七日雅宜山人王寵摹册計六幅明劉麟詩翰一册次等荒一印花箋本凡二則行草書前書七言古體詩一首款云半溪仙翁伏虎壇下麟頓首後手扎一則款云眷生劉麟白後副頁有尹鋙跋一册計六幅明王問詩帖一册次等日一素牋本草書七言古詩一首款識云嘉靖丁巳石川翁夀七十余既為圖贈之含真體道竊與同志賦此書之上方云仲山王問後副頁有文震亨跋一册計十一頁明許初竹岡阡表一冊次等月一宣徳箋烏絲闌本楷書款識云嘉靖壬子夏六月廿有四日為董子子元甫書於三讓里之桑土齋吳郡許初首幅前署篆書竹岡阡表四字冊計九頁明丘坦書陳情表一冊次等盈一素絹本行書大字款識云右李密陳情表也萬厯丙辰之秋日書於九連城鳯凰山中楚麻城丘坦拜手謹識冊計四十五幅明董其昌臨爭坐位帖一冊次等昃一粉箋烏絲闌本款識云新都汪孺仲以爭坐位帖見示神采奕奕字形較陜刻差肥乃知是米海岳所臨米嘗有臨爭坐帖在浙中此殆其真蹟入石者耶董其昌臨冊計十七幅明董其昌臨聖教序一册次等昃二朝鮮牋烏絲闌本款識云庚申修禊前一日其昌識冊計二十六幅明董其昌書座右銘一冊次等昃三朝鮮鏡光牋本行書款云崔子玉座右銘董其昌書册計十四幅明董其昌書宋詞三首一册次等昃四朝鮮牋本行書款識云學李北海書五十五年矣初時專習頗為近之自見米老運筆多有詆呵輒復忘其舊學然時一擬書亦不落呉興後也其昌冊計八頁明董其昌書天馬賦一冊次等昃五朝鮮鏡光牋本臨米芾款識云米元章好書天馬賦賦亦沓拖少韻獨以書傳余所見三本時復書之即用米法然非以禊帖用筆之意為之終不得似也生甫好余書余㳺武林數以此册囑書米賦蕭寺酬應之煩未有以副歸山居方復修諾時己巳三月望其昌册計七頁明董其昌雜書一冊次等昃六宣徳牋烏絲闌本凡十七幅第一幅至第七幅臨顔真卿多寳塔碑款署其昌第八幅至第十二幅行書小赤壁詩款署其昌第十三幅至第十七幅楷書前後赤壁詞款識云丁夘子月舟行錫山道中書其昌明陳元素牋牘一冊次等辰一凡三十六幅第七幅碧色牋本餘俱素牋本行楷各體書明人牋牘一冊次等宿一素牋本尺牘十二則第一則陳鎏第二則顧憲成第三則名署昌字第五則未署名第六則陸士仁第七則朱曰藩第九則劉黄裳第十則黄姬水第十一則石淮第十二則姚希孟第四則第八則署名不可識冊計二十二幅明王元懋節書世説新語一冊次等列一素箋烏絲闌本楷書款識云崇禎辛未冬上浣讀書楞伽山房每日西駕便出歩林麓間聴山樵湖漁互賡競唱皆世外真趣聞餘鼓屐至山房亦自機息𨼆𨼆樵漁興致復不減因憶吾友叔文身混城市心則烟霞真可與道世外事亟録世説數段奉寄以當少文卧逰可即以當我兩人對麈亦可大翮山史王元懋并識冊計八頁明人便面書四冊次等張一第一册凡二十幅第二幅第三幅第八幅第十一幅第十四幅素牋本餘俱金箋本第一幅羅倫行書七言律詩一首第二幅邵寶行書七言絶句一首第三幅祝允明草書五言律詩一首第四幅第五幅俱文徴明行書七言律詩各一首第六幅文彭行書七言律詩一首第七幅凡五則第一則文彭行書第二則彭年楷書第三則王榖祥行楷書第四則黄姬水草書第五則許初楷書俱七言絶句各一首第八幅文嘉行草書七言律詩一首第九幅凡四則俱草書第一則文嘉書第二則程大倫書第三則朱希孺書皆五言律詩各一首第四則文彭草書七言絶句一首第十幅凡五則俱楷書第一則周天球第二則文彭第三則居節第四則錢榖俱五言律詩各一首第五則彭年書五言律詩二首第十一幅周天球行楷書七言律詩二首第十二幅周天球行草書七言律詩一首第十三幅周天球行草書五言律詩二首第十四幅凡二則俱草書前則王守書後則王寵書俱五言律詩各一首第十五幅王寵草書五言律詩一首第十六幅陳淳草書五言絶句一首第十七幅陳淳草書五言律詩一首第十八幅袁褧行草書七言律詩一首第十九幅袁尊尼行草書七言律詩一首第二十幅王問草書七言律詩一首第二冊凡二十幅第四幅第七幅第十五幅十六幅素箋本餘俱金箋本第一幅陳鎏行草書七言律詩一首第二幅茅坤行草書七言律詩一首第三幅陳爾見行草書七言律詩一首第四幅陸師道楷書詞二首第五幅彭年行楷書七言律詩一首第六幅黄姬水草書五言律詩一首第七幅王穉登草書五言律詩一首第八幅王穉登行草書七言律詩一首第九幅凡三則俱楷書七言律詩各一首第一則王穉登第二則李維楨第三則歐大任第十幅凡四則俱七言絕句一首第一則王穉登行書第二則文震孟楷書第三則薛明孟楷書第四則韓道亨行書第十一幅第十二幅俱張鳯翼行書七言律詩各一首第十三幅孫鑛行草書五言古詩一首第十四幅董汾草書七言律詩一首第十五幅項徳純行楷書五言律詩一首第十六幅陸士仁楷書五言古詩二首第十七幅俞允文楷書五言古詩二首第十八幅俞允文行書五言古詩二首第十九幅凡三則第一則俞允文行楷書五言古詩一首第二則周天球行楷書第三則許初楷書俱七言律詩各一首第二十幅湯煥草書五言律詩一首第三冊凡二十幅第十三幅素牋本餘俱金牋本第一幅許光祚草書五言律詩一首第二幅申時行草書五言律詩一首第三幅王錫爵行草書五言排律一首第四幅王錫爵行書五言古詩一首第五幅王世貞行草書七言律詩一首第六幅王世懋行草書七言律詩一首第七幅屠隆行草書七言律詩一首第八幅屠隆行草書五言律詩一首第九幅屠隆草書七言律詩一首第十幅臧懋循行楷書七言古詩一首第十一幅董嗣成行草書七言律詩一首第十二幅董嗣成行草書五言古詩一首第十三幅董嗣成行楷書五言古詩三首第十四幅董嗣成行書七言古詩一首第十五幅第十六幅俱董其昌行草書五言律詩各一首第十七幅王思任行書五言律詩一首第十八幅范允臨行楷書七言絕句五首第十九幅黄道周行楷書七言律詩一首第二十幅沈聖岐行書七言律詩一首第四冊凡十八幅第九幅第十一幅第十二幅素箋本餘俱金箋本第一幅婁堅楷書五言古詩一首第二幅呉孟暘行草書五言律詩二首第三幅呉孟暘行草書七言古詩四首第四幅呉孟暘楷書五言律詩四首第五幅呉孟暘行書七言古詩一首第六幅曹學佺草書五言律詩一首第七幅文從簡行楷書七言絕句八首第八幅鄒逸鱗行草書七言律詩一首第九幅周祖草書七言律詩一首第十幅周叔宗行草書五言律詩一首第十一幅顧杲草書五言律詩一首第十二幅凡四則書宋元詞各一闋第一則髙金聲第二則王淑民俱楷書第三則王瑋行書第四則戚廷楨行楷書第十三幅沈璟行草書七言律詩一首第十四幅皇甫百泉行草書五言律詩一首第十五幅徐愿行草書七言律詩一首第十六幅行書五言律詩一首款署如奇第十七幅蔣明鳯草書五言律詩一首第十八幅周宗予行書五言古詩一首明人書扇一冊次等寒一凡十五幅第八幅素箋本餘俱金箋本第一幅董其昌行書五言律一首第二幅董其昌行書七言絶句一首第三幅董其昌行草書五言律一首第四幅董其昌行書七言絶句一首第五幅莫如忠行書五言律一首第六幅文震孟行書詞一首第七幅王渙楷書前赤壁賦第八幅王錫爵行書七言律一首第九幅韓敬行楷書七言律二首第十幅范允臨行楷書七言律一首五言律一首第十一幅范允臨行書七言律一首第十二幅郁之章行書五言律一首第十三幅孫克𢎞行楷節録世説新語一則第十四幅陸錫明楷書五言古詩一首第十五幅倪元璐行書七言律一首五言律一首明人扇頭書一冊次等來一凡十幅第四幅素箋本餘俱金牋本第一幅呉寛行楷書七言律詩一首第二幅祝允明行楷書岳陽樓記第三幅文徴明行書七言古詩一首第四幅凡四則俱小楷書江南春詞文嘉彭年張鳯翼各一首文彭三首第五幅陸應暘草書五言律詩一首第六幅陸彦章楷書七言古詩一首第七幅王穉登行書七言絶句六首第八幅陳繼儒行書五言古詩一首第九幅楊文驄草書七言律詩一首第十幅小楷書琵琶行款署𨼆鷗汃三字無名氏書册次等宋人摹褚書一冊次等天一素箋本臨褚遂良樂毅論後副頁有張栻跋一冊計十六幅國朝人書册次等王鐸書集句一冊次等天一素牋本行草書末幅款識云舊有集唐飲酒截句四十首值櫟翁出素幅索書因憶録其八己丑冬仲王鐸書冊計八幅陳奕禧書漢唐碑